<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ============================================================
   THE CASTLE — a self-contained procedural tiny world
   All geometry, textures, animation and audio are generated in code.
   ============================================================ */

const LOOP = 24;                 // seconds, seamless
const TAU  = Math.PI * 2;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const smoothstep = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const lerp = (a,b,t)=>a+(b-a)*t;

/* ---------- deterministic value noise (no external assets) ---------- */
function hash2(x,y,s){
  let h = (Math.imul(x|0,374761393) + Math.imul(y|0,668265263) + Math.imul(s|0,1442695041))|0;
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16))>>>0) / 4294967295;
}
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y,s,oct=4){
  let sum=0, amp=0.5, f=1;
  for(let i=0;i<oct;i++){ sum+=amp*vnoise(x*f,y*f,s+i*17); f*=2; amp*=0.5; }
  return sum;
}

/* ---------- procedural texture factory ---------- */
function normalFromHeight(size, height, strength){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d'); const img=ctx.createImageData(size,size);
  const at=(x,y)=>height[((y+size)%size)*size + ((x+size)%size)];
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const dx=(at(x-1,y)-at(x+1,y))*strength;
    const dy=(at(x,y+1)-at(x,y-1))*strength;
    let nx=dx, ny=dy, nz=1;
    const l=Math.hypot(nx,ny,nz); nx/=l; ny/=l; nz/=l;
    const i=(y*size+x)*4;
    img.data[i]  =(nx*0.5+0.5)*255;
    img.data[i+1]=(ny*0.5+0.5)*255;
    img.data[i+2]=(nz*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8;
  return t;
}
function procTexture(size, fn, opts={}){
  const {srgb=true, repeat=[1,1], normalStrength=0}=opts;
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d'); const img=ctx.createImageData(size,size);
  const height=new Float32Array(size*size);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const [r,g,b,h]=fn(x/size, y/size, x, y);
    const i=(y*size+x)*4;
    img.data[i]  =clamp(r,0,1)*255;
    img.data[i+1]=clamp(g,0,1)*255;
    img.data[i+2]=clamp(b,0,1)*255;
    img.data[i+3]=255;
    height[y*size+x]=h;
  }
  ctx.putImageData(img,0,0);
  const map=new THREE.CanvasTexture(c);
  map.wrapS=map.wrapT=THREE.RepeatWrapping;
  map.repeat.set(repeat[0],repeat[1]);
  map.anisotropy=8;
  if(srgb) map.colorSpace=THREE.SRGBColorSpace;
  return { map, normalMap: normalStrength>0 ? normalFromHeight(size,height,normalStrength) : null };
}
function softCircle(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.30,'rgba(255,255,255,0.85)');
  g.addColorStop(0.65,'rgba(255,255,255,0.28)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

/* ---------- texture definitions ---------- */
function limestoneFn(u,v,x,y){
  const rows=7, cols=5;
  const ry=v*rows, row=Math.floor(ry), fy=ry-row;
  const rx=u*cols+(row%2)*0.5, fx=rx-Math.floor(rx);
  const ex=Math.min(fx,1-fx), ey=Math.min(fy,1-fy);
  const mortar=Math.max(1-smoothstep(0.018,0.048,ex), 1-smoothstep(0.030,0.072,ey));
  const blockVar=hash2(Math.floor(rx),row,7);
  const n=fbm(u*9,v*9,2,4), g=fbm(u*38,v*38,11,2);
  let base=0.60+0.16*(n-0.5)+0.07*(g-0.5)+0.07*(blockVar-0.5);
  let r=base*1.05, gg=base*0.99, b=base*0.86;
  r=lerp(r,base*0.50,mortar); gg=lerp(gg,base*0.51,mortar); b=lerp(b,base*0.50,mortar);
  const moss=Math.max(0,fbm(u*15,v*15,31,3)-0.59)*2.4;
  gg+=moss*0.17; r-=moss*0.05; b-=moss*0.09;
  const h=mortar?0.26:0.72+0.18*(n-0.5);
  return [r,gg,b,h];
}
function graniteFn(u,v,x,y){
  const n=fbm(u*6,v*6,4,4), sp=hash2(x,y,13);
  const fleck=sp>0.94?0.24:(sp<0.055?-0.16:0);
  const base=0.53+0.15*(n-0.5)+fleck;
  return [base*1.03,base*1.00,base*0.97,0.5+0.22*(n-0.5)+fleck*0.5];
}
function slateFn(u,v){
  const rows=12, cols=5;
  const ry=v*rows,row=Math.floor(ry),fy=ry-row;
  const rx=u*cols+(row%2)*0.5, fx=rx-Math.floor(rx);
  const line=1-smoothstep(0.02,0.06,Math.min(fy,1-fy,fx*0.35));
  const n=fbm(u*12,v*12,6,3);
  let base=(0.26+0.11*(n-0.5))*(1-0.34*line);
  return [base*0.85,base*0.95,base*1.16,0.62-0.30*line+0.10*(n-0.5)];
}
function woodFn(u,v){
  const grain=fbm(u*20,v*2.6,8,4);
  const rings=Math.sin((u*38+grain*6)*Math.PI)*0.5+0.5;
  const base=0.37+0.14*(grain-0.5)+0.09*(rings-0.5);
  return [base*1.12,base*0.79,base*0.50,0.5+0.26*(rings-0.5)];
}
function strawFn(u,v,x,y){
  const f=fbm(u*28,v*8,17,3);
  const lines=Math.sin(v*150+f*11)*0.5+0.5;
  const base=0.63+0.16*(f-0.5)+0.13*(lines-0.5);
  return [base*1.10,base*0.92,base*0.50,0.5+0.22*(lines-0.5)];
}
function grassFn(u,v,x,y){
  const n=fbm(u*16,v*16,23,4), f=fbm(u*60,v*60,29,2);
  const base=0.35+0.20*(n-0.5)+0.10*(f-0.5);
  return [base*0.72,base*1.06,base*0.46,0.5+0.20*(n-0.5)];
}
function soilFn(u,v,x,y){
  const n=fbm(u*10,v*10,33,4), sp=hash2(x,y,41);
  const base=0.40+0.17*(n-0.5)+(sp>0.965?0.16:0);
  return [base*1.06,base*0.82,base*0.62,0.5+0.26*(n-0.5)];
}
function cobbleFn(u,v,x,y){
  const rows=7, cols=7;
  const ry=v*rows,row=Math.floor(ry),fy=ry-row;
  const rx=u*cols+(row%2)*0.5, col=Math.floor(rx), fx=rx-col;
  const d=Math.hypot((fx-0.5)*1.0,(fy-0.5)*1.0);
  const stone=1-smoothstep(0.33,0.49,d);
  const vv=hash2(col,row,55), n=fbm(u*20,v*20,61,3);
  const stoneShade=0.56+0.08*vv+0.08*(n-0.5);
  const base=lerp(0.42,stoneShade,stone);
  return [base*1.05,base*1.01,base*0.94,stone*0.8+0.12];
}

const TEX={};
function buildTextures(){
  TEX.stone  =procTexture(256,limestoneFn,{repeat:[2,1],normalStrength:3.2});
  TEX.stone2 =procTexture(256,limestoneFn,{repeat:[1,1],normalStrength:3.2});
  TEX.granite=procTexture(256,graniteFn,{repeat:[2,2],normalStrength:2.5});
  TEX.slate  =procTexture(256,slateFn,{repeat:[3,2],normalStrength:2.8});
  TEX.wood   =procTexture(256,woodFn,{repeat:[2,1],normalStrength:2.6});
  TEX.straw  =procTexture(256,strawFn,{repeat:[2,2],normalStrength:1.8});
  TEX.grass  =procTexture(256,grassFn,{repeat:[6,6],normalStrength:2.0});
  TEX.soil   =procTexture(256,soilFn,{repeat:[3,3],normalStrength:3.0});
  TEX.cobble =procTexture(256,cobbleFn,{repeat:[5,5],normalStrength:3.4});
  TEX.soft   =softCircle();
}
function pbr(tex,opts={}){
  return new THREE.MeshStandardMaterial(Object.assign({
    map:tex.map, normalMap:tex.normalMap,
    normalScale:new THREE.Vector2(0.7,0.7),
    roughness:0.92, metalness:0.0
  },opts));
}

/* ---------- renderer / scene / camera ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.NoToneMapping;   // ACES is applied in the final pass so the white page stays #ffffff
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xffffff);

const world=new THREE.Group();      // the whole floating island bobs here
scene.add(world);

const camera=new THREE.OrthographicCamera(-10,10,10,-10,0.1,200);
const ELEV=THREE.MathUtils.degToRad(30), AZIM=THREE.MathUtils.degToRad(45);
const CDIST=60;
camera.position.set(
  Math.cos(ELEV)*Math.cos(AZIM)*CDIST,
  Math.sin(ELEV)*CDIST,
  Math.cos(ELEV)*Math.sin(AZIM)*CDIST
);
camera.lookAt(0,-0.4,0);

/* ---------- environment map (warm sky + ground) for PBR reflections ---------- */
function buildEnvironment(){
  const envScene=new THREE.Scene();
  const skyMat=new THREE.ShaderMaterial({
    side:THREE.BackSide,
    vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:`
      varying vec3 vP;
      void main(){
        vec3 d=normalize(vP);
        float h=d.y*0.5+0.5;
        vec3 ground=vec3(0.42,0.36,0.30);
        vec3 horizon=vec3(0.92,0.88,0.80);
        vec3 sky=vec3(0.62,0.72,0.90);
        vec3 col=mix(ground,horizon,smoothstep(0.30,0.50,h));
        col=mix(col,sky,smoothstep(0.50,0.92,h));
        float sun=pow(max(dot(d,normalize(vec3(0.75,0.42,0.55))),0.0),90.0);
        col+=vec3(1.0,0.78,0.50)*sun*2.5;
        gl_FragColor=vec4(col,1.0);
      }`
  });
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(60,32,20),skyMat));
  const pmrem=new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const rt=pmrem.fromScene(envScene,0.03);
  scene.environment=rt.texture;
  pmrem.dispose();
}

/* ---------- lighting ---------- */
const sun=new THREE.DirectionalLight(0xffd6a0,2.3);
sun.position.set(18,16,11);
sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536);
sun.shadow.camera.left=-14; sun.shadow.camera.right=14;
sun.shadow.camera.top=14; sun.shadow.camera.bottom=-14;
sun.shadow.camera.near=0.5; sun.shadow.camera.far=70;
sun.shadow.bias=-0.0004;
sun.shadow.normalBias=0.025;
sun.shadow.radius=3;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe0ff,0x6b5540,0.85));
scene.add(new THREE.AmbientLight(0xffffff,0.08));

/* ---------- shared materials ---------- */
buildTextures();
buildEnvironment();
const MAT={
  grass: pbr(TEX.grass,{color:0xffffff,roughness:1.0}),
  soil:  pbr(TEX.soil,{color:0xffffff,roughness:1.0,vertexColors:false}),
  stone: pbr(TEX.stone,{color:0xf2ede3,roughness:0.95}),
  stoneDark: pbr(TEX.stone2,{color:0xcfc6b6,roughness:0.98}),
  granite: pbr(TEX.granite,{color:0xe7e3dc,roughness:0.9}),
  slate: pbr(TEX.slate,{color:0xffffff,roughness:0.78}),
  wood: pbr(TEX.wood,{color:0xffffff,roughness:0.88}),
  darkWood: pbr(TEX.wood,{color:0x7a5a38,roughness:0.9}),
  straw: pbr(TEX.straw,{color:0xffffff,roughness:1.0}),
  cobble: pbr(TEX.cobble,{color:0xffffff,roughness:0.95}),
  iron: new THREE.MeshStandardMaterial({color:0x5a5148,roughness:0.62,metalness:0.78}),
  rust: new THREE.MeshStandardMaterial({color:0x8a5636,roughness:0.86,metalness:0.35}),
  root: new THREE.MeshStandardMaterial({color:0x4e3a26,roughness:1.0}),
  waterBed: new THREE.MeshStandardMaterial({color:0x2f3228,roughness:1.0}),
};
const CLOTH={
  red:new THREE.MeshStandardMaterial({color:0x8e2f2a,roughness:0.95,side:THREE.DoubleSide}),
  blue:new THREE.MeshStandardMaterial({color:0x274a72,roughness:0.95,side:THREE.DoubleSide}),
  green:new THREE.MeshStandardMaterial({color:0x3c6042,roughness:0.95,side:THREE.DoubleSide}),
};

/* ---------- tiny geometry helpers ---------- */
function box(w,h,d,mat,x,y,z,parent=world,cast=true,recv=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=recv; parent.add(m); return m;
}
function cyl(rt,rb,h,seg,mat,x,y,z,parent=world,cast=true,recv=true){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=recv; parent.add(m); return m;
}
function cone(r,h,seg,mat,x,y,z,parent=world){
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function sphere(r,mat,x,y,z,parent=world,seg=12){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,Math.max(8,seg>>1)),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function contactShadow(r,opacity,parent,x,z,y=0.012){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(r,r),
    new THREE.MeshBasicMaterial({map:TEX.soft,color:0x2b2418,transparent:true,
      opacity:opacity,depthWrite:false,blending:THREE.NormalBlending}));
  m.rotation.x=-Math.PI/2; m.position.set(x,y,z); parent.add(m); return m;
}

/* ============================================================
   THE FLOATING ISLAND
   ============================================================ */
const ISLAND_R=11.2;
function islandOutline(n){
  const pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*TAU;
    const r=ISLAND_R*(1 + 0.085*Math.sin(3*a+0.6) + 0.055*Math.sin(5*a+2.1)
      + 0.038*Math.sin(7*a+0.3) + 0.03*Math.sin(11*a+1.4));
    pts.push([Math.cos(a)*r, Math.sin(a)*r]);
  }
  return pts;
}
function buildIsland(){
  const OUT=islandOutline(72);
  const rings=[];
  // top rings (grass)
  rings.push({f:0.0, y:0.02, col:[0.14,0.21,0.08], rough:0.9});
  rings.push({f:0.55,y:0.02, col:[0.16,0.23,0.09], rough:0.9});
  rings.push({f:0.92,y:0.01, col:[0.15,0.21,0.085], rough:0.9});
  rings.push({f:1.0, y:-0.02,col:[0.11,0.15,0.06], rough:0.9}); // grassy lip
  // soil cross-section tapering to a point
  rings.push({f:0.995,y:-0.35,col:[0.12,0.075,0.04],rough:0.45}); // dark topsoil
  rings.push({f:0.94, y:-1.05,col:[0.30,0.20,0.11],rough:0.55}); // lighter subsoil
  rings.push({f:0.86, y:-1.85,col:[0.32,0.22,0.12],rough:0.6 });
  rings.push({f:0.75, y:-2.45,col:[0.25,0.26,0.26],rough:0.35}); // grey clay band
  rings.push({f:0.60, y:-3.05,col:[0.26,0.26,0.25],rough:0.35});
  rings.push({f:0.42, y:-3.85,col:[0.15,0.12,0.09],rough:0.6 });
  rings.push({f:0.24, y:-4.65,col:[0.13,0.11,0.085],rough:0.7 });
  rings.push({f:0.09, y:-5.35,col:[0.11,0.095,0.075],rough:0.8 });
  rings.push({f:0.0,  y:-5.75,col:[0.10,0.085,0.07],rough:0.8 });

  const N=OUT.length, R=rings.length;
  const pos=[], col=[], uv=[], idx=[];
  for(let r=0;r<R;r++){
    const ring=rings[r];
    for(let i=0;i<N;i++){
      const [ox,oz]=OUT[i];
      const jag=(r>3? (fbm(i*0.22,r*0.7,91,3)-0.5)*0.55*ring.f : 0);
      const f=Math.max(0,ring.f+jag);
      const yy=ring.y+(r>3?(hash2(i,r,77)-0.5)*0.20:0);
      pos.push(ox*f, yy, oz*f);
      const n=fbm(i*0.12,r*0.5,44,3);
      const shade=0.86+0.28*n;
      col.push(clamp(ring.col[0]*shade,0,1),clamp(ring.col[1]*shade,0,1),clamp(ring.col[2]*shade,0,1));
      uv.push(i/N*4, r/R*3);
    }
  }
  const pushQuads=(r0,r1)=>{
    for(let i=0;i<N;i++){
      const a=r0*N+i, b=r0*N+(i+1)%N, c=r1*N+i, d=r1*N+(i+1)%N;
      idx.push(a,c,b, b,c,d);
    }
  };
  for(let r=0;r<3;r++) pushQuads(r,r+1);       // grassy top surface
  const topCount=idx.length;
  for(let r=3;r<R-1;r++) pushQuads(r,r+1);     // torn soil cross-section

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx); geo.computeVertexNormals();
  geo.addGroup(0,topCount,0);
  geo.addGroup(topCount,idx.length-topCount,1);
  const grassMat=new THREE.MeshStandardMaterial({
    map:TEX.grass.map, normalMap:TEX.grass.normalMap,
    normalScale:new THREE.Vector2(0.5,0.5), color:0xcad6ae, roughness:1.0
  });
  const soilMat=new THREE.MeshStandardMaterial({
    normalMap:TEX.soil.normalMap, normalScale:new THREE.Vector2(0.45,0.45),
    color:0x9a8874, vertexColors:true, roughness:1.0, metalness:0.0
  });
  const island=new THREE.Mesh(geo,[grassMat,soilMat]);
  island.castShadow=true; island.receiveShadow=true;
  world.add(island);

  // grass tufts (instanced)
  const bladeGeo=new THREE.ConeGeometry(0.055,0.34,3);
  bladeGeo.translate(0,0.17,0);
  const tuftMat=new THREE.MeshStandardMaterial({color:0x5c7d33,roughness:1.0,side:THREE.DoubleSide});
  const COUNT=1100;
  const tufts=new THREE.InstancedMesh(bladeGeo,tuftMat,COUNT);
  const dummy=new THREE.Object3D();
  let placed=0, guard=0;
  while(placed<COUNT && guard++<COUNT*8){
    const a=hash2(placed,3,101)*TAU;
    const rr=Math.sqrt(hash2(placed,7,103))*ISLAND_R*0.97;
    const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    // keep the courtyard footprint clear
    if(Math.abs(x)<6.9 && Math.abs(z)<5.9) continue;
    dummy.position.set(x,0.0,z);
    const s=0.6+hash2(placed,11,107)*0.9;
    dummy.scale.set(s,s*(0.8+hash2(placed,13,109)*0.6),s);
    dummy.rotation.set((hash2(placed,17,113)-0.5)*0.35,hash2(placed,19,127)*TAU,(hash2(placed,23,131)-0.5)*0.35);
    dummy.updateMatrix(); tufts.setMatrixAt(placed,dummy.matrix);
    placed++;
  }
  tufts.count=placed;
  tufts.castShadow=false; tufts.receiveShadow=true;
  world.add(tufts);

  // embedded pebbles in the soil sides
  const pebGeo=new THREE.IcosahedronGeometry(1,0);
  const pebbles=new THREE.InstancedMesh(pebGeo,MAT.granite,54);
  for(let i=0;i<54;i++){
    const a=hash2(i,31,151)*TAU, f=0.55+hash2(i,37,157)*0.4;
    const y=-0.5-hash2(i,41,163)*3.4;
    const ff=f*ISLAND_R*(1-(-y)/7.4);
    dummy.position.set(Math.cos(a)*ff,y,Math.sin(a)*ff);
    const s=0.07+hash2(i,43,167)*0.18;
    dummy.scale.set(s,s*(0.7+hash2(i,47,173)*0.6),s);
    dummy.rotation.set(hash2(i,53,179)*TAU,hash2(i,59,181)*TAU,hash2(i,61,191)*TAU);
    dummy.updateMatrix(); pebbles.setMatrixAt(i,dummy.matrix);
  }
  pebbles.castShadow=true; pebbles.receiveShadow=true; world.add(pebbles);

  // roots / root tendrils hanging from the sides
  for(let i=0;i<16;i++){
    const a=hash2(i,71,211)*TAU, rr=ISLAND_R*(0.82+hash2(i,73,223)*0.15);
    const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    const len=0.5+hash2(i,79,227)*1.5;
    const pts=[];
    for(let k=0;k<=5;k++){
      const t=k/5;
      pts.push(new THREE.Vector3(
        x+Math.sin(t*5+i)*0.12*t,
        -0.15-len*t,
        z+Math.cos(t*4+i*1.3)*0.12*t
      ));
    }
    const curve=new THREE.CatmullRomCurve3(pts);
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,12,0.026+hash2(i,83,229)*0.02,5,false),MAT.root);
    tube.castShadow=true; world.add(tube);
  }
  // dangling clumps
  for(let i=0;i<9;i++){
    const a=hash2(i,89,233)*TAU, rr=ISLAND_R*(0.25+hash2(i,97,239)*0.35);
    sphere(0.16+hash2(i,101,241)*0.22,MAT.soil,
      Math.cos(a)*rr, -4.6-hash2(i,103,251)*0.8, Math.sin(a)*rr, world,7);
  }
}

const PX=6.2, PZ=5.2, WB=0.40, WT=3.10, TH=0.70;

const ACTORS=[];

const MERLONS=[];
function merlons(x1,z1,x2,z2,y,thick,mat){
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
  const n=Math.max(2,Math.round(len/0.82));
  const ang=-Math.atan2(dz,dx);
  for(let i=0;i<=n;i++){
    const t=i/n;
    MERLONS.push({x:lerp(x1,x2,t),y:y+0.29,z:lerp(z1,z2,t),ang,thick});
  }
}
function flushMerlons(){
  const im=new THREE.InstancedMesh(new THREE.BoxGeometry(0.40,0.58,1),MAT.stone,MERLONS.length);
  const d=new THREE.Object3D();
  for(let i=0;i<MERLONS.length;i++){
    const m=MERLONS[i];
    d.position.set(m.x,m.y,m.z); d.rotation.set(0,m.ang,0); d.scale.set(1,1,m.thick);
    d.updateMatrix(); im.setMatrixAt(i,d.matrix);
  }
  im.castShadow=true; im.receiveShadow=true; world.add(im);
}
function wall(x1,z1,x2,z2,mat=MAT.stone){
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
  const ang=-Math.atan2(dz,dx);
  const h=WT-WB;
  const w=box(len,h,TH,mat,(x1+x2)/2,WB+h/2,(z1+z2)/2);
  w.rotation.y=ang;
  const walk=box(len+0.3,0.22,TH+0.34,MAT.stoneDark,(x1+x2)/2,WT+0.11,(z1+z2)/2);
  walk.rotation.y=ang;
  merlons(x1,z1,x2,z2,WT+0.22,TH+0.20,MAT.stone);
}
function arrowSlit(x,y,z,rot){
  const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=rot;
  box(0.13,0.72,0.06,VOID,0,0,0,g,false,false);
  box(0.30,0.10,0.10,MAT.stoneDark,0,0.40,0.01,g);
  box(0.30,0.10,0.10,MAT.stoneDark,0,-0.40,0.01,g);

}
function makeWater(w,d,x,z){
  const geo=new THREE.PlaneGeometry(w,d,1,1);
  const mat=new THREE.ShaderMaterial({
    transparent:true, side:THREE.DoubleSide,
    uniforms:{ uPhase:{value:0}, uSun:{value:new THREE.Vector3(18,16,11).normalize()} },
    vertexShader:`varying vec2 vUv; varying vec3 vWorld;
      void main(){ vUv=uv; vec4 wp=modelMatrix*vec4(position,1.0); vWorld=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`
      varying vec2 vUv; varying vec3 vWorld;
      uniform float uPhase; uniform vec3 uSun;
      void main(){
        float a=sin(vUv.x*26.0+uPhase*3.0);
        float b=sin(vUv.y*31.0-uPhase*2.0);
        float c=sin((vUv.x+vUv.y)*19.0+uPhase*5.0);
        float dx=cos(vUv.x*26.0+uPhase*3.0)*26.0*0.5 + cos((vUv.x+vUv.y)*19.0+uPhase*5.0)*19.0*0.25;
        float dy=cos(vUv.y*31.0-uPhase*2.0)*31.0*0.35 + cos((vUv.x+vUv.y)*19.0+uPhase*5.0)*19.0*0.25;
        vec3 N=normalize(vec3(-dx*0.018,1.0,-dy*0.018));
        vec3 V=normalize(cameraPosition-vWorld);
        vec3 R=reflect(-V,N);
        float ry=clamp(R.y*0.5+0.5,0.0,1.0);
        vec3 sky=mix(vec3(0.16,0.27,0.30),vec3(0.42,0.58,0.72),smoothstep(0.20,0.85,ry));
        float spec=pow(max(dot(R,normalize(uSun)),0.0),60.0);
        vec3 col=sky+vec3(1.0,0.80,0.55)*spec*1.1;
        col*=0.94+0.08*(a+b+c+3.0)/6.0;
        gl_FragColor=vec4(col,0.95);
      }`
  });
  const m=new THREE.Mesh(geo,mat);
  m.rotation.x=-Math.PI/2; m.position.set(x,0.045,z);
  m.receiveShadow=false; world.add(m);
  WATERS.push(mat);
  return m;
}

function buildCastle(){

  wall( PX,-PZ, PX, PZ);              // east
  wall(-PX,-PZ,-PX, PZ);              // west
  arrowSlit(-3.6,2.0,-PZ-TH/2-0.02,0);

  hole.quadraticCurveTo(0.70,2.45,0.72,1.68);

  const gateGeo=new THREE.ExtrudeGeometry(shape,{depth:1.0,bevelEnabled:false,curveSegments:16});
  const gate=new THREE.Mesh(gateGeo,MAT.stone);
  gate.position.set(0,WB,4.72); gate.castShadow=true; gate.receiveShadow=true;

  // gatehouse upper battlements

  cyl(0.72,0.78,4.6,16,MAT.stone, 1.62,WB+2.3,5.18);
  cone(0.92,1.6,16,MAT.slate,-1.62,WB+5.4,5.18);
  cone(0.92,1.6,16,MAT.slate, 1.62,WB+5.4,5.18);

  // raised portcullis (iron grid, rusted)
  const port=new THREE.Group(); port.position.set(0,WB+2.95,5.22); world.add(port);
  for(let i=-3;i<=3;i++){
    const bar=box(0.055,0.92,0.055,MAT.rust,i*0.20,0,0,port);

  }

  // timber drawbridge over the moat
  const bridge=new THREE.Group(); bridge.position.set(0,0.47,5.72); bridge.rotation.x=-0.035;
  world.add(bridge);
  for(let i=0;i<10;i++){
    box(2.16,0.11,0.28,MAT.darkWood,0,0,0.16+i*0.29,bridge);
  }
  for(const sx of [-0.98,0.98]) box(0.09,0.14,2.95,MAT.iron,sx,-0.02,1.45,bridge);
  for(const sx of [-0.85,0.85]){
    const c=cyl(0.022,0.022,4.0,6,MAT.iron, sx,0.0,0,world);
    c.position.set(sx,2.1,7.15); c.rotation.x=Math.atan2(2.0,1.9);
  }

  // moat: recessed bed, banks and rippling water
  box(13.8,0.10,1.5,MAT.waterBed,0,-0.09,6.35,world,false,true);

  // ---- great keep (north-west) ----
  const KX=-4.0,KZ=-3.0, KW=3.5, KH=6.5;
  box(KW,KH,KW,MAT.stone,KX,WB+KH/2,KZ);
  box(KW+0.35,0.30,KW+0.35,MAT.stoneDark,KX,WB+KH+0.15,KZ);

  merlons(KX+KW/2,KZ-KW/2,KX+KW/2,KZ+KW/2,WB+KH+0.30,0.45,MAT.stone);
  // arrow slits on the keep faces
  for(const yy of [2.3,4.4]){
    arrowSlit(KX, WB+yy, KZ+KW/2+0.02, 0);
    arrowSlit(KX+KW/2+0.02, WB+yy, KZ, Math.PI/2);

  }
  cone(0.90,1.9,18,MAT.slate,TX,WB+KH+0.5+1.00,TZ);
  sphere(0.09,MAT.iron,TX,WB+KH+2.5,TZ,world,8);
  // keep door
  box(0.9,1.5,0.10,MAT.darkWood,KX+0.7,WB+0.75,KZ+KW/2+0.06);

  // ---- two round curtain towers with conical slate roofs ----
  function roundTower(x,z){
    cyl(1.28,1.42,4.2,20,MAT.stone,x,WB+2.1,z);
    cyl(1.45,1.45,0.22,20,MAT.stoneDark,x,WB+4.28,z);

      const a=i/12*TAU;

    arrowSlit(x, WB+2.3, z+1.43, 0);
    contactShadow(3.4,0.35,world,x,z,0.45);
  }
  roundTower(-PX,PZ);   // south-west
  roundTower( PX,-PZ);  // north-east

  // ivy climbing the north curtain wall
  const leafGeo=new THREE.PlaneGeometry(0.16,0.13);
  const ivyMat=new THREE.MeshStandardMaterial({color:0x3d6a35,roughness:1,side:THREE.DoubleSide});
  const ivy=new THREE.InstancedMesh(leafGeo,ivyMat,220);
  const dummy=new THREE.Object3D();
  for(let i=0;i<220;i++){

    dummy.updateMatrix(); ivy.setMatrixAt(i,dummy.matrix);
  }
  ivy.castShadow=false; ivy.receiveShadow=true; world.add(ivy);

  contactShadow(9.5,0.18,world,0,0,0.44);
  flushMerlons();
}

const finishPass=new ShaderPass({
  uniforms:{tDiffuse:{value:null},uResolution:{value:new THREE.Vector2(window.innerWidth,window.innerHeight)}},
  vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform vec2 uResolution; varying vec2 vUv;
    vec3 aces(vec3 x){
      const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
      return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0);
    }
    void main(){
      vec2 uv=vUv;
      // fixed tilt-shift: sharper through the middle, soft at far/near ends
      float d=abs(uv.y-0.5);
      float blur=smoothstep(0.19,0.42,d)*1.1;
      vec3 lin=vec3(0.0); float wsum=0.0;
      for(int i=-4;i<=4;i++){
        float fi=float(i); float w=exp(-fi*fi/7.0);
        lin+=texture2D(tDiffuse,uv+vec2(0.0,fi*blur/uResolution.y)).rgb*w; wsum+=w;
      }
      lin/=wsum;
      // The untouched page is exactly linear 1.0. Keep it pure white while
      // ACES filmic tone mapping shapes everything in the little world.
      vec3 mapped=aces(lin*0.95);
      float page=step(0.9994,min(lin.r,min(lin.g,lin.b)));
      gl_FragColor=vec4(mix(mapped,vec3(1.0),page),1.0);
    }`
});

/* ============================================================
   SYNTHESIZED AUDIO (music + ambience + foley)
   ============================================================ */
class Soundscape{
  constructor(){ this.started=false; }
  start(){
    if(this.started) return; this.started=true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){ console.warn('[audio] Web Audio unavailable'); return; }
    const ctx=new AC(); this.ctx=ctx;
    if(ctx.state==='suspended') ctx.resume();
    this.master=ctx.createGain();
    this.master.gain.setValueAtTime(0.0001,ctx.currentTime);
    this.master.gain.linearRampToValueAtTime(0.85,ctx.currentTime+2.5);
    this.master.connect(ctx.destination);
    const conv=ctx.createConvolver(); conv.buffer=this.impulse(3.0,2.6);
    const rv=ctx.createGain(); rv.gain.value=0.30;
    conv.connect(rv); rv.connect(this.master); this.rev=conv;
    const dry=ctx.createGain(); dry.gain.value=0.92; dry.connect(this.master); this.dry=dry;
    this.wind();
    this.next=ctx.currentTime+0.15; this.step=0;
    this.timer=setInterval(()=>this.schedule(),60);
    console.log('[audio] started — original score + ambient wind');
  }
  impulse(dur,decay){
    const n=Math.floor(this.ctx.sampleRate*dur), buf=this.ctx.createBuffer(2,n,this.ctx.sampleRate);
    for(let c=0;c<2;c++){
      const d=buf.getChannelData(c);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
    }
    return buf;
  }
  wind(){
    const ctx=this.ctx, n=ctx.sampleRate*3, buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0); let last=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last+0.022*w)/1.022; d[i]=last*3.2; }
    const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=640;
    const g=ctx.createGain(); g.gain.value=0.10;
    src.connect(lp); lp.connect(g); g.connect(this.master);
    const lfo=ctx.createOscillator(); lfo.frequency.value=0.07;
    const lg=ctx.createGain(); lg.gain.value=0.045;
    lfo.connect(lg); lg.connect(g.gain); lfo.start(); src.start();
    console.log('[audio] ambient wind layer running');
  }
  tone(freq,time,dur,type,vol,detune=0){
    const ctx=this.ctx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq; o.detune.value=detune;
    g.gain.setValueAtTime(0.0001,time);
    g.gain.exponentialRampToValueAtTime(vol,time+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,time+dur);
    o.connect(g); g.connect(this.dry); g.connect(this.rev);
    o.start(time); o.stop(time+dur+0.1);
  }
  schedule(){
    if(!this.ctx) return; const ctx=this.ctx;
    const scale=[220,261.63,293.66,329.63,392,440,523.25,587.33]; // A minor-ish modal
    const pattern=[0,2,4,2,5,4,2,1,0,2,3,4,5,4,2,0];
    while(this.next<ctx.currentTime+0.35){
      const s=this.step%16;
      if(s%2===0) this.tone(scale[pattern[s]],this.next,0.92,'triangle',0.052);
      if(s===0||s===8) this.tone(scale[0]/2,this.next,3.8,'sine',0.042);
      if(s===4||s===12) this.tone(scale[pattern[s]]/2,this.next,1.7,'sine',0.028);
      if(Math.random()<0.05) this.bird(this.next+0.1);
      this.next+=0.5; this.step++;
    }
  }
  bird(t){
    const ctx=this.ctx;
    for(let i=0;i<3;i++){
      const o=ctx.createOscillator(),g=ctx.createGain(),tt=t+i*0.09;
      o.type='sine';
      o.frequency.setValueAtTime(1500+i*220,tt);
      o.frequency.exponentialRampToValueAtTime(2600+i*220,tt+0.06);
      g.gain.setValueAtTime(0.0001,tt);
      g.gain.exponentialRampToValueAtTime(0.017,tt+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,tt+0.08);
      o.connect(g); g.connect(this.dry); g.connect(this.rev);
      o.start(tt); o.stop(tt+0.1);
    }
    console.log('[audio] bird chirp');
  }
  clang(){
    if(!this.started||!this.ctx) return; const ctx=this.ctx,t=ctx.currentTime;
    for(const [f,v] of [[1180,0.10],[1770,0.07],[2450,0.04],[640,0.055]]){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='triangle'; o.frequency.setValueAtTime(f,t);
      o.frequency.exponentialRampToValueAtTime(f*0.86,t+0.18);
      g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.38);
      o.connect(g); g.connect(this.dry); g.connect(this.rev); o.start(t); o.stop(t+0.4);
    }
    const buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.12),ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1900;
    const g=ctx.createGain(); g.gain.value=0.09;
    src.connect(hp); hp.connect(g); g.connect(this.dry); src.start(t);
    console.log('[audio] sfx: anvil clang');
  }
  cluck(){
    if(!this.started||!this.ctx) return; const ctx=this.ctx,t=ctx.currentTime;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(620,t); o.frequency.exponentialRampToValueAtTime(410,t+0.09);
    o.frequency.exponentialRampToValueAtTime(560,t+0.16);
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1700;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.055,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(lp); lp.connect(g); g.connect(this.dry); g.connect(this.rev);
    o.start(t); o.stop(t+0.25);
    console.log('[audio] sfx: chicken cluck');
  }
  caw(){
    if(!this.started||!this.ctx) return; const ctx=this.ctx,t=ctx.currentTime;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(780,t); o.frequency.exponentialRampToValueAtTime(380,t+0.22);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=1.6;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.045,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.30);
    o.connect(bp); bp.connect(g); g.connect(this.dry); g.connect(this.rev);
    o.start(t); o.stop(t+0.32);
    console.log('[audio] sfx: crow caw');
  }
}
const sound=new Soundscape();
const hint=document.getElementById('hint');
function enableSound(){ sound.start(); hint.classList.add('gone'); }
window.addEventListener('pointerdown',enableSound,{once:true});
window.addEventListener('keydown',enableSound,{once:true});

function crossed(target,prev,cur){
  return cur>=prev ? (target>prev&&target<=cur) : (target>prev||target<=cur);
}
const HAMMER_PHASES=[0.145,0.395,0.645,0.895];
const CLUCK_PHASES=[0.12,0.48,0.73];
const CAW_PHASES=[0.22,0.68];

/* ---------- the seamless 24-second loop ---------- */
const loading=document.getElementById('loading');
let t0=null, prevP=0, firstFrame=true;
function pathPoint(pts,t){
  let total=0, segs=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[i],b=pts[(i+1)%pts.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);
    segs.push(l); total+=l;
  }
  let d=((t%1)+1)%1*total;
  for(let i=0;i<pts.length;i++){
    if(d<=segs[i]){
      const u=d/segs[i],a=pts[i],b=pts[(i+1)%pts.length];
      return [lerp(a[0],b[0],u),lerp(a[1],b[1],u),Math.atan2(b[0]-a[0],b[1]-a[1])];
    }
    d-=segs[i];
  }
  return [pts[0][0],pts[0][1],0];
}
const MAID_PATH=[[-1.0,-1.0],[2.4,-1.0],[2.4,1.2],[-1.0,1.2]];

function update(p){
  const ph=p*TAU;
  // island bob
  world.position.y=0.085*Math.sin(ph)+0.025*Math.sin(2*ph);

  // water
  for(const w of WATERS) w.uniforms.uPhase.value=ph;

  // forge glow
  if(FORGE){
    const g=FORGE.base*(0.86+0.14*Math.sin(ph*7)+0.08*Math.sin(ph*3));
    FORGE.embers.material.emissiveIntensity=g;
    FORGE.light.intensity=2.2*(0.85+0.15*Math.sin(ph*7));
  }

  // banners ripple
  for(const b of BANNERS){
    const pos=b.geo.attributes.position;
    for(let i=0;i<pos.count;i++){
      const bx=b.base[i*3], by=b.base[i*3+1];
      const u=(bx+0.43)/0.86, v=clamp((0.775-by)/1.55,0,1);
      pos.setXYZ(i,
        bx+Math.sin(u*6-ph*3+b.phase*TAU)*0.022*v,
        by+Math.sin(u*4+ph*2)*0.018*v,
        Math.sin(u*7-ph*3+b.phase*TAU)*0.11*v+Math.sin(u*13+ph*5)*0.028*v);
    }
    pos.needsUpdate=true; b.geo.computeVertexNormals();
  }

  // smith's hammer
  const hp=(p*4)%1;
  if(hp<0.45) smith.armR.rotation.x=0.95*Math.sin(Math.PI*hp/0.45);
  else if(hp<0.58) smith.armR.rotation.x=lerp(0,-0.92,(hp-0.45)/0.13);
  else smith.armR.rotation.x=lerp(-0.92,0,(hp-0.58)/0.42);
  smith.armL.rotation.x=0.12*Math.sin(ph*2);
  smith.body.rotation.y=0.06*Math.sin(ph);

  // guard pacing the wall
  const gx=4.7*Math.sin(ph), gdir=Math.cos(ph);
  guard.group.position.x=gx;
  guard.group.rotation.y=gdir>=0?Math.PI/2:-Math.PI/2;
  const gs=Math.sin(ph*4);
  guard.legL.rotation.x=gs*0.45; guard.legR.rotation.x=-gs*0.45;
  guard.armL.rotation.x=-gs*0.3; guard.armR.rotation.x=gs*0.3;

  // maid's round through the courtyard
  const mp=pathPoint(MAID_PATH,(p*2)%1);
  maid.group.position.set(mp[0],0.46,mp[1]); maid.group.rotation.y=mp[2];
  const ms=Math.sin(ph*8);
  maid.legL.rotation.x=ms*0.5; maid.legR.rotation.x=-ms*0.5;
  maid.armL.rotation.x=-0.35; maid.armR.rotation.x=ms*0.3;
  maid.group.position.y+=Math.abs(Math.sin(ph*8))*0.025;

  // stable boy leading the horse (there and back)
  const u=0.5-0.5*Math.cos(ph);
  const bx=lerp(-3.0,1.0,u), bz=lerp(1.6,0.0,u);
  const heading=Math.sin(ph)>=0?Math.atan2(4.0,-1.6):Math.atan2(-4.0,1.6);
  boy.group.position.set(bx,0.46,bz); boy.group.rotation.y=heading;
  const bs=Math.sin(ph*6);
  boy.legL.rotation.x=bs*0.42; boy.legR.rotation.x=-bs*0.42;
  boy.armR.rotation.x=-0.5; boy.armL.rotation.x=0.1;
  horse.group.position.set(bx-Math.sin(heading)*0.95,0.46,bz-Math.cos(heading)*0.95);
  horse.group.rotation.y=heading;
  for(let i=0;i<4;i++) horse.legs[i].rotation.x=Math.sin(ph*6+i*Math.PI)*0.28;

  // cook idles by the kitchen door
  cook.group.rotation.y=Math.PI+0.18*Math.sin(ph);
  cook.armR.rotation.x=-0.5+0.12*Math.sin(ph*3);
  cook.body.position.y=0.58+0.01*Math.sin(ph*2);

  // chickens peck
  for(const c of CHICKENS){
    c.head.rotation.x=0.5+0.5*Math.sin(ph*6+c.phase*TAU);
    c.group.rotation.y=0.4*Math.sin(ph*1+c.phase*TAU);
    c.group.position.y=0.46+Math.max(0,Math.sin(ph*3+c.phase*TAU))*0.03;
  }

  // crows circle the keep
  for(const c of CROWS){
    const a=ph*3+c.phase*TAU;
    c.group.position.set(-4.0+Math.cos(a)*3.9, 7.6+0.45*Math.sin(a*2), -3.0+Math.sin(a)*3.9);
    c.group.rotation.y=Math.atan2(-Math.sin(a),Math.cos(a));
    const flap=Math.sin(ph*16+c.phase*TAU)*0.55;
    c.wings[0].rotation.z=flap; c.wings[1].rotation.z=-flap;
  }

  // smoke drifts
  for(const s of SMOKE){
    const age=(((p-s.birth)%1)+1)%1*s.life;
    if(age>=s.life){ s.sp.visible=false; continue; }
    s.sp.visible=true;
    const f=age/s.life;
    s.sp.position.set(
      s.x+Math.sin(age*1.5+s.seed*6)*0.22*f,
      s.y+age*s.rise,
      s.z+Math.cos(age*1.2+s.seed*5)*0.18*f
    );
    s.sp.scale.setScalar(s.size*(0.7+f*1.5));
    s.sp.material.opacity=Math.sin(Math.PI*f)*0.16;
  }

  // crumbs break off, fall into the white and fade
  for(const c of CRUMBS){
    const age=(((p-c.birth)%1)+1)%1*LOOP;
    if(age>=3.2){ c.mesh.visible=false; continue; }
    c.mesh.visible=true;
    c.mesh.position.set(c.x+c.drift*age, c.y-2.0*age-1.3*age*age, c.z+c.drift*0.4*age);
    c.mesh.rotation.x=age*3; c.mesh.rotation.y=age*4;
    c.mesh.material.opacity=1-smoothstep(1.6,3.2,age);
  }

  // foley events, phase-locked to the visuals
  if(!firstFrame){
    for(const t of HAMMER_PHASES) if(crossed(t,prevP,p)) sound.clang();
    for(const t of CLUCK_PHASES) if(crossed(t,prevP,p)) sound.cluck();
    for(const t of CAW_PHASES)   if(crossed(t,prevP,p)) sound.caw();
  }
  prevP=p;
}

function fit(){
  const w=window.innerWidth,h=window.innerHeight,aspect=w/h;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h);
  composer.setSize(w,h);
  if(ssao) ssao.setSize(w,h);
  bloom.setSize(w,h);
  finishPass.uniforms.uResolution.value.set(w,h);
  const targetHalfW=15.6, targetHalfH=11.2;
  let halfW=targetHalfW, halfH=targetHalfH;
  if(halfW/halfH>aspect) halfH=halfW/aspect; else halfW=halfH*aspect;
  camera.left=-halfW; camera.right=halfW; camera.top=halfH; camera.bottom=-halfH;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',fit);
fit();
window.__dbg={THREE,scene,world,camera,renderer,composer};

function frame(now){
  requestAnimationFrame(frame);
  if(t0===null) t0=now;
  const t=((now-t0)/1000)%LOOP, p=t/LOOP;
  update(p);
  composer.render();
  if(firstFrame){
    firstFrame=false;
    loading.classList.add('gone');
    console.log('[scene] ready — 24s seamless loop, '+BANNERS.length+' banners, '+CHICKENS.length+' chickens');
  }
}
requestAnimationFrame(frame);

</script>
