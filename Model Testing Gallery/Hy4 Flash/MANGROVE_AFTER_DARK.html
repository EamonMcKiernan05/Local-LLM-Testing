<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>MANGROVE AFTER DARK</title>
<link rel="icon" href="data:," />
<style>
  :root { --ink:#dfeae6; --dim:rgba(223,234,230,.58); --edge:rgba(160,225,210,.24); }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#03070a; }
  body { font-family:Georgia,'Times New Roman',serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
  #scene { position:fixed; inset:0; display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #scene.dragging { cursor:grabbing; }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at 50% 43%, rgba(0,0,0,0) 42%, rgba(0,6,8,.5) 100%); }
  #grain { position:fixed; inset:0; pointer-events:none; z-index:3; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  #ui { position:fixed; inset:0; z-index:5; pointer-events:none; transition:opacity 1.1s ease; }
  #ui.hidden { opacity:0; }
  #ui.hidden .btn { pointer-events:none; }
  .titleblock { position:absolute; left:clamp(18px,4vw,62px); bottom:clamp(20px,5vh,56px); }
  .kicker { font-family:Arial,Helvetica,sans-serif; font-size:10px; letter-spacing:.42em; text-transform:uppercase;
    color:var(--dim); margin-bottom:11px; }
  .title { font-size:clamp(28px,4.8vw,68px); line-height:.96; font-weight:400; letter-spacing:.05em; margin:0;
    text-shadow:0 2px 26px rgba(0,0,0,.8); }
  .subtitle { font-style:italic; font-size:clamp(12px,1.2vw,16px); color:var(--dim); margin-top:11px; letter-spacing:.02em; }
  .hint { font-family:Arial,Helvetica,sans-serif; font-size:10px; letter-spacing:.18em; color:rgba(223,234,230,.4);
    margin-top:17px; text-transform:uppercase; }
  .controls { position:absolute; right:clamp(14px,3.4vw,52px); bottom:clamp(20px,5vh,56px);
    display:flex; gap:8px; align-items:center; font-family:Arial,Helvetica,sans-serif; }
  .btn { pointer-events:auto; appearance:none; border:1px solid var(--edge);
    background:rgba(4,12,14,.34); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    color:var(--ink); font-size:9px; letter-spacing:.19em; text-transform:uppercase;
    padding:10px 12px; border-radius:2px; cursor:pointer; transition:background .25s,border-color .25s,color .25s; }
  .btn:hover { background:rgba(120,230,205,.12); border-color:rgba(160,225,210,.55); }
  .btn:active { background:rgba(120,230,205,.2); }
  .btn.active { color:#04100f; background:rgba(170,235,220,.84); border-color:rgba(190,240,225,.92); }
  .btn .dot { display:inline-block; width:5px; height:5px; border-radius:50%; background:#8fe6d0;
    margin-right:7px; vertical-align:middle; opacity:.5; box-shadow:0 0 6px rgba(80,255,210,.5); }
  .btn.active .dot { background:#0a231f; opacity:1; box-shadow:none; }
  #soundHint { position:absolute; left:50%; top:clamp(16px,3.5vh,36px); transform:translateX(-50%); z-index:6;
    pointer-events:none; font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:.30em;
    text-transform:uppercase; color:rgba(223,234,230,.85); text-shadow:0 2px 16px rgba(0,0,0,.9);
    padding:13px 20px; border:1px solid rgba(160,225,210,.22); border-radius:2px;
    background:rgba(4,12,14,.3); backdrop-filter:blur(6px); transition:opacity 1s ease; }
  #soundHint.gone { opacity:0; }
  #err { position:fixed; left:12px; top:12px; z-index:20; max-width:76vw; font:12px/1.45 monospace;
    color:#ff9f8f; white-space:pre-wrap; display:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}

<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="grain"></div>
<div id="ui">
  <div class="titleblock">
    <div class="kicker">A bioluminescent creek &middot; after the tide</div>
    <h1 class="title">MANGROVE<br/>AFTER DARK</h1>
    <div class="subtitle">The water remembers every disturbance</div>
    <div class="hint">Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div>
  </div>
  <div class="controls">
    <button id="btnCine" class="btn active" title="Automatic cinematic shot"><span class="dot"></span>Cinematic</button>
    <button id="btnReset" class="btn" title="Restore the opening view">Reset view</button>
    <button id="btnPause" class="btn" title="Freeze scene time"><span class="dot"></span>Pause</button>
    <button id="btnSound" class="btn" title="Enable or mute sound"><span class="dot"></span>Sound off</button>
  </div>
</div>
<div id="soundHint">Click for sound</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   MANGROVE AFTER DARK — single-file procedural scene
   seed 1337 · deterministic generation · fixed-step simulation
   ===================================================================== */
const PI=Math.PI, TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* deterministic RNG (mulberry32) */
function mulberry32(seed){let s=seed>>>0;return function(){s|=0;s=s+0x6D2B79F5|0;
  let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;};}
const RNG=mulberry32(1337);
const rand=(a,b)=>a+RNG()*(b-a);
const randInt=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const pick=a=>a[randInt(0,a.length-1)];

/* value noise for terrain / textures (deterministic, CPU side) */
function hash2(x,z){const n=Math.sin(x*127.1+z*311.7)*43758.5453123;return n-Math.floor(n);}
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return lerp(lerp(hash2(xi,zi),hash2(xi+1,zi),u),lerp(hash2(xi,zi+1),hash2(xi+1,zi+1),u),v)*2-1;}
function fbm(x,z,oct){let s=0,a=0.5,f=1;oct=oct||4;for(let i=0;i<oct;i++){s+=a*vnoise(x*f,z*f);f*=2.03;a*=0.5;}return s;}

const WATER_Y=0.02;
const CYCLE=22.0;                 // seconds per current-pulse cycle
const MOON_DIR=new THREE.Vector3(0,0.22,0.975).normalize();

/* ---------- renderer ---------- */
const canvas=document.getElementById('scene');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance',
    alpha:false,stencil:false,preserveDrawingBuffer:false});
}catch(e){
  const err=document.getElementById('err');err.style.display='block';err.textContent='WebGL unavailable: '+e.message;throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(window.innerWidth,window.innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.16;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
renderer.shadowMap.needsUpdate=true;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(new THREE.Color(0x061016),0.0135);
const world=new THREE.Group(); scene.add(world);
const camera=new THREE.PerspectiveCamera(48,window.innerWidth/window.innerHeight,0.08,820);
camera.position.set(0,0.48,-6.5);

/* ---------- procedural canvas textures (built once) ---------- */
function texture(w,h,draw,repX,repY,srgb){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(repX)t.repeat.set(repX,repY||repX);
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  if(srgb!==false)t.colorSpace=THREE.SRGBColorSpace;return t;
}
function speckle(g,w,h,n,cols,r0,r1){
  for(let i=0;i<n;i++){g.fillStyle=cols[randInt(0,cols.length-1)];const r=rand(r0,r1);
    g.beginPath();g.ellipse(rand(0,w),rand(0,h),r,r*rand(.4,1.5),rand(0,PI),0,TAU);g.fill();}
}
const TEX={};
(function buildTextures(){
  /* wet mangrove bark: vertical fissures, dark and slightly glossy-looking */
  TEX.bark=texture(256,256,(g,w,h)=>{
    g.fillStyle='#4a4740';g.fillRect(0,0,w,h);
    for(let i=0;i<520;i++){const x=rand(0,w);
      g.strokeStyle='rgba('+randInt(18,42)+','+randInt(20,44)+','+randInt(16,36)+','+rand(.12,.5)+')';
      g.lineWidth=rand(.5,3);g.beginPath();g.moveTo(x,0);
      for(let y=0;y<=h;y+=16)g.lineTo(x+Math.sin(y*.035+i)*2.4+rand(-1,1),y);g.stroke();}
    speckle(g,w,h,2600,['rgba(120,120,104,.06)','rgba(20,22,18,.10)','rgba(96,110,92,.05)'],.5,2.4);
    for(let i=0;i<80;i++){const x=rand(0,w),y=rand(0,h),r=rand(6,30);
      const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,'rgba(38,52,42,'+rand(.05,.18)+')');gr.addColorStop(1,'rgba(38,52,42,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
  },2,3);
  /* leaf: central vein + fine diagonal veins */
  TEX.leaf=texture(128,128,(g,w,h)=>{
    g.fillStyle='#889a74';g.fillRect(0,0,w,h);
    g.strokeStyle='rgba(210,225,190,.55)';g.lineWidth=2.4;
    g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.stroke();
    for(let y=6;y<h;y+=9){g.strokeStyle='rgba(200,218,178,'+rand(.14,.34)+')';g.lineWidth=1;
      g.beginPath();g.moveTo(w/2,y);g.lineTo(w/2-26,y+9);g.moveTo(w/2,y);g.lineTo(w/2+26,y+9);g.stroke();}
    speckle(g,w,h,700,['rgba(60,84,58,.10)','rgba(180,200,150,.08)'],.4,1.6);
  },1,1);
  /* dark tidal mud with wet cracks and grains */
  TEX.mud=texture(256,256,(g,w,h)=>{
    g.fillStyle='#3b362a';g.fillRect(0,0,w,h);
    speckle(g,w,h,14000,['#302c22','#4c4635','#57503c','#26251d','#635a44'],.4,2.6);
    for(let i=0;i<220;i++){g.strokeStyle='rgba(20,20,16,'+rand(.05,.2)+')';g.lineWidth=rand(.4,1.8);
      g.beginPath();const x=rand(0,w),y=rand(0,h);g.moveTo(x,y);
      for(let k=0;k<5;k++)g.lineTo(x+rand(-14,14),y+rand(-14,14));g.stroke();}
    for(let i=0;i<40;i++){const x=rand(0,w),y=rand(0,h),r=rand(10,46);
      const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,'rgba(24,32,28,'+rand(.05,.16)+')');gr.addColorStop(1,'rgba(24,32,28,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
  },12,22);
  /* calcareous oyster shell mottling */
  TEX.oyster=texture(128,128,(g,w,h)=>{
    g.fillStyle='#9a9784';g.fillRect(0,0,w,h);
    speckle(g,w,h,2400,['#6f6d5c','#b6b3a0','#858270','#c9c6b2','#5e5d50'],.5,3.2);
    for(let i=0;i<50;i++){const x=rand(0,w),y=rand(0,h),r=rand(4,18);
      g.strokeStyle='rgba(60,60,50,'+rand(.05,.18)+')';g.lineWidth=rand(.5,2);
      g.beginPath();g.arc(x,y,r,rand(0,PI),rand(0,PI)+rand(1,4));g.stroke();}
  },1,1);
  /* chitin for the horseshoe crab */
  TEX.chitin=texture(128,128,(g,w,h)=>{
    g.fillStyle='#56543c';g.fillRect(0,0,w,h);
    speckle(g,w,h,2600,['#46452f','#67684a','#3b3b2a','#75755a'],.5,2.2);
    for(let i=0;i<120;i++){g.strokeStyle='rgba(30,32,22,'+rand(.04,.14)+')';g.lineWidth=rand(.4,1.4);
      g.beginPath();const x=rand(0,w),y=rand(0,h);g.moveTo(x,y);g.lineTo(x+rand(-6,6),y+rand(4,14));g.stroke();}
  },1,1);
  /* soft radial for contact shadow / halos */
  TEX.radial=texture(128,128,(g,w,h)=>{
    const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.6)');
    gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);
  },1,1);
})();

/* ---------- materials ---------- */
const M={};
M.bark=new THREE.MeshPhysicalMaterial({map:TEX.bark,bumpMap:TEX.bark,bumpScale:.03,
  color:0x807d70,roughness:.55,metalness:0,clearcoat:.28,clearcoatRoughness:.32,envMapIntensity:.8});
M.barkDark=new THREE.MeshPhysicalMaterial({map:TEX.bark,bumpMap:TEX.bark,bumpScale:.028,
  color:0x4a4a40,roughness:.66,metalness:0,clearcoat:.18,clearcoatRoughness:.4});
M.leaf=new THREE.MeshStandardMaterial({map:TEX.leaf,vertexColors:true,roughness:.5,metalness:0,
  side:THREE.DoubleSide});
M.mud=new THREE.MeshStandardMaterial({map:TEX.mud,bumpMap:TEX.mud,bumpScale:.045,
  color:0x595443,roughness:1,metalness:0});
M.oyster=new THREE.MeshStandardMaterial({map:TEX.oyster,bumpMap:TEX.oyster,bumpScale:.03,
  color:0x9c9986,roughness:.96,metalness:0});
M.fish=new THREE.MeshStandardMaterial({color:0x8fa6a6,roughness:.42,metalness:.16,
  emissive:0x0c2d2c,emissiveIntensity:.5});
M.chitin=new THREE.MeshPhysicalMaterial({map:TEX.chitin,bumpMap:TEX.chitin,bumpScale:.02,
  color:0x8c8a62,roughness:.56,metalness:0,clearcoat:.34,clearcoatRoughness:.42});
M.contact=new THREE.MeshBasicMaterial({map:TEX.radial,transparent:true,opacity:.5,
  depthWrite:false,color:0x000000,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});

/* ---------- geometry helpers ---------- */
function mesh(geo,mat,parent,x,y,z,cast,receive){
  const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);
  m.castShadow=cast!==false;m.receiveShadow=receive!==false;(parent||world).add(m);return m;
}
/* tapered tube along a curve: post-scale ring vertices of a unit-radius TubeGeometry */
function taperedTube(curve,tub,rad,r0,r1,power){
  const g=new THREE.TubeGeometry(curve,tub,1,rad,false);
  const pos=g.attributes.position;const ring=rad+1;
  for(let i=0;i<=tub;i++){
    const t=i/tub;const c=curve.getPointAt(t);
    const r=lerp(r0,r1,Math.pow(t,power||1));
    for(let j=0;j<=rad;j++){
      const idx=i*ring+j;
      pos.setXYZ(idx,c.x+(pos.getX(idx)-c.x)*r,c.y+(pos.getY(idx)-c.y)*r,c.z+(pos.getZ(idx)-c.z)*r);
    }
  }
  pos.needsUpdate=true;g.computeVertexNormals();return g;
}
function contactShadow(parent,x,y,z,sx,sz,op){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),M.contact.clone());
  m.material.opacity=op;m.rotation.x=-PI/2;m.position.set(x,y+0.012,z);m.scale.set(sx,sz,1);
  m.renderOrder=1;parent.add(m);return m;
}

/* =====================================================================
   TERRAIN — a depressed creek with rising muddy banks and ridges
   ===================================================================== */
function groundH(x,z){
  const ax=Math.abs(x);
  const edge=2.45+0.35*fbm(x*0.3,z*0.3,3);
  const bank=smooth(edge,edge+2.6,ax);
  const ridges=0.16*Math.sin(z*0.46+x*0.7)+0.09*Math.sin(z*0.95-x*1.2);
  return -0.62+bank*(1.02+0.32*fbm(x*0.5,z*0.5,4)+ridges*bank);
}
(function buildGround(){
  const g=new THREE.PlaneGeometry(84,170,118,168);g.rotateX(-PI/2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++)p.setY(i,groundH(p.getX(i),p.getZ(i)));
  p.needsUpdate=true;g.computeVertexNormals();
  const m=mesh(g,M.mud,world,0,0,0,false,true);m.receiveShadow=true;
})();

/* =====================================================================
   NIGHT SKY — gradient dome, stars, crescent moon and halo
   ===================================================================== */
(function buildSky(){
  const sky=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
    vertexShader:`varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vP; void main(){
      vec3 d=normalize(vP);float h=clamp(d.y*0.5+0.5,0.0,1.0);
      vec3 horizon=vec3(0.028,0.050,0.062);vec3 zenith=vec3(0.003,0.008,0.016);
      vec3 c=mix(horizon,zenith,pow(h,0.7));
      gl_FragColor=vec4(c,1.0);}`});
  const dome=new THREE.Mesh(new THREE.SphereGeometry(400,32,20),sky);dome.frustumCulled=false;scene.add(dome);

  /* stars */
  const N=460,sp=new Float32Array(N*3),ph=new Float32Array(N);
  for(let i=0;i<N;i++){
    const y=rand(0.03,0.98),a=rand(0,TAU),r=Math.sqrt(1-y*y)*300;
    sp[i*3]=Math.cos(a)*r;sp[i*3+1]=y*300;sp[i*3+2]=Math.sin(a)*r;ph[i]=rand(0,TAU);
  }
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  sg.setAttribute('aPh',new THREE.BufferAttribute(ph,1));
  const sm=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0}},
    vertexShader:`attribute float aPh;uniform float uTime;varying float vTw;
      void main(){vTw=0.55+0.45*sin(uTime*1.3+aPh*7.0);vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=(1.1+1.6*fract(sin(aPh*91.7)*43758.5))*(260.0/-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying float vTw;void main(){float r=length(gl_PointCoord-0.5)*2.0;
      float a=smoothstep(1.0,0.0,r);gl_FragColor=vec4(vec3(0.78,0.86,0.95),a*vTw*0.75);}`});
  const stars=new THREE.Points(sg,sm);stars.frustumCulled=false;scene.add(stars);
  window.__starMat=sm;

  /* crescent moon + halo, placed down the channel */
  const md=MOON_DIR.clone().multiplyScalar(170).add(V(0,0.48,-6.5));
  const moonMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec2 vUv;void main(){vec2 p=(vUv-0.5)*2.0;
      float d1=length(p);float disk=1.0-smoothstep(0.405,0.44,d1);
      float d2=length(p-vec2(0.27,0.09));float carve=smoothstep(0.375,0.42,d2);
      float cr=disk*carve;
      float halo=exp(-max(d1-0.44,0.0)*6.5)*0.16+exp(-d1*d1*5.0)*0.05;
      vec3 col=vec3(0.80,0.88,0.98)*(cr*1.2+halo);
      gl_FragColor=vec4(col,clamp(cr+halo*0.7,0.0,1.0));}`});
  const moon=new THREE.Mesh(new THREE.PlaneGeometry(15,15),moonMat);
  moon.position.copy(md);moon.rotation.y=PI;scene.add(moon);
  const haloMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec2 vUv;void main(){float d=length((vUv-0.5)*2.0);
      float a=exp(-d*d*7.0)*0.10;gl_FragColor=vec4(vec3(0.42,0.66,0.78),a);}`});
  const halo=new THREE.Mesh(new THREE.PlaneGeometry(52,52),haloMat);
  halo.position.copy(md);halo.position.z+=0.5;halo.rotation.y=PI;scene.add(halo);
})();

/* =====================================================================
   LIGHTING — cool moonlight, dim sky fill, restrained bio point lights
   ===================================================================== */
const hemi=new THREE.HemisphereLight(0x8fb4c4,0x0c1414,0.5);scene.add(hemi);
const moonLight=new THREE.DirectionalLight(0xbcd6e6,1.15);
moonLight.position.copy(MOON_DIR.clone().multiplyScalar(28));moonLight.target.position.set(0,0,2);
moonLight.castShadow=true;moonLight.shadow.mapSize.set(1024,1024);
moonLight.shadow.camera.left=-16;moonLight.shadow.camera.right=16;

/* =====================================================================
   WATER — custom shader: dark base, moon streak, disturbance-driven glow
   ===================================================================== */
const DIST_MAX=12;
const disturbVecs=Array.from({length:DIST_MAX},()=>new THREE.Vector4(0,0,0,1));
const waterUniforms={
  uTime:{value:0},uCam:{value:new THREE.Vector3()},uMoonDir:{value:MOON_DIR.clone()},
  uDisturb:{value:disturbVecs},uCount:{value:0},uWaterY:{value:WATER_Y}
};
const waterMat=new THREE.ShaderMaterial({uniforms:waterUniforms,transparent:false,depthWrite:true,
  vertexShader:`varying vec3 vWorld;void main(){
    vec4 wp=modelMatrix*vec4(position,1.0);vWorld=wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp;}`,
  fragmentShader:`
    precision highp float;
    uniform float uTime;uniform vec3 uCam;uniform vec3 uMoonDir;
    uniform vec4 uDisturb[12];uniform int uCount;uniform float uWaterY;
    varying vec3 vWorld;
    void main(){
      vec2 p=vWorld.xz;float t=uTime;
      /* anisotropic ripple field: crests across the channel, shimmer along it */
      float k1=1.85,k2=0.62,k3=3.05;
      float a1=0.020,a2=0.014,a3=0.006;
      float dhx = cos(p.x*k1+t*1.25)*k1*a1
                + cos((p.x*k2+p.y*1.45)-t*0.85)*k2*a2
                + cos((p.x*k3-p.y*0.75)+t*2.05)*k3*a3;
      float dhz = cos((p.x*k2+p.y*1.45)-t*0.85)*1.45*a2
                + cos((p.x*k3-p.y*0.75)+t*2.05)*(-0.75)*a3;
      vec3 n=normalize(vec3(-dhx,1.0,-dhz));
      vec3 Vv=normalize(uCam-vWorld);
      float fres=pow(1.0-max(dot(n,Vv),0.0),3.0);
      vec3 deep=vec3(0.006,0.016,0.020);
      vec3 sky=vec3(0.020,0.036,0.046);
      vec3 col=mix(deep,sky,fres*0.75);
      /* moon specular: stretched into a streak down the open channel */
      vec3 R=reflect(-uMoonDir,n);
      float spec=pow(max(dot(R,Vv),0.0),150.0);
      float chan=exp(-pow(p.x/(0.55+0.055*max(p.y,0.0)),2.0));
      spec*=0.22+0.78*chan;
      spec*=smoothstep(-3.0,2.5,p.y);
      float shimmer=0.55+0.45*sin(p.x*3.1+p.y*0.9+t*2.0)*sin(p.y*3.6-t*1.4);
      col+=vec3(0.46,0.60,0.70)*spec*shimmer*1.15;
      col+=vec3(0.030,0.048,0.060)*spec*chan;
      /* disturbance-driven bioluminescence, with a fine plankton mottle */
      float glow=0.0;
      for(int i=0;i<12;i++){if(i<uCount){vec4 d=uDisturb[i];
        float dd=distance(p,d.xy);glow+=d.z*exp(-dd*dd/(d.w*d.w));}}
      glow=clamp(glow,0.0,1.7);
      float mott=0.55+0.45*sin(p.x*7.3+t*0.7)*sin(p.y*6.1-t*0.55);
      vec3 bio=vec3(0.06,0.92,0.68)*glow*(0.6+0.4*mott)*0.5;
      col+=bio;
      gl_FragColor=vec4(col,1.0);
    }`
});

function addLeavesAround(center,count,spread){

function plantTree(baseX,baseZ,scale,treeSeed){
  const g=mulberry32(treeSeed);
  const R=(a,b)=>a+g()*(b-a);
  const y0=groundH(baseX,baseZ)-0.06;
  const leanX=baseX>0?-1:1;
  const top=V(baseX+leanX*R(.5,1.1)*scale,R(6.2,8.4)*scale,baseZ+R(-1.0,1.0)*scale);
  const trunkCurve=new THREE.CatmullRomCurve3([
    V(baseX,y0,baseZ),
    V(baseX+leanX*.12*scale,y0+1.5*scale,baseZ+R(-.2,.2)),
    V(baseX+leanX*.34*scale,y0+3.4*scale,baseZ+R(-.4,.4)),
    V(baseX+leanX*.6*scale,y0+5.2*scale,baseZ+R(-.6,.6)),
    top
  ]);
  mesh(taperedTube(trunkCurve,28,9,.30*scale,.11*scale,1.0),M.bark,world,0,0,0,true,true);
  contactShadow(world,baseX,y0,baseZ,2.6*scale,2.6*scale,.42);

  /* stilt roots: out and up from the trunk, then down into the mud */
  const nRoots=9+Math.floor(R(0,5));
  for(let i=0;i<nRoots;i++){
    const h=R(.55,2.6)*scale;
    const ang=(i/nRoots)*TAU+R(-.3,.3);
    const start=trunkCurve.getPointAt(clamp(h/(top.y-y0),0.04,.55));
    const reach=R(1.0,2.5)*scale;
    const endX=baseX+Math.cos(ang)*reach,endZ=baseZ+Math.sin(ang)*reach;
    const endY=groundH(endX,endZ)-0.10;
    const mid=V(baseX+Math.cos(ang)*reach*.72,Math.max(start.y*.55,endY+0.6*scale),baseZ+Math.sin(ang)*reach*.72);
    const rc=new THREE.CatmullRomCurve3([
      start,
      V(lerp(start.x,mid.x,.4),start.y+R(.05,.28)*scale,lerp(start.z,mid.z,.4)),
      mid,
      V(endX,endY+.5*scale,endZ),
      V(endX+R(-.06,.06),endY,endZ+R(-.06,.06))
    ]);
    const rr=R(.075,.12)*scale;
    mesh(taperedTube(rc,20,7,rr,rr*.34,1.15),M.barkDark,world,0,0,0,true,true);
    /* small rootlets branching off near the mud */
    if(g()<.65){
      const t=R(.68,.86);
      const bp=rc.getPointAt(t);
      const side=V(R(-1,1),0,R(-1,1)).normalize().multiplyScalar(R(.3,.6)*scale);
      const ex=bp.x+side.x,ez=bp.z+side.z;
      const rc2=new THREE.CatmullRomCurve3([bp,V(bp.x+side.x*.6,bp.y-.05,bp.z+side.z*.6),V(ex,groundH(ex,ez)-.04,ez)]);
      mesh(taperedTube(rc2,10,5,rr*.5,rr*.2,1),M.barkDark,world,0,0,0,true,true);
    }
    /* oysters clustered where roots meet the waterline */
    if(g()<.7){
      const oc=rc.getPointAt(R(.78,.95));
      const n=2+Math.floor(R(0,5));
      for(let k=0;k<n;k++){
        oysterData.push({pos:oc.clone().add(V(R(-.16,.16),R(-.1,.16),R(-.16,.16))),
          scale:R(.055,.12)*scale,quat:new THREE.Quaternion().setFromEuler(new THREE.Euler(R(0,TAU),R(0,TAU),R(0,TAU)))});
      }
    }
  }

  /* upper branching limbs with layered leaf clusters */
  const nLimbs=5+Math.floor(R(0,4));
  for(let i=0;i<nLimbs;i++){
    const t=R(.6,.96);
    const start=trunkCurve.getPointAt(t);
    const a=R(0,TAU),re=R(1.2,2.8)*scale;
    const end=V(start.x+Math.cos(a)*re,start.y+R(.6,2.2)*scale,start.z+Math.sin(a)*re);
    const lc=new THREE.CatmullRomCurve3([start,
      V(lerp(start.x,end.x,.5),lerp(start.y,end.y,.6)+R(.2,.6),lerp(start.z,end.z,.5)),end]);
    mesh(taperedTube(lc,12,6,.085*scale,.028*scale,1.0),M.bark,world,0,0,0,true,true);
    addLeavesAround(end,26+Math.floor(R(0,20)),(.85+R(0,.7))*scale);
    /* a secondary twig */
    if(g()<.7){
      const e2=end.clone().add(V(Math.cos(a+1.1)*re*.55,R(.2,.8),Math.sin(a+1.1)*re*.55));
      const l2=new THREE.CatmullRomCurve3([end,V((end.x+e2.x)/2,(end.y+e2.y)/2+.2,(end.z+e2.z)/2),e2]);
      mesh(taperedTube(l2,8,5,.04*scale,.014*scale,1),M.barkDark,world,0,0,0,true,true);
      addLeavesAround(e2,18+Math.floor(R(0,14)),.7*scale);
    }
  }
}

(function buildLeaves(){
  const Nu=8,cols=3,verts=[],uvs=[],colsC=[],idx=[];
  for(let i=0;i<=Nu;i++){
    const u=i/Nu;const width=.17*Math.pow(Math.sin(PI*u),.78);
    const x=(u-.5)*.62;
    for(let j=0;j<cols;j++){
      const s=j-1;
      verts.push(x, .035*(1-Math.abs(s))*Math.sin(PI*u)+.045*Math.pow((u-.5)*2,2), width*s);
      uvs.push(u,(s+1)/2);
      const v=(s===0?1.12:.88);
      colsC.push(.42*v,.60*v,.38*v);
    }
  }
  for(let i=0;i<Nu;i++)for(let j=0;j<cols-1;j++){
    const a=i*cols+j,b=a+cols;idx.push(a,b,a+1,b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));

})();

function spawnMote(o){

  let p=null;

  }

  p.active=true;p.age=0;p.life=o.life;p.delay=o.delay||0;
  p.x=o.x;p.y=o.y;p.z=o.z;p.vx=o.vx||0;p.vy=o.vy||0;p.vz=o.vz||0;

/* ripple rings pool */
const RING_N=28,rings=[];

    fragmentShader:`varying vec2 vUv;uniform float uAge;uniform float uLife;uniform vec3 uColor;

/* droplet pool */
const DROP_N=14,drops=[];
const dPos=new Float32Array(DROP_N*3),dAlpha=new Float32Array(DROP_N);
for(let i=0;i<DROP_N;i++)drops.push({active:false,x:0,y:0,z:0,vy:0,age:0});
const dGeo=new THREE.BufferGeometry();
dGeo.setAttribute('position',new THREE.BufferAttribute(dPos,3));
dGeo.setAttribute('aAlpha',new THREE.BufferAttribute(dAlpha,1));
const dMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{},
  vertexShader:`attribute float aAlpha;varying float vA;void main(){vA=aAlpha;
    vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=3.5*(18.0/-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;void main(){float r=length(gl_PointCoord-0.5)*2.0;
    gl_FragColor=vec4(vec3(0.55,0.78,0.9),smoothstep(1.0,0.0,r)*vA*0.8);}`});
const dropPoints=new THREE.Points(dGeo,dMat);dropPoints.frustumCulled=false;scene.add(dropPoints);
function spawnDrop(){
  for(let k=0;k<DROP_N;k++){
    const d=drops[k];if(!d.active){
      d.active=true;d.x=rand(-2.2,2.2);d.z=rand(-3,7);d.y=rand(2.0,3.2);
      d.vy=rand(-2.3,-1.7);d.age=0;return;}
  }
}

/* branching eddy network around the fallen branch */
const eddies=[],eddyEdges=[];
(function buildEddies(){
  const seeds=[V(4.6,.05,.9),V(3.6,.05,1.6),V(2.9,.05,2.1)];
  for(const s of seeds){
    let cur=s.clone(),dir=V(-1,0,rand(.3,.7)).normalize();
    let order=0,prev=null;
    for(let i=0;i<16;i++){
      const node={x:cur.x,z:cur.z,delay:clamp(order/24+rand(-.03,.03),0,1),phase:rand(0,TAU)};
      eddies.push(node);
      if(prev)eddyEdges.push({a:prev,b:node});
      prev=node;
      cur.addScaledVector(dir,rand(.20,.42));cur.x=clamp(cur.x,.6,4.8);
      if(RNG()<.28){ /* branch */
        const bn={x:cur.x+rand(-.2,.2),z:cur.z+rand(.3,.8),delay:clamp((order+2)/24,0,1),phase:rand(0,TAU)};
        eddies.push(bn);eddyEdges.push({a:node,b:bn});
        dir=V(dir.x*.7+rand(-.3,.3),0,dir.z+.5).normalize();
      }
      dir.x+=rand(-.22,.22);dir.normalize();order+=1;
    }
  }
  /* additive filaments that ignite as the current front passes */
  const ep=new Float32Array(eddyEdges.length*6),ed=new Float32Array(eddyEdges.length*2);
  for(let i=0;i<eddyEdges.length;i++){
    const e=eddyEdges[i],o=i*6;
    ep[o]=e.a.x;ep[o+1]=WATER_Y+.025;ep[o+2]=e.a.z;
    ep[o+3]=e.b.x;ep[o+4]=WATER_Y+.025;ep[o+5]=e.b.z;
    ed[i*2]=e.a.delay;ed[i*2+1]=e.b.delay;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(ep,3));
  g.setAttribute('aDelay',new THREE.BufferAttribute(ed,1));
  const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uFront:{value:0},uEnv:{value:0},uTime:{value:0}},
    vertexShader:`attribute float aDelay;varying float vD;varying float vS;
      uniform float uTime;void main(){vD=aDelay;vS=sin(position.x*3.0+position.z*2.0+uTime*2.0);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uFront;uniform float uEnv;varying float vD;varying float vS;
      void main(){float df=uFront-vD;
        float lit=uEnv*(exp(-df*df/0.010)*(0.72+0.28*vS)+0.05);
        if(lit<0.012)discard;
        gl_FragColor=vec4(vec3(0.08,1.0,0.72)*lit,lit*0.85);}`});
  const lines=new THREE.LineSegments(g,mat);lines.frustumCulled=false;scene.add(lines);
  window.__eddyMat=mat;
})();

/* disturbance feed to the water shader */
const feed=[];
function addFeed(x,z,intensity,radius){feed.push({x,z,intensity,radius});}
function flashBioLight(pos,intensity,dur){
  let best=bioLights[0];
  for(const b of bioLights)if(b.life<best.life)best=b;
  best.l.life=intensity;best.max=intensity;best.lifeTime=dur;
  best.l.position.copy(pos);best.l.intensity=intensity;
  return best;
}

/* =====================================================================
   FIXED-STEP SIMULATION
   ===================================================================== */
let sceneTime=0;
let nextDrop=2.2;
function stepSim(dt){
  sceneTime+=dt;
  const t=sceneTime;

  /* fish swim and leave short fading wakes */
  const inst=window.__fishInst,m=new THREE.Matrix4();
  for(let i=0;i<fish.length;i++){
    const f=fish[i];
    f.z+=f.speed*dt;
    if(f.z>8.5){f.z=-5.5;f.x=rand(-2,2);}
    f.x+=Math.sin(t*.7+f.phase)*.35*dt;
    f.y=-.12+Math.sin(t*1.3+f.phase)*.02;
    const yaw=Math.sin(t*.7+f.phase)*.12;
    _q.setFromEuler(new THREE.Euler(0,yaw,Math.sin(t*6+f.phase)*.05));
    m.compose(V(f.x,f.y,f.z),_q,V(f.scale,f.scale,f.scale));
    inst.setMatrixAt(i,m);
    f.wakeAcc+=dt;
    if(f.wakeAcc>.065){
      f.wakeAcc=0;
      spawnMote({x:f.x+rand(-.07,.07),y:WATER_Y+.015+rand(0,.015),z:f.z-.18,
        vx:rand(-.08,.08),vy:.005,vz:-.10,life:rand(.6,1.05),size:rand(5,9),
        r:.05,g:.52,b:.40,kind:1});
      addFeed(f.x,f.z-.15,.09,.34);
    }
  }
  inst.instanceMatrix.needsUpdate=true;

  /* horseshoe crab patrols slowly across the muddy shelf */
  crab.t+=dt*.28;
  const cx=5.8+Math.sin(crab.t)*.55,cz=6.4+Math.sin(crab.t*.6)*1.5;
  crab.group.position.set(cx,Math.max(groundH(cx,cz)+.08,WATER_Y+.10),cz);
  crab.group.rotation.y=Math.PI*.5+Math.cos(crab.t)*.5;
  crab.group.position.y+=Math.abs(Math.sin(crab.t*10))*.012;

  /* droplets fall and activate independent rings of light */
  nextDrop-=dt;
  if(nextDrop<=0){spawnDrop();nextDrop=rand(1.6,4.4);}
  for(let k=0;k<DROP_N;k++){
    const d=drops[k];if(!d.active)continue;
    d.vy-=1.8*dt;d.y+=d.vy*dt;d.age+=dt;
    if(d.y<=WATER_Y){
      d.active=false;
      spawnRing(d.x,d.z,rand(1.1,1.7),rand(.7,1.1));
      for(let n=0;n<5;n++)spawnMote({x:d.x+rand(-.1,.1),y:WATER_Y+.02,z:d.z+rand(-.1,.1),
        vx:rand(-.3,.3),vy:rand(.02,.12),vz:rand(-.3,.3),life:rand(.6,1.1),size:rand(6,10),
        r:.12,g:.9,b:.7,kind:2});
      feed.push({x:d.x,z:d.z,intensity:.55,radius:.75});
      flashBioLight(V(d.x,.25,d.z),.85,.7);
    }
    if(d.age>4)d.active=false;
  }

  /* current pulse around the fallen branch: a branching eddy network ignites */
  const phase=t%CYCLE;
  const env=smooth(7.5,9.2,phase)*(1-smooth(11.8,13.6,phase));
  const front=clamp((phase-7.5)/4.4,0,1);
  const em=window.__eddyMat;
  em.uniforms.uFront.value=front;em.uniforms.uEnv.value=env;em.uniforms.uTime.value=t;
  if(env>0.01){
    addFeed(2.6,2.0,env*.55,2.2);
    flashBioLight(V(2.4+Math.sin(t*2)*.4,.22,2.0),env*1.5,.4);
    let fed=0;
    for(const e of eddies){
      const df=front-e.delay;
      const wave=Math.exp(-df*df/0.008);
      if(wave>.22&&fed<8){addFeed(e.x,e.z,env*wave*.30,.55);fed++;}
      const lit=env*(wave*.9+.10);
      if(lit>.06 && RNG()<lit*.55){
        spawnMote({x:e.x+Math.sin(t*3+e.phase)*.06,y:WATER_Y+.03,z:e.z+Math.cos(t*2.4+e.phase)*.06,
          vx:-.18*wave,vy:.012,vz:.07,life:rand(.5,1.0),size:rand(11,19),
          r:.07,g:.95,b:.70,kind:3});
      }
    }
  }

  /* integrate particles */
  for(let i=0;i<P_MAX;i++){
    const p=particles[i];
    if(!p.active)continue;
    p.age+=dt;
    if(p.age<p.delay)continue;
    if(p.age-p.delay>=p.life){p.active=false;continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    p.vx*=.97;p.vz*=.97;
    const a=p.age-p.delay;
    const fadeIn=smooth(0,.12,a),fadeOut=1-smooth(p.life*.45,p.life,a);
    const al=fadeIn*fadeOut;
    const i3=i*3;
    pPos[i3]=p.x;pPos[i3+1]=p.y;pPos[i3+2]=p.z;
    pCol[i3]=p.r;pCol[i3+1]=p.g;pCol[i3+2]=p.b;
    pSize[i]=p.size;pAlpha[i]=al;
  }

  /* integrate rings */
  for(const r of rings){
    if(!r.active)continue;
    r.age+=dt;
    if(r.age>=r.life){r.active=false;r.m.visible=false;continue;}
    r.m.material.uniforms.uAge.value=r.age;
    r.m.material.uniforms.uLife.value=r.life;
  }
}

/* =====================================================================
   CAMERA — cinematic drift + damped manual orbit/zoom
   ===================================================================== */
const VIEW_TARGET=V(0,.46,3.0);
const CINE=new THREE.CatmullRomCurve3([
  V(0.0,.48,-6.5),V(.42,.46,-3.0),V(0.0,.44,.6),V(-.42,.46,-3.0)
],true,'catmullrom',.5);
const orbit={az:0,el:.02,dist:9.5,tAz:0,tEl:.02,tDist:9.5};
let cineBlend=1,cineWanted=1,cineOffset=0,paused=false;
const cinePos=new THREE.Vector3(),cineTar=new THREE.Vector3();
const manualPos=new THREE.Vector3(),finalTar=new THREE.Vector3();
function orbitFromCamera(p){
  const d=p.clone().sub(VIEW_TARGET);
  orbit.dist=clamp(d.length(),3.5,18);
  orbit.az=Math.atan2(d.x,d.z);
  orbit.el=clamp(Math.asin(clamp(d.y/orbit.dist,-1,1)),-.03,.6);
  orbit.tAz=orbit.az;orbit.tEl=orbit.el;orbit.tDist=orbit.dist;
}
function updateCamera(dt,t){
  const ph=TAU*((t+cineOffset)/CYCLE);
  CINE.getPointAt((((t+cineOffset)/CYCLE)%1+1)%1,cinePos);
  cineTar.set(Math.sin(ph*1.3)*.18,.46+Math.sin(ph)*.04,6.0);
  const k=1-Math.pow(.002,dt);
  cineBlend+=(cineWanted-cineBlend)*k;
  orbit.az+=(orbit.tAz-orbit.az)*k;
  orbit.el+=(orbit.tEl-orbit.el)*k;
  orbit.dist+=(orbit.tDist-orbit.dist)*k;
  const ce=Math.cos(orbit.el);
  manualPos.set(
    VIEW_TARGET.x+orbit.dist*ce*Math.sin(orbit.az),
    VIEW_TARGET.y+orbit.dist*Math.sin(orbit.el),
    VIEW_TARGET.z+orbit.dist*ce*Math.cos(orbit.az));
  camera.position.copy(manualPos).lerp(cinePos,cineBlend);
  finalTar.copy(VIEW_TARGET).lerp(cineTar,cineBlend);
  camera.lookAt(finalTar);camera.updateMatrixWorld();
}

/* ---------- interaction ---------- */
const cnv=renderer.domElement;
let dragging=false,lastX=0,lastY=0,pinchDist=0;
function takeControl(){
  if(cineBlend>.02)orbitFromCamera(camera.position);
  cineWanted=0;document.getElementById('btnCine').classList.remove('active');
}
cnv.addEventListener('pointerdown',e=>{
  dragging=true;lastX=e.clientX;lastY=e.clientY;cnv.classList.add('dragging');takeControl();
  try{cnv.setPointerCapture(e.pointerId);}catch(err){}
});
cnv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
  orbit.tAz-=dx*.0040;orbit.tEl=clamp(orbit.tEl+dy*.0028,-.03,.6);
});
function endDrag(){dragging=false;cnv.classList.remove('dragging');}
cnv.addEventListener('pointerup',endDrag);cnv.addEventListener('pointercancel',endDrag);
cnv.addEventListener('wheel',e=>{e.preventDefault();takeControl();
  orbit.tDist=clamp(orbit.tDist*Math.exp(e.deltaY*.0011),3.5,18);},{passive:false});
cnv.addEventListener('touchstart',e=>{
  if(e.touches.length===2){pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
    e.touches[0].clientY-e.touches[1].clientY);takeControl();}
},{passive:true});
cnv.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&pinchDist){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    orbit.tDist=clamp(orbit.tDist*pinchDist/Math.max(d,1),3.5,18);pinchDist=d;e.preventDefault();
  }
},{passive:false});

/* ---------- buttons ---------- */
const btnCine=document.getElementById('btnCine'),btnReset=document.getElementById('btnReset'),
      btnPause=document.getElementById('btnPause'),btnSound=document.getElementById('btnSound');
btnCine.addEventListener('click',()=>{
  if(cineWanted<.5){orbitFromCamera(camera.position);cineWanted=1;}
  else{orbitFromCamera(camera.position);cineWanted=0;}
  btnCine.classList.toggle('active',cineWanted>.5);
});
btnReset.addEventListener('click',()=>{
  cineOffset=-sceneTime;orbit.az=orbit.tAz=0;orbit.el=orbit.tEl=.02;orbit.dist=orbit.tDist=9.5;
  cineWanted=1;btnCine.classList.add('active');
});
btnPause.addEventListener('click',()=>{
  paused=!paused;btnPause.classList.toggle('active',paused);
  btnPause.innerHTML='<span class="dot"></span>'+(paused?'Paused':'Pause');
});

/* ---------- UI auto-fade ---------- */
const ui=document.getElementById('ui');
let lastActivity=performance.now();
function wake(){lastActivity=performance.now();ui.classList.remove('hidden');}
window.addEventListener('pointermove',wake,{passive:true});
window.addEventListener('pointerdown',wake,{passive:true});
window.addEventListener('wheel',wake,{passive:true});
window.addEventListener('keydown',wake);
window.addEventListener('focusin',wake);

/* =====================================================================
   PROCEDURAL SOUND — Web Audio, initially muted, gesture-gated
   ===================================================================== */
let AC=null,master=null,soundEnabled=false,tickTimer=null,nextTick=0;
function noiseBuffer(sec){
  const len=Math.floor(AC.sampleRate*sec),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=RNG()*2-1;return buf;
}
function initAudio(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}
  catch(err){console.warn('[audio] unavailable',err);return;}
  master=AC.createGain();master.gain.value=.0001;master.connect(AC.destination);
  const nb=noiseBuffer(3);
  /* soft water movement */
  const water=AC.createBufferSource();water.buffer=nb;water.loop=true;
  const wf=AC.createBiquadFilter();wf.type='bandpass';wf.frequency.value=460;wf.Q.value=.6;
  const wg=AC.createGain();wg.gain.value=.06;
  const wl=AC.createOscillator();wl.frequency.value=.11;const wlg=AC.createGain();wlg.gain.value=.035;
  wl.connect(wlg);wlg.connect(wg.gain);water.connect(wf);wf.connect(wg);wg.connect(master);
  water.start();wl.start();
  /* night insects: a quiet, restless high trill */
  const ins=AC.createBufferSource();ins.buffer=nb;ins.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4300;bp.Q.value=7;
  const ig=AC.createGain();ig.gain.value=.018;
  const il=AC.createOscillator();il.frequency.value=7.3;const ilg=AC.createGain();ilg.gain.value=.014;
  il.connect(ilg);ilg.connect(ig.gain);ins.connect(bp);bp.connect(ig);ig.connect(master);
  ins.start();il.start();
  nextTick=AC.currentTime+1.5;
  tickTimer=setInterval(scheduleDrops,120);
  document.getElementById('soundHint').classList.add('gone');
}
function dropletSound(when){
  const f=700+RNG()*900;
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(f,when);
  o.frequency.exponentialRampToValueAtTime(f*.55,when+.12);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,when);
  g.gain.exponentialRampToValueAtTime(.045+RNG()*.03,when+.005);
  g.gain.exponentialRampToValueAtTime(.0001,when+.20+RNG()*.1);
  o.connect(g);g.connect(master);o.start(when);o.stop(when+.35);
}
function scheduleDrops(){
  if(!AC||!soundEnabled)return;
  while(nextTick<AC.currentTime+.4){dropletSound(nextTick);nextTick+=2.2+RNG()*4.6;}
}
btnSound.addEventListener('click',()=>{
  if(!AC)initAudio();if(!AC)return;
  soundEnabled=!soundEnabled;
  if(AC.state==='suspended')AC.resume();
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(soundEnabled?.30:.0001,AC.currentTime,.35);
  btnSound.classList.toggle('active',soundEnabled);
  btnSound.innerHTML='<span class="dot"></span>'+(soundEnabled?'Sound on':'Sound off');
});
window.addEventListener('pointerdown',()=>document.getElementById('soundHint').classList.add('gone'),{once:true});

/* ---------- resize ---------- */
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

/* ---------- main loop ---------- */
let lastFrame=performance.now(),simAcc=0;
const FIXED=1/60;
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastFrame)/1000,.1);lastFrame=now;
  if(!paused){
    simAcc+=dt;let steps=0;
    while(simAcc>=FIXED&&steps<6){stepSim(FIXED);simAcc-=FIXED;steps++;}
    if(steps>=6)simAcc=0;
  }
  const t=sceneTime;
  const ph=TAU*t/CYCLE;
  const tide=Math.sin(ph-.5)*.012;
  water.position.y=WATER_Y+tide;
  waterUniforms.uTime.value=t;
  waterUniforms.uWaterY.value=WATER_Y+tide;
  waterUniforms.uCam.value.copy(camera.position);

  /* feed the strongest disturbances to the water shader */
  feed.sort((a,b)=>b.intensity-a.intensity);
  const n=Math.min(feed.length,DIST_MAX);
  for(let i=0;i<DIST_MAX;i++){
    if(i<n){const f=feed[i];disturbVecs[i].set(f.x,f.z,f.intensity,f.radius);}
    else disturbVecs[i].set(0,0,0,1);
  }
  waterUniforms.uCount.value=n;feed.length=0;

  /* bio point lights decay */
  for(const b of bioLights){
    if(b.life>0){b.life=Math.max(0,b.life-dt/(b.lifeTime||.5)*b.max);b.l.intensity=b.life;}
    else b.l.intensity=0;
  }
  window.__starMat.uniforms.uTime.value=t;

  /* sync particle buffers (inactive motes are fully transparent) */
  for(let i=0;i<P_MAX;i++){
    if(!particles[i].active){pAlpha[i]=0;pSize[i]=0;}
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.aColor.needsUpdate=true;
  pGeo.attributes.aSize.needsUpdate=true;
  pGeo.attributes.aAlpha.needsUpdate=true;
  for(let i=0;i<DROP_N;i++){
    const d=drops[i];if(d.active){dPos[i*3]=d.x;dPos[i*3+1]=d.y;dPos[i*3+2]=d.z;dAlpha[i]=1;}
    else dAlpha[i]=0;
  }
  dGeo.attributes.position.needsUpdate=true;dGeo.attributes.aAlpha.needsUpdate=true;

  updateCamera(dt,t);
  renderer.render(scene,camera);
  if(performance.now()-lastActivity>9000&&!ui.classList.contains('hidden'))ui.classList.add('hidden');
}
window.addEventListener('error',e=>{
  const err=document.getElementById('err');
  err.style.display='block';err.textContent+=(err.textContent?'\n':'')+e.message;
});

/* expose a small debug surface for verification (no external deps) */
window.__mangrove={
  get t(){return sceneTime;},set t(v){sceneTime=v;},
  get paused(){return paused;},set paused(v){paused=v;},
  set cine(v){cineWanted=v?1:0;},
  camera,renderer,scene,
  snap:()=>({t:+sceneTime.toFixed(2),phase:+(sceneTime%CYCLE).toFixed(2),
    cam:[+camera.position.x.toFixed(2),+camera.position.y.toFixed(2),+camera.position.z.toFixed(2)],
    activeMotes:particles.filter(p=>p.active).length,
    activeRings:rings.filter(r=>r.active).length,calls:renderer.info.render.calls}),
  drop:()=>spawnDrop()
};

try{
  updateCamera(.016,0);
  /* prime one frame of sim so the opening is populated deterministically */
  for(let i=0;i<40;i++)stepSim(FIXED);
  renderer.shadowMap.needsUpdate=true;
  requestAnimationFrame(animate);
  window.__mangroveReady=true;
  console.log('[mangrove] ready — three r'+THREE.REVISION+', leaves '+leafData.length+
    ', oysters '+oysterData.length+', eddies '+eddies.length+', draws '+renderer.info.render.calls);
}catch(err){
  console.error('[mangrove] fatal',err);
  const e=document.getElementById('err');e.style.display='block';e.textContent='Fatal: '+err.message;
}
