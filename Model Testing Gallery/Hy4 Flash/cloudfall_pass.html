<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}

button:hover,button:focus{background:rgba(40,60,82,.62);border-color:rgba(240,248,255,.72);outline:none}

#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a1018;color:#9fb0c2;font-size:10px;letter-spacing:.42em;z-index:10;transition:opacity .9s ease}
#loader.gone{opacity:0;pointer-events:none}
@media(max-width:640px){#title{left:18px;bottom:20px}#controls{right:14px;bottom:18px;flex-wrap:wrap;justify-content:flex-end;max-width:58vw}button{padding:7px 8px;font-size:8px}#hint{display:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<body>
<div id="loader">CLOUDFALL PASS</div>
<div id="ui">
  <div id="title"><h1>CLOUDFALL PASS</h1><p>RIDGE STATION &nbsp;·&nbsp; 04:12 &nbsp;·&nbsp; ALPINE</p></div>
  <div id="hint">DRAG TO ORBIT &nbsp;·&nbsp; SCROLL TO ZOOM</div>
  <div id="controls">
    <button id="btnCine" title="Resume the scripted aerial arc">CINEMATIC</button>
    <button id="btnReset" title="Return to the opening framing">RESET VIEW</button>
    <button id="btnPause" title="Freeze scene time (camera stays free)">PAUSE</button>
    <button id="btnSound" title="Enable procedural ridge audio">SOUND: OFF</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

/* ================= deterministic foundation (seed 1337) ================= */
const SEED = 1337;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(SEED);
const perm = new Uint8Array(512);
{ const p=new Uint8Array(256); for(let i=0;i<256;i++)p[i]=i; for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=p[i];p[i]=p[j];p[j]=t;} for(let i=0;i<512;i++)perm[i]=p[i&255]; }
function h2(ix,iy){return perm[(perm[ix&255]+(iy&255))&255]/255;}
function noise2(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=h2(ix,iy),b=h2(ix+1,iy),c=h2(ix,iy+1),d=h2(ix+1,iy+1);return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;}
function fbm(x,y,oct){let s=0,a=.5,f=1,n=0;for(let i=0;i<(oct||4);i++){s+=a*noise2(x*f,y*f);n+=a;a*=.5;f*=2;}return (s/n)*2-1;}
function pn(x,y,per){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const X=((ix%per)+per)%per,Y=((iy%per)+per)%per,X2=(X+1)%per,Y2=(Y+1)%per;const a=h2(X,Y),b=h2(X2,Y),c=h2(X,Y2),d=h2(X2,Y2);return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;}
const sq=v=>v*v;
function smoothstep(a,b,x){let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}

const SIZE=520, SEG=220, HM=384, HMIN=-90, HRANGE=180;
function heightAt(x,z){
  const rolling=15*fbm(x*.0055+13.1,z*.0055-7.7,4);
  const warp=12*fbm(x*.003+31.2,z*.003-12.4,3);
  const dx=x-warp;
  const ridge=Math.exp(-Math.pow(Math.abs(dx/31),1.35));
  const peakField=32+12*Math.exp(-sq((z+64)/31))+14*Math.exp(-sq((z-68)/34));
  const saddle=22*Math.exp(-sq(z/27));
  let h=12+rolling+ridge*(peakField-saddle);
  const lee=smoothstep(18,150,x);
  h-=lee*(58+12*fbm(x*.008+5.5,z*.008+2.1,3));
  h+=10*Math.exp(-sq((x+100)/26))*(.7+.3*fbm(x*.01,z*.01,2));
  h+=6*fbm(x*.025,z*.025,4)*(.45+.55*ridge);
  h+=1.8*fbm(x*.11,z*.11,3);
  return h;
}
const hData=new Uint8Array(HM*HM);
for(let j=0;j<HM;j++)for(let i=0;i<HM;i++){
  const x=-SIZE*.5+i/(HM-1)*SIZE, z=-SIZE*.5+j/(HM-1)*SIZE;
  hData[j*HM+i]=clamp(Math.round((heightAt(x,z)-HMIN)/HRANGE*255),0,255);
}
function heightFast(x,z){
  const u=clamp((x+SIZE*.5)/SIZE*HM-.5,0,HM-1.001), v=clamp((z+SIZE*.5)/SIZE*HM-.5,0,HM-1.001);
  const ix=u|0, iy=v|0, fx=u-ix, fy=v-iy, i0=iy*HM+ix;
  const a=hData[i0],b=hData[i0+1],c=hData[i0+HM],d=hData[i0+HM+1];
  return ((a+(b-a)*fx)+((c+(d-c)*fx)-(a+(b-a)*fx))*fy)/255*HRANGE+HMIN;
}
const heightTex=new THREE.DataTexture(hData,HM,HM,THREE.RedFormat,THREE.UnsignedByteType);
heightTex.minFilter=heightTex.magFilter=THREE.LinearFilter;
heightTex.wrapS=heightTex.wrapT=THREE.ClampToEdgeWrapping;
heightTex.needsUpdate=true;

/* tileable procedural textures */
function makeCloudNoise(){
  const s=256,c=document.createElement('canvas');c.width=c.height=s;
  const ctx=c.getContext('2d'),img=ctx.createImageData(s,s),d=img.data;
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){
    const u=x/s,v=y/s;
    const r=pn(u*8,v*8,8)*.52+pn(u*16,v*16,16)*.29+pn(u*32,v*32,32)*.13+pn(u*64,v*64,64)*.06;
    const g=pn(u*4+.31,v*4+.17,4)*.58+pn(u*8+.3,v*8+.2,8)*.28+pn(u*16,v*16,16)*.14;
    const b=pn(u*32+.7,v*32+.2,32)*.6+pn(u*64,v*64,64)*.4;
    const k=(y*s+x)*4;d[k]=r*255;d[k+1]=g*255;d[k+2]=b*255;d[k+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;t.generateMipmaps=true;return t;
}
function makeGroundNormal(){
  const s=256,c=document.createElement('canvas');c.width=c.height=s;
  const ctx=c.getContext('2d'),img=ctx.createImageData(s,s),d=img.data,H=new Float32Array(s*s);
  for(let y=0;y<s;y++)for(let x=0;x<s;x++)H[y*s+x]=pn(x/s*8,y/s*8,8)*.55+pn(x/s*24,y/s*24,24)*.3+pn(x/s*64,y/s*64,64)*.15;
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){
    const l=H[y*s+(x+s-1)%s],r=H[y*s+(x+1)%s],u=H[((y+s-1)%s)*s+x],dn=H[((y+1)%s)*s+x];
    let nx=(l-r)*3.2,ny=(u-dn)*3.2,nz=1;const il=1/Math.hypot(nx,ny,nz),k=(y*s+x)*4;
    d[k]=(nx*il*.5+.5)*255;d[k+1]=(ny*il*.5+.5)*255;d[k+2]=(nz*il*.5+.5)*255;d[k+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(24,24);t.anisotropy=4;return t;
}
function makeCorrugated(){
  const w=256,h=128,c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d'),img=ctx.createImageData(w,h),d=img.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const u=x/w, ph=u*Math.PI*2*11;
    const nx=Math.cos(ph)*.78, k=(y*w+x)*4;
    const streak=.5+.5*pn(u*6,y/h*3,6);
    d[k]=(nx*.5+.5)*255;d[k+1]=128+(streak-.5)*18;d[k+2]=245;d[k+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,1);return t;
}
function makePanelTexture(){
  const s=128,c=document.createElement('canvas');c.width=c.height=s;
  const ctx=c.getContext('2d');ctx.fillStyle='#101d2d';ctx.fillRect(0,0,s,s);
  ctx.strokeStyle='#48627c';ctx.lineWidth=2;
  for(let i=0;i<=4;i++){ctx.beginPath();ctx.moveTo(i*s/4,0);ctx.lineTo(i*s/4,s);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*s/4);ctx.lineTo(s,i*s/4);ctx.stroke();}
  const g=ctx.createLinearGradient(0,0,s,s);g.addColorStop(0,'rgba(150,190,225,.16)');g.addColorStop(.5,'rgba(10,20,40,.12)');g.addColorStop(1,'rgba(170,205,235,.2)');ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeSoftDisc(){
  const s=128,c=document.createElement('canvas');c.width=c.height=s;
  const ctx=c.getContext('2d'),img=ctx.createImageData(s,s),d=img.data;
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){
    const r=Math.hypot((x+.5-s/2)/(s/2),(y+.5-s/2)/(s/2));
    let a=clamp(1-r,0,1);a=a*a*(3-2*a)*(.7+.3*pn(x/s*12,y/s*12,12));
    const k=(y*s+x)*4;d[k]=255;d[k+1]=255;d[k+2]=255;d[k+3]=a*255;
  }
  ctx.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const cloudNoise=makeCloudNoise(),groundNormal=makeGroundNormal(),corrugated=makeCorrugated(),panelTex=makePanelTexture(),softDisc=makeSoftDisc();

/* ================= renderer / scene ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.14;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement,document.getElementById('ui'));

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x93a7bb,0.00105);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.5,1400);

const SUN=new THREE.Vector3(.88,.075,-.30).normalize();
const sunLight=new THREE.DirectionalLight(0xffd2a0,3.1);
sunLight.position.copy(SUN).multiplyScalar(300);
sunLight.target.position.set(0,10,0);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(1024,1024);
sunLight.shadow.camera.left=-115;sunLight.shadow.camera.right=115;sunLight.shadow.camera.top=115;sunLight.shadow.camera.bottom=-115;
sunLight.shadow.camera.near=20;sunLight.shadow.camera.far=700;
sunLight.shadow.bias=-0.0006;sunLight.shadow.normalBias=0.9;
scene.add(sunLight,sunLight.target);
scene.add(new THREE.HemisphereLight(0xa9c8e8,0x33343a,.85));
const fill=new THREE.DirectionalLight(0x86aed8,.36);fill.position.set(-120,80,140);scene.add(fill);

/* sky dome */
const skyUniforms={uSun:{value:SUN},uTop:{value:new THREE.Color(0x142c4a)},uHorizon:{value:new THREE.Color(0xd9905e)},uLow:{value:new THREE.Color(0x46596c)},uTime:{value:0}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,48,32),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyUniforms,
  vertexShader:`varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);gl_Position.z=gl_Position.w;}`,
  fragmentShader:`
    uniform vec3 uSun,uTop,uHorizon,uLow;uniform float uTime;varying vec3 vDir;
    void main(){
      float h=vDir.y;
      float up=smoothstep(-0.02,0.21,h);
      vec3 col=mix(uHorizon,uTop,up);
      col=mix(uLow,col,smoothstep(-0.22,0.01,h));
      float sd=max(dot(normalize(vDir),normalize(uSun)),0.0);
      col+=vec3(1.0,0.55,0.28)*pow(sd,42.0)*0.62;
      col+=vec3(1.0,0.88,0.70)*pow(sd,1600.0)*2.2;
      float band=exp(-pow((h-0.012)/0.055,2.0));
      col=mix(col,vec3(0.86,0.68,0.52),band*0.18*(0.6+0.4*sin(vDir.x*7.0+uTime*0.01)));
      gl_FragColor=vec4(col,1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
sky.frustumCulled=false;scene.add(sky);

/* ================= terrain ================= */
const terrainGeo=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);
terrainGeo.rotateX(-Math.PI/2);
const tp=terrainGeo.attributes.position;
for(let i=0;i<tp.count;i++)tp.setY(i,heightAt(tp.getX(i),tp.getZ(i)));
terrainGeo.computeVertexNormals();
{
  const n=terrainGeo.attributes.normal,col=new Float32Array(tp.count*3);
  const cRockA=new THREE.Color(0x45566a),cRockB=new THREE.Color(0x9b8b75),cScree=new THREE.Color(0x6d6b66),cSnow=new THREE.Color(0xdfe8ee),cValley=new THREE.Color(0x3c514c),cWarm=new THREE.Color(0xc99b71);
  const tmp=new THREE.Color();
  for(let i=0;i<tp.count;i++){
    const x=tp.getX(i),y=tp.getY(i),z=tp.getZ(i),ny=n.getY(i);
    const steep=smoothstep(.28,.70,1-ny);
    const strata=smoothstep(-.45,.5,Math.sin(y*.85+fbm(x*.035,z*.035,3)*1.7));
    tmp.copy(cRockA).lerp(cRockB,strata*.85+.08);
    tmp.lerp(cScree,steep*.68);
    const sf=clamp(n.getX(i)*SUN.x+ny*SUN.y+n.getZ(i)*SUN.z,0,1);
    tmp.lerp(cWarm,sf*sf*.30*(1-steep*.5));
    const shelter=fbm(x*.045+9,z*.045-4,3);
    const snow=smoothstep(24,52,y)*smoothstep(.82,.95,ny)*smoothstep(-.15,.4,shelter);
    tmp.lerp(cSnow,snow*.82);
    tmp.lerp(cValley,smoothstep(0,-50,y)*.55);
    const grain=.90+.16*fbm(x*.32,z*.32,2);tmp.multiplyScalar(grain);
    col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b;
  }
  terrainGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
}
const terrainMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.96,metalness:0,normalMap:groundNormal,normalScale:new THREE.Vector2(.42,.42),dithering:true});
const terrain=new THREE.Mesh(terrainGeo,terrainMat);
terrain.castShadow=false;terrain.receiveShadow=true;scene.add(terrain);

/* ================= station ================= */
const stationPos=new THREE.Vector3(2,heightAt(2,-13),-13);
const station=new THREE.Group();station.position.copy(stationPos);station.rotation.y=-0.32;station.scale.setScalar(2.2);scene.add(station);
const metal=new THREE.MeshStandardMaterial({color:0x77848d,roughness:.68,metalness:.55,normalMap:corrugated,normalScale:new THREE.Vector2(.85,.85)});
const metalDark=new THREE.MeshStandardMaterial({color:0x404b55,roughness:.75,metalness:.45,normalMap:corrugated,normalScale:new THREE.Vector2(.5,.5)});
const rustMat=new THREE.MeshStandardMaterial({color:0x8a5a42,roughness:.92,metalness:.12});
const stoneMat=new THREE.MeshStandardMaterial({color:0x767b7c,roughness:1,metalness:0});
const darkMat=new THREE.MeshStandardMaterial({color:0x141c24,roughness:.5,metalness:.2});
function box(w,h,d,mat,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||station).add(m);return m;}

/* hut: corrugated walls + folded roof */
box(5.2,2.9,3.9,metal,0,1.5,0);
box(5.35,.18,4.05,metalDark,0,.06,0);
const roofGeo=new THREE.PlaneGeometry(5.9,4.5,72,3);
{
  const p=roofGeo.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i);p.setZ(i,Math.sin(x*Math.PI*2*2.4)*.075);}
  roofGeo.computeVertexNormals();
}
const roof=new THREE.Mesh(roofGeo,metal);roof.rotation.x=-Math.PI/2+.12;roof.position.set(0,3.05,.05);roof.castShadow=true;roof.receiveShadow=true;station.add(roof);
box(5.9,.12,.16,metalDark,0,3.12,2.26);
box(5.9,.12,.16,metalDark,0,3.02,-2.26);
/* door, window, vents */
box(.95,1.85,.08,darkMat,-1.15,1.18,1.99);
box(.12,1.95,.13,metalDark,-1.75,1.25,2.02);box(.12,1.95,.13,metalDark,-.55,1.25,2.02);
box(.78,.58,.08,new THREE.MeshStandardMaterial({color:0x223849,roughness:.28,metalness:.35,emissive:0x101820,emissiveIntensity:.35}),1.35,1.85,1.99);
box(.9,.07,.12,metalDark,1.35,2.2,2.03);
box(.5,.5,.1,rustMat,1.35,.62,1.99);
/* base plinth and instrument cabinet */
box(1.1,1.2,.85,metalDark,3.25,.75,1.2);
box(1.18,.1,.92,metal,3.25,1.4,1.2);

/* guyed mast */
const mastH=11.5;
const mast=new THREE.Mesh(new THREE.CylinderGeometry(.085,.13,mastH,10),metal);mast.position.set(-3.7,mastH/2+2.1,-1.1);mast.castShadow=true;station.add(mast);
for(let k=0;k<4;k++){
  const a=k*Math.PI/2+.4;
  const ax=-3.7+Math.cos(a)*4.2, az=-1.1+Math.sin(a)*4.2;
  const start=new THREE.Vector3(-3.7,mastH+1.0,-1.1),end=new THREE.Vector3(ax,.18,az);
  const dir=end.clone().sub(start),len=dir.length();
  const cable=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,len,5),darkMat);
  cable.position.copy(start).add(end).multiplyScalar(.5);
  cable.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  station.add(cable);
  const anchor=new THREE.Mesh(new THREE.BoxGeometry(.42,.3,.42),stoneMat);anchor.position.set(ax,.15,az);anchor.castShadow=true;station.add(anchor);
}
/* mast bands */
for(let k=0;k<5;k++){const b=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.55,10),rustMat);b.position.set(-3.7,3.6+k*2.1,-1.1);station.add(b);}

/* anemometer + wind vane (animated) */
const anemo=new THREE.Group();anemo.position.set(-3.7,mastH+2.25,-1.1);station.add(anemo);
const anemoSpin=new THREE.Group();anemo.add(anemoSpin);
const cupMat=new THREE.MeshStandardMaterial({color:0xc9d0d4,roughness:.5,metalness:.6});
for(let k=0;k<3;k++){
  const a=k*Math.PI*2/3;
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,1.05,5),cupMat);
  arm.rotation.z=Math.PI/2;arm.position.set(Math.cos(a)*.52,0,Math.sin(a)*.52);
  arm.rotation.y=-a;anemoSpin.add(arm);
  const cup=new THREE.Mesh(new THREE.SphereGeometry(.15,10,8,0,Math.PI*2,0,Math.PI*.62),cupMat);
  cup.position.set(Math.cos(a)*1.05,0,Math.sin(a)*1.05);cup.rotation.y=-a+Math.PI/2;anemoSpin.add(cup);
}

const CN=2000;

function spawnParticle(i,initial){
  let x,z,y;

    x=lerp(-80,175,rnd());

    y=cloudTarget(x,z)+(Math.pow(rnd(),1.25)-.25)*22;
  }else{
    x=-90-rnd()*8;
    z=(rnd()*2-1)*100;
    y=cloudTarget(x,z)+(Math.pow(rnd(),1.25)-.3)*18;
  }

}
for(let i=0;i<CN;i++)spawnParticle(i,true);
function simStep(dt,t){
  for(let i=0;i<CN;i++){

    vz=clamp(vz,-12,12);
    const ty=cloudTarget(x,z);
    let vy=(ty-y)*.95+curlZ*1.8*lee;
    cvy[i]+=(vy-cvy[i])*.14;
    x+=vx*dt;z+=vz*dt;y+=cvy[i]*dt;
    clife[i]+=dt;
    if(x>190||Math.abs(z)>178||y<heightFast(x,z)-5||clife[i]>cmax[i]){spawnParticle(i,false);continue;}

function updateCloudParams(t){
  const phase=t%26;

  const gz=-24+50*smoothstep(2,9,phase);
  for(let i=0;i<CN;i++){
    const x=cp[i*3],y=cp[i*3+1],z=cp[i*3+2],k=i*4;
    const lee=smoothstep(12,150,x);
    let a=.44;
    a*=1-.86*lee;
    a*=smoothstep(-100,-72,x);
    a*=Math.exp(-sq(z/(85+30*lee)));
    a*=1-.45*smoothstep(135,188,x);
    a*=.72+.38*noise2(x*.045+cseed[i]*9,z*.045);
    const spill=Math.exp(-sq(z/40))*smoothstep(-8,26,x)*(1-smoothstep(85,145,x));
    a*=1+1.9*spill;
    const gzn=gz+7*fbm(x*.03,z*.03+t*.12,2);
    const gap=Math.exp(-sq((z-gzn)/22))*Math.exp(-sq((x-18)/74));
    a*=1-.97*gact*gap;
    cOff[i*3]=x;cOff[i*3+1]=y;cOff[i*3+2]=z;
    cParam[k]=csize[i]*(1+.28*lee);
    cParam[k+1]=a;
    cParam[k+2]=cseed[i];
    cParam[k+3]=.80+.70*Math.exp(-sq((x-4)/52))-.18*lee+.45*spill;

const target=new THREE.Vector3(6,58,0);

function applyCamera(dt){
  if(cinematic){
    cam.theta+=dt*.013;

    cam.tPhi=1.40+.035*Math.sin(simTime*.075);
    cam.tRadius=178+13*Math.sin(simTime*.052);

  const k=1-Math.exp(-5.5*dt);

  cam.phi+=(cam.tPhi-cam.phi)*k;
  cam.radius+=(cam.tRadius-cam.radius)*k;
  const sp=Math.sin(cam.phi);
  camera.position.set(target.x+cam.radius*sp*Math.sin(cam.theta),target.y+cam.radius*Math.cos(cam.phi),target.z+cam.radius*sp*Math.cos(cam.theta));

let audioCtx=null,master=null,soundOn=false;

  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  master=audioCtx.createGain();master.gain.value=0;master.connect(audioCtx.destination);
  const len=audioCtx.sampleRate*3,buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=buf.getChannelData(0);
  let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2;}
  const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
  const bp=audioCtx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=520;bp.Q.value=.55;
  const lp=audioCtx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;
  const wg=audioCtx.createGain();wg.gain.value=.34;
  src.connect(bp);bp.connect(lp);lp.connect(wg);wg.connect(master);src.start();
  const lfo=audioCtx.createOscillator();lfo.frequency.value=.09;const lg=audioCtx.createGain();lg.gain.value=210;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
  const lfo2=audioCtx.createOscillator();lfo2.frequency.value=.13;const lg2=audioCtx.createGain();lg2.gain.value=.13;lfo2.connect(lg2);lg2.connect(wg.gain);lfo2.start();
  /* mast cable whistle */
  const wo=audioCtx.createOscillator();wo.type='sine';wo.frequency.value=2180;
  const wbp=audioCtx.createBiquadFilter();wbp.type='bandpass';wbp.frequency.value=2180;wbp.Q.value=18;
  const wg2=audioCtx.createGain();wg2.gain.value=.012;
  wo.connect(wbp);wbp.connect(wg2);wg2.connect(master);wo.start();
  const wob=audioCtx.createOscillator();wob.frequency.value=.21;const wobg=audioCtx.createGain();wobg.gain.value=95;wob.connect(wobg);wobg.connect(wo.frequency);wob.start();
  const trem=audioCtx.createOscillator();trem.frequency.value=.32;const tg=audioCtx.createGain();tg.gain.value=.010;const tbase=audioCtx.createConstantSource();tbase.offset.value=.013;
  trem.connect(tg);tg.connect(wg2.gain);tbase.connect(wg2.gain);trem.start();tbase.start();
  /* hut panel vibration */
  const po=audioCtx.createOscillator();po.type='sawtooth';po.frequency.value=68;
  const plp=audioCtx.createBiquadFilter();plp.type='lowpass';plp.frequency.value=190;
  const pg=audioCtx.createGain();pg.gain.value=.022;
  po.connect(plp);plp.connect(pg);pg.connect(master);po.start();
  const pt=audioCtx.createOscillator();pt.frequency.value=1.7;const ptg=audioCtx.createGain();ptg.gain.value=.011;pt.connect(ptg);ptg.connect(pg.gain);pt.start();
}

  master.gain.setTargetAtTime(soundOn?.55:0,audioCtx.currentTime,.35);

  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  renderer.setSize(innerWidth,innerHeight);
}
window.addEventListener('resize',resize);
let simTime=0,last=performance.now(),acc=0,firstFrame=true;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>.12)dt=.12;
  if(!paused){
    simTime+=dt;acc+=dt;
    let steps=0;
    while(acc>=1/60&&steps<4){simStep(1/60,simTime);acc-=1/60;steps++;}
    if(steps===4)acc=0;
  }
  updateCloudParams(simTime);
  cloudUniforms.uTime.value=simTime;
  skyUniforms.uTime.value=simTime;
  grassTime.value=simTime;
  cloudUniforms.uSunView.value.copy(SUN).transformDirection(camera.matrixWorldInverse);
  if(!paused){anemoSpin.rotation.y+=dt*2.6;vane.rotation.y=-.5+Math.sin(simTime*.27)*.16;}
  applyCamera(dt);
  cloudUniforms.uSunView.value.copy(SUN).transformDirection(camera.matrixWorldInverse);
  renderer.render(scene,camera);
  if(firstFrame){firstFrame=false;const l=document.getElementById('loader');l.classList.add('gone');setTimeout(()=>l.remove(),1000);poke();}
}
applyCamera(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
