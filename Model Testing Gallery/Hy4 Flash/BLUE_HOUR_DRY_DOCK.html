<script type="module">
import * as THREE from 'three';

/* =====================================================================
   BLUE HOUR DRY DOCK — single-file scene
   ===================================================================== */
const PI = Math.PI, TAU = PI * 2;
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b - a) * t;
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const V = (x,y,z) => new THREE.Vector3(x,y,z);

function mulberry32(seed){ let s = seed >>> 0; return function(){ s |= 0; s = s + 0x6D2B79F5 | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const RNG = mulberry32(1337);
const rand = (a,b) => a + RNG() * (b-a);
const randInt = (a,b) => a + Math.floor(RNG() * (b-a+1));
function hash2(x,z){ const n = Math.sin(x*127.1 + z*311.7) * 43758.5453123; return n - Math.floor(n); }
function vnoise(x,z){ const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  return lerp(lerp(hash2(xi,zi),hash2(xi+1,zi),u), lerp(hash2(xi,zi+1),hash2(xi+1,zi+1),u), v)*2-1; }
function fbm(x,z,oct){ let s=0,a=0.5,f=1; oct=oct||4; for(let i=0;i<oct;i++){ s+=a*vnoise(x*f,z*f); f*=2.03; a*=0.5; } return s; }

const LOOP = 50.0;                       // cinematic loop, seconds
const SHIP = { bow:-52, stern:52, L:104, halfBeam:7.8, keel:2.5, deck:13.6, WL:7.2 };
const DOCK = { half:17.5, zMin:-62, zMax:62 };

const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance',
    alpha:false, stencil:false, preserveDrawingBuffer:false });
} catch (e) {
  const err = document.getElementById('err');
  err.style.display='block'; err.textContent='WebGL unavailable: '+e.message; throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
renderer.setSize(window.innerWidth,window.innerHeight,false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const FOG_COL = new THREE.Color(0x243b56);
scene.fog = new THREE.FogExp2(FOG_COL,0.0068);
const world = new THREE.Group(); scene.add(world);
const camera = new THREE.PerspectiveCamera(43,window.innerWidth/window.innerHeight,0.15,500);

/* ---------- procedural canvas textures ---------- */
function texture(w,h,draw,repX,repY,srgb){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(repX) t.repeat.set(repX,repY||repX);
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  if(srgb!==false) t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function speckle(g,w,h,n,cols,r0,r1){
  for(let i=0;i<n;i++){ g.fillStyle=cols[randInt(0,cols.length-1)];
    const r=rand(r0,r1); g.beginPath();
    g.ellipse(rand(0,w),rand(0,h),r,r*rand(.45,1.4),rand(0,PI),0,TAU); g.fill(); }
}
const TEX={};
(function buildTextures(){
  // hull plating: pale base, dark strake seams, rivets, vertical rust drips
  TEX.plate = texture(512,512,(g,w,h)=>{
    g.fillStyle='#d6d9d8'; g.fillRect(0,0,w,h);
    speckle(g,w,h,7000,['#c5c9c8','#e2e4e2','#b9bebd','#d0d4d2'],.5,2.4);
    // horizontal strakes
    for(let j=0;j<8;j++){
      const y=j*64+16;
      g.fillStyle='rgba(72,78,80,.42)'; g.fillRect(0,y,w,2.2);
      g.fillStyle='rgba(255,255,255,.20)'; g.fillRect(0,y+2.4,w,1.4);
      // rivets along strake
      for(let x=8;x<w;x+=13){
        g.fillStyle='rgba(70,74,74,.36)'; g.beginPath(); g.arc(x,y+8,1.5,0,TAU); g.fill();
      }
    }
    // vertical butt joints, staggered
    for(let j=0;j<8;j++){
      const y=j*64+18;
      for(let k=0;k<3;k++){
        const x=(k*171+(j%2)*85+rand(-12,12))%w;
        g.fillStyle='rgba(66,72,74,.36)'; g.fillRect(x,y,2.2,60);
        for(let yy=y+5;yy<y+60;yy+=10){ g.fillStyle='rgba(58,62,62,.4)';
          g.beginPath(); g.arc(x-5,yy,1.3,0,TAU); g.arc(x+7,yy,1.3,0,TAU); g.fill(); }
      }
    }
    // rust drips
    for(let i=0;i<120;i++){
      const x=rand(0,w), y=rand(0,h*0.7), len=rand(12,110), wd=rand(1,5);
      const gr=g.createLinearGradient(x,y,x,y+len);
      gr.addColorStop(0,'rgba(126,69,36,'+rand(.08,.30)+')');
      gr.addColorStop(1,'rgba(126,69,36,0)');
      g.fillStyle=gr; g.fillRect(x,y,wd,len);
    }
    for(let i=0;i<30;i++){ const x=rand(0,w),y=rand(0,h),r=rand(8,38);
      const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,'rgba(104,62,38,'+rand(.04,.16)+')'); gr.addColorStop(1,'rgba(104,62,38,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
  },4,1);
  // damp concrete
  TEX.concrete = texture(256,256,(g,w,h)=>{
    g.fillStyle='#9a9d98'; g.fillRect(0,0,w,h);
    speckle(g,w,h,11000,['#8b8e8a','#a9aca7','#7d817e','#b5b7b1','#6f7472'],.5,2.8);
    for(let i=0;i<70;i++){ g.strokeStyle='rgba(48,56,60,'+rand(.04,.16)+')'; g.lineWidth=rand(.5,2);
      const x=rand(0,w),y=rand(0,h); g.beginPath(); g.moveTo(x,y);
      for(let k=0;k<4;k++) g.lineTo(x+rand(-18,18),y+rand(-18,18)); g.stroke(); }
    for(let i=0;i<34;i++){ const x=rand(0,w),y=rand(0,h),r=rand(8,46);
      const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,'rgba(46,62,70,'+rand(.05,.20)+')'); gr.addColorStop(1,'rgba(46,62,70,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
    // shutter seams
    for(let j=0;j<4;j++){ g.fillStyle='rgba(60,68,70,.16)'; g.fillRect(0,j*64,w,2); }
  },3,3);
  // antifouling / chipped red oxide
  TEX.antifoul = texture(256,256,(g,w,h)=>{
    g.fillStyle='#9a4736'; g.fillRect(0,0,w,h);
    speckle(g,w,h,9000,['#8a3d2e','#a8513c','#743327','#b05f45','#5f3028'],.6,3.2);
    for(let i=0;i<200;i++){ g.fillStyle='rgba('+randInt(110,150)+','+randInt(120,140)+','+randInt(115,130)+','+rand(.06,.28)+')';
      g.beginPath(); g.ellipse(rand(0,w),rand(0,h),rand(1,7),rand(1,4),rand(0,PI),0,TAU); g.fill(); }
    for(let i=0;i<60;i++){ const x=rand(0,w),y=rand(0,h),len=rand(10,80);
      const gr=g.createLinearGradient(x,y,x,y+len);
      gr.addColorStop(0,'rgba(52,34,28,.28)'); gr.addColorStop(1,'rgba(52,34,28,0)');
      g.fillStyle=gr; g.fillRect(x,y,rand(1,4),len); }
  },3,2);
  // oxidised steel for dock hardware
  TEX.steel = texture(256,256,(g,w,h)=>{
    g.fillStyle='#656b6c'; g.fillRect(0,0,w,h);
    speckle(g,w,h,8000,['#585e60','#767c7c','#4c5254','#8d765c','#6a5744'],.5,2.6);
    for(let i=0;i<130;i++){ const x=rand(0,w),y=rand(0,h),r=rand(3,22);
      const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,'rgba(126,68,34,'+rand(.05,.26)+')'); gr.addColorStop(1,'rgba(126,68,34,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
  },2,2);
  // radial alpha sprite for glow / shadow / steam
  TEX.radial = texture(128,128,(g,w,h)=>{
    const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.38,'rgba(255,255,255,.5)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
  },1,1);
  // steel grating
  TEX.grate = texture(64,64,(g,w,h)=>{
    g.fillStyle='#3a4145'; g.fillRect(0,0,w,h);
    g.fillStyle='#7d8688';
    for(let x=0;x<w;x+=8) g.fillRect(x,0,3,h);
    for(let y=0;y<h;y+=16) g.fillRect(0,y,w,3);
  },2,2);
})();

/* ---------- material palette ---------- */
const M={};
M.hull = new THREE.MeshStandardMaterial({ map:TEX.plate, vertexColors:true, roughness:.60, metalness:.30,
  side:THREE.DoubleSide, envMapIntensity:.85, bumpMap:TEX.plate, bumpScale:.012 });
M.deck = new THREE.MeshStandardMaterial({ map:TEX.plate, color:0x6c7576, roughness:.83, metalness:.16,
  side:THREE.DoubleSide, bumpMap:TEX.plate, bumpScale:.01 });
M.antifoul = new THREE.MeshStandardMaterial({ map:TEX.antifoul, bumpMap:TEX.antifoul, bumpScale:.02,
  color:0xb98d7d, roughness:.94, metalness:0 });
M.steel = new THREE.MeshStandardMaterial({ map:TEX.steel, bumpMap:TEX.steel, bumpScale:.016,
  color:0x949b98, roughness:.52, metalness:.72, envMapIntensity:.95 });
M.steelDark = new THREE.MeshStandardMaterial({ map:TEX.steel, bumpMap:TEX.steel, bumpScale:.016,
  color:0x596063, roughness:.66, metalness:.6, envMapIntensity:.8 });
M.rust = new THREE.MeshStandardMaterial({ color:0x7a4429, roughness:.96, metalness:.1,
  map:TEX.steel, bumpMap:TEX.steel, bumpScale:.02 });
M.bronze = new THREE.MeshStandardMaterial({ color:0xb18b4d, roughness:.30, metalness:.95,
  envMapIntensity:1.5, side:THREE.DoubleSide });
M.bronzeDark = new THREE.MeshStandardMaterial({ color:0x6d5730, roughness:.44, metalness:.9, envMapIntensity:1.2 });
M.concrete = new THREE.MeshStandardMaterial({ map:TEX.concrete, bumpMap:TEX.concrete, bumpScale:.038,
  color:0x909a9c, roughness:.96, metalness:0 });
M.concreteDark = new THREE.MeshStandardMaterial({ map:TEX.concrete, bumpMap:TEX.concrete, bumpScale:.035,
  color:0x5d686b, roughness:.98 });
M.timber = new THREE.MeshStandardMaterial({ color:0x574734, roughness:.94 });
M.rail = new THREE.MeshStandardMaterial({ color:0x9aa3a1, roughness:.46, metalness:.72, envMapIntensity:1.0 });
M.grate = new THREE.MeshStandardMaterial({ map:TEX.grate, color:0x8a9290, roughness:.7, metalness:.55,
  side:THREE.DoubleSide });
M.glass = new THREE.MeshPhysicalMaterial({ color:0x162734, roughness:.16, metalness:.1, transparent:true,
  opacity:.62, envMapIntensity:1.1, clearcoat:.5, clearcoatRoughness:.2 });
M.lamp = new THREE.MeshBasicMaterial({ color:0xffd49a });
M.puddle = new THREE.MeshPhysicalMaterial({ color:0x283a48, roughness:.07, metalness:.25, transparent:true,
  opacity:.82, envMapIntensity:1.6, clearcoat:1, clearcoatRoughness:.06, depthWrite:false });
M.steam = new THREE.PointsMaterial({ map:TEX.radial, color:0xb9c9d2, size:.62, sizeAttenuation:true,
  transparent:true, opacity:.085, depthWrite:false, blending:THREE.NormalBlending });
M.spark = new THREE.PointsMaterial({ map:TEX.radial, color:0xffb354, size:.28, sizeAttenuation:true,
  transparent:true, opacity:.95, depthWrite:false, blending:THREE.AdditiveBlending });
M.shadowBlob = new THREE.MeshBasicMaterial({ map:TEX.radial, color:0x0a1520, transparent:true, opacity:.32,
  depthWrite:false });

/* ---------- helpers ---------- */
function mesh(geo,mat,parent,x,y,z,cast,receive){
  const m=new THREE.Mesh(geo,mat); m.position.set(x||0,y||0,z||0);
  m.castShadow=cast!==false; m.receiveShadow=receive!==false;
  (parent||world).add(m); return m;
}
const _a=new THREE.Vector3(),_b=new THREE.Vector3(),_mid=new THREE.Vector3();
const _up=new THREE.Vector3(0,1,0),_q=new THREE.Quaternion();
function strut(p1,p2,thick,mat,parent,square){
  _a.copy(p1);_b.copy(p2);_mid.copy(_a).add(_b).multiplyScalar(.5);
  const len=_a.distanceTo(_b);
  const g=square?new THREE.BoxGeometry(thick,len,thick*.72):new THREE.CylinderGeometry(thick,thick,len,7,1);
  const m=mesh(g,mat,parent,_mid.x,_mid.y,_mid.z,true,true);
  _q.setFromUnitVectors(_up,_b.clone().sub(_a).normalize()); m.quaternion.copy(_q); return m;
}
function beams(pairs,thick,mat,parent,radial){
  if(!pairs.length) return null;
  const g=new THREE.CylinderGeometry(1,1,1,radial||6,1);
  const inst=new THREE.InstancedMesh(g,mat,pairs.length);
  const o=new THREE.Object3D(),v=new THREE.Vector3();
  for(let i=0;i<pairs.length;i++){
    const [p,qq]=pairs[i]; v.subVectors(qq,p); const len=v.length();
    o.position.copy(p).add(qq).multiplyScalar(.5);
    o.quaternion.setFromUnitVectors(_up,v.normalize());
    o.scale.set(thick,len,thick); o.updateMatrix(); inst.setMatrixAt(i,o.matrix);
  }
  inst.castShadow=true; inst.receiveShadow=true; (parent||world).add(inst); return inst;
}
function tube(points,radius,mat,parent,segs){
  const c=new THREE.CatmullRomCurve3(points);
  return mesh(new THREE.TubeGeometry(c,segs||48,radius,6,false),mat,parent,0,0,0,true,true);
}
function shadowBlob(x,z,rx,rz,opacity){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(rx*2,rz*2),M.shadowBlob.clone());
  m.material.opacity=opacity; m.rotation.x=-PI/2; m.position.set(x,.035,z);
  m.renderOrder=1; world.add(m); return m;
}

/* ---------- sky + environment ---------- */
const moonDir=V(-.42,.34,.84).normalize();
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{ moonDir:{value:moonDir.clone()} },
  vertexShader:'varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:[
    'varying vec3 vD; uniform vec3 moonDir;',
    'void main(){',
    '  float h=clamp(vD.y*0.5+0.5,0.0,1.0);',
    '  vec3 hor=vec3(0.145,0.235,0.355), mid=vec3(0.075,0.135,0.245), zen=vec3(0.028,0.052,0.110);',
    '  vec3 c=mix(hor,mid,smoothstep(0.47,0.66,h));',
    '  c=mix(c,zen,smoothstep(0.62,1.0,h));',
    '  float s=max(dot(normalize(vD),moonDir),0.0);',
    '  c+=vec3(0.42,0.56,0.78)*pow(s,22.0)*0.22;',
    '  c+=vec3(0.85,0.80,0.62)*pow(s,900.0)*0.9;',
    '  float band=exp(-pow((h-0.485)*22.0,2.0))*0.10;',
    '  c+=vec3(0.55,0.30,0.16)*band;',
    '  gl_FragColor=vec4(c,1.0);',
    '  #include <tonemapping_fragment>',
    '  #include <colorspace_fragment>',
    '}'
  ].join('\n')
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(420,40,20),skyMat);
sky.frustumCulled=false; sky.renderOrder=-10; scene.add(sky);
(function buildEnv(){
  const envScene=new THREE.Scene();
  const g=new THREE.SphereGeometry(100,24,14);
  const pos=g.getAttribute('position'),cols=[];
  const cTop=new THREE.Color(0x152642),cHor=new THREE.Color(0x3a5878),cBot=new THREE.Color(0x121a22);

/* =====================================================================
   SHIP GEOMETRY
   ===================================================================== */
function halfBeam(z){
  const n=clamp((z-SHIP.bow)/SHIP.L,0,1);
  let f=1;
  if(n<.19) f=0.15+0.85*smooth(0,.19,n);
  else if(n>.86) f=1-0.46*smooth(.86,1,n);
  return SHIP.halfBeam*f;
}
function flareAt(z){
  const n=clamp((z-SHIP.bow)/SHIP.L,0,1);
  return .04 + .52*(1-smooth(0,.22,n)) + .14*smooth(.88,1,n);
}
function keelY(z){
  const n=clamp((z-SHIP.bow)/SHIP.L,0,1);
  return SHIP.keel + 3.0*(1-smooth(0,.15,n)) + 1.5*smooth(.90,1,n);
}
function deckY(z){
  const n=clamp((z-SHIP.bow)/SHIP.L,0,1);
  return SHIP.deck + 2.6*(1-smooth(0,.22,n)) + .85*smooth(.82,1,n);
}
const PROFILE=[[0,0],[.05,.20],[.14,.48],[.28,.72],[.45,.88],[.62,.96],[.80,1.0],[.92,1.03],[1,1.06]];
function profile(p){
  p=clamp(p,0,1);
  for(let i=0;i<PROFILE.length-1;i++){
    if(p<=PROFILE[i+1][0]){
      const a=PROFILE[i],b=PROFILE[i+1],t=(p-a[0])/(b[0]-a[0]);
      return lerp(a[1],b[1],t);
    }
  }
  return 1.06;
}
function sectionPoint(z,s){
  const p=Math.abs(s), sign=s<0?-1:1;
  const x=sign*halfBeam(z)*profile(p)*(1+flareAt(z)*Math.pow(p,3));
  const y=keelY(z)+(deckY(z)-keelY(z))*p;
  return [x,y,z];
}
function hullSideX(z,y){
  const p=clamp((y-keelY(z))/(deckY(z)-keelY(z)),0,1);
  return halfBeam(z)*profile(p)*(1+flareAt(z)*Math.pow(p,3));
}

const C_ANTI=new THREE.Color(0xa25849);
const C_BOOT=new THREE.Color(0x2a211d);
const C_TOP=new THREE.Color(0x3d505e);
const C_TOPHI=new THREE.Color(0x536673);
const C_RUST=new THREE.Color(0x6d422c);
function paintColor(y,z){
  const n=fbm(z*.11,y*.22,3);
  let c;
  if(y<SHIP.WL-.22){
    c=C_ANTI.clone().multiplyScalar(.80+.36*(n*.5+.5));
    const rust=smooth(.18,.62,fbm(z*.24+13,y*.35,3));
    c.lerp(C_RUST,rust*.42);
  } else if(y<SHIP.WL+.12){
    c=C_BOOT.clone();
  } else {
    const t=smooth(SHIP.WL+.12,SHIP.deck-1,y);
    c=C_TOP.clone().lerp(C_TOPHI,t*.55);
    c.multiplyScalar(.84+.28*(n*.5+.5));
    const streak=Math.max(0,fbm(z*.85+7,0.31,2));
    c.lerp(C_RUST,smooth(.30,.72,streak)*.30*(1-t*.5));
  }
  return c;
}

const HULL=new THREE.Group(); world.add(HULL);
(function buildHull(){
  const NZ=64,NK=36;
  const pos=[],uv=[],col=[],idx=[];
  for(let i=0;i<=NZ;i++){
    const z=lerp(SHIP.bow,SHIP.stern,i/NZ);
    for(let k=0;k<=NK;k++){
      const s=-1+2*k/NK;
      const pt=sectionPoint(z,s);
      pos.push(pt[0],pt[1],pt[2]);
      uv.push(i/NZ,k/NK);
      const c=paintColor(pt[1],z); col.push(c.r,c.g,c.b);
    }
  }
  const aperture=(ia,ib,ic)=>{
    const z=(pos[ia*3+2]+pos[ib*3+2]+pos[ic*3+2])/3;
    if(z<49.0) return false;
    const x=(pos[ia*3]+pos[ib*3]+pos[ic*3])/3;
    const y=(pos[ia*3+1]+pos[ib*3+1]+pos[ic*3+1])/3;
    return Math.abs(x)<2.2 && y<7.0;
  };
  for(let i=0;i<NZ;i++) for(let k=0;k<NK;k++){
    const a=i*(NK+1)+k,b=a+1,c=a+(NK+1),d=c+1;
    if(!aperture(a,c,b)) idx.push(a,c,b);
    if(!aperture(b,c,d)) idx.push(b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  const hullMesh=mesh(g,M.hull,HULL,0,0,0,true,true);
  hullMesh.name='hullShell';

  // deck surface with camber
  const dp=[],du=[],di=[];
  const DK=14;
  for(let i=0;i<=NZ;i++){
    const z=lerp(SHIP.bow,SHIP.stern,i/NZ);
    const w=hullSideX(z,deckY(z));
    for(let k=0;k<=DK;k++){
      const u=-1+2*k/DK, x=u*w;
      dp.push(x,deckY(z)+.10*(1-u*u),z); du.push(i/NZ,k/DK);
    }
  }
  for(let i=0;i<NZ;i++) for(let k=0;k<DK;k++){
    const a=i*(DK+1)+k,b=a+1,c=a+(DK+1),d=c+1;
    di.push(a,b,c,b,d,c);
  }
  const dg=new THREE.BufferGeometry();
  dg.setAttribute('position',new THREE.Float32BufferAttribute(dp,3));
  dg.setAttribute('uv',new THREE.Float32BufferAttribute(du,2));
  dg.setIndex(di); dg.computeVertexNormals();
  mesh(dg,M.deck,HULL,0,0,0,true,true);

  // sheer / gunwale rails, both sides
  for(const sign of [-1,1]){
    const pts=[];
    for(let i=0;i<=NZ;i+=2){ const z=lerp(SHIP.bow,SHIP.stern,i/NZ);
      pts.push(V(sign*hullSideX(z,deckY(z)),deckY(z)+.22,z)); }
    tube(pts,.16,M.rail,HULL,NZ);
    const pts2=[];
    for(let i=0;i<=NZ;i+=2){ const z=lerp(SHIP.bow,SHIP.stern,i/NZ);
      pts2.push(V(sign*hullSideX(z,SHIP.WL),SHIP.WL,z)); }
    tube(pts2,.11,M.steelDark,HULL,NZ);
  }
  // flat keel plate
  const kp=[];
  for(let i=0;i<=NZ;i+=2){ const z=lerp(SHIP.bow,SHIP.stern,i/NZ); kp.push(V(0,keelY(z)-.24,z)); }
  tube(kp,.48,M.steelDark,HULL,NZ);

  // transom cap (stern fan) + bow stem closure
  for(const end of ['stern','bow']){
    const z=end==='stern'?SHIP.stern:SHIP.bow;
    const ring=[];
    for(let k=0;k<=NK;k++){ const s=-1+2*k/NK; const pt=sectionPoint(z,s); ring.push(V(pt[0],pt[1],z)); }
    const cy=(keelY(z)+deckY(z))*.5;
    const center=V(0,cy,z);
    const capPos=[],capIdx=[];
    for(const p of ring){ capPos.push(p.x,p.y,p.z); }
    capPos.push(center.x,center.y,center.z);
    for(let k=0;k<NK;k++){
      const mx=(ring[k].x+ring[k+1].x)/3, my=(ring[k].y+ring[k+1].y+cy)/3;
      if(end==='stern'&&Math.abs(mx)<4.0&&my<9.2) continue; // propeller aperture
      capIdx.push(k,k+1,NK+1);
    }
    const cg=new THREE.BufferGeometry();
    cg.setAttribute('position',new THREE.Float32BufferAttribute(capPos,3));
    cg.setIndex(capIdx); cg.computeVertexNormals();
    mesh(cg,end==='stern'?M.steelDark:M.antifoul,HULL,0,0,0,true,true);
  }
})();

const PROP={ y:4.55, z:SHIP.stern+2.3, r:4.2 };
(function buildPropulsion(){
  // shaft + boss through the transom
  const shaft=mesh(new THREE.CylinderGeometry(.38,.38,9,14),M.bronzeDark,HULL,0,PROP.y,SHIP.stern-2.0);
  shaft.rotation.x=PI/2;
  const boss=mesh(new THREE.CylinderGeometry(.95,1.15,2.4,16),M.steelDark,HULL,0,PROP.y,SHIP.stern+.25);
  boss.rotation.x=PI/2;
  // stern skeg plate supporting the shaft
  const skegShape=new THREE.Shape();
  skegShape.moveTo(-1.2,2.2); skegShape.lineTo(1.2,2.2);
  skegShape.lineTo(.38,PROP.y-.75); skegShape.lineTo(-.38,PROP.y-.75); skegShape.closePath();
  const skegGeo=new THREE.ExtrudeGeometry(skegShape,{depth:.35,bevelEnabled:true,bevelSize:.08,bevelThickness:.08,bevelSegments:2});
  const skeg=mesh(skegGeo,M.steelDark,HULL,0,0,SHIP.stern-.45);

  const prop=new THREE.Group(); prop.position.set(0,PROP.y,PROP.z); HULL.add(prop);
  // hub and fairwater
  const hub=mesh(new THREE.CylinderGeometry(.68,.78,2.0,20),M.bronze,prop,0,0,0);
  hub.rotation.x=PI/2;
  const fair=mesh(new THREE.ConeGeometry(.68,1.5,18),M.bronze,prop,0,0,1.65);
  fair.rotation.x=PI/2;
  mesh(new THREE.CylinderGeometry(.30,.30,3.0,12),M.bronzeDark,prop,0,0,-.6).rotation.x=PI/2;

  function bladeGeom(){
    const NR=15,NC=9,r0=.66,r1=PROP.r;
    function surf(r,q,sign){
      const u=clamp((r-r0)/(r1-r0),0,1);
      const chord=.48+1.32*Math.sin(PI*Math.pow(u,.78));
      const beta=lerp(.68,.20,Math.pow(u,.85));
      const skew=.46*u*u, rake=.12*u*u;
      const phi=skew;
      const rad=V(Math.cos(phi),Math.sin(phi),0);
      const tan=V(-Math.sin(phi),Math.cos(phi),0);
      const zdir=V(0,0,1);
      const p=V(0,0,0).addScaledVector(rad,r)
        .addScaledVector(tan,q*chord*Math.cos(beta))
        .addScaledVector(zdir,q*chord*Math.sin(beta)+rake);
      const nrm=V(0,0,0).addScaledVector(zdir,Math.cos(beta)).addScaledVector(tan,-Math.sin(beta)).normalize();
      const th=.17*Math.pow(Math.max(0,1-Math.pow(2*q,2)),.55)*(1-.45*u);
      p.addScaledVector(nrm,sign*th*.5);
      return p;
    }
    const pos=[],idx=[];
    for(let side=0;side<2;side++){
      const sgn=side===0?1:-1;
      for(let ri=0;ri<=NR;ri++){
        const r=lerp(r0,r1,ri/NR);
        for(let ci=0;ci<=NC;ci++){
          const q=-.5+ci/NC, p=surf(r,q,sgn);
          pos.push(p.x,p.y,p.z);
        }
      }
    }
    const row=NC+1, layer=(NR+1)*row;
    for(let ri=0;ri<NR;ri++) for(let ci=0;ci<NC;ci++){
      const a=ri*row+ci,b=a+1,c=a+row,d=c+1;
      idx.push(a,c,b,b,c,d);
      const e=a+layer,f=b+layer,g=c+layer,h=d+layer;
      idx.push(e,f,g,f,h,g);
    }
    // rim stitching
    for(let ri=0;ri<NR;ri++){
      for(const ci of [0,NC]){
        const a=ri*row+ci,c=(ri+1)*row+ci;
        idx.push(a,a+layer,c,c,a+layer,c+layer);
      }
    }
    for(const ri of [0,NR]) for(let ci=0;ci<NC;ci++){
      const a=ri*row+ci,b=a+1;
      idx.push(a,b,a+layer,b,b+layer,a+layer);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setIndex(idx); g.computeVertexNormals(); return g;
  }
  const bg=bladeGeom();
  for(let i=0;i<5;i++){
    const b=mesh(bg,M.bronze,prop,0,0,.62);
    b.rotation.z=i*TAU/5;
  }
  // rudder, aft of propeller
  const rs=new THREE.Shape();
  rs.moveTo(-.45,8.6); rs.lineTo(.55,8.6);
  rs.lineTo(1.45,6.2); rs.lineTo(1.30,2.55);
  rs.quadraticCurveTo(0,1.9,-1.30,2.55);
  rs.lineTo(-1.20,6.0); rs.closePath();
  const rg=new THREE.ExtrudeGeometry(rs,{depth:.55,bevelEnabled:true,bevelSize:.16,bevelThickness:.14,bevelSegments:2});
  mesh(rg,M.steelDark,HULL,0,0,SHIP.stern+4.6);
  mesh(new THREE.CylinderGeometry(.26,.30,5.4,12),M.steel,HULL,0,9.0,SHIP.stern+4.6);
  // rudder stock cap + tiller arm
  mesh(new THREE.BoxGeometry(2.2,.22,.28),M.steelDark,HULL,0,11.4,SHIP.stern+4.6);
})();

const sparkPos=new Float32Array(N_SPARK*3);

for(let i=0;i<N_SPARK;i++){ sparkState.push({life:0,x:0,y:-1000,z:0,vx:0,vy:0,vz:0}); sparkPos[i*3+1]=-1000; }

const N_STEAM=55;
const steamPos=new Float32Array(N_STEAM*3);
const steamState=[];
for(let i=0;i<N_STEAM;i++){
  const s={x:-12.5+rand(-.5,.5),y:rand(0,5),z:36+rand(-.5,.5),sp:rand(.25,.6),ph:rand(0,TAU),d:rand(-.5,.5)};
  steamState.push(s); steamPos[i*3]=s.x; steamPos[i*3+1]=s.y; steamPos[i*3+2]=s.z;
}
const steamGeo=new THREE.BufferGeometry();
steamGeo.setAttribute('position',new THREE.BufferAttribute(steamPos,3));

function weldActivity(t){
  const c=(t%9)/9;
  if(c<.30 || c>.46) return 0;
  const env=smooth(.30,.34,c)*(1-smooth(.42,.46,c));
  const flick=.62+.38*Math.sin(t*47)*Math.sin(t*19.3);
  return env*clamp(flick,0,1);
}
function updateParticles(dt,t){
  // sparks
  for(let i=0;i<N_SPARK;i++){
    const s=sparkState[i];
    if(s.life<=0){ sparkPos[i*3+1]=-1000; continue; }
    s.life-=dt;
    s.vy-=12.0*dt;
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.z+=s.vz*dt;
    s.vx*=.985; s.vz*=.985;
    if(s.y<SHEET_Y && Math.abs(s.x-WELD.x)<2.3 && Math.abs(s.z-WELD.z)<2.7){ s.life=0; }
    sparkPos[i*3]=s.x; sparkPos[i*3+1]=s.y; sparkPos[i*3+2]=s.z;
  }
  sparkGeo.attributes.position.needsUpdate=true;
  // steam
  for(let i=0;i<N_STEAM;i++){
    const s=steamState[i];
    s.y+=s.sp*dt;
    if(s.y>6.5){ s.y=rand(0,.5); s.x=-12.5+rand(-.5,.5); s.z=36+rand(-.5,.5); }
    const drift=Math.sin(t*.55+s.ph)*.35+s.d;
    steamPos[i*3]=s.x+drift*(s.y/6.5);
    steamPos[i*3+1]=s.y;
    steamPos[i*3+2]=s.z+Math.cos(t*.4+s.ph)*.25*(s.y/6.5);
  }
  steamGeo.attributes.position.needsUpdate=true;
}

function updateCamera(dt,t){
  const u=((t+cineOffset)/LOOP%1+1)%1;
  CINE.getPointAt(u,cinePos); CINE_T.getPointAt(u,cineTar);
  cineTar.y+=Math.sin(t*.35)*.12;
  const k=1-Math.pow(.003,dt);
  cineBlend+=(cineWanted-cineBlend)*k;
  orbit.az+=(orbit.tAz-orbit.az)*k;
  orbit.el+=(orbit.tEl-orbit.el)*k;
  orbit.dist+=(orbit.tDist-orbit.dist)*k;
  const ce=Math.cos(orbit.el);
  manualPos.set(VIEW_TARGET.x+orbit.dist*ce*Math.sin(orbit.az),
    VIEW_TARGET.y+orbit.dist*Math.sin(orbit.el),
    VIEW_TARGET.z+orbit.dist*ce*Math.cos(orbit.az));
  avoidHull(manualPos);
  camera.position.copy(manualPos).lerp(cinePos,cineBlend);
  finalTar.copy(VIEW_TARGET).lerp(cineTar,cineBlend);
  camera.lookAt(finalTar);
  camera.updateMatrixWorld();
}

/* ---------- interaction ---------- */
const cnv=renderer.domElement;
let dragging=false,lastX=0,lastY=0,pinchDist=0;
function takeControl(){
  if(cineBlend>.02) orbitFromCamera(camera.position);
  cineWanted=0;
  document.getElementById('btnCine').classList.remove('active');
}
cnv.addEventListener('pointerdown',e=>{
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  cnv.classList.add('dragging');takeControl();
  try{cnv.setPointerCapture(e.pointerId);}catch(err){}
});
cnv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  orbit.tAz-=dx*.0040;
  orbit.tEl=clamp(orbit.tEl+dy*.0030,-.04,1.02);
});
function endDrag(){dragging=false;cnv.classList.remove('dragging');}
cnv.addEventListener('pointerup',endDrag);
cnv.addEventListener('pointercancel',endDrag);
cnv.addEventListener('wheel',e=>{
  e.preventDefault();takeControl();
  orbit.tDist=clamp(orbit.tDist*Math.exp(e.deltaY*.0011),16,78);
},{passive:false});
cnv.addEventListener('touchstart',e=>{
  if(e.touches.length===2){pinchDist=Math.hypot(
    e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);takeControl();}
},{passive:true});
cnv.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&pinchDist){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY);
    orbit.tDist=clamp(orbit.tDist*pinchDist/Math.max(d,1),16,78);pinchDist=d;
    e.preventDefault();
  }
},{passive:false});

const btnCine=document.getElementById('btnCine');
const btnReset=document.getElementById('btnReset');
const btnPause=document.getElementById('btnPause');
const btnSound=document.getElementById('btnSound');
btnCine.addEventListener('click',()=>{
  orbitFromCamera(camera.position);
  cineWanted=cineWanted<.5?1:0;
  btnCine.classList.toggle('active',cineWanted>.5);
});
btnReset.addEventListener('click',()=>{
  cineOffset=-sceneTime;
  orbit.az=orbit.tAz=1.15;orbit.el=orbit.tEl=.14;orbit.dist=orbit.tDist=34;
  cineWanted=1;btnCine.classList.add('active');
});
btnPause.addEventListener('click',()=>{
  paused=!paused;btnPause.classList.toggle('active',paused);
  btnPause.innerHTML='<span class="dot"></span>'+(paused?'Paused':'Pause');
});

/* ---------- UI fade ---------- */
const ui=document.getElementById('ui');
let lastActivity=performance.now();
function wake(){lastActivity=performance.now();ui.classList.remove('hidden');}
window.addEventListener('pointermove',wake,{passive:true});
window.addEventListener('pointerdown',wake,{passive:true});
window.addEventListener('wheel',wake,{passive:true});
window.addEventListener('keydown',wake);
window.addEventListener('focusin',wake);

/* ---------- procedural sound ---------- */
let AC=null,master=null,soundEnabled=false,nextCrackle=0,lastWeld=0;
let motorGain=null;
function noiseBuffer(sec){
  const len=Math.floor(AC.sampleRate*sec),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=RNG()*2-1;
  return buf;
}
function initAudio(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}
  catch(err){console.warn('[audio] unavailable',err);return;}
  master=AC.createGain();master.gain.value=.0001;master.connect(AC.destination);
  const nb=noiseBuffer(3);
  // ventilation hum
  const vent=AC.createBufferSource();vent.buffer=nb;vent.loop=true;
  const vlpf=AC.createBiquadFilter();vlpf.type='lowpass';vlpf.frequency.value=190;vlpf.Q.value=.5;
  const vg=AC.createGain();vg.gain.value=.085;
  const vlfo=AC.createOscillator();vlfo.frequency.value=.09;
  const vlg=AC.createGain();vlg.gain.value=.025;
  vlfo.connect(vlg);vlg.connect(vg.gain);
  vent.connect(vlpf);vlpf.connect(vg);vg.connect(master);vent.start();vlfo.start();
  // gantry motor
  const motor=AC.createBufferSource();motor.buffer=nb;motor.loop=true;
  const mf=AC.createBiquadFilter();mf.type='bandpass';mf.frequency.value=165;mf.Q.value=1.6;
  motorGain=AC.createGain();motorGain.gain.value=.045;
  const mlfo=AC.createOscillator();mlfo.frequency.value=3.1;
  const mlg=AC.createGain();mlg.gain.value=.014;
  mlfo.connect(mlg);mlg.connect(motorGain.gain);
  motor.connect(mf);mf.connect(motorGain);motorGain.connect(master);motor.start();mlfo.start();
  nextCrackle=AC.currentTime+1.0;
  document.getElementById('soundHint').classList.add('gone');
}
function crackle(when){
  const dur=rand(.05,.16);
  const src=AC.createBufferSource();
  const len=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(RNG()*2-1)*Math.pow(1-i/len,2.2);
  src.buffer=b;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=rand(1400,4200);bp.Q.value=2.2;
  const g=AC.createGain();g.gain.value=rand(.10,.24);
  src.connect(bp);bp.connect(g);g.connect(master);src.start(when);
}
btnSound.addEventListener('click',()=>{
  if(!AC)initAudio();
  if(!AC)return;
  soundEnabled=!soundEnabled;
  if(AC.state==='suspended')AC.resume();
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(soundEnabled?.24:.0001,AC.currentTime,.35);
  btnSound.classList.toggle('active',soundEnabled);
  btnSound.innerHTML='<span class="dot"></span>'+(soundEnabled?'Sound on':'Sound off');
});
window.addEventListener('pointerdown',()=>{
  document.getElementById('soundHint').classList.add('gone');
},{once:true});

/* ---------- resize ---------- */
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

/* ---------- main loop ---------- */
let sceneTime=0,lastFrame=performance.now(),accum=0;
function updateGantry(t){
  // smooth ping-pong: continuous in position and velocity at the ends
  const u=((t/LOOP)%1+1)%1;
  const tri=u<.5?u*2:(1-u)*2;
  const eased=tri*tri*(3-2*tri);
  const prev=GANTRY.z;
  GANTRY.z=lerp(GANTRY.railMin,GANTRY.railMax,eased);
  const dz=GANTRY.z-prev;
  GANTRY.speed=dz;
  gantry.position.z=GANTRY.z;
  for(const w of wheels) w.rotation.x-=dz/.46;
  if(reel) reel.rotation.x-=dz/.55;
  // lamp sweep across the weld seams
  const sweep=Math.sin(t*.55)*3.4;
  gantryLamp.target.position.set(GANTRY.z>20?4:0,7,GANTRY.z+sweep);
  gantryLamp2.target.position.set(0,8,GANTRY.z-sweep);
  gantryLamp.target.updateMatrixWorld();gantryLamp2.target.updateMatrixWorld();
  const glowA=GANTRY.z>20&&GANTRY.z<50?.65:.18;
  gantryLamp.intensity=lerp(gantryLamp.intensity,240*glowA,.08);
  gantryLamp2.intensity=lerp(gantryLamp2.intensity,200*glowA,.08);
}
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastFrame)/1000,.08);lastFrame=now;
  if(!paused)sceneTime+=dt;
  const t=sceneTime;

  updateGantry(t);
  const act=weldActivity(t);
  weldLight.intensity=act*38*(.85+.3*Math.sin(t*61));
  glow.material.opacity=act*.75;
  glow.scale.setScalar(.85+act*.35);
  if(!paused){
    if(act>.15){
      const n=Math.round(act*4*RNG()+1);
      for(let i=0;i<n;i++) emitSpark();
    }
    // fixed-step particle simulation
    accum+=dt;let steps=0;
    while(accum>=1/60&&steps<5){updateParticles(1/60,t);accum-=1/60;steps++;}
  }
  if(AC&&soundEnabled&&act>.4&&lastWeld<=.4) crackle(AC.currentTime+.01);
  if(AC&&soundEnabled) motorGain.gain.setTargetAtTime(.038+Math.min(Math.abs(GANTRY.speed)*.09,.045),AC.currentTime,.2);
  lastWeld=act;

  updateCamera(dt,t);
  renderer.render(scene,camera);
  if(performance.now()-lastActivity>9000&&!ui.classList.contains('hidden')) ui.classList.add('hidden');
}
window.addEventListener('error',e=>{
  const err=document.getElementById('err');
  err.style.display='block';err.textContent+=(err.textContent?'\n':'')+e.message;
});
try{
  updateGantry(0);updateCamera(.016,0);
  requestAnimationFrame(animate);
  window.__dock={get t(){return sceneTime;},set t(v){sceneTime=v;},
    get paused(){return paused;},set paused(v){paused=v;},camera,renderer,
    get blend(){return cineBlend;},get cine(){return cineWanted;},set cine(v){cineWanted=v?1:0;},
    get gantryZ(){return GANTRY.z;},get weld(){return weldActivity(sceneTime);},
    CINE, CINE_T, scene,
    snap:()=>({t:sceneTime,cam:[camera.position.x,camera.position.y,camera.position.z],
      gantry:GANTRY.z,weld:weldActivity(sceneTime),blend:cineBlend})};
  console.log('[blue-hour-dry-dock] ready — three r'+THREE.REVISION+', draw calls '+renderer.info.render.calls);
}catch(err){
  console.error('[blue-hour-dry-dock] fatal',err);
  const e=document.getElementById('err');e.style.display='block';e.textContent='Fatal: '+err.message;
}
</script>
