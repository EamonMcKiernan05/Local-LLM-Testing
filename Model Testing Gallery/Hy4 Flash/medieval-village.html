<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   Utilities: deterministic RNG, value noise, procedural textures
   ============================================================ */
let _seed = 987654321;
function rnd(){ _seed = (_seed*1664525 + 1013904223) >>> 0; return _seed/4294967296; }
function rr(a,b){ return a + (b-a)*rnd(); }
function ri(a,b){ return Math.floor(rr(a,b+1)); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothstep(e0,e1,x){ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }

function hash2(x,y,s){
  let h = (x|0)*374761393 + (y|0)*668265263 + (s|0)*1442695041;
  h = (h ^ (h>>13)) * 1274126177;
  h = h ^ (h>>16);
  return ((h>>>0) % 1000000)/1000000;
}
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,s,oct){
  oct=oct||4; let v=0,a=0.5,f=1;
  for(let i=0;i<oct;i++){ v+=a*vnoise(x*f,y*f,s+i*17); f*=2; a*=0.5; }
  return v;
}

function texFromPixels(size,fn,srgb){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d'); const img=ctx.createImageData(size,size); const d=img.data;
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const p=fn(x,y,size); const i=(y*size+x)*4;
    d[i]=p[0]; d[i+1]=p[1]; d[i+2]=p[2]; d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(srgb!==false) t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8;
  return t;
}
function withRepeat(tex,rx,ry){ const t=tex.clone(); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.needsUpdate=true; return t; }

// Texture pairs: {map,bump}. Height computed once per pixel for both.
function plasterTex(base){
  const S=384;
  const map=texFromPixels(S,(x,y)=>{
    const v=fbm(x/54,y/54,11,4), speck=hash2(x,y,7);
    const sh=0.86+0.26*v+ (speck-0.5)*0.06;
    return [clamp(base[0]*sh,0,255),clamp(base[1]*sh,0,255),clamp(base[2]*sh,0,255)];
  });
  const bump=texFromPixels(S,(x,y)=>{
    const v=fbm(x/54,y/54,11,4), speck=hash2(x,y,7);
    const h=clamp(90+120*v+30*(speck-0.5),0,255); return [h,h,h];
  },false);
  return {map,bump};
}
function woodTex(base){
  const S=384;
  const gh=(x,y)=>{
    const warp=fbm(x/48,y/120,23,3)*7;
    const grain=0.5+0.5*Math.sin(x*0.22+warp);
    const fine=hash2(x,y,31);
    return {sh:0.62+0.55*grain+ (fine-0.5)*0.08, h:clamp(60+150*grain+20*(fine-0.5),0,255)};
  };
  const map=texFromPixels(S,(x,y)=>{const g=gh(x,y);return [clamp(base[0]*g.sh,0,255),clamp(base[1]*g.sh,0,255),clamp(base[2]*g.sh,0,255)];});
  const bump=texFromPixels(S,(x,y)=>{const h=gh(x,y).h;return [h,h,h];},false);
  return {map,bump};
}
function thatchTex(){
  const S=384;
  const gh=(x,y)=>{
    const strand=fbm(x*0.35,y*0.035,41,3);
    const row=((y%30)<3)?0.72:1.0;
    const speck=hash2(x,y,43);
    return {sh:(0.72+0.6*strand)*row+(speck-0.5)*0.07, h:clamp(70+150*strand*row,0,255)};
  };
  const map=texFromPixels(S,(x,y)=>{const g=gh(x,y);return [clamp(196*g.sh,0,255),clamp(158*g.sh,0,255),clamp(84*g.sh,0,255)];});
  const bump=texFromPixels(S,(x,y)=>{const h=gh(x,y).h;return [h,h,h];},false);
  return {map,bump};
}
function tileTex(base){
  const S=384, tw=48, th=32;
  const gh=(x,y)=>{
    const row=Math.floor(y/th), off=(row%2)*tw/2;
    const tx=((x+off)%tw)/tw, ty=(y%th)/th;
    const arch=Math.sqrt(Math.max(0,1-Math.pow(2*tx-1,2)));
    const mortar=((y%th)<3 || tx<0.045 || tx>0.955)?0.55:1.0;
    const n=fbm(x/12,y/12,57,3);
    return {sh:(0.6+0.5*arch)*mortar*(0.9+0.2*n), h:clamp((60+150*arch)*mortar,0,255)};
  };
  const map=texFromPixels(S,(x,y)=>{const g=gh(x,y);return [clamp(base[0]*g.sh,0,255),clamp(base[1]*g.sh,0,255),clamp(base[2]*g.sh,0,255)];});
  const bump=texFromPixels(S,(x,y)=>{const h=gh(x,y).h;return [h,h,h];},false);
  return {map,bump};
}
function stoneTex(base){
  const S=384, bw=96, bh=40;
  const gh=(x,y)=>{
    const row=Math.floor(y/bh), off=(row%2)*bw/2;
    const bx=((x+off)%bw), by=(y%bh);
    const mortar=(by<4||bx<4)?0.55:1.0;
    const n=fbm(x/10,y/10,71,3), crack=fbm(x/3,y/3,73,2);
    const variation=0.82+0.34*hash2(Math.floor((x+off)/bw),row,79);
    return {sh:mortar*variation*(0.82+0.35*n)*(0.94+0.12*crack), h:clamp((80+120*n)*mortar,0,255)};
  };
  const map=texFromPixels(S,(x,y)=>{const g=gh(x,y);return [clamp(base[0]*g.sh,0,255),clamp(base[1]*g.sh,0,255),clamp(base[2]*g.sh,0,255)];});
  const bump=texFromPixels(S,(x,y)=>{const h=gh(x,y).h;return [h,h,h];},false);
  return {map,bump};
}
function grassTex(){
  const S=384;
  const gh=(x,y)=>{
    const patch=fbm(x/48,y/48,91,4), fine=fbm(x/6,y/6,93,2), sp=hash2(x,y,97);
    return {sh:0.62+0.55*patch+0.16*(fine-0.5)+0.12*(sp-0.5), h:clamp(70+120*patch+50*(fine-0.5),0,255)};
  };
  const map=texFromPixels(S,(x,y)=>{const g=gh(x,y);return [clamp(78*g.sh,0,255),clamp(122*g.sh,0,255),clamp(62*g.sh,0,255)];});
  const bump=texFromPixels(S,(x,y)=>{const h=gh(x,y).h;return [h,h,h];},false);
  return {map,bump};
}
function dirtTex(){
  const S=256;
  const gh=(x,y)=>{
    const n=fbm(x/20,y/20,101,4), sp=hash2(x,y,103);
    const pebble=(sp>0.985)?1.5:1.0;
    return {sh:(0.72+0.5*n)*pebble,h:clamp(80+120*n+40*(sp>0.985?1:0),0,255)};
  };
  const map=texFromPixels(S,(x,y)=>{const g=gh(x,y);return [clamp(122*g.sh,0,255),clamp(96*g.sh,0,255),clamp(70*g.sh,0,255)];});
  const bump=texFromPixels(S,(x,y)=>{const h=gh(x,y).h;return [h,h,h];},false);
  return {map,bump};
}
function stripeTex(a,b){
  const S=256;
  const map=texFromPixels(S,(x,y)=>{
    const s=Math.floor(x/32)%2; const base=s?b:a;
    const n=fbm(x/8,y/8,109,3), weave=(Math.sin(x*0.9)*Math.sin(y*0.9))*0.06;
    const sh=0.9+0.18*(n-0.5)+weave;
    return [clamp(base[0]*sh,0,255),clamp(base[1]*sh,0,255),clamp(base[2]*sh,0,255)];
  });
  return map;
}
function radialTex(size,stops){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const [p,col] of stops) g.addColorStop(p,col);
  ctx.fillStyle=g; ctx.fillRect(0,0,size,size);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function cloudTex(){
  const S=256, c=document.createElement('canvas'); c.width=c.height=S;
  const ctx=c.getContext('2d');
  for(let i=0;i<14;i++){
    const x=S/2+rr(-0.18,0.18)*S, y=S/2+rr(-0.08,0.08)*S, r=rr(0.10,0.24)*S;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(255,248,238,0.9)');
    g.addColorStop(0.5,'rgba(255,240,225,0.55)');
    g.addColorStop(1,'rgba(255,235,220,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

// Build the shared texture/material library.
console.time('textures');
const TEX={
  plasterWarm: plasterTex([237,226,205]),
  plasterCream: plasterTex([247,238,218]),
  plasterRose: plasterTex([214,178,158]),
  plasterSage: plasterTex([188,199,171]),
  wood: woodTex([108,74,46]),
  darkWood: woodTex([72,48,32]),
  thatch: thatchTex(),
  tileRed: tileTex([186,92,62]),
  tileAmber: tileTex([196,132,78]),
  stone: stoneTex([150,146,134]),
  stoneDark: stoneTex([120,118,112]),
  grass: grassTex(),
  dirt: dirtTex()
};
const GLOW=radialTex(128,[[0,'rgba(255,240,200,1)'],[0.25,'rgba(255,200,110,0.75)'],[1,'rgba(255,180,80,0)']]);
const CLOUD=cloudTex();
const SMOKE=radialTex(128,[[0,'rgba(235,225,215,0.75)'],[0.45,'rgba(220,210,200,0.35)'],[1,'rgba(210,200,190,0)']]);
const AWNING_RED=stripeTex([176,62,52],[238,222,190]);
const AWNING_BLUE=stripeTex([58,92,126],[236,226,200]);
const AWNING_GREEN=stripeTex([74,110,72],[238,226,196]);
console.timeEnd('textures');

function mkMat(tex,opts){
  opts=opts||{};
  return new THREE.MeshStandardMaterial({
    map:tex.map, bumpMap:tex.bump, bumpScale:opts.bump??0.06,
    color:opts.color??0xffffff, roughness:opts.rough??0.92, metalness:opts.metal??0,
    emissive:opts.emissive??0x000000, emissiveIntensity:opts.emissiveInt??1,
    side:opts.side??THREE.FrontSide
  });
}
const M={
  plasterWarm:mkMat(TEX.plasterWarm,{bump:0.05}),
  plasterCream:mkMat(TEX.plasterCream,{bump:0.05}),
  plasterRose:mkMat(TEX.plasterRose,{bump:0.05}),
  plasterSage:mkMat(TEX.plasterSage,{bump:0.05}),
  wood:mkMat(TEX.wood,{bump:0.05}),
  darkWood:mkMat(TEX.darkWood,{bump:0.045}),
  timber:mkMat(TEX.darkWood,{bump:0.05,color:0x7a6250}),
  thatch:mkMat(TEX.thatch,{bump:0.11}),
  tileRed:mkMat(TEX.tileRed,{bump:0.09}),
  tileAmber:mkMat(TEX.tileAmber,{bump:0.09}),
  stone:mkMat(TEX.stone,{bump:0.08}),
  stoneDark:mkMat(TEX.stoneDark,{bump:0.09}),
  grass:mkMat(TEX.grass,{bump:0.08}),
  dirt:mkMat(TEX.dirt,{bump:0.04,side:THREE.DoubleSide}),
  window:new THREE.MeshStandardMaterial({color:0x33261a,emissive:0xffb24d,emissiveIntensity:2.4,roughness:0.35}),
  windowCool:new THREE.MeshStandardMaterial({color:0x2a2418,emissive:0xffd27a,emissiveIntensity:2.0,roughness:0.35}),
  iron:new THREE.MeshStandardMaterial({color:0x3b3a38,roughness:0.55,metalness:0.7}),
  straw:mkMat(TEX.thatch,{bump:0.14,color:0xd8c07a}),
  clothRed:new THREE.MeshStandardMaterial({map:AWNING_RED,roughness:0.95,side:THREE.DoubleSide}),
  clothBlue:new THREE.MeshStandardMaterial({map:AWNING_BLUE,roughness:0.95,side:THREE.DoubleSide}),
  clothGreen:new THREE.MeshStandardMaterial({map:AWNING_GREEN,roughness:0.95,side:THREE.DoubleSide})
};
const WALL_MATS=[M.plasterCream,M.plasterWarm,M.plasterRose,M.plasterSage];
const ROOF_MATS=[M.tileRed,M.tileAmber,M.thatch];
console.log('materials ready');

/* ============================================================
   Renderer, scene, camera, lighting, sky
   ============================================================ */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xd8a686,0.0032);

const camera=new THREE.PerspectiveCamera(46,window.innerWidth/window.innerHeight,0.5,900);
camera.position.set(52,27,52);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4,0);
controls.enableDamping=true; controls.dampingFactor=0.045;
controls.minDistance=18; controls.maxDistance=170;
controls.maxPolarAngle=Math.PI*0.495;
controls.autoRotate=true; controls.autoRotateSpeed=0.32;
controls.update();
controls.addEventListener('start',()=>{ controls.autoRotate=false; });

const sunDir=new THREE.Vector3(-0.72,0.12,-0.66).normalize();
const sunColor=new THREE.Color(0xffb066);
const skyHorizon=new THREE.Color(0xe89a63);
const skyMid=new THREE.Color(0x8a6d8e);
const skyTop=new THREE.Color(0x2f3f6b);

// Gradient sunset sky with a sun halo.
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ uSun:{value:sunDir}, uSunColor:{value:new THREE.Color(0xffb072)},
    uHorizon:{value:skyHorizon}, uMid:{value:skyMid}, uTop:{value:skyTop} },
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform vec3 uSun,uSunColor,uHorizon,uMid,uTop; varying vec3 vP;
    void main(){
      vec3 d=normalize(vP); float h=d.y;
      vec3 col;
      if(h>0.0){
        col=mix(uHorizon,uMid,pow(clamp(h,0.0,1.0),0.45));
        col=mix(col,uTop,pow(clamp(h,0.0,1.0),1.6));
      } else { col=mix(uHorizon,uHorizon*0.45,clamp(-h*3.0,0.0,1.0)); }
      float sd=max(dot(d,normalize(uSun)),0.0);
      col+=uSunColor*pow(sd,16.0)*0.35;
      col+=uSunColor*pow(sd,180.0)*0.7;
      col+=uSunColor*pow(sd,2600.0)*1.8;
      gl_FragColor=vec4(col,1.0);
    }`
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(600,48,32),skyMat);
sky.frustumCulled=false; scene.add(sky);

// Visible sun disc + glow sprite (bloom makes these shine).
const sunBall=new THREE.Mesh(new THREE.SphereGeometry(6,24,16),
  new THREE.MeshBasicMaterial({color:0xffe3b4,fog:false}));
sunBall.position.copy(sunDir).multiplyScalar(430); scene.add(sunBall);
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:0xffb35e,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,opacity:0.55}));
sunGlow.position.copy(sunDir).multiplyScalar(420); sunGlow.scale.set(80,80,1); scene.add(sunGlow);

const sunLight=new THREE.DirectionalLight(0xffb479,2.55);
sunLight.position.copy(sunDir).multiplyScalar(150);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(4096,4096);
sunLight.shadow.camera.near=10; sunLight.shadow.camera.far=400;
sunLight.shadow.camera.left=-95; sunLight.shadow.camera.right=95;
sunLight.shadow.camera.top=95; sunLight.shadow.camera.bottom=-95;
sunLight.shadow.bias=-0.0004; sunLight.shadow.normalBias=0.035;
sunLight.target.position.set(0,0,0); scene.add(sunLight); scene.add(sunLight.target);

scene.add(new THREE.HemisphereLight(0xffd7a8,0x4a5338,0.85));
scene.add(new THREE.AmbientLight(0x6b6a86,0.34));
const warmFill=new THREE.DirectionalLight(0xff9a5a,0.35);
warmFill.position.set(40,20,50); scene.add(warmFill);

/* ============================================================
   Terrain with height function
   ============================================================ */
const LAKE={x:29,z:27,r:13};
const HILL={x:42,z:-34};
function terrainHeight(x,z){
  let n=1.15*fbm(x*0.022+10,z*0.022+10,7,4)+0.45*fbm(x*0.09,z*0.09,9,2)-0.72;
  const dxh=x-HILL.x, dzh=z-HILL.z;
  n+=7.2*Math.exp(-(dxh*dxh+dzh*dzh)/(2*13*13));
  // flat plaza
  const dp=Math.hypot(x,z), fp=smoothstep(15,27,dp);
  n=lerp(0.0,n,fp);
  // flat lake basin
  const dl=Math.hypot(x-LAKE.x,z-LAKE.z), fl=smoothstep(LAKE.r-1,LAKE.r+5,dl);
  n=lerp(-1.85,n,fl);
  return n;
}
const groundGeo=new THREE.PlaneGeometry(320,320,180,180);
groundGeo.rotateX(-Math.PI/2);
const gpos=groundGeo.attributes.position;
for(let i=0;i<gpos.count;i++){ gpos.setY(i,terrainHeight(gpos.getX(i),gpos.getZ(i))); }
groundGeo.computeVertexNormals();
const ground=new THREE.Mesh(groundGeo,mkMat(TEX.grass,{bump:0.11}));
ground.geometry.attributes.uv.array.forEach((v,i)=>{ groundGeo.attributes.uv.array[i]=v*26; });
groundGeo.attributes.uv.needsUpdate=true;
ground.receiveShadow=true; scene.add(ground);

// Distant horizon hills for an appealing silhouette.
const silhouette=new THREE.MeshStandardMaterial({color:0x6b5a63,roughness:1,flatShading:true});
for(let i=0;i<26;i++){
  const a=i/26*Math.PI*2+rr(-0.06,0.06), r=rr(120,190);
  const h=rr(10,28), w=rr(30,60);
  const hill=new THREE.Mesh(new THREE.ConeGeometry(w,h,7),silhouette);
  hill.position.set(Math.cos(a)*r,h*0.32-6,Math.sin(a)*r);
  hill.rotation.y=rr(0,6); hill.scale.z=rr(0.7,1.4);
  scene.add(hill);
}

/* ============================================================
   Helpers for placing meshes on terrain
   ============================================================ */
function place(obj,x,z,yOffset){ obj.position.set(x,terrainHeight(x,z)+(yOffset||0),z); scene.add(obj); return obj; }
function shadows(obj){ obj.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} }); return obj; }
function box(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); }

/* ============================================================
   Buildings
   ============================================================ */
const smokeSources=[];
function buildHouse(o){
  const g=new THREE.Group();
  const w=o.w,d=o.d,h=o.h,floors=o.floors, fh=h/floors, y0=0.55;
  const found=box(w+0.5,0.55,d+0.5,M.stone); found.position.y=y0-0.275; g.add(found);
  const walls=box(w,h,d,o.wall); walls.position.y=y0+h/2; g.add(walls);
  const bw=0.22, bd=0.24;
  const beam=(sx,sy,sz,x,y,z,m)=>{const b=box(sx,sy,sz,m||M.timber);b.position.set(x,y,z);g.add(b);return b;};
  // corner posts
  for(const sx of [-1,1]) for(const sz of [-1,1]) beam(bw,h,bd,sx*(w/2-bw/2),y0+h/2,sz*(d/2-bd/2));
  // vertical studs on every facade
  const ns=Math.max(2,Math.round(w/1.9));
  for(let i=1;i<ns;i++){
    const x=-w/2+i*w/ns;
    beam(0.14,h,0.16,x,y0+h/2,d/2+0.03);
    beam(0.14,h,0.16,x,y0+h/2,-d/2-0.03);
  }
  const nsd=Math.max(1,Math.round(d/2.2));
  for(let i=1;i<nsd;i++){
    const z=-d/2+i*d/nsd;
    beam(0.16,h,0.14,w/2+0.03,y0+h/2,z);
    beam(0.16,h,0.14,-w/2-0.03,y0+h/2,z);
  }
  // floor bands
  for(let f=0;f<=floors;f++){

  }
  // diagonal braces on the front facade
  for(let f=0;f<floors;f++){
    for(const s of [-1,1]){
      const br=beam(0.13,fh*0.85,0.1,s*w*0.34,y0+f*fh+fh*0.5,d/2+0.05);
      br.rotation.z=s*0.62;
    }
  }
  // windows
  const winMat=rnd()<0.5?M.window:M.windowCool;
  for(let f=0;f<floors;f++){
    const wy=y0+f*fh+fh*0.55;
    for(let k=0;k<(w>6?2:1);k++){
      const wx=(k-( (w>6?2:1)-1)/2)*(w*0.42);
      const win=box(0.85,1.05,0.12,winMat); win.position.set(wx,wy,d/2+0.07); g.add(win);
      beam(1.05,0.11,0.16,wx,wy+0.58,d/2+0.08); beam(1.05,0.11,0.16,wx,wy-0.58,d/2+0.08);
      beam(0.11,1.15,0.16,wx-0.49,wy,d/2+0.08); beam(0.11,1.15,0.16,wx+0.49,wy,d/2+0.08);
      beam(0.07,1.05,0.14,wx,wy,d/2+0.12); beam(0.85,0.07,0.14,wx,wy,d/2+0.12);
    }
    // side windows
    if(rnd()<0.8){
      const sw=box(0.12,0.9,0.8,winMat); sw.position.set(w/2+0.07,wy,0); g.add(sw);
      beam(0.16,0.1,1.0,w/2+0.08,wy+0.5,0); beam(0.16,0.1,1.0,w/2+0.08,wy-0.5,0);
    }
  }
  // door
  const door=box(1.25,2.0,0.14,M.darkWood); door.position.set(0,y0+1.0,d/2+0.08); g.add(door);
  beam(1.5,0.16,0.2,0,y0+2.05,d/2+0.1); beam(0.16,2.1,0.2,-0.7,y0+1.05,d/2+0.1); beam(0.16,2.1,0.2,0.7,y0+1.05,d/2+0.1);
  const knob=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8),M.iron); knob.position.set(0.45,y0+1.0,d/2+0.18); g.add(knob);
  // roof: ridge along z
  const roofRise=o.roofRise||w*0.46;
  const slope=Math.atan2(roofRise,w/2), panelLen=Math.hypot(w/2,roofRise)+0.35;
  const roofMat=o.roof;
  for(const s of [-1,1]){
    const panel=box(panelLen,0.22,d+0.9,roofMat);
    panel.rotation.z=-s*slope;
    panel.position.set(s*w/4,y0+h+roofRise/2+0.05,0);
    g.add(panel);
  }
  // ridge cap
  const ridge=box(0.45,0.3,d+1.0,roofMat); ridge.position.set(0,y0+h+roofRise+0.12,0); g.add(ridge);
  // gable ends
  const shape=new THREE.Shape(); shape.moveTo(-w/2,0); shape.lineTo(w/2,0); shape.lineTo(0,roofRise); shape.closePath();
  const gg=new THREE.ShapeGeometry(shape);
  for(const s of [-1,1]){
    const gm=new THREE.Mesh(gg,o.wall); gm.position.set(0,y0+h,s*(d/2+0.01));
    if(s<0) gm.rotation.y=Math.PI; g.add(gm);
    // gable timber triangle accents
    const b1=beam(w*0.9,0.13,0.1,0,y0+h+0.12,s*(d/2+0.06));
  }
  // chimney
  const cx=w*0.3, cz=d*0.28;
  const ch=box(0.85,y0+h+roofRise-y0+0.9-0.4,0.85,M.stone);
  ch.position.set(cx,(y0+h+roofRise+1.3)/2,cz); g.add(ch);

  g.userData.chimneyLocal=new THREE.Vector3(cx,y0+h+roofRise+1.5,cz);
  shadows(g);
  return g;
}

/* ---------- Paths draped over terrain ---------- */
function makePath(points,width){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],0,p[1])));
  const N=Math.max(24,points.length*12), pos=[], uv=[], idx=[];
  for(let i=0;i<=N;i++){
    const t=i/N, p=curve.getPoint(t), tan=curve.getTangent(t);
    const nx=-tan.z, nz=tan.x, len=Math.hypot(nx,nz)||1;
    const ox=nx/len*width/2, oz=nz/len*width/2;
    for(const s of [-1,1]){
      const x=p.x+ox*s, z=p.z+oz*s;
      pos.push(x,terrainHeight(x,z)+0.07,z);
      uv.push(s<0?0:1, t*width*0.25);
    }
    if(i<N){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx); geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,M.dirt); m.receiveShadow=true; scene.add(m);
}

function fence(x1,z1,x2,z2){
  const g=new THREE.Group();
  const dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz), ang=Math.atan2(dx,dz);
  const n=Math.max(1,Math.round(len/1.8));
  for(let i=0;i<=n;i++){
    const t=i/n, x=lerp(x1,x2,t), z=lerp(z1,z2,t);
    const p=box(0.14,1.25,0.14,M.darkWood); p.position.set(x,terrainHeight(x,z)+0.62,z); g.add(p);
  }
  for(const yy of [0.5,0.95]){
    const rail=box(0.09,0.12,len,M.wood);
    rail.position.set((x1+x2)/2,terrainHeight((x1+x2)/2,(z1+z2)/2)+yy,(z1+z2)/2);
    rail.rotation.y=ang; g.add(rail);
  }
  scene.add(g);
}

barrel(6,-4); barrel(7,-3.5); barrel(-6,5); barrel(9,7); barrel(-8,-6);

/* ---------- Lake water (animated shader) ---------- */
const waterUniforms={
  uTime:{value:0}, uSun:{value:sunDir}, uSunColor:{value:new THREE.Color(0xffcf8a)},
  uHorizon:{value:skyHorizon}, uTop:{value:skyTop},
  uDeep:{value:new THREE.Color(0x213f46)}, uShallow:{value:new THREE.Color(0x4b7a78)}
};
const waterMat=new THREE.ShaderMaterial({
  uniforms:waterUniforms, transparent:false, side:THREE.DoubleSide,
  vertexShader:`
    uniform float uTime; varying vec2 vUv; varying vec3 vWorld;
    void main(){
      vUv=uv;
      vec3 p=position;
      p.y += sin(p.x*0.6+uTime*0.8)*0.06 + cos(p.z*0.5-uTime*0.65)*0.06;
      vec4 wp=modelMatrix*vec4(p,1.0); vWorld=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:`
    uniform float uTime; uniform vec3 uSun,uSunColor,uHorizon,uTop,uDeep,uShallow;
    varying vec2 vUv; varying vec3 vWorld;
    float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
    void main(){
      vec2 p=vWorld.xz*0.38; float t=uTime*0.5;
      float w1=sin(p.x*1.6+t)*0.5+sin(p.y*1.25-t*0.8)*0.5;
      float w2=sin((p.x+p.y)*2.1+t*1.3)*0.5;
      float nn=n(p*1.4+t*0.08);
      vec3 normal=normalize(vec3(w1*0.16+(nn-0.5)*0.18,1.0,w2*0.16+(nn-0.5)*0.18));
      vec3 V=normalize(cameraPosition-vWorld);
      float fres=pow(1.0-max(dot(normal,V),0.0),3.0);
      vec3 R=reflect(-V,normal);
      float rh=clamp(R.y*0.5+0.5,0.0,1.0);
      vec3 skyRefl=mix(uHorizon,uTop,pow(rh,1.4));
      float sd=max(dot(R,normalize(uSun)),0.0);
      skyRefl+=uSunColor*pow(sd,70.0)*0.55+uSunColor*pow(sd,700.0)*3.0;
      vec3 base=mix(uDeep,uShallow,0.35+0.3*w1);
      vec3 col=mix(base,skyRefl,clamp(fres*0.85+0.12,0.0,1.0));
      col+=uSunColor*pow(sd,420.0)*1.4;
      gl_FragColor=vec4(col,1.0);
    }`
});
function discGeo(radius,rings,segs){
  const pos=[],uv=[],idx=[];
  for(let r=0;r<=rings;r++){
    const rad=radius*r/rings;
    for(let s=0;s<=segs;s++){
      const a=s/segs*Math.PI*2;
      pos.push(Math.cos(a)*rad,0,Math.sin(a)*rad);
      uv.push(0.5+Math.cos(a)*rad/(2*radius),0.5+Math.sin(a)*rad/(2*radius));
    }
  }
  for(let r=0;r<rings;r++) for(let s=0;s<segs;s++){
    const a=r*(segs+1)+s,b=a+segs+1; idx.push(a,b,a+1,b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

/* ============================================================
   Instanced vegetation: thousands of grass tufts + wildflowers
   ============================================================ */
(function vegetation(){
  const GRASS=7000, FLOWERS=1400;
  const grassGeo=new THREE.ConeGeometry(0.09,0.55,3);
  grassGeo.translate(0,0.27,0);
  const grassMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,side:THREE.DoubleSide});
  const grassIM=new THREE.InstancedMesh(grassGeo,grassMat,GRASS);
  const colors=[new THREE.Color(0x6f9a4a),new THREE.Color(0x88a850),new THREE.Color(0x5d823f),new THREE.Color(0xa8a955),new THREE.Color(0x74984a)];
  let placed=0, tries=0;
  while(placed<GRASS && tries<GRASS*4){
    tries++;
    const x=rr(-110,110), z=rr(-110,110);
    if(Math.hypot(x,z)<16.2) continue;
    if(Math.hypot(x-LAKE.x,z-LAKE.z)<LAKE.r+1) continue;
    if(Math.hypot(x-HILL.x,z-HILL.z)<9) continue;
    let near=false;
    for(const s of houseSpots){ if(Math.hypot(x-s[0],z-s[1])<5){near=true;break;} }
    if(near) continue;
    dummy.position.set(x,terrainHeight(x,z)-0.05,z);
    dummy.rotation.set(rr(-0.18,0.18),rr(0,6),rr(-0.18,0.18));
    const s=rr(0.6,1.6); dummy.scale.set(s,s*rr(0.8,1.5),s);
    dummy.updateMatrix(); grassIM.setMatrixAt(placed,dummy.matrix);
    grassIM.setColorAt(placed,pick(colors));
    placed++;
  }
  grassIM.count=placed; grassIM.instanceMatrix.needsUpdate=true;
  if(grassIM.instanceColor) grassIM.instanceColor.needsUpdate=true;
  grassIM.castShadow=false; grassIM.receiveShadow=false; scene.add(grassIM);

  const flowerGeo=new THREE.IcosahedronGeometry(0.11,0);
  const flowerMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.8});
  const flowerIM=new THREE.InstancedMesh(flowerGeo,flowerMat,FLOWERS);
  const fc=[0xc8445a,0xe6c04b,0xb56ec4,0xf0f0e0,0xe07a3c,0x5a8ed0].map(c=>new THREE.Color(c));
  let fp=0,ft=0;
  while(fp<FLOWERS && ft<FLOWERS*5){
    ft++;
    const x=rr(-80,80),z=rr(-80,80);
    if(Math.hypot(x,z)<17||Math.hypot(x-LAKE.x,z-LAKE.z)<LAKE.r+1) continue;
    dummy.position.set(x,terrainHeight(x,z)+0.35,z);
    dummy.rotation.set(0,rr(0,6),0);
    dummy.scale.setScalar(rr(0.7,1.5));
    dummy.updateMatrix(); flowerIM.setMatrixAt(fp,dummy.matrix);
    flowerIM.setColorAt(fp,pick(fc)); fp++;
  }
  flowerIM.count=fp; flowerIM.instanceMatrix.needsUpdate=true;
  if(flowerIM.instanceColor) flowerIM.instanceColor.needsUpdate=true;
  scene.add(flowerIM);
})();

const villagers=[];

const smokeParticles=[];
(function createSmoke(){
  smokeSources.forEach(src=>{
    for(let i=0;i<9;i++){

const birds=[];
(function createBirds(){
  const bm=new THREE.MeshBasicMaterial({color:0x3d3340,side:THREE.DoubleSide,fog:true});
  for(let f=0;f<3;f++){
    for(let i=0;i<6;i++){
      const g=new THREE.Group();
      const wingGeo=new THREE.BufferGeometry();
      wingGeo.setAttribute('position',new THREE.Float32BufferAttribute([0,0,0, 0.9,0.1,-0.35, 0.7,0,-0.9],3));
      wingGeo.computeVertexNormals();
      const wl=new THREE.Mesh(wingGeo,bm), wr=new THREE.Mesh(wingGeo,bm);

const fireflies=(function(){
  const N=260, pos=new Float32Array(N*3), info=[];
  for(let i=0;i<N;i++){
    const a=rr(0,Math.PI*2), r=rr(5,48);
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=rr(0.4,4.5); pos[i*3+2]=Math.sin(a)*r;
    info.push({x:pos[i*3],y:pos[i*3+1],z:pos[i*3+2],ph:rr(0,6),sp:rr(0.3,0.9)});
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({map:GLOW,color:0xffe07a,size:0.85,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  const pts=new THREE.Points(geo,mat); scene.add(pts);
  return {pts,info,mat,N};
})();

const clouds=[];
(function createClouds(){
  for(let i=0;i<26;i++){
    const g=new THREE.Group();
    const n=ri(4,7);
    for(let k=0;k<n;k++){
      const m=new THREE.Mesh(new THREE.PlaneGeometry(rr(30,58),rr(13,24)),
        new THREE.MeshBasicMaterial({map:CLOUD,transparent:true,opacity:rr(0.55,0.9),depthWrite:false,fog:false,side:THREE.DoubleSide,color:0xffe0c4}));
      m.position.set(rr(-16,16),rr(-4,4),rr(-2,2)); g.add(m);
    }
    const a=rr(0,Math.PI*2), r=rr(120,230);
    g.position.set(Math.cos(a)*r,rr(58,100),Math.sin(a)*r);
    g.userData.speed=rr(1.2,3.0);
    scene.add(g); clouds.push(g);
  }
})();

/* ============================================================
   Post-processing

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));

window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h); composer.setSize(w,h); bloom.setSize(w,h);

/* ============================================================
   Animation
   ============================================================ */
window.__viz={scene,camera,controls,renderer,composer,sunDir,LAKE,HILL,blades,villagers,clouds,birds,smokeParticles,fireflies,waterUniforms};
const clock=new THREE.Clock();
let elapsed=0;
const fp=fireflies.pts.geometry.attributes.position;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1); elapsed+=dt;
  controls.update();

  // windmill
  if(blades) blades.rotation.z+=dt*0.55;

  // villagers
  for(const v of villagers){
    const a=v.phase+elapsed*v.speed;
    const x=v.cx+Math.cos(a)*v.radius, z=v.cz+Math.sin(a)*v.radius;
    const ny=terrainHeight(x,z);
    v.g.position.set(x,ny+0.02+Math.abs(Math.sin(elapsed*6+v.phase))*0.05,z);
    const dir=Math.atan2(-Math.sin(a)*v.speed, -Math.cos(a)*v.speed);
    v.g.rotation.y=dir+Math.PI/2;
    const sw=Math.sin(elapsed*6+v.phase)*0.5;
    v.legL.rotation.x=sw; v.legR.rotation.x=-sw;
    v.armL.rotation.x=-sw*0.7; v.armR.rotation.x=sw*0.7;
  }

  // smoke
  for(const p of smokeParticles){
    p.age+=dt*p.speed; if(p.age>1) p.age-=1;
    const f=p.age;
    p.s.position.set(p.src.x+Math.sin(p.phase+f*3)*f*1.4+p.drift*f*1.5,
      p.src.y+f*7.5, p.src.z+Math.cos(p.phase+f*2.4)*f*1.2);
    p.s.material.opacity=(1-f)*0.28;
    p.s.scale.setScalar(p.base*(0.5+f*2.2));
  }

  // birds
  for(const b of birds){
    const a=b.phase+elapsed*b.speed;
    b.g.position.set(b.cx+Math.cos(a)*b.radius,b.height+Math.sin(elapsed*0.8+b.phase)*1.6,b.cz+Math.sin(a)*b.radius);
    b.g.rotation.y=-a+Math.PI/2;
    const flap=Math.sin(elapsed*b.flap+b.phase)*0.7;
    b.wl.rotation.z=flap; b.wr.rotation.z=-flap;
  }

  // fireflies
  fireflies.mat.opacity=0.55+0.4*Math.sin(elapsed*1.3);
  for(let i=0;i<fireflies.N;i++){
    const f=fireflies.info[i];
    fp.array[i*3]=f.x+Math.sin(elapsed*f.sp+f.ph)*1.3;
    fp.array[i*3+1]=f.y+Math.sin(elapsed*f.sp*1.4+f.ph*2)*0.7;
    fp.array[i*3+2]=f.z+Math.cos(elapsed*f.sp*0.8+f.ph)*1.3;
  }
  fp.needsUpdate=true;

  // clouds drift
  for(const c of clouds){
    c.position.x+=c.userData.speed*dt;
    if(c.position.x>280) c.position.x=-280;
    c.quaternion.copy(camera.quaternion);
  }

  // water
  waterUniforms.uTime.value=elapsed;

  composer.render();
}

// hide loader after first frames
let frames=0;
function kickoff(){ animate(); }
requestAnimationFrame(function ready(){
  composer.render();
  document.getElementById('loader').classList.add('hidden');
  kickoff();
});
