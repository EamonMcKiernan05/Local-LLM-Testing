<script type="module">
import * as THREE from 'three';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ *
 *  LIQUID CHROME GARDEN — study 017
 *  Deterministic seed 1337. All geometry, textures, environment and
 *  sound are generated in code. Fixed-step simulation, pooled detail.
 * ------------------------------------------------------------------ */

const SEED = 1337;
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const rng = mulberry32(SEED);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const smooth=(t)=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;

/* integer hash -> [0,1), for value noise */
function ihash(x,y,z){
  let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(z|0,1274126177)+SEED)|0;
  h=Math.imul(h^(h>>>13),1274126177)>>>0;
  return ((h^(h>>>16))>>>0)/4294967295;
}
function vnoise(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  const xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const a=lerp(ihash(xi,yi,zi),ihash(xi+1,yi,zi),u);
  const b=lerp(ihash(xi,yi+1,zi),ihash(xi+1,yi+1,zi),u);
  const c=lerp(ihash(xi,yi,zi+1),ihash(xi+1,yi,zi+1),u);
  const d=lerp(ihash(xi,yi+1,zi+1),ihash(xi+1,yi+1,zi+1),u);
  return lerp(lerp(a,b,v),lerp(c,d,v),w);
}
function fbm(x,y,z){return 0.55*vnoise(x,y,z)+0.3*vnoise(x*2.1+7,y*2.1+3,z*2.1+11)+0.15*vnoise(x*4.3+31,y*4.3+17,z*4.3+5);}

let renderer, scene, camera, trayGroup, mc, envTex, mcRes=64, beadInst;
const M4=new THREE.Matrix4(), V3=new THREE.Vector3(), V3b=new THREE.Vector3(), Q0=new THREE.Quaternion();
function setMCRes(res){
  const mat=mc.material;
  trayGroup.remove(mc);
  mc.geometry.dispose();
  mc=new MarchingCubes(res,mat,false,false,60000);
  mc.scale.set(FIELD.sx,FIELD.sy,FIELD.sz);
  mc.position.set(0,FIELD.py,0);
  mc.isolation=ISO;
  mc.frustumCulled=false;
  mc.castShadow=true;mc.receiveShadow=true;
  trayGroup.add(mc);
  mcRes=res;
}
const canvas = document.getElementById('scene');

/* ============================ textures ============================ */
function makeCeramicMaps(){
  const S=512;
  const c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  const img=g.createImageData(S,S);
  const r2=mulberry32(SEED+11);
  for(let i=0;i<S*S;i++){
    const n=(r2()-0.5)*3.5 + (fbm((i%S)/26,((i/S)|0)/26,3.7)-0.5)*5;
    img.data[i*4]=clamp(233+n,0,255);
    img.data[i*4+1]=clamp(228+n,0,255);
    img.data[i*4+2]=clamp(219+n*0.9,0,255);
    img.data[i*4+3]=255;
  }
  g.putImageData(img,0,0);
  /* faint glaze runs */
  g.globalAlpha=0.045;g.strokeStyle='#b9b2a4';g.lineWidth=7;
  for(let i=0;i<14;i++){
    g.beginPath();
    const x=r2()*S,y=r2()*S;
    g.moveTo(x,y);
    g.bezierCurveTo(x+40-r2()*80,y+60,x+40-r2()*80,y+140,x+20-r2()*40,y+220);
    g.stroke();
  }
  /* pinholes */
  g.globalAlpha=0.10;g.fillStyle='#8f887c';
  for(let i=0;i<70;i++){
    g.beginPath();g.arc(r2()*S,r2()*S,0.5+r2()*1.1,0,6.283);g.fill();
  }
  g.globalAlpha=1;
  const map=new THREE.CanvasTexture(c);
  map.colorSpace=THREE.SRGBColorSpace;
  map.wrapS=map.wrapT=THREE.RepeatWrapping;map.repeat.set(1.6,1.6);map.anisotropy=4;

  /* roughness / bump from a second canvas */
  const rc=document.createElement('canvas');rc.width=rc.height=S;
  const rg=rc.getContext('2d');
  const rimg=rg.createImageData(S,S);
  const r3=mulberry32(SEED+29);
  for(let i=0;i<S*S;i++){
    const x=(i%S)/S,y=((i/S)|0)/S;
    let v=0.30+(fbm(x*14,y*14,8.2)-0.5)*0.10+(r3()-0.5)*0.03;
    v+= (fbm(x*3+40,y*3,1.1)>0.66)?0.06:0;   /* dull glaze patches */
    const b=clamp(v*255,0,255);
    rimg.data[i*4]=rimg.data[i*4+1]=rimg.data[i*4+2]=b;rimg.data[i*4+3]=255;
  }
  rg.putImageData(rimg,0,0);
  const rough=new THREE.CanvasTexture(rc);
  rough.wrapS=rough.wrapT=THREE.RepeatWrapping;rough.repeat.set(1.6,1.6);rough.anisotropy=4;
  return {map,rough};
}

function makeBasaltMaps(){
  const S=256;
  const c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  const img=g.createImageData(S,S);
  const r2=mulberry32(SEED+47);
  for(let i=0;i<S*S;i++){
    const x=(i%S)/S,y=((i/S)|0)/S;
    const n=fbm(x*14,y*14,2.2)*0.6+fbm(x*42,y*42,9.1)*0.4;
    let v=105+n*40+(r2()-0.5)*8;
    if(r2()>0.994) v+=50;                    /* rare mineral fleck */
    img.data[i*4]=clamp(v,0,255);
    img.data[i*4+1]=clamp(v+1,0,255);
    img.data[i*4+2]=clamp(v+3,0,255);
    img.data[i*4+3]=255;
  }
  g.putImageData(img,0,0);
  const map=new THREE.CanvasTexture(c);
  map.colorSpace=THREE.SRGBColorSpace;
  map.wrapS=map.wrapT=THREE.RepeatWrapping;map.repeat.set(2,2);map.anisotropy=4;
  const bump=new THREE.CanvasTexture(c);
  bump.wrapS=bump.wrapT=THREE.RepeatWrapping;bump.repeat.set(2,2);
  return {map,bump};
}

function makeBlobTexture(){
  const S=128,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(S/2,S/2,4,S/2,S/2,S/2);
  gr.addColorStop(0,'rgba(0,0,0,0.62)');
  gr.addColorStop(0.55,'rgba(0,0,0,0.30)');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,S,S);
  const t=new THREE.CanvasTexture(c);return t;
}

function makeMoteTexture(){
  const S=32,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.4,'rgba(255,255,255,0.35)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,S,S);
  return new THREE.CanvasTexture(c);
}

/* ========================= environment ============================ */
function buildEnvironment(){
  const env=new THREE.Scene();
  /* gradient dome */
  const dome=new THREE.Mesh(
    new THREE.SphereGeometry(30,32,16),
    new THREE.ShaderMaterial({
      side:THREE.BackSide,
      uniforms:{},
      vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader:'varying vec3 vP;void main(){float h=clamp(vP.y/30.0*0.5+0.5,0.0,1.0);vec3 c=mix(vec3(0.012,0.013,0.016),vec3(0.16,0.17,0.20),pow(h,1.4));gl_FragColor=vec4(c,1.0);}'
    }));
  env.add(dome);
  const panel=(w,h,col,pos)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide}));
    m.position.copy(pos);m.lookAt(0,0,0);env.add(m);return m;
  };
  /* the luminous studio strip — key reflection */
  panel(10,1.5,new THREE.Color(12,12,12.8),new THREE.Vector3(0,6.2,-2.2));
  /* broad cool fill, left */
  panel(6,3.4,new THREE.Color(2.0,2.3,2.9),new THREE.Vector3(-7.5,3.2,4.5));
  /* warm bounce card, right */
  panel(4.5,3,new THREE.Color(1.5,1.15,0.8),new THREE.Vector3(7.5,2.4,3.2));
  /* dark flags for coherent contrast */
  panel(7,7,new THREE.Color(0.012,0.012,0.014),new THREE.Vector3(-8,2,-6.5));
  panel(7,7,new THREE.Color(0.012,0.012,0.014),new THREE.Vector3(8,2,-6.5));
  panel(12,12,new THREE.Color(0.05,0.05,0.055),new THREE.Vector3(0,-4,0));
  const pm=new THREE.PMREMGenerator(renderer);
  const rt=pm.fromScene(env,0.035);
  pm.dispose();
  env.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});
  return rt.texture;
}

/* ============================ geometry ============================ */
function roundedRectShape(w,h,r){
  const s=new THREE.Shape();const x=-w/2,y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y);s.absarc(x+w-r,y+r,r,-Math.PI/2,0,false);
  s.lineTo(x+w,y+h-r);s.absarc(x+w-r,y+h-r,r,0,Math.PI/2,false);
  s.lineTo(x+r,y+h);s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI,false);
  s.lineTo(x,y+r);s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5,false);
  return s;
}

const TRAY={hx:2.85,hz:1.85,cr:0.65,wallH:0.42};
const FIELD={sx:3.0,sy:1.9,sz:3.0,py:1.0};
const ISO=80, SUB=12;
const strengthFor=(R)=>{const rn=R/(2*FIELD.sx);return rn*rn*(ISO+SUB);};

/* basalt islands (x,z,plan radius) */
const ISLANDS=[
  {x:-1.20,z:-0.38,r:0.62,sy:0.80,seed:3},
  {x: 0.55,z: 0.42,r:0.50,sy:0.86,seed:19},
  {x: 1.78,z:-0.62,r:0.40,sy:0.74,seed:41}
];

function buildTray(ceramic){
  trayGroup=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({
    color:0xe9e4da,map:ceramic.map,roughnessMap:ceramic.rough,roughness:1.0,
    bumpMap:ceramic.rough,bumpScale:0.004,metalness:0.0,envMapIntensity:0.55
  });
  /* floor slab */
  const floorG=new THREE.ExtrudeGeometry(roundedRectShape(6.3,4.3,0.95),
    {depth:0.22,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.05,bevelSegments:3,curveSegments:24});
  floorG.rotateX(-Math.PI/2);floorG.translate(0,-0.22,0);
  const floor=new THREE.Mesh(floorG,mat);
  floor.receiveShadow=true;floor.castShadow=true;
  trayGroup.add(floor);
  /* raised lip */
  const outer=roundedRectShape(6.3,4.3,0.95);
  const hole=roundedRectShape(TRAY.hx*2,TRAY.hz*2,TRAY.cr);
  outer.holes.push(hole);
  const wallG=new THREE.ExtrudeGeometry(outer,
    {depth:TRAY.wallH,bevelEnabled:true,bevelThickness:0.055,bevelSize:0.055,bevelSegments:4,curveSegments:24});
  wallG.rotateX(-Math.PI/2);
  const walls=new THREE.Mesh(wallG,mat);
  walls.receiveShadow=true;walls.castShadow=true;
  trayGroup.add(walls);
  /* pivot socket under the tray */
  const socket=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.36,0.16,28),
    new THREE.MeshStandardMaterial({color:0x3a3d42,metalness:0.85,roughness:0.42,envMapIntensity:0.8}));
  socket.position.y=-0.30;socket.castShadow=true;
  trayGroup.add(socket);
  scene.add(trayGroup);
}

function buildIslands(basalt,blobTex){
  for(const isl of ISLANDS){
    let g=new THREE.IcosahedronGeometry(1,10);
    const p=g.attributes.position;
    const v=new THREE.Vector3();
    for(let i=0;i<p.count;i++){
      v.fromBufferAttribute(p,i).normalize();
      const d=1+0.11*(fbm(v.x*3.5+isl.seed,v.y*3.5+isl.seed*0.7,v.z*3.5)-0.5)*2
              +0.022*(fbm(v.x*8.5+isl.seed*2,v.y*8.5,v.z*8.5)-0.5)*2;
      v.multiplyScalar(d);
      v.y=Math.max(v.y,-0.42);                 /* seated base */
      p.setXYZ(i,v.x,v.y,v.z);
    }
    g.deleteAttribute('normal');g.deleteAttribute('uv');
    g=mergeVertices(g,1e-4);
    g.computeVertexNormals();
    /* seamless spherical UVs for the procedural map */
    const pp=g.attributes.position, uv=new Float32Array(pp.count*2);
    for(let i=0;i<pp.count;i++){
      const x=pp.getX(i),y=pp.getY(i),z=pp.getZ(i);
      const L=Math.hypot(x,y,z)||1;
      uv[i*2]=0.5+Math.atan2(z,x)/(Math.PI*2);
      uv[i*2+1]=0.5+Math.asin(clamp(y/L,-1,1))/Math.PI;
    }
    g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const m=new THREE.MeshStandardMaterial({
      color:0x8a8f95,map:basalt.map,bumpMap:basalt.bump,bumpScale:0.05,
      roughness:0.88,metalness:0.0,envMapIntensity:0.4
    });
    const mesh=new THREE.Mesh(g,m);
    mesh.scale.set(isl.r,isl.r*isl.sy,isl.r*0.92);
    mesh.position.set(isl.x,0.03,isl.z);
    mesh.rotation.y=isl.seed*0.7;
    mesh.castShadow=true;mesh.receiveShadow=true;
    trayGroup.add(mesh);
    isl.mesh=mesh;
    /* baked contact shadow */
    const sh=new THREE.Mesh(new THREE.PlaneGeometry(isl.r*3.1,isl.r*3.1),
      new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false,opacity:0.6,
        polygonOffset:true,polygonOffsetFactor:-2}));
    sh.rotation.x=-Math.PI/2;sh.position.set(isl.x,0.006,isl.z);
    sh.renderOrder=1;
    trayGroup.add(sh);
  }
}

function buildSupport(){
  const metal=new THREE.MeshStandardMaterial({color:0x767b84,metalness:0.9,roughness:0.3,envMapIntensity:1.0});
  const dark=new THREE.MeshStandardMaterial({color:0x3a3d43,metalness:0.7,roughness:0.5,envMapIntensity:0.7});
  const col=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.24,1.24,24),metal);
  col.position.y=-0.98;col.castShadow=true;scene.add(col);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(0.21,28,20),metal);
  ball.position.y=-0.36;ball.castShadow=true;scene.add(ball);
  const yoke=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.045,14,40),dark);
  yoke.position.y=-0.36;yoke.rotation.x=Math.PI/2;yoke.castShadow=true;scene.add(yoke);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.95,0.09,40),dark);
  base.position.y=-1.555;base.castShadow=true;base.receiveShadow=true;scene.add(base);
  /* instanced bolts around the base */
  const boltG=new THREE.CylinderGeometry(0.035,0.035,0.05,10);
  const bolts=new THREE.InstancedMesh(boltG,metal,8);
  const M=new THREE.Matrix4();
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2+0.3;
    M.makeRotationY(a);M.setPosition(Math.cos(a)*0.72,-1.49,Math.sin(a)*0.72);
    bolts.setMatrixAt(i,M);
  }
  bolts.castShadow=true;scene.add(bolts);
}

function buildStage(blobTex){
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),
    new THREE.MeshStandardMaterial({color:0x141518,roughness:0.9,metalness:0,envMapIntensity:0.25}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-1.6;ground.receiveShadow=true;
  scene.add(ground);
  /* soft pooled shadow under the pedestal */
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(9,6.4),
    new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false,opacity:0.55,
      polygonOffset:true,polygonOffsetFactor:-2}));
  sh.rotation.x=-Math.PI/2;sh.position.y=-1.592;sh.renderOrder=1;
  scene.add(sh);
  /* the visible luminous strip, matching the environment key */
  const strip=new THREE.Mesh(new THREE.PlaneGeometry(14,0.55),
    new THREE.MeshBasicMaterial({color:new THREE.Color(6,6,6.5),fog:false}));
  strip.position.set(-2.5,0.55,-12);
  scene.add(strip);
  const stripFrame=new THREE.Mesh(new THREE.PlaneGeometry(14.4,0.95),
    new THREE.MeshBasicMaterial({color:0x0c0d10,fog:false}));
  stripFrame.position.set(-2.5,0.55,-12.06);
  scene.add(stripFrame);
}

/* ========================= liquid simulation ====================== */
const H=1/120;
const G=9.8;
const drops=[];
const transfers=[];
let simTime=0, acc=0, nextSplit=6.5, volume0=0;
let hero={active:false,a:null,b:null,isl:null,th0:0,s:0,blend:0};
const audioEvents=[];
let prevTiltVel=0;

function addDrop(x,z,r,vx=0,vz=0){
  const d={x,z,r,vx,vz,V:r*r*r,mergeLock:0,heroW:0};
  drops.push(d);return d;
}
function radiusFromV(V){return Math.cbrt(Math.max(V,0));}

function spawnInitial(){
  const pts=[
    [-1.70, 0.30,0.58],[ 1.85,-0.55,0.52],
    [-0.35,-1.15,0.30],[ 1.15, 0.70,0.26],[-2.25,-0.95,0.24]
  ];
  for(const [x,z,r] of pts) addDrop(x,z,r);
  const r4=mulberry32(SEED+5);
  for(let i=0;i<5;i++){
    let x,z,ok=false,tries=0;
    while(!ok&&tries++<40){
      x=(r4()*2-1)*2.4;z=(r4()*2-1)*1.05;ok=true;
      for(const isl of ISLANDS) if(Math.hypot(x-isl.x,z-isl.z)<isl.r+0.25) ok=false;
      for(const d of drops) if(Math.hypot(x-d.x,z-d.z)<d.r+0.2) ok=false;
    }
    addDrop(x,z,0.085+r4()*0.05);
  }
  volume0=drops.reduce((s,d)=>s+d.V,0);
}

function tiltAt(t){
  return {
    x:0.055*Math.sin(t*2*Math.PI/23),
    z:0.050*Math.sin(t*2*Math.PI/31+1.7)
  };
}

/* rounded-rect tray SDF (negative inside) */
function traySDF(x,z){
  const qx=Math.abs(x)-(TRAY.hx-TRAY.cr);
  const qz=Math.abs(z)-(TRAY.hz-TRAY.cr);
  const ox=Math.max(qx,0),oz=Math.max(qz,0);
  return Math.hypot(ox,oz)+Math.min(Math.max(qx,qz),0)-TRAY.cr;
}

function startTransfer(from,to,dur,removeAfter,dir,frac){
  transfers.push({from,to,dur,t:0,
    rate:0,removeAfter,dir,done:0,
    amount:removeAfter?from.V:from.V*(frac||0.14)});
  const tr=transfers[transfers.length-1];
  tr.rate=tr.amount/dur;
  from.mergeLock=to.mergeLock=dur+0.1;
}

function step(h){
  simTime+=h;
  const tilt=tiltAt(simTime);
  const ax=-G*Math.sin(tilt.z), az=G*Math.sin(tilt.x);
  /* creak at tilt extrema */
  const tv=Math.cos(simTime*2*Math.PI/23);
  if(prevTiltVel>0&&tv<=0||prevTiltVel<0&&tv>=0){
    if(rng()<0.85) audioEvents.push({type:'creak',p:0.7+rng()*0.5});
  }
  prevTiltVel=tv;

  /* ---- hero choreography ---- */
  const CYCLE=30, p=simTime%CYCLE;
  if(!hero.active&&p>=7&&p<20){
    const sorted=[...drops].filter(d=>d.mergeLock<=0).sort((a,b)=>b.V-a.V);
    if(sorted.length>=2&&sorted[1].r>0.3){
      hero.active=true;hero.a=sorted[0];hero.b=sorted[1];
      hero.isl=ISLANDS[1];
      hero.th0=Math.atan2(hero.a.z-hero.isl.z,hero.a.x-hero.isl.x);
      hero.a.mergeLock=hero.b.mergeLock=14;
    }
  }
  if(hero.active){
    if(p<7||p>=20){
      /* release: gentle outward separation */
      const isl=hero.isl;
      for(const d of [hero.a,hero.b]){
        const dx=d.x-isl.x,dz=d.z-isl.z,L=Math.hypot(dx,dz)||1;
        d.vx+=dx/L*0.55;d.vz+=dz/L*0.55;
        d.mergeLock=3.5;
      }
      hero.active=false;hero.a=hero.b=null;hero.blend=0;
    } else {
      const u=(p-7)/13;
      hero.s=smooth(u);
      hero.blend=smooth(Math.min(u/0.14,1))*smooth(Math.min((1-u)/0.14,1));
    }
  }
  if(!hero.active) hero.blend=Math.max(0,hero.blend-h*2);

  /* ---- transfers (merge / split), volume-exact ---- */
  for(let i=transfers.length-1;i>=0;i--){
    const tr=transfers[i];
    tr.t+=h;
    const dv=Math.min(tr.rate*h,tr.from.V,tr.amount-(tr.done||0));
    tr.done=(tr.done||0)+dv;
    tr.from.V-=dv;tr.to.V+=dv;
    tr.from.r=radiusFromV(tr.from.V);tr.to.r=radiusFromV(tr.to.V);
    if(tr.removeAfter){
      const k=smooth(tr.t/tr.dur);
      tr.from.x=lerp(tr.from.x,tr.to.x,k*0.35);
      tr.from.z=lerp(tr.from.z,tr.to.z,k*0.35);
    } else {
      const k=smooth(tr.t/tr.dur);
      tr.to.x=tr.from.x+tr.dir.x*(tr.from.r+tr.to.r+0.06)*k;
      tr.to.z=tr.from.z+tr.dir.z*(tr.from.r+tr.to.r+0.06)*k;
      tr.to.vx=tr.from.vx+tr.dir.x*0.4*k;
      tr.to.vz=tr.from.vz+tr.dir.z*0.4*k;
    }
    if(tr.t>=tr.dur||tr.from.V<=1e-6){
      if(tr.removeAfter){
        const idx=drops.indexOf(tr.from);
        if(idx>=0){tr.to.V+=tr.from.V;tr.to.r=radiusFromV(tr.to.V);drops.splice(idx,1);}
        audioEvents.push({type:'blip',size:tr.to.r});
      }
      tr.from.mergeLock=Math.min(tr.from.mergeLock,0.2);
      tr.to.mergeLock=Math.max(tr.to.mergeLock,tr.removeAfter?1.5:2.5);
      transfers.splice(i,1);
    }
  }

  /* ---- spontaneous split keeps the population alive ---- */
  nextSplit-=h;
  if(drops.length<4) nextSplit=Math.min(nextSplit,1.2);
  if(nextSplit<=0){
    nextSplit=4.5+rng()*3;
    const cands=drops.filter(d=>d.r>0.45&&d.mergeLock<=0&&!(hero.active&&(d===hero.a||d===hero.b)));
    if(cands.length&&drops.length<12){
      const d=cands.sort((a,b)=>b.V-a.V)[0];
      const beads=drops.filter(x=>x.r<0.16).length;
      const frac=beads<3?0.10:0.42;
      const a=rng()*Math.PI*2;
      const child=addDrop(d.x,d.z,0.001,d.vx,d.vz);
      startTransfer(d,child,0.7,false,{x:Math.cos(a),z:Math.sin(a)},frac);
      child.mergeLock=3.0;
      child.vx+=Math.cos(a)*0.9;child.vz+=Math.sin(a)*0.9;
      audioEvents.push({type:'blip',size:0.3});
    }
  }

  /* ---- integrate ---- */
  for(const d of drops){
    d.mergeLock=Math.max(0,d.mergeLock-h);
    if(d.r<0.02) continue;
    let axd=ax, azd=az;
    const isHero=hero.active&&(d===hero.a||d===hero.b);
    if(isHero){
      const isl=hero.isl;
      const s=hero.s;
      const thA=hero.th0+2.6*s;
      const th=(d===hero.a)?thA:thA+Math.PI;
      const orbit=isl.r+d.r*0.85+0.14;
      const tx=isl.x+Math.cos(th)*orbit, tz=isl.z+Math.sin(th)*orbit;
      axd+= (tx-d.x)*7 - d.vx*4.2;
      azd+= (tz-d.z)*7 - d.vz*4.2;
      axd*=0.35;azd*=0.35;
      axd+=(tx-d.x)*5.5-d.vx*3.4;
      azd+=(tz-d.z)*5.5-d.vz*3.4;
    }
    d.vx+=axd*h;d.vz+=azd*h;
    const drag=Math.exp(-(isHero?0.4:0.85)*h);
    d.vx*=drag;d.vz*=drag;
    d.x+=d.vx*h;d.z+=d.vz*h;

    /* islands */
    for(const isl of ISLANDS){
      const dx=d.x-isl.x,dz=d.z-isl.z;
      const L=Math.hypot(dx,dz)||1e-6;
      const minD=isl.r+d.r*0.6;
      if(L<minD&&!(isHero&&isl===hero.isl)){
        const nx=dx/L,nz=dz/L;
        d.x=isl.x+nx*minD;d.z=isl.z+nz*minD;
        const vn=d.vx*nx+d.vz*nz;
        if(vn<0){d.vx-=nx*vn*1.25;d.vz-=nz*vn*1.25;}
      }
    }
    /* tray wall */
    const sd=traySDF(d.x,d.z);
    const lim=-d.r*0.55;
    if(sd>lim){
      const e=0.01;
      let nx=traySDF(d.x+e,d.z)-traySDF(d.x-e,d.z);
      let nz=traySDF(d.x,d.z+e)-traySDF(d.x,d.z-e);
      const L=Math.hypot(nx,nz)||1;nx/=L;nz/=L;
      d.x-=nx*(sd-lim);d.z-=nz*(sd-lim);
      const vn=d.vx*nx+d.vz*nz;
      if(vn>0){d.vx-=nx*vn*1.3;d.vz-=nz*vn*1.3;}
    }
    /* keep the implicit surface inside the field box */
    const fx=FIELD.sx-d.r*1.03-0.04, fz=FIELD.sz-d.r*1.03-0.04;
    if(d.x>fx){d.x=fx;d.vx=Math.min(d.vx,0);} if(d.x<-fx){d.x=-fx;d.vx=Math.max(d.vx,0);}
    if(d.z>fz){d.z=fz;d.vz=Math.min(d.vz,0);} if(d.z<-fz){d.z=-fz;d.vz=Math.max(d.vz,0);}
  }

  /* ---- merging ---- */
  for(let i=0;i<drops.length;i++){
    const a=drops[i];
    if(a.r<0.03||a.mergeLock>0) continue;
    for(let j=i+1;j<drops.length;j++){
      const b=drops[j];
      if(b.r<0.03||b.mergeLock>0) continue;
      if(hero.active&&((a===hero.a&&b===hero.b)||(a===hero.b&&b===hero.a))) continue;
      const dist=Math.hypot(a.x-b.x,a.z-b.z);
      if(dist<(a.r+b.r)*0.72){
        const big=a.V>=b.V?a:b, small=a.V>=b.V?b:a;
        if(big.r<0.16&&small.r<0.16){ a.mergeLock=b.mergeLock=0.5; continue; }
        if(radiusFromV(big.V+small.V)<=0.88&&drops.length>5){
          startTransfer(small,big,0.5,true,null);
        } else {
          /* too big to coalesce: soft push apart */
          const nx=(b.x-a.x)/(dist||1),nz=(b.z-a.z)/(dist||1);
          a.vx-=nx*0.25;a.vz-=nz*0.25;b.vx+=nx*0.25;b.vz+=nz*0.25;
          a.mergeLock=b.mergeLock=0.6;
        }
        break;
      }
    }
  }
}

/* ========================= implicit surface ======================= */
function ballAt(x,y,z,R,mult){
  if(R<0.025||mult<=0.003) return;
  const nx=(x/FIELD.sx+1)/2;
  const ny=((y-FIELD.py)/FIELD.sy+1)/2;
  const nz=(z/FIELD.sz+1)/2;
  if(nx<0.02||nx>0.98||ny<0.02||ny>0.98||nz<0.02||nz>0.98) return;
  mc.addBall(nx,ny,nz,strengthFor(R)*mult,SUB);
}

function updateField(){
  const tilt=tiltAt(simTime);
  trayGroup.rotation.x=tilt.x;
  trayGroup.rotation.z=tilt.z;
  mc.reset();
  /* carve the islands out of the liquid (non-wetting meniscus) */
  for(const isl of ISLANDS){
    const nx=(isl.x/FIELD.sx+1)/2;
    const ny=((0.16-FIELD.py)/FIELD.sy+1)/2;
    const nz=(isl.z/FIELD.sz+1)/2;
    mc.addBall(nx,ny,nz,-strengthFor(isl.r*1.02),SUB);
  }
  let beadCount=0;
  for(const d of drops){
    if(d.r<0.025) continue;
    const speed=Math.hypot(d.vx,d.vz);
    /* tiny satellites render as instanced spheres: smooth at any field res */
    if(d.r<0.16){
      if(beadCount<16){
        M4.compose(V3.set(d.x,d.r*0.45,d.z),Q0,V3b.set(d.r,d.r*0.63,d.r));
        beadInst.setMatrixAt(beadCount++,M4);
      }
      continue;
    }
    const isHero=hero.active&&(d===hero.a||d===hero.b)&&hero.blend>0.001;
    /* free shape: head + trailing tail when rolling */
    let balls;
    if(d.r>0.32&&speed>0.06){
      const dx=d.vx/speed,dz=d.vz/speed;
      const rh=d.r*Math.cbrt(0.74), rt=d.r*Math.cbrt(0.26);
      balls=[
        {x:d.x+dx*d.r*0.20,z:d.z+dz*d.r*0.20,r:rh},
        {x:d.x-dx*d.r*0.58,z:d.z-dz*d.r*0.58,r:rt}
      ];
    } else {
      balls=[{x:d.x,z:d.z,r:d.r}];
    }
    if(isHero){
      /* arc of nine beads wrapping the island — the horseshoe */
      const isl=hero.isl;
      const spreadPeak=1.5;
      const spread=spreadPeak*Math.sin(Math.PI*clamp(hero.s,0,1));
      const thA=hero.th0+2.6*hero.s;
      const th=(d===hero.a)?thA:thA+Math.PI;
      const orbit=isl.r+d.r*0.85+0.14;
      const arc=[];
      for(let k=0;k<9;k++){
        const a=th+(k-4)*spread/4;
        arc.push({x:isl.x+Math.cos(a)*orbit,z:isl.z+Math.sin(a)*orbit,r:d.r*Math.cbrt(1/9)});
      }
      /* strength-weighted crossfade: free shape fades out as the arc fades in */
      const b=hero.blend;
      for(const fb of balls){
        const y=fb.r*(0.45+0.05*Math.min(speed,1));
        ballAt(fb.x,y,fb.z,fb.r,1-b);
      }
      for(const ab of arc){
        ballAt(ab.x,ab.r*0.55,ab.z,ab.r,b);
      }
      continue;
    }
    for(const b of balls){
      const y=b.r*(0.45+0.05*Math.min(speed,1));
      ballAt(b.x,y,b.z,b.r,1);
    }
  }
  beadInst.count=beadCount;
  beadInst.instanceMatrix.needsUpdate=true;
  mc.update();
}

/* ============================== camera ============================ */
const cam={
  az:0.46,el:0.33,dist:6.0,tx:0.25,ty:0.10,tz:0.15,
  daz:0.46,del:0.33,ddist:6.0,dtx:0.25,dty:0.10,dtz:0.15,
  cinematic:true
};
let wallTime=0;
function clusterTarget(){
  const s=[...drops].sort((a,b)=>b.V-a.V);
  let x=0,z=0,w=0;
  for(let i=0;i<Math.min(2,s.length);i++){x+=s[i].x*s[i].V;z+=s[i].z*s[i].V;w+=s[i].V;}
  if(w>0){x/=w;z/=w;}
  return {x:clamp(x,-1.5,1.5),z:clamp(z,-0.9,0.9)};
}
function updateCamera(dt){
  if(cam.cinematic){
    const t=wallTime;
    cam.daz=0.46+0.24*Math.sin(t*0.05);
    const hw=hero.active?hero.blend:0;
    cam.del=lerp(0.33,0.44,hw)+0.035*Math.sin(t*0.037+1.2);
    cam.ddist=lerp(6.0,6.4,hw)+0.3*Math.sin(t*0.023+0.6);
    const c=clusterTarget();
    const gx=lerp(c.x,hero.isl?hero.isl.x:c.x,hw*0.7);
    const gz=lerp(c.z,hero.isl?hero.isl.z:c.z,hw*0.7);
    cam.dtx=lerp(cam.dtx,gx,1-Math.exp(-0.8*dt));
    cam.dtz=lerp(cam.dtz,gz,1-Math.exp(-0.8*dt));
    cam.dty=0.10;
  }
  cam.del=clamp(cam.del,0.10,1.05);
  cam.ddist=clamp(cam.ddist,4.6,13);
  const lam=cam.cinematic?1.7:6.5;
  cam.az=THREE.MathUtils.damp(cam.az,cam.daz,lam,dt);
  cam.el=THREE.MathUtils.damp(cam.el,cam.del,lam,dt);
  cam.dist=THREE.MathUtils.damp(cam.dist,cam.ddist,lam,dt);
  cam.tx=THREE.MathUtils.damp(cam.tx,cam.dtx,2.2,dt);
  cam.ty=THREE.MathUtils.damp(cam.ty,cam.dty,2.2,dt);
  cam.tz=THREE.MathUtils.damp(cam.tz,cam.dtz,2.2,dt);
  const ce=Math.cos(cam.el);
  camera.position.set(
    cam.tx+cam.dist*ce*Math.sin(cam.az),
    cam.ty+cam.dist*Math.sin(cam.el),
    cam.tz+cam.dist*ce*Math.cos(cam.az));
  camera.lookAt(cam.tx,cam.ty,cam.tz);
}
function goManual(){ if(cam.cinematic){cam.cinematic=false;btnCine.setAttribute('aria-pressed','false');} }

/* ============================== audio ============================= */
let AC=null,master=null,soundOn=false,bedGain=null;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  /* brown-noise liquid bed */
  const len=AC.sampleRate*3;
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const ch=buf.getChannelData(0);
  const rA=mulberry32(SEED+91);
  let last=0;
  for(let i=0;i<len;i++){const w=rA()*2-1;last=(last+0.02*w)/1.02;ch[i]=last*3.2;}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;lp.Q.value=0.6;
  bedGain=AC.createGain();bedGain.gain.value=0.05;
  const lfo=AC.createOscillator();lfo.frequency.value=0.06;
  const lfoG=AC.createGain();lfoG.gain.value=0.024;
  lfo.connect(lfoG);lfoG.connect(bedGain.gain);
  src.connect(lp);lp.connect(bedGain);bedGain.connect(master);
  src.start();lfo.start();
  /* faint mid gurgle layer */
  const src2=AC.createBufferSource();src2.buffer=buf;src2.loop=true;src2.playbackRate.value=1.7;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=2.2;
  const g2=AC.createGain();g2.gain.value=0.010;
  const lfo2=AC.createOscillator();lfo2.frequency.value=0.11;
  const lfo2G=AC.createGain();lfo2G.gain.value=0.007;
  lfo2.connect(lfo2G);lfo2G.connect(g2.gain);
  src2.connect(bp);bp.connect(g2);g2.connect(master);
  src2.start();lfo2.start();
}
function playCreak(p){
  if(!AC||!soundOn||paused) return;
  const t=AC.currentTime;
  const o=AC.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(95*p,t);
  o.frequency.exponentialRampToValueAtTime(58*p,t+0.65);
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=270*p;f.Q.value=9;
  const g=AC.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.045,t+0.12);
  g.gain.exponentialRampToValueAtTime(0.0004,t+0.75);
  o.connect(f);f.connect(g);g.connect(master);
  o.start(t);o.stop(t+0.8);
}
function playBlip(size){
  if(!AC||!soundOn||paused) return;
  const t=AC.currentTime;
  const o=AC.createOscillator();o.type='sine';
  const f0=clamp(200/Math.max(size,0.15),90,320);
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(f0*0.45,t+0.28);
  const g=AC.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.06,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0004,t+0.32);
  o.connect(g);g.connect(master);
  o.start(t);o.stop(t+0.36);
}
function setSound(on){
  soundOn=on;
  if(on&&!AC) initAudio();
  if(AC){
    if(AC.state==='suspended') AC.resume();
    master.gain.cancelScheduledValues(AC.currentTime);
    master.gain.setTargetAtTime(on&&!paused?0.9:0,AC.currentTime,0.25);
  }
  btnSound.setAttribute('aria-pressed',String(on));
}

const pointers=new Map();
let pinchDist=0;
canvas.addEventListener('pointerdown',(e)=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinchDist=Math.hypot(a.x-b.x,a.y-b.y);
  }
});
canvas.addEventListener('pointermove',(e)=>{
  if(!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId);
  const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    goManual();
    cam.daz-=dx*0.0045;
    cam.del=clamp(cam.del+dy*0.003,0.10,1.05);
  } else if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchDist>0){
      goManual();
      cam.ddist=clamp(cam.ddist*(pinchDist/Math.max(d,1)),4.6,13);
    }
    pinchDist=d;
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchDist=0;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',(e)=>{
  e.preventDefault();
  goManual();
  cam.ddist=clamp(cam.ddist*Math.exp(e.deltaY*0.0012),4.6,13);
},{passive:false});

/* ============================== motes ============================= */
let motes,moteSeeds;
function buildMotes(){
  const N=48;
  moteSeeds=[];
  const pos=new Float32Array(N*3);
  const r5=mulberry32(SEED+77);
  for(let i=0;i<N;i++) moteSeeds.push({x:(r5()*2-1)*6,y:r5()*4-0.5,z:(r5()*2-1)*5,p:r5()*Math.PI*2,s:0.3+r5()*0.7});
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({size:0.045,map:makeMoteTexture(),transparent:true,
    opacity:0.14,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true,color:0xbfc8d0});
  motes=new THREE.Points(g,m);
  motes.frustumCulled=false;
  scene.add(motes);
}
function updateMotes(t){
  const p=motes.geometry.attributes.position;
  for(let i=0;i<moteSeeds.length;i++){
    const s=moteSeeds[i];
    p.setXYZ(i,
      s.x+Math.sin(t*0.05*s.s+s.p)*0.8,
      s.y+Math.sin(t*0.043*s.s+s.p*2)*0.5,
      s.z+Math.cos(t*0.037*s.s+s.p)*0.8);
  }
  p.needsUpdate=true;
}

/* ============================== init ============================== */
function init(){
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.06;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0b0d);
  scene.fog=new THREE.FogExp2(0x0a0b0d,0.026);

  camera=new THREE.PerspectiveCamera(35,window.innerWidth/window.innerHeight,0.1,80);

  envTex=buildEnvironment();
  scene.environment=envTex;

  const ceramic=makeCeramicMaps();
  const basalt=makeBasaltMaps();
  const blobTex=makeBlobTexture();

  buildTray(ceramic);
  buildIslands(basalt,blobTex);
  buildSupport();
  buildStage(blobTex);
  buildMotes();

  /* key light — controlled highlight + readable shadows */
  const key=new THREE.DirectionalLight(0xfff1de,2.3);
  key.position.set(4.5,7.5,3.5);
  key.castShadow=true;
  key.shadow.mapSize.set(1024,1024);
  key.shadow.camera.left=-5;key.shadow.camera.right=5;
  key.shadow.camera.top=5;key.shadow.camera.bottom=-5;
  key.shadow.camera.near=2;key.shadow.camera.far=20;
  key.shadow.bias=-0.0004;key.shadow.normalBias=0.02;
  scene.add(key);
  const rim=new THREE.DirectionalLight(0x9fb4cc,0.5);
  rim.position.set(-5,3,-4);
  scene.add(rim);

  /* liquid metal implicit surface */
  const liquidMat=new THREE.MeshStandardMaterial({
    color:0xe8ecf0,metalness:1.0,roughness:0.04,envMapIntensity:1.4
  });
  mc=new MarchingCubes(mcRes,liquidMat,false,false,60000);
  mc.scale.set(FIELD.sx,FIELD.sy,FIELD.sz);
  mc.position.set(0,FIELD.py,0);
  mc.isolation=ISO;
  mc.frustumCulled=false;
  mc.castShadow=true;mc.receiveShadow=true;
  trayGroup.add(mc);

  beadInst=new THREE.InstancedMesh(new THREE.SphereGeometry(1,20,14),liquidMat,16);
  beadInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  beadInst.castShadow=true;beadInst.receiveShadow=true;
  beadInst.frustumCulled=false;beadInst.count=0;
  trayGroup.add(beadInst);

  spawnInitial();
  updateField();

  window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
  canvas.addEventListener('webglcontextlost',(e)=>{
    e.preventDefault();
    document.getElementById('err').style.display='grid';
  });

  /* test/inspection hook (read-only) */
  window.__LCG__={
    get fps(){return fpsAvg;},
    get simTime(){return simTime;},
    get paused(){return paused;},
    get cinematic(){return cam.cinematic;},
    get soundOn(){return soundOn;},
    get hero(){return hero.active;},
    get heroBlend(){return hero.blend;},
    get heroInfo(){
      if(!hero.active) return null;
      const thA=hero.th0+2.6*hero.s;
      const oA=hero.isl.r+hero.a.r*0.85+0.14, oB=hero.isl.r+hero.b.r*0.85+0.14;
      return {th0:hero.th0,s:hero.s,
        a:[hero.a.x,hero.a.z],b:[hero.b.x,hero.b.z],
        ta:[hero.isl.x+Math.cos(thA)*oA,hero.isl.z+Math.sin(thA)*oA],
        tb:[hero.isl.x+Math.cos(thA+Math.PI)*oB,hero.isl.z+Math.sin(thA+Math.PI)*oB],
        lockA:hero.a.mergeLock,lockB:hero.b.mergeLock};
    },
    get drops(){return drops.map(d=>({x:+d.x.toFixed(3),z:+d.z.toFixed(3),r:+d.r.toFixed(3)}));},
    get volume(){return drops.reduce((s,d)=>s+d.V,0);},
    get volume0(){return volume0;},
    get tris(){return renderer.info.render.triangles;},
    get perf(){return {field:+fieldMs.toFixed(1),render:+renderMs.toFixed(1),dpr:renderer.getPixelRatio()};},
    get mcRes(){return mcRes;},
    get cam(){return {az:+cam.az.toFixed(3),el:+cam.el.toFixed(3),dist:+cam.dist.toFixed(3)};},
    get audioState(){return AC?AC.state:'none';},
    get envOK(){return !!scene.environment;}
  };

  requestAnimationFrame(frame);
}

/* ============================ main loop =========================== */
let last=performance.now(), fpsAvg=60, slowTime=0, dprStage=0, fieldMs=0, renderMs=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min((now-last)/1000,0.05);
  last=now;
  wallTime+=dt;
  if(dt>0) fpsAvg=lerp(fpsAvg,1/dt,0.05);

  if(!paused){
    acc+=dt;
    let n=0;
    while(acc>=H&&n<8){step(H);acc-=H;n++;}
    if(n===8) acc=0;
    const tf0=performance.now();
    updateField();
    fieldMs=lerp(fieldMs,performance.now()-tf0,0.08);
    /* drain audio events */
    while(audioEvents.length){
      const ev=audioEvents.shift();
      if(ev.type==='creak') playCreak(ev.p);
      else if(ev.type==='blip') playBlip(ev.size);
    }
  } else {
    audioEvents.length=0;
  }

  updateCamera(dt);
  updateMotes(wallTime);

  /* adaptive resolution: protect the hero geometry first */
  if(fpsAvg<34){slowTime+=dt;}else{slowTime=Math.max(0,slowTime-dt*2);}
  if(slowTime>2.5&&dprStage<2){
    dprStage++;slowTime=0;
    renderer.setPixelRatio(dprStage===1?Math.min(window.devicePixelRatio||1,1.2):1);
    renderer.setSize(window.innerWidth,window.innerHeight);
  } else if(slowTime>2.5&&dprStage===2&&mcRes>48){
    dprStage=3;slowTime=0;
    setMCRes(48);
  }

  const tr0=performance.now();
  renderer.render(scene,camera);
  renderMs=lerp(renderMs,performance.now()-tr0,0.08);
}

try { init(); } catch(e){
  console.error(e);
  document.getElementById('err').style.display='grid';
}
</script>
</body>
</html>
