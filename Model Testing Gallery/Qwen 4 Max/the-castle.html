<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE CASTLE — a tiny world</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#ffffff; }
  #scene { position:fixed; inset:0; display:block; }
  /* soft dissolve of the island's far/near extremes into the white page */
  #dissolve { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 74% 72% at 50% 50%, rgba(255,255,255,0) 80%, rgba(255,255,255,0.28) 94%, rgba(255,255,255,0.75) 100%); }
  #hint { position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    font:13px/1.4 Georgia, 'Times New Roman', serif; color:#9a938a; letter-spacing:0.12em;
    padding:7px 16px; border:1px solid #e4e0d8; border-radius:20px; background:rgba(255,255,255,0.8);
    cursor:pointer; user-select:none; transition:opacity 1.2s ease; }
  #hint.gone { opacity:0; pointer-events:none; }
  #caption { position:fixed; left:24px; bottom:22px; font:11px Georgia, serif; color:#b9b2a6;
    letter-spacing:0.35em; pointer-events:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="dissolve"></div>
<div id="hint">&#9834; click for sound</div>
<div id="caption">THE CASTLE</div>

<script>/*
 * castle-audio.js — fully synthesized Web Audio soundtrack for a tiny medieval castle scene.
 * Plain JS, no imports/modules/fetches. Safe to inline in a <script> tag (even twice).
 * Nothing runs at load time: the AudioContext is only created inside CastleAudio.init(),
 * which must be called from a user gesture (click handler).
 *
 * Public API:
 *   CastleAudio.started        boolean, false until init() succeeds
 *   CastleAudio.init()         idempotent boot: music loop + ambience, never throws
 *   CastleAudio.trigger(name)  one-shot sfx: hammer | cluck | caw | crumb | creak | splash
 */
(function () {
  'use strict';

  // If a previous copy of this file already defined the API, do not clobber it
  // (init() itself is also guarded, so double init is always safe).
  if (window.CastleAudio) return;

  // ---- private state -------------------------------------------------------
  var ctx = null;            // AudioContext (created in init only)
  var master = null;         // master gain -> compressor -> destination
  var musicGain = null;      // music bus
  var musicFilter = null;    // gentle shared lowpass for the lute/drone/bell
  var ambGain = null;        // ambience bus
  var sfxGain = null;        // one-shot bus
  var noiseBuf = null;       // shared 2 s white-noise buffer
  var ksCache = {};          // Karplus-Strong AudioBuffers, cached per MIDI note
  var booting = false;       // re-entrancy guard for init()
  var schedTimer = null;     // lookahead scheduler interval id
  var birdTimer = null;      // songbird setTimeout id
  var loopStart = 0;         // ctx time of loop iteration 0
  var loopCount = 0;         // which 24 s iteration we are scheduling
  var eventIndex = 0;        // next event inside the current iteration

  var LOOP_LEN = 24;         // seconds — exact loop period
  var Q = 60 / 66;           // quarter-note duration at ~66 bpm

  // ---- small helpers -------------------------------------------------------

  // Disconnect a source and its downstream nodes once it finishes (no leaks).
  function autoClean(source, nodes) {
    source.onended = function () {
      try { source.disconnect(); } catch (e) {}
      for (var i = 0; i < nodes.length; i++) {
        try { nodes[i].disconnect(); } catch (e2) {}
      }
    };
  }

  // Short filtered noise burst (used by hammer click, crumb, splash).
  function noiseHit(t, dur, peak, type, freq, q) {
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    var f = ctx.createBiquadFilter();
    f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q || 0.8;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
    autoClean(src, [f, g]);
    return f; // caller may sweep the filter frequency
  }

  // ---- Karplus-Strong plucked string ---------------------------------------
  // Noise burst into a delay line with a feedback averaging filter, rendered
  // offline into an AudioBuffer in pure JS. Damping is tuned so every note
  // decays ~60 dB over 2.2 s regardless of pitch. Cached per MIDI note.
  function ksBuffer(midi) {
    if (ksCache[midi]) return ksCache[midi];
    var sr = ctx.sampleRate;
    var freq = 440 * Math.pow(2, (midi - 69) / 12);
    var N = Math.max(2, Math.round(sr / freq));
    var dur = 2.2, len = Math.floor(sr * dur);
    var buf = ctx.createBuffer(1, len, sr);
    var out = buf.getChannelData(0);
    var line = new Float32Array(N);
    for (var i = 0; i < N; i++) line[i] = Math.random() * 2 - 1;
    var damp = Math.pow(0.001, 1 / (dur * freq)); // loop gain per period
    var idx = 0;
    for (var s = 0; s < len; s++) {
      var cur = line[idx];
      var nxt = line[(idx + 1) % N];
      out[s] = cur;
      line[idx] = damp * 0.5 * (cur + nxt);
      idx = (idx + 1) % N;
    }
    var fade = Math.floor(sr * 0.05); // 50 ms fade-out: no tail click
    for (var k = 0; k < fade; k++) out[len - fade + k] *= 1 - k / fade;
    ksCache[midi] = buf;
    return buf;
  }

  // Play one cached lute pluck through the music bus.
  function pluck(t, midi, vel) {
    var src = ctx.createBufferSource();
    src.buffer = ksBuffer(midi);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    src.connect(g); g.connect(musicFilter);
    src.start(t); src.stop(t + 2.25);
    autoClean(src, [g]);
  }

  // Sparse low bell: a few inharmonic sine partials with long exponential decay.
  function bell(t) {
    var base = 146.83; // D3
    var parts = [[1, 1], [2.0, 0.5], [2.98, 0.28], [4.2, 0.12]];
    for (var i = 0; i < parts.length; i++) {
      var o = ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = base * parts[i][0];
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.045 * parts[i][1], t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3.0);
      o.connect(g); g.connect(musicFilter);
      o.start(t); o.stop(t + 3.1);
      autoClean(o, [g]);
    }
  }

  // ---- the fixed 24 s composition (D dorian: D E F G A B C) -----------------
  // Lute arpeggios over Dm | C | G | Dm, on a ~66 bpm quarter-note grid,
  // plus a few quiet melody notes on the off-beats. [beat, MIDI, velocity]
  var SCORE = [
    [0, 50, 0.16], [1, 57, 0.13], [2, 62, 0.14], [3, 65, 0.13], [4, 64, 0.13], [5, 60, 0.12],
    [6, 48, 0.15], [7, 55, 0.12], [8, 60, 0.13], [9, 64, 0.13], [10, 62, 0.12], [11, 57, 0.11],
    [12, 55, 0.15], [13, 59, 0.12], [14, 62, 0.13], [15, 65, 0.13], [16, 64, 0.12], [17, 62, 0.11],
    [18, 57, 0.14], [19, 62, 0.13], [20, 65, 0.13], [21, 64, 0.12], [22, 62, 0.12],
    [23, 60, 0.11], [24, 57, 0.11], [25, 55, 0.10],
    [4.5, 69, 0.07], [16.5, 67, 0.07], [22.5, 74, 0.06] // sparse high melody: A4, G4, D5
  ];
  // Flatten to sorted absolute-time events; bells every 8 s (0, 8, 16).
  var EVENTS = SCORE.map(function (n) { return { t: n[0] * Q, midi: n[1], vel: n[2] }; });
  [0, 8, 16].forEach(function (s) { EVENTS.push({ t: s, bell: true }); });
  EVENTS.sort(function (a, b) { return a.t - b.t; });

  // Lookahead scheduler: every 200 ms, schedule everything due within 500 ms,
  // anchored to loopStart so the pattern repeats every exactly 24 s, gap-free.
  function scheduleAhead() {
    var horizon = ctx.currentTime + 0.5;
    for (;;) {
      var ev = EVENTS[eventIndex];
      var t = loopStart + loopCount * LOOP_LEN + ev.t;
      if (t > horizon) break;
      if (t >= ctx.currentTime - 0.02) {
        if (ev.bell) bell(t); else pluck(t, ev.midi, ev.vel);
      }
      eventIndex++;
      if (eventIndex >= EVENTS.length) { eventIndex = 0; loopCount++; }
    }
  }

  // Very quiet sustained drone: D2 sine + A2 triangle, slow tremolo.
  function startDrone() {
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 3);
    var lfo = ctx.createOscillator(); lfo.frequency.value = 0.09;
    var lfoAmt = ctx.createGain(); lfoAmt.gain.value = 0.02;
    lfo.connect(lfoAmt); lfoAmt.connect(g.gain); lfo.start();
    [[73.42, 'sine', 0.6], [110.0, 'triangle', 0.35]].forEach(function (d) {
      var o = ctx.createOscillator(); o.type = d[1]; o.frequency.value = d[0];
      var og = ctx.createGain(); og.gain.value = d[2];
      o.connect(og); og.connect(g); o.start();
    });
    g.connect(musicFilter);
  }

  // ---- ambience --------------------------------------------------------------
  function startAmbience() {
    // Wind: looped noise -> lowpass ~400 Hz, both cutoff and level drift on
    // very slow LFOs so it breathes like a real breeze.
    var wSrc = ctx.createBufferSource(); wSrc.buffer = noiseBuf; wSrc.loop = true;
    var wFilt = ctx.createBiquadFilter(); wFilt.type = 'lowpass';
    wFilt.frequency.value = 400; wFilt.Q.value = 0.5;
    var wGain = ctx.createGain(); wGain.gain.value = 0.045;
    var lfo1 = ctx.createOscillator(); lfo1.frequency.value = 0.07;
    var lfo1Amt = ctx.createGain(); lfo1Amt.gain.value = 160;
    lfo1.connect(lfo1Amt); lfo1Amt.connect(wFilt.frequency); lfo1.start();
    var lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.05;
    var lfo2Amt = ctx.createGain(); lfo2Amt.gain.value = 0.02;
    lfo2.connect(lfo2Amt); lfo2Amt.connect(wGain.gain); lfo2.start();
    wSrc.connect(wFilt); wFilt.connect(wGain); wGain.connect(ambGain); wSrc.start();

    // Water burble: looped noise -> bandpass ~900 Hz (Q 2), amplitude LFO 0.4 Hz.
    var bSrc = ctx.createBufferSource(); bSrc.buffer = noiseBuf; bSrc.loop = true;
    var bFilt = ctx.createBiquadFilter(); bFilt.type = 'bandpass';
    bFilt.frequency.value = 900; bFilt.Q.value = 2;
    var bGain = ctx.createGain(); bGain.gain.value = 0.016;
    var lfo3 = ctx.createOscillator(); lfo3.frequency.value = 0.4;
    var lfo3Amt = ctx.createGain(); lfo3Amt.gain.value = 0.009;
    lfo3.connect(lfo3Amt); lfo3Amt.connect(bGain.gain); lfo3.start();
    bSrc.connect(bFilt); bFilt.connect(bGain); bGain.connect(ambGain); bSrc.start();

    scheduleBird();
    console.log('[audio] ambience: wind + water');
  }

  // Distant songbird: 2–4 tiny sine chirps with fast pitch slides, every 7–14 s.
  function scheduleBird() {
    birdTimer = setTimeout(function () {
      if (!window.CastleAudio.started) return;
      try { chirp(); } catch (e) {}
      scheduleBird();
    }, 7000 + Math.random() * 7000);
  }

  function chirp() {
    var t = ctx.currentTime + 0.05;
    var n = 2 + Math.floor(Math.random() * 3); // 2–4 notes
    var base = 2100 + Math.random() * 900;
    for (var i = 0; i < n; i++) {
      var t0 = t + i * 0.14;
      var f0 = base * (0.9 + Math.random() * 0.3);
      var o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.exponentialRampToValueAtTime(f0 * 1.45, t0 + 0.05);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.85, t0 + 0.11);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.022, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
      o.connect(g); g.connect(ambGain);
      o.start(t0); o.stop(t0 + 0.15);
      autoClean(o, [g]);
    }
    console.log('[audio] ambience: bird chirp');
  }

  // ---- one-shot sound effects ------------------------------------------------
  var SFX = {
    // Blacksmith hammer on anvil: inharmonic metallic partials + noise click.
    hammer: function (t) {
      var det = 1 + (Math.random() - 0.5) * 0.06; // slight random detune per hit
      [800, 1350, 2100, 3200].forEach(function (f, i) {
        var o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * det;
        var g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.11 / (i + 1), t + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3 + Math.random() * 0.15);
        o.connect(g); g.connect(sfxGain);
        o.start(t); o.stop(t + 0.55);
        autoClean(o, [g]);
      });
      noiseHit(t, 0.03, 0.09, 'highpass', 2500);
    },
    // Chicken: 2–3 short filtered sawtooth blips, each with a pitch drop.
    cluck: function (t) {
      var n = 2 + (Math.random() < 0.5 ? 1 : 0);
      for (var i = 0; i < n; i++) {
        var t0 = t + i * 0.09;
        var f0 = 700 * (0.9 + Math.random() * 0.25);
        var o = ctx.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(f0, t0);
        o.frequency.exponentialRampToValueAtTime(f0 * 0.55, t0 + 0.07);
        var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1600;
        var g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.06, t0 + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.08);
        o.connect(f); f.connect(g); g.connect(sfxGain);
        o.start(t0); o.stop(t0 + 0.1);
        autoClean(o, [f, g]);
      }
    },
    // Crow: harsh bandpassed sawtooth with a downward bend, ~0.25 s.
    caw: function (t) {
      var o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(620, t);
      o.frequency.exponentialRampToValueAtTime(280, t + 0.25);
      var f = ctx.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.value = 1300; f.Q.value = 2.5;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(f); f.connect(g); g.connect(sfxGain);
      o.start(t); o.stop(t + 0.3);
      autoClean(o, [f, g]);
    },
    // Tiny soft noise tick, very quiet.
    crumb: function (t) {
      noiseHit(t, 0.03, 0.02, 'lowpass', 2800);
    },
    // Wooden creak: slow wobbling lowpassed sawtooth, quiet.
    creak: function (t) {
      var o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 85;
      var wob = ctx.createOscillator(); wob.frequency.value = 6.5;
      var wobAmt = ctx.createGain(); wobAmt.gain.value = 14;
      wob.connect(wobAmt); wobAmt.connect(o.frequency);
      var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 280;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.035, t + 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(f); f.connect(g); g.connect(sfxGain);
      o.start(t); o.stop(t + 0.65); wob.start(t); wob.stop(t + 0.65);
      autoClean(o, [f, g, wobAmt]);
      autoClean(wob, []);
    },
    // Short water plip: filtered noise with a downward filter sweep + sine plop.
    splash: function (t) {
      var f = noiseHit(t, 0.22, 0.06, 'bandpass', 1400, 1);
      f.frequency.exponentialRampToValueAtTime(500, t + 0.2);
      var o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(480, t);
      o.frequency.exponentialRampToValueAtTime(180, t + 0.1);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.035, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(g); g.connect(sfxGain);
      o.start(t); o.stop(t + 0.15);
      autoClean(o, [g]);
    }
  };

  // ---- public API -------------------------------------------------------------
  window.CastleAudio = {
    started: false,

    init: function () {
      if (this.started || booting) return; // idempotent, double-init safe
      booting = true;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
        if (ctx.state === 'suspended') {
          ctx.resume().catch(function (e) { console.warn('[audio] resume failed', e); });
        }
        // master chain: gain ~0.5 -> compressor -> destination (no clipping)
        master = ctx.createGain(); master.gain.value = 0.5;
        var comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.knee.value = 20;
        comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.25;
        master.connect(comp); comp.connect(ctx.destination);
        // buses
        musicGain = ctx.createGain(); musicGain.gain.value = 0.9; musicGain.connect(master);
        musicFilter = ctx.createBiquadFilter(); musicFilter.type = 'lowpass';
        musicFilter.frequency.value = 2400; musicFilter.Q.value = 0.4;
        musicFilter.connect(musicGain);
        ambGain = ctx.createGain(); ambGain.gain.value = 0.9; ambGain.connect(master);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(master);
        // shared white-noise buffer (2 s, looped everywhere noise is needed)
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        var nd = noiseBuf.getChannelData(0);
        for (var i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
        // music: drone now, pattern via lookahead timer anchored to loopStart
        startDrone();
        loopStart = ctx.currentTime + 0.15;
        loopCount = 0; eventIndex = 0;
        scheduleAhead();
        schedTimer = setInterval(scheduleAhead, 200);
        console.log('[audio] music loop scheduled (24s, D dorian)');
        // ambience
        startAmbience();
        this.started = true;
        console.log('[audio] started: music + ambience');
      } catch (err) {
        console.warn('[audio] init failed', err);
        if (schedTimer) { clearInterval(schedTimer); schedTimer = null; }
        if (birdTimer) { clearTimeout(birdTimer); birdTimer = null; }
      }
      booting = false;
    },

    trigger: function (name) {
      if (!this.started) return;      // silent no-op before init
      var fn = SFX[name];
      if (!fn) return;                // unknown names ignored silently
      try {
        fn(ctx.currentTime + 0.01);
        console.log('[audio] sfx: ' + name);
      } catch (err) {
        console.warn('[audio] sfx failed: ' + name, err);
      }
    }
  };
})();</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================ core */
const LOOP = 24;                       // seconds, one seamless loop
const TAU = Math.PI * 2;
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0xffffff, 1);
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 126, 158);

/* fixed orthographic isometric camera: ~30 deg down, 45 deg around */
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
const CAM_DIST = 110, EL = THREE.MathUtils.degToRad(33), AZ = THREE.MathUtils.degToRad(45);
camera.position.set(
  CAM_DIST * Math.cos(EL) * Math.cos(AZ),
  CAM_DIST * Math.sin(EL),
  CAM_DIST * Math.cos(EL) * Math.sin(AZ));
camera.lookAt(0, 1.5, 0);

function frameCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  // island ~42 world units wide -> ~75% of frame width
  let halfW = 25;
  let halfH = halfW / aspect;
  if (halfH < 23) { halfH = 23; halfW = halfH * aspect; }
  camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
}
frameCamera();

/* ============================================================ lights */
const sun = new THREE.DirectionalLight(0xffd2a0, 2.9);
sun.position.set(46, 21, 14);          // low warm late-afternoon sun, from the side
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
sun.shadow.camera.top = 28; sun.shadow.camera.bottom = -28;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 130;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);
const skyFill = new THREE.HemisphereLight(0xbdd3e8, 0x8f7f60, 0.24);
scene.add(skyFill);
scene.add(new THREE.AmbientLight(0xfff4e0, 0.05));
/* gentle bounce fill so the torn underside never reads black */
const underFill = new THREE.DirectionalLight(0xe8d8c0, 0.3);
underFill.position.set(26, -18, 30);

/* ============================================================ procedural texture factory */
function makeCanvas(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  return t;
}
function srgb(t) { t.colorSpace = THREE.SRGBColorSpace; return t; }
function speckle(g, w, h, n, a) {
  for (let i = 0; i < n; i++) {
    const v = Math.random();
    g.fillStyle = `rgba(${v > 0.5 ? 255 : 0},${v > 0.5 ? 255 : 10},${v > 0.5 ? 245 : 5},${a * Math.random()})`;
    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}
/* hash noise for geometry */
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return hash2(xi, yi) * (1 - u) * (1 - v) + hash2(xi + 1, yi) * u * (1 - v) +
         hash2(xi, yi + 1) * (1 - u) * v + hash2(xi + 1, yi + 1) * u * v;
}

/* --- limestone blocks (texture covers 2x2 world units) --- */
function stoneTexture(base, joint, moss) {
  return srgb(makeCanvas(512, 512, (g, w, h) => {
    g.fillStyle = joint; g.fillRect(0, 0, w, h);
    const rows = 6, bh = h / rows;
    for (let r = 0; r < rows; r++) {
      const off = (r % 2) * (w / 6);
      for (let b = -1; b < 4; b++) {
        const bw = w / 3, x = b * bw + off, y = r * bh;
        const v = 0.86 + hash2(r * 7 + b, b * 3 + r) * 0.26;
        const col = new THREE.Color(base).multiplyScalar(v);
        g.fillStyle = `rgb(${col.r * 255 | 0},${col.g * 255 | 0},${col.b * 255 | 0})`;
        g.fillRect(x + 3, y + 3, bw - 6, bh - 6);
        // per-block weathering streaks
        for (let s = 0; s < 7; s++) {
          g.fillStyle = `rgba(40,34,26,${0.04 + Math.random() * 0.07})`;
          g.fillRect(x + 4 + Math.random() * (bw - 10), y + 4, 2 + Math.random() * 4, bh - 8);
        }
        // moss in the joints
        if (moss && Math.random() < 0.65) {
          g.fillStyle = `rgba(74,96,44,${0.25 + Math.random() * 0.3})`;
          const mx = x + Math.random() * bw, my = y + bh - 5;
          g.beginPath(); g.ellipse(mx, my, 9 + Math.random() * 16, 4 + Math.random() * 4, 0, 0, TAU); g.fill();
        }
      }
    }
    speckle(g, w, h, 2600, 0.06);
  }));
}

/* ============================================================ geometry helpers (static merge buckets) */
const buckets = new Map();
function pushGeo(geo, mat) {
  let g = geo.index ? geo.toNonIndexed() : geo;
  if (g !== geo) geo.dispose();
  if (!buckets.has(mat)) buckets.set(mat, []);
  buckets.get(mat).push(g);
}
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(1, 1, 1), _p = new THREE.Vector3();
function place(geo, x, y, z, ry = 0, sx = 1, sy = 1, sz = 1, rx = 0, rz = 0) {
  _e.set(rx, ry, rz); _q.setFromEuler(_e); _p.set(x, y, z); _s.set(sx, sy, sz);
  _m4.compose(_p, _q, _s);
  geo.applyMatrix4(_m4);
  return geo;
}
/* scale box UVs so textures tile at ~2 world units */
function boxUV(w, h, d, geo) {
  const uv = geo.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) {
    const k = f * 4 + i;
    uv.setXY(k, uv.getX(k) * dims[f][0] / 2, uv.getY(k) * dims[f][1] / 2);
  }
  return geo;
}
function box(w, h, d, x, y, z, mat, ry = 0) {
  pushGeo(place(boxUV(w, h, d, new THREE.BoxGeometry(w, h, d)), x, y, z, ry), mat);
}
function cylUV(r, h, geo) {
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * (TAU * r) / 2, uv.getY(i) * h / 2);
  return geo;
}
function cyl(rt, rb, h, x, y, z, mat, seg = 24) {
  pushGeo(place(cylUV(Math.max(rt, rb), h, new THREE.CylinderGeometry(rt, rb, h, seg)), x, y, z), mat);
}
function cone(r, h, x, y, z, mat, seg = 24) {
  pushGeo(place(cylUV(r, h, new THREE.ConeGeometry(r, h, seg)), x, y, z), mat);
}
function flushBuckets(parent) {
  for (const [mat, geos] of buckets) {
    const merged = mergeGeometries(geos, false);
    const mesh = new THREE.Mesh(merged, mat);
    mesh.castShadow = true; mesh.receiveShadow = true;
    parent.add(mesh);
    geos.forEach(g => g.dispose());
  }
  buckets.clear();
}

/* ============================================================ THE ISLAND */
const island = new THREE.Group();
scene.add(island);
const R_BASE = 20;
function islandRadius(th) {
  return R_BASE + 2.0 * Math.sin(th * 3 + 1.2) + 1.3 * Math.sin(th * 5 + 4.0) + 0.8 * Math.sin(th * 9 + 2.2);
}
function inMoat(x, z) { return Math.abs(x) < 2.9 && z > 7.4; }
function grassHeight(x, z) {
  let y = 0.22 * vnoise(x * 0.16 + 7, z * 0.16 + 3) - 0.06;
  if (Math.abs(x) < 11.7 && z > -9.9 && z < 8.5) y = 0.0;   // flat under the cobbled yard
  if (inMoat(x, z)) {
    const bank = THREE.MathUtils.smoothstep(Math.abs(x), 2.0, 2.9);
    const head = THREE.MathUtils.smoothstep(z, 7.4, 8.6);
    y = THREE.MathUtils.lerp(-0.95, y, Math.max(bank, 1 - head));
  }
  return y;
}

/* --- grassy top: irregular displaced disc --- */
{
  const rings = 26, segs = 128;
  const pos = [], uv = [], idx = [];
  pos.push(0, grassHeight(0, 0), 0); uv.push(0.5, 0.5);
  for (let r = 1; r <= rings; r++) {
    const fr = r / rings;
    for (let s = 0; s < segs; s++) {
      const th = s / segs * TAU;
      const rad = islandRadius(th) * fr;
      const x = Math.cos(th) * rad, z = Math.sin(th) * rad;
      pos.push(x, grassHeight(x, z), z);
      uv.push(x / 42 + 0.5, z / 42 + 0.5);
    }
  }
  for (let s = 0; s < segs; s++) idx.push(0, 1 + (s + 1) % segs, 1 + s);
  for (let r = 1; r < rings; r++) {
    const a0 = 1 + (r - 1) * segs, b0 = 1 + r * segs;
    for (let s = 0; s < segs; s++) {
      const s2 = (s + 1) % segs;
      idx.push(a0 + s, b0 + s2, b0 + s, a0 + s, a0 + s2, b0 + s2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const top = new THREE.Mesh(g, M.grass);
  top.receiveShadow = true; top.castShadow = false;
  island.add(top);
}

/* --- torn soil underside: banded, jagged, tapering to a point --- */
{
  const bands = [
    { y: 0.12,  r: 1.00, c: new THREE.Color('#4a3826') },   // topsoil lip
    { y: -1.9,  r: 0.99, c: new THREE.Color('#463524') },   // dark topsoil (near-vertical)
    { y: -4.6,  r: 0.93, c: new THREE.Color('#6e5138') },   // topsoil -> subsoil
    { y: -7.2,  r: 0.82, c: new THREE.Color('#8a6844') },   // lighter subsoil
    { y: -9.6,  r: 0.66, c: new THREE.Color('#a8a294') },   // grey clay band
    { y: -11.6, r: 0.48, c: new THREE.Color('#948d7e') },
    { y: -13.4, r: 0.27, c: new THREE.Color('#6e5a42') },
    { y: -14.9, r: 0.10, c: new THREE.Color('#5a4832') },
    { y: -16.0, r: 0.015, c: new THREE.Color('#4a3a29') },  // rough point
  ];
  const segs = 128, pos = [], col = [], uv = [], idx = [];
  for (let b = 0; b < bands.length; b++) {
    const { y, r, c } = bands[b];
    for (let s = 0; s < segs; s++) {
      const th = s / segs * TAU;
      const jag = (vnoise(Math.cos(th) * 3 + 13, Math.sin(th) * 3 + y * 0.55) - 0.5) * 1.7 * Math.min(1, r + 0.2);
      const rad = Math.max(0.01, islandRadius(th) * r + jag);
      const yy = y + (vnoise(th * 4 + 31, b * 7) - 0.5) * 0.55;
      pos.push(Math.cos(th) * rad, yy, Math.sin(th) * rad);
      const shade = 0.85 + vnoise(th * 6, b * 3) * 0.3;
      col.push(c.r * shade, c.g * shade, c.b * shade);
      uv.push(s / segs * 6, (0.1 - y) / 7.5);
    }
  }
  for (let b = 0; b < bands.length - 1; b++) {
    const a0 = b * segs, b0 = (b + 1) * segs;
    for (let s = 0; s < segs; s++) {
      const s2 = (s + 1) % segs;
      idx.push(a0 + s, a0 + s2, b0 + s2, a0 + s, b0 + s2, b0 + s);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const body = new THREE.Mesh(g, M.soil);
  body.castShadow = true; body.receiveShadow = true;
  island.add(body);
}

/* --- curtain WALLS with wall-walk + merlons --- */
function wallRun(x0, z0, x1, z1) {
  const dx = x1 - x0, dz = z1 - z0, len = Math.hypot(dx, dz);
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, ry = Math.atan2(dx, dz) + Math.PI / 2;
  const H = 1.9, T = 1.5;
  box(len, H, T, cx, H / 2, cz, M.limestone, ry);
  box(len + 0.2, 0.35, T + 0.55, cx, H + 0.17, cz, M.granite, ry);      // walk slab
  // outer parapet + merlons (outer = away from courtyard center)
  const ox = Math.sign(cx) || 0, oz = Math.sign(cz) || 0;
  const perp = new THREE.Vector2(-dz / len, dx / len);
  const out = (perp.x * cx + perp.y * cz) >= 0 ? 1 : -1;
  const px = cx + perp.x * out * (T / 2 + 0.05), pz = cz + perp.y * out * (T / 2 + 0.05);
  box(len, 0.75, 0.4, px, H + 0.72, pz, M.limestone, ry);
  const n = Math.floor(len / 1.25);
  for (let i = 0; i <= n; i++) {
    const t = i / n - 0.5;
    box(0.62, 0.7, 0.46, px + (dx / len) * t * len, H + 1.42, pz + (dz / len) * t * len, M.limestone, ry);
  }
}

  uniforms: { tDiffuse:{ value:null }, res:{ value:new THREE.Vector2(1, 1) }, focus:{ value:0.52 }, band:{ value:0.16 }, amount:{ value:2.6 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 res; uniform float focus, band, amount;
    varying vec2 vUv;
    void main(){
      float d = abs(vUv.y - focus);
      float blur = smoothstep(band, band + 0.30, d) * amount;
      vec2 px = blur / res;
      vec4 c = texture2D(tDiffuse, vUv) * 0.22;
      c += texture2D(tDiffuse, vUv + vec2( px.x, 0.0)) * 0.11;
      c += texture2D(tDiffuse, vUv + vec2(-px.x, 0.0)) * 0.11;
      c += texture2D(tDiffuse, vUv + vec2(0.0,  px.y)) * 0.11;
      c += texture2D(tDiffuse, vUv + vec2(0.0, -px.y)) * 0.11;
      c += texture2D(tDiffuse, vUv + px * 0.7) * 0.085;
      c += texture2D(tDiffuse, vUv - px * 0.7) * 0.085;
      c += texture2D(tDiffuse, vUv + vec2(px.x, -px.y) * 0.7) * 0.085;
      c += texture2D(tDiffuse, vUv + vec2(-px.x, px.y) * 0.7) * 0.085;
      gl_FragColor = c;
    }`
};

/* ============================================================ the 24-second loop */
const clock = new THREE.Clock();
let hammerPrev = 0, cluckMarks = [0.18, 0.52, 0.83], cluckDone = new Set(), cawMarks = [0.3, 0.72], cawDone = new Set();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const phase = (t % LOOP) / LOOP;
  const w = TAU * phase;

  /* island bob */
  island.position.y = Math.sin(w) * 0.22;
  island.rotation.z = Math.sin(w * 2 + 1.0) * 0.0035;

  /* dangling clumps sway */
  for (let i = 0; i < danglers.length; i++)
    danglers[i].rotation.z = Math.sin(w * 2 + i * 1.7) * 0.08;

  /* crumbs: 2 falls per loop each */
  for (const c of crumbs) {
    const life = (phase * 2 + c.userData.off) % 1;
    if (life < c.userData.prev) sfx('crumb');
    c.userData.prev = life;
    c.position.set(c.userData.x, -13.4 - life * 7.5, c.userData.z);
    c.rotation.x = life * 9; c.rotation.y = life * 7;
    c.material.opacity = Math.min(1, life * 8) * (1 - THREE.MathUtils.smoothstep(life, 0.62, 1));
    c.visible = c.material.opacity > 0.01;
  }

  /* water ripple */
  {
    const p = waterGeo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = waterBase[i * 3], z = waterBase[i * 3 + 2];
      p.setY(i, Math.sin(x * 2.4 + w * 3) * 0.028 + Math.sin(z * 1.7 - w * 2) * 0.03 + Math.sin((x + z) * 3.1 + w * 5) * 0.014);
    }
    p.needsUpdate = true;
    waterGeo.computeVertexNormals();
    fallsTex.offset.y = -phase * 4;
  }

  /* banners ripple */
  for (const b of banners) {
    const p = b.geometry.attributes.position, base = b.userData.base;
    for (let i = 0; i < p.count; i++) {
      const x = base[i * 3], y = base[i * 3 + 1];
      const sway = Math.sin(x * 4.5 - w * 3 + y * 1.5) * 0.14 * x + Math.sin(y * 3 + w * 2) * 0.03 * x;
      p.setZ(i, sway);
      p.setX(i, x - Math.abs(sway) * 0.25);
    }
    p.needsUpdate = true;
    b.geometry.computeVertexNormals();
  }

  /* smoke */
  for (const s of smokes) {
    const u = s.userData;
    const life = (phase * 2 + u.off) % 1;
    const rise = life * 4.2 * u.scale;
    s.position.set(
      u.x + Math.sin(life * 5 + u.seed) * 0.35 * life + life * 0.9,
      u.y + rise,
      u.z + Math.cos(life * 4 + u.seed) * 0.3 * life);
    const sc = (0.35 + life * 1.9) * u.scale;
    s.scale.set(sc, sc, 1);
    s.material.opacity = Math.min(1, life * 6) * (1 - life) * 0.42;
  }

  /* forge glow flicker */
  const flick = 0.75 + 0.25 * Math.sin(w * 13) * Math.sin(w * 7 + 1.3);
  forgeLight.intensity = 2.0 + flick * 1.4;
  forgeCoals.material.emissiveIntensity = 1.6 + flick * 1.6;

  /* blacksmith: 20 strikes per loop */
  {
    const hp = (phase * 20) % 1;
    const raise = hp < 0.6 ? hp / 0.6 : 1 - (hp - 0.6) / 0.4;
    smith.userData.aR.rotation.x = -0.5 - raise * 1.5;
    smith.userData.aL.rotation.x = -0.7;
    smith.userData.body.rotation.x = 0.08 + raise * 0.06;
    if (hammerPrev < 0.6 && hp >= 0.6) { sfx('hammer'); }
    if (hp < hammerPrev && hp < 0.6) { /* new cycle */ }
    hammerPrev = hp;
  }

  /* guard pacing the east wall-walk */
  {
    const gz = -0.5 + 6.4 * Math.sin(w);
    const dir = Math.cos(w);
    guard.position.set(11, 2.28, gz);
    guard.rotation.y = dir >= 0 ? 0 : Math.PI;
    walkPose(guard, phase * 14, 1, Math.min(0.5, Math.abs(dir) * 1.4));
  }

  /* maid on her closed route */
  {
    const pt = maidPath.getPointAt(phase);
    const tan = maidPath.getTangentAt(phase);
    maid.position.copy(pt);
    maid.rotation.y = Math.atan2(tan.x, tan.z);
    const s = Math.sin(w * 12);
    maid.userData.body.position.y = 1.08 + Math.abs(s) * 0.02;
    maid.rotation.z = s * 0.02;
  }

  /* stable boy leading the horse, out and back */
  {
    const bx = 1.2 + 2.3 * Math.sin(w);
    const dir = Math.cos(w);
    boy.position.set(bx, 0.05, 2.9);
    boy.rotation.y = dir >= 0 ? Math.PI / 2 : -Math.PI / 2;
    walkPose(boy, phase * 13, 1, Math.min(0.5, Math.abs(dir) * 1.5));
    horse.position.set(bx + (dir >= 0 ? 1.15 : -1.15), 0.03, 3.55);
    horse.rotation.y = dir >= 0 ? 0 : Math.PI;
    const hs = Math.sin(w * 13);
    const legs = horse.userData.legs;
    const amp = Math.min(0.4, Math.abs(dir) * 1.2);
    legs[0].rotation.x = hs * amp; legs[3].rotation.x = hs * amp;
    legs[1].rotation.x = -hs * amp; legs[2].rotation.x = -hs * amp;
    // lead rope from boy's hand to horse head
    _v1.set(bx + (dir >= 0 ? 0.25 : -0.25), 0.95, 2.9);
    _v2.copy(horse.position).add(new THREE.Vector3(dir >= 0 ? 0.95 : -0.95, 1.6, 0));
    leadRope.position.copy(_v1).add(_v2).multiplyScalar(0.5);
    const d = _v2.clone().sub(_v1);
    leadRope.scale.set(1, d.length(), 1);
    leadRope.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  }

  /* cook stirring */
  {
    cook.userData.aR.rotation.x = -1.0 + Math.sin(w * 6) * 0.22;
    cook.userData.aR.rotation.z = Math.cos(w * 6) * 0.2;
    cook.userData.aL.rotation.x = -0.4;
    cook.userData.head.rotation.x = 0.15 + Math.sin(w * 3) * 0.05;
  }

  /* chickens wander + peck */
  for (const c of chickens) {
    const u = c.userData;
    const a = w + u.off * TAU;
    c.position.set(u.cx + Math.cos(a) * 0.75, 0.03, u.cz + Math.sin(a) * 0.75);
    c.rotation.y = -a - Math.PI / 2;
    const peck = (phase * 9 + u.off) % 1;
    u.headG.rotation.z = peck < 0.3 ? -Math.sin(peck / 0.3 * Math.PI) * 0.9 : 0;
  }
  for (let i = 0; i < cluckMarks.length; i++) {
    const m = cluckMarks[i];
    if (phase >= m && !cluckDone.has(i)) { sfx('cluck'); cluckDone.add(i); }
  }
  if (phase < 0.1) cluckDone.clear();

  /* crows: 2 circles per loop around the keep */
  for (const cr of crows) {
    const u = cr.userData;
    const a = w * 2 + u.off * TAU;
    const r = 7.2 + Math.sin(w * 3 + u.off * 5) * 0.6;
    cr.position.set(Math.cos(a) * r, 15.4 + Math.sin(w * 4 + u.off * 3) * 0.7 + island.position.y, -6.2 + Math.sin(a) * r);
    cr.rotation.y = -a - Math.PI / 2;
    const flap = Math.sin(w * 22 + u.off * 9) * 0.7;
    u.wL.rotation.x = flap; u.wR.rotation.x = -flap;
  }
  for (let i = 0; i < cawMarks.length; i++) {
    if (phase >= cawMarks[i] && !cawDone.has(i)) { sfx('caw'); cawDone.add(i); }
  }
  if (phase < 0.1) cawDone.clear();

  /* occasional stable creak near the turn */
  if (phase >= 0.25 && phase < 0.252 && !animate.creaked) { sfx('creak'); animate.creaked = true; }
  if (phase < 0.2) animate.creaked = false;

  /* moving contact shadows follow their owners */
  for (const [cs, obj] of movingContacts) {
    cs.position.x = obj.position.x; cs.position.z = obj.position.z;
  }

  composer.render();
}
animate();
console.log('[scene] THE CASTLE running: 24s seamless loop, fixed isometric orthographic camera');
window.__castle = { scene, island, camera, renderer, THREE };
</script>
