<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- deterministic rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(1337);
const R=(a=1,b)=> b===undefined ? rng()*a : a+rng()*(b-a);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const TAU=Math.PI*2;

/* ---------- renderer / scene / camera ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
let DPR=Math.min(window.devicePixelRatio||1,1.5);
let renderScale=1;
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.02;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x141d33,0.0105);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,500);
camera.position.set(-8.5,2.4,42);

const rt=new THREE.WebGLRenderTarget(innerWidth*DPR,innerHeight*DPR,{samples:2,type:THREE.HalfFloatType});
const composer=new EffectComposer(renderer,rt);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth>>1,innerHeight>>1),0.30,0.5,0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- hull mathematics (shared by geometry + paint maps) ---------- */
const SHIP={z0:-70,L:94,keel:2.3,beam:7,water:7.1};
const uAt=z=>(z-SHIP.z0)/SHIP.L;
const zAt=u=>SHIP.z0+u*SHIP.L;
const beamAt=u=>SHIP.beam*(0.06+0.94*ss(0,0.30,u))*(1-0.34*ss(0.70,1,u));
const keelAt=u=>SHIP.keel+2.4*ss(0.14,0,u)+3.4*ss(0.86,1,u);
const deckAt=u=>12.3+2.0*ss(0.35,0,u)+0.5*ss(0.85,1,u);
function section(u,v,out){ // v:0 keel -> 1 deck edge
  const B=beamAt(u),K=keelAt(u),D=deckAt(u);
  const p=0.55+0.55*ss(0.32,0.02,u), fl=0.38*ss(0.30,0,u);
  const th=v*Math.PI/2;
  out.x=B*Math.pow(Math.sin(th),p)*(1+fl*v*v);
  out.y=K+(D-K)*Math.pow(1-Math.cos(th),1.05);
  return out;
}
function waterV(u){ // girth fraction where y crosses waterline
  const K=keelAt(u),D=deckAt(u),t=(SHIP.water-K)/(D-K);
  if(t<=0)return 0; if(t>=1)return 1;
  return Math.acos(1-Math.pow(t,1/1.05))/(Math.PI/2);
}
function hullBottomAt(x,z){ // lowest hull y at given |x|,z (for camera safety)
  const u=clamp(uAt(z),0,1),B=beamAt(u);
  if(Math.abs(x)>=B)return keelAt(u);
  const p=0.55+0.55*ss(0.32,0.02,u);
  const th=Math.asin(Math.pow(Math.abs(x)/B,1/p));
  return keelAt(u)+(deckAt(u)-keelAt(u))*Math.pow(1-Math.cos(th),1.05);
}

/* ---------- canvas texture helpers ---------- */
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,srgb=true,rep=null){
  const t=new THREE.CanvasTexture(c);
  if(srgb)t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(rep)t.repeat.set(rep[0],rep[1]);
  t.anisotropy=4;
  return t;
}
function speckle(ctx,w,h,n,a,lo,hi){
  for(let i=0;i<n;i++){const g=Math.floor(R(lo,hi));ctx.fillStyle=`rgba(${g},${g},${g},${a})`;ctx.fillRect(R(w),R(h),R(1,3),R(1,3));}
}

/* hull paint: antifouling / boot / topsides + plates, welds, rust streaks */
function hullMaps(){
  const W=1024,H=512,c=makeCanvas(W,H),x=c.getContext('2d');
  const rc=makeCanvas(W,H),rx=rc.getContext('2d');
  for(let i=0;i<W;i++){
    const u=i/W,vw=waterV(u);
    const yw=H*(1-vw); // canvas y grows downward; v=1 (deck) at top
    const g=x.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#6c7883');g.addColorStop(clamp(yw/H-0.045,0.01,0.98),'#5c6873');
    g.addColorStop(clamp(yw/H-0.012,0.02,0.99),'#1c1e22');
    g.addColorStop(clamp(yw/H+0.012,0.03,1),'#1c1e22');
    g.addColorStop(clamp(yw/H+0.05,0.04,1),'#94492f');
    g.addColorStop(1,'#7f3d26');
    x.fillStyle=g;x.fillRect(i,0,1,H);
    const r=rx.createLinearGradient(0,0,0,H);
    r.addColorStop(0,'#9a9a9a');r.addColorStop(clamp(yw/H-0.02,0.01,0.98),'#a8a8a8');
    r.addColorStop(clamp(yw/H,0.02,0.99),'#6a6a6a');
    r.addColorStop(clamp(yw/H+0.04,0.03,1),'#e0e0e0');
    r.addColorStop(1,'#e8e8e8');
    rx.fillStyle=r;rx.fillRect(i,0,1,H);
  }
  // plate seams: horizontal strakes
  x.lineWidth=1;
  for(let k=1;k<10;k++){
    const y=H*k/10;
    x.strokeStyle='rgba(10,12,14,0.35)';x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();
    x.strokeStyle='rgba(200,210,220,0.10)';x.beginPath();x.moveTo(0,y+1.5);x.lineTo(W,y+1.5);x.stroke();
    rx.strokeStyle='rgba(60,60,60,0.5)';rx.beginPath();rx.moveTo(0,y);rx.lineTo(W,y);rx.stroke();
  }
  // vertical butt seams, staggered
  for(let k=0;k<10;k++)for(let j=0;j<12;j++){
    const bx=(j*96+(k%2)*48)%W,by=H*k/10;
    x.strokeStyle='rgba(10,12,14,0.28)';x.beginPath();x.moveTo(bx,by);x.lineTo(bx,by+H/10);x.stroke();
    rx.strokeStyle='rgba(70,70,70,0.4)';rx.beginPath();rx.moveTo(bx,by);rx.lineTo(bx,by+H/10);rx.stroke();
  }
  // rivet rows along seams
  x.fillStyle='rgba(15,18,20,0.4)';
  for(let k=1;k<10;k++){const y=H*k/10+4;for(let j=0;j<W;j+=14){x.beginPath();x.arc(j+(k%2)*7,y,1.1,0,TAU);x.fill();}}
  // rust streaks dripping from deck edge, scuppers and seams
  function streak(sx,sy,len,w,a){
    const g=x.createLinearGradient(0,sy,0,sy+len);
    g.addColorStop(0,`rgba(122,66,34,${a})`);g.addColorStop(0.5,`rgba(96,52,30,${a*0.55})`);g.addColorStop(1,'rgba(80,44,26,0)');
    x.fillStyle=g;x.fillRect(sx,sy,w,len);
    rx.fillStyle=`rgba(250,250,250,${a*0.8})`;rx.fillRect(sx,sy,w,len*0.7);
  }
  for(let i=0;i<170;i++){
    const sx=R(W),sy=R()<0.5?R(0,H*0.12):R(H*0.1,H*0.85);
    streak(sx,sy,R(18,120),R(1,3.4),R(0.10,0.4));
  }
  // scuppers with heavy streaks
  for(let j=0;j<26;j++){
    const sx=j*40+R(-6,6),sy=H*0.075;
    x.fillStyle='rgba(8,10,12,0.8)';x.fillRect(sx,sy,5,3);
    streak(sx+1,sy+3,R(60,170),R(2.5,4.5),R(0.3,0.55));
  }
  // waterline wear + boot scuffing
  for(let i=0;i<240;i++){
    const u=R(1),yw=H*(1-waterV(u));
    x.fillStyle=`rgba(${Math.floor(R(140,190))},${Math.floor(R(120,150))},${Math.floor(R(100,120))},${R(0.04,0.14)})`;
    x.fillRect(R(W),yw+R(-14,26),R(2,9),R(1,3));
  }
  // grime at keel
  const gk=x.createLinearGradient(0,H*0.86,0,H);
  gk.addColorStop(0,'rgba(20,16,12,0)');gk.addColorStop(1,'rgba(18,14,10,0.5)');
  x.fillStyle=gk;x.fillRect(0,H*0.86,W,H*0.14);
  speckle(x,W,H,2600,0.05,40,200);
  speckle(rx,W,H,1600,0.08,90,230);
  return {map:tex(c),rough:tex(rc,false)};
}

/* damp concrete */
function concreteMaps(){
  const S=512,c=makeCanvas(S,S),x=c.getContext('2d');
  x.fillStyle='#6b727a';x.fillRect(0,0,S,S);
  for(let i=0;i<42;i++){
    const g=x.createRadialGradient(R(S),R(S),0,R(S),R(S),R(20,58));
    const d=R()<0.5;
    g.addColorStop(0,d?'rgba(62,68,75,0.08)':'rgba(148,155,163,0.06)');g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.fillRect(0,0,S,S);
  }
  // formwork lifts + tie holes
  for(let k=0;k<4;k++){
    const y=k*128;
    x.strokeStyle='rgba(40,44,50,0.28)';x.lineWidth=2;x.beginPath();x.moveTo(0,y);x.lineTo(S,y);x.stroke();
    x.strokeStyle='rgba(180,186,192,0.08)';x.lineWidth=1;x.beginPath();x.moveTo(0,y+2);x.lineTo(S,y+2);x.stroke();
    for(let j=0;j<4;j++){x.fillStyle='rgba(34,37,42,0.45)';x.beginPath();x.arc(j*128+64,y+64,3.5,0,TAU);x.fill();}
  }
  // damp streaks from top
  for(let i=0;i<46;i++){
    const sx=R(S),len=R(60,300);
    const g=x.createLinearGradient(0,0,0,len);
    g.addColorStop(0,'rgba(38,42,50,0.30)');g.addColorStop(1,'rgba(38,42,50,0)');
    x.fillStyle=g;x.fillRect(sx,R(S*0.3),R(2,7),len);
  }
  // cracks
  x.strokeStyle='rgba(30,33,37,0.28)';x.lineWidth=1;
  for(let i=0;i<4;i++){
    let px=R(S),py=R(S);x.beginPath();x.moveTo(px,py);
    for(let k=0;k<6;k++){px+=R(-18,18);py+=R(4,22);x.lineTo(px,py);}x.stroke();
  }
  speckle(x,S,S,5200,0.08,55,200);
  const rc=makeCanvas(S,S),rx=rc.getContext('2d');
  rx.fillStyle='#c8c8c8';rx.fillRect(0,0,S,S);
  for(let i=0;i<40;i++){ // damp patches = smoother
    const g=rx.createRadialGradient(R(S),R(S),0,R(S),R(S),R(24,80));
    g.addColorStop(0,'rgba(90,90,90,0.5)');g.addColorStop(1,'rgba(0,0,0,0)');
    rx.fillStyle=g;rx.fillRect(0,0,S,S);
  }
  speckle(rx,S,S,1500,0.08,120,240);
  return {map:tex(c,true,[1,1]),rough:tex(rc,false,[1,1])};
}
function worldUV(geo,scale){
  const p=geo.attributes.position,n=geo.attributes.normal,uv=new Float32Array(p.count*2);
  for(let i=0;i<p.count;i++){
    const nx=Math.abs(n.getX(i)),ny=Math.abs(n.getY(i)),nz=Math.abs(n.getZ(i));
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    let u,v;
    if(nx>=ny&&nx>=nz){u=z;v=y;}else if(ny>=nx&&ny>=nz){u=x;v=z;}else{u=x;v=y;}
    uv[i*2]=u*scale;uv[i*2+1]=v*scale;
  }
  geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));
}

/* weathered painted steel (gantry, cranes, scaffold) */
function steelMaps(base='#7d838a'){
  const S=256,c=makeCanvas(S,S),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,S,S);
  for(let i=0;i<26;i++){
    const g=x.createRadialGradient(R(S),R(S),0,R(S),R(S),R(8,42));
    g.addColorStop(0,`rgba(122,66,34,${R(0.12,0.4)})`);g.addColorStop(1,'rgba(122,66,34,0)');
    x.fillStyle=g;x.fillRect(0,0,S,S);
  }
  for(let i=0;i<30;i++){
    const sx=R(S),sy=R(S*0.5);
    const g=x.createLinearGradient(0,sy,0,sy+R(20,90));
    g.addColorStop(0,'rgba(104,58,32,0.35)');g.addColorStop(1,'rgba(104,58,32,0)');
    x.fillStyle=g;x.fillRect(sx,sy,R(1,3),R(20,90));
  }
  x.strokeStyle='rgba(20,22,25,0.35)';
  for(let k=1;k<4;k++){x.beginPath();x.moveTo(0,k*64);x.lineTo(S,k*64);x.stroke();}
  speckle(x,S,S,900,0.07,50,210);
  const rc=makeCanvas(S,S),rx=rc.getContext('2d');
  rx.fillStyle='#8c8c8c';rx.fillRect(0,0,S,S);
  for(let i=0;i<26;i++){const g=rx.createRadialGradient(R(S),R(S),0,R(S),R(S),R(8,42));g.addColorStop(0,'rgba(235,235,235,0.7)');g.addColorStop(1,'rgba(0,0,0,0)');rx.fillStyle=g;rx.fillRect(0,0,S,S);}
  speckle(rx,S,S,700,0.08,90,230);
  return {map:tex(c,true,[2,2]),rough:tex(rc,false,[2,2])};
}

/* deck plating */
function deckMaps(){
  const S=256,c=makeCanvas(S,S),x=c.getContext('2d');
  x.fillStyle='#4d554e';x.fillRect(0,0,S,S);
  for(let i=0;i<40;i++){const g=x.createRadialGradient(R(S),R(S),0,R(S),R(S),R(10,50));g.addColorStop(0,`rgba(${R()<0.5?'110,70,40':'30,34,30'},${R(0.08,0.25)})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,S,S);}
  x.strokeStyle='rgba(22,25,22,0.5)';
  for(let k=0;k<4;k++){x.beginPath();x.moveTo(0,k*64);x.lineTo(S,k*64);x.stroke();x.beginPath();x.moveTo(k*64,0);x.lineTo(k*64,S);x.stroke();}
  speckle(x,S,S,1400,0.07,40,170);
  const rc=makeCanvas(S,S),rx=rc.getContext('2d');
  rx.fillStyle='#b4b4b4';rx.fillRect(0,0,S,S);speckle(rx,S,S,900,0.1,90,230);
  return {map:tex(c,true,[6,6]),rough:tex(rc,false,[6,6])};
}

/* soft radial sprites */
function puffTex(){
  const S=128,c=makeCanvas(S,S),x=c.getContext('2d');
  for(let i=0;i<7;i++){
    const px=S/2+R(-16,16),py=S/2+R(-16,16),r=R(22,44);
    const g=x.createRadialGradient(px,py,0,px,py,r);
    g.addColorStop(0,'rgba(255,255,255,0.16)');g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.fillRect(0,0,S,S);
  }
  return tex(c);
}
function glowTex(inner='rgba(255,255,255,1)',mid='rgba(255,255,255,0.35)'){
  const S=64,c=makeCanvas(S,S),x=c.getContext('2d');
  const g=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  g.addColorStop(0,inner);g.addColorStop(0.35,mid);g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,S,S);
  return tex(c);
}
function puddleAlpha(){
  const S=256,c=makeCanvas(S,S),x=c.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,S,S);
  for(let i=0;i<5;i++){
    x.fillStyle='#fff';x.beginPath();
    let a=R(TAU),r=R(30,60);const cx=S/2+R(-30,30),cy=S/2+R(-30,30);
    x.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
    for(let k=1;k<=26;k++){a=k/26*TAU;const rr=r*(0.65+0.35*Math.sin(a*3+i))+R(-6,6);x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}
    x.closePath();x.filter='blur(6px)';x.fill();x.filter='none';
  }
  return tex(c,false);
}

const HULL=hullMaps(),CONC=concreteMaps(),STEEL=steelMaps(),STEELY=steelMaps('#8a7a4e'),DECK=deckMaps();
const PUFF=puffTex(),GLOW=glowTex(),WARML=glowTex('rgba(255,214,150,1)','rgba(255,170,90,0.35)'),PUDDLE=puddleAlpha();

/* ---------- blue-hour sky dome ---------- */
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{},
  vertexShader:`varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    varying vec3 vDir;
    float hash(vec3 p){p=fract(p*0.3183099+vec3(0.1,0.2,0.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
    void main(){
      vec3 d=normalize(vDir);
      float h=clamp(d.y,-0.1,1.0);
      vec3 zen=vec3(0.030,0.052,0.115);
      vec3 mid=vec3(0.085,0.130,0.235);
      vec3 hor=vec3(0.235,0.290,0.400);
      vec3 col=mix(hor,mid,smoothstep(0.0,0.22,h));
      col=mix(col,zen,smoothstep(0.18,0.75,h));

/* ---------- hull loft ---------- */
const NU=120,NV=26;
function buildHull(){
  const rows=NV+2,cols=rows*2+1;
  const pos=[],uv=[],idx=[];
  const p={x:0,y:0};
  for(let i=0;i<=NU;i++){
    const u=i/NU,z=zAt(u),D=deckAt(u),B=beamAt(u),fl=0.38*ss(0.30,0,u);
    const topX=B*(1+fl);
    for(let j=-rows;j<=rows;j++){
      const sgn=j<0?-1:1,aj=Math.abs(j);
      let x,y,v;
      if(aj<=NV){v=aj/NV;section(u,v,p);x=p.x;y=p.y;}
      else{const k=aj-NV;v=1;x=topX*(1-0.012*k);y=D+0.3*k;}
      pos.push(sgn*x,y,z);
      uv.push(u,Math.min(v,1));
    }
  }
  for(let i=0;i<NU;i++)for(let j=0;j<cols-1;j++){
    const a=i*cols+j,b=a+1,c=a+cols,d=c+1;
    idx.push(a,b,c,b,d,c);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  return g;
}

/* ---------- pooled particles (fixed-step sim) ---------- */
function pointsSystem(n,map,blending,color){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(new Float32Array(n),1));
  geo.setAttribute('aAlpha',new THREE.BufferAttribute(new Float32Array(n),1));
  const mat=new THREE.ShaderMaterial({
    uniforms:{uMap:{value:map},uColor:{value:new THREE.Color(color)},uScale:{value:600}},
    transparent:true,depthWrite:false,blending,
    vertexShader:`attribute float aSize;attribute float aAlpha;varying float vA;uniform float uScale;
      void main(){vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*uScale/max(0.1,-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform sampler2D uMap;uniform vec3 uColor;varying float vA;
      void main(){vec4 t=texture2D(uMap,gl_PointCoord);float a=t.a*vA;if(a<0.004)discard;gl_FragColor=vec4(uColor*t.rgb,a);}`
  });
  const pts=new THREE.Points(geo,mat);pts.frustumCulled=false;scene.add(pts);
  return {geo,mat,pts,n};
}

}
function stepParticles(h){
  for(let i=0;i<260;i++){
    if(SP.life[i]<=0)continue;
    SP.life[i]-=h;
    SP.vy[i]-=6.5*h;
    SP.px[i]+=SP.vx[i]*h;SP.py[i]+=SP.vy[i]*h;SP.pz[i]+=SP.vz[i]*h;
    if(SP.py[i]<0.1&&SP.px[i]>-4.15&&SP.px[i]<-1.85&&SP.pz[i]>20.95&&SP.pz[i]<22.85){
      SP.py[i]=0.1;SP.vy[i]*=-0.32;SP.vx[i]*=0.6;SP.vz[i]*=0.6;SP.life[i]-=0.12;
    }else if(SP.py[i]<4.28&&SP.py[i]>4.0&&SP.px[i]>-6.8&&SP.px[i]<-3.6&&SP.pz[i]>20.5&&SP.pz[i]<25.0&&SP.vy[i]<0){
      SP.py[i]=4.28;SP.vy[i]*=-0.3;SP.vx[i]*=0.55;SP.vz[i]*=0.55;SP.life[i]-=0.15;
    }else if(SP.py[i]<0.02){SP.life[i]=0;}
  }
  for(let i=0;i<42;i++){
    if(ST.life[i]<=0)continue;
    ST.life[i]-=h;
    ST.py[i]+=0.55*h;ST.px[i]+=ST.vx[i]*h;ST.pz[i]+=Math.sin(ST.life[i]*1.7+i)*0.05*h;
  }
}
function syncParticles(){
  const pa=sparks.geo.attributes.position.array,sa=sparks.geo.attributes.aSize.array,aa=sparks.geo.attributes.aAlpha.array;
  for(let i=0;i<260;i++){
    const t=SP.life[i]>0?SP.life[i]/SP.max[i]:0;
    pa[i*3]=SP.px[i];pa[i*3+1]=SP.life[i]>0?SP.py[i]:-50;pa[i*3+2]=SP.pz[i];
    sa[i]=0.05+0.07*t;aa[i]=t>0?Math.min(1,t*2.2):0;
  }
  sparks.geo.attributes.position.needsUpdate=true;sparks.geo.attributes.aSize.needsUpdate=true;sparks.geo.attributes.aAlpha.needsUpdate=true;
  const pb=steam.geo.attributes.position.array,sb=steam.geo.attributes.aSize.array,ab=steam.geo.attributes.aAlpha.array;
  for(let i=0;i<42;i++){
    const age=ST.max[i]-ST.life[i],t=ST.life[i]>0?age/ST.max[i]:1;
    pb[i*3]=ST.px[i];pb[i*3+1]=ST.life[i]>0?ST.py[i]:-50;pb[i*3+2]=ST.pz[i];
    sb[i]=0.55+2.1*t;ab[i]=ST.life[i]>0?0.17*Math.pow(Math.sin(Math.PI*t),0.8):0;
  }
  steam.geo.attributes.position.needsUpdate=true;steam.geo.attributes.aSize.needsUpdate=true;steam.geo.attributes.aAlpha.needsUpdate=true;
}

/* ---------- camera choreography ---------- */
const pathPos=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-8.4,2.4,42),new THREE.Vector3(-9.7,2.7,30),
  new THREE.Vector3(-9.8,3.0,14),new THREE.Vector3(-9.6,2.9,-4),
  new THREE.Vector3(-9.6,3.0,-26),new THREE.Vector3(-9.8,3.7,-44),
  new THREE.Vector3(-9.0,5.0,-30),new THREE.Vector3(-9.8,4.4,-2),
  new THREE.Vector3(-9.6,3.2,22),new THREE.Vector3(-7.6,2.5,40)
],true,'centripetal',0.5);
const pathTgt=new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,5.0,26),new THREE.Vector3(0,5.4,24),
  new THREE.Vector3(0,6.6,10),new THREE.Vector3(0,7.6,-16),
  new THREE.Vector3(0,8.6,-40),new THREE.Vector3(0,9.6,-62),
  new THREE.Vector3(0,8.0,-20),new THREE.Vector3(0,6.6,6),
  new THREE.Vector3(0,5.2,24),new THREE.Vector3(0,5.0,26)
],true,'centripetal',0.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.06;
controls.enablePan=false;controls.minDistance=4.5;controls.maxDistance=75;
controls.maxPolarAngle=1.53;controls.minPolarAngle=0.08;
controls.target.set(0,5,26);controls.enabled=false;
let mode='cine',paused=false,simTime=0,cineT=0,blendT=0;
const blendFrom={p:new THREE.Vector3(),t:new THREE.Vector3()};
const curTgt=new THREE.Vector3(0,5,26);
function enterManual(){
  if(mode==='manual')return;
  mode='manual';controls.enabled=true;controls.target.copy(curTgt);
  document.getElementById('btnCine').classList.remove('on');
}
function startBlend(reset){
  if(reset)cineT=0;
  blendFrom.p.copy(camera.position);blendFrom.t.copy(curTgt);
  blendT=0;mode='blend';controls.enabled=false;
  document.getElementById('btnCine').classList.add('on');
}
renderer.domElement.addEventListener('pointerdown',enterManual);
renderer.domElement.addEventListener('wheel',enterManual,{passive:true});
function clampCamera(){
  const p=camera.position;
  p.y=Math.max(0.45,p.y);
  p.z=clamp(p.z,-71,46.5);
  const ax=Math.abs(p.x);
  const lim=p.y<3.5?10.5:p.y<7.1?12.1:p.y<10.7?13.7:15.3;
  if(ax>lim)p.x=Math.sign(p.x)*lim;
  if(p.z>-70&&p.z<24){
    const u=clamp(uAt(p.z),0,1),B=beamAt(u);
    if(Math.abs(p.x)<B+0.5&&p.y>hullBottomAt(p.x,p.z)-0.25&&p.y<deckAt(u)+1.3)
      p.x=Math.sign(p.x||-1)*(B+0.7);
    if(Math.abs(p.x)<1.1&&p.y<2.7&&p.z>-64&&p.z<22)p.x=Math.sign(p.x||-1)*1.2;
  }
  if(Math.abs(p.z-25.8)<0.9&&Math.hypot(p.x,p.y-4.4)<2.7)p.z=p.z>25.8?26.8:24.8;
  controls.target.y=clamp(controls.target.y,0.5,17);
  controls.target.x=clamp(controls.target.x,-12,12);
  controls.target.z=clamp(controls.target.z,-62,42);
}

/* ---------- procedural sound ---------- */
let AC=null,master=null,motorGain=null,humGain=null,audioOn=false;
function noiseBuf(sec){
  const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return b;
}
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  const nb=noiseBuf(2);
  const vent=AC.createBufferSource();vent.buffer=nb;vent.loop=true;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;lp.Q.value=0.6;
  const vg=AC.createGain();vg.gain.value=0.11;
  vent.connect(lp);lp.connect(vg);vg.connect(master);vent.start();
  const lfo=AC.createOscillator();lfo.frequency.value=0.09;
  const lg=AC.createGain();lg.gain.value=0.035;lfo.connect(lg);lg.connect(vg.gain);lfo.start();
  motorGain=AC.createGain();motorGain.gain.value=0;
  const mlp=AC.createBiquadFilter();mlp.type='lowpass';mlp.frequency.value=230;
  const o1=AC.createOscillator();o1.type='sawtooth';o1.frequency.value=46;
  const o2=AC.createOscillator();o2.type='square';o2.frequency.value=92;
  const g2=AC.createGain();g2.gain.value=0.3;
  o1.connect(mlp);o2.connect(g2);g2.connect(mlp);mlp.connect(motorGain);motorGain.connect(master);
  o1.start();o2.start();
  const wn=AC.createBufferSource();wn.buffer=nb;wn.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=520;bp.Q.value=1.2;
  const wg=AC.createGain();wg.gain.value=0.16;
  wn.connect(bp);bp.connect(wg);wg.connect(motorGain);wn.start();
  humGain=AC.createGain();humGain.gain.value=0;
  const ho=AC.createOscillator();ho.type='triangle';ho.frequency.value=112;
  ho.connect(humGain);humGain.connect(master);ho.start();
}
function crackle(env){
  if(!AC||AC.state!=='running')return;
  const t=AC.currentTime,dur=0.02+Math.random()*0.05;
  const s=AC.createBufferSource();s.buffer=noiseBuf(dur+0.01);
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1400+Math.random()*3600;bp.Q.value=1.8;
  const g=AC.createGain();g.gain.setValueAtTime(0.001,t);
  g.gain.exponentialRampToValueAtTime(0.05+0.09*env,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}

/* ---------- UI ---------- */
const ui=document.getElementById('ui'),hint=document.getElementById('hint');
let idleTimer=0;
function wake(){
  ui.classList.remove('hidden');hint.style.opacity='1';
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{ui.classList.add('hidden');hint.style.opacity='0';},4500);
}
for(const ev of ['pointermove','pointerdown','keydown','focusin','touchstart'])
  addEventListener(ev,wake,{passive:true});
wake();
const btnCine=document.getElementById('btnCine'),btnReset=document.getElementById('btnReset'),
      btnPause=document.getElementById('btnPause'),btnSound=document.getElementById('btnSound');
btnCine.addEventListener('click',()=>startBlend(false));
btnReset.addEventListener('click',()=>startBlend(true));
btnPause.addEventListener('click',()=>{
  paused=!paused;btnPause.textContent=paused?'RESUME':'PAUSE';
  btnPause.classList.toggle('on',paused);
});
btnSound.addEventListener('click',async()=>{
  if(!AC)initAudio();
  if(AC.state==='suspended')await AC.resume();
  audioOn=!audioOn;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(audioOn?0.55:0,AC.currentTime,0.25);
  btnSound.textContent=audioOn?'SOUND ON':'SOUND';
  btnSound.classList.toggle('on',audioOn);
});

/* ---------- resize ---------- */
function onResize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  const pr=DPR*renderScale;
  renderer.setPixelRatio(pr);composer.setPixelRatio(pr);
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  const sc=renderer.domElement.height*0.5/Math.tan(THREE.MathUtils.degToRad(camera.fov*0.5));
  sparks.mat.uniforms.uScale.value=sc;steam.mat.uniforms.uScale.value=sc;
}
addEventListener('resize',onResize);onResize();

/* ---------- main loop ---------- */
const clock=new THREE.Clock();
let acc=0,sparkAcc=0,prevGz=-17,puckZ=-24,puckV=0,emaDt=16,frames=0,crackleAcc=0;
const H=1/120;
const tmpP=new THREE.Vector3(),tmpT=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  emaDt=emaDt*0.94+dt*1000*0.06;frames++;
  if(frames>90&&frames%45===0){
    if(emaDt>30&&renderScale>0.66){renderScale=Math.max(0.66,renderScale-0.08);onResize();}
    else if(emaDt<21&&renderScale<1){renderScale=Math.min(1,renderScale+0.04);onResize();}
  }
  let weldEnv=0,gz=prevGz;
  if(!paused){
    simTime+=dt;cineT+=dt;
    acc+=dt;let n=0;
    while(acc>=H&&n<6){
      stepParticles(H);
      const target=prevGz-7;
      puckV+=((target-puckZ)*6-puckV*4)*H;puckZ+=puckV*H;
      acc-=H;n++;
    }
    if(n===6)acc=0;
    const phase=simTime%7.2;
    weldEnv=ss(0,0.12,phase)*(1-ss(1.45,1.7,phase));
    const flick=0.72+0.28*Math.sin(simTime*87)*Math.sin(simTime*31+1);
    sparkAcc+=dt*130*weldEnv;
    while(sparkAcc>=1){spawnSpark();sparkAcc--;}
    ST.acc+=dt;while(ST.acc>=0.24){spawnSteam();ST.acc-=0.24;}
    gz=-17+29*Math.sin(TAU*simTime/170);
    const dz=gz-prevGz;prevGz=gz;
    gantry.position.z=gz;
    for(const w of wheels)w.rotation.x+=dz/0.3;
    reel.rotation.x-=dz/0.34;
    puck.position.z=puckZ;
    for(const {tgt,z} of gantrySpots){
      tgt.position.z=z+2.6*Math.sin(simTime*0.33+z*2);
      tgt.position.y=6.2+1.3*Math.sin(simTime*0.21+z);
    }
    radar.rotation.y=simTime*0.7;
    weldLight.intensity=230*weldEnv*flick;
    arc.scale.setScalar(Math.max(0.001,0.34*weldEnv*flick));
    arcCore.scale.setScalar(Math.max(0.001,0.12*weldEnv*flick));
    const rp=new THREE.Vector3(-9.05,1.28,gz+0.6);
    const sag=0.3+0.06*Math.abs(gz+0.6-puckZ);
    for(let k=0;k<20;k++){
      const t=k/19;
      cablePts[k*3]=lerp(rp.x,-9.1,t);
      cablePts[k*3+1]=lerp(rp.y,0.14,t)-sag*4*t*(1-t);
      cablePts[k*3+2]=lerp(rp.z,puckZ,t);
    }
    cableGeo.attributes.position.needsUpdate=true;
    if(audioOn&&AC){
      const spd=Math.abs(29*TAU/170*Math.cos(TAU*simTime/170));
      motorGain.gain.setTargetAtTime(0.014+0.05*clamp(spd/1.1,0,1),AC.currentTime,0.2);
      humGain.gain.setTargetAtTime(0.016*weldEnv,AC.currentTime,0.05);
      crackleAcc+=dt;
      if(weldEnv>0.1&&crackleAcc>0.045){crackleAcc=0;crackle(weldEnv);}
    }
  }
  if(mode==='cine'){
    const t=(cineT%50)/50;
    pathPos.getPointAt(t,tmpP);pathTgt.getPointAt(t,tmpT);
    tmpP.x+=0.035*Math.sin(simTime*0.9);tmpP.y+=0.03*Math.sin(simTime*0.7+2);
    camera.position.copy(tmpP);curTgt.copy(tmpT);
    controls.target.copy(curTgt);camera.lookAt(curTgt);
  }else if(mode==='blend'){
    blendT=Math.min(1,blendT+dt/1.6);
    const e=blendT*blendT*(3-2*blendT),t=(cineT%50)/50;
    pathPos.getPointAt(t,tmpP);pathTgt.getPointAt(t,tmpT);
    camera.position.lerpVectors(blendFrom.p,tmpP,e);
    curTgt.lerpVectors(blendFrom.t,tmpT,e);
    controls.target.copy(curTgt);camera.lookAt(curTgt);
    if(blendT>=1)mode='cine';
  }else{
    controls.update();curTgt.copy(controls.target);
  }
  clampCamera();
  if(mode!=='manual')camera.lookAt(curTgt);
  syncParticles();
  composer.render();
  if(frames===2)document.getElementById('veil').style.opacity='0';
}
animate();

/* debug / test hook */
window.__BHD={
  get fps(){return Math.round(1000/emaDt);},
  get renderScale(){return +renderScale.toFixed(2);},
  get simTime(){return simTime;},
  get mode(){return mode;},
  get paused(){return paused;},
  get gantryZ(){return prevGz;},
  get calls(){return renderer.info.render.calls;},
  get tris(){return renderer.info.render.triangles;},
  setTime(t){simTime=t;cineT=t;prevGz=-17+29*Math.sin(TAU*t/170);gantry.position.z=prevGz;},
  setPaused(v){paused=v;},
  setView(px,py,pz,tx,ty,tz){enterManual();camera.position.set(px,py,pz);controls.target.set(tx,ty,tz);curTgt.set(tx,ty,tz);controls.update();},
  renderer,scene,camera
};
</script>
