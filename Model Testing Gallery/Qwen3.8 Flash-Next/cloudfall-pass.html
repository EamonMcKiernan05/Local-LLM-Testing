<body>
<canvas id="c"></canvas>
<div id="ui" class="ui">
  <div id="title" class="ui"><h1>Cloudfall Pass</h1><p>Saddle Station 7 &middot; 05:42 &middot; spill 11 m/s</p></div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   CLOUDFALL PASS — deterministic procedural scene, seed 1337
   ============================================================ */
const SEED = 1337;

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const smoothstep=(e0,e1,x)=>{ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };

/* ---------- seeded 2D value noise ---------- */
const PERM = new Uint8Array(512);
{
  const r = mulberry32(SEED);
  const p0 = new Uint8Array(256);
  for(let i=0;i<256;i++) p0[i]=i;
  for(let i=255;i>0;i--){ const j=(r()*(i+1))|0; const t=p0[i]; p0[i]=p0[j]; p0[j]=t; }
  for(let i=0;i<512;i++) PERM[i]=p0[i&255];
}
function h2i(x,y){ return PERM[(PERM[x&255]+(y&255))&255]*0.00392156862745098; }
function v2(x,y){
  const xi=Math.floor(x), yi=Math.floor(y);
  let xf=x-xi, yf=y-yi;
  xf=xf*xf*(3-2*xf); yf=yf*yf*(3-2*yf);
  const a=h2i(xi,yi), b=h2i(xi+1,yi), c=h2i(xi,yi+1), d=h2i(xi+1,yi+1);
  return lerp(lerp(a,b,xf), lerp(c,d,xf), yf);
}
function fbm2(x,y,oct){ let s=0,a=0.5,f=1,n=0;
  for(let i=0;i<oct;i++){ s+=a*v2(x*f,y*f); n+=a; a*=0.5; f*=2.03; } return s/n; }
function ridged2(x,y,oct){ let s=0,a=0.5,f=1,n=0;
  for(let i=0;i<oct;i++){ const nv=1-Math.abs(v2(x*f,y*f)*2-1); s+=a*nv*nv; n+=a; a*=0.5; f*=2.11; } return s/n; }

/* ---------- terrain heightfield ---------- */
const STX=16, STZ=6;                      // weather station position
const PADH = baseH(STX,STZ);               // station pad height
function baseH(x,z){
  const az=Math.abs(z);
  let h=14+ridged2(x*0.0021+3.1, z*0.0021-1.7, 5)*96;
  const wall=smoothstep(24,150,az);
  h=h*(0.52+0.85*wall)+16*wall;
  const notch=1-smoothstep(0,95,az);
  h=lerp(h, 40+fbm2(x*0.005+9, z*0.005-4, 3)*14-4, notch);
  h+=smoothstep(30,-90,x)*24;                       // windward plateau
  const desc=smoothstep(24,270,x);                  // leeward descent
  const valley=-6+fbm2(x*0.0045+21, z*0.0045+7, 3)*12;
  h=lerp(h, Math.min(h, valley+10), desc);
  const fr=Math.exp(-(((x-96)*(x-96)+(z-72)*(z-72))/4000));
  h+=fr*15;                                          // dark foreground ridge
  h+=ridged2(x*0.02+31, z*0.02-11, 3)*4.5-2.2;       // eroded medium detail
  h+=v2(x*0.09+5, z*0.09-3)*1.4-0.7;                 // erosion bumps
  h+=v2(x*0.035,z*0.035)*2.4-1.2;
  return h;
}
function H(x,z){
  let h=baseH(x,z);
  const d=Math.hypot(x-STX,z-STZ);
  if(d<19) h=lerp(h,PADH,smoothstep(19,8,d));        // flattened station pad
  return h;
}
function slopeAt(x,z){
  const e=1.2;
  const hx=(H(x+e,z)-H(x-e,z))/(2*e);
  const hz=(H(x,z+e)-H(x,z-e))/(2*e);
  return Math.min(1.4, Math.hypot(hx,hz));
}

/* ---------- global constants ---------- */
const B_MIN=new THREE.Vector3(-170,14,-150);   // cloud volume bounds
const B_MAX=new THREE.Vector3( 240,92, 150);
const SUN_DIR=new THREE.Vector3(0.12,0.24,0.96).normalize();
const WIND={gust:1};
const CAM0={theta:2.02, phi:0.16, radius:150, pivot:new THREE.Vector3(26,36,-2)};

/* ============================================================
   PROCEDURAL TEXTURES (generated once, deterministic)
   ============================================================ */

/* ---------- 3D cloud noise (64^3 RGBA) ---------- */
const N3=64;
const CLOUD_NOISE = (()=>{
  const rng=mulberry32(SEED^0x5f3a);
  const latt={};
  for(const l of [4,8,16,32,64]){
    const a=new Float32Array(l*l*l);
    for(let i=0;i<a.length;i++) a[i]=rng();
    latt[l]=a;
  }
  function lat(a,l,x,y,z){
    let xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
    let xf=x-xi, yf=y-yi, zf=z-zi;
    xf=xf*xf*(3-2*xf); yf=yf*yf*(3-2*yf); zf=zf*zf*(3-2*zf);
    const w=(i,j,k)=>a[(((k%l+l)%l)*l+((j%l+l)%l))*l+((i%l+l)%l)];
    const c000=w(xi,yi,zi),   c100=w(xi+1,yi,zi);
    const c010=w(xi,yi+1,zi), c110=w(xi+1,yi+1,zi);
    const c001=w(xi,yi,zi+1), c101=w(xi+1,yi,zi+1);
    const c011=w(xi,yi+1,zi+1),c111=w(xi+1,yi+1,zi+1);
    const x00=c000+(c100-c000)*xf, x10=c010+(c110-c010)*xf;
    const x01=c001+(c101-c001)*xf, x11=c011+(c111-c011)*xf;
    const y0=x00+(x10-x00)*yf, y1=x01+(x11-x01)*yf;
    return y0+(y1-y0)*zf;
  }
  const data=new Uint8Array(N3*N3*N3*4);
  let idx=0;
  for(let z=0;z<N3;z++)for(let y=0;y<N3;y++)for(let x=0;x<N3;x++){
    const fx=x/N3, fy=y/N3, fz=z/N3;
    let shape=0, wsum=0;
    const so=[[4,0.45],[8,0.28],[16,0.17],[32,0.10]];
    for(const [l,w] of so){ shape+=w*lat(latt[l],l,fx*l,fy*l,fz*l); wsum+=w; }
    shape/=wsum;
    let detail=0; wsum=0;
    const do_=[[16,0.5],[32,0.3],[64,0.2]];
    for(const [l,w] of do_){ detail+=w*lat(latt[l],l,fx*l,fy*l,fz*l); wsum+=w; }
    detail/=wsum;
    const warp=lat(latt[8],8,fx*8,fy*8,fz*8);
    const extra=lat(latt[32],32,fx*32,fy*32,fz*32);
    data[idx++]=shape*255; data[idx++]=detail*255; data[idx++]=warp*255; data[idx++]=extra*255;
  }
  const tex=new THREE.Data3DTexture(data,N3,N3,N3);
  tex.format=THREE.RGBAFormat; tex.type=THREE.UnsignedByteType;
  tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;
  tex.wrapS=tex.wrapT=tex.wrapR=THREE.RepeatWrapping;
  tex.needsUpdate=true;
  return tex;
})();

/* ---------- terrain height map over cloud-volume xz range ---------- */
const HM=256;
const HM_RANGE_X=B_MAX.x-B_MIN.x, HM_RANGE_Z=B_MAX.z-B_MIN.z;
let HM_MIN=0, HM_MAX=1;
const HEIGHT_MAP=(()=>{
  const hs=new Float32Array(HM*HM);
  let mn=1e9,mx=-1e9;
  for(let j=0;j<HM;j++)for(let i=0;i<HM;i++){
    const x=B_MIN.x+(i+0.5)/HM*HM_RANGE_X;
    const z=B_MIN.z+(j+0.5)/HM*HM_RANGE_Z;
    const h=H(x,z); hs[j*HM+i]=h;
    if(h<mn)mn=h; if(h>mx)mx=h;
  }
  HM_MIN=mn; HM_MAX=mx+1;
  const data=new Uint8Array(HM*HM*4);
  let k=0;
  for(let j=0;j<HM;j++)for(let i=0;i<HM;i++){
    const t=(hs[j*HM+i]-HM_MIN)/(HM_MAX-HM_MIN);
    data[k++]=t*255; data[k++]=0; data[k++]=0; data[k++]=255;
  }
  const tex=new THREE.DataTexture(data,HM,HM,THREE.RGBAFormat);
  tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;
  tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
  tex.flipY=false; tex.needsUpdate=true;
  return tex;
})();

/* ---------- corrugated metal texture ---------- */
function corrugatedTexture(base, cols, w, h, weather){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const g=cv.getContext('2d');
  const rng=mulberry32(SEED^0x77a1);
  const img=g.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const s=0.5+0.5*Math.sin(x/cols*Math.PI*2);
    const gr=(rng()-0.5)*weather;
    const rust=Math.max(0, v2(x*0.09,y*0.02)-0.62)*1.8;
    let r=base[0]*(0.62+0.55*s)+gr*18, gg=base[1]*(0.62+0.55*s)+gr*18, bb=base[2]*(0.62+0.55*s)+gr*18;
    r=lerp(r,122,rust); gg=lerp(gg,74,rust); bb=lerp(bb,52,rust);
    const k=(y*w+x)*4;
    img.data[k]=clamp(r,0,255); img.data[k+1]=clamp(gg,0,255); img.data[k+2]=clamp(bb,0,255); img.data[k+3]=255;
  }
  g.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(cv);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
function corrugatedBump(cols,w,h){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const g=cv.getContext('2d'); const img=g.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const s=Math.sin(x/cols*Math.PI*2);
    const v=clamp(128+s*90,0,255);
    const k=(y*w+x)*4;
    img.data[k]=img.data[k+1]=img.data[k+2]=v; img.data[k+3]=255;
  }
  g.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(cv);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  return tex;
}

/* ---------- soft particle sprite ---------- */
const SPRITE=(()=>{
  const s=64; const cv=document.createElement('canvas'); cv.width=cv.height=s;
  const g=cv.getContext('2d');
  const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.4,'rgba(255,255,255,0.45)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s);
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
})();

/* ---------- equirect environment (sky + sun + ground) ---------- */
const ENV_TEX=(()=>{
  const w=512,h=256;
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const g=cv.getContext('2d');
  for(let y=0;y<h;y++){
    const v=y/h;                       // 0 top
    const up=clamp((0.5-v)*2,0,1);
    const r=lerp(150,36,up), gg=lerp(158,52,up), b=lerp(170,92,up);
    g.fillStyle=`rgb(${r|0},${gg|0},${b|0})`;
    g.fillRect(0,y,w,1);
  }
  const gr=g.createRadialGradient(w*0.30,h*0.52,0,w*0.30,h*0.52,h*0.34);
  gr.addColorStop(0,'rgba(255,214,160,0.95)');
  gr.addColorStop(0.25,'rgba(255,160,90,0.35)');
  gr.addColorStop(1,'rgba(255,140,80,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  const tex=new THREE.CanvasTexture(cv);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
})();

/* ============================================================
   RENDERER, SCENE, SKY, LIGHTS, TERRAIN
   ============================================================ */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
const DPR=Math.min(window.devicePixelRatio||1, 1.75);
renderer.setPixelRatio(DPR);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;      // ACES applied in composite pass
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate=false;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42, 1, 1.2, 6000);

const pmrem=new THREE.PMREMGenerator(renderer);
const envRT=pmrem.fromEquirectangular(ENV_TEX);
scene.environment=envRT.texture;
pmrem.dispose();

/* shared uniforms */
const U={
  uSunDir:{value:SUN_DIR.clone()},
  uFogCol:{value:new THREE.Color(0.36,0.41,0.49)},
  uFogWarm:{value:new THREE.Color(0.66,0.52,0.46)},
  uFogK:{value:0.00046},
  uTime:{value:0},
  uGust:{value:1},
};

/* ---------- sky dome ---------- */
{
  const mat=new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    uniforms:{ uSunDir:U.uSunDir, uFogCol:U.uFogCol, uFogWarm:U.uFogWarm },
    vertexShader:`varying vec3 vDir;
      void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vDir;
      uniform vec3 uSunDir,uFogCol,uFogWarm;
      void main(){
        vec3 d=normalize(vDir);
        vec3 zen=vec3(0.085,0.135,0.255);
        vec3 hor=vec3(0.40,0.43,0.52);
        vec3 col=mix(hor,zen,pow(max(d.y,0.0),0.55));
        float sd=max(dot(d,uSunDir),0.0);
        float az=max(dot(normalize(vec3(d.x,0.0,d.z)),normalize(vec3(uSunDir.x,0.0,uSunDir.z))),0.0);
        col=mix(col,vec3(0.78,0.50,0.36),pow(az,4.0)*smoothstep(0.14,0.0,abs(d.y))*0.75);
        col+=vec3(1.0,0.72,0.42)*pow(sd,1200.0)*22.0;
        col+=vec3(1.0,0.55,0.30)*pow(sd,22.0)*0.10;
        col=mix(col,uFogCol,smoothstep(0.03,-0.10,d.y));
        gl_FragColor=vec4(col,1.0);
      }`
  });
  const sky=new THREE.Mesh(new THREE.SphereGeometry(4200,40,20),mat);
  sky.frustumCulled=false; sky.renderOrder=-10;
  scene.add(sky);
}

/* ---------- lights ---------- */
const sun=new THREE.DirectionalLight(0xffc49a, 2.6);
sun.position.copy(SUN_DIR).multiplyScalar(320).add(new THREE.Vector3(STX,0,STZ));
sun.target.position.set(STX,PADH,STZ);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-140; sun.shadow.camera.right=140;
sun.shadow.camera.top=140;  sun.shadow.camera.bottom=-140;
sun.shadow.camera.near=60;  sun.shadow.camera.far=760;
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.9;
scene.add(sun); scene.add(sun.target);
const hemi=new THREE.HemisphereLight(0x9db8d8,0x4a5058,1.0);
const rim=new THREE.DirectionalLight(0xffb888, 0.9);
rim.position.copy(SUN_DIR).multiplyScalar(-260).add(new THREE.Vector3(STX,120,STZ));
rim.target.position.set(STX,PADH,STZ);
scene.add(rim); scene.add(rim.target);
scene.add(hemi);

/* ---------- GLSL snippets ---------- */
const NOISE_GLSL=`
float hash31(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.yzx+33.33); return fract((p.x+p.y)*p.z); }
float vn3(vec3 x){
  vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  float a=mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
              mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);
  return a;
}
float fbmA(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){ s+=a*vn3(p); p*=2.03; a*=0.5; } return s; }
float fbmB(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<2;i++){ s+=a*vn3(p); p*=2.11; a*=0.5; } return s*0.67; }
`;
const FOG_GLSL=`
{
  vec3 vd=normalize(vWP-cameraPosition);
  float fd=length(vWP-cameraPosition);
  float hf=mix(1.0,0.12,smoothstep(42.0,95.0,vWP.y));
  float f=1.0-exp(-pow(fd*uFogK*(0.30+hf),1.35));
  vec3 fc=mix(uFogCol,uFogWarm,pow(max(dot(vd,uSunDir),0.0),3.0)*0.55);
  gl_FragColor.rgb=mix(gl_FragColor.rgb,fc,clamp(f,0.0,0.93));
}`;
const VARY_HEAD=`varying vec3 vWP; varying vec3 vWN;
uniform vec3 uSunDir; uniform vec3 uFogCol; uniform vec3 uFogWarm; uniform float uFogK;
`;

/* ---------- terrain ---------- */
const TERRAIN_ALBEDO=`
#include <map_fragment>
float gSnow;
{
  vec3 wp=vWP;
  float slope=1.0-clamp(vWN.y,0.0,1.0);
  float str=sin(wp.y*0.25+vn3(wp*vec3(0.013,0.06,0.013))*9.0);
  vec3 rock=mix(vec3(0.190,0.182,0.175),vec3(0.470,0.415,0.355),str*0.5+0.5);
  rock=mix(rock,rock*vec3(1.28,1.14,0.98)+vec3(0.02),fbmB(wp*0.05)*0.7);
  float spk=vn3(wp*1.7);
  vec3 scree=vec3(0.42,0.40,0.38)*(0.62+0.75*spk);
  float screeM=smoothstep(0.28,0.52,slope)*(1.0-smoothstep(0.75,0.95,slope));
  vec3 col=mix(rock,scree,screeM);
  float grassM=(1.0-smoothstep(0.14,0.40,slope))
              *smoothstep(54.0,36.0,wp.y)*smoothstep(-16.0,-5.0,wp.y)
              *smoothstep(0.40,0.60,fbmB(wp*0.055+7.0));
  vec3 grass=mix(vec3(0.10,0.14,0.075),vec3(0.24,0.24,0.13),vn3(wp*0.09));
  col=mix(col,grass,grassM*0.85);
  gSnow=smoothstep(64.0,84.0,wp.y+fbmB(wp*0.07+13.0)*16.0)*(1.0-smoothstep(0.45,0.75,slope));
  col=mix(col,vec3(0.80,0.83,0.90)*(0.88+0.14*spk),gSnow);
  diffuseColor.rgb=col;
}`;

function patchStandard(mat, withAlbedo){
  mat.onBeforeCompile=(shader)=>{
    shader.uniforms.uSunDir=U.uSunDir; shader.uniforms.uFogCol=U.uFogCol;
    shader.uniforms.uFogWarm=U.uFogWarm; shader.uniforms.uFogK=U.uFogK;
    shader.vertexShader=VARY_HEAD+shader.vertexShader.replace('#include <project_vertex>',
      `#include <project_vertex>
       vWP=(modelMatrix*vec4(transformed,1.0)).xyz;
       vWN=normalize(mat3(modelMatrix)*objectNormal);`);
    shader.fragmentShader=`${VARY_HEAD}
      ${withAlbedo?NOISE_GLSL:''}
      `+shader.fragmentShader
      .replace('#include <fog_fragment>', FOG_GLSL);
    if(withAlbedo){
      shader.fragmentShader=shader.fragmentShader
        .replace('#include <map_fragment>', TERRAIN_ALBEDO)
        .replace('#include <roughnessmap_fragment>',
          '#include <roughnessmap_fragment>\n roughnessFactor=mix(roughnessFactor,0.52,gSnow);')
        .replace('#include <normal_fragment_begin>',
          `#include <normal_fragment_begin>
           { vec3 p=vWP*0.45;
             float n0=vn3(p), nx=vn3(p+vec3(1.0,0.0,0.0)), nz=vn3(p+vec3(0.0,0.0,1.0));
             vec3 grad=vec3(nx-n0,0.0,nz-n0)*1.1;
             grad+=(vec3(vn3(vWP*1.6+vec3(1.0,0.0,0.0))-vn3(vWP*1.6),0.0,
                         vn3(vWP*1.6+vec3(0.0,0.0,1.0))-vn3(vWP*1.6)))*0.35;
             vec3 nw=normalize(vWN-grad*0.6);
             normal=normalize((viewMatrix*vec4(nw,0.0)).xyz); }`);
    }
    mat.userData.shader=shader;
  };
  mat.customProgramCacheKey=()=>'cfpatch'+(withAlbedo?'A':'F');
  return mat;
}

  grassMat=new THREE.ShaderMaterial({
    side:THREE.DoubleSide,
    uniforms:{
      uTime:U.uTime, uGust:U.uGust, uSunDir:U.uSunDir,
      uFogCol:U.uFogCol, uFogWarm:U.uFogWarm, uFogK:U.uFogK
    },
    vertexShader:`
      uniform float uTime,uGust;
      varying vec3 vC; varying vec3 vCol; varying float vBend;
      void main(){
        vec3 pos=position;
        float bend=clamp(pos.y/0.55,0.0,1.0);
        vec4 wp=modelMatrix*instanceMatrix*vec4(pos,1.0);
        float ph=wp.x*0.55+wp.z*0.85;
        float sway=sin(uTime*2.1+ph)*0.6+sin(uTime*3.9+ph*1.7)*0.25;
        wp.x+=sway*0.13*bend*bend*uGust;
        wp.z+=sway*0.03*bend*bend*uGust;
        vC=wp.xyz; vCol=instanceColor; vBend=bend;
        gl_Position=projectionMatrix*viewMatrix*wp;
      }`,
    fragmentShader:`
      uniform vec3 uSunDir,uFogCol,uFogWarm; uniform float uFogK;
      varying vec3 vC; varying vec3 vCol; varying float vBend;
      void main(){
        float sun=max(dot(vec3(0.0,0.7,0.3),uSunDir),0.0);
        vec3 amb=mix(vec3(0.30,0.36,0.44),vec3(0.62,0.66,0.70),vBend);
        vec3 col=vCol*(amb+vec3(1.0,0.72,0.45)*sun*0.38*vBend);
        gl_FragColor=vec4(col,1.0);
        vec3 vd=normalize(vC-cameraPosition);
        float fd=length(vC-cameraPosition);
        float hf=mix(1.0,0.12,smoothstep(42.0,95.0,vC.y));
        float f=1.0-exp(-pow(fd*uFogK*(0.30+hf),1.35));
        vec3 fc=mix(uFogCol,uFogWarm,pow(max(dot(vd,uSunDir),0.0),3.0)*0.55);
        gl_FragColor.rgb=mix(gl_FragColor.rgb,fc,clamp(f,0.0,0.93));
      }`
  });
  const MAX=2800;
  const grass=new THREE.InstancedMesh(tuft,grassMat,MAX);
  const col=new THREE.Color();
  let n=0,tries=0;
  while(n<MAX&&tries<MAX*22){
    tries++;
    const x=(rngP()*2-1)*215, z=(rngP()*2-1)*140;
    if(Math.hypot(x-STX,z-STZ)<11) continue;
    const h=H(x,z);
    if(h<-15||h>48) continue;
    if(slopeAt(x,z)>0.34) continue;
    const cluster=v2(x*0.018+5,z*0.018-3);
    if(cluster<0.52 && rngP()>0.02) continue;
    if(cluster>=0.52 && rngP()>0.45) continue;
    dummy.position.set(x,h-0.03,z);
    dummy.rotation.set(0,rngP()*Math.PI*2,(rngP()-0.5)*0.15);
    const s=0.6+rngP()*0.9;
    dummy.scale.set(s,s*(0.7+rngP()*0.7),s);
    dummy.updateMatrix();
    grass.setMatrixAt(n,dummy.matrix);
    const t=rngP();
    col.setRGB(lerp(0.045,0.11,t)*(0.7+rngP()*0.5), lerp(0.065,0.115,t)*(0.7+rngP()*0.5), lerp(0.028,0.05,t));
    grass.setColorAt(n,col);
    n++;
  }
  grass.count=n;
  grass.frustumCulled=false;
  scene.add(grass);
}

/* ============================================================
   VOLUMETRIC CLOUDFALL (raymarched, half-res, depth-aware)
   ============================================================ */
const CLOUD_SUN=new THREE.Color(0.95,0.60,0.36);

const cloudU={
  uCam:{value:new THREE.Vector3()},
  uCamDir:{value:new THREE.Vector3()},
  uRes:{value:new THREE.Vector2(1,1)},
  uNear:{value:camera.near},
  uFar:{value:camera.far},
  uTime:U.uTime,
  uGust:U.uGust,
  uGapPos:{value:new THREE.Vector3()},
  uGapR:{value:0},
  uDbgClamp:{value:1},
  uDbgShape:{value:0},
  uSunDir:U.uSunDir,
  uSunCol:{value:CLOUD_SUN},
  uFogCol:U.uFogCol,
  uBMin:{value:B_MIN},
  uBMax:{value:B_MAX},
  uHMN:{value:HM_MIN},
  uHMX:{value:HM_MAX},
  uNoise:{value:CLOUD_NOISE},
  uHMap:{value:HEIGHT_MAP},
  uDepth:{value:null},
};

const cloudMat=new THREE.ShaderMaterial({
  glslVersion:THREE.GLSL3,
  transparent:true, depthTest:false, depthWrite:false,
  side:THREE.DoubleSide,
  uniforms:cloudU,
  vertexShader:`
    out vec3 vWP;
    void main(){
      vec4 wp=modelMatrix*vec4(position,1.0);
      vWP=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:`
    precision highp float;
    precision highp sampler3D;
    uniform vec3 uCam,uCamDir,uSunDir,uSunCol,uBMin,uBMax,uGapPos,uFogCol;
    uniform float uTime,uGust,uGapR,uNear,uFar,uHMN,uHMX,uDbgClamp,uDbgShape;
    uniform vec2 uRes;
    uniform sampler3D uNoise;
    uniform sampler2D uHMap,uDepth;
    in vec3 vWP;
    out vec4 outColor;

    float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
    float n2(vec2 p){
      vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(h21(i),h21(i+vec2(1.0,0.0)),f.x),mix(h21(i+vec2(0.0,1.0)),h21(i+vec2(1.0,1.0)),f.x),f.y);
    }
    float hmap(vec2 xz){
      vec2 uv=vec2((xz.x-uBMin.x)/(uBMax.x-uBMin.x),(xz.y-uBMin.y)/(uBMax.y-uBMin.y));
      return mix(uHMN,uHMX,texture(uHMap,uv).r);
    }
    vec3 curlOff(vec3 p){
      float t=uTime*0.055;
      float amp=4.0+30.0*smoothstep(6.0,120.0,p.x)*uGust;
      vec3 q=p*0.016;
      return vec3(n2(q.yz+t*1.3)-0.5,(n2(q.xz+t)-0.5)*0.35,n2(q.xy-t*0.9)-0.5)*amp;
    }
    float dens(vec3 p,bool detail){
      float x=p.x;
      float width=mix(130.0,36.0+max(x,0.0)*0.65,smoothstep(-45.0,25.0,x));
      float zm=1.0-smoothstep(width*0.5,width,abs(p.z));
      float xm=mix(1.0,0.25,smoothstep(35.0,215.0,x));
      float top=mix(72.0,26.0,smoothstep(-10.0,190.0,x));
      float bot=mix(38.0,4.0,smoothstep(-10.0,190.0,x));
      top+=(n2(vec2(p.x*0.9,p.z*1.1)*0.02+uTime*0.01)-0.5)*16.0;
      bot+=(n2(vec2(p.x*0.7,p.z*0.9)*0.03-uTime*0.008)-0.5)*7.0;
      float ym=smoothstep(bot-12.0,bot+7.0,p.y)*(1.0-smoothstep(top-16.0,top+2.0,p.y));
      float hm=hmap(p.xz);
      float tf=smoothstep(hm-2.5,hm+7.0,p.y);
      float gap=1.0;
      if(uGapR>0.002){
        float gd=length((p-uGapPos)/vec3(55.0,24.0,45.0));
        gap=mix(1.0,smoothstep(0.20,0.95,gd),uGapR);
      }
      float mask=zm*xm*ym*tf*gap;
      if(uDbgShape>1.5) mask=1.0;
      if(mask<0.004) return 0.0;
      vec3 pw=p+curlOff(p);
      pw.y=mix(pw.y, uBMin.y+(pw.y-uBMin.y)*0.42, smoothstep(15.0,130.0,x));
      vec3 uvw=(pw-uBMin)/(uBMax-uBMin);
      vec4 n4=texture(uNoise,uvw);
      vec3 n=n4.rgb;
      if(uDbgShape>0.5){ n=vec3(0.85,0.85,0.5); n4.a=0.5; }
      float shape=n.r*0.62+n.g*0.30+n.b*0.08;
      if(detail){
        vec4 m4=texture(uNoise,uvw*2.3+vec3(0.37,0.11,0.53));
        shape=shape*0.74+m4.g*0.26;
      }
      float d=smoothstep(0.38,0.60,shape);
      if(d<=0.0) return 0.0;
      d*=3.2;
      if(detail) d*=(0.42+1.25*n.g)*(0.72+0.55*n4.a);
      return d*mask;
    }
    float sunSha(vec3 p){
      float s=0.0;
      for(int i=1;i<=4;i++){
        vec3 q=p+uSunDir*float(i)*9.0;
        vec3 uv=(q-uBMin)/(uBMax-uBMin);
        if(any(lessThan(uv,vec3(0.0)))||any(greaterThan(uv,vec3(1.0)))) continue;
        vec4 sv=texture(uNoise,uv);
        float sh=sv.r*0.62+sv.g*0.30;
        s+=smoothstep(0.36,0.58,sh);
      }
      return exp(-s*0.95);
    }
    void main(){
      vec3 rd=normalize(vWP-uCam);
      vec3 ro=uCam;
      vec3 inv=1.0/rd;
      vec3 t0c=(uBMin-ro)*inv, t1c=(uBMax-ro)*inv;
      float lo=max(max(min(t0c.x,t1c.x),min(t0c.y,t1c.y)),min(t0c.z,t1c.z));
      float hi=min(min(max(t0c.x,t1c.x),max(t0c.y,t1c.y)),max(t0c.z,t1c.z));
      lo=max(lo,0.0);
      float dn=texture(uDepth,gl_FragCoord.xy/uRes).r;
      if(uDbgShape>4.5){ outColor=vec4(dn,dn,dn,1.0); return; }
      if(uDbgShape>2.5&&uDbgShape<3.5){ outColor=vec4(dn,dn,dn,1.0); return; }
      float ndcz=dn*2.0-1.0;
      float vz=(2.0*uNear*uFar)/((uFar+uNear)-ndcz*(uFar-uNear));
      float linD=vz;
      float tt=linD/max(dot(rd,uCamDir),1e-4);
      if(uDbgShape>3.5){ float c=clamp(log2(max(linD,1.0))/14.0,0.0,1.0); outColor=vec4(c,tt<hi?0.0:1.0,0.0,1.0); return; }
      if(uDbgClamp>0.5) hi=min(hi,tt);
      if(lo>=hi){ outColor=vec4(0.0); return; }
      const int N=48;
      float dt=(hi-lo)/float(N);
      float jit=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);
      float t=lo+dt*jit;
      float trans=1.0;
      vec3 prem=vec3(0.0);
      float alpha=0.0;
      float sigma=0.4;
      for(int i=0;i<N;i++){
        if(trans<0.045) break;
        vec3 p=ro+rd*t;
        float d=dens(p,true);
        if(d>0.004){
          float sh=sunSha(p);
          float mu=dot(rd,uSunDir);
          float g1=0.42,g2=0.86;
          float ph1=(1.0-g1*g1)/pow(1.0+g1*g1-2.0*g1*mu,1.5);
          float ph2=(1.0-g2*g2)/pow(1.0+g2*g2-2.0*g2*mu,1.5);
          float ph=0.10+0.30*ph1+0.15*ph2;
          vec3 amb=mix(vec3(0.10,0.14,0.22),vec3(0.36,0.44,0.58),smoothstep(15.0,85.0,p.y));
          amb+=uSunCol*0.04*sh;
          vec3 lit=uSunCol*sh*ph*1.05+amb*0.5;
          float ext=d*sigma*dt;
          float a=trans*(1.0-exp(-ext));
          prem+=lit*a;
          alpha+=a;
          trans*=exp(-ext);
        }
        t+=dt;
      }
      float fd=length(ro+rd*(lo+(hi-lo)*0.5)-uCam);
      float fogF=1.0-exp(-pow(fd*0.0008,1.4));
      prem=mix(prem,uFogCol*alpha*0.85,fogF*0.8);
      outColor=vec4(prem,alpha);
    }`
});
{
  const size=B_MAX.clone().sub(B_MIN);
  const box=new THREE.Mesh(new THREE.BoxGeometry(size.x,size.y,size.z),cloudMat);
  box.position.copy(B_MIN).add(B_MAX).multiplyScalar(0.5);

/* ---------- render targets ---------- */
const sceneRT=new THREE.WebGLRenderTarget(2,2,{
  type:THREE.HalfFloatType, depthBuffer:true
});
sceneRT.depthTexture=new THREE.DepthTexture(2,2);
sceneRT.depthTexture.type=THREE.UnsignedIntType;
cloudU.uDepth.value=sceneRT.depthTexture;

const cloudRT=new THREE.WebGLRenderTarget(2,2,{type:THREE.HalfFloatType});

const compU={
  uScene:{value:sceneRT.texture},
  uCloud:{value:cloudRT.texture},
  uExposure:{value:1.15},
};
const compMat=new THREE.ShaderMaterial({
  glslVersion:THREE.GLSL3,
  depthTest:false, depthWrite:false,
  uniforms:compU,
  vertexShader:`
    out vec2 vUv;
    void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader:`
    precision highp float;
    uniform sampler2D uScene,uCloud;
    uniform float uExposure;
    in vec2 vUv;
    out vec4 outColor;
    vec3 aces(vec3 x){
      const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
      return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0);
    }
    void main(){
      vec3 s=texture(uScene,vUv).rgb;
      vec4 cl=texture(uCloud,vUv);
      vec3 col=s*(1.0-cl.a)+cl.rgb;
      col*=uExposure;
      col=aces(col);
      vec2 q=vUv-0.5;
      float vig=1.0-dot(q,q)*0.42;
      col*=vig;
      outColor=linearToOutputTexel(vec4(col,1.0));
    }`
});
const compScene=new THREE.Scene();
{
  const m=new THREE.Mesh(new THREE.PlaneGeometry(2,2),compMat);
  m.frustumCulled=false;
  compScene.add(m);
}
const compCam=new THREE.Camera();

/* ============================================================
   CAMERA, UI, AUDIO, HERO MOMENT, MAIN LOOP
   ============================================================ */
let theta=CAM0.theta, phi=CAM0.phi, radius=CAM0.radius;
let tTheta=theta, tPhi=phi, tRadius=radius;
let vTheta=0, vPhi=0;
const pivot=CAM0.pivot.clone();
let mode='cine', cineT=0, lastInput=-1e9;
let dragging=false, movedDist=0;
const pointers=new Map();
let pinchDist=0;
let paused=false;

const ui=document.getElementById('ui');
const btnCine=document.getElementById('btnCine');
const btnReset=document.getElementById('btnReset');
const btnPause=document.getElementById('btnPause');
const btnSound=document.getElementById('btnSound');

let uiTimer=0;
function poke(){
  ui.classList.remove('hidden');
  clearTimeout(uiTimer);
  uiTimer=setTimeout(()=>ui.classList.add('hidden'),6000);
}
['pointermove','pointerdown','keydown','focusin'].forEach(ev=>
  window.addEventListener(ev,poke,{passive:true}));
poke();

canvas.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ dragging=true; movedDist=0; canvas.classList.add('drag'); }
  if(pointers.size===2){
    const p=[...pointers.values()];
    pinchDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  }
  canvas.setPointerCapture(e.pointerId);
  mode='manual'; lastInput=performance.now();
});
canvas.addEventListener('pointermove',e=>{
  const prev=pointers.get(e.pointerId);
  if(!prev) return;
  const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  prev.x=e.clientX; prev.y=e.clientY;
  if(pointers.size===2){
    const p=[...pointers.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchDist>0) tRadius=clamp(tRadius*Math.exp((pinchDist-d)*0.004),85,330);
    pinchDist=d;
    mode='manual'; lastInput=performance.now();
    return;
  }
  if(!dragging) return;
  movedDist+=Math.abs(dx)+Math.abs(dy);
  tTheta-=dx*0.0045;
  tPhi=clamp(tPhi+dy*0.0030,0.06,0.45);
  vTheta=-dx*0.0045; vPhi=dy*0.0030;
  mode='manual'; lastInput=performance.now();
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchDist=0;
  if(pointers.size===0){ dragging=false; canvas.classList.remove('drag'); }
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  tRadius=clamp(tRadius*Math.exp(e.deltaY*0.0012),85,330);
  mode='manual'; lastInput=performance.now();
},{passive:false});

function setManual(){ mode='manual'; lastInput=performance.now(); }
btnCine.addEventListener('click',()=>{ mode='cine'; cineT=0; btnCine.classList.add('on'); setTimeout(()=>btnCine.classList.remove('on'),900); });
btnReset.addEventListener('click',()=>{
  mode='cine'; cineT=0;
  tTheta=CAM0.theta; tPhi=CAM0.phi; tRadius=CAM0.radius;
  vTheta=0; vPhi=0;
  btnReset.classList.add('on'); setTimeout(()=>btnReset.classList.remove('on'),900);
});
function togglePause(){
  paused=!paused;
  btnPause.textContent=paused?'Resume':'Pause';
  btnPause.classList.toggle('on',paused);
}
btnPause.addEventListener('click',togglePause);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); togglePause(); }
  else if(e.key==='c'||e.key==='C'){ mode='cine'; cineT=0; }
  else if(e.key==='r'||e.key==='R'){ btnReset.click(); }
  else if(e.key==='s'||e.key==='S'){ btnSound.click(); }
});

/* ---------- procedural ridge audio ---------- */
let AC=null, master=null, audioOn=false;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
  const sr=AC.sampleRate, len=sr*2.5;
  const nb=AC.createBuffer(1,len,sr);
  const nd=nb.getChannelData(0);
  const ar=mulberry32(SEED^0xA0D10);
  let b=0;
  for(let i=0;i<len;i++){
    const w=ar()*2-1;
    b=(b+0.02*w)/1.02;
    nd[i]=w*0.55+b*2.2;
  }
  function noiseSrc(){ const s=AC.createBufferSource(); s.buffer=nb; s.loop=true; return s; }
  function lfo(freq,depth,target){
    const o=AC.createOscillator(); o.frequency.value=freq;
    const g=AC.createGain(); g.gain.value=depth;
    o.connect(g); g.connect(target); o.start();
    return o;
  }
  // airy wind
  const ws=noiseSrc();
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=430; bp.Q.value=0.75;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500;
  const wg=AC.createGain(); wg.gain.value=0.34;
  ws.connect(bp); bp.connect(lp); lp.connect(wg); wg.connect(master);
  ws.start();
  lfo(0.07,0.16,wg.gain); lfo(0.19,0.05,wg.gain);
  // high hiss shimmer
  const hs=noiseSrc();
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2600;
  const hg=AC.createGain(); hg.gain.value=0.035;
  hs.connect(hp); hp.connect(hg); hg.connect(master);
  hs.start();
  lfo(0.11,0.022,hg.gain);
  // mast-cable whistle
  const wo=AC.createOscillator(); wo.type='sine'; wo.frequency.value=1185;
  const vib=AC.createOscillator(); vib.frequency.value=4.7;
  const vibG=AC.createGain(); vibG.gain.value=16;
  vib.connect(vibG); vibG.connect(wo.frequency); vib.start();
  const wgg=AC.createGain(); wgg.gain.value=0.008;
  wo.connect(wgg); wgg.connect(master); wo.start();
  lfo(0.09,0.007,wgg.gain);
  // hut panel vibration
  const ps=noiseSrc();
  const pb=AC.createBiquadFilter(); pb.type='bandpass'; pb.frequency.value=158; pb.Q.value=9;
  const pg=AC.createGain(); pg.gain.value=0.045;
  ps.connect(pb); pb.connect(pg); pg.connect(master);
  ps.start();
  lfo(0.13,0.030,pg.gain); lfo(0.31,0.014,pg.gain);
}
btnSound.addEventListener('click',()=>{
  if(!AC) initAudio();
  AC.resume();
  audioOn=!audioOn;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(audioOn?0.5:0,AC.currentTime,0.5);
  btnSound.textContent=audioOn?'Sound On':'Sound';
  btnSound.classList.toggle('on',audioOn);
});

/* ---------- sizing ---------- */
const CLOUD_SCALE=0.42;
function resize(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  const dw=Math.max(2,Math.floor(w*DPR)), dh=Math.max(2,Math.floor(h*DPR));
  sceneRT.setSize(dw,dh);
  cloudRT.setSize(Math.max(2,Math.floor(dw*CLOUD_SCALE)),Math.max(2,Math.floor(dh*CLOUD_SCALE)));
  cloudU.uRes.value.set(cloudRT.width,cloudRT.height);
}
window.addEventListener('resize',resize);
resize();

/* ---------- simulation ---------- */
const STEP=1/60;
let simT=0, acc=0;
const baseAlpha=partAlpha.slice();
function stepSim(){
  const t=simT;
  WIND.gust=0.72+0.34*Math.sin(t*0.13)+0.12*Math.sin(t*0.37+1.7)+0.06*Math.sin(t*0.9+0.4);
  U.uGust.value=WIND.gust;
  U.uTime.value=t;
  anemometer.rotation.y+=(2.6+3.8*WIND.gust)*STEP;
  const spd=(6+10*WIND.gust)*STEP;
  const prng=window.__parts.pr;
  for(let i=0;i<PN;i++){
    let x=partPos[i*3]+spd, y=partPos[i*3+1]-(0.30+0.5*WIND.gust)*STEP, z=partPos[i*3+2]+1.4*STEP;
    if(x>200){ x=-140+prng()*24; y=14+prng()*46; z=-120+prng()*240; }
    if(y<8){ y=52+prng()*8; }
    partPos[i*3]=x; partPos[i*3+1]=y; partPos[i*3+2]=z;
    const fx=smoothstep(-140,-95,x)*(1-smoothstep(150,200,x));
    const fy=smoothstep(8,18,y)*(1-smoothstep(46,60,y));
    partAlpha[i]=baseAlpha[i]*fx*fy;
  }
  window.__parts.geo.attributes.position.needsUpdate=true;
  window.__parts.geo.attributes.aAlpha.needsUpdate=true;
}
function heroGap(){
  const phase=simT%66;
  if(phase>=24&&phase<42){
    const e=Math.sin(Math.PI*(phase-24)/18);
    cloudU.uGapR.value=smoothstep(0.05,0.35,e);
    cloudU.uGapPos.value.lerpVectors(
      new THREE.Vector3(-60,52,0), new THREE.Vector3(95,22,0),
      (phase-24)/18);
  } else {
    cloudU.uGapR.value=0;
  }
}

/* ---------- camera ---------- */
const camDir=new THREE.Vector3();
function updateCam(dt,now){
  if(mode==='cine'){
    cineT+=dt;
    tTheta=CAM0.theta+0.36*Math.sin(cineT*0.052)+0.10*Math.sin(cineT*0.021+1.7);
    tPhi=CAM0.phi+0.030*Math.sin(cineT*0.037+0.6);
    tRadius=CAM0.radius+16*Math.sin(cineT*0.031)+5*Math.sin(cineT*0.013+2.0);
  } else {
    if(!dragging){
      tTheta+=vTheta; tPhi=clamp(tPhi+vPhi,0.06,0.45);
      vTheta*=Math.pow(0.90,dt*60); vPhi*=Math.pow(0.90,dt*60);
    }
    if(now-lastInput>24000){ mode='cine'; cineT=0; }
  }
  const k=1-Math.exp(-dt*3.2);
  theta+=(tTheta-theta)*k;
  phi+=(tPhi-phi)*k;
  radius+=(tRadius-radius)*k;
  camera.position.set(
    pivot.x+radius*Math.sin(theta)*Math.cos(phi),
    pivot.y+radius*Math.sin(phi),
    pivot.z+radius*Math.cos(theta)*Math.cos(phi));
  const gh=H(camera.position.x,camera.position.z)+4.5;
  if(camera.position.y<gh) camera.position.y=gh;
  camera.lookAt(pivot);
  camera.getWorldDirection(camDir);
  cloudU.uCam.value.copy(camera.position);
  cloudU.uCamDir.value.copy(camDir);
  cloudU.uNear.value=camera.near;
  cloudU.uFar.value=camera.far;
}

/* ---------- main loop ---------- */
let last=performance.now(), shadowFrames=3;
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  if(!paused){
    acc+=dt;
    let guard=0;
    while(acc>=STEP&&guard<8){ simT+=STEP; acc-=STEP; stepSim(); guard++; }
    if(guard>=8) acc=0;
    heroGap();
  }
  updateCam(dt,now);
  if(shadowFrames>0){ renderer.shadowMap.needsUpdate=true; shadowFrames--; }

  renderer.setRenderTarget(sceneRT);
  renderer.setClearColor(0x0a0d12,1);
  renderer.clear();
  renderer.render(scene,camera);

  renderer.setRenderTarget(cloudRT);
  renderer.setClearColor(0x000000,0);
  renderer.clear();
  renderer.render(window.__cloudScene,camera);

  renderer.setRenderTarget(null);
  renderer.render(compScene,compCam);
}
requestAnimationFrame(tick);
window.__cf={
  scene, cloudRT, sceneRT,
  set(v){ compU.uExposure.value=v; },
  cloud(on){ window.__cloudScene.visible=on; },
  sim(v){ simT=v; acc=0; },
  cam(t,p,r){ mode='manual'; tTheta=t; tPhi=p; tRadius=r; theta=t; phi=p; radius=r; vTheta=0; vPhi=0; },
  u(name,v){ if(cloudU[name]) cloudU[name].value=v; },
  px(x,y){
    const buf=new Uint16Array(4);
    renderer.readRenderTargetPixels(cloudRT,Math.floor(x*cloudRT.width),Math.floor(y*cloudRT.height),1,1,buf);
    const half=v=>{ const s=(v&0x8000)?-1:1, e=(v>>10)&0x1f, f=v&0x3ff;
      return e===0?s*Math.pow(2,-14)*(f/1024):e===31?Infinity:s*Math.pow(2,e-15)*(1+f/1024); };
    return [half(buf[0]),half(buf[1]),half(buf[2]),half(buf[3])];
  },
  state(){ return {simT, mode, paused, theta, phi, radius}; },
  dbg(){
    const buf=new Uint16Array(cloudRT.width*cloudRT.height*4);
    renderer.readRenderTargetPixels(cloudRT,0,0,cloudRT.width,cloudRT.height,buf);
    let nz=0,mx=0;
    for(let i=3;i<buf.length;i+=4){ const v=buf[i]; if(v>0)nz++; if(v>mx)mx=v; }
    const db=new Uint16Array(64*64);
    renderer.readRenderTargetPixels(sceneRT,0,0,64,64,db);
    let dmin=65535,dmax=0;
    for(let i=0;i<db.length;i++){ if(db[i]<dmin)dmin=db[i]; if(db[i]>dmax)dmax=db[i]; }
    return {cloudPx:nz, cloudMax:mx, total:cloudRT.width*cloudRT.height, dmin, dmax, w:cloudRT.width};
  }
};
