<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>THE RAIN CATHEDRAL</title>
<style>
  :root{ --ink:#e8e4da; --dim:#9aa0a6; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0a0d10;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #c{ position:fixed; inset:0; }
  #c canvas{ display:block; }
  #ui{ position:fixed; inset:0; pointer-events:none; opacity:1; transition:opacity 1.4s ease; }
  #ui.faded{ opacity:0; }
  #ui.faded .ctl{ pointer-events:none; }
  #title{ position:absolute; left:26px; bottom:24px; color:var(--ink);
    text-shadow:0 2px 14px rgba(0,0,0,.75); user-select:none; }
  #title h1{ margin:0; font-size:15px; font-weight:600; letter-spacing:.42em; text-transform:uppercase; }
  #title p{ margin:6px 0 0; font-size:10.5px; letter-spacing:.16em; color:var(--dim); text-transform:uppercase; }
  #controls{ position:absolute; right:22px; bottom:20px; display:flex; gap:8px; }
  .ctl{ pointer-events:auto; cursor:pointer; color:var(--ink); background:rgba(16,19,23,.42);
    border:1px solid rgba(232,228,218,.22); border-radius:3px; padding:8px 12px; font-size:10px;
    letter-spacing:.22em; text-transform:uppercase; backdrop-filter:blur(6px);
    transition:background .25s,border-color .25s,color .25s; font-family:inherit; outline:none; }
  .ctl:hover,.ctl:focus-visible{ background:rgba(30,34,40,.66); border-color:rgba(232,228,218,.55); }
  .ctl.on{ color:#ffd9a8; border-color:rgba(255,196,120,.65); background:rgba(60,40,18,.45); }
  #loading{ position:fixed; inset:0; background:#0a0d10; color:#7d848c; display:flex; align-items:center;
    justify-content:center; font-size:11px; letter-spacing:.3em; text-transform:uppercase;
    transition:opacity 1.2s ease; z-index:9; }
  #loading.done{ opacity:0; pointer-events:none; }
  #vig{ position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(2,4,6,.34) 100%); }
</style>
</head>
<body>
<div id="c"></div>
<div id="vig"></div>
<div id="ui">
  <div id="title">
    <h1>The Rain Cathedral</h1>
    <p>Terminal No.&nbsp;4 — roof failed 1987 · weather installed itself</p>
  </div>
  <div id="controls">
    <button id="bCine" class="ctl on" title="return to the cinematic shot">Cinematic</button>
    <button id="bReset" class="ctl" title="reset to the opening frame">Reset view</button>
    <button id="bPause" class="ctl" title="freeze scene time">Pause</button>
    <button id="bSound" class="ctl" title="procedural rain audio">Sound</button>
  </div>
</div>
<div id="loading">assembling the weather…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">

import * as THREE from 'three';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   THE RAIN CATHEDRAL — deterministic build, seed 1337
   ============================================================ */
const SEED = 1337;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const rand = mulberry32(SEED);
const rnd  = (a=0,b=1)=>a+(b-a)*rand();
const rint = (a,b)=>Math.floor(rnd(a,b+1));
const pick = arr=>arr[Math.floor(rand()*arr.length)];

/* ---------- structural grid ---------- */
const BAY    = 8;              // arch spacing
const NARCH  = 16;             // transverse arches, z = 0 .. 120
const Z_END  = (NARCH-1)*BAY;  // 120 far wall
const Z_NEAR = -5;             // near wall
const HW     = 13.5;           // half span (arch springing x)
const SPRING = 7.0;            // springing height
const RISE   = 9.5;            // crown above springing
const CROWN  = SPRING+RISE;    // 16.5
const WALLX  = 14.1;           // side wall inner face
const PLAT_X = 10.2;           // platform edge |x|
const PLAT_Y = 0.6;            // platform top
const BROKEN = [];             // broken bay indices (between arch b and b+1)
for(let b=1;b<NARCH-1;b+=2) BROKEN.push(b);
// broken bays: 1,3,5,7,9,11,13  → rain falls through these only

/* arch curve: s in [0,1] right→left */
function archPoint(s, out){ const th=Math.PI*s;
  out.x = HW*Math.cos(th); out.y = SPRING+RISE*Math.sin(th); return out; }
function archNormal(s, out){ const th=Math.PI*s;
  const dx=-HW*Math.sin(th), dy=RISE*Math.cos(th); const L=Math.hypot(dy,dx);
  out.x=dy/L; out.y=dx/L; return out; }   // outward/up normal

/* shared floor height field — identical formula in JS + GLSL */
function floorH(x,z){
  return 0.020*Math.sin(x*0.32+1.7)*Math.cos(z*0.19+0.6)
       + 0.013*Math.sin(x*0.83+z*0.53+4.1)
       + 0.009*Math.cos(x*1.61-z*0.97+2.0)
       + 0.005*Math.sin(x*3.1+z*2.6);
}
const WATER_LV = 0.016; // puddles fill low spots up to this

/* ---------- renderer / scene / camera ---------- */
const host = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance', stencil:false });
let DPR_CAP = 1.5;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, DPR_CAP));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.1, 400);
camera.position.set(0.6, 3.1, -2);

/* ---------- procedural overcast environment (equirect) ---------- */
function hashN(i){ const s=Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function noise2(x,y){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hashN(xi+yi*57.3), b=hashN(xi+1+yi*57.3), c=hashN(xi+(yi+1)*57.3), d=hashN(xi+1+(yi+1)*57.3);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y,oct){ let s=0,amp=0.5,f=1; for(let i=0;i<oct;i++){ s+=amp*noise2(x*f,y*f); amp*=0.5; f*=2.07; } return s; }

function makeSkyCanvas(){
  const w=1024,h=512,cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  const img=ctx.createImageData(w,h), d=img.data;
  for(let y=0;y<h;y++){
    const v=y/h;                       // 0 top .. 1 bottom
    for(let x=0;x<w;x++){
      const u=x/w;
      const cl=fbm(u*6.0+7.3, v*3.0+1.2, 5);
      let r,g,b;
      if(v<0.52){                      // sky
        const t=v/0.52;
        r=84+t*122; g=96+t*126; b=112+t*118;      // top slate → bright horizon
        const c=(cl-0.42)*1.6; r+=c*46; g+=c*44; b+=c*36;
        const hx=u*6.28318;            // soft sun bloom azimuth ~ z+
        const dth=Math.abs(Math.atan2(Math.sin(hx-0.0),Math.cos(hx-0.0)));
        const sun=Math.exp(-dth*dth*2.2)*Math.exp(-Math.pow((v-0.40)/0.20,2))*0.55;
        r+=sun*190; g+=sun*178; b+=sun*150;
      } else {                          // below horizon (ground haze)
        const t=(v-0.52)/0.48;
        r=118-t*86; g=116-t*82; b=108-t*72;
        const c=(cl-0.5)*22; r+=c; g+=c; b+=c;
      }
      const i=(y*w+x)*4; d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return cv;
}
const skyCv = makeSkyCanvas();
const skyTex = new THREE.CanvasTexture(skyCv);
skyTex.mapping = THREE.EquirectangularReflectionMapping;
skyTex.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTex;
scene.backgroundIntensity = 0.9;
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromEquirectangular(skyTex);
scene.environment = envRT.texture;
scene.environmentIntensity = 0.85;

/* fog matched to horizon */
scene.fog = new THREE.FogExp2(0x9faeba, 0.0052);

/* ---------- canvas texture helpers ---------- */
function texCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h||w; return c; }
function toTex(cv, srgb=true){
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace = srgb? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
function grain(ctx,w,h,amt,alpha){ // speckle grain
  const img=ctx.getImageData(0,0,w,h), d=img.data;
  for(let i=0;i<d.length;i+=4){ const n=(rand()-0.5)*amt;
    d[i]+=n; d[i+1]+=n; d[i+2]+=n; d[i+3]=Math.min(255,d[i+3]+(rand()<alpha?40:0)); }
  ctx.putImageData(img,0,0);
}

/* chalky masonry / painted brick */
function makeMasonryTex(){
  const w=1024,h=1024,cv=texCanvas(w,h),g=cv.getContext('2d');
  g.fillStyle='#b6ae9f'; g.fillRect(0,0,w,h);
  for(let i=0;i<420;i++){ const x=rand()*w,y=rand()*h,r=rnd(20,160);
    const a=g.createRadialGradient(x,y,0,x,y,r); const t=rand();
    const c=t<0.5? '201,193,178':'148,141,128';
    a.addColorStop(0,`rgba(${c},${rnd(0.04,0.16)})`); a.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle=a; g.fillRect(x-r,y-r,r*2,r*2); }
  // brick courses
  g.strokeStyle='rgba(96,88,76,0.22)'; g.lineWidth=1.4;
  const bh=42;
  for(let y=0;y<h;y+=bh){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
    const off=(y/bh)%2? 64:0;
    for(let x=off;x<w;x+=128){ g.beginPath(); g.moveTo(x,y); g.lineTo(x,y+bh); g.stroke(); } }
  // grime running down
  for(let i=0;i<26;i++){ const x=rand()*w; const wdt=rnd(6,34);
    const gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'rgba(52,48,42,0.0)'); gr.addColorStop(rnd(0.1,0.35),'rgba(52,48,42,0.05)');
    gr.addColorStop(1,`rgba(38,35,30,${rnd(0.16,0.34)})`);
    g.fillStyle=gr; g.fillRect(x,0,wdt,h); }
  // soot near base
  const gb=g.createLinearGradient(0,h*0.72,0,h);
  gb.addColorStop(0,'rgba(30,28,25,0)'); gb.addColorStop(1,'rgba(30,28,25,0.4)');
  g.fillStyle=gb; g.fillRect(0,h*0.72,w,h*0.28);
  grain(g,w,h,14,0);
  return toTex(cv);
}
/* blackened riveted steel */
function makeSteelTex(){
  const w=512,h=512,cv=texCanvas(w,h),g=cv.getContext('2d');
  g.fillStyle='#23201d'; g.fillRect(0,0,w,h);
  for(let i=0;i<200;i++){ const x=rand()*w,y=rand()*h,r=rnd(8,90);
    const a=g.createRadialGradient(x,y,0,x,y,r); const t=rand();
    const c=t<0.55?'58,52,46':'96,64,38';
    a.addColorStop(0,`rgba(${c},${rnd(0.05,0.2)})`); a.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle=a; g.fillRect(x-r,y-r,r*2,r*2); }
  // rivet rows (painted bumps read via shading in map)
  g.fillStyle='rgba(120,112,102,0.35)';
  for(let y=28;y<h;y+=64) for(let x=16;x<w;x+=48){ g.beginPath(); g.arc(x,y,3.2,0,7); g.fill(); }
  g.fillStyle='rgba(10,9,8,0.5)';
  for(let y=30;y<h;y+=64) for(let x=17;x<w;x+=48){ g.beginPath(); g.arc(x,y,2.6,0,7); g.fill(); }
  grain(g,w,h,18,0);
  return toTex(cv);
}
function makeSteelRough(){
  const w=512,h=512,cv=texCanvas(w,h,false),g=cv.getContext('2d');
  g.fillStyle='#9a9a9a'; g.fillRect(0,0,w,h);
  for(let i=0;i<160;i++){ const x=rand()*w,y=rand()*h,r=rnd(10,80);
    const a=g.createRadialGradient(x,y,0,x,y,r);
    a.addColorStop(0,`rgba(255,255,255,${rnd(0.1,0.3)})`); a.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=a; g.fillRect(x-r,y-r,r*2,r*2); }
  return toTex(cv,false);
}
/* wet terrazzo */
function makeTerrazzoTex(){
  const w=1024,h=1024,cv=texCanvas(w,h),g=cv.getContext('2d');
  g.fillStyle='#a49e93'; g.fillRect(0,0,w,h);
  for(let i=0;i<26000;i++){ const x=rand()*w,y=rand()*h,r=rnd(0.6,3.2);
    const t=rand(); let c;
    if(t<0.42)c='196,190,180'; else if(t<0.66)c='128,122,112'; else if(t<0.82)c='84,78,70';
    else if(t<0.93)c='160,150,136'; else c='66,60,54';
    g.fillStyle=`rgba(${c},${rnd(0.25,0.7)})`;
    g.beginPath(); g.ellipse(x,y,r,r*rnd(0.6,1.2),rand()*3.14,0,7); g.fill(); }
  // hairline cracks
  g.strokeStyle='rgba(58,54,48,0.35)'; g.lineWidth=1;
  for(let i=0;i<14;i++){ let x=rand()*w,y=rand()*h; g.beginPath(); g.moveTo(x,y);
    for(let k=0;k<14;k++){ x+=rnd(-60,60); y+=rnd(-60,60); g.lineTo(x,y);} g.stroke(); }
  // oil / tannin stains
  for(let i=0;i<30;i++){ const x=rand()*w,y=rand()*h,r=rnd(30,150);
    const a=g.createRadialGradient(x,y,0,x,y,r);
    a.addColorStop(0,`rgba(46,40,34,${rnd(0.08,0.2)})`); a.addColorStop(1,'rgba(46,40,34,0)');
    g.fillStyle=a; g.fillRect(x-r,y-r,r*2,r*2); }
  return toTex(cv);
}
/* puddle mask from the shared height field (also used to displace the floor) */
function makePuddleTex(){
  const w=384,h=1600,cv=texCanvas(w,h,false),g=cv.getContext('2d');
  const img=g.createImageData(w,h),d=img.data;
  const x0=-WALLX,x1=WALLX,z0=Z_NEAR,z1=Z_END;
  for(let py=0;py<h;py++){ const z=z0+(z1-z0)*py/(h-1);
    for(let px=0;px<w;px++){ const x=x0+(x1-x0)*px/(w-1);
      const hgt=floorH(x,z);
      let p=(WATER_LV-hgt)/0.032; p=Math.max(0,Math.min(1,p));
      p=p*p*(3-2*p);
      // feather edges with fine noise
      const n=fbm(x*1.7+z*0.9, z*2.1-x*0.7, 3);
      p=Math.max(0,Math.min(1,p+(n-0.5)*0.18*p));
      const i=(py*w+px)*4, v=p*255; d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255;
    } }
  g.putImageData(img,0,0);
  const t=toTex(cv,false);
  t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
  return t;
}
/* cracked clerestory glass: dark grime, crack stars, some panes missing */
function makeGlassTex(){
  const w=1024,h=512,cv=texCanvas(w,h),g=cv.getContext('2d');
  g.clearRect(0,0,w,h);
  for(let i=0;i<120;i++){ const x=rand()*w,y=rand()*h,r=rnd(10,120);
    const a=g.createRadialGradient(x,y,0,x,y,r);
    a.addColorStop(0,`rgba(120,116,104,${rnd(0.05,0.16)})`); a.addColorStop(1,'rgba(120,116,104,0)');
    g.fillStyle=a; g.fillRect(x-r,y-r,r*2,r*2); }
  // missing panes (holes)
  for(let i=0;i<9;i++){ const x=Math.floor(rand()*16)*64, y=Math.floor(rand()*4)*128;
    g.clearRect(x+4,y+4,56,120);
    g.strokeStyle='rgba(210,220,225,0.5)'; g.lineWidth=2;
    g.beginPath();
    let px=x+rnd(8,56),py=y+rnd(8,120); g.moveTo(px,py);
    for(let k=0;k<5;k++){ px+=rnd(-14,14); py+=rnd(-14,14); g.lineTo(px,py);} g.stroke(); }
  // crack stars
  for(let i=0;i<26;i++){ const cx=rand()*w,cy=rand()*h,n=rint(6,11);
    g.strokeStyle=`rgba(225,232,236,${rnd(0.25,0.5)})`; g.lineWidth=rnd(0.6,1.4);
    for(let k=0;k<n;k++){ const a=rand()*6.283; let r=0,px=cx,py=cy;
      g.beginPath(); g.moveTo(px,py);
      const seg=rint(3,6);
      for(let s2=0;s2<seg;s2++){ r+=rnd(6,26); px=cx+Math.cos(a+rnd(-0.4,0.4))*r; py=cy+Math.sin(a+rnd(-0.4,0.4))*r; g.lineTo(px,py); }
      g.stroke(); } }
  // condensation streaks
  for(let i=0;i<70;i++){ const x=rand()*w,y=rand()*h,l=rnd(30,180);
    const gr=g.createLinearGradient(x,y,x,y+l);
    gr.addColorStop(0,'rgba(190,200,205,0.0)'); gr.addColorStop(0.3,'rgba(190,200,205,0.14)');
    gr.addColorStop(1,'rgba(190,200,205,0)');
    g.fillStyle=gr; g.fillRect(x,y,2.5,l); }
  const t=toTex(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
/* grass blade sheet */
function makeBladeTex(){
  const s=128,cv=texCanvas(s,s),g=cv.getContext('2d');
  g.clearRect(0,0,s,s);
  for(let i=0;i<16;i++){
    const x0=rnd(8,s-8), hgt=rnd(0.55,1.0)*s, lean=rnd(-14,14);
    const t=rand();
    const c = t<0.3? '86,102,58' : t<0.6? '104,118,66' : t<0.85? '126,132,74':'72,84,52';
    g.strokeStyle=`rgba(${c},${rnd(0.75,1)})`; g.lineWidth=rnd(1.6,3.4); g.lineCap='round';
    g.beginPath(); g.moveTo(x0,s);
    g.quadraticCurveTo(x0+lean*0.3, s-hgt*0.55, x0+lean, s-hgt); g.stroke();
  }
  const t=toTex(cv); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t;
}
/* peeling timetable poster */
function makeTimetableTex(){
  const w=512,h=320,cv=texCanvas(w,h),g=cv.getContext('2d');
  g.fillStyle='#d9d2bd'; g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){ const x=rand()*w,y=rand()*h;
    g.fillStyle=`rgba(120,112,96,${rnd(0.02,0.08)})`; g.fillRect(x,y,rnd(1,3),rnd(1,3)); }
  g.fillStyle='#2c2a26'; g.font='700 30px Georgia, "Times New Roman", serif';
  g.fillText('DEPARTURES', 26, 46);
  g.font='14px Georgia, serif'; g.fillText('TERMINAL No. 4 — IN FORCE FROM 15.09.1986', 26, 70);
  g.strokeStyle='#2c2a26'; g.lineWidth=2; g.beginPath(); g.moveTo(24,82); g.lineTo(w-24,82); g.stroke();
  g.font='15px "Courier New", monospace';
  const dests=['ASHFORD VALE','KINGSBRIDGE','MARLOW CT.','ELSTREE','HARTFIELD','LOWDHAM','BRINDLEY','WESTPORT','AMBERLEY','STANmore'.toUpperCase(),'RIDGEFORD','CALDECOTE'];
  for(let r2=0;r2<10;r2++){ const y=110+r2*19;
    g.fillStyle='#2c2a26';
    g.fillText(`1${rint(0,7)}:${rint(10,59)}  ${pick(dests)}`, 30, y);
    g.fillText(rand()<0.35? 'CANCELLED' : String(rint(1,9)), w-84, y);
    if(rand()<0.3){ g.fillStyle='#7a1f1a'; g.fillText('—', w-40, y); } }
  // water damage bottom
  g.fillStyle='rgba(122,104,74,0.25)';
  g.beginPath(); g.moveTo(0,h);
  for(let x=0;x<=w;x+=24) g.lineTo(x, h-40-Math.abs(fbm(x*0.05,3.2,3))*70);
  g.lineTo(w,h); g.fill();
  // peeled corner: alpha cut
  g.globalCompositeOperation='destination-out';
  g.beginPath(); g.moveTo(w,h); g.lineTo(w-70,h); g.quadraticCurveTo(w-30,h-38,w,h-84); g.closePath(); g.fill();
  g.globalCompositeOperation='source-over';
  g.strokeStyle='rgba(90,80,64,0.5)'; g.beginPath(); g.moveTo(w-70,h); g.quadraticCurveTo(w-34,h-40,w,h-84); g.stroke();
  const t=toTex(cv); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t;
}
/* unlit station clock face */

  g.strokeStyle='#c9c4b4'; g.lineWidth=7; g.beginPath(); g.arc(c,c,c*0.9,0,7); g.stroke();
  g.fillStyle='#c9c4b4'; g.textAlign='center'; g.textBaseline='middle';
  g.font='700 64px Georgia, serif';
  const nums=[['12',0,-0.72],['3',0.72,0],['6',0,0.72],['9',-0.72,0]];
  for(const [n,dx,dy] of nums) g.fillText(n, c+dx*c, c+dy*c);
  for(let i=0;i<60;i++){ const a=i/60*6.28318; const r1=c*0.82,r2=i%5? c*0.86:c*0.78;
    g.strokeStyle='#c9c4b4'; g.lineWidth=i%5?2:4;
    g.beginPath(); g.moveTo(c+Math.sin(a)*r1,c-Math.cos(a)*r1); g.lineTo(c+Math.sin(a)*r2,c-Math.cos(a)*r2); g.stroke(); }
  // hands frozen at 10:47
  const drawHand=(a,len,wid,col)=>{ g.save(); g.translate(c,c); g.rotate(a);
    g.strokeStyle=col; g.lineWidth=wid; g.lineCap='round';
    g.beginPath(); g.moveTo(0,len*0.18); g.lineTo(0,-len); g.stroke(); g.restore(); };
  drawHand((10+47/60)/12*6.28318, c*0.46, 12, '#d8d2c2');
  drawHand(47/60*6.28318, c*0.72, 7, '#d8d2c2');
  g.fillStyle='#d8d2c2'; g.beginPath(); g.arc(c,c,9,0,7); g.fill();
  // aged grime
  for(let i=0;i<40;i++){ const x=rand()*s,y=rand()*s,r=rnd(6,60);

    const p=archPoint(s,new THREE.Vector3()), n=archNormal(s,new THREE.Vector3());

  for(let i=0;i<S_SEGS;i++){
    parts.push(tube(pi[i],pi[i+1],0.11,7), tube(po[i],po[i+1],0.11,7));

function pointInPoly(px,pz,poly){ let inside=false;

    const a=poly[i], b2=poly[j];
    if(((a.z>pz)!==(b2.z>pz)) && (px < (b2.s-a.s)*(pz-a.z)/(b2.z-a.z)+a.s)) inside=!inside;
  } return inside; }

    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWP = (modelMatrix * vec4(transformed,1.0)).xyz;');
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
      varying vec3 vWP;
      uniform sampler2D uPuddle; uniform sampler2D uRefl;
      uniform vec2 uRes; uniform float uTime; uniform float uGust; uniform float uReflOn;
      uniform vec4 uPudBox;
      float puddleAt(vec2 xz){
        vec2 uv=(xz-uPudBox.xy)/uPudBox.zw;
        uv=clamp(uv,0.001,0.999);
        return texture2D(uPuddle,uv).r;
      }`)
    .replace('#include <map_fragment>', `#include <map_fragment>
      float pud = puddleAt(vWP.xz);
      diffuseColor.rgb *= 1.0 - 0.45*pud;`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, 0.10, pud);`)
    .replace('#include <tonemapping_fragment>', `#include <tonemapping_fragment>
      {
        float fres = pow(1.0 - max(dot(normal, normalize(- (viewMatrix*vec4(vWP,1.0)).xyz)),0.0), 3.0);
        vec2 rip = vec2(
          sin(vWP.x*6.0+uTime*1.7)+0.5*sin(vWP.z*4.3+uTime*0.8),
          cos(vWP.z*5.5+uTime*1.3)+0.5*sin(vWP.x*3.7-uTime*1.15)

        vec2 suv = gl_FragCoord.xy/uRes + rip;
        vec3 refl = texture2D(uRefl, clamp(suv,0.001,0.999)).rgb;
        refl *= 0.8 + 0.2*fres;
        float mixAmt = pud * (0.10 + 0.90*fres) * 0.8 * smoothstep(0.05,0.35,pud);
        gl_FragColor.rgb = mix(gl_FragColor.rgb, refl, mixAmt);
      }`);
};

function pip(px,pz,poly){ let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i], b2=poly[j];
    if(((a.z>pz)!==(b2.z>pz)) && (px < (b2.s-a.s)*(pz-a.z)/(b2.z-a.z)+a.s)) inside=!inside;
  } return inside; }

/* ---------- deterministic spawn set (rain only through holes) ---------- */
const RAIN_N = 22000;

{ const _v=new THREE.Vector3();
  let k=0;
  const areas=bayHoles.map(h=>(h.xMax-h.xMin)*(h.zMax-h.zMin));
  const areaSum=areas.reduce((a,b)=>a+b,0);
  for(let hi=0; hi<bayHoles.length; hi++){
    const h=bayHoles[hi];
    const nThis = hi===bayHoles.length-1 ? RAIN_N-k : Math.floor(RAIN_N*areas[hi]/areaSum);
    let placed=0, guard=0;
    while(placed<nThis && k<RAIN_N && guard<nThis*40){
      guard++;
      const s=rnd(0.24,0.76), z=rnd(h.zMin,h.zMax);
      if(!pip(s,z,h.pts)) continue;
      archPoint(s,_v);
      spawnX[k]=_v.x; spawnZ[k]=z;
      spawnY0[k]=_v.y+rnd(0.1,1.2);
      spawnY1[k]=floorH(_v.x,z)+0.02;
      k++; placed++;
    }
  }

/* ---------- gust engine (fixed-step smoothed) ---------- */
const gust = {
  u:0, target:0, wave:-1, waveT:0, first:18, period:56, dur:7.5,
  step(h, sceneT){
    let env=0;
    if(sceneT>=this.first){
      const local=(sceneT-this.first)%this.period;
      if(local<this.dur) env=Math.pow(Math.sin(Math.PI*local/this.dur),1.6);
    }
    this.target=env;
    this.u += (this.target-this.u)*Math.min(1, 6.0*h);
    if(env>0.05){ this.waveT+=h*0.55; this.wave=this.waveT%1.4; }
    else { this.wave=-1; this.waveT=0; }
  },
  wind(sceneT){
    return 0.22*Math.sin(sceneT*0.23)+0.14*Math.sin(sceneT*0.113+2.0)+0.05*Math.sin(sceneT*0.47+1.0);
  }
};

/* ============================================================
   PROCEDURAL SOUND — roof rain, metal drips, room resonance
   ============================================================ */
const Sound = {
  ctx:null, master:null, on:false, rev:null, g1:null, g2:null, gRm:null,
  dripTimer:null, arng:mulberry32(99),
  init(){
    if(this.ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    const ctx=new AC(); this.ctx=ctx;
    const master=ctx.createGain(); master.gain.value=0.0001; this.master=master;
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-20; comp.knee.value=14; comp.ratio.value=4; comp.attack.value=0.004; comp.release.value=0.25;
    master.connect(comp); comp.connect(ctx.destination);
    // spacious hall IR (procedural)
    const conv=ctx.createConvolver();
    const sr=ctx.sampleRate, len=(sr*2.8)|0;
    const ir=ctx.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){
      const d=ir.getChannelData(ch); let lp=0;
      for(let i=0;i<len;i++){
        const t=i/len;
        const n=(this.arng()*2-1)*Math.pow(1-t,2.3);
        lp+=(n-lp)*0.10;
        d[i]=(lp*0.75+n*0.25)*(t<0.002?0.2:1);
      }
    }
    conv.buffer=ir; this.rev=conv;
    const revG=ctx.createGain(); revG.gain.value=0.55; conv.connect(revG); revG.connect(master);

    // pinkish noise bed
    const nb=ctx.createBuffer(1,sr*4,sr); const nd=nb.getChannelData(0);
    let b0=0,b1=0,b2=0;
    for(let i=0;i<nd.length;i++){ const w=this.arng()*2-1;
      b0+= (w-b0)*0.02; b1+=(w-b1)*0.1; b2+=(w-b2)*0.4;
      nd[i]=(b0*0.7+b1*0.2+b2*0.1)*2.2; }
    const mkSrc=()=>{ const s=ctx.createBufferSource(); s.buffer=nb; s.loop=true; s.start(); return s; };

    // patter on the roof
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1150; bp.Q.value=0.55;
    const g1=ctx.createGain(); g1.gain.value=0.10; this.g1=g1;
    mkSrc().connect(bp); bp.connect(g1); g1.connect(master);
    const s1=ctx.createGain(); s1.gain.value=0.5; g1.connect(s1); s1.connect(conv);
    const lfo=ctx.createOscillator(); lfo.frequency.value=0.13;
    const lfoG=ctx.createGain(); lfoG.gain.value=160; lfo.connect(lfoG); lfoG.connect(bp.frequency); lfo.start();

    // low rumble in the roof pockets
    const lp1=ctx.createBiquadFilter(); lp1.type='lowpass'; lp1.frequency.value=320; lp1.Q.value=0.4;
    const g2=ctx.createGain(); g2.gain.value=0.075; this.g2=g2;
    mkSrc().connect(lp1); lp1.connect(g2); g2.connect(master);

    // room resonance: detained low sines + sub noise, drenched in reverb
    const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=47;
    const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=61.4;
    const gRm=ctx.createGain(); gRm.gain.value=0.035; this.gRm=gRm;
    const gRm2=ctx.createGain(); gRm2.gain.value=0.022;
    o1.connect(gRm); o2.connect(gRm2);
    gRm.connect(master); gRm.connect(conv); gRm2.connect(conv);
    const lfo2=ctx.createOscillator(); lfo2.frequency.value=0.055;
    const lfo2G=ctx.createGain(); lfo2G.gain.value=0.018;
    lfo2.connect(lfo2G); lfo2G.connect(gRm.gain); lfo2.start();
    o1.start(); o2.start();
    const lp2=ctx.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=110;
    const gSub=ctx.createGain(); gSub.gain.value=0.05;
    mkSrc().connect(lp2); lp2.connect(gSub); gSub.connect(conv); gSub.connect(master);

    const self=this;
    this.drip=function(){
      if(!self.ctx||!self.on) return;
      const t=ctx.currentTime, r=self.arng;
      const o=ctx.createOscillator(); o.type='sine';
      const f=1500+r()*1700;
      o.frequency.setValueAtTime(f,t);
      o.frequency.exponentialRampToValueAtTime(f*0.42,t+0.07);
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.14+r()*0.06,t+0.003);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      const bq=ctx.createBiquadFilter(); bq.type='bandpass';
      bq.frequency.value=2200+r()*1600; bq.Q.value=2.6;
      o.connect(bq); bq.connect(g);
      g.connect(master);
      const gs=ctx.createGain(); gs.gain.value=0.8; g.connect(gs); gs.connect(conv);
      o.start(t); o.stop(t+0.2);
      // short metallic ring (bucket / gutter strike)
      if(r()<0.6){
        const o3=ctx.createOscillator(); o3.type='triangle';
        const f3=f*2.76+r()*300;
        o3.frequency.setValueAtTime(f3,t+0.002);
        const g3=ctx.createGain();
        g3.gain.setValueAtTime(0.0001,t+0.002);
        g3.gain.exponentialRampToValueAtTime(0.03,t+0.006);
        g3.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
        o3.connect(g3); g3.connect(conv); g3.connect(master);
        o3.start(t+0.002); o3.stop(t+0.35);
      }
      self.dripTimer=setTimeout(()=>self.drip(), (320+r()*1500));
    };
  },
  enable(){
    this.init();
    if(this.ctx.state==='suspended') this.ctx.resume();
    this.on=true;
    this.master.gain.setTargetAtTime(0.5, this.ctx.currentTime, 0.6);
    if(this.dripTimer==null) this.drip();
  },
  disable(){
    if(!this.ctx) return;
    this.on=false;
    this.master.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.4);
    if(this.dripTimer!=null){ clearTimeout(this.dripTimer); this.dripTimer=null; }
  },
  setGust(u){
    if(!this.ctx||!this.on) return;
    this.g1.gain.setTargetAtTime(0.10+0.07*u, this.ctx.currentTime, 0.5);
    this.g2.gain.setTargetAtTime(0.075+0.05*u, this.ctx.currentTime, 0.5);
  }
};

/* ============================================================
   CAMERA · UI · LOOP · ADAPTIVE QUALITY
   ============================================================ */
const lookTarget = new THREE.Vector3(0.4, 3.5, 40);
const _cp=new THREE.Vector3(), _ct=new THREE.Vector3(), _mp=new THREE.Vector3();

const camCtl = {
  mode:'cine', cineClock:0, blendA:0,
  pivot:new THREE.Vector3(0.4,3.5,40),
  yaw:0, pitch:0.02, dist:30, yawT:0, pitchT:0.02, distT:30,
  dragging:false, lastX:0, lastY:0, pointers:new Map(), pinch0:0, pinchD0:0,
};
function cinePose(outPos,outTgt,t){
  const ping=0.5-0.5*Math.cos((t/140)*Math.PI*2);
  outPos.set(0.5+Math.sin(t*0.045)*2.3, 3.05+Math.sin(t*0.028+1)*0.28, 1.2+56*ping);
  outTgt.set(outPos.x*0.25+0.35, 3.3+Math.sin(t*0.02)*0.3, outPos.z+45);
}
function clampCam(p){
  p.x=THREE.MathUtils.clamp(p.x,-12.6,12.6);
  p.y=THREE.MathUtils.clamp(p.y,1.25,12.5);
  p.z=THREE.MathUtils.clamp(p.z,0.5,113.5);
}
function manualPose(out){
  const c=camCtl;
  out.set(
    c.pivot.x + Math.sin(c.yaw)*Math.cos(c.pitch)*c.dist,
    c.pivot.y + Math.sin(c.pitch)*c.dist,
    c.pivot.z + Math.cos(c.yaw)*Math.cos(c.pitch)*c.dist
  );
  clampCam(out);
}
function engageManual(){
  if(camCtl.mode==='manual') return;
  camCtl.pivot.copy(lookTarget);
  const d=camera.position.clone().sub(camCtl.pivot);
  const L=THREE.MathUtils.clamp(d.length(),6,70);
  camCtl.dist=camCtl.distT=L;
  camCtl.yaw=camCtl.yawT=Math.atan2(d.x,d.z);
  camCtl.pitch=camCtl.pitchT=THREE.MathUtils.clamp(Math.asin(THREE.MathUtils.clamp(d.y/L,-1,1)),-0.05,0.9);
  camCtl.mode='manual';
  bCine.classList.remove('on');
}
function updateCamera(dt){
  const c=camCtl;
  c.cineClock+=dt;
  cinePose(_cp,_ct,c.cineClock);
  if(c.mode==='cine'){
    camera.position.copy(_cp); lookTarget.copy(_ct);
  } else if(c.mode==='manual'){
    const k=1-Math.exp(-6*dt);
    c.yaw+=(c.yawT-c.yaw)*k; c.pitch+=(c.pitchT-c.pitch)*k; c.dist+=(c.distT-c.dist)*k;
    manualPose(_mp);
    camera.position.copy(_mp);
    lookTarget.lerp(c.pivot,k);
  } else { // blend back to cinematic
    const k=1-Math.exp(-6*dt);
    c.yaw+=(c.yawT-c.yaw)*k; c.pitch+=(c.pitchT-c.pitch)*k; c.dist+=(c.distT-c.dist)*k;
    manualPose(_mp);
    c.blendA=Math.min(1,c.blendA+dt/2.2);
    const a=c.blendA*c.blendA*(3-2*c.blendA);
    camera.position.lerpVectors(_mp,_cp,a);
    lookTarget.lerpVectors(c.pivot,_ct,a);
    if(c.blendA>=1){ c.mode='cine'; bCine.classList.add('on'); }
  }
  camera.lookAt(lookTarget);
}

/* ---------- pointer / wheel / touch input ---------- */
const dom=renderer.domElement;
dom.addEventListener('pointerdown',(e)=>{
  camCtl.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(camCtl.pointers.size===1){ camCtl.dragging=true; camCtl.lastX=e.clientX; camCtl.lastY=e.clientY; }
  if(camCtl.pointers.size===2){
    const p=[...camCtl.pointers.values()];
    camCtl.pinchD0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); camCtl.pinch0=camCtl.distT;
  }
  activity();
});
dom.addEventListener('pointermove',(e)=>{
  if(camCtl.pointers.has(e.pointerId)) camCtl.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(camCtl.pointers.size===2){
    const p=[...camCtl.pointers.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(camCtl.pinchD0>0){ engageManual();
      camCtl.distT=THREE.MathUtils.clamp(camCtl.pinch0*(camCtl.pinchD0/Math.max(d,1)),6,70); }
    return;
  }
  if(camCtl.dragging){
    const dx=e.clientX-camCtl.lastX, dy=e.clientY-camCtl.lastY;
    if(Math.abs(dx)+Math.abs(dy)>1){
      engageManual();
      camCtl.yawT -= dx*0.0034;
      camCtl.pitchT = THREE.MathUtils.clamp(camCtl.pitchT + dy*0.0026, -0.05, 0.9);
    }
    camCtl.lastX=e.clientX; camCtl.lastY=e.clientY;
  }
  activity();
});
window.addEventListener('pointerup',(e)=>{ camCtl.pointers.delete(e.pointerId); camCtl.dragging=false; });
window.addEventListener('pointercancel',(e)=>{ camCtl.pointers.delete(e.pointerId); camCtl.dragging=false; });
dom.addEventListener('wheel',(e)=>{
  e.preventDefault();
  engageManual();
  camCtl.distT=THREE.MathUtils.clamp(camCtl.distT*Math.exp(e.deltaY*0.0012),6,70);
  activity();
},{passive:false});
dom.style.touchAction='none';

/* ---------- UI ---------- */
const ui=document.getElementById('ui');
const bCine=document.getElementById('bCine'), bReset=document.getElementById('bReset'),
      bPause=document.getElementById('bPause'), bSound=document.getElementById('bSound');
let lastAct=performance.now();
function activity(){
  lastAct=performance.now();
  ui.classList.remove('faded');
}
window.addEventListener('keydown',(e)=>{
  activity();
  const k=e.key.toLowerCase();
  if(k==='c') bCine.click();
  else if(k==='r') bReset.click();
  else if(k==='p') bPause.click();
  else if(k==='m') bSound.click();
});
window.addEventListener('focusin',activity);
window.addEventListener('pointermove',activity,{passive:true});
window.addEventListener('pointerdown',activity,{passive:true});
bCine.addEventListener('click',()=>{
  if(camCtl.mode!=='cine'){ camCtl.mode='blend'; camCtl.blendA=0; }
  bCine.classList.add('on');
});
bReset.addEventListener('click',()=>{
  camCtl.cineClock=0;
  camCtl.mode='blend'; camCtl.blendA=0;
  bCine.classList.add('on');
});
let paused=false;
bPause.addEventListener('click',()=>{
  paused=!paused;
  bPause.textContent=paused?'Resume':'Pause';
  bPause.classList.toggle('on',paused);
});
let soundOn=false;
bSound.addEventListener('click',()=>{
  soundOn=!soundOn;
  if(soundOn) Sound.enable(); else Sound.disable();
  bSound.classList.toggle('on',soundOn);
  bSound.textContent=soundOn?'Sound on':'Sound';
});

/* ---------- resize ---------- */
function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  const db=renderer.getDrawingBufferSize(new THREE.Vector2());
  floorUniforms.uRes.value.set(db.x,db.y);
}
window.addEventListener('resize',onResize);
onResize();

/* ---------- mirror camera for planar puddle reflections ---------- */
const mirrorCam=new THREE.PerspectiveCamera();
mirrorCam.matrixWorldAutoUpdate=true;
let reflHide=null, frameNo=0;
function renderReflection(){
  if(qLevel>=4) return;
  if((frameNo++ & 1)===1) return;            // every other frame — budgeted
  const PY=0.02;
  const cp=camera.position, lt=lookTarget;
  mirrorCam.position.set(cp.x, 2*PY-cp.y, cp.z);
  mirrorCam.up.set(0,-1,0);
  mirrorCam.lookAt(lt.x, 2*PY-lt.y, lt.z);
  mirrorCam.near=camera.near; mirrorCam.far=camera.far;
  mirrorCam.projectionMatrix.copy(camera.projectionMatrix);
  mirrorCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
  mirrorCam.updateMatrixWorld(true);
  if(!reflHide){
    reflHide=[window.__floor, window.__rings, window.__rainMesh, window.__shafts];
    scene.traverse(o=>{ if(o.name==='droplets'||o.name==='sheet') reflHide.push(o); });
  }
  const prev=reflHide.map(o=>o.visible);
  reflHide.forEach(o=>{ o.visible=false; });
  renderer.setRenderTarget(reflRT);
  renderer.clear();
  renderer.render(scene,mirrorCam);
  renderer.setRenderTarget(null);
  reflHide.forEach((o,i)=>{ o.visible=prev[i]; });
}

/* ---------- adaptive quality ladder ---------- */
let qLevel=0, emaMs=16.7, slow=0;
function applyQ(){
  if(qLevel===1) reflRT.setSize(512,256);
  else if(qLevel===2){ DPR_CAP=1.2; renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,DPR_CAP)); onResize(); }
  else if(qLevel===3){ rainMesh.geometry.instanceCount=Math.floor(RAIN_N*0.55);
    window.__rings.geometry.instanceCount=300; }
  else if(qLevel>=4){ floorUniforms.uReflOn.value=0; }
}
function adaptive(dt){
  emaMs+=(dt*1000-emaMs)*0.04;
  if(emaMs>32) slow++; else slow=Math.max(0,slow-2);
  if(slow>120 && qLevel<4){ qLevel++; slow=0; applyQ(); }
}

/* ---------- fixed-step simulation + main loop ---------- */
const SIM_H=1/120;
let simAcc=0, sceneTime=0, last=performance.now(), firstFrame=true, soundTick=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!paused) sceneTime+=dt;
  simAcc+=dt;
  let guard=0;
  while(simAcc>=SIM_H && guard<8){ simAcc-=SIM_H; guard++; gust.step(SIM_H, sceneTime); }
  if(simAcc>SIM_H) simAcc=0;

  const st=sceneTime, g=gust.u;
  rainU.uTime.value=st; rainU.uGust.value=g; rainU.uWind.value=gust.wind(st);
  ringU.uTime.value=st;
  for(const so of sheetObjs){
    so.u.uTime.value=st; so.u.uGust.value=g;
    const dz=Math.abs(camera.position.z - so.mesh.position.z);
    const near=THREE.MathUtils.clamp((dz-2.2)/5,0,1);
    const isClock=(so===clockSheet);
    so.u.uFade.value=near*(isClock?1-0.55*g:1);
    if(isClock) so.u.uReveal.value=g*7.5;
  }
  shaftU.uTime.value=st; shaftU.uGust.value=g;
  streamU.uTime.value=st; streamU.uGust.value=g;
  chainU.uTime.value=st; chainU.uWave.value=gust.wave; chainU.uGust.value=g;
  floorUniforms.uTime.value=st; floorUniforms.uGust.value=g;
  if(window.__weedTime){ window.__weedTime.value=st; window.__weedGust.value=g; }
  warm.intensity=26+Math.sin(st*0.8)*1.4+Math.sin(st*2.31+1.7)*0.7;
  soundTick+=dt;
  if(soundTick>0.3){ soundTick=0; Sound.setGust(g); }

  updateCamera(dt);
  renderReflection();
  renderer.render(scene,camera);

  if(firstFrame){
    firstFrame=false;
    renderer.shadowMap.autoUpdate=false;
    renderer.shadowMap.needsUpdate=false;
    document.getElementById('loading').classList.add('done');
  }
  if(now-lastAct>6000) ui.classList.add('faded');
  adaptive(dt);
}
requestAnimationFrame(frame);
window.__dbg={ camera, scene, renderer, rainMesh, gust, floorUniforms, camCtl,
  stats:()=>({calls:renderer.info.render.calls, tris:renderer.info.render.triangles}) };

</script>
</body>
