<script type="module">

import * as THREE from 'three';

/* ================= CONSTANTS ================= */
const LOOP = 24;                    // seconds, seamless master loop
const TAU = Math.PI * 2;
const WATER_Y = 0.06;
const POND = { x: -1.8, z: 2.4, r: 1.3 };
const PLAZA = { x: 0, z: 0, r: 2.25 };
const SUN_DIR = new THREE.Vector3(-0.8, 0.42, -0.45).normalize();

/* ================= NOISE ================= */
function hash2(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return n - Math.floor(n); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, oct = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= 0.5; } return s; }
function srand(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ================= CANVAS TEXTURE HELPERS ================= */
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h || w; return [c, c.getContext('2d')]; }
function toTex(c, { srgb = true, rx = 1, ry = 1 } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = 8; return t;
}
function texWood(base = '#7a4f2c', dark = '47,28,12') {
  const [c, g] = cnv(256); g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1100; i++) {
    const x = Math.random() * 256, w = 0.5 + Math.random() * 1.6, a = 0.03 + Math.random() * 0.09;
    g.strokeStyle = `rgba(${dark},${a})`; g.lineWidth = w; g.beginPath(); g.moveTo(x, 0);
    let y = 0, cx = x; while (y < 256) { y += 12 + Math.random() * 20; cx += (Math.random() - 0.5) * 5; g.lineTo(cx, y); } g.stroke();
  }
  for (let i = 0; i < 6; i++) { const x = Math.random() * 256, y = Math.random() * 256;
    const gr = g.createRadialGradient(x, y, 1, x, y, 7 + Math.random() * 6);
    gr.addColorStop(0, 'rgba(35,20,8,.55)'); gr.addColorStop(1, 'rgba(35,20,8,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, 10, 5, Math.random(), 0, TAU); g.fill(); }
  return toTex(c);
}
function texTile() {
  const [c, g] = cnv(256); g.fillStyle = '#2f3542'; g.fillRect(0, 0, 256, 256);
  for (let x = 0; x < 256; x += 24) {
    g.fillStyle = 'rgba(8,10,14,.6)'; g.fillRect(x, 0, 3, 256);
    g.fillStyle = 'rgba(130,142,162,.14)'; g.fillRect(x + 4, 0, 2, 256);
  }
  for (let y = 0; y < 256; y += 32) { g.fillStyle = 'rgba(6,8,12,.3)'; g.fillRect(0, y, 256, 1.5); }
  for (let i = 0; i < 40; i++) { const x = Math.random() * 256, y = Math.random() * 256;
    g.fillStyle = `rgba(${60 + Math.random() * 30},${62 + Math.random() * 30},${72},${0.04 + Math.random() * 0.07})`;
    g.fillRect(x, y, 1 + Math.random() * 3, 20 + Math.random() * 50); }
  for (let i = 0; i < 40; i++) { const x = Math.random() * 256, y = 120 + Math.random() * 136;
    g.fillStyle = `rgba(70,90,55,${0.05 + Math.random() * 0.12})`;
    g.beginPath(); g.ellipse(x, y, 2 + Math.random() * 5, 1 + Math.random() * 3, 0, 0, TAU); g.fill(); }
  const [bc, bg] = cnv(256); bg.fillStyle = '#808080'; bg.fillRect(0, 0, 256, 256);
  for (let x = 0; x < 256; x += 24) { bg.fillStyle = '#2a2a2a'; bg.fillRect(x, 0, 3, 256); bg.fillStyle = '#c8c8c8'; bg.fillRect(x + 4, 0, 2, 256); }
  for (let y = 0; y < 256; y += 32) { bg.fillStyle = '#555'; bg.fillRect(0, y, 256, 1.5); }
  return { map: toTex(c), bump: toTex(bc, { srgb: false }) };
}
function texStone() {
  const [c, g] = cnv(256); g.fillStyle = '#96948c'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5000; i++) { const v = 110 + Math.random() * 90;
    g.fillStyle = `rgba(${v},${v - 4},${v - 14},${0.12 + Math.random() * 0.2})`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 2); }
  for (let i = 0; i < 14; i++) { g.strokeStyle = 'rgba(60,58,52,.35)'; g.lineWidth = 0.8; g.beginPath();
    let x = Math.random() * 256, y = Math.random() * 256; g.moveTo(x, y);
    for (let j = 0; j < 6; j++) { x += (Math.random() - 0.5) * 40; y += (Math.random() - 0.5) * 40; g.lineTo(x, y); } g.stroke(); }
  for (let i = 0; i < 30; i++) { const x = Math.random() * 256, y = 100 + Math.random() * 156;
    g.fillStyle = `rgba(85,105,60,${0.06 + Math.random() * 0.14})`;
    g.beginPath(); g.ellipse(x, y, 3 + Math.random() * 7, 2 + Math.random() * 4, 0, 0, TAU); g.fill(); }
  return toTex(c);
}
function texPlaster() {
  const [c, g] = cnv(256); g.fillStyle = '#e3d9c2'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3000; i++) { const v = 190 + Math.random() * 45;
    g.fillStyle = `rgba(${v},${v - 8},${v - 24},.18)`; g.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5); }
  for (let i = 0; i < 24; i++) { g.fillStyle = 'rgba(120,95,60,.12)';
    g.fillRect(0, Math.random() * 256, 256, 1 + Math.random() * 2); }
  return toTex(c);
}
function texShoji() {
  const [c, g] = cnv(128); g.fillStyle = '#f7ecd2'; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 800; i++) { g.fillStyle = 'rgba(210,190,150,.10)'; g.fillRect(Math.random() * 128, Math.random() * 128, 1, 1); }
  g.strokeStyle = 'rgba(120,85,45,.5)'; g.lineWidth = 1.5;
  for (let x = 0; x <= 128; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 128); g.stroke(); }
  for (let y = 0; y <= 128; y += 42) { g.beginPath(); g.moveTo(0, y); g.lineTo(128, y); g.stroke(); }
  return toTex(c);
}
function texPlaque() {
  const [c, g] = cnv(128, 96); g.fillStyle = '#6d1a12'; g.fillRect(0, 0, 128, 96);
  g.strokeStyle = '#c9a24a'; g.lineWidth = 4; g.strokeRect(6, 6, 116, 84);
  g.strokeStyle = '#d8b45e'; g.lineCap = 'round';
  const stroke = (x1, y1, x2, y2, w) => { g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1);
    g.quadraticCurveTo((x1 + x2) / 2 + 3, (y1 + y2) / 2 - 4, x2, y2); g.stroke(); };
  stroke(34, 26, 34, 70, 6); stroke(20, 38, 50, 38, 5); stroke(24, 54, 46, 54, 4);
  stroke(64, 24, 64, 44, 5); stroke(56, 30, 74, 30, 4); stroke(52, 48, 78, 48, 6);
  stroke(96, 26, 96, 72, 5); stroke(88, 40, 106, 40, 4); stroke(90, 58, 104, 58, 4); stroke(84, 70, 110, 70, 6);
  return toTex(c);
}
function texBlade() {
  const [c, g] = cnv(64, 128); g.clearRect(0, 0, 64, 128);
  const gr = g.createLinearGradient(0, 128, 0, 0); gr.addColorStop(0, '#3f5c26'); gr.addColorStop(1, '#8fae56');
  g.fillStyle = gr; g.beginPath(); g.moveTo(32, 128);
  g.quadraticCurveTo(6, 70, 30, 4); g.quadraticCurveTo(58, 70, 32, 128); g.fill();
  return toTex(c);
}
function texBlossom() {
  const [c, g] = cnv(128); g.clearRect(0, 0, 128, 128);
  const petal = (x, y, r, rot) => {
    g.save(); g.translate(x, y); g.rotate(rot);
    const gr = g.createRadialGradient(0, -r * 0.4, 0.5, 0, 0, r);
    gr.addColorStop(0, 'rgba(255,250,252,.98)'); gr.addColorStop(0.6, 'rgba(250,166,196,.9)'); gr.addColorStop(1, 'rgba(228,120,160,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, r * 0.55, r, 0, 0, TAU); g.fill(); g.restore();
  };
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * TAU, r = Math.random() * 40, x = 64 + Math.cos(a) * r, y = 64 + Math.sin(a) * r;
    const pr = 7 + Math.random() * 7;
    for (let k = 0; k < 5; k++) petal(x, y, pr, k / 5 * TAU + Math.random());
  }
  return toTex(c);
}
function texPetal() {
  const [c, g] = cnv(64); g.clearRect(0, 0, 64, 64);
  const gr = g.createLinearGradient(0, 60, 0, 8); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#ffc4d6');
  g.fillStyle = gr; g.beginPath(); g.moveTo(32, 58);
  g.bezierCurveTo(2, 44, 6, 14, 30, 6); g.bezierCurveTo(34, 2, 38, 4, 40, 8);
  g.bezierCurveTo(58, 16, 60, 44, 32, 58); g.fill();
  return toTex(c);
}
function texGlow() {
  const [c, g] = cnv(128); const gr = g.createRadialGradient(64, 64, 2, 64, 64, 62);
  gr.addColorStop(0, 'rgba(255,225,175,.95)'); gr.addColorStop(0.35, 'rgba(255,180,100,.38)'); gr.addColorStop(1, 'rgba(255,160,80,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return toTex(c);
}
function texBlob() {
  const [c, g] = cnv(128); const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  gr.addColorStop(0, 'rgba(0,0,0,.85)'); gr.addColorStop(0.55, 'rgba(0,0,0,.38)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return toTex(c, { srgb: false });
}
function texWaterNormal() {
  const N = 256, [c, g] = cnv(N); const img = g.createImageData(N, N);
  const H = (x, y) => fbm(x * 0.055, y * 0.055, 3) * 2 + fbm(x * 0.17, y * 0.17, 2);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = H(x + 1, y) - H(x - 1 + N, y) * 0 - (H((x - 1 + N) % N, y)) , dy = H(x, (y + 1) % N) - H(x, (y - 1 + N) % N);
    let nx = -dx * 2.2, ny = -dy * 2.2, nz = 1; const l = Math.hypot(nx, ny, nz);
    const i = (y * N + x) * 4;
    img.data[i] = (nx / l * 0.5 + 0.5) * 255; img.data[i + 1] = (ny / l * 0.5 + 0.5) * 255;
    img.data[i + 2] = (nz / l * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = toTex(c, { srgb: false }); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

/* ================= RENDERER / SCENE ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const world = new THREE.Group();          // bobs gently
scene.add(world);

/* environment map for PBR reflections */
{
  const [c, g] = cnv(1024, 512);
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#4d7ec4'); gr.addColorStop(0.42, '#a7c6e8'); gr.addColorStop(0.5, '#efe3c8');
  gr.addColorStop(0.55, '#8a8471'); gr.addColorStop(1, '#4a4436');
  g.fillStyle = gr; g.fillRect(0, 0, 1024, 512);
  const az = Math.atan2(SUN_DIR.z, SUN_DIR.x), u = (az / TAU + 0.5) * 1024, v = (0.5 - SUN_DIR.y * 0.42) * 512;
  const sg = g.createRadialGradient(u, v, 4, u, v, 150);
  sg.addColorStop(0, 'rgba(255,240,210,1)'); sg.addColorStop(0.25, 'rgba(255,190,120,.55)'); sg.addColorStop(1, 'rgba(255,180,110,0)');
  g.fillStyle = sg; g.beginPath(); g.arc(u, v, 150, 0, TAU); g.fill();
  const t = toTex(c); t.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(t).texture;
  pmrem.dispose();
}

/* lights */
const sun = new THREE.DirectionalLight(0xffc07f, 3.6);
sun.position.copy(SUN_DIR).multiplyScalar(34);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 80;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.025;
scene.add(sun); scene.add(sun.target);
scene.add(new THREE.HemisphereLight(0x93b3e4, 0x6f5b40, 0.5));
scene.add(new THREE.AmbientLight(0x7c93bf, 0.10));
const bounce = new THREE.DirectionalLight(0xbcd2f2, 0.3);
bounce.position.set(8, 4, 9); scene.add(bounce);

/* ================= MATERIALS ================= */
const woodTex = texWood('#7a4f2c'); woodTex.repeat.set(3, 3);
const woodDarkTex = texWood('#57381f', '30,17,6'); woodDarkTex.repeat.set(3, 3);
const tileT = texTile();
const stoneTex = texStone();
const T = {
  wood:  new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.72, metalness: 0.02 }),
  darkWood: new THREE.MeshStandardMaterial({ map: woodDarkTex, roughness: 0.66, metalness: 0.02 }),
  tile:  new THREE.MeshStandardMaterial({ map: tileT.map, bumpMap: tileT.bump, bumpScale: 0.25, roughness: 0.82, metalness: 0.0, color: 0xa9b3c6 }),
  vermilion: new THREE.MeshStandardMaterial({ color: 0xb8422a, roughness: 0.55, metalness: 0.05, map: woodTex }),
  vermilionDark: new THREE.MeshStandardMaterial({ color: 0x8c2718, roughness: 0.6, map: woodDarkTex }),
  gold:  new THREE.MeshStandardMaterial({ color: 0xc8a24c, roughness: 0.32, metalness: 0.9 }),
  stone: new THREE.MeshStandardMaterial({ map: stoneTex, color: 0x8f8d84, roughness: 0.92, metalness: 0.02 }),
  plaster: new THREE.MeshStandardMaterial({ map: texPlaster(), color: 0xcfc4ab, roughness: 0.85 }),
  shoji: new THREE.MeshStandardMaterial({ map: texShoji(), emissive: 0xffa94f, emissiveIntensity: 1.5, roughness: 0.55 }),
  glowTex: texGlow(),
  blobTex: texBlob(),
  petalTex: texPetal(),
  blossomTex: texBlossom(),
  bladeTex: texBlade(),
  waterNormal: texWaterNormal(),
};
T.blossom = new THREE.MeshStandardMaterial({ map: T.blossomTex, alphaTest: 0.35, side: THREE.DoubleSide, roughness: 0.85 });
T.petal = new THREE.MeshStandardMaterial({ map: T.petalTex, alphaTest: 0.4, side: THREE.DoubleSide, roughness: 0.8, emissive: 0x412a24, emissiveIntensity: 0.25 });
T.blade = new THREE.MeshStandardMaterial({ map: T.bladeTex, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.9 });

const blobGeo = new THREE.PlaneGeometry(1, 1);
function makeBlob(w, d, op = 0.4, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(blobGeo, new THREE.MeshBasicMaterial({
    map: T.blobTex, transparent: true, opacity: op, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
  m.rotation.x = -Math.PI / 2; m.scale.set(w, d, 1); m.position.set(x, y, z);
  m.renderOrder = 1; return m;
}
function addGlow(parent, x, y, z, size, color = 0xffb066, op = 0.85) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: T.glowTex, color, transparent: true, opacity: op,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  s.position.set(x, y, z); s.scale.setScalar(size); parent.add(s); return s;
}

/* wind shader hook */
const windShaders = [];
function windify(mat, amp = 0.05) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uPhase = { value: 0 };
    sh.vertexShader = 'uniform float uPhase;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       #ifdef USE_INSTANCING
         float wOff = instanceMatrix[3][0]*2.1 + instanceMatrix[3][2]*1.7;
       #else
         float wOff = 0.0;
       #endif
       float wA = uv.y * ${amp.toFixed(3)};
       transformed.x += sin(uPhase*2.0 + wOff + position.y*4.0) * wA;
       transformed.z += cos(uPhase*1.7 + wOff*1.3) * wA * 0.6;`);
    mat.userData.shader = sh; windShaders.push(sh);
  };
}

/* ================= CAMERA + CONTROLS ================= */
const VIEW_H = 9.8;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 900);
const camDefault = { az: Math.PI / 4, el: Math.PI / 6, zoom: 1.0 };
const cam = { az: camDefault.az, el: camDefault.el, zoom: 1,
              tAz: camDefault.az, tEl: camDefault.el, tZoom: 1 };
const camTarget = new THREE.Vector3(0, 1.35, 0);
let cine = false;

function layoutCamera() {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -VIEW_H * a / 2; camera.right = VIEW_H * a / 2;
  camera.top = VIEW_H / 2; camera.bottom = -VIEW_H / 2;
  camera.updateProjectionMatrix();
  layoutSky();
}
function applyCamera() {
  camera.zoom = cam.zoom;
  const R = 60;
  camera.position.set(
    camTarget.x + R * Math.cos(cam.el) * Math.sin(cam.az),
    camTarget.y + R * Math.sin(cam.el),
    camTarget.z + R * Math.cos(cam.el) * Math.cos(cam.az));
  camera.up.set(0, 1, 0);
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}

/* ================= SKY ================= */
const skyMat = new THREE.ShaderMaterial({

/* ================= ISLAND (single connected mesh) ================= */
function heightAt(x, z) {
  let h = 0.16 + (fbm(x * 0.32 + 13.7, z * 0.32 + 7.3, 4) - 0.5) * 1.05;
  h += 0.12 * Math.sin(x * 0.34 + 1.2) * Math.cos(z * 0.3 - 0.6);
  const dp = Math.hypot(x - PLAZA.x, z - PLAZA.z);
  h = THREE.MathUtils.lerp(0.34, h, THREE.MathUtils.smoothstep(dp, PLAZA.r - 0.55, PLAZA.r + 1.15));
  const dq = Math.hypot(x - POND.x, z - POND.z);
  h = THREE.MathUtils.lerp(-0.62, h, THREE.MathUtils.smoothstep(dq, POND.r - 0.2, POND.r + 0.62));
  return h;
}
function islandRadius(a) { return 4.55 + (fbm(Math.cos(a) * 1.7 + 5, Math.sin(a) * 1.7 + 9, 3) - 0.5) * 1.45; }

function buildIsland() {
  const NA = 150, JT = 30, KB = 18;
  const P = [], C = [], I = [];
  const R = new Float32Array(NA), YE = new Float32Array(NA), HD = new Float32Array(NA);
  for (let j = 0; j < NA; j++) {
    const a = j / NA * TAU; R[j] = islandRadius(a);
    YE[j] = heightAt(Math.cos(a) * R[j], Math.sin(a) * R[j]);
    HD[j] = 2.6 + 3.1 * fbm(Math.cos(a) * 2.3 + 40, Math.sin(a) * 2.3 + 17, 3);
  }
  const colTop = new THREE.Color(), c1 = new THREE.Color(0x557a35), c2 = new THREE.Color(0x6f9345),
        moss = new THREE.Color(0x3a5820), dirt = new THREE.Color(0x66482a), worn = new THREE.Color(0x5c6840);
  const rock1 = new THREE.Color(0x6b6457), rock2 = new THREE.Color(0x423d36), soil = new THREE.Color(0x57402a);
  const pushCol = (col) => C.push(col.r, col.g, col.b);
  // top surface rings
  for (let j = 0; j <= JT; j++) {
    const fr = Math.pow(j / JT, 1.12);
    for (let a = 0; a < NA; a++) {
      const ang = a / NA * TAU, rr = R[a] * fr * (j === 0 ? 0.01 : 1);
      const x = Math.cos(ang) * rr, z = Math.sin(ang) * rr, y = heightAt(x, z);
      P.push(x, y, z);
      const n1 = fbm(x * 0.9 + 3, z * 0.9 + 8, 3), n2 = fbm(x * 1.7 + 30, z * 1.7 + 12, 2);
      colTop.copy(c1).lerp(c2, n1);
      if (n2 > 0.62) colTop.lerp(moss, (n2 - 0.62) * 2.1);
      const slope = 1 - THREE.MathUtils.smoothstep(Math.abs(y - heightAt(x + 0.25, z)) + Math.abs(y - heightAt(x, z + 0.25)), 0.05, 0.3);
      if (n2 < 0.34) colTop.lerp(dirt, (0.34 - n2) * 1.6 * (1 - slope * 0.5));
      const dp = Math.hypot(x, z);
      if (dp < PLAZA.r + 1.2) colTop.lerp(worn, (1 - THREE.MathUtils.smoothstep(dp, PLAZA.r - 0.4, PLAZA.r + 1.2)) * 0.55);
      if (fr > 0.86) colTop.lerp(dirt, (fr - 0.86) * 2.4);
      pushCol(colTop);
    }
  }
  // jagged underside rings
  for (let k = 1; k <= KB; k++) {
    const d = k / KB;
    for (let a = 0; a < NA; a++) {
      const ang = a / NA * TAU;
      let y, rr;
      if (k === KB) { y = -3.35 - 0.55 * fbm(Math.cos(ang) * 3 + 9, Math.sin(ang) * 3 + 4, 2); rr = 0.015; }
      else {
        const jag = (fbm(ang * 2.6 + k * 1.35 + 3, k * 2.1 + 7.7, 3) - 0.5) * 2;
        rr = R[a] * (1 - Math.pow(d, 1.32)) * (1 + jag * 0.42 * Math.min(1, d * 2.4));
        const over = Math.sin(d * Math.PI) * 0.16 * (fbm(ang * 3.7 + 21, k * 0.9, 2) - 0.5) * 2;
        rr *= (1 + over);
        y = YE[a] - HD[a] * Math.pow(d, 1.25) + jag * 0.22 * Math.sin(d * Math.PI);
      }
      const x = Math.cos(ang) * rr, z = Math.sin(ang) * rr;
      P.push(x, y, z);
      const n = fbm(ang * 4 + k * 0.8, k * 1.6, 2);
      colTop.copy(soil).lerp(rock1, THREE.MathUtils.smoothstep(d, 0.05, 0.4));
      colTop.lerp(rock2, THREE.MathUtils.smoothstep(d, 0.45, 1.0) * 0.85);
      colTop.multiplyScalar(0.72 + n * 0.32 - d * 0.38);
      pushCol(colTop);
    }
  }
  const ring = NA, topVerts = (JT + 1) * NA, sideStart = topVerts;
  for (let j = 0; j < JT; j++) for (let a = 0; a < NA; a++) {
    const p0 = j * NA + a, p1 = j * NA + (a + 1) % NA, p2 = (j + 1) * NA + (a + 1) % NA, p3 = (j + 1) * NA + a;
    I.push(p0, p2, p1, p0, p3, p2);
  }
  for (let j = 0; j < JT - 1; j++) for (let a = 0; a < NA; a++) { // rim skirt connecting top edge to sides
    const p0 = j * NA + a, p1 = j * NA + (a + 1) % NA, p2 = sideStart + a, p3 = sideStart + (a + 1) % NA;
    I.push(p1, p2, p0, p1, p3, p2);
  }
  for (let k = 0; k < KB - 1; k++) for (let a = 0; a < NA; a++) {
    const p0 = sideStart + k * NA + a, p1 = sideStart + k * NA + (a + 1) % NA,
          p2 = sideStart + (k + 1) * NA + (a + 1) % NA, p3 = sideStart + (k + 1) * NA + a;
    I.push(p0, p1, p2, p0, p2, p3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  g.setIndex(I); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, metalness: 0.0 }));
  m.castShadow = true; m.receiveShadow = true;
  world.add(m);
  return m;
}

function scatterGrass() {
  const geo = new THREE.PlaneGeometry(0.06, 0.24, 1, 2); geo.translate(0, 0.12, 0);
  windify(T.blade, 0.10);
  const N = 2300, im = new THREE.InstancedMesh(geo, T.blade, N);
  const d = new THREE.Object3D(), col = new THREE.Color(), rnd = srand(77);
  let n = 0, guard = 0;
  while (n < N && guard++ < N * 6) {
    const a = rnd() * TAU, r = Math.sqrt(rnd()) * 4.32;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x - POND.x, z - POND.z) < POND.r + 0.5) continue;
    if (Math.hypot(x, z) < PLAZA.r * 0.95) continue;
    if (Math.hypot(x - 3.3, z + 1.6) < 1.0) continue;
    const y = heightAt(x, z);
    d.position.set(x, y - 0.02, z); d.rotation.set(0, rnd() * TAU, (rnd() - 0.5) * 0.3);
    const s = 0.5 + rnd() * 0.45; d.scale.set(s, s * (0.7 + rnd() * 0.7), s);
    d.updateMatrix(); im.setMatrixAt(n, d.matrix);
    col.setHSL(0.22 + rnd() * 0.07, 0.4 + rnd() * 0.2, 0.24 + rnd() * 0.16);
    im.setColorAt(n, col); n++;
  }
  im.count = n; im.receiveShadow = true; world.add(im);
}

function makeRock(seed, s, mat) {
  const g = new THREE.IcosahedronGeometry(1, 1);
  const p = g.attributes.position, rnd = srand(seed);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const f = 1 + (vnoise(x * 1.8 + seed, z * 1.8 + y * 1.4) - 0.5) * 0.65 + (vnoise(x * 4 + seed, y * 4 + z * 3) - 0.5) * 0.22;
    p.setXYZ(i, x * f, y * f * 0.82, z * f);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat || T.stone);
  m.scale.setScalar(s); m.scale.y *= 0.7 + rnd() * 0.25;
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function scatterRocks() {
  const rnd = srand(1234);

    let x, z, ok = false, tries = 0;
    while (!ok && tries++ < 30) {

const PATH_PTS = [
  new THREE.Vector3(3.3, 0, -1.6), new THREE.Vector3(2.62, 0, -1.27),

const pathCurve = new THREE.CatmullRomCurve3(PATH_PTS, false, 'catmullrom', 0.4);
function buildPaths() {
  const stoneGeo = new THREE.CylinderGeometry(0.27, 0.29, 0.07, 7);
  const rnd = srand(99);
  for (let i = 0; i <= 30; i++) {
    const t = i / 30, p = pathCurve.getPointAt(t);
    const tan = pathCurve.getTangentAt(t);
    const px = -tan.z, pz = tan.x, off = (rnd() - 0.5) * 0.28;
    const x = p.x + px * off, z = p.z + pz * off;
    const st = new THREE.Mesh(stoneGeo, T.stone);
    st.position.set(x, heightAt(x, z) + 0.03, z);
    st.rotation.set((rnd() - 0.5) * 0.06, rnd() * TAU, (rnd() - 0.5) * 0.06);
    const s = 0.75 + rnd() * 0.5; st.scale.set(s, 1, s);
    st.castShadow = true; st.receiveShadow = true; world.add(st);
  }
  // plaza tiles
  const tileGeo = new THREE.CylinderGeometry(0.31, 0.32, 0.06, 6);
  for (let gx = -3; gx <= 3; gx++) for (let gz = -3; gz <= 3; gz++) {
    const x = gx * 0.64 + (gz % 2 ? 0.32 : 0), z = gz * 0.56;
    const dp = Math.hypot(x, z);
    if (dp > PLAZA.r - 0.12 || dp < 1.18) continue;
    if (Math.hypot(x - POND.x, z - POND.z) < POND.r + 0.75) continue;
    const st = new THREE.Mesh(tileGeo, T.stone);
    st.position.set(x, heightAt(x, z) + 0.028, z);
    st.rotation.y = rnd() * TAU;
    st.castShadow = true; st.receiveShadow = true; world.add(st);
  }
  // steps near the torii approach
  const stepGeo = new THREE.BoxGeometry(1.15, 0.1, 0.34);
  for (let i = 0; i < 3; i++) {
    const t = 0.82 + i * 0.075, p = pathCurve.getPointAt(Math.min(t, 1));
    const st = new THREE.Mesh(stepGeo, T.stone);
    st.position.set(p.x, heightAt(p.x, p.z) + 0.05 - i * 0.07, p.z);
    st.rotation.y = Math.atan2(pathCurve.getTangentAt(Math.min(t, 1)).x, pathCurve.getTangentAt(Math.min(t, 1)).z);

/* ================= ROOF GEOMETRY (curved eaves, upturned corners, thickness) ================= */
function roofGeo(wHalf, h, lift, sqx = 1, sqz = 1) {
  const NA = 72, NT = 8, P = [], UV = [], I = [];
  const sqR = (a) => 1 / Math.max(Math.abs(Math.cos(a)) + 1e-4, Math.abs(Math.sin(a)) + 1e-4);
  const Vy = (a, tt) => h * (1 - (1 - tt) * (1 - tt))
      + lift * Math.pow(Math.abs(Math.cos(2 * a)), 2.4) * Math.pow(1 - tt, 2.6)
      - 0.06 * Math.pow(1 - tt, 3.2);
  for (let s = 0; s < 2; s++) {
    for (let j = 0; j <= NA; j++) {
      const a = j / NA * TAU;
      const r = sqR(a) * wHalf;
      for (let t = 0; t <= NT; t++) {
        const tt = t / NT, rr = r * (1 - 0.965 * tt);
        const off = s === 0 ? 0 : -(0.05 + 0.025 * tt);
        P.push(Math.cos(a) * rr * sqx, Vy(a, tt) + off, Math.sin(a) * rr * sqz);
        UV.push(j / NA * 4, tt + (s === 0 ? 0 : 1));
      }
    }
  }
  const row = NA + 1, col = NT + 1, shell = row * col;
  const ix = (s, j, t) => s * shell + j * col + t;
  for (let j = 0; j < NA; j++) for (let t = 0; t < NT; t++) {
    const a = ix(0, j, t), b = ix(0, j + 1, t), c = ix(0, j + 1, t + 1), d = ix(0, j, t + 1);
    I.push(a, d, b, b, d, c);
    const a1 = ix(1, j, t), b1 = ix(1, j + 1, t), c1 = ix(1, j + 1, t + 1), d1 = ix(1, j, t + 1);
    I.push(a1, b1, d1, b1, c1, d1);
  }
  for (let j = 0; j < NA; j++) {
    const a = ix(0, j, 0), b = ix(0, j + 1, 0), c = ix(1, j + 1, 0), d = ix(1, j, 0);
    I.push(a, b, c, a, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}
T.tile.shadowSide = THREE.DoubleSide;

function instanceFromDefs(defs, geo, mat) {
  if (!defs.length) return null;
  const im = new THREE.InstancedMesh(geo, mat, defs.length);
  const d = new THREE.Object3D();
  defs.forEach((o, i) => {
    d.position.set(o.x, o.y, o.z); d.rotation.set(0, o.ry || 0, 0);
    d.scale.set(o.sx || 1, o.sy || 1, o.sz || o.sx || 1);
    d.updateMatrix(); im.setMatrixAt(i, d.matrix);
  });

  return im;
}

function buildPagoda() {

/* ================= CHERRY TREE ================= */
const TREE = { x: 1.75, z: 2.9 };
function addBranch(P, I, a, b, r1, r2, seg = 6) {
  const dir = new THREE.Vector3().subVectors(b, a); const len = dir.length();
  if (len < 1e-4) return; dir.normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  const start = P.length / 3;
  for (let i = 0; i <= 1; i++) {
    const p = i ? b : a, r = i ? r2 : r1;
    for (let j = 0; j <= seg; j++) {
      const th = j / seg * TAU;
      const v = new THREE.Vector3(Math.cos(th) * r, 0, Math.sin(th) * r).applyQuaternion(q).add(p);
      P.push(v.x, v.y, v.z);
    }
  }
  for (let j = 0; j < seg; j++) {
    const a0 = start + j, b0 = start + j + 1, c0 = start + seg + 1 + j, d0 = start + seg + 2 + j;
    I.push(a0, c0, b0, b0, c0, d0);
  }
}
let blossomMesh = null;
function buildTree() {
  const P = [], I = [], clusters = [];
  const ty = heightAt(TREE.x, TREE.z);
  const rnd = srand(4242);
  function branch(p, dir, len, r, depth) {
    let cur = p.clone(), cd = dir.clone().normalize();
    const steps = depth >= 3 ? 3 : 2;
    for (let s = 0; s < steps; s++) {
      const nd = cur.clone().addScaledVector(cd, len / steps);
      addBranch(P, I, cur, nd, r * (1 - 0.3 * s / steps), r * (1 - 0.3 * (s + 1) / steps));
      cur = nd;
      cd.applyEuler(new THREE.Euler((rnd() - 0.5) * 0.42, (rnd() - 0.5) * 0.5, (rnd() - 0.5) * 0.42)).normalize();
    }
    if (depth <= 0 || len < 0.13) { if (rnd() < 0.9) clusters.push(cur.clone()); return; }
    const kids = depth >= 3 ? (rnd() < 0.45 ? 3 : 2) : (rnd() < 0.25 ? 3 : 2);
    for (let k = 0; k < kids; k++) {
      const nd2 = cd.clone();
      const ax = new THREE.Vector3(rnd() - 0.5, rnd() * 0.2 + 0.1, rnd() - 0.5).normalize();
      nd2.applyAxisAngle(ax, 0.45 + rnd() * 0.55).normalize();
      branch(cur.clone(), nd2, len * (0.6 + rnd() * 0.16), r * 0.58, depth - 1);
    }
    if (depth === 2 && rnd() < 0.7) clusters.push(cur.clone());
  }
  branch(new THREE.Vector3(TREE.x, ty - 0.06, TREE.z), new THREE.Vector3(0.05, 1, 0.03), 1.2, 0.17, 4);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setIndex(I); g.computeVertexNormals();
  const bark = new THREE.MeshStandardMaterial({ map: texWood('#4c3a26', '24,15,6'), roughness: 0.93 });
  const trunk = new THREE.Mesh(g, bark);
  trunk.castShadow = true; trunk.receiveShadow = true; world.add(trunk);
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + 0.5;
    const root = new THREE.Mesh(new THREE.SphereGeometry(0.13, 7, 6), bark);
    root.position.set(TREE.x + Math.cos(a) * 0.16, ty - 0.03, TREE.z + Math.sin(a) * 0.16);
    root.scale.set(1, 0.5, 1); root.castShadow = true; world.add(root);
  }
  // blossom clusters: branch tips + canopy fill
  const spots = [];
  for (const c of clusters) {
    const n = 2 + (rnd() < 0.4 ? 1 : 0);
    for (let k = 0; k < n; k++) spots.push([c.x + (rnd() - 0.5) * 0.5, c.y + (rnd() - 0.5) * 0.35, c.z + (rnd() - 0.5) * 0.5]);
  }
  const canopyC = new THREE.Vector3(TREE.x, ty + 1.95, TREE.z);
  while (spots.length < 250) {
    const v = new THREE.Vector3(rnd() - 0.5, (rnd() - 0.5) * 0.55, rnd() - 0.5).normalize()
      .multiplyScalar(Math.pow(rnd(), 0.4) * 1.5);
    v.y *= 0.72;
    spots.push([canopyC.x + v.x, canopyC.y + v.y, canopyC.z + v.z]);
  }
  windify(T.blossom, 0.06);
  const im = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.62, 0.62), T.blossom, spots.length);
  const d = new THREE.Object3D();
  spots.forEach((s, i) => {
    d.position.set(s[0], s[1], s[2]);
    d.rotation.set(rnd() * 0.9 - 0.45, rnd() * TAU, rnd() * 0.9 - 0.45);
    const sc = 0.4 + rnd() * 0.75; d.scale.setScalar(sc);
    d.updateMatrix(); im.setMatrixAt(i, d.matrix);
  });
  im.castShadow = true; im.frustumCulled = false;
  world.add(im); blossomMesh = im;
  const b = makeBlob(3.2, 3.2, 0.28); b.position.set(TREE.x, ty + 0.02, TREE.z); world.add(b);
}

const _pd = new THREE.Object3D();
function updatePetals(lt) {
  if (!petalMesh) return;
  const ph = TAU * lt / LOOP;
  for (let i = 0; i < petalParams.length; i++) {
    const p = petalParams[i];
    const fall = ((p.k * lt / LOOP + p.off) % 1);
    const y = p.yTop - fall * p.H;
    const x = p.x0 + Math.sin(ph * p.nx + p.phx) * p.ax + Math.sin(ph * 2 * p.nx + p.phz) * p.ax * 0.25;
    const z = p.z0 + Math.cos(ph * p.nz + p.phz) * p.az + Math.cos(ph * 2 * p.nz + p.phx) * p.az * 0.25;
    _pd.position.set(x, y, z);
    _pd.rotation.set(ph * p.sx + p.phr, ph * p.sy, ph * (p.sx + p.sy) * 0.5 + p.phr);
    _pd.scale.setScalar(p.sc);
    _pd.updateMatrix();
    petalMesh.setMatrixAt(i, _pd.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

const waterMat = new THREE.ShaderMaterial({
  uniforms: {
    uMap: { value: reflRT.texture },
    uRes: { value: new THREE.Vector2(2, 2) },
    uPhase: { value: 0 },
    uNormal: { value: T.waterNormal },
    uSun: { value: SUN_DIR.clone() },
    uCamDir: { value: new THREE.Vector3(0, 0, -1) },
  },
  vertexShader: `
    varying vec2 vUv; varying vec3 vW;
    void main(){ vUv=uv; vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D uMap, uNormal;
    uniform vec2 uRes; uniform float uPhase;
    uniform vec3 uSun, uCamDir;
    varying vec2 vUv; varying vec3 vW;
    void main(){
      vec2 o1 = vec2(sin(uPhase)*0.09, cos(uPhase*0.8)*0.09);
      vec2 o2 = vec2(cos(uPhase*1.3)*0.06, sin(uPhase*1.1)*0.06);
      vec3 n1 = texture2D(uNormal, vW.xz*0.55 + o1).xyz * 2.0 - 1.0;
      vec3 n2 = texture2D(uNormal, vW.xz*1.05 - o2).xyz * 2.0 - 1.0;
      vec3 n = normalize(vec3((n1.x+n2.x)*0.85, 1.0, (n1.z+n2.z)*0.85));
      vec2 ruv = gl_FragCoord.xy/uRes + n.xz*0.045;
      vec3 refl = texture2D(uMap, clamp(ruv, vec2(0.002), vec2(0.998))).rgb;
      vec3 vd = normalize(-uCamDir);
      float fres = 0.32 + 0.68 * pow(1.0 - clamp(dot(n, vd), 0.0, 1.0), 3.0);
      float edge = smoothstep(1.0, 0.55, length(vUv-0.5)*2.0);
      vec3 deep = vec3(0.050,0.115,0.098) * mix(0.7, 1.0, edge);
      deep += vec3(0.030,0.040,0.018) * (1.0-edge);
      vec3 col = mix(deep, refl, fres);
      vec3 hv = normalize(uSun + vd);
      float spec = pow(max(dot(n, hv), 0.0), 180.0) * 2.6;
      col += vec3(1.0,0.82,0.55) * spec;
      float glint = pow(max(dot(n, hv), 0.0), 24.0) * 0.22;
      col += vec3(1.0,0.75,0.45) * glint;
      gl_FragColor = vec4(pow(clamp(col, 0.0, 1.0), vec3(1.0/2.2)), 1.0);
    }`,
});
waterMat.toneMapped = false;

}

  for (const w of walkers) {
    const s = ((lt / LOOP) * w.loops + w.phase) % 1;
    const pt = w.route.getPointAt(s), tn = w.route.getTangentAt(s);
    w.p.g.position.set(pt.x, heightAt(pt.x, pt.z) + 0.004, pt.z);
    w.p.g.rotation.y = Math.atan2(tn.x, tn.z);
    const ph = TAU * w.steps * lt / LOOP + w.phase * TAU * 2;
    const sw = Math.sin(ph);
    w.p.legL.rotation.x = sw * 0.55; w.p.legR.rotation.x = -sw * 0.55;
    w.p.shL.rotation.x = -sw * 0.42; w.p.shR.rotation.x = sw * 0.42;
    w.p.g.position.y += Math.abs(Math.cos(ph)) * 0.012;
    w.p.head.rotation.y = Math.sin(ph * 0.5) * 0.15;

}

const _cd = new THREE.Object3D();
function updateChild(lt) {
  if (!child) return;
  const ph = TAU * 2 * lt / LOOP;
  const cast = Math.max(0, Math.sin(ph));
  child.p.shR.rotation.x = -cast * 1.5;
  child.p.head.rotation.x = 0.25 + Math.sin(ph * 0.5) * 0.1;
  child.p.head.rotation.y = Math.sin(ph * 0.5 + 1) * 0.25;
  const fwd = new THREE.Vector3(Math.sin(child.p.g.rotation.y), 0, Math.cos(child.p.g.rotation.y));
  const hand = new THREE.Vector3(child.cx, heightAt(child.cx, child.cz) + 0.42, child.cz).addScaledVector(fwd, 0.16);
  const toPond = new THREE.Vector3(POND.x - child.cx, 0, POND.z - child.cz).normalize();
  for (let i = 0; i < CRUMB_N; i++) {
    const tp = ((2 * lt / LOOP) + i / CRUMB_N) % 1;
    const tgt = new THREE.Vector3(child.cx, WATER_Y - 0.02, child.cz)
      .addScaledVector(toPond, POND.r * (0.55 + ((i * 7919) % 100) / 220))
      .add(new THREE.Vector3(((i * 104729) % 100) / 160 - 0.3, 0, ((i * 15485863) % 100) / 160 - 0.3));
    const arc = Math.sin(tp * Math.PI) * 0.12;
    _cd.position.copy(hand).lerp(tgt, tp); _cd.position.y += arc;
    _cd.scale.setScalar(tp < 0.98 ? 1 : 0.001);
    _cd.updateMatrix(); crumbs.setMatrixAt(i, _cd.matrix);
  }
  crumbs.instanceMatrix.needsUpdate = true;
}

let AC = null, masterG = null, musicBus = null, noiseBuf = null;
const audioLog = (m) => console.log('[audio] ' + m);
function makeNoiseBuf() {
  const len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}
function loopNoise(filterType, freq, q, gainVal) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.value = gainVal;
  s.connect(f); f.connect(g); g.connect(masterG); s.start();
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.06 + Math.random() * 0.06;
  const lg = AC.createGain(); lg.gain.value = gainVal * 0.6;
  lfo.connect(lg); lg.connect(g.gain); lfo.start();
  return g;
}
function pluck(freq, t0, dur, gain, wave = 'triangle') {
  const o = AC.createOscillator(); o.type = wave; o.frequency.value = freq;
  const o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.002;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  const g2 = AC.createGain(); g2.gain.value = 0.22;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(musicBus);
  o.start(t0); o2.start(t0); o.stop(t0 + dur + 0.1); o2.stop(t0 + dur + 0.1);
}
function startPad() {
  const o1 = AC.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 73.42;
  const o2 = AC.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 110.0 * 1.003;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 1.2;
  const g = AC.createGain(); g.gain.value = 0.045;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(masterG);
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.045;
  const lg = AC.createGain(); lg.gain.value = 180;
  lfo.connect(lg); lg.connect(f.frequency); lfo.start();
  o1.start(); o2.start();
}

                4, -1, 5, -1, 3, -1, 2, -1, 0, -1, -1, 2, 3, -1, -1, -1];

    while (nextStepTime < AC.currentTime + 0.5) {
      const n = MELODY[stepIdx % MELODY.length];
      if (n >= 0) pluck(SCALE[n], nextStepTime, 1.6 + Math.random() * 0.8, 0.16 + Math.random() * 0.05);
      if (stepIdx % 8 === 0) pluck(73.42, nextStepTime, 3.2, 0.12, 'sine');
      if (stepIdx === 4 || stepIdx === 20) pluck(SCALE[6] * 2, nextStepTime, 2.4, 0.05, 'sine');
      stepIdx++;
      nextStepTime += 1.5; // 16 steps x 1.5s = 24s musical loop
    }
  }, 250);
}
function chirp() {
  const t0 = AC.currentTime + Math.random() * 0.15;
  const n = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const o = AC.createOscillator(); o.type = 'sine';
    const g = AC.createGain();
    const f0 = 2400 + Math.random() * 1400;
    const tt = t0 + i * (0.09 + Math.random() * 0.08);
    o.frequency.setValueAtTime(f0, tt);
    o.frequency.exponentialRampToValueAtTime(f0 * (1.2 + Math.random() * 0.4), tt + 0.05);
    g.gain.setValueAtTime(0.0001, tt);
    g.gain.linearRampToValueAtTime(0.05, tt + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.09);
    o.connect(g); g.connect(masterG); o.start(tt); o.stop(tt + 0.12);
  }
  audioLog('birdsong');
}
function scheduleBirds() {
  const next = 3500 + Math.random() * 6000;
  setTimeout(() => { if (AC) { chirp(); scheduleBirds(); } }, next);
}
function shishi() {
  const t0 = AC.currentTime;
  for (const [f, d, g0] of [[340, 0.14, 0.14], [190, 0.28, 0.1], [1100, 0.05, 0.04]]) {
    const o = AC.createOscillator(); o.type = f > 800 ? 'square' : 'triangle'; o.frequency.value = f;
    const g = AC.createGain();
    g.gain.setValueAtTime(g0, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(masterG); o.start(t0); o.stop(t0 + d + 0.05);
  }
  audioLog('shishi-odoshi clack');
}
function scheduleShishi() {
  setTimeout(() => { if (AC) { shishi(); scheduleShishi(); } }, 11000 + Math.random() * 4000);
}
function cluck() {
  const t0 = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 5;
  f.frequency.setValueAtTime(1100, t0);
  f.frequency.linearRampToValueAtTime(700, t0 + 0.18);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.09, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
  s.connect(f); f.connect(g); g.connect(masterG);
  s.start(t0); s.stop(t0 + 0.25);
  audioLog('hen cluck');
}
function scheduleCluck() {
  setTimeout(() => { if (AC) { cluck(); scheduleCluck(); } }, 7000 + Math.random() * 9000);
}
function drip() {
  const t0 = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(900, t0);
  o.frequency.exponentialRampToValueAtTime(380, t0 + 0.09);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.05, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
  o.connect(g); g.connect(masterG); o.start(t0); o.stop(t0 + 0.15);
}
function scheduleDrip() {
  setTimeout(() => { if (AC) { drip(); scheduleDrip(); } }, 3000 + Math.random() * 4000);
}
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { console.warn('[audio] unavailable', e); return; }
  makeNoiseBuf();
  masterG = AC.createGain(); masterG.gain.value = 0.5; masterG.connect(AC.destination);
  const delay = AC.createDelay(1.5); delay.delayTime.value = 0.46;
  const fb = AC.createGain(); fb.gain.value = 0.3;
  const dw = AC.createBiquadFilter(); dw.type = 'lowpass'; dw.frequency.value = 2400;
  const wet = AC.createGain(); wet.gain.value = 0.26;
  delay.connect(fb); fb.connect(delay); delay.connect(dw); dw.connect(wet); wet.connect(masterG);
  musicBus = AC.createGain(); musicBus.gain.value = 0.95;
  musicBus.connect(masterG); musicBus.connect(delay);
  startPad();
  loopNoise('bandpass', 300, 0.7, 0.045);   // wind
  loopNoise('lowpass', 620, 0.5, 0.02);     // pond shimmer
  startMelody();
  scheduleBirds(); scheduleShishi(); scheduleCluck(); scheduleDrip();
  audioLog('engine started — koto melody (24s loop), wind, pond, birds');
}

/* ================= BUILD THE WORLD ================= */
buildIsland(); scatterGrass(); scatterRocks(); buildPaths();
buildPagoda();
buildHouse(-3.05, -1.9, Math.atan2(3.05, 1.9), 2.3, 1.7, 0.72, true);
buildHouse(3.1, 0.75, Math.atan2(-3.1, -0.75), 2.0, 1.55, 0.66, false);
buildHouse(-3.3, 0.8, Math.atan2(3.3, -0.8), 1.6, 1.3, 0.6, false);
buildTorii(); placeLanterns();
buildTree(); buildPetals(); buildPond(); buildLife();

/* cache materials for the reflection pass winding fix */
{
  const seen = new Set();
  scene.traverse((o) => {
    if ((o.isMesh || o.isInstancedMesh) && o.material && !seen.has(o.material)) {

}

/* ================= RESIZE ================= */
function sizeAll() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  layoutCamera();
  const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
  let rw = Math.floor(w * dpr), rh = Math.floor(h * dpr);
  const cap = 1600;
  if (rw > cap) { rh = Math.floor(rh * cap / rw); rw = cap; }
  reflRT.setSize(rw, rh);
}
sizeAll();
window.addEventListener('resize', sizeAll);

/* ================= UI ================= */
const ui = document.getElementById('ui');
const sndEl = document.getElementById('snd');
const btnCine = document.getElementById('btnCine');
const btnReset = document.getElementById('btnReset');
let uiTimer = 0;
function wakeUI() {
  ui.classList.remove('dim');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => ui.classList.add('dim'), 10000);
}
window.addEventListener('pointermove', wakeUI);
window.addEventListener('pointerdown', wakeUI);
btnCine.addEventListener('click', (e) => {
  e.stopPropagation();
  cine = !cine;
  btnCine.classList.toggle('on', cine);

});
btnReset.addEventListener('click', (e) => {
  e.stopPropagation();
  cine = false; btnCine.classList.remove('on');
  cam.tAz = camDefault.az + Math.round((cam.az - camDefault.az) / TAU) * TAU;
  cam.tEl = camDefault.el; cam.tZoom = 1;
  console.log('[ui] view reset to isometric');
  wakeUI();
});
function enableAudio() {
  if (AC) return;
  initAudio();
  sndEl.classList.add('gone');
}
sndEl.addEventListener('click', (e) => { e.stopPropagation(); enableAudio(); });
window.addEventListener('pointerdown', enableAudio, { once: true });
wakeUI();

/* ================= MAIN LOOP ================= */
const clock = new THREE.Clock();
const _sunPr = new THREE.Vector3();
let t = 0, firstFrame = true;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  t += dt;
  const lt = t % LOOP, phase = TAU * lt / LOOP;
  updateControls(dt);
  _sunPr.copy(SUN_DIR).multiplyScalar(300).project(camera);
  skyMat.uniforms.uSunUv.value.set(_sunPr.x * 0.5 + 0.5, _sunPr.y * 0.5 + 0.5);
  world.position.y = Math.sin(phase) * 0.055;
  world.rotation.z = Math.sin(phase + 1.3) * 0.006;
  world.rotation.x = Math.cos(phase) * 0.004;
  for (const sh of windShaders) if (sh.uniforms.uPhase) sh.uniforms.uPhase.value = phase;
  updatePetals(lt);
  updateLife(lt);
  updateWater(lt);
  renderReflection();
  renderer.render(scene, camera);
  if (firstFrame) {
    firstFrame = false;
    document.getElementById('load').classList.add('gone');
    console.log('[pagoda] first frame rendered');
    setTimeout(() => {
      const i = renderer.info.render;
      console.log(`[pagoda] perf — draw calls: ${i.calls}, triangles: ${i.triangles}`);
    }, 2000);
  }
}
animate();
console.log('[pagoda] SKY TEMPLE initialized — 24s seamless loop');
