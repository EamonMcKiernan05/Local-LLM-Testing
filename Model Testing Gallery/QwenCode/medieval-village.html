<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Alderglen — A Medieval Village at Golden Hour</title>
<style>
  :root{
    --ink:#241505; --parchment:#f1dfb8; --parchment-dim:#cdb488;
    --gold:#e2a63d; --ember:#c65b2e; --oak:#7a5230; --night:#150e08;
    --panel:rgba(26,16,8,.86); --line:rgba(226,166,61,.38);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a1006;}
  body{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;color:var(--parchment);}
  #stage{position:fixed;inset:0;}
  #stage canvas{display:block;width:100%;height:100%;}

  /* ---------- custom scrollbars, in the village palette ---------- */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:#241708;border-left:1px solid rgba(226,166,61,.18);}
  ::-webkit-scrollbar-thumb{background:linear-gradient(#a97b3f,#7a5230);border-radius:6px;border:2px solid #241708;}
  ::-webkit-scrollbar-thumb:hover{background:linear-gradient(#e2a63d,#a97b3f);}
  *{scrollbar-width:thin;scrollbar-color:#a97b3f #241708;}

  /* ---------- title plaque ---------- */
  #plaque{position:fixed;top:18px;left:20px;z-index:10;pointer-events:none;
    padding:12px 20px 11px;background:var(--panel);border:1px solid var(--line);
    border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.4);
    backdrop-filter:blur(5px);}
  #plaque::before,#plaque::after{content:"❧";position:absolute;top:50%;transform:translateY(-50%);
    color:var(--gold);opacity:.75;font-size:15px;}
  #plaque::before{left:6px;} #plaque::after{right:6px;}
  #plaque h1{font-size:21px;letter-spacing:.24em;font-weight:normal;color:var(--gold);
    text-transform:uppercase;text-shadow:0 1px 0 #000,0 0 14px rgba(226,166,61,.35);padding:0 14px;}
  #plaque p{font-size:11.5px;letter-spacing:.14em;color:var(--parchment-dim);text-align:center;
    font-style:italic;margin-top:3px;padding:0 14px;}

  /* ---------- top-right buttons ---------- */
  #topright{position:fixed;top:18px;right:20px;z-index:11;display:flex;gap:8px;}
  .tbtn{font-family:inherit;font-size:12.5px;letter-spacing:.06em;color:var(--parchment);
    background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 13px;
    cursor:pointer;backdrop-filter:blur(5px);transition:background .18s,border-color .18s,transform .12s;
    box-shadow:0 3px 14px rgba(0,0,0,.4);}
  .tbtn:hover{background:rgba(60,38,16,.92);border-color:var(--gold);}
  .tbtn:active{transform:translateY(1px);}
  .tbtn .ico{color:var(--gold);margin-right:6px;}
  #btnTour{display:none;}
  #btnTour.show{display:inline-block;}

  /* ---------- control panel ---------- */
  #panel{position:fixed;top:76px;right:20px;z-index:10;width:252px;max-height:calc(100vh - 108px);
    overflow-y:auto;overflow-x:hidden;background:var(--panel);border:1px solid var(--line);border-radius:5px;
    backdrop-filter:blur(6px);box-shadow:0 6px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.35);
    padding:14px 16px 12px;}
  #panel h2{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
    font-weight:normal;border-bottom:1px solid rgba(226,166,61,.25);padding-bottom:5px;margin:13px 0 9px;}
  #panel h2:first-child{margin-top:0;}
  .row{margin-bottom:9px;}
  .row label{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;
    color:var(--parchment);margin-bottom:4px;letter-spacing:.03em;}
  .row label output{font-size:11px;color:var(--gold);font-style:italic;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
    background:linear-gradient(90deg,#5a3c1c,#8a6238);border:1px solid rgba(0,0,0,.55);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-6px;
    border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9b0,#e2a63d 55%,#8a5a1e);
    border:1px solid #3a2408;box-shadow:0 1px 4px rgba(0,0,0,.6);}
  input[type=range]::-webkit-slider-thumb:hover{background:radial-gradient(circle at 35% 30%,#fff6d8,#ffc35e 55%,#a06a24);}
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#5a3c1c,#8a6238);}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe9b0,#e2a63d 55%,#8a5a1e);border:1px solid #3a2408;}
  .check{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:7px;cursor:pointer;user-select:none;}
  .check input{accent-color:#e2a63d;width:14px;height:14px;cursor:pointer;}
  select{width:100%;font-family:inherit;font-size:12px;color:var(--parchment);background:#2c1c0c;
    border:1px solid rgba(226,166,61,.35);border-radius:3px;padding:5px 6px;cursor:pointer;}
  select:hover{border-color:var(--gold);}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .abtn{flex:1;font-family:inherit;font-size:12px;letter-spacing:.05em;color:var(--ink);
    background:linear-gradient(#f0cd82,#d99f35);border:1px solid #6a4416;border-radius:3px;
    padding:7px 4px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.4);
    transition:filter .15s, transform .1s;}
  .abtn:hover{filter:brightness(1.1);}
  .abtn:active{transform:translateY(1px);}
  #perf{margin-top:11px;font-size:10.5px;color:rgba(205,180,136,.7);letter-spacing:.05em;
    text-align:center;font-style:italic;border-top:1px solid rgba(226,166,61,.18);padding-top:8px;}

  /* ---------- hint ---------- */
  #hint{position:fixed;left:20px;bottom:18px;z-index:10;font-size:12px;font-style:italic;
    letter-spacing:.06em;color:var(--parchment-dim);background:var(--panel);border:1px solid var(--line);
    border-radius:4px;padding:8px 14px;pointer-events:none;transition:opacity 1.2s;backdrop-filter:blur(5px);}
  #hint.gone{opacity:0;}
  #hint b{color:var(--gold);font-weight:normal;}

  /* ---------- loader ---------- */
  #loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:radial-gradient(ellipse at 50% 60%, #3a2410 0%, #1a0f06 70%, #0d0703 100%);
    transition:opacity .9s;}
  #loader.gone{opacity:0;pointer-events:none;}
  #loader .sun{width:74px;height:74px;border-radius:50%;margin-bottom:26px;
    background:radial-gradient(circle at 42% 38%, #fff3cf, #ffc35e 45%, #c65b2e 80%, #7a2e12);
    box-shadow:0 0 44px 10px rgba(255,170,70,.45), 0 0 120px 30px rgba(255,140,50,.18);
    animation:breathe 2.6s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
  #loader h1{font-size:30px;letter-spacing:.34em;color:var(--gold);font-weight:normal;text-transform:uppercase;
    text-shadow:0 0 22px rgba(226,166,61,.4);padding-left:.34em;}
  #loader .sub{font-size:13px;font-style:italic;color:var(--parchment-dim);margin-top:8px;letter-spacing:.12em;}
  #loadbar{width:264px;height:5px;margin-top:30px;background:#241708;border:1px solid rgba(226,166,61,.3);
    border-radius:3px;overflow:hidden;}
  #loadfill{height:100%;width:0%;background:linear-gradient(90deg,#c65b2e,#e2a63d,#ffe9b0);transition:width .3s;}
  #loadmsg{margin-top:12px;font-size:11.5px;font-style:italic;color:rgba(205,180,136,.85);letter-spacing:.08em;min-height:16px;}

  @media (max-width:760px){
    #plaque{top:10px;left:10px;padding:8px 14px;}
    #plaque h1{font-size:15px;} #plaque p{font-size:9.5px;}
    #topright{top:10px;right:10px;}
    #panel{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:40vh;padding:10px 14px;}
    #hint{display:none;}
  }
</style>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="stage"></div>

<header id="plaque">
  <h1>Alderglen</h1>
  <p>a medieval village &middot; golden hour</p>
</header>

<div id="topright">
  <button class="tbtn" id="btnTour"><span class="ico">&#8635;</span>Resume tour</button>
  <button class="tbtn" id="btnSound"><span class="ico">&#9835;</span><span id="soundLabel">Sound on</span></button>
</div>

<aside id="panel">
  <h2>Heavens</h2>
  <div class="row"><label>Time of day <output id="oTime">golden</output></label>
    <input type="range" id="rTime" min="0" max="1" step="0.01" value="0.30"></div>
  <div class="row"><label>Evening haze <output id="oFog">45%</output></label>
    <input type="range" id="rFog" min="0" max="1" step="0.01" value="0.45"></div>
  <div class="row"><label>Lantern bloom <output id="oBloom">55%</output></label>
    <input type="range" id="rBloom" min="0" max="1.2" step="0.01" value="0.55"></div>

  <h2>Village life</h2>
  <div class="row"><label>Wind <output id="oWind">45%</output></label>
    <input type="range" id="rWind" min="0" max="1" step="0.01" value="0.45"></div>
  <label class="check"><input type="checkbox" id="cLanterns" checked> Lit lanterns &amp; windows</label>
  <label class="check"><input type="checkbox" id="cMotion" checked> Village in motion</label>

  <h2>Camera</h2>
  <label class="check"><input type="checkbox" id="cTour" checked> Slow guided tour</label>
  <div class="row"><label>Tour pace <output id="oTour">0.50</output></label>
    <input type="range" id="rTour" min="0.1" max="1.6" step="0.05" value="0.5"></div>

  <h2>Quality</h2>
  <div class="row"><label>Sun shadows</label>
    <select id="sShadow"><option value="2048">2K &middot; swift</option><option value="4096" selected>4K &middot; fine</option><option value="8192">8K &middot; ultra</option></select></div>
  <div class="row"><label>Meadow density</label>
    <select id="sVeg"><option value="7000">Sparse</option><option value="18000" selected>Lush</option><option value="30000">Teeming</option></select></div>

  <div class="actions">
    <button class="abtn" id="btnReset">Reset view</button>
    <button class="abtn" id="btnRandom">Randomize</button>
    <button class="abtn" id="btnShot">Capture PNG</button>
  </div>
  <div id="perf">kindling the hearths&hellip;</div>
</aside>

<div id="hint"><b>Drag</b> to orbit &nbsp;&middot;&nbsp; <b>Scroll</b> to zoom &nbsp;&middot;&nbsp; <b>Right-drag</b> to pan</div>

<div id="loader">
  <div class="sun"></div>
  <h1>Alderglen</h1>
  <div class="sub">a medieval village at golden hour</div>
  <div id="loadbar"><div id="loadfill"></div></div>
  <div id="loadmsg">waking the masons&hellip;</div>
</div>

<script>
  // graceful notice if the CDN is unreachable (file opened offline)
  window.__loadWatch = setTimeout(function(){
    if(!(window.__V && window.__V.ready)){
      var m = document.getElementById('loadmsg');
      if(m) m.textContent = 'still fetching Three.js from the CDN — an internet connection is needed once';
    }
  }, 15000);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Water } from 'three/addons/objects/Water.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   Alderglen — everything procedural. No downloaded assets.
   ============================================================ */

const V3 = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ---------- deterministic RNG + value noise ---------- */
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const rng = mulberry32(20261114);
const rand=(a=1,b)=> b===undefined ? rng()*a : a+rng()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const pick=arr=>arr[Math.floor(rng()*arr.length)];

function hash2(ix,iy){let h=(ix*374761393+iy*668265263)|0;h=(h^(h>>>13))|0;h=Math.imul(h,1274126177);h=(h^(h>>>16))>>>0;return h/4294967296;}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);
  return lerp(lerp(a,b,sx),lerp(c,d,sx),sy);}
function fbm(x,y,oct=4){let v=0,amp=.5,f=1,tot=0;for(let i=0;i<oct;i++){v+=vnoise(x*f,y*f)*amp;tot+=amp;amp*=.5;f*=2.03;}return v/tot;}

/* ---------- shared state ---------- */
const S = {
  dusk:0.30, fogAmt:0.45, bloom:0.55, wind:0.45,
  lanternsOn:true, motion:true, tour:true, tourSpeed:0.5,
  time:0, ready:false,
  obstacles:[],          // {x,z,r} circles kept clear of vegetation
  pathSegs:[],           // {ax,az,bx,bz} for proximity tests
  chimneys:[],           // world smoke origins
  lanterns:[],           // {glass, light?, base, seed}
  swayShaders:[],        // wind uniform holders
  stats:{houses:0,stalls:0}
};
const LAKE = {x:-64, z:26, r:24};
const MILL = {x:54, z:-32};
const CHURCH = {x:-8, z:-38};
const WATER_Y = -1.55;

/* ============================================================
   Procedural texture factory (canvas)
   ============================================================ */
function canvasOf(size){const c=document.createElement('canvas');c.width=c.height=size;return c;}
function toTex(c,{srgb=true,repeat=[1,1],aniso=8}={}){
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);
  t.anisotropy=aniso;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;
}
function pixels(g,size,fn){const img=g.createImageData(size,size);const d=img.data;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const i=(y*size+x)*4;const c=fn(x,y);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;}
  g.putImageData(img,0,0);}
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const hex=c=>'#'+c.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');

const TEX={}, MAT={};

function buildTextures(){
  /* --- plaster: warm lime wash, mottled + hairline cracks --- */
  {const s=512,c=canvasOf(s),g=c.getContext('2d');
   pixels(g,s,(x,y)=>{const n=fbm(x*.045,y*.045,4),m=fbm(x*.008+40,y*.008,3);
     return mixc([236,226,206],[214,201,176],m*.7+n*.3);});
   g.strokeStyle='rgba(96,74,52,.16)';g.lineWidth=1;
   for(let i=0;i<9;i++){let x=rand(s),y=rand(s);g.beginPath();g.moveTo(x,y);
     for(let k=0;k<14;k++){x+=rand(-14,14);y+=rand(2,16);g.lineTo(x,y);}g.stroke();}
   const b=canvasOf(s),gb=b.getContext('2d');
   pixels(gb,s,(x,y)=>{const n=fbm(x*.09,y*.09,4)*.6+fbm(x*.02,y*.02,3)*.4;const v=120+n*110;return[v,v,v];});
   TEX.plaster=toTex(c);TEX.plasterB=toTex(b,{srgb:false});}

  /* --- wood planks / timber grain --- */
  function wood(size,base,dark,planks,vertical){
    const c=canvasOf(size),g=c.getContext('2d');
    const pw=size/planks;
    pixels(g,size,(x,y)=>{const u=vertical?x:y,v=vertical?y:x;
      const pi=Math.floor(u/pw),pt=hash2(pi,7)*.24-.12;
      const grain=fbm(u*.16+pi*31,v*.012,4);
      const streak=Math.pow(fbm(u*.5+pi*17,v*.03,3),2)*.5;
      let t=clamp(grain*.75+streak+pt,0,1);
      let col=mixc(base,dark,t);
      const gap=Math.min(u-pi*pw,(pi+1)*pw-u);
      if(planks>1&&gap<1.6)col=mixc(col,[20,12,6],.8);
      return col;});
    // knots
    for(let i=0;i<planks+1;i++){const kx=rand(size),ky=rand(size),r=rand(4,9);
      for(let ring=r;ring>1;ring-=1.6){g.strokeStyle=`rgba(30,18,8,${.10+ .12*(1-ring/r)})`;
        g.beginPath();g.ellipse(kx,ky,ring,ring*(vertical?1.7:1.0),vertical?0:Math.PI/2,0,7);g.stroke();}}
    const b=canvasOf(size),gb=b.getContext('2d');
    pixels(gb,size,(x,y)=>{const u=vertical?x:y,v=vertical?y:x;const pi=Math.floor(u/pw);
      const grain=fbm(u*.16+pi*31,v*.012,4);let val=90+grain*130;
      const gap=Math.min(u-pi*pw,(pi+1)*pw-u);if(planks>1&&gap<2)val=20;return[val,val,val];});
    return[toTex(c),toTex(b,{srgb:false})];
  }
  [TEX.plank,TEX.plankB]=wood(512,[154,112,66],[74,48,26],6,true);
  [TEX.oak,TEX.oakB]=wood(256,[86,60,36],[40,26,14],1,true);
  [TEX.pale,TEX.paleB]=wood(256,[176,140,96],[104,74,44],4,true);

  /* --- roof tiles (terracotta) & slate --- */
  function tiles(size,base,hi,lo,round){
    const c=canvasOf(size),g=c.getContext('2d');const tw=size/8,th=size/8;
    g.fillStyle=hex(lo);g.fillRect(0,0,size,size);
    for(let row=0;row<9;row++){const off=(row%2)*tw/2;
      for(let col=-1;col<9;col++){const x=col*tw+off,y=row*th;
        const tone=rand(-14,14);const grd=g.createLinearGradient(0,y,0,y+th);
        grd.addColorStop(0,hex([hi[0]+tone,hi[1]+tone,hi[2]+tone]));
        grd.addColorStop(.75,hex([base[0]+tone,base[1]+tone,base[2]+tone]));
        grd.addColorStop(1,hex(lo));g.fillStyle=grd;
        g.beginPath();
        if(round){g.moveTo(x+1,y+th);g.lineTo(x+1,y+th*.35);g.quadraticCurveTo(x+tw/2,y-th*.18,x+tw-1,y+th*.35);g.lineTo(x+tw-1,y+th);}
        else{g.rect(x+1,y+1,tw-2,th-2);}
        g.fill();
        g.fillStyle='rgba(0,0,0,.28)';g.fillRect(x,y+th-2.2,tw,2.2);}}
    pixelsOverlay(g,size,.08);
    const b=canvasOf(size),gb=b.getContext('2d');gb.fillStyle='#303030';gb.fillRect(0,0,size,size);
    for(let row=0;row<9;row++){const off=(row%2)*tw/2;
      for(let col=-1;col<9;col++){const x=col*tw+off,y=row*th;
        const grd=gb.createLinearGradient(0,y,0,y+th);grd.addColorStop(0,'#e8e8e8');grd.addColorStop(.8,'#909090');grd.addColorStop(1,'#181818');
        gb.fillStyle=grd;gb.beginPath();
        if(round){gb.moveTo(x+1,y+th);gb.lineTo(x+1,y+th*.35);gb.quadraticCurveTo(x+tw/2,y-th*.18,x+tw-1,y+th*.35);gb.lineTo(x+tw-1,y+th);}
        else gb.rect(x+1,y+1,tw-2,th-2);
        gb.fill();}}
    return[toTex(c),toTex(b,{srgb:false})];
  }
  function pixelsOverlay(g,size,amt){const img=g.getImageData(0,0,size,size),d=img.data;
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){const i=(y*size+x)*4;const n=(fbm(x*.11,y*.11,3)-.5)*255*amt;
      d[i]+=n;d[i+1]+=n;d[i+2]+=n;}g.putImageData(img,0,0);}
  [TEX.tile,TEX.tileB]=tiles(512,[166,86,58],[214,132,92],[70,34,24],true);
  [TEX.slate,TEX.slateB]=tiles(512,[92,98,108],[132,138,150],[36,40,48],false);

  /* --- thatch / straw --- */
  {const s=512,c=canvasOf(s),g=c.getContext('2d');
   pixels(g,s,(x,y)=>{const course=Math.floor(y/86);const band=(y%86)/86;
     const n=fbm(x*.05,y*.35,3);let col=mixc([206,164,86],[140,102,48],n);
     col=mixc(col,[96,66,30],smooth(.82,1,band)*.75);return col;});

/* ============================================================
   Renderer / scene / camera / lights / sky / post
   ============================================================ */
let renderer,scene,camera,controls,composer,bloomPass,sun,hemi,fill,sky,skyU;
const SUN_AZ=247*Math.PI/180;

function sunDirFromDusk(d){const el=lerp(10.5,-3.5,d)*Math.PI/180;
  return V3(Math.cos(el)*Math.sin(SUN_AZ),Math.sin(el),Math.cos(el)*Math.cos(SUN_AZ)).normalize();}

function buildRenderer(){
  renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.06;
  document.getElementById('stage').appendChild(renderer.domElement);

  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0xe8b07a,0.0032);

  camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,1200);
  camera.position.set(78,30,70);

  controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(0,4.5,0);
  controls.enableDamping=true;controls.dampingFactor=.06;
  controls.minDistance=7;controls.maxDistance=170;
  controls.maxPolarAngle=1.52;controls.minPolarAngle=.12;
  controls.autoRotate=true;controls.autoRotateSpeed=.5;
  controls.zoomSpeed=.9;controls.panSpeed=.8;

  sun=new THREE.DirectionalLight(0xffc27d,3.1);
  sun.castShadow=true;
  sun.shadow.mapSize.set(4096,4096);
  const sc=sun.shadow.camera;sc.left=-95;sc.right=95;sc.top=95;sc.bottom=-95;sc.near=20;sc.far=460;
  sun.shadow.bias=-0.00035;sun.shadow.normalBias=.5;
  scene.add(sun);scene.add(sun.target);

  hemi=new THREE.HemisphereLight(0xffd2a8,0x7a6a48,1.15);scene.add(hemi);
  fill=new THREE.DirectionalLight(0xffb894,.7);fill.position.set(120,70,90);scene.add(fill);
  camera.layers.enable(1);

  /* --- sunset sky dome --- */
  skyU={uSunDir:{value:sunDirFromDusk(S.dusk)},uDusk:{value:S.dusk},uTime:{value:0}};
  sky=new THREE.Mesh(new THREE.SphereGeometry(760,48,24),new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyU,
    vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`
      varying vec3 vDir;uniform vec3 uSunDir;uniform float uDusk;uniform float uTime;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      void main(){
        vec3 d=normalize(vDir);
        float h=clamp(d.y,-1.,1.);
        vec3 zenG=vec3(.11,.20,.46), zenD=vec3(.045,.06,.16);
        vec3 midG=vec3(.55,.34,.52), midD=vec3(.20,.15,.30);
        vec3 horG=vec3(.98,.44,.13), horD=vec3(.78,.30,.24);
        vec3 zen=mix(zenG,zenD,uDusk), mid=mix(midG,midD,uDusk), hor=mix(horG,horD,uDusk);
        float t1=smoothstep(.0,.30,h), t2=smoothstep(.20,.68,h);
        vec3 col=mix(hor,mid,t1);col=mix(col,zen,t2);
        float sd=clamp(dot(d,uSunDir),0.,1.);
        // warm scatter around the sun
        col+=mix(vec3(1.,.55,.24),vec3(.9,.35,.3),uDusk)*pow(sd,9.)*.28*(1.-uDusk*.55);
        col+=vec3(1.,.8,.5)*pow(sd,90.)*.75;
        // sun disc (HDR so bloom catches it)
        float disc=smoothstep(.99935,.99965,sd);
        vec3 sunCol=mix(vec3(5.2,3.7,2.1),vec3(5.2,1.9,1.1),uDusk);
        col=mix(col,sunCol,disc*smoothstep(-.035,.02,uSunDir.y+ .03));
        // stars fading in at dusk
        if(uDusk>.35&&h>.06){
          vec2 sp=d.xz/(d.y+.4)*140.;vec2 cell=floor(sp);
          float st=hash(cell);
          if(st>.994){float tw=.6+.4*sin(uTime*2.+st*90.);
            col+=vec3(.9,.92,1.)*smoothstep(.35,1.,uDusk)*tw*smoothstep(.06,.3,h)*.8;}}
        // below horizon fades to haze so terrain edges melt away
        col=mix(col,mix(vec3(.91,.66,.42),vec3(.24,.18,.30),uDusk),smoothstep(.0,-.14,h));
        col+=(hash(d.xy*vec2(1234.5,987.6))-.5)*.008; // de-band dither
        gl_FragColor=vec4(col,1.);
      }`
  }));
  sky.frustumCulled=false;sky.renderOrder=-1000;scene.add(sky);

  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),S.bloom,.62,.9);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
  });
}

/* ============================================================
   Terrain
   ============================================================ */
function terrainH(x,z){
  const d=Math.hypot(x,z);
  let h=(fbm(x*.013+3,z*.013+7,4)-.5)*15+(fbm(x*.06,z*.06,3)-.5)*2.4;
  h*=smooth(24,64,d);
  h+=smooth(100,230,d)*(9+fbm(x*.02+9,z*.02+2,4)*20);
  const ld=Math.hypot(x-LAKE.x,z-LAKE.z);
  h-=(1-smooth(0,LAKE.r+12,ld))*7.2;
  h+=Math.exp(-((x-MILL.x)**2+(z-MILL.z)**2)/(2*20*20))*6.4;   // mill hill
  h+=Math.exp(-((x-CHURCH.x)**2+(z-CHURCH.z)**2)/(2*15*15))*1.7; // church rise
  return h;
}
function nearPath(x,z,dist){
  for(const s of S.pathSegs){
    const dx=s.bx-s.ax,dz=s.bz-s.az;const L2=dx*dx+dz*dz;
    let t=L2?((x-s.ax)*dx+(z-s.az)*dz)/L2:0;t=clamp(t,0,1);
    const px=s.ax+dx*t,pz=s.az+dz*t;
    if((x-px)**2+(z-pz)**2<dist*dist)return true;
  }return false;
}
function blocked(x,z,pad=0){
  if(Math.hypot(x,z)<14.6+pad)return true;
  if(terrainH(x,z)<WATER_Y+.45)return true;
  for(const o of S.obstacles){if((x-o.x)**2+(z-o.z)**2<(o.r+pad)**2)return true;}
  return false;
}
function buildTerrain(){
  const size=640,seg=256;
  const geo=new THREE.PlaneGeometry(size,size,seg,seg);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;const colors=new Float32Array(pos.count*3);
  const dry=[.86,.78,.5],lush=[.62,.72,.42],mud=[.62,.52,.38],rock=[.6,.58,.54];
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);const h=terrainH(x,z);pos.setY(i,h);
    const n=fbm(x*.03+11,z*.03+5,3);
    let c=mixc(lush,dry,smooth(.32,.72,n));
    const ld=Math.hypot(x-LAKE.x,z-LAKE.z);
    if(h<WATER_Y+.9&&ld<LAKE.r+16)c=mixc(c,mud,smooth(WATER_Y+.9,WATER_Y-.2,h));
    const slope=Math.abs(terrainH(x+2,z)-h)+Math.abs(terrainH(x,z+2)-h);
    if(slope>1.5)c=mixc(c,rock,clamp((slope-1.5)/2,0,.7));
    if(Math.hypot(x,z)>118)c=mixc(c,[.5,.56,.4],smooth(118,210,Math.hypot(x,z))*.6);
    if(nearPath(x,z,3.2))c=mixc(c,[.66,.55,.4],.4);
    colors[i*3]=c[0];colors[i*3+1]=c[1];colors[i*3+2]=c[2];
  }
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  geo.computeVertexNormals();
  TEX.grass.repeat.set(90,90);TEX.grassB.repeat.set(90,90);
  const m=new THREE.Mesh(geo,MAT.grass);m.receiveShadow=true;scene.add(m);
}

/* ---------- geometry helpers ---------- */
function box(w,h,d,mat,x=0,y=0,z=0,ry=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.rotation.y=ry;m.castShadow=true;m.receiveShadow=true;return m;}
function cyl(rt,rh,h,mat,seg=12){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rh,h,seg),mat);
  m.castShadow=true;m.receiveShadow=true;return m;}
// merge a group's static meshes by material into few draw calls
function mergeGroup(group){
  group.updateMatrixWorld(true);
  const byMat=new Map();const lights=[];
  group.traverse(o=>{
    if(o.isMesh){
      let g=o.geometry.clone();if(g.index)g=g.toNonIndexed();g.applyMatrix4(o.matrixWorld);
      if(!g.attributes.uv){const n=g.attributes.position.count;g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(n*2),2));}
      const arr=byMat.get(o.material)||[];arr.push(g);byMat.set(o.material,arr);
    } else if(o.isLight){lights.push(o);}
  });
  const out=new THREE.Group();out.position.copy(group.position);out.rotation.copy(group.rotation);out.scale.copy(group.scale);
  // geometries were baked in world space; undo the group's own transform
  const inv=new THREE.Matrix4().copy(group.matrixWorld).invert();
  byMat.forEach((geos,mat)=>{
    const merged=BGU.mergeGeometries(geos,false);
    merged.applyMatrix4(inv);
    const m=new THREE.Mesh(merged,mat);m.castShadow=true;m.receiveShadow=true;out.add(m);
    geos.forEach(g=>g.dispose());
  });
  lights.forEach(l=>{
    const m=new THREE.Matrix4().multiplyMatrices(inv,l.matrixWorld);
    m.decompose(l.position,l.quaternion,l.scale);out.add(l);
  });
  return out;
}

/* Collapse every static mesh sharing a material into one draw call. */
function batchStatics(){
  scene.updateMatrixWorld(true);
  const isDyn=o=>{let p=o;while(p){if(p.userData.dynamic)return true;p=p.parent;}return false;};
  const batches=new Map();
  scene.traverse(o=>{
    if(!o.isMesh||o.isInstancedMesh)return;
    const m=o.material;
    if(!m||m.isShaderMaterial||m.vertexColors||isDyn(o))return;
    const arr=batches.get(m)||[];arr.push(o);batches.set(m,arr);
  });
  let saved=0;
  for(const[mat,list]of batches){
    if(list.length<2)continue;
    const bySig=new Map();
    for(const o of list){
      const g=o.geometry.clone();const ng=g.index?g.toNonIndexed():g;
      if(ng!==g)g.dispose();
      ng.applyMatrix4(o.matrixWorld);
      if(!ng.attributes.uv){const n=ng.attributes.position.count;ng.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(n*2),2));}
      const sig=Object.keys(ng.attributes).sort().join(',');
      const arr=bySig.get(sig)||[];arr.push({g:ng,o});bySig.set(sig,arr);
    }
    for(const items of bySig.values()){
      if(items.length<2){items[0].g.dispose();continue;}
      const merged=BGU.mergeGeometries(items.map(it=>it.g),false);
      items.forEach(it=>it.g.dispose());
      if(!merged)continue;
      const mesh=new THREE.Mesh(merged,mat);
      mesh.castShadow=items.some(it=>it.o.castShadow);
      mesh.receiveShadow=items.some(it=>it.o.receiveShadow);
      scene.add(mesh);
      items.forEach(it=>it.o.removeFromParent());
      saved+=items.length-1;
    }
  }
  S.stats.batched=saved;
}

  {pts:[[0,-13.4],[-2,-21],[-5,-28],[-7.4,-33]],w:2.7},          // church
  {pts:[[13.4,-1],[24,-5],[36,-15],[46,-25],[51.5,-30]],w:2.6},  // mill

  {pts:[[9,-10.5],[16,-19],[22,-28]],w:2.1},                     // north-east lane

function buildPaths(){
  const ring=[];for(let i=0;i<=48;i++){const a=i/48*Math.PI*2;ring.push([Math.cos(a)*17.6,Math.sin(a)*17.6]);}
  PATHS.push({pts:ring,w:2.2,ring:true});
  const mat=MAT.dirt.clone();
  for(const p of PATHS){
    const v=p.pts.map(q=>new THREE.Vector2(q[0],q[1]));
    const curve=new THREE.SplineCurve(v);
    const len=curve.getLength();const n=Math.max(8,Math.floor(len/1.1));
    const posA=[],uvA=[],idx=[];
    for(let i=0;i<=n;i++){const t=i/n;const pt=curve.getPoint(t);const tan=curve.getTangent(t);
      const nx=-tan.y,nz=tan.x;const hw=p.w/2;
      for(const s of[-1,0,1]){const x=pt.x+nx*hw*s,z=pt.y+nz*hw*s;
        posA.push(x,terrainH(x,z)+(s===0?.085:.05),z);uvA.push((s+1)/2,t*len/3);}
      if(i<n){const a=i*3;idx.push(a,a+3,a+1,a+1,a+3,a+4,a+1,a+4,a+2,a+2,a+4,a+5);}
      if(!p.ring||i<n){}
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(posA,3));
    geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvA,2));
    geo.setIndex(idx);geo.computeVertexNormals();
    const m=new THREE.Mesh(geo,mat);m.receiveShadow=true;scene.add(m);
    for(let i=0;i<p.pts.length-1;i++)S.pathSegs.push({ax:p.pts[i][0],az:p.pts[i][1],bx:p.pts[i+1][0],bz:p.pts[i+1][1]});
    if(p.ring)for(let i=0;i<p.pts.length-1;i++)S.pathSegs.push({ax:p.pts[i][0],az:p.pts[i][1],bx:p.pts[i+1][0],bz:p.pts[i+1][1]});
  }
}

const PLASTERS=[0xf2e8d8,0xe8cf9e,0xe8c4b0,0xd4dcc0,0xccd4d8,0xf5efe2,0xe3d3c2];
function buildHouse(o){
  const {x,z,ry,w,d,floors}=o;
  const y0=terrainH(x,z);
  const g=new THREE.Group();g.position.set(x,y0,z);g.rotation.y=ry;
  const plaster=MAT.plaster.clone();plaster.color.set(o.plaster);
  const roofMat=o.roof==='thatch'?MAT.thatch:(o.roof==='slate'?MAT.slate:MAT.tile);
  const j=.27,fh0=2.55,fh1=2.3;
  g.add(box(w+.36,.62,d+.36,MAT.stone,0,.18,0));
  let y=.45;
  for(let f=0;f<floors;f++){
    const W=w+f*j*2,D=d+f*j*2,fh=f?fh1:fh0;
    g.add(box(W,fh,D,plaster,0,y+fh/2,0));
    const hw=W/2,hd=D/2;
    // corner posts
    for(const sx of[-1,1])for(const sz of[-1,1])g.add(box(.19,fh,.19,MAT.oak,sx*(hw-.05),y+fh/2,sz*(hd-.05)));
    // rails top & bottom on all faces
    for(const yy of[y+.1,y+fh-.1]){
      g.add(box(W,.17,.15,MAT.oak,0,yy,hd));g.add(box(W,.17,.15,MAT.oak,0,yy,-hd));
      g.add(box(.15,.17,D,MAT.oak,hw,yy,0));g.add(box(.15,.17,D,MAT.oak,-hw,yy,0));}
    // mid rail + studs front/back
    g.add(box(W,.13,.13,MAT.oak,0,y+fh*.55,hd));g.add(box(W,.13,.13,MAT.oak,0,y+fh*.55,-hd));
    const nSt=Math.max(2,Math.round(W/1.25));
    for(let i=1;i<nSt;i++){const sx=-W/2+i*W/nSt;
      g.add(box(.12,fh-.3,.12,MAT.oak,sx,y+fh/2,hd));g.add(box(.12,fh-.3,.12,MAT.oak,sx,y+fh/2,-hd));}
    const nSd=Math.max(1,Math.round(D/1.4));
    for(let i=1;i<nSd;i++){const sz=-D/2+i*D/nSd;
      g.add(box(.12,fh-.3,.12,MAT.oak,hw,y+fh/2,sz));g.add(box(.12,fh-.3,.12,MAT.oak,-hw,y+fh/2,sz));}
    // diagonal braces
    for(const sz of[-1,1])for(const sx of[-1,1]){
      const br=box(.12,fh*.72,.12,MAT.oak,sx*(W/2-.62),y+fh*.42,sz*hd);
      br.rotation.z=sx*sz*.62;g.add(br);}
    // windows
    const lit=()=>rng()<o.litP;
    if(f===0){addDoor(g,-w*.2,D/2+.02,0);addWindow(g,w*.24,y+1.45,D/2+.07,0,lit());}
    else{addWindow(g,-w*.22,y+1.25,D/2+.07,0,lit());addWindow(g,w*.24,y+1.25,D/2+.07,0,lit());}
    addWindow(g,-w*.18,y+fh*.55,-D/2-.07,Math.PI,lit());
    if(floors>1||w>5)addWindow(g,w*.25,y+fh*.55,-D/2-.07,Math.PI,lit());
    addWindow(g,W/2+.07,y+fh*.55,d*.12,Math.PI/2,lit(),.55,.75);
    if(rng()<.4)addWindow(g,-W/2-.07,y+fh*.55,-d*.15,-Math.PI/2,lit(),.55,.75);
    // flower box
    if(f===1&&rng()<.55){const fb=box(.8,.16,.22,MAT.oak,w*.24,y+.62,D/2+.16);g.add(fb);
      for(let k=0;k<4;k++){const fl=new THREE.Mesh(new THREE.SphereGeometry(.07,6,5),
        std({color:pick([0xc2453a,0xd77ba0,0xe8e0c8,0xe2a63d]),roughness:.9}));
        fl.position.set(w*.24-.27+k*.18,y+.76,D/2+.16);g.add(fl);}}
    y+=fh;
  }
  // roof
  const W=w+(floors-1)*j*2,D=d+(floors-1)*j*2;
  const thatch=o.roof==='thatch';
  const pitch=thatch?52:47,th=thatch?.4:.15;
  const half=D/2+.55,rh=Math.tan(pitch*Math.PI/180)*(D/2),slope=half/Math.cos(pitch*Math.PI/180);
  for(const s of[-1,1]){
    const geo=new THREE.BoxGeometry(W+1.1,th,slope);scaleUV(geo,(W+1.1)/2.1,slope/2.1);
    const panel=new THREE.Mesh(geo,roofMat);panel.castShadow=true;panel.receiveShadow=true;
    panel.position.set(0,y+rh/2+th/2-.06,s*(half/2-.03));panel.rotation.x=s*pitch*Math.PI/180;
    g.add(panel);}
  if(thatch){const roll=cyl(.24,.24,W+1.15,MAT.thatch,10);roll.rotation.z=Math.PI/2;
    roll.position.set(0,y+rh+.12,0);g.add(roll);}
  else g.add(box(W+1.16,.17,.34,roofMat,0,y+rh+.08,0));
  // gable ends (plaster triangle + king post)
  for(const s of[-1,1]){
    const sh=new THREE.Shape();sh.moveTo(-D/2,0);sh.lineTo(D/2,0);sh.lineTo(0,rh);sh.closePath();
    const gg=new THREE.ShapeGeometry(sh);
    const gm=new THREE.Mesh(gg,plaster);gm.castShadow=true;
    gm.position.set(s*(W/2+.01),y,0);gm.rotation.y=s*Math.PI/2;g.add(gm);
    g.add(box(.14,rh,.14,MAT.oak,s*(W/2+.05),y+rh/2,0));
    for(const sz of[-1,1]){const st=box(.11,rh*.62,.11,MAT.oak,s*(W/2+.05),y+rh*.3,sz*D*.22);
      st.rotation.x=sz*.5;g.add(st);}
    g.add(box(.12,.12,D,MAT.oak,s*(W/2+.05),y+.06,0));
  }
  // chimney
  if(o.chimney!==false){
    const cx=w*.26,cz=-d*.16,chH=y+rh+1.0;
    g.add(box(.78,chH,.78,MAT.stone,cx,chH/2,cz));
    g.add(box(.98,.14,.98,MAT.stone,cx,chH+.07,cz));
    g.add(box(.5,.1,.5,std({color:0x1a120c,roughness:1}),cx,chH+.15,cz));
    const top=new THREE.Vector3(cx,chH+.3,cz);g.updateMatrixWorld(true);
    S.chimneys.push(g.localToWorld(top.clone()));
  }
  // inn extras
  if(o.inn){
    const arm=box(.07,.07,1.0,MAT.iron,-w*.2,3.35,D/2+.5);g.add(arm);
    const sign=new THREE.Mesh(new THREE.PlaneGeometry(1.35,.68),
      std({map:TEX.sign,roughness:.85,side:THREE.DoubleSide}));
    sign.position.set(-w*.2,2.85,D/2+.92);sign.castShadow=true;g.add(sign);
    for(const sx of[-.5,.5]){const ch=cyl(.015,.015,.2,MAT.iron,5);
      ch.position.set(-w*.2+sx,3.26,D/2+.92);g.add(ch);}
    addLantern(g,w*.34,2.5,D/2+.22,true);
  }
  const merged=mergeGroup(g);scene.add(merged);
  S.obstacles.push({x,z,r:Math.hypot(w,d)/2+1.0});
  S.stats.houses++;
  return merged;
}

/* ---------- fences ---------- */
function fenceRun(pts,gapAt=-1){
  const g=new THREE.Group();
  for(let i=0;i<pts.length-1;i++){
    if(i===gapAt)continue;
    const[ax,az]=pts[i],[bx,bz]=pts[i+1];
    const L=Math.hypot(bx-ax,bz-az),n=Math.max(1,Math.round(L/1.6));
    const ry=Math.atan2(bx-ax,bz-az);
    for(let k=0;k<=n;k++){const t=k/n,x=lerp(ax,bx,t),z=lerp(az,bz,t);
      g.add(box(.13,1.05,.13,MAT.oak,x,terrainH(x,z)+.5,z));}
    for(const yy of[.42,.85]){const rail=box(.08,.1,L,MAT.oak,(ax+bx)/2,0,(az+bz)/2);
      rail.position.y=(terrainH(ax,az)+terrainH(bx,bz))/2+yy;rail.rotation.y=ry;g.add(rail);}
  }
  return g;
}
function rectPts(cx,cz,w,d){return[[cx-w/2,cz-d/2],[cx+w/2,cz-d/2],[cx+w/2,cz+d/2],[cx-w/2,cz+d/2],[cx-w/2,cz-d/2]];}
function buildFences(){
  const all=new THREE.Group();
  all.add(fenceRun(rectPts(FIELD.x,FIELD.z,FIELD.w+2,FIELD.d+2),1));
  all.add(fenceRun(rectPts(PASTURE.x,PASTURE.z,PASTURE.w+2,PASTURE.d+2),2));
  all.add(fenceRun([[18,26],[24,28],[28,33]],-1));
  all.add(fenceRun([[-16,28],[-22,31],[-26,36]],-1));
  all.add(fenceRun([[-46,12],[-50,16],[-52,22]],-1));
  scene.add(mergeGroup(all));
  S.stats.fenceRuns=5;
}

   Alderglen — lake, vegetation, clouds (all instanced/procedural)

let water=null, boat=null, boatBase={x:0,z:0};
const clouds=[];

/* wind sway injected into instanced materials */
function addSway(mat,strength,heightRef){
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uTime={value:0};sh.uniforms.uWind={value:S.wind};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nuniform float uTime;uniform float uWind;')
      .replace('#include <begin_vertex>',`#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec3 ip=vec3(instanceMatrix[3][0],instanceMatrix[3][1],instanceMatrix[3][2]);
          float ph=ip.x*.35+ip.z*.27;
          float sw=sin(uTime*1.7+ph)+sin(uTime*2.9+ph*1.7)*.5;
          float amt=uWind*${strength.toFixed(3)}*smoothstep(0.,${heightRef.toFixed(2)},transformed.y);
          transformed.x+=sw*amt*.22;transformed.z+=cos(uTime*1.3+ph)*amt*.14;
        #endif`);
    S.swayShaders.push(sh);
  };
}

/* ---------- lake ---------- */
function buildLake(){
  const geo=new THREE.CircleGeometry(LAKE.r+5,56);
  water=new Water(geo,{
    textureWidth:1024,textureHeight:1024,
    waterNormals:TEX.waterN,
    sunDirection:sunDirFromDusk(S.dusk).clone(),
    sunColor:0xffc27d,waterColor:0x35544a,
    distortionScale:2.4,fog:true,alpha:.96
  });
  water.rotation.x=-Math.PI/2;
  water.position.set(LAKE.x,WATER_Y,LAKE.z);
  water.material.uniforms.size.value=4.5;
  scene.add(water);

  /* dock: find the shore along a ray toward the lake centre */
  const from=V3(-30,0,18),dir=V3(LAKE.x-from.x,0,LAKE.z-from.z).normalize();
  let shoreT=0;
  for(let t=0;t<40;t+=.5){const p=from.clone().addScaledVector(dir,t);
    if(terrainH(p.x,p.z)<WATER_Y+.3){shoreT=t;break;}}
  const shore=from.clone().addScaledVector(dir,Math.max(0,shoreT-1.2));
  const dock=new THREE.Group();
  dock.position.set(shore.x,0,shore.z);
  dock.rotation.y=Math.atan2(dir.x,dir.z);
  const deckY=WATER_Y+.85;
  for(let i=0;i<9;i++){
    const pz=i*.82;const gy=terrainH(shore.x+dir.x*pz,shore.z+dir.z*pz);
    const plankY=Math.max(deckY,gy+.35);
    dock.add(box(1.7,.09,.74,MAT.plank,0,plankY,pz,rand(-.02,.02)));
    if(i%2===0)for(const sx of[-1,1]){
      const post=cyl(.09,.11,plankY-gy+1.4,MAT.oak,7);
      post.position.set(sx*.78,(plankY+gy-1.4)/2+.35,pz);dock.add(post);}
  }
  const bollard=cyl(.08,.1,.5,MAT.oak,7);bollard.position.set(.7,deckY+.3,6.9);dock.add(bollard);
  scene.add(mergeGroup(dock));

  /* rowboat, moored past the dock end */
  const tip=shore.clone().addScaledVector(dir,8.6);
  const side=V3(-dir.z,0,dir.x);
  boatBase={x:tip.x+side.x*2.1,z:tip.z+side.z*2.1};
  boat=new THREE.Group();
  const hullPts=[];for(const[px,py]of[[0,0],[.62,.03],[.95,.18],[1.1,.46],[1.14,.72],[1.02,.8]])hullPts.push(new THREE.Vector2(px,py));
  const hull=new THREE.Mesh(new THREE.LatheGeometry(hullPts,18),std({map:TEX.plank,color:0x8a5a30,roughness:.85,side:THREE.DoubleSide}));
  hull.scale.set(.62,.8,1.75);hull.castShadow=true;boat.add(hull);
  const floor=box(.9,.06,2.6,MAT.pale,0,.18,0);boat.add(floor);
  for(const zz of[-.7,.55])boat.add(box(1.05,.07,.3,MAT.pale,0,.52,zz));
  const rim=new THREE.Mesh(new THREE.TorusGeometry(1.06,.05,6,24),MAT.oak);
  rim.rotation.x=Math.PI/2;rim.scale.set(.62,1.75,1);rim.position.y=.63;boat.add(rim);
  for(const s of[-1,1]){const oar=box(.07,.05,2.3,MAT.pale,s*.62,.6,.2);oar.rotation.y=s*.35;oar.rotation.x=.16;boat.add(oar);
    const blade=box(.16,.04,.5,MAT.pale,s*1.0,.42,1.25);blade.rotation.y=s*.35;boat.add(blade);}
  boat.position.set(boatBase.x,WATER_Y+.1,boatBase.z);
  boat.userData.dynamic=true;
  boat.rotation.y=Math.atan2(dir.x,dir.z)+.35;
  scene.add(boat);

  /* shore rocks + pebbles */
  const rockGeo=new THREE.DodecahedronGeometry(1,0);
  const rockMat=std({color:0x8a8478,roughness:.98});
  const rocks=new THREE.InstancedMesh(rockGeo,rockMat,90);
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),E=new THREE.Euler(),P=new THREE.Vector3(),Sc=new THREE.Vector3();
  let placed=0,guard=0;
  while(placed<90&&guard++<4000){
    const a=rand(Math.PI*2),rr=LAKE.r+rand(-3,7);
    const x=LAKE.x+Math.cos(a)*rr,z=LAKE.z+Math.sin(a)*rr;
    const h=terrainH(x,z);if(h<WATER_Y-.6||h>WATER_Y+2.2)continue;
    if(Math.hypot(x-shore.x,z-shore.z)<3.5)continue;
    const s=rand(.25,1.0);
    E.set(rand(6.28),rand(6.28),rand(6.28));Q.setFromEuler(E);
    P.set(x,h+s*.18,z);Sc.set(s*rand(.8,1.4),s*rand(.5,.8),s*rand(.8,1.4));
    M.compose(P,Q,Sc);rocks.setMatrixAt(placed,M);
    rocks.setColorAt(placed,new THREE.Color().setHSL(.09,rand(.04,.12),rand(.4,.62)));
    placed++;
  }
  rocks.count=placed;rocks.castShadow=true;rocks.receiveShadow=true;
  if(rocks.instanceColor)rocks.instanceColor.needsUpdate=true;
  scene.add(rocks);
  S.stats.rocks=placed;
}

/* ---------- trees ---------- */
function canopyBlob(r,detail=1){return new THREE.IcosahedronGeometry(r,detail);}
function buildTrees(){
  const trunkMat=MAT.bark,leafMat=MAT.leaf;
  addSway(leafMat,.5,2.5);
  const archetypes=[
    {trunk:(()=>{const g=new THREE.CylinderGeometry(.16,.3,2.8,7);g.translate(0,1.4,0);return g;})(),
     canopy:(()=>{const a=canopyBlob(1.7);a.translate(0,3.6,0);
       const b=canopyBlob(1.25);b.translate(1.05,3.0,.4);
       const c=canopyBlob(1.15);c.translate(-.9,3.2,-.55);
       const d=canopyBlob(1.0);d.translate(.15,4.5,-.2);
       return BGU.mergeGeometries([a,b,c,d],false);})(),s:[.8,1.5]},
    {trunk:(()=>{const g=new THREE.CylinderGeometry(.12,.22,3.6,6);g.translate(0,1.8,0);return g;})(),
     canopy:(()=>{const a=canopyBlob(1.15);a.scale(1,1.9,1);a.translate(0,4.6,0);
       const b=canopyBlob(.8);b.scale(1,1.5,1);b.translate(.35,3.2,.2);
       return BGU.mergeGeometries([a,b],false);})(),s:[.8,1.35]},
    {trunk:(()=>{const g=new THREE.CylinderGeometry(.14,.24,1.9,6);g.translate(0,.95,0);return g;})(),
     canopy:(()=>{const a=canopyBlob(1.85);a.scale(1,.78,1);a.translate(0,2.7,0);
       const b=canopyBlob(1.1);b.translate(.9,2.3,.5);
       return BGU.mergeGeometries([a,b],false);})(),s:[.7,1.15]}
  ];
  const spots=[];let guard=0;
  while(spots.length<92&&guard++<9000){
    const a=rand(Math.PI*2),d=rand(20,112);
    const x=Math.cos(a)*d,z=Math.sin(a)*d;
    if(blocked(x,z,2.4)||nearPath(x,z,3.2))continue;
    if(terrainH(x,z)<WATER_Y+.7)continue;
    if(inRect(x,z,FIELD,1.5)||inRect(x,z,PASTURE,1.5))continue;
    if(Math.hypot(x-MILL.x,z-MILL.z)<10)continue;
    if(Math.hypot(x-CHURCH.x,z-CHURCH.z)<17)continue;
    if(Math.hypot(x-boatBase.x,z-boatBase.z)<5)continue;
    let ok=true;for(const p of spots){if((x-p.x)**2+(z-p.z)**2<16){ok=false;break;}}
    if(!ok)continue;
    spots.push({x,z,t:randInt(0,2),s:rand(.8,1.5),ry:rand(6.28)});
  }
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),P=new THREE.Vector3(),Sc=new THREE.Vector3();
  archetypes.forEach((ar,ti)=>{
    const list=spots.filter(p=>p.t===ti);if(!list.length)return;
    const trunks=new THREE.InstancedMesh(ar.trunk,trunkMat,list.length);
    const cans=new THREE.InstancedMesh(ar.canopy,leafMat,list.length);
    list.forEach((p,i)=>{
      const s=p.s*rand(ar.s[0],ar.s[1]);
      Q.setFromEuler(new THREE.Euler(0,p.ry,0));
      P.set(p.x,terrainH(p.x,p.z)-.12,p.z);Sc.set(s,s*rand(.9,1.15),s);
      M.compose(P,Q,Sc);trunks.setMatrixAt(i,M);cans.setMatrixAt(i,M);
      cans.setColorAt(i,new THREE.Color().setHSL(rand(.16,.24),rand(.35,.55),rand(.3,.44)));
    });
    trunks.castShadow=true;trunks.receiveShadow=true;
    cans.castShadow=true;cans.receiveShadow=true;
    if(cans.instanceColor)cans.instanceColor.needsUpdate=true;
    scene.add(trunks);scene.add(cans);
  });
  S.stats.trees=spots.length;

  /* bushes */
  const bushGeo=canopyBlob(.7);bushGeo.scale(1,.72,1);bushGeo.translate(0,.4,0);
  const bushes=new THREE.InstancedMesh(bushGeo,leafMat,150);
  let bn=0;guard=0;
  while(bn<150&&guard++<6000){
    const a=rand(Math.PI*2),d=rand(15,95);
    const x=Math.cos(a)*d,z=Math.sin(a)*d;
    if(blocked(x,z,.6)||terrainH(x,z)<WATER_Y+.6)continue;
    if(inRect(x,z,FIELD,.5))continue;
    const s=rand(.5,1.25);
    Q.setFromEuler(new THREE.Euler(0,rand(6.28),0));
    P.set(x,terrainH(x,z),z);Sc.set(s*rand(.9,1.4),s,s*rand(.9,1.4));
    M.compose(P,Q,Sc);bushes.setMatrixAt(bn,M);
    bushes.setColorAt(bn,new THREE.Color().setHSL(rand(.17,.26),rand(.3,.5),rand(.26,.4)));
    bn++;
  }
  bushes.count=bn;bushes.castShadow=true;bushes.receiveShadow=true;
  if(bushes.instanceColor)bushes.instanceColor.needsUpdate=true;
  scene.add(bushes);

  /* distant horizon silhouettes */
  const cone=new THREE.ConeGeometry(1,1,7);cone.translate(0,.5,0);
  const stick=new THREE.CylinderGeometry(.06,.09,.3,5);stick.translate(0,.15,0);
  const silGeo=BGU.mergeGeometries([cone.toNonIndexed(),stick.toNonIndexed()],false);
  const silMat=std({color:0x46503a,roughness:1});
  const sil=new THREE.InstancedMesh(silGeo,silMat,300);
  for(let i=0;i<300;i++){
    const a=rand(Math.PI*2),d=rand(128,250);
    const x=Math.cos(a)*d,z=Math.sin(a)*d;
    const h=rand(7,17),w=h*rand(.3,.45);
    Q.setFromEuler(new THREE.Euler(0,rand(6.28),0));
    P.set(x,terrainH(x,z)-.3,z);Sc.set(w,h,w);
    M.compose(P,Q,Sc);sil.setMatrixAt(i,M);
    sil.setColorAt(i,new THREE.Color().setHSL(rand(.2,.28),rand(.18,.34),rand(.2,.32)));
  }
  if(sil.instanceColor)sil.instanceColor.needsUpdate=true;
  scene.add(sil);
}
function inRect(x,z,r,pad=0){
  const dx=x-r.x,dz=z-r.z,c=Math.cos(-r.ry),s=Math.sin(-r.ry);
  const lx=dx*c-dz*s,lz=dx*s+dz*c;
  return Math.abs(lx)<r.w/2+pad&&Math.abs(lz)<r.d/2+pad;
}

/* ---------- instanced meadow: grass, flowers, wheat, reeds ---------- */
let grassMesh=null;
const bladeGeo=(()=>{
  const p1=new THREE.PlaneGeometry(1.15,1,1,2);p1.translate(0,.5,0);
  const p2=p1.clone();p2.rotateY(Math.PI/2);
  const p3=p1.clone();p3.rotateY(Math.PI/4);
  return BGU.mergeGeometries([p1.toNonIndexed(),p2.toNonIndexed(),p3.toNonIndexed()],false);
})();
function scatter(count,test){
  const out=[];let guard=0;
  while(out.length<count&&guard++<count*30){
    const a=rand(Math.PI*2),d=Math.sqrt(rng())*118;
    const x=Math.cos(a)*d,z=Math.sin(a)*d;
    if(test(x,z))out.push({x,z});
  }
  return out;
}
function buildGrass(count){
  if(grassMesh){scene.remove(grassMesh);grassMesh.dispose();}
  addSwayOnce(MAT.blade,1.0,1.0);
  const pts=scatter(count,(x,z)=>!blocked(x,z,.4)&&!nearPath(x,z,1.7)&&terrainH(x,z)>WATER_Y+.5&&!inRect(x,z,FIELD,.3));
  grassMesh=new THREE.InstancedMesh(bladeGeo,MAT.blade,pts.length);
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),P=new THREE.Vector3(),Sc=new THREE.Vector3();
  pts.forEach((p,i)=>{
    const s=rand(.5,1.25);
    Q.setFromEuler(new THREE.Euler(0,rand(6.28),0));
    P.set(p.x,terrainH(p.x,p.z)-.03,p.z);Sc.set(s,s*rand(.8,1.4),s);
    M.compose(P,Q,Sc);grassMesh.setMatrixAt(i,M);
    grassMesh.setColorAt(i,new THREE.Color().setHSL(rand(.15,.23),rand(.35,.6),rand(.3,.5)));
  });
  grassMesh.receiveShadow=true;
  grassMesh.layers.set(1); // main camera only: keep meadow out of the water reflection pass

const swayDone=new Set();
function addSwayOnce(mat,s,h){if(swayDone.has(mat))return;swayDone.add(mat);addSway(mat,s,h);}
function buildFlowers(){
  addSwayOnce(MAT.flower,.8,.6);
  const pts=scatter(1500,(x,z)=>!blocked(x,z,.5)&&!nearPath(x,z,2)&&terrainH(x,z)>WATER_Y+.6&&!inRect(x,z,FIELD,.3)&&Math.hypot(x,z)>15);
  const fm=new THREE.InstancedMesh(bladeGeo,MAT.flower,pts.length);

function buildWheat(){
  const stem=new THREE.CylinderGeometry(.016,.026,1.05,4);stem.translate(0,.52,0);
  const ear=new THREE.CylinderGeometry(.045,.02,.3,5);ear.translate(0,1.16,0);
  const awn=new THREE.ConeGeometry(.05,.22,4);awn.translate(0,1.38,0);
  const wheatGeo=BGU.mergeGeometries([stem.toNonIndexed(),ear.toNonIndexed(),awn.toNonIndexed()],false);
  addSwayOnce(MAT.wheat,1.1,1.1);
  const n=4600;
  const wm=new THREE.InstancedMesh(wheatGeo,MAT.wheat,n);
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),P=new THREE.Vector3(),Sc=new THREE.Vector3();
  const c=Math.cos(FIELD.ry),s=Math.sin(FIELD.ry);
  let i=0;
  const rows=Math.floor(FIELD.w/.34);
  for(let r=0;r<rows&&i<n;r++){
    const lx=-FIELD.w/2+.2+r*.34+rand(-.06,.06);
    const perRow=Math.floor(n/rows);
    for(let k=0;k<perRow&&i<n;k++){
      const lz=-FIELD.d/2+.2+(k+rand(-.3,.3))*(FIELD.d-.4)/perRow;
      const x=FIELD.x+lx*c-lz*s,z=FIELD.z+lx*s+lz*c;
      const sc=rand(.75,1.2);
      Q.setFromEuler(new THREE.Euler(rand(-.06,.06),rand(6.28),rand(-.06,.06)));
      P.set(x,terrainH(x,z)-.02,z);Sc.set(sc,sc*rand(.9,1.15),sc);
      M.compose(P,Q,Sc);wm.setMatrixAt(i,M);
      wm.setColorAt(i,new THREE.Color().setHSL(rand(.1,.14),rand(.5,.72),rand(.42,.6)));
      i++;
    }
  }
  wm.count=i;wm.receiveShadow=true;wm.layers.set(1);
  if(wm.instanceColor)wm.instanceColor.needsUpdate=true;
  scene.add(wm);S.stats.wheat=i;
}
function buildReeds(){
  const p1=new THREE.PlaneGeometry(.5,1.9,1,2);p1.translate(0,.95,0);
  const p2=p1.clone();p2.rotateY(Math.PI/2.4);
  const spike=new THREE.CylinderGeometry(.035,.045,.34,5);spike.translate(.1,1.95,0);
  const reedGeo=BGU.mergeGeometries([p1.toNonIndexed(),p2.toNonIndexed(),spike.toNonIndexed()],false);
  addSwayOnce(MAT.reed,1.3,1.6);
  const pts=[];let guard=0;
  while(pts.length<620&&guard++<20000){
    const a=rand(Math.PI*2),rr=LAKE.r+rand(-4.5,4);
    const x=LAKE.x+Math.cos(a)*rr,z=LAKE.z+Math.sin(a)*rr;
    const h=terrainH(x,z);
    if(h>WATER_Y-.35&&h<WATER_Y+1.1)pts.push({x,z,h});
  }
  const rm=new THREE.InstancedMesh(reedGeo,MAT.reed,pts.length);
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),P=new THREE.Vector3(),Sc=new THREE.Vector3();
  pts.forEach((p,i)=>{
    const s=rand(.6,1.2);
    Q.setFromEuler(new THREE.Euler(0,rand(6.28),0));
    P.set(p.x,Math.max(p.h,WATER_Y-.3)-.05,p.z);Sc.set(s,s*rand(.8,1.3),s);
    M.compose(P,Q,Sc);rm.setMatrixAt(i,M);
    rm.setColorAt(i,new THREE.Color().setHSL(rand(.16,.24),rand(.3,.5),rand(.24,.4)));
  });
  if(rm.instanceColor)rm.instanceColor.needsUpdate=true;
  scene.add(rm);S.stats.reeds=pts.length;
}

/* ---------- clouds (instanced billboards) ---------- */
let cloudMesh=null;const cloudPuffs=[];
const _cm=new THREE.Matrix4(),_cp=V3(),_cs=V3();
function buildClouds(){
  const mat=new THREE.MeshBasicMaterial({map:TEX.cloud,transparent:true,depthWrite:false,opacity:.68,side:THREE.DoubleSide});
  for(let i=0;i<12;i++){

    const c={a,r,y,yy:y,x:Math.cos(a)*r,z:Math.sin(a)*r,speed:rand(.0035,.0085)*(rng()<.5?1:-1),phase:rand(6.28)};
    clouds.push(c);
    const n=randInt(4,7);
    for(let k=0;k<n;k++){
      const w=rand(26,64);
      cloudPuffs.push({c,ox:rand(-30,30),oy:rand(-6,6),oz:rand(-16,16),w,h:w*rand(.4,.55),shade:rand(.86,1)});
    }
  }
  cloudMesh=new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1),mat,cloudPuffs.length);

/* ---------- per-frame nature update ---------- */
function updateNature(dt,t){
  if(water)water.material.uniforms.time.value+=dt*.55;
  if(boat){
    boat.position.y=WATER_Y+.1+Math.sin(t*.9)*.05+Math.sin(t*1.7)*.02;
    boat.rotation.z=Math.sin(t*.8)*.03;
    boat.rotation.x=Math.sin(t*.6+1)*.025;
  }
  const dusk=S.dusk;
  if(cloudMesh){
    const dayC=new THREE.Color(1,.96,.9),duskC=new THREE.Color(.9,.55,.5);
    cloudMesh.material.color.copy(dayC).lerp(duskC,dusk);
    cloudMesh.material.opacity=lerp(.68,.5,dusk);
    for(const c of clouds){
      c.a+=dt*c.speed*(.4+S.wind);
      c.x=Math.cos(c.a)*c.r;c.z=Math.sin(c.a)*c.r;
      c.yy=c.y+Math.sin(t*.05+c.phase)*3;
    }
    const q=camera.quaternion;
    for(let i=0;i<cloudPuffs.length;i++){
      const p=cloudPuffs[i];
      _cm.compose(_cp.set(p.c.x+p.ox,p.c.yy+p.oy,p.c.z+p.oz),q,_cs.set(p.w,p.h,1));
      cloudMesh.setMatrixAt(i,_cm);
    }
    cloudMesh.instanceMatrix.needsUpdate=true;
  }
}

const vPartMeshes=[], vPartEntries=new Map();
function vNode(parent,key,x,y,z,tint){

function makeVillager(opts={}){

function finishVillagerInstances(){
  for(const[key,entries]of vPartEntries){
    const def=VPARTS[key];
    const mesh=new THREE.InstancedMesh(def.geo(),def.mat(),entries.length);
    mesh.castShadow=true;mesh.receiveShadow=true;mesh.frustumCulled=false;
    if(def.tint){entries.forEach((e,i)=>mesh.setColorAt(i,e.tint));mesh.instanceColor.needsUpdate=true;}

/* ---------- walking routes along the actual paths ---------- */
function routeFrom(pts,offset=.55){
  const fwd=pts.map(p=>V3(p[0],0,p[1]));
  const back=pts.slice(1,-1).reverse().map((p,i)=>{
    const q=pts[pts.length-2-i]||p;
    const dx=p[0]-q[0],dz=p[1]-q[1],L=Math.hypot(dx,dz)||1;
    return V3(p[0]-dz/L*offset,0,p[1]+dx/L*offset);});
  const all=fwd.concat(back);
  const c=new THREE.CatmullRomCurve3(all,true,'catmullrom',.35);
  return {curve:c,len:c.getLength()};
}
function buildVillagers(){
  const ring=[];for(let i=0;i<24;i++){const a=i/24*Math.PI*2;ring.push(V3(Math.cos(a)*17.6,0,Math.sin(a)*17.6));}
  const ringCurve=new THREE.CatmullRomCurve3(ring,true,'catmullrom',.5);
  const routes=[
    {r:{curve:ringCurve,len:ringCurve.getLength()},n:4},
    {r:routeFrom(PATHS[0].pts),n:2},   // church
    {r:routeFrom(PATHS[1].pts),n:2},   // mill
    {r:routeFrom(PATHS[5].pts),n:2},   // lake dock
    {r:routeFrom([[1,13.4],[3,23],[6,32],[10,38],[20,41],[29,42]]),n:2}, // field
    {r:{curve:new THREE.CatmullRomCurve3([V3(6,0,2),V3(2,0,7),V3(-5,0,6),V3(-7,0,-1),V3(-2,0,-6),V3(4,0,-5)],true),len:0},n:2}, // plaza
  ];
  routes[5].r.len=routes[5].r.curve.getLength();
  let id=0;
  for(const rt of routes){
    for(let k=0;k<rt.n;k++){
      const opts={hood:rng()<.25,hat:rng()<.3,skirt:rng()<.35,basket:rng()<.22,staff:rng()<.1,child:id===7};
      const v=makeVillager(opts);
      const u=rng();const dir=rng()<.5?1:-1;
      const speed=rand(.85,1.45)*(opts.child?1.25:1);
      const p=rt.r.curve.getPointAt(u);
      v.g.position.set(p.x,terrainH(p.x,p.z),p.z);
      scene.add(v.g);
      villagers.push({...v,route:rt.r,u,dir,speed,phase:rand(6.28),mode:'walk'});
      id++;
    }
  }
  /* idle browsers at the stalls */
  for(const a of[38,128,218]){
    const rad=a*Math.PI/180;
    const x=Math.cos(rad)*12.3,z=Math.sin(rad)*12.3;
    const v=makeVillager({hat:rng()<.4,basket:rng()<.5,skirt:rng()<.4});
    v.g.position.set(x,terrainH(x,z),z);
    v.g.rotation.y=Math.atan2(-x,-z)+rand(-.4,.4);
    scene.add(v.g);
    villagers.push({...v,mode:'idle',phase:rand(6.28)});
  }
  finishVillagerInstances();
  S.stats.villagers=villagers.length;
}

/* ---------- chimney smoke (GPU points) ---------- */
function buildSmoke(){
  const per=22, origins=S.chimneys;
  const n=origins.length*per;
  const pos=new Float32Array(n*3),org=new Float32Array(n*3),seed=new Float32Array(n);
  let i=0;
  for(const o of origins)for(let k=0;k<per;k++){
    org[i*3]=o.x;org[i*3+1]=o.y;org[i*3+2]=o.z;
    pos[i*3]=o.x;pos[i*3+1]=o.y;pos[i*3+2]=o.z;
    seed[i]=rng();i++;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aOrigin',new THREE.BufferAttribute(org,3));
  geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  smokeU={uTime:{value:0},uWind:{value:S.wind},uDusk:{value:S.dusk},uMap:{value:TEX.smoke}};
  const mat=new THREE.ShaderMaterial({
    uniforms:smokeU,transparent:true,depthWrite:false,
    vertexShader:`
      uniform float uTime,uWind;attribute vec3 aOrigin;attribute float aSeed;varying float vAlpha;
      void main(){
        float life=6.5+aSeed*3.5;
        float age=fract(uTime/life+aSeed);
        vec3 p=aOrigin;
        p.y+=age*(4.4+aSeed*2.6);
        float sw=age*age;
        p.x+=sin(uTime*.7+aSeed*40.)*.32*age+uWind*sw*2.8;
        p.z+=cos(uTime*.5+aSeed*60.)*.32*age+uWind*sw*1.2;
        vAlpha=smoothstep(0.,.12,age)*(1.-smoothstep(.4,1.,age))*.44;
        vec4 mv=modelViewMatrix*vec4(p,1.);
        gl_PointSize=(13.+age*52.)*(170./-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform sampler2D uMap;uniform float uDusk;varying float vAlpha;
      void main(){
        vec4 t=texture2D(uMap,gl_PointCoord);
        vec3 col=mix(vec3(.85,.8,.76),vec3(.4,.34,.44),uDusk*.75);
        gl_FragColor=vec4(col,t.a*vAlpha);
      }`
  });
  const pts=new THREE.Points(geo,mat);pts.frustumCulled=false;
  scene.add(pts);
}

/* ---------- fireflies (dusk-gated GPU points) ---------- */
function buildFireflies(){
  const n=150;
  const pos=new Float32Array(n*3),seed=new Float32Array(n);
  let i=0,guard=0;
  while(i<n&&guard++<6000){
    const a=rand(Math.PI*2),d=rand(12,80);
    const x=Math.cos(a)*d,z=Math.sin(a)*d;
    if(terrainH(x,z)<WATER_Y+.4)continue;
    pos[i*3]=x;pos[i*3+1]=terrainH(x,z)+rand(.4,2.3);pos[i*3+2]=z;
    seed[i]=rng();i++;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  fireflyU={uTime:{value:0},uIntensity:{value:0}};
  const mat=new THREE.ShaderMaterial({
    uniforms:fireflyU,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`
      uniform float uTime,uIntensity;attribute float aSeed;varying float vGlow;
      void main(){
        vec3 p=position;
        p.x+=sin(uTime*.6+aSeed*50.)*1.1;
        p.y+=sin(uTime*.9+aSeed*80.)*.5;
        p.z+=cos(uTime*.5+aSeed*65.)*1.1;
        float blink=pow(max(0.,sin(uTime*(1.2+aSeed)+aSeed*90.)),3.);
        vGlow=blink*uIntensity;
        vec4 mv=modelViewMatrix*vec4(p,1.);
        gl_PointSize=(3.5+blink*6.)*(140./-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying float vGlow;
      void main(){
        vec2 c=gl_PointCoord-.5;float d=length(c);
        float a=smoothstep(.5,.05,d)*vGlow;
        gl_FragColor=vec4(vec3(1.,.86,.42)*a*1.6,a);
      }`
  });
  const pts=new THREE.Points(geo,mat);pts.frustumCulled=false;fireflyPts=pts;
  scene.add(pts);
}

/* ---------- birds (instanced) ---------- */
let birdMeshes=null;
function buildBirds(){
  const mat=std({color:0x2a2420,roughness:.9,side:THREE.DoubleSide});
  for(let f=0;f<2;f++){
    const cx=rand(-30,30),cz=rand(-30,30),h=rand(26,40),r=rand(22,46),sp=rand(.12,.2)*(f?-1:1);
    for(let k=0;k<7;k++){
      const g=new THREE.Group();
      const bodyN=new THREE.Object3D();g.add(bodyN);
      const wL=new THREE.Object3D(),wR=new THREE.Object3D();g.add(wL,wR);
      scene.add(g);
      birds.push({g,bodyN,wL,wR,cx,cz,h:h+rand(-3,3),r:r+rand(-5,5),a:rand(6.28),sp:sp*rand(.85,1.15),phase:rand(6.28),glide:rand(6.28)});
    }
  }
  const bodyGeo=new THREE.ConeGeometry(.09,.5,5);bodyGeo.rotateX(Math.PI/2);
  const wingGeo=new THREE.PlaneGeometry(.95,.3);wingGeo.translate(.48,0,0);

  const mk=geo=>{const m=new THREE.InstancedMesh(geo,mat,birds.length);m.frustumCulled=false;scene.add(m);return m;};
  birdMeshes={body:mk(bodyGeo),wL:mk(wingGeo),wR:mk(wingRGeo)};
  S.stats.birds=birds.length;
}

/* ---------- per-frame life update ---------- */
const _tan=V3();
function syncFigures(){
  for(const v of villagers)v.g.updateMatrixWorld(true);
  for(const p of vPartMeshes){
    for(let i=0;i<p.entries.length;i++)p.mesh.setMatrixAt(i,p.entries[i].node.matrixWorld);
    p.mesh.instanceMatrix.needsUpdate=true;
  }
  if(birdMeshes){
    for(const b of birds)b.g.updateMatrixWorld(true);
    for(let i=0;i<birds.length;i++){
      const b=birds[i];
      birdMeshes.body.setMatrixAt(i,b.bodyN.matrixWorld);
      birdMeshes.wL.setMatrixAt(i,b.wL.matrixWorld);
      birdMeshes.wR.setMatrixAt(i,b.wR.matrixWorld);
    }
    birdMeshes.body.instanceMatrix.needsUpdate=true;
    birdMeshes.wL.instanceMatrix.needsUpdate=true;
    birdMeshes.wR.instanceMatrix.needsUpdate=true;
  }
}
function updateLife(dt,t){
  /* villagers */
  for(const v of villagers){
    if(v.mode==='walk'){
      if(S.motion){
        v.u=(v.u+dt*v.speed/v.route.len*v.dir+1)%1;
        const p=v.route.curve.getPointAt(v.u);
        v.route.curve.getTangentAt(v.u,_tan);
        const ry=Math.atan2(_tan.x*v.dir,_tan.z*v.dir);
        v.g.position.set(p.x,terrainH(p.x,p.z),p.z);
        v.g.rotation.y=ry;
        const w=t*v.speed*5.2+v.phase;
        const amp=.55;
        v.legL.rotation.x=Math.sin(w)*amp;
        v.legR.rotation.x=-Math.sin(w)*amp;
        v.armL.rotation.x=-Math.sin(w)*amp*.7;
        v.armR.rotation.x=Math.sin(w)*amp*.7;
        v.g.position.y+=Math.abs(Math.sin(w))*.045;
      }
    }else{
      const sway=Math.sin(t*.7+v.phase)*.03;
      v.g.rotation.z=sway;
      v.head.rotation.y=Math.sin(t*.3+v.phase)*.35;
      v.armL.rotation.x=Math.sin(t*.5+v.phase)*.06-.05;
    }
  }
  /* windmill */
  if(millBlades&&S.motion)millBlades.rotation.z-=dt*.32*(.35+S.wind);
  /* birds */
  for(const b of birds){
    if(S.motion)b.a+=dt*b.sp;
    const x=b.cx+Math.cos(b.a)*b.r,z=b.cz+Math.sin(b.a)*b.r;
    const y=b.h+Math.sin(t*.4+b.phase)*2.2;
    b.g.position.set(x,y,z);
    const tx=-Math.sin(b.a)*Math.sign(b.sp),tz=Math.cos(b.a)*Math.sign(b.sp);
    b.g.rotation.y=Math.atan2(tx,tz);
    const glide=(Math.sin(t*.23+b.glide)>.55)?.12:1;
    const flap=Math.sin(t*9+b.phase)*.75*glide;
    b.wL.rotation.z=flap;b.wR.rotation.z=-flap;
    b.g.rotation.z=Math.sin(t*.9+b.phase)*.12;
  }
  syncFigures();
  /* smoke + fireflies */
  if(smokeU){smokeU.uTime.value=t;smokeU.uWind.value=S.wind;smokeU.uDusk.value=S.dusk;}
  if(fireflyU){fireflyU.uTime.value=t;fireflyU.uIntensity.value=smooth(.18,.6,S.dusk);}
  /* lantern flicker */
  const lampBase=lerp(1.1,3.0,S.dusk);
  for(const l of S.lanterns){
    const fl=1+.1*Math.sin(t*11+l.seed*7)+.06*Math.sin(t*23+l.seed*13);
    const on=S.lanternsOn?1:0;
    if(l.glass&&l.glass.material)l.glass.material.emissiveIntensity=l.base*fl*on*lerp(.85,1.5,S.dusk);
    if(l.light)l.light.intensity=lampBase*fl*on;
  }
}

/* ============================================================
   Alderglen — dusk ramps, controls, tour, audio, main loop
   ============================================================ */
const $=id=>document.getElementById(id);
const INTRO_FROM=V3(78,30,70),INTRO_TO=V3(46,15,40);
let introT=0,resetAnim=null;

/* ---------- golden hour → dusk ramps ---------- */
const _c1=new THREE.Color(),_c2=new THREE.Color();
function applyDusk(){
  const d=S.dusk,dir=sunDirFromDusk(d);
  sun.position.copy(dir).multiplyScalar(190);
  sun.intensity=lerp(3.1,.16,d*d);
  _c1.set(0xffc27d);_c2.set(0xd4502e);
  sun.color.copy(_c1).lerp(_c2,smooth(.25,.95,d));
  hemi.intensity=lerp(1.15,.22,d);
  _c1.set(0xffd2a8);_c2.set(0x4a4a72);hemi.color.copy(_c1).lerp(_c2,d);
  _c1.set(0x7a6a48);_c2.set(0x2a2030);hemi.groundColor.copy(_c1).lerp(_c2,d);
  fill.intensity=lerp(.7,.12,d);
  fill.position.set(-dir.x*160,70,-dir.z*160);
  _c1.set(0xe8b07a);_c2.set(0x4a3f66);
  scene.fog.color.copy(_c1).lerp(_c2,d);
  scene.fog.density=lerp(.0014,.0044,S.fogAmt)*(1+d*.3);
  renderer.toneMappingExposure=lerp(1.12,.95,d);
  skyU.uDusk.value=d;skyU.uSunDir.value.copy(dir);
  MAT.glassLit.emissiveIntensity=S.lanternsOn?lerp(1.9,4.2,d):0;
  if(water){
    water.material.uniforms.sunDirection.value.copy(dir);
    _c1.set(0xffc27d);_c2.set(0xff8a4c);
    water.material.uniforms.sunColor.value.copy(_c1).lerp(_c2,d);
    _c1.set(0x35544a);_c2.set(0x1e2a3a);
    water.material.uniforms.waterColor.value.copy(_c1).lerp(_c2,d);
  }
  bloomPass.strength=S.bloom*(1+d*.45);
  $('oTime').textContent=d<.25?'golden':d<.55?'sunset':d<=.8?'dusk':'nightfall';
}

/* ---------- procedural audio (wind, water, birds, crickets, mill) ---------- */
let AC=null,master=null,windGain=null,waterGain=null,audioOn=true;
function noiseBuffer(){
  const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buf.getChannelData(0);
  let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2;}
  return buf;
}
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=audioOn?.5:0;master.connect(AC.destination);
  const nb=noiseBuffer();
  const ws=AC.createBufferSource();ws.buffer=nb;ws.loop=true;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
  windGain=AC.createGain();windGain.gain.value=.1;
  ws.connect(lp);lp.connect(windGain);windGain.connect(master);ws.start();
  const wsrc=AC.createBufferSource();wsrc.buffer=nb;wsrc.loop=true;wsrc.playbackRate.value=.7;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.8;
  waterGain=AC.createGain();waterGain.gain.value=.035;
  wsrc.connect(bp);bp.connect(waterGain);waterGain.connect(master);wsrc.start();
}
function chirp(f0,f1,dur,vol,type='sine'){
  if(!AC||!audioOn)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}
let nextBird=2,nextCricket=1,nextCreak=4;
function updateAudio(dt,t){
  if(!AC)return;
  if(AC.state==='suspended')AC.resume();
  windGain.gain.value=.03+.17*S.wind;
  waterGain.gain.value=.02+.02*S.wind;
  nextBird-=dt;nextCricket-=dt;nextCreak-=dt;
  if(nextBird<=0){nextBird=rand(1.5,6)*(0.4+S.dusk);
    if(S.dusk<.75){const f=rand(1900,3200);chirp(f,f*rand(.6,.85),rand(.1,.22),.045);
      if(rng()<.5)setTimeout(()=>chirp(f*1.15,f*.8,.12,.035),140);}}
  if(nextCricket<=0){nextCricket=rand(.4,1.4);
    if(S.dusk>.35)chirp(4300,4100,.06,.02*S.dusk,'triangle');}
  if(nextCreak<=0){nextCreak=rand(2.5,6)/(.3+S.wind);
    if(S.motion)chirp(rand(70,100),55,.4,.035,'sawtooth');}
}

/* ---------- controls ---------- */
function stopTour(byUser){
  S.tour=false;controls.autoRotate=false;
  $('cTour').checked=false;
  if(byUser)$('btnTour').classList.add('show');
}
function startTour(){
  S.tour=true;controls.autoRotate=true;controls.autoRotateSpeed=S.tourSpeed;
  $('cTour').checked=true;$('btnTour').classList.remove('show');
}
function wireUI(){
  const rT=$('rTime'),rF=$('rFog'),rB=$('rBloom'),rW=$('rWind'),rP=$('rTour');
  rT.addEventListener('input',()=>{S.dusk=+rT.value;applyDusk();});
  rF.addEventListener('input',()=>{S.fogAmt=+rF.value;$('oFog').textContent=Math.round(S.fogAmt*100)+'%';applyDusk();});
  rB.addEventListener('input',()=>{S.bloom=+rB.value;$('oBloom').textContent=Math.round(S.bloom*100)+'%';applyDusk();});
  rW.addEventListener('input',()=>{S.wind=+rW.value;$('oWind').textContent=Math.round(S.wind*100)+'%';});
  rP.addEventListener('input',()=>{S.tourSpeed=+rP.value;$('oTour').textContent=S.tourSpeed.toFixed(2);
    controls.autoRotateSpeed=S.tourSpeed;});
  $('cLanterns').addEventListener('change',e=>{S.lanternsOn=e.target.checked;applyDusk();});
  $('cMotion').addEventListener('change',e=>{S.motion=e.target.checked;});
  $('cTour').addEventListener('change',e=>{e.target.checked?startTour():stopTour(false);});
  $('btnTour').addEventListener('click',startTour);
  $('sShadow').addEventListener('change',e=>{
    const n=+e.target.value;sun.shadow.mapSize.set(n,n);
    if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
  });
  $('sVeg').addEventListener('change',e=>buildGrass(+e.target.value));
  $('btnReset').addEventListener('click',()=>{
    resetAnim={t:0,fp:camera.position.clone(),ft:controls.target.clone()};
    startTour();
  });
  $('btnRandom').addEventListener('click',()=>{
    const q=(v,s)=>+(Math.round(v/s)*s).toFixed(2);
    S.dusk=q(rand(.05,.85),.01);S.fogAmt=q(rand(.2,.8),.01);S.bloom=q(rand(.3,.9),.01);S.wind=q(rand(.15,.9),.01);S.tourSpeed=q(rand(.25,1.1),.05);
    rT.value=S.dusk;rF.value=S.fogAmt;rB.value=S.bloom;rW.value=S.wind;rP.value=S.tourSpeed;
    $('oFog').textContent=Math.round(S.fogAmt*100)+'%';
    $('oBloom').textContent=Math.round(S.bloom*100)+'%';
    $('oWind').textContent=Math.round(S.wind*100)+'%';
    $('oTour').textContent=S.tourSpeed.toFixed(2);
    controls.autoRotateSpeed=S.tourSpeed;
    applyDusk();
  });
  $('btnShot').addEventListener('click',()=>{
    composer.render();
    const a=document.createElement('a');
    a.download='alderglen.png';a.href=renderer.domElement.toDataURL('image/png');
    a.click();
  });
  $('btnSound').addEventListener('click',()=>{
    audioOn=!audioOn;initAudio();
    if(master)master.gain.value=audioOn?.5:0;
    $('soundLabel').textContent=audioOn?'Sound on':'Muted';
  });
  controls.addEventListener('start',()=>{introT=1;resetAnim=null;if(S.tour)stopTour(true);
    $('hint').classList.add('gone');});
  const wake=()=>{initAudio();removeEventListener('pointerdown',wake);removeEventListener('keydown',wake);};
  addEventListener('pointerdown',wake);addEventListener('keydown',wake);
  setTimeout(()=>$('hint').classList.add('gone'),11000);
}

/* ---------- main loop ---------- */
let lastT=performance.now(),frames=0,fpsTimer=0,fps=0;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();let dt=(now-lastT)/1000;lastT=now;
  dt=Math.min(dt,.05);
  S.time+=dt;const t=S.time;
  if(introT<1){introT=Math.min(1,introT+dt/4.5);
    camera.position.lerpVectors(INTRO_FROM,INTRO_TO,smooth(0,1,introT));}
  if(resetAnim){resetAnim.t=Math.min(1,resetAnim.t+dt/1.1);const k=smooth(0,1,resetAnim.t);
    camera.position.lerpVectors(resetAnim.fp,INTRO_TO,k);
    controls.target.lerpVectors(resetAnim.ft,V3(0,4.5,0),k);
    if(resetAnim.t>=1)resetAnim=null;}
  for(const sh of S.swayShaders){sh.uniforms.uTime.value=t;sh.uniforms.uWind.value=S.wind;}
  skyU.uTime.value=t;
  updateNature(dt,t);
  updateLife(dt,t);
  updateAudio(dt,t);
  controls.update();
  renderer.info.reset();
  composer.render();
  frames++;fpsTimer+=dt;
  if(fpsTimer>=.5){fps=Math.round(frames/fpsTimer);frames=0;fpsTimer=0;
    const inf=renderer.info.render;
    $('perf').textContent=`${fps} fps · ${inf.calls} draws · ${(inf.triangles/1000).toFixed(0)}k tris`;}
}

/* ---------- staged build ---------- */
async function boot(){
  const steps=[
    ['mixing pigments & grinding grain…',()=>{buildTextures();buildMaterials();}],
    ['raising the sun…',()=>{buildRenderer();}],
    ['shaping the valley…',()=>{buildTerrain();}],
    ['laying the lanes…',()=>{buildPaths();buildPlaza();}],
    ['framing the houses…',()=>{buildHouses();}],
    ['consecrating the church…',()=>{buildChurch();}],
    ['setting the mill turning…',()=>{buildWindmill();}],
    ['opening the market…',()=>{buildLanternPosts();buildStalls();buildProps();buildFences();}],
    ['filling the lake…',()=>{buildLake();}],
    ['planting the woods…',()=>{buildTrees();}],
    ['seeding the meadows…',()=>{buildGrass(18000);buildFlowers();buildWheat();buildReeds();}],
    ['gathering clouds…',()=>{buildClouds();}],
    ['waking the villagers…',()=>{buildVillagers();buildSmoke();buildBirds();buildFireflies();}],
    ['baking the light…',()=>{batchStatics();}],
  ];
  for(let i=0;i<steps.length;i++){
    $('loadmsg').textContent=steps[i][0];
    $('loadfill').style.width=Math.round(i/steps.length*100)+'%';
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    steps[i][1]();
  }
  $('loadfill').style.width='100%';
  wireUI();applyDusk();
  renderer.info.autoReset=false;
  window.__V={
    get ready(){return S.ready;},S,stats:S.stats,errors:[],
    scene,camera,renderer,controls,
    get millAngle(){return millBlades?millBlades.rotation.z:null;},
    get villagerCount(){return villagers.length;},
    get birdCount(){return birds.length;},
    get chimneyCount(){return S.chimneys.length;},
    get lanternCount(){return S.lanterns.length;},
    get waterTime(){return water?water.material.uniforms.time.value:null;},
    get glassEmissive(){return MAT.glassLit.emissiveIntensity;},
    get fogDensity(){return scene.fog.density;},
    get bloomStrength(){return bloomPass.strength;},
    get sunIntensity(){return sun.intensity;},
    get shadowSize(){return sun.shadow.mapSize.x;},
    get audioState(){return AC?AC.state:'none';},
    get villagerPos(){return villagers[0]?villagers[0].g.position.toArray():null;},
    get fireflyIntensity(){return fireflyU?fireflyU.uIntensity.value:0;},
    get fireflyPos(){return fireflyPts?Array.from(fireflyPts.geometry.attributes.position.array):null;},
    get chimneys(){return S.chimneys.map(v=>v.toArray());},
    terrainAt:(x,z)=>terrainH(x,z),
    get cloudAngle(){return clouds[0]?clouds[0].a:null;},
    get smokeTime(){return smokeU?smokeU.uTime.value:null;},
    get birdFlap(){return birds[0]?birds[0].wL.rotation.z:null;},
    get gpu(){const gl=renderer.getContext();const ext=gl.getExtension('WEBGL_debug_renderer_info');
      return ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);},
    setDusk(v){S.dusk=clamp(v,0,1);$('rTime').value=S.dusk;applyDusk();},
    setWind(v){S.wind=clamp(v,0,1);$('rWind').value=S.wind;},
    version:'1.0'
  };
  addEventListener('error',e=>{window.__V.errors.push(String(e.message));});
  lastT=performance.now();
  loop();
  await new Promise(r=>setTimeout(r,350));
  S.ready=true;
  $('loader').classList.add('gone');
  setTimeout(()=>{const l=$('loader');if(l)l.remove();},1200);
}
boot().catch(e=>{
  const m=$('loadmsg');if(m)m.textContent='the village failed to wake: '+e.message;
  console.error(e);
});

</script>
