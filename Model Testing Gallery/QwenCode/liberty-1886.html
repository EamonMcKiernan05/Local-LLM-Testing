/* ---------- US flag (38 stars, 1886) ---------- */
let _flagTex=null;
function flagTexture(){
  if(_flagTex)return _flagTex;
  const c=document.createElement('canvas');c.width=128;c.height=80;
  const g=c.getContext('2d');
  for(let i=0;i<13;i++){g.fillStyle=i%2?'#f2ede2':'#b83a30';g.fillRect(0,i*80/13,128,80/13+1);}
  g.fillStyle='#2c3e6b';g.fillRect(0,0,54,80/13*7);
  g.fillStyle='#f2ede2';
  const rows=[7,6,7,6,7,5];let k=0;
  for(let r=0;r<rows.length;r++)for(let s=0;s<rows[r];s++){
    const x=4+(s+(r%2?0.5:0))*(46/7), y=3.5+r*5.6;
    g.beginPath();g.arc(x,y,1.5,0,TAU);g.fill();k++;
  }
  const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=4;
  _flagTex=tx;return tx;
}
const flagT={value:0};
function flagMaterial(phase){
  const m=new THREE.MeshStandardMaterial({map:flagTexture(),side:THREE.DoubleSide,roughness:.85,metalness:0});
  m.onBeforeCompile=sh=>{
    sh.uniforms.uT=flagT;sh.uniforms.uPh={value:phase};
    sh.vertexShader='uniform float uT;uniform float uPh;\n'+sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
      float wv=sin(position.x*2.4+uT*4.5+uPh)*0.16+sin(position.x*5.0-uT*7.0+uPh)*0.05;
      transformed.z+=wv*smoothstep(0.0,2.2,position.x);`);
  };
  return m;
}
const flagGeo=new THREE.PlaneGeometry(2.2,1.4,8,3);flagGeo.translate(1.1,0,0);
function addFlag(x,y,z,rotY,scale=1){
  const m=new THREE.Mesh(flagGeo,flagMaterial(rand()*TAU));
  m.position.set(x,y,z);m.rotation.y=rotY;m.scale.setScalar(scale);
  m.castShadow=false;worldGroup.add(m);return m;
}

/* ---------- people (instanced) ---------- */
const PEOPLE=[];
const COAT_COLS=[0x3a3226,0x2c3038,0x4a3a2c,0x554433,0x2e2a33,0x5c4a3a,0x39424e,0x6b5a44,0x26221e,0x4e3b2a];
const DRESS_COLS=[0x7a3b3b,0x3b5a6b,0x6b5a3b,0x4a6b4a,0x8a6a4a,0x5a3b5a,0x9a4a3a,0x3a4a6a];
const SKIN_COLS=[0xd9a878,0xc9976a,0xb98a5e,0xe0b48c,0x8a5e3e];
function personBase(kind,x,z,y,rot){
  const dress=rand()<0.42;
  PEOPLE.push({kind,x0:x,z0:z,y,rot0:rot,sc:0.9+rand()*0.25,sy:1,ph:rand()*TAU,
    col:dress?pick(DRESS_COLS):pick(COAT_COLS),skin:pick(SKIN_COLS),
    wave:false,parasol:false,dress});
  return PEOPLE[PEOPLE.length-1];
}
function pingpong(u){const f=fract(u);return f<0.5?f*2:(1-f)*2;}
function pingdir(u){return fract(u)<0.5?1:-1;}

function buildPeople(){
  // sidewalk pedestrians
  let tries=0,added=0;
  while(added<240&&tries++<9000){
    const x=randInt(-96,96),z=randInt(-96,96);
    if(!cityAt(x,z)||!isSidewalk(x,z)||occAt(x,z))continue;
    const hz=isStreet(x,z+1)||isStreet(x,z-1), vt=isStreet(x+1,z)||isStreet(x-1,z);
    let ax=null;
    if(hz&&!vt)ax='x';else if(vt&&!hz)ax='z';else continue;
    const L=10;
    const ok=ax==='x'?(cityAt(x-L/2,z)&&cityAt(x+L/2,z)&&isSidewalk(x-L/2,z)&&isSidewalk(x+L/2,z))
                     :(cityAt(x,z-L/2)&&cityAt(x,z+L/2)&&isSidewalk(x,z-L/2)&&isSidewalk(x,z+L/2));
    if(!ok)continue;
    const p=personBase(ax==='x'?'walkX':'walkZ',x,z,0,0);
    p.L=L;p.sp=(0.5+rand()*0.8)/L;p.amp=0.05;added++;
  }
  // waterfront crowd (facing the island)
  for(let i=0;i<150;i++){
    const a=(rand()*2-1)*(CITY_ARC-0.14), r=44.6+rand()*2.0;
    const p=personBase('stand',Math.sin(a)*r,-Math.cos(a)*r,0,-a);
    p.sway=0.12;p.wave=rand()<0.2;p.parasol=rand()<0.16;
  }
  // grandstand: seated + standing
  for(const s of GRANDSTAND_SEATS){
    const p=personBase('seated',s.x,s.z,s.y,0);
    p.sy=0.72;p.wave=rand()<0.3;p.sc=0.9+rand()*0.2;
  }
  for(let i=0;i<70;i++){
    const p=personBase('stand',-12+rand()*24,-44+rand()*5,0,(rand()-0.5)*0.5);
    p.sway=0.1;p.wave=rand()<0.18;p.parasol=rand()<0.14;
  }
  // island visitors: slow orbits inside the fort + pier crowds
  for(let i=0;i<58;i++){
    const r=9.6+rand()*3.6, a0=rand()*TAU;
    const p=personBase('orbit',0,0,0,0);
    p.r=r;p.a0=a0;p.w=(0.04+rand()*0.09)*(rand()<0.5?1:-1);p.parasol=rand()<0.1;
  }
  for(const aDeg of [150,210]){
    const a=aDeg*DEG,dx=Math.sin(a),dz=-Math.cos(a);
    for(let i=0;i<12;i++){
      const s=24+rand()*6, w=(rand()*2-1)*0.8;
      const p=personBase('stand',dx*s-dz*w,dz*s+dx*w,1,Math.atan2(-dx,-dz)+(rand()-0.5)*0.8);
      p.sway=0.08;
    }
  }
  // bridge promenade pedestrians
  for(let i=0;i<26;i++){
    const p=personBase('walkZ',57,0,10,0);
    p.L=38;p.sp=(0.6+rand()*0.7)/38;p.z0=-19+rand()*38;p.bridge=true;
  }
  // wharf crowds
  for(const w of WHARVES){
    const dx=Math.sin(w.a),dz=-Math.cos(w.a);
    for(let i=0;i<12;i++){
      const s=1.5+rand()*3.5, lat=(rand()*2-1)*1.2;
      const p=personBase('stand',w.x+dx*s-dz*lat,w.z+dz*s+dx*lat,1,Math.PI-w.a+(rand()-0.5)*0.9);
      p.sway=0.1;p.wave=rand()<0.12;
    }
  }
  // shuffle so the crowd slider thins every group evenly
  for(let i=PEOPLE.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[PEOPLE[i],PEOPLE[j]]=[PEOPLE[j],PEOPLE[i]];}

  const N=PEOPLE.length;
  const torso=new THREE.BoxGeometry(0.55,0.72,0.34);torso.translate(0,0.56,0);
  const legs=new THREE.BoxGeometry(0.44,0.36,0.3);legs.translate(0,0.18,0);
  const bodyGeo=mergeGeometries([torso,legs],false);
  const headGeo=new THREE.BoxGeometry(0.32,0.32,0.32);headGeo.translate(0,1.08,0);
  const bodyMat=new THREE.MeshStandardMaterial({roughness:.9,metalness:0});
  const headMat=new THREE.MeshStandardMaterial({roughness:.8,metalness:0});
  const bodyMesh=new THREE.InstancedMesh(bodyGeo,bodyMat,N);bodyMesh.name='people_body';
  const headMesh=new THREE.InstancedMesh(headGeo,headMat,N);headMesh.name='people_head';
  headMesh.instanceMatrix=bodyMesh.instanceMatrix;      // share transforms
  const c=new THREE.Color();
  for(let i=0;i<N;i++){
    bodyMesh.setColorAt(i,c.setHex(PEOPLE[i].col).offsetHSL(0,0,(rand()-0.5)*0.06));
    headMesh.setColorAt(i,c.setHex(PEOPLE[i].skin));
  }
  for(const m of [bodyMesh,headMesh]){m.castShadow=false;m.receiveShadow=false;m.frustumCulled=false;worldGroup.add(m);}

  // waving arms
  const wavers=[];for(let i=0;i<N;i++)if(PEOPLE[i].wave)wavers.push(i);
  const armGeo=new THREE.BoxGeometry(0.13,0.5,0.13);armGeo.translate(0,0.25,0);
  const armMesh=new THREE.InstancedMesh(armGeo,bodyMat.clone(),wavers.length);armMesh.name='people_arms';
  for(let i=0;i<wavers.length;i++)armMesh.setColorAt(i,c.setHex(PEOPLE[wavers[i]].col));
  armMesh.castShadow=false;armMesh.frustumCulled=false;worldGroup.add(armMesh);

  // parasols
  const holders=[];for(let i=0;i<N;i++)if(PEOPLE[i].parasol)holders.push(i);
  const cone=new THREE.ConeGeometry(0.62,0.26,7);cone.translate(0,0.13,0);
  const stick=new THREE.CylinderGeometry(0.03,0.03,0.6,4);stick.translate(0,-0.3,0);
  const parGeo=mergeGeometries([cone,stick],false);
  const parMesh=new THREE.InstancedMesh(parGeo,new THREE.MeshStandardMaterial({roughness:.8}),holders.length);parMesh.name='people_parasols';
  const PAR_COLS=[0xa84a3a,0xe8dcc8,0x4a6a7a,0xc8a84a,0x7a4a5a];
  for(let i=0;i<holders.length;i++)parMesh.setColorAt(i,c.setHex(pick(PAR_COLS)));
  parMesh.castShadow=false;parMesh.frustumCulled=false;worldGroup.add(parMesh);

  const dummy=new THREE.Object3D();
  const pos=new THREE.Vector3();
  function personPose(p,t,out){
    let x=p.x0,z=p.z0,rot=p.rot0,bob=0;
    if(p.kind==='walkX'||p.kind==='walkZ'){
      const u=t*p.sp+p.ph;
      const off=(pingpong(u)-0.5)*p.L;
      const dir=pingdir(u);
      if(p.kind==='walkX'){x=p.x0+off;rot=dir>0?Math.PI/2:-Math.PI/2;}
      else{z=(p.bridge?p.z0:p.z0)+off;rot=dir>0?0:Math.PI;}
      bob=Math.abs(Math.sin(t*7+p.ph))*0.05;
    }else if(p.kind==='orbit'){
      const a=p.a0+t*p.w;
      x=Math.sin(a)*p.r;z=Math.cos(a)*p.r;rot=Math.PI/2+a+(p.w>0?0:Math.PI);
      bob=Math.abs(Math.sin(t*6+p.ph))*0.04;
    }else if(p.kind==='stand'){
      rot=p.rot0+Math.sin(t*0.5+p.ph)*(p.sway||0);
      bob=Math.sin(t*1.2+p.ph)*0.015;
    }
    out.x=x;out.z=z;out.rot=rot;out.bob=bob;
  }
  const pp={x:0,z:0,rot:0,bob:0};
  dyn(t=>{
    const vis=Math.max(1,Math.floor(N*S.crowd));
    bodyMesh.count=vis;headMesh.count=vis;
    for(let i=0;i<vis;i++){
      const p=PEOPLE[i];
      personPose(p,t,pp);
      dummy.position.set(pp.x,p.y+pp.bob,pp.z);
      dummy.rotation.set(0,pp.rot,0);
      dummy.scale.set(p.sc,p.sc*p.sy,p.sc);
      dummy.updateMatrix();
      bodyMesh.setMatrixAt(i,dummy.matrix);
    }
    bodyMesh.instanceMatrix.needsUpdate=true;
    let aw=0,ap=0;
    for(let i=0;i<vis;i++){
      const p=PEOPLE[i];
      if(p.wave){
        personPose(p,t,pp);
        const cr=Math.cos(pp.rot),sr=Math.sin(pp.rot);
        dummy.position.set(pp.x+0.33*cr*p.sc,p.y+pp.bob+0.8*p.sc*p.sy,pp.z-0.33*sr*p.sc);
        dummy.rotation.set(0,pp.rot,-2.35+Math.sin(t*6+p.ph)*0.45);
        dummy.scale.setScalar(p.sc);dummy.updateMatrix();
        armMesh.setMatrixAt(aw++,dummy.matrix);
      }
      if(p.parasol){
        personPose(p,t,pp);
        dummy.position.set(pp.x,p.y+pp.bob+1.42*p.sc*p.sy,pp.z);
        dummy.rotation.set(Math.sin(t*0.8+p.ph)*0.08,pp.rot,Math.cos(t*0.6+p.ph)*0.08);
        dummy.scale.setScalar(p.sc);dummy.updateMatrix();
        parMesh.setMatrixAt(ap++,dummy.matrix);
      }
    }
    armMesh.count=aw;parMesh.count=ap;
    armMesh.instanceMatrix.needsUpdate=true;
    parMesh.instanceMatrix.needsUpdate=true;
  });
}

/* ---------- horse-drawn cabs ---------- */
function cabTemplate(){
  const m=new Map();
  // horse (forward +Z)
  lfill(m,0,1,2,0,1,4,P.horse);
  lset(m,0,0,2,P.horseD);lset(m,0,0,4,P.horseD);
  lset(m,0,2,4,P.horse);lset(m,0,2,5,P.horseD);
  lset(m,0,1,1,P.horseD);
  // cab
  lshell(m,-1,1,-2,1,2,0,P.cab);
  lfill(m,-1,3,-2,1,3,0,P.ironD);
  lset(m,-1,0,-1,P.ironD);lset(m,1,0,-1,P.ironD);
  lset(m,0,1,0,P.windowLit);
  lset(m,0,3,1,P.skin);lset(m,0,4,1,P.ironD);   // driver
  return propGroup(m);
}
function buildCabs(){
  const tpl=cabTemplate();
  const cabs=[];
  let tries=0;
  while(cabs.length<10&&tries++<6000){
    const x=randInt(-90,90),z=randInt(-90,90);
    if(!cityAt(x,z)||!isStreet(x,z)||occAt(x,z)||inChannel(x,z))continue;
    const hz=isStreet(x,z+1)&&isStreet(x,z-1), vt=isStreet(x+1,z)&&isStreet(x-1,z);
    let ax=null;
    if(hz&&!vt)ax='z';else if(vt&&!hz)ax='x';else continue;
    const L=18;
    const ok=ax==='x'?(cityAt(x-L/2,z)&&cityAt(x+L/2,z)&&isStreet(x-L/2,z)&&isStreet(x+L/2,z)&&!inChannel(x-L/2,z)&&!inChannel(x+L/2,z))
                     :(cityAt(x,z-L/2)&&cityAt(x,z+L/2)&&isStreet(x,z-L/2)&&isStreet(x,z+L/2)&&!inChannel(x,z-L/2)&&!inChannel(x,z+L/2));
    if(!ok)continue;
    cabs.push({x0:x,z0:z,ax,L,sp:(2.0+rand()*1.2)/L,ph:rand(),y:0});
  }
  // two cabs crossing the bridge
  cabs.push({x0:56,z0:0,ax:'z',L:36,sp:1.6/36,ph:0.15,y:9,bridge:true});
  cabs.push({x0:58,z0:0,ax:'z',L:36,sp:1.4/36,ph:0.6,y:9,bridge:true});
  const groups=[];
  for(let i=0;i<cabs.length;i++){const g=tpl.clone();g.name='cab';worldGroup.add(g);groups.push(g);}
  dyn(t=>{
    for(let i=0;i<cabs.length;i++){
      const c=cabs[i],u=t*c.sp+c.ph;
      const off=(pingpong(u)-0.5)*c.L,dir=pingdir(u);
      const g=groups[i];
      if(c.ax==='x'){g.position.set(c.x0+off,c.y,c.z0);g.rotation.y=dir>0?Math.PI/2:-Math.PI/2;}
      else{g.position.set(c.x0,c.y,(c.bridge?0:c.z0)+off);g.rotation.y=dir>0?0:Math.PI;}
    }
  });
}

/* ---------- boats ---------- */
function ferryPose(t){
  const a=t/52*TAU+0.7, r=33;
  return {x:Math.sin(a)*r,z:-Math.cos(a)*r,rot:Math.PI/2-a,y:WY-0.85+Math.sin(t*0.9)*0.08};
}
function tugPose(t){
  const a=-t/38*TAU+2.5, r=40.5;
  return {x:Math.sin(a)*r,z:-Math.cos(a)*r,rot:Math.PI/2-a+Math.PI,y:WY-0.7+Math.sin(t*1.1+2)*0.07};
}
function buildBoats(){
  // --- paddle-wheel ferry ---
  const fm=new Map();
  lfill(fm,-2,0,-5,2,1,4,P.hull);
  lfill(fm,-2,0,-5,2,0,4,P.hullRed);
  lshell(fm,-1,2,-4,1,3,3,P.white);
  for(let z=-3;z<=2;z++){lset(fm,-1,2,z,P.windowDark);lset(fm,1,2,z,P.windowDark);}
  lfill(fm,-1,4,1,1,4,3,P.white);
  lset(fm,0,4,3,P.windowDark);
  lfill(fm,0,4,-1,0,6,-1,P.ironD);
  lfill(fm,-3,1,-2,-3,2,1,P.hullRed);lfill(fm,3,1,-2,3,2,1,P.hullRed);
  lset(fm,0,2,-5,P.gold);
  const ferry=propGroup(fm);ferry.name='ferry';worldGroup.add(ferry);
  const wheels=[];
  for(const sx of [-3.5,3.5]){
    const wg=new THREE.Group();
    const wm=new Map();
    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.35,10),new THREE.MeshStandardMaterial({color:0x8a3a2a,roughness:.8}));
    cyl.rotation.z=Math.PI/2;wg.add(cyl);
    for(let k=0;k<8;k++){
      const b=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.5,1.0),new THREE.MeshStandardMaterial({color:0x6a4a32,roughness:.9}));
      const a=k/8*TAU;b.position.set(0,Math.sin(a)*1.5,Math.cos(a)*1.5);b.rotation.x=-a;wg.add(b);
    }
    wg.position.set(sx,1.6,-0.5);ferry.add(wg);wheels.push(wg);
  }
  addFlagTo(ferry,0,5,-5,0.6);
  // --- tugboat ---
  const tm=new Map();
  lfill(tm,-1,0,-3,1,1,2,P.ironD);
  lfill(tm,-1,0,-3,1,0,2,P.hullRed);
  lshell(tm,-1,2,-1,1,2,1,P.white);
  lfill(tm,0,3,0,0,5,0,P.ironD);
  lset(tm,0,2,2,P.gold);
  const tug=propGroup(tm);tug.name='tug';worldGroup.add(tug);
  addFlagTo(tug,0,3,-3,0.45);
  // --- three-masted sailing ship at anchor ---
  const sm=new Map();
  lfill(sm,-2,0,-6,2,1,5,P.hull);
  lfill(sm,-2,0,-6,2,0,5,P.hullRed);
  lfill(sm,-1,2,-5,1,2,-3,P.woodD);
  lfill(sm,0,1,6,0,1,8,P.woodD);                     // bowsprit
  for(const mz of [-3,0,3]){
    for(let y=2;y<=11;y++)lset(sm,0,y,mz,P.woodD);
    lfill(sm,-3,8,mz,3,8,mz,P.woodD);
    lfill(sm,-2,10,mz,2,10,mz,P.woodD);
    lfill(sm,-2,7,mz,2,7,mz,P.sail);                // furled sails
    lfill(sm,-1,9,mz,1,9,mz,P.sail);
  }
  lset(sm,0,12,-3,P.flagRed);
  const ship=propGroup(sm);ship.name='ship';
  ship.position.set(14,WY-0.8,30);ship.rotation.y=0.6;worldGroup.add(ship);
  addFlagTo(ship,0,4,-6,0.6);
  dyn(t=>{
    const f=ferryPose(t);
    ferry.position.set(f.x,f.y,f.z);ferry.rotation.y=f.rot;ferry.rotation.z=Math.sin(t*0.7)*0.02;
    for(const w of wheels)w.rotation.x=t*2.2;
    const g=tugPose(t);
    tug.position.set(g.x,g.y,g.z);tug.rotation.y=g.rot;tug.rotation.z=Math.sin(t*0.9+1)*0.025;
    ship.position.y=WY-0.8+Math.sin(t*0.55)*0.1;
    ship.rotation.z=Math.sin(t*0.45)*0.02;ship.rotation.y=0.6+Math.sin(t*0.2)*0.03;
  });
}
function addFlagTo(group,x,y,z,scale){

/* ---------- seagulls circling the statue ---------- */
function buildGulls(){
  const NG=12;
  const bodyGeo=new THREE.BoxGeometry(0.55,0.16,0.22);
  const wingGeo=new THREE.BoxGeometry(0.62,0.05,0.24);wingGeo.translate(0.31,0,0);
  const gullMat=new THREE.MeshStandardMaterial({roughness:.7});
  const bodies=new THREE.InstancedMesh(bodyGeo,gullMat,NG);bodies.name='gull_bodies';
  const wings=new THREE.InstancedMesh(wingGeo,gullMat.clone(),NG*2);wings.name='gull_wings';
  const c=new THREE.Color();
  const gulls=[];
  for(let i=0;i<NG;i++){
    bodies.setColorAt(i,c.setHex(0xf2f0e8));
    wings.setColorAt(i*2,c.setHex(0xe8e4d8));wings.setColorAt(i*2+1,c.setHex(0xe8e4d8));
    gulls.push({r:7+rand()*8,h:40+rand()*14,w:(0.25+rand()*0.3)*(rand()<0.5?1:-1),ph:rand()*TAU,ph2:rand()*TAU});
  }
  for(const m of [bodies,wings]){m.castShadow=false;m.frustumCulled=false;worldGroup.add(m);}
  const dummy=new THREE.Object3D();
  dyn(t=>{
    for(let i=0;i<NG;i++){
      const g=gulls[i],a=g.ph+t*g.w;
      const x=statueTop.x+Math.sin(a)*g.r, z=statueTop.z+Math.cos(a)*g.r;
      const y=g.h+Math.sin(t*0.7+g.ph2)*1.6;
      const rot=Math.PI/2+a+(g.w>0?0:Math.PI);
      dummy.position.set(x,y,z);dummy.rotation.set(0,rot,Math.sin(t*0.9+g.ph2)*0.15);
      dummy.scale.setScalar(1);dummy.updateMatrix();
      bodies.setMatrixAt(i,dummy.matrix);
      const flap=Math.sin(t*9+g.ph2)*0.55;
      for(const sgn of [-1,1]){
        const cr=Math.cos(rot),sr=Math.sin(rot);
        dummy.position.set(x+sgn*0.1*cr,y+0.06,z-sgn*0.1*sr);
        dummy.rotation.set(0,rot,sgn*(0.25+flap));
        dummy.scale.set(sgn,1,1);dummy.updateMatrix();
        wings.setMatrixAt(i*2+(sgn>0?0:1),dummy.matrix);
      }
    }
    bodies.instanceMatrix.needsUpdate=true;
    wings.instanceMatrix.needsUpdate=true;
  });
}

/* ---------- smoke & steam (instanced voxel puffs) ---------- */
function buildSmoke(){
  const parts=[];
  const chim=CHIMNEYS.slice();
  for(const ch of chim)for(let k=0;k<3;k++){
    parts.push({src:()=>ch,life:3.5+rand()*2.5,ph:rand(),rise:2.2+rand()*1.6,size:0.5+rand()*0.4,
      col:0x6a625a,steam:false,wind:0.9+rand()*0.5});
  }
  const fsrc=t=>{const f=ferryPose(t);return {x:f.x-Math.sin(f.rot),y:f.y+7,z:f.z-Math.cos(f.rot)};};
  const gsrc=t=>{const g=tugPose(t);return {x:g.x-Math.sin(g.rot)*0,y:g.y+6,z:g.z};};
  const tsrc=t=>{const p=trainPose(t);return {x:p.x+p.dir*1.5,y:EL.deckY+6,z:EL.z};};
  for(let k=0;k<14;k++)parts.push({src:fsrc,life:3+rand()*2,ph:rand(),rise:2.6+rand()*1.5,size:0.55+rand()*0.4,col:0x5a524a,steam:false,wind:1.1});
  for(let k=0;k<10;k++)parts.push({src:gsrc,life:2.6+rand()*1.8,ph:rand(),rise:2.8+rand()*1.4,size:0.45+rand()*0.35,col:0x4a443e,steam:false,wind:1.2});
  for(let k=0;k<16;k++)parts.push({src:tsrc,life:2.4+rand()*1.6,ph:rand(),rise:2.4+rand()*1.2,size:0.5+rand()*0.4,col:0x55504a,steam:false,wind:0.8});
  // white steam: train whistle + ferry + tug
  for(let k=0;k<10;k++)parts.push({src:tsrc,life:1.6+rand()*1.2,ph:rand(),rise:3.2+rand()*1.5,size:0.4+rand()*0.3,col:0xe8e4dc,steam:true,wind:0.7});
  for(let k=0;k<6;k++)parts.push({src:fsrc,life:1.8+rand()*1.2,ph:rand(),rise:3+rand()*1.4,size:0.35+rand()*0.3,col:0xe8e4dc,steam:true,wind:1});
  for(const p of parts){p.ph=rand();p.wob=rand()*TAU;}
  const NS=parts.filter(p=>!p.steam).length, NW=parts.length-NS;
  const puffGeo=new THREE.BoxGeometry(1,1,1);
  const smokeMesh=new THREE.InstancedMesh(puffGeo,new THREE.MeshLambertMaterial({transparent:true,opacity:0.5,depthWrite:false}),NS);smokeMesh.name='smoke';
  const steamMesh=new THREE.InstancedMesh(puffGeo,new THREE.MeshLambertMaterial({transparent:true,opacity:0.45,depthWrite:false}),NW);steamMesh.name='steam';
  const c=new THREE.Color();
  let si=0,wi=0;
  for(const p of parts){
    const m=p.steam?steamMesh:smokeMesh;const idx=p.steam?wi++:si++;
    m.setColorAt(idx,c.setHex(p.col).offsetHSL(0,0,(rand()-0.5)*0.08));
    p.mesh=m;p.idx=idx;
  }
  for(const m of [smokeMesh,steamMesh]){m.castShadow=false;m.frustumCulled=false;worldGroup.add(m);}
  const dummy=new THREE.Object3D();
  dyn(t=>{
    const sc=clamp(S.smoke,0,1);
    smokeMesh.count=Math.floor(NS*sc);steamMesh.count=Math.floor(NW*sc);
    for(const p of parts){
      if(p.idx>=p.mesh.count)continue;
      const age=fract(t/p.life+p.ph);
      const te=t-age*p.life;
      const b=p.src(te);
      const grow=0.3+age*1.3;
      const fade=1-smooth(0.75,1,age)*0.7;
      dummy.position.set(b.x+age*p.wind+Math.sin(t*0.8+p.wob)*0.3*age,
        b.y+age*p.rise, b.z+age*p.wind*0.35+Math.cos(t*0.7+p.wob)*0.3*age);
      dummy.rotation.set(age*0.6+p.wob,age*0.9,0);
      dummy.scale.setScalar(p.size*grow*fade);
      dummy.updateMatrix();
      p.mesh.setMatrixAt(p.idx,dummy.matrix);
    }
    smokeMesh.instanceMatrix.needsUpdate=true;
    steamMesh.instanceMatrix.needsUpdate=true;
  });
}

/* ---------- orchestration ---------- */
function buildLife(){
  // flag poles (voxels) + flags
  for(const f of FLAGPOLES){
    for(let k=0;k<f.h;k++)setV(f.x,f.y+k,f.z,P.ironD);
    setV(f.x,f.y+f.h,f.z,P.gold);
    addFlag(f.x+0.5,f.y+f.h-0.6,f.z+0.5,rand()*TAU,0.9);
  }
  buildPeople();
  buildCabs();
  buildBoats();
  buildGulls();
  buildSmoke();
  dyn(t=>{flagT.value=t;});
}

  setLoad(4,'mixing the patina…');            await tick();
  buildIsland();
  setLoad(16,'raising the island…');          await tick();
  buildWater();
  buildFalls();
  setLoad(28,'pouring the harbor…');          await tick();
  buildIslandStructures();
  setLoad(44,'raising Liberty…');             await tick();
  buildCity();
  setLoad(62,'building Manhattan, 1886…');    await tick();
  buildBridge();
  buildEl();
  setLoad(74,'stringing the bridge cables…'); await tick();
  buildIslets();
  buildClouds();
  buildLife();
  setLoad(86,'seeding the crowds…');          await tick();
  buildWorldChunks();
  setLoad(96,'baking the golden hour…');      await tick();
  placeSun();
  syncEnv();
  renderAt(S.time);   // first render bakes the static shadow map
}

/* ---------- teardown + reseed ---------- */
function disposeTree(root){
  root.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    if(o.material){
      const ms=Array.isArray(o.material)?o.material:[o.material];
      for(const m of ms){
        if(m===MAT.vox||m===MAT.glow)continue;
        if(m.map&&m.map!==_flagTex)m.map.dispose();
        m.dispose();
      }
    }
  });
}
async function rebuild(seed){
  S.ready=false; S.seed=seed;
  const loader=$('loader'); loader.classList.remove('gone');
  setLoad(2,'a new island rises…'); await tick();
  DYN.length=0;
  VOX.clear();
  CHIMNEYS.length=0; FLAGPOLES.length=0; GRANDSTAND_SEATS.length=0; WHARVES.length=0;
  PEOPLE.length=0; OCC.fill(0);
  trainParts=[];
  if(flameLight){scene.remove(flameLight);flameLight=null;}
  for(const c of [...worldGroup.children]){
    if(c===chunkGroup){
      for(const m of [...chunkGroup.children]){chunkGroup.remove(m);disposeTree(m);}
      continue;
    }
    worldGroup.remove(c); disposeTree(c);
  }
  chunkMeshes.length=0;
  await buildAll();
  finishBoot();
}
window.__L.reseedWorld=rebuild;

/* ---------- UI ---------- */
const rTime=$('rTime'),oTime=$('oTime');
function syncPlayBtn(){ $('btnPlay').innerHTML=S.playing?'&#10074;&#10074; Pause':'&#9654; Play'; }
function syncTimeUI(){ rTime.value=S.time.toFixed(2); oTime.textContent=S.time.toFixed(1)+' s'; }
function setPlaying(p){ S.playing=p; syncPlayBtn(); }

function wireUI(){
  $('btnPlay').onclick=()=>setPlaying(!S.playing);
  $('btnRestart').onclick=()=>{S.time=0;syncTimeUI();if(!S.playing)renderAt(0);};
  rTime.oninput=()=>{S.time=parseFloat(rTime.value);oTime.textContent=S.time.toFixed(1)+' s';};
  $('sSpeed').onchange=e=>{S.speed=parseFloat(e.target.value);};
  $('cLoop').onchange=e=>{S.loop=e.target.checked;};

  $('rOrbit').oninput=e=>{S.orbitOff=parseFloat(e.target.value);$('oOrbit').textContent=S.orbitOff+'°';};
  $('rDist').oninput=e=>{S.dist=parseFloat(e.target.value);$('oDist').textContent=S.dist.toFixed(2)+'×';};
  $('rElev').oninput=e=>{S.elev=parseFloat(e.target.value);$('oElev').textContent=S.elev+'°';};
  $('cFree').onchange=e=>{
    S.free=e.target.checked; controls.enabled=S.free;
    if(S.free){controls.target.set(0,8,0);controls.update();}
  };

  $('rHaze').oninput=e=>{S.haze=parseFloat(e.target.value);$('oHaze').textContent=Math.round(S.haze*100)+'%';syncEnv();};
  $('rBloom').oninput=e=>{S.bloom=parseFloat(e.target.value);$('oBloom').textContent=S.bloom.toFixed(2);bloomPass.strength=S.bloom;};
  $('rSun').oninput=e=>{S.sunEl=parseFloat(e.target.value);$('oSun').textContent=S.sunEl+'°';placeSun();syncEnv();};
  $('rExpo').oninput=e=>{S.expo=parseFloat(e.target.value);$('oExpo').textContent=S.expo.toFixed(2);renderer.toneMappingExposure=S.expo;};

  $('rCrowd').oninput=e=>{S.crowd=parseFloat(e.target.value);$('oCrowd').textContent=Math.round(S.crowd*100)+'%';};
  $('rSmoke').oninput=e=>{S.smoke=parseFloat(e.target.value);$('oSmoke').textContent=Math.round(S.smoke*100)+'%';};
  $('sShadow').onchange=e=>{
    S.shadowRes=parseInt(e.target.value,10);
    sun.shadow.mapSize.set(S.shadowRes,S.shadowRes);
    if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
    renderer.shadowMap.needsUpdate=true;
  };
  $('sRes').onchange=e=>{
    const [w,h]=e.target.value.split('x').map(Number);
    setResolution(w,h);
  };

  $('btnReset').onclick=()=>{
    Object.assign(S,{orbitOff:0,dist:1,elev:24,free:false,haze:.45,bloom:.38,sunEl:13,expo:1.05,crowd:1,smoke:1,shadowRes:4096});
    $('rOrbit').value=0;$('oOrbit').textContent='0°';
    $('rDist').value=1;$('oDist').textContent='1.00×';
    $('rElev').value=24;$('oElev').textContent='24°';
    $('cFree').checked=false;controls.enabled=false;
    $('rHaze').value=.45;$('oHaze').textContent='45%';
    $('rBloom').value=.38;$('oBloom').textContent='0.38';bloomPass.strength=.38;
    $('rSun').value=13;$('oSun').textContent='13°';
    $('rExpo').value=1.05;$('oExpo').textContent='1.05';renderer.toneMappingExposure=1.05;
    $('rCrowd').value=1;$('oCrowd').textContent='100%';
    $('rSmoke').value=1;$('oSmoke').textContent='100%';
    $('sShadow').value='4096';
    sun.shadow.mapSize.set(4096,4096);
    if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
    placeSun();syncEnv();
  };
  $('btnRandom').onclick=()=>{ if(S.ready) rebuild((Math.random()*0x7fffffff)|0); };
  $('btnShot').onclick=capturePNG;
  $('btnShotTop').onclick=capturePNG;
  $('btnHide').onclick=()=>document.body.classList.toggle('uihide');

  window.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='select'||tag==='textarea')return;
    if(e.code==='Space'){e.preventDefault();setPlaying(!S.playing);}
    else if(e.code==='ArrowLeft'){e.preventDefault();S.time=clamp(S.time-(e.shiftKey?1:.1),0,DUR);syncTimeUI();}
    else if(e.code==='ArrowRight'){e.preventDefault();S.time=clamp(S.time+(e.shiftKey?1:.1),0,DUR);syncTimeUI();}
    else if(e.code==='KeyH'){document.body.classList.toggle('uihide');}
    else if(e.code==='KeyS'){capturePNG();}
  });

  if(Q.get('ui')==='0')document.body.classList.add('uihide');
  setTimeout(()=>$('hint').classList.add('gone'),9000);
}

function capturePNG(){
  renderAt(S.time);
  const a=document.createElement('a');
  a.href=renderer.domElement.toDataURL('image/png');
  a.download=`liberty-1886_t${S.time.toFixed(2)}_${S.W}x${S.H}.png`;
  a.click();
}

/* ---------- playback loop ---------- */
let _last=performance.now(),_fps=0,_perfAcc=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!S.ready)return;
  const dt=Math.min(.1,(now-_last)/1000);_last=now;
  if(dt>0)_fps=_fps?_fps*.92+(1/dt)*.08:1/dt;
  if(S.playing){
    S.time+=dt*S.speed;
    if(S.time>=DUR){
      if(S.loop)S.time%=DUR;
      else{S.time=DUR;setPlaying(false);}
    }
    syncTimeUI();
  }
  const cf=$('cFree');
  if(cf.checked!==S.free){cf.checked=S.free;controls.enabled=S.free;}
  renderAt(S.time);
  _perfAcc+=dt;
  if(_perfAcc>.5){
    _perfAcc=0;
    const st=window.__L.stats();
    $('perf').textContent=`${Math.round(_fps)} fps · ${(st.voxels/1000).toFixed(0)}k voxels · ${st.draws} draws · ${(st.trisFrame/1e6).toFixed(2)}M tris`;
  }
}

/* ---------- boot ---------- */
function finishBoot(){
  S.ready=true;
  setLoad(100,'welcome to dedication day');
  const loader=$('loader');
  loader.classList.add('gone');
  clearTimeout(window.__loadWatch);
  syncPlayBtn();syncTimeUI();
}

(async()=>{
  try{
    buildMaterials();
    buildRenderer();
    wireUI();
    await buildAll();
    finishBoot();
    requestAnimationFrame(loop);
  }catch(err){
    console.error(err);
    const m=$('loadmsg');
    if(m)m.textContent='build error: '+err.message;
  }
})();

</script>
