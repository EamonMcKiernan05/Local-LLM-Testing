<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dusk Cityline</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#070a12}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block}
  .title{position:fixed;left:clamp(20px,3.4vw,58px);bottom:clamp(18px,3.4vh,48px);margin:0;
    font-size:clamp(10px,1.02vw,15px);font-weight:600;letter-spacing:.46em;text-transform:uppercase;
    color:#f5e9d7;opacity:.92;text-shadow:0 2px 16px rgba(0,0,0,.7);z-index:5;user-select:none}
  .title em{font-style:normal;color:#ffb877;opacity:.9}

  /* --- animation: transform and opacity only --- */
  .sw{opacity:0}
  .car{opacity:1}
  .rip{opacity:1}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="A city skyline at dusk seen across a river">

  <defs>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10142a"/>
      <stop offset=".28" stop-color="#1a1e3a"/>
      <stop offset=".5" stop-color="#26304e"/>
      <stop offset=".66" stop-color="#4a4450"/>
      <stop offset=".78" stop-color="#87543f"/>
      <stop offset=".88" stop-color="#c06f4d"/>
      <stop offset="1" stop-color="#f5a468"/>
    </linearGradient>
    <radialGradient id="gSun" cx=".82" cy=".8" r=".36">
      <stop offset="0" stop-color="#ffcf9b" stop-opacity=".6"/>
      <stop offset=".3" stop-color="#ffa15e" stop-opacity=".3"/>
      <stop offset=".68" stop-color="#e8895a" stop-opacity=".1"/>
      <stop offset="1" stop-color="#e8895a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gHorizonH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8895a" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#f0955f" stop-opacity=".26"/>
      <stop offset=".78" stop-color="#ffc189" stop-opacity=".46"/>
      <stop offset="1" stop-color="#ffcf9b" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="gHorizonV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="waterClip" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="600" width="1600" height="300"/>
    </clipPath>
    <mask id="mHorizon" maskUnits="userSpaceOnUse" x="0" y="480" width="1600" height="140">
      <rect x="0" y="480" width="1600" height="140" fill="url(#gHorizonV)"/>
    </mask>
    <linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8895a" stop-opacity="0"/>
      <stop offset=".55" stop-color="#e0876a" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffb27e" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2340"/>
      <stop offset=".22" stop-color="#121a30"/>
      <stop offset=".6" stop-color="#0e1424"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <radialGradient id="gSheen" cx=".78" cy="0" r=".55">
      <stop offset="0" stop-color="#e8895a" stop-opacity=".26"/>
      <stop offset=".45" stop-color="#c4704f" stop-opacity=".09"/>
      <stop offset="1" stop-color="#0e1424" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gTowerA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4740"/><stop offset=".5" stop-color="#3b3f47"/><stop offset="1" stop-color="#2b2e35"/>
    </linearGradient>
    <linearGradient id="gTowerB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#434852"/><stop offset=".55" stop-color="#353a42"/><stop offset="1" stop-color="#262a30"/>
    </linearGradient>
    <linearGradient id="gTowerC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57503f"/><stop offset=".5" stop-color="#413f42"/><stop offset="1" stop-color="#2d2c31"/>
    </linearGradient>
    <linearGradient id="gNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31333a"/><stop offset=".6" stop-color="#24262c"/><stop offset="1" stop-color="#17191e"/>
    </linearGradient>
    <linearGradient id="gRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191b21"/><stop offset=".45" stop-color="#121419"/><stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2c32"/><stop offset="1" stop-color="#3b3229"/>
    </linearGradient>

    <radialGradient id="gHaloWarm"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".85"/><stop offset=".35" stop-color="#ffbf78" stop-opacity=".32"/><stop offset="1" stop-color="#ff9f52" stop-opacity="0"/></radialGradient>
    <radialGradient id="gHaloSodium"><stop offset="0" stop-color="#ffab4d" stop-opacity=".9"/><stop offset=".38" stop-color="#ff9a3c" stop-opacity=".3"/><stop offset="1" stop-color="#ff7f2e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gHaloRed"><stop offset="0" stop-color="#ff6a44" stop-opacity=".8"/><stop offset=".4" stop-color="#e83c22" stop-opacity=".26"/><stop offset="1" stop-color="#c22a14" stop-opacity="0"/></radialGradient>
    <radialGradient id="gHaloWhite"><stop offset="0" stop-color="#fff8e6" stop-opacity=".95"/><stop offset=".32" stop-color="#ffe6b4" stop-opacity=".34"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gCloud"><stop offset="0" stop-color="#2c2b4a" stop-opacity=".5"/><stop offset=".55" stop-color="#23223d" stop-opacity=".26"/><stop offset="1" stop-color="#1c1c31" stop-opacity="0"/></radialGradient>
    <radialGradient id="gCloudWarm"><stop offset="0" stop-color="#a8614c" stop-opacity=".32"/><stop offset=".6" stop-color="#7d4a42" stop-opacity=".15"/><stop offset="1" stop-color="#5a3a3c" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="skyWrap">
    <rect x="0" y="0" width="1600" height="640" fill="url(#gSky)"/>
    <rect x="0" y="0" width="1600" height="640" fill="url(#gSun)"/>
  </g>


  <g id="clouds"></g>
  <rect id="horizon" x="0" y="480" width="1600" height="140" fill="url(#gHorizonH)" mask="url(#mHorizon)"/>
  <g id="far"></g>
  <rect id="haze" x="0" y="452" width="1600" height="160" fill="url(#gHaze)"/>
  <g id="mid"></g>


  <g id="midLights"></g>


  <g id="near"></g>


  <g id="nearLights"></g>


  <g id="road"></g>


  <g id="roadLights"></g>


  <g id="water">
    <rect x="0" y="600" width="1600" height="300" fill="url(#gWater)"/>
    <rect x="0" y="600" width="1600" height="300" fill="url(#gSheen)"/>
    <g id="refl"></g>
    <g id="ripples"></g>
  </g>


  <g id="traffic"></g>


  <g id="bridge"></g>

</svg>

<h1 class="title">Dusk <em>Cityline</em></h1>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";

  /* ---------------- seeded PRNG (mulberry32) ---------------- */
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1337);
  function rr(a,b){ return a + (b-a)*rnd(); }
  function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }

  /* ---------------- tiny DOM helpers ---------------- */
  function el(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    if(attrs) for(var k in attrs){ if(attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]); }
    if(parent) parent.appendChild(e);
    return e;
  }
  function use(ref, parent){ return el("use", {"href":ref}, parent); }
  function $(id){ return document.getElementById(id); }

  var gClouds = $("clouds"), gFar = $("far"), gMid = $("mid"), gMidL = $("midLights"),
      gNear = $("near"), gNearL = $("nearLights"), gRoad = $("road"), gRoadL = $("roadLights"),
      gRefl = $("refl"), gRipples = $("ripples"), gTraffic = $("traffic"), gBridge = $("bridge");

  /* ---------------- window light waves ----------------
     Lights switch on in small groups across the first 8 seconds of the 10
     second cycle, then every group goes back down over the last 1.4 seconds,
     so the frame at t=10s is identical to the frame at t=0s. */
  var dyn = document.createElement("style");
  var css = "";

  /* Each light wave is a keyframe set that switches on at one moment inside
     the first 8 seconds of the 10 second cycle, then goes back down over the
     last 1.4 seconds. The frame at t=10s is therefore identical to t=0s. */
  function waveKeyframes(name, onSec, offSec){
    var a = Math.max(0, (onSec/10*100) - 1.6);
    var b = (onSec/10*100) + 1.0;
    var c = (offSec/10*100);
    var d = Math.min(c + 4.0, 99.6);
    return "@keyframes "+name+"{0%{opacity:0}"+a.toFixed(2)+"%{opacity:0}"+b.toFixed(2)+
           "%{opacity:1}"+c.toFixed(2)+"%{opacity:1}"+d.toFixed(2)+"%{opacity:0}100%{opacity:0}}";
  }
  function waveGroup(layer, name){
    var e = el("g", {"class":"sw"}, layer);
    e.setAttribute("style","animation-name:"+name+";animation-duration:10s;animation-timing-function:linear;"+
      "animation-iteration-count:infinite;animation-delay:0s");
    return e;
  }

  /* Every building gets its own small set of waves, so a group that changes
     opacity only ever covers one building. That keeps the repainted area
     small and the frame rate high. */
  function buildingWaves(bi, count, spread){
    var names = [];
    for(var w=0; w<count; w++){
      /* each group comes on a moment after the one before it, so the lights
         build in small groups rather than all at once */
      var onSec  = 0.4 + bi*spread + w*(count>1 ? 1.85 : 0);
      var offSec = 8.45 + (count-1-w)*0.22 + (bi % 10)*0.05;
      if(onSec > 7.85) onSec = 7.85;
      if(offSec > 9.5) offSec = 9.5;
      var name = "wv" + bi + "_" + w;
      css += waveKeyframes(name, onSec, offSec);
      names.push(name);
    }
    return names;
  }

  var litWindows = [];   // {x,y,w,h,fill,op,g}  g = reflection group

  /* ---------------- reflection helper ----------------
     A reflection is a short dash hanging below the water line, offset and
     shortened so the water reads as broken and rippled. */
  function addReflection(x, y, w, h, fill, op, group){
    if(!group) return;
    /* the reflection hangs below the water line, smeared sideways and broken
       into thin bands by the ripples */
    var ry = 600 + (600 - (y + h)) * 0.72;
    var rh = Math.max(h * 0.72, 1.2);
    if(ry > 880) return;
    var bands = Math.min(3, Math.max(1, Math.round(rh / 5)));
    for(var i=0; i<bands; i++){
      var fy = ry + i * (rh / bands);
      if(fy > 878) break;
      var jitter = (i % 2) ? rr(-1.5,1.5) : 0;
      var fw = w * rr(2.0,3.4) + (i % 2 ? 0 : w);
      el("rect", {x:x - fw*0.42 + jitter, y:fy, width:fw, height:Math.max(1, rh/bands*0.42),
                  fill:fill, opacity:op * (i % 2 ? 0.7 : 1)}, group);
    }
  }

  /* ---------------- LAYER 1: far haze silhouettes ---------------- */
  var fx = -40;
  while(fx < 1000){
    var fw = rr(38,110), fh = rr(56,196);
    el("rect", {x:fx, y:600-fh, width:fw, height:fh+4, fill:"#33324a",
                opacity:(0.3 + rnd()*0.24).toFixed(2)}, gFar);
    if(rnd() < 0.32){
      el("rect", {x:fx+fw*0.34, y:600-fh-rr(12,34), width:rr(6,16), height:50,
                  fill:"#33324a", opacity:0.34}, gFar);
    }
    /* a real gap, so the far bank never reads as one solid wall */
    fx += fw + rr(6,34);
  }
  /* the far bank tapers away to the right, so the bridge crosses open water */
  var fbx = 1148;
  while(fbx > 930){
    var fw2 = rr(14,40), fh2 = rr(10,46) * (fbx-930)/220 + 6;
    el("rect", {x:fbx-fw2, y:600-fh2, width:fw2, height:fh2, fill:"#2f2e44",
                opacity:(0.26+rnd()*0.26).toFixed(2)}, gFar);
    if(rnd() < 0.3){
      el("rect", {x:fbx-fw2*0.8, y:600-fh2-rr(6,18), width:rr(4,10), height:22,
                  fill:"#2f2e44", opacity:0.3}, gFar);
    }
    fbx -= fw2 * rr(0.55,0.95) + rr(2,14);
  }

  /* ---------------- LAYER 2: mid towers with window grids ---------------- */
  var midSpecs = [
    {x:6,   w:98,  h:250}, {x:112, w:130, h:344}, {x:250, w:82,  h:208},
    {x:340, w:148, h:432}, {x:496, w:100, h:286}, {x:604, w:120, h:358},
    {x:732, w:86,  h:226}, {x:826, w:140, h:318}, {x:974, w:74,  h:262}
  ];
  var warm = "#ffd9a0", cool = "#bcd8ff";

  midSpecs.forEach(function(spec, bi){
    var x = spec.x, w = spec.w, h = spec.h, base = 600;
    var grad = pick(["url(#gTowerA)","url(#gTowerB)","url(#gTowerC)"]);
    var sideW = w * rr(0.14,0.3);
    var frontW = w - sideW;

    el("rect", {x:x, y:base-h, width:w, height:h, fill:grad}, gMid);
    el("rect", {x:x+frontW, y:base-h, width:sideW, height:h, fill:"url(#gSide)"}, gMid);
    /* the last sun is low on the right, so it rims the right-hand faces */
    el("rect", {x:x+w-3.5, y:base-h, width:3.5, height:h, fill:"#c98a5e",
                opacity:(0.1+rnd()*0.18).toFixed(2)}, gMid);
    el("rect", {x:x, y:base-h, width:w, height:2.5, fill:"#8d8378", opacity:0.22}, gMid);

    /* roof character */
    var roof = rnd();
    if(roof < 0.22){
      el("rect", {x:x+w*0.28, y:base-h-rr(18,44), width:w*0.42, height:50, fill:grad}, gMid);
      var mast = rr(60,96);
      el("rect", {x:x+w*0.46, y:base-h-mast, width:2.5, height:mast, fill:"#2b2d34"}, gMid);
      var bc = el("circle", {cx:x+w*0.47+1.2, cy:base-h-mast-2, r:2.4, fill:"#ff5a4a"}, gMid);
      bc.setAttribute("style","animation:beacon 2.5s linear infinite");
    } else if(roof < 0.44){
      el("rect", {x:x+w*0.2, y:base-h-14, width:w*0.6, height:14, fill:"#33373f", opacity:0.9}, gMid);
    } else if(roof < 0.56){
      el("rect", {x:x+w*0.42, y:base-h-26, width:rr(10,18), height:26, fill:"#3b3f47"}, gMid);
    }

    /* this building's own light waves, and their matching reflections */
    var waveNames = buildingWaves(bi, 4, 0.16);
    var litG = [], refG = [];
    for(var wi0=0; wi0<4; wi0++){
      litG.push(waveGroup(gMidL, waveNames[wi0]));
      refG.push(waveGroup(gRefl, waveNames[wi0]));
    }

    /* window rhythm */
    var rhythm = rnd();
    var cols = Math.max(3, Math.floor(frontW/19));
    var rows = Math.max(4, Math.floor(h/26));
    var cw = frontW/cols, ch = h/rows;
    var bandRows = {}, bandCols = {};
    if(rhythm < 0.3){ for(var r0=0;r0<rows;r0++) if(rnd()<0.26) bandRows[r0]=1; }
    if(rhythm > 0.68){ for(var c0=0;c0<cols;c0++) if(rnd()<0.2) bandCols[c0]=1; }
    for(var r=0; r<rows; r++){
      for(var c=0; c<cols; c++){
        var ww = Math.max(3.4, cw*0.4), wh = Math.max(4.6, ch*0.46);
        var wx = x + c*cw + (cw-ww)/2;
        var wy = base - h + 8 + r*ch + (ch-wh)/2;
        var lit;
        if(bandRows[r]) lit = rnd() < 0.82;
        else if(bandCols[c]) lit = rnd() < 0.74;
        else lit = rnd() < 0.46;
        if(!lit){
          el("rect", {x:wx, y:wy, width:ww, height:wh, fill:"#1c1f27",
                      opacity:(0.35+rnd()*0.4).toFixed(2)}, gMid);
          continue;
        }
        var col = rnd() < 0.62 ? warm : cool;
        var op = (0.55 + rnd()*0.45).toFixed(2);
        /* a diagonal sweep across the facade, so floors light in sequence */
        var gi = (c + r) % 4;
        el("rect", {x:wx, y:wy, width:ww, height:wh, fill:col, "fill-opacity":op}, litG[gi]);
        litWindows.push({x:wx, y:wy, w:ww, h:wh, fill:col, op:op, g:refG[gi]});
      }
    }
    /* a couple of windows on the shadowed side face */
    var sw2 = Math.max(1, Math.floor(sideW/13));
    for(var s=0; s<sw2; s++){
      if(rnd() < 0.45){
        var swx = x+frontW+3+s*((sideW-6)/sw2);
        var swy = base-h+14+Math.floor(rnd()*(h-24)/13)*13;
        var scol = rnd()<0.7 ? warm : cool;
        var sgi = Math.floor(rnd()*4);
        el("rect", {x:swx, y:swy, width:3, height:6, fill:scol, "fill-opacity":0.6}, litG[sgi]);
        litWindows.push({x:swx, y:swy, w:3, h:6, fill:scol, op:0.6, g:refG[sgi]});
      }
    }
    /* the tower's dark mass in the water */
    addReflection(x, base-h, w, h, "#0b1120", 0.34, refG[0]);
  });

  /* ---------------- LAYER 3: near low-rise waterfront + signs ---------------- */
  var nx = -30;
  var signColors = ["#ff6fae","#7ad7ff","#ffcf6b","#8affc1","#ff9b6b"];
  var signWords = ["HOTEL","CAFE","BAR","PIZZA","CLUB","LATE","24H","RAMEN"];
  var nearCount = 0;
  while(nx < 1035 && nearCount < 13){
    var nw = rr(80,210);
    /* most are low, a few are taller, so the frontage has a rhythm */
    var nh = rnd() < 0.22 ? rr(140,215) : rr(40,120);
    el("rect", {x:nx, y:588-nh, width:nw, height:nh,
                fill: rnd()<0.3 ? "#2b2d33" : "url(#gNear)"}, gNear);
    el("rect", {x:nx+nw-4, y:588-nh, width:4, height:nh, fill:"#6b523c", opacity:0.2}, gNear);
    el("rect", {x:nx, y:588-nh, width:nw, height:2, fill:"#6a6560", opacity:0.2}, gNear);
    if(rnd()<0.5){
      el("rect", {x:nx+nw*0.15, y:588-nh-9, width:rr(14,30), height:9, fill:"#262930"}, gNear);
    }
    if(rnd()<0.4){
      el("rect", {x:nx+nw*0.7, y:588-nh-rr(14,26), width:2, height:rr(14,26), fill:"#23262c"}, gNear);
    }
    var nNames = buildingWaves(10 + nearCount, 3, 0.085);
    var nLit = [], nRef = [];
    for(var wi1=0; wi1<3; wi1++){
      nLit.push(waveGroup(gNearL, nNames[wi1]));
      nRef.push(waveGroup(gRefl, nNames[wi1]));
    }
    var ncols = Math.max(3, Math.floor(nw/24)), nrows = Math.max(2, Math.floor(nh/20));
    for(var nr=0; nr<nrows; nr++){
      for(var nc=0; nc<ncols; nc++){
        if(rnd() < 0.42){
          var ww2 = 7, wh2 = 9;
          var wx2 = nx + 10 + nc*(nw-20)/ncols;
          var wy2 = 588-nh + 9 + nr*(nh-16)/nrows;
          var c2 = rnd()<0.55 ? warm : cool;
          var o2 = (0.5+rnd()*0.5).toFixed(2);
          var gi2 = (nc + nr) % 3;
          el("rect", {x:wx2, y:wy2, width:ww2, height:wh2, fill:c2, "fill-opacity":o2}, nLit[gi2]);
          litWindows.push({x:wx2, y:wy2, w:ww2, h:wh2, fill:c2, op:o2, g:nRef[gi2]});
        }
      }
    }
    /* neon sign on the roofline */
    if(rnd()<0.42){
      var sc = pick(signColors);
      var sx = nx + rr(10, Math.max(12, nw-70)), sy = 588-nh-rr(14,26);
      var sgi2 = Math.floor(rnd()*3);
      var sg = nLit[sgi2];
      el("rect", {x:sx-4, y:sy-4, width:64, height:24, fill:sc, opacity:0.12}, sg);
      el("rect", {x:sx, y:sy, width:56, height:16, fill:sc, opacity:0.22}, sg);
      var txt = el("text", {x:sx+4, y:sy+12, fill:sc, "font-size":"11",
        "font-family":"ui-sans-serif,system-ui,sans-serif", "letter-spacing":"2.4", "font-weight":"700"}, sg);
      txt.textContent = pick(signWords);
    }
    addReflection(nx, 588-nh, nw, nh, "#090d18", 0.3, nRef[0]);
    nx += nw - rr(2,26);
    if(rnd() < 0.3) nx += rr(14,40);
    nearCount++;
  }

  /* ---------------- a line of distant lights on the far shore ---------------- */
  var shoreNames = buildingWaves(30, 4, 0.015);
  var shoreG = [], shoreRef = [];
  for(var sI=0; sI<4; sI++){
    shoreG.push(waveGroup(gRoadL, shoreNames[sI]));
    shoreRef.push(waveGroup(gRefl, shoreNames[sI]));
  }
  for(var shx=1050; shx<1180; shx+=rr(9,19)){
    var shg = shoreG[Math.floor(rnd()*4)];
    el("circle", {cx:shx, cy:rr(586,596), r:rr(0.8,1.7), fill:"#ffd9a0", "fill-opacity":0.75}, shg);
    el("rect", {x:shx-2, y:rr(586,596), width:rr(3,7), height:1, fill:"#ffd9a0", opacity:0.22}, shg);
    el("rect", {x:shx-1, y:600, width:2, height:rr(8,18), fill:"#ffd9a0", opacity:0.13},
       shoreRef[Math.floor(rnd()*4)]);
  }

  /* ---------------- waterfront road + sodium street lamps ---------------- */
  el("rect", {x:-40, y:574, width:1100, height:28, fill:"url(#gRoad)"}, gRoad);
  el("rect", {x:-40, y:573.2, width:1100, height:1.6, fill:"#4a4a4e", opacity:0.22}, gRoad);
  el("rect", {x:-40, y:584, width:1100, height:1.4, fill:"#c9a56a", opacity:0.10}, gRoad);

  var lampNames = buildingWaves(0, 5, 0.02);
  var lampG = [], lampRef = [];
  for(var lI=0; lI<5; lI++){
    lampG.push(waveGroup(gRoadL, lampNames[lI]));
    lampRef.push(waveGroup(gRefl, lampNames[lI]));
  }
  var lamps = [];
  for(var lx = 24; lx < 1090; lx += rr(74,104)) lamps.push(lx);
  lamps.forEach(function(px, i){
    var gi = Math.min(4, Math.floor(i*5/lamps.length));
    var g = lampG[gi];
    el("rect", {x:px, y:562, width:2.2, height:20, fill:"#262930"}, g);
    el("rect", {x:px-3.5, y:559, width:9, height:3, fill:"#2b2e34"}, g);
    el("ellipse", {cx:px+1, cy:560, rx:13, ry:11, fill:"url(#gHaloSodium)"}, g);
    el("circle", {cx:px+1, cy:560, r:2.1, fill:"#ffab4d"}, g);
    el("ellipse", {cx:px+1, cy:583, rx:17, ry:4.5, fill:"#ffab4d", opacity:0.14}, g);
    /* the lamp's smear in the water */
    var ry2 = 600 + (600-554)*0.82;
    el("rect", {x:px-1.5, y:ry2, width:5, height:rr(16,26), fill:"#ffab4d", opacity:0.1}, lampRef[gi]);
  });

  /* ---------------- water reflections of the lit windows ---------------- */
  litWindows.forEach(function(w){
    addReflection(w.x, w.y, w.w, w.h, w.fill, (parseFloat(w.op)*0.32).toFixed(3), w.g);
  });
  /* long smeared streaks from the brightest clusters */
  for(var s2=0; s2<22; s2++){
    var sx2 = rr(0,1600), sw2b = rr(30,160), sy2 = rr(612,880);
    el("rect", {x:sx2, y:sy2, width:sw2b, height:rr(1.4,3.4),
                fill: rnd()<0.6 ? "#ffd9a0" : "#bcd8ff",
                opacity:(0.05+rnd()*0.1).toFixed(3)}, gRefl);
  }

  /* ---------------- ripple bands (drifting, loop-safe) ---------------- */
  function rippleLayer(count, cls, opacity){
    var g = el("g", {"class":"rip "+cls, opacity:opacity}, gRipples);
    g.setAttribute("style","animation:"+cls+" 10s ease-in-out infinite");
    for(var i=0; i<count; i++){
      el("rect", {x:rr(-60,1660), y:rr(602,898), width:rr(60,420), height:rr(1.2,4.2),
                  fill:"#0b1220"}, g);
    }
    return g;
  }
  rippleLayer(24, "driftA", 0.5);
  rippleLayer(18, "driftB", 0.34);
  rippleLayer(22, "driftC", 0.42);
  /* glinting highlights riding on the water */
  for(var gl=0; gl<30; gl++){
    el("rect", {x:rr(0,1600), y:rr(606,890), width:rr(14,90), height:1.3,
                fill:"#cfe0ff", opacity:(0.05+rnd()*0.12).toFixed(3)}, gRipples);
  }

  /* ---------------- sky cloud band ---------------- */
  var cg = el("g", {}, gClouds);
  cg.setAttribute("style","animation:cloudPass 10s linear infinite");
  [{x:120,y:210,rx:260,ry:64,f:"url(#gCloud)"},{x:420,y:160,rx:200,ry:48,f:"url(#gCloud)"},
   {x:760,y:250,rx:300,ry:58,f:"url(#gCloudWarm)"},{x:1080,y:190,rx:230,ry:52,f:"url(#gCloud)"},
   {x:1400,y:270,rx:280,ry:60,f:"url(#gCloudWarm)"},{x:300,y:300,rx:320,ry:44,f:"url(#gCloud)"}]
  .forEach(function(c){ el("ellipse", {cx:c.x, cy:c.y, rx:c.rx, ry:c.ry, fill:c.f}, cg); });

  /* ---------------- car art (reused, also mirrored for reflections) ---------------- */
  var carArt = el("g", {id:"carArt"}, document.querySelector("defs"));
  el("rect", {x:-17, y:-7, width:34, height:7, rx:2.5, fill:"#14171f"}, carArt);
  el("ellipse", {cx:16,  cy:-3.5, rx:11, ry:9, fill:"url(#gHaloWhite)"}, carArt);
  el("ellipse", {cx:-16, cy:-3.5, rx:8,  ry:7, fill:"url(#gHaloRed)"}, carArt);
  el("circle", {cx:14.4, cy:-3.6, r:2.0, fill:"#fff4d8"}, carArt);
  el("circle", {cx:17.6, cy:-3.6, r:2.0, fill:"#fff4d8"}, carArt);
  el("circle", {cx:-14.2,cy:-3.6, r:1.5, fill:"#ff5236"}, carArt);
  el("circle", {cx:-17.2,cy:-3.6, r:1.5, fill:"#ff5236"}, carArt);

  /* ---------------- TRAFFIC: 9 cars, different speeds, looping ----------------
     Cars run the waterfront road and fade in and out at the ends, so the wrap
     back to the start is never visible. */
  var speeds = [10,10,5,5,2.5,2.5,10,5,2.5];
  var lanes  = [588, 596, 584, 594, 592, 586, 590, 598, 593];
  var carCss = "";
  for(var ci=0; ci<9; ci++){
    var dur = speeds[ci], dir = (ci%3===0) ? -1 : 1;
    var delay = (rnd()*dur).toFixed(2);
    var x0 = -300, x1 = 1150;
    if(dir < 0){ x0 = 1150; x1 = -300; }
    carCss += "@keyframes car"+ci+"{0%{transform:translateX("+x0+"px);opacity:0}"+
              "5%{opacity:1}92%{opacity:1}100%{transform:translateX("+x1+"px);opacity:0}}";
    var outer = el("g", {class:"car"}, gTraffic);
    outer.setAttribute("style","animation-name:car"+ci+";animation-duration:"+dur+
      "s;animation-timing-function:linear;animation-iteration-count:infinite;animation-delay:-"+delay+"s");
    var inner = el("g", {transform:"translate(0,"+lanes[ci]+")"}, outer);
    use("#carArt", inner);
    /* the twin in the water */
    var reflWrap = el("g", {transform:"translate(0,1200) scale(1,-1)", opacity:0.38}, outer);
    var reflInner = el("g", {transform:"translate(0,"+lanes[ci]+")"}, reflWrap);
    use("#carArt", reflInner);
  }
  css += carCss;

  /* ---------------- BRIDGE: crosses the river on the right third ---------------- */
  var b = gBridge;
  var deckX0 = 1074, deckY0 = 588, deckX1 = 1600, deckY1 = 772;
  function deckY(x){ return deckY0 + (deckY1 - deckY0) * (x - deckX0) / (deckX1 - deckX0); }
  var farTX = 1268, farBase = deckY(farTX), farTop = 348;
  var nearTX = 1452, nearBase = deckY(nearTX), nearTop = 258;
  /* deck slab */
  el("path", {d:"M"+deckX0+","+(deckY0-9)+" L"+deckX1+","+(deckY1-14)+
              " L"+deckX1+","+deckY1+" L"+deckX0+","+deckY0+" Z", fill:"#2a2d34"}, b);
  el("path", {d:"M"+deckX0+","+deckY0+" L"+deckX1+","+deckY1+
              " L"+deckX1+","+(deckY1+4.6)+" L"+deckX0+","+(deckY0+3.4)+" Z",
              fill:"#5a5f68", opacity:0.62}, b);
  el("path", {d:"M"+deckX0+","+(deckY0+3)+" L"+deckX1+","+(deckY1+4)+
              " L"+deckX1+","+(deckY1+6.6)+" L"+deckX0+","+(deckY0+5.6)+" Z",
              fill:"#ffcf95", opacity:0.15}, b);
  /* towers: the far one smaller, the near one taller */
  [[farTX, farBase, farTop, 18, 9],[nearTX, nearBase, nearTop, 28, 14]].forEach(function(t){
    var tx = t[0], tb = t[1], tt = t[2], tw = t[3], half = t[4];
    el("rect", {x:tx-half, y:tt, width:tw, height:tb-tt, fill:"url(#gTowerB)"}, b);
    el("rect", {x:tx+half-5, y:tt, width:5, height:tb-tt, fill:"#8a6446", opacity:0.4}, b);
    el("rect", {x:tx-half-4, y:tt-8, width:tw+8, height:10, fill:"#3c414a"}, b);
    for(var y=tt+32; y<tb-10; y+=60){
      el("rect", {x:tx-half, y:y, width:tw, height:4.5, fill:"#2e323a"}, b);
    }
    el("rect", {x:tx-half-3, y:tb-14, width:tw+6, height:16, fill:"#23262c"}, b);
  });
  /* main cable: a catenary between the two tower tops, plus backstays to the banks */
  function cableY(x){
    var t = (x - farTX) / (nearTX - farTX);
    return farTop + (nearTop - farTop) * t + 70 * 4 * t * (1 - t);
  }
  el("path", {d:"M"+farTX+","+farTop+" Q"+((farTX+nearTX)/2)+","+((farTop+nearTop)/2+140)+" "+
              nearTX+","+nearTop, fill:"none", stroke:"#333841", "stroke-width":"3.4"}, b);
  el("path", {d:"M"+farTX+","+farTop+" L"+deckX0+","+deckY0, fill:"none", stroke:"#333841", "stroke-width":"2.4"}, b);
  el("path", {d:"M"+nearTX+","+nearTop+" L"+deckX1+","+deckY1, fill:"none", stroke:"#333841", "stroke-width":"3"}, b);
  /* hangers */
  for(var hx=farTX+14; hx<nearTX-10; hx+=18){
    var cy2 = cableY(hx), dy2 = deckY(hx);
    if(dy2 - cy2 < 4) continue;
    el("rect", {x:hx, y:cy2, width:1.3, height:dy2-cy2, fill:"#2c303a", opacity:0.85}, b);
  }
  /* tiny warm lights along the deck */
  for(var dl=deckX0+10; dl<deckX1-6; dl+=17){
    var ly = deckY(dl) - 2, glow = rnd();
    var gg = el("g", {}, b);
    el("ellipse", {cx:dl, cy:ly, rx:6.5, ry:5.5, fill:"url(#gHaloWarm)",
                   opacity:(0.5+glow*0.4).toFixed(2)}, gg);
    el("circle", {cx:dl, cy:ly, r:1.4, fill:"#ffd9a0", "fill-opacity":(0.65+glow*0.35).toFixed(2)}, gg);
  }
  /* a few vehicles crawling along the deck */
  [[1160,0.8],[1330,0.92],[1540,1.05]].forEach(function(v){
    var vg = el("g", {transform:"translate("+v[0]+","+(deckY(v[0])-4)+") scale("+v[1]+")"}, b);
    el("rect", {x:-15, y:-6, width:30, height:6, rx:2, fill:"#15181f"}, vg);
    el("ellipse", {cx:13, cy:-3, rx:9, ry:7.5, fill:"url(#gHaloWhite)"}, vg);
    el("circle", {cx:13, cy:-3, r:1.7, fill:"#fff4d8"}, vg);
    el("ellipse", {cx:-13, cy:-3, rx:6, ry:5.5, fill:"url(#gHaloRed)"}, vg);
    el("circle", {cx:-13, cy:-3, r:1.3, fill:"#ff5236"}, vg);
  });

  /* the bridge's reflection: a soft smear under each tower and the deck line,
     since the bridge stands in the water rather than on the far bank */
  var brRefl = el("g", {"clip-path":"url(#waterClip)"}, gRefl);
  [[farTX, farBase, 0.3],[nearTX, nearBase, 0.42]].forEach(function(v){
    var tx = v[0], tb = v[1], k = v[2];
    for(var i=0; i<9; i++){
      var fy = tb + i*13;
      if(fy > 892) break;
      el("rect", {x:tx - (14 - i*1.1), y:fy, width:28 - i*2.2, height:5,
                  fill:"#2f3340", opacity:(0.34*(1 - i/9)).toFixed(3)}, brRefl);
    }
    /* the sodium wash the tower throws on the water */
    el("ellipse", {cx:tx, cy:tb+16, rx:26, ry:10, fill:"#ffab4d", opacity:0.07}, brRefl);
  });
  /* the deck's lights, smeared into the river */
  for(var dl2=deckX0+10; dl2<deckX1-6; dl2+=26){
    var ly2 = deckY(dl2);
    el("rect", {x:dl2-2, y:ly2+6, width:4, height:rr(8,20), fill:"#ffd9a0", opacity:0.16}, brRefl);
    el("rect", {x:dl2-4, y:ly2+4, width:8, height:2, fill:"#ffd9a0", opacity:0.1}, brRefl);
  }

  /* ---------------- the generated keyframes ----------------
     Every wave set and the car keyframes go into one stylesheet, added once
     the whole scene has been declared. */
  dyn.textContent = css;
  document.head.appendChild(dyn);

  /* ---------------- promote the animated layers ----------------
     Applied after the scene is built and again after a reflow, so the browser
     gives the moving groups their own compositor layers. A sliding car or a
     drifting ripple then composites instead of forcing the whole SVG to
     repaint on every frame. */
  function promote(){
    /* Only the large, continuously moving groups are promoted. The light
       groups are small, and giving 130 of them their own compositor layer
       costs more than it saves, so they are left to repaint in place. */
    var rip = document.querySelectorAll(".rip");
    for(var j=0;j<rip.length;j++) rip[j].style.willChange = "transform";
    var car = document.querySelectorAll(".car");
    for(var k=0;k<car.length;k++) car[k].style.willChange = "transform,opacity";
    var ids = ["clouds","ripples","traffic"];
    for(var m=0;m<ids.length;m++) $(ids[m]).style.willChange = "transform,opacity";
  }
  promote();
  void document.documentElement.getBoundingClientRect().width;
  requestAnimationFrame(promote);
  setTimeout(promote, 400);
})();
</script>
</body>
</html>
