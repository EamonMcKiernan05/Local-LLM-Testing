function postPass(prog, target, srcTex, extra){
  gl.bindFramebuffer(gl.FRAMEBUFFER, target? target.fbo : null);
  gl.viewport(0,0,target? target.w : RW, target? target.h : RH);
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.CULL_FACE); gl.disable(gl.BLEND);
  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcTex); UI(prog,'uScene',0); UI(prog,'uTex',0);
  if (extra) extra(prog);
  fullscreen();
}
function renderPost(){
  var thr = HDR ? 2.35 : 0.92;
  postPass(progs.bright, fbos.b1, fbos.scene.tex, function(p){ UF(p,'uThreshold',thr); });
  postPass(progs.blur, fbos.b1b, fbos.b1.tex, function(p){ gl.uniform2f(p.u('uDir'), 1.1/fbos.b1.w, 0); });
  postPass(progs.blur, fbos.b1, fbos.b1b.tex, function(p){ gl.uniform2f(p.u('uDir'), 0, 1.1/fbos.b1.h); });
  postPass(progs.blur, fbos.b2, fbos.b1.tex, function(p){ gl.uniform2f(p.u('uDir'), 2.0/fbos.b1.w, 0); });
  postPass(progs.blur, fbos.b2b, fbos.b2.tex, function(p){ gl.uniform2f(p.u('uDir'), 0, 2.0/fbos.b2.h); });

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,RW,RH);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
  var p = progs.comp;
  gl.useProgram(p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbos.scene.tex); UI(p,'uScene',0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fbos.b1.tex); UI(p,'uBloom1',1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, fbos.b2b.tex); UI(p,'uBloom2',2);
  gl.uniform2f(p.u('uRes'), RW, RH);
  UF(p,'uAspect', RW/RH);
  UF(p,'uTime', clock.world);
  UF(p,'uExposure', F.exposure);
  UF(p,'uBloom', DBG.nobloom ? 0.0 : 0.90);
  UF(p,'uMB', cam.blur);
  gl.uniform2f(p.u('uMBDir'), cam.blurDir[0], cam.blurDir[1]);
  U3(p,'uSunColor', F.sun);
  gl.uniform2f(p.u('uSunUV'), F.sunUV[0], F.sunUV[1]);
  UF(p,'uSunVis', F.sunVis);
  UF(p,'uNight', F.night);
  UF(p,'uDebug', DBG.albedo);
  fullscreen();
}

function render(){
  drawShadowPass();

  // reflection pass
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.refl.fbo);
  gl.viewport(0,0,fbos.refl.w,fbos.refl.h);
  gl.clearColor(F.fog[0]*0.3, F.fog[1]*0.3, F.fog[2]*0.3, 1);
  gl.depthMask(true);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawSky(F.reflInvVP, F.reflEye);
  drawSolid(F.reflVP, F.reflEye, true);
  drawPetals(F.reflVP, F.reflRight, F.reflUp);
  drawRain(F.reflVP, F.reflRight);

  // main pass
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.scene.fbo);
  gl.viewport(0,0,fbos.scene.w,fbos.scene.h);
  gl.clearColor(F.fog[0]*0.4, F.fog[1]*0.4, F.fog[2]*0.4, 1);
  gl.depthMask(true);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (!DBG.solidOnly){
    drawSky(F.invVP, F.eye);
    drawCloudSea();
    drawPuffs();
  }
  drawSolid(F.vp, F.eye, false);
  drawKoi();
  if (!DBG.solidOnly){
    drawWater();
    drawPetals(F.vp, F.camRight, F.camUp);
    drawRain(F.vp, F.camRight);
    drawGlow();
  }

  renderPost();
  perf.drawCalls = 0;
}

/* -------------------------------- resize -------------------------------- */
function onResize(){
  var cw = Math.max(1, window.innerWidth);
  var ch = Math.max(1, window.innerHeight);
  var dpr = Math.min(window.devicePixelRatio || 1, CFG.maxDpr);
  if (cw*ch*dpr*dpr > CFG.maxPixels) dpr = Math.sqrt(CFG.maxPixels/(cw*ch));
  W = cw; H = ch;
  var nw = Math.max(1, Math.round(cw*dpr)), nh = Math.max(1, Math.round(ch*dpr));
  if (canvas.width !== nw || canvas.height !== nh){
    canvas.width = nw; canvas.height = nh;
  }
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  RW = canvas.width; RH = canvas.height;
  DPR = dpr;
  if (!fbos.scene){ createRenderTargets(); }
  else { createRenderTargets(); }
  cam.fit = fitDistance(cam.tYaw, cam.tPitch);
  cam.minDist = cam.fit*0.60;
  cam.maxDist = cam.fit*2.4;
  if (!started){
    cam.dist = cam.tDist = cam.fit;
  } else {
    if (cam.tDist < cam.fit*0.99) cam.tDist = cam.fit;
    if (cam.dist < cam.fit*0.95) cam.dist = cam.fit;
    cam.tDist = clamp(cam.tDist, cam.minDist, cam.maxDist);
    cam.dist = clamp(cam.dist, cam.minDist, cam.maxDist);
  }
}

/* --------------------------------- ui ----------------------------------- */
var lastWake = 0;
function wakeUI(){
  lastWake = performance.now();
  var ui = document.getElementById('ui');
  if (ui.classList.contains('idle')) ui.classList.remove('idle');
}
function initUI(){
  var ui = document.getElementById('ui');
  var buttons = document.querySelectorAll('#controls button');
  lastWake = performance.now();

  function preset(name, phase){
    clock.phaseTarget = phase;
    for (var i=0;i<buttons.length;i++){
      var b = buttons[i];
      if (b.dataset.action==='morning'||b.dataset.action==='golden'||b.dataset.action==='night') b.classList.remove('on');
    }
    var el = document.querySelector('button[data-action="'+name+'"]');
    if (el) el.classList.add('on');
    wakeUI();
  }
  function resetView(){
    cam.cinematic = false;
    var el = document.querySelector('button[data-action="cinematic"]');
    if (el) el.classList.remove('on');
    var d = ((CFG.heroYaw - cam.yaw + Math.PI*3) % (Math.PI*2)) - Math.PI;
    cam.tYaw = cam.yaw + d;
    cam.tPitch = CFG.heroPitch;
    cam.tDist = cam.fit;
    wakeUI();
  }
  buttons.forEach(function(b){
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      var a = b.dataset.action;
      if (a==='morning') preset('morning', 0.345);
      else if (a==='golden') preset('golden', 0.626);
      else if (a==='night') preset('night', 0.835);
      else if (a==='cinematic'){
        cam.cinematic = !cam.cinematic;
        b.classList.toggle('on', cam.cinematic);
        if (cam.cinematic){ cam.cineYaw = cam.yaw; cam.tPitch = 0.255; cam.tDist = cam.fit*1.01; }
        wakeUI();
      } else if (a==='pause'){
        clock.paused = !clock.paused;
        b.classList.toggle('on', clock.paused);
        wakeUI();
      } else if (a==='reset'){
        resetView();
      }
    });
  });

  var golden = document.querySelector('button[data-action="golden"]');
  if (golden) golden.classList.add('on');

  window.addEventListener('pointermove', function(){ wakeUI(); }, {passive:true});
  window.addEventListener('keydown', function(ev){
    if (ev.code === 'Space'){ ev.preventDefault(); document.querySelector('button[data-action="pause"]').click(); }
    else if (ev.key === 'c' || ev.key === 'C'){ document.querySelector('button[data-action="cinematic"]').click(); }
    else if (ev.key === 'r' || ev.key === 'R'){ resetView(); }
    else if (ev.key === '1'){ preset('morning', 0.345); }
    else if (ev.key === '2'){ preset('golden', 0.626); }
    else if (ev.key === '3'){ preset('night', 0.835); }
    wakeUI();
  });

  var cvs = canvas;
  cvs.addEventListener('pointerdown', function(ev){
    if (ev.button !== 0 && ev.pointerType === 'mouse') return;
    cam.dragging = true; cam.moved = false;
    cam.lastX = ev.clientX; cam.lastY = ev.clientY;
    cvs.classList.add('drag');
    try { cvs.setPointerCapture(ev.pointerId); } catch(e){}
    wakeUI();
  });
  cvs.addEventListener('pointermove', function(ev){
    if (!cam.dragging) return;
    var dx = ev.clientX - cam.lastX;
    var dy = ev.clientY - cam.lastY;
    cam.lastX = ev.clientX; cam.lastY = ev.clientY;
    if (Math.abs(dx)+Math.abs(dy) > 0.5) cam.moved = true;
    cam.cinematic = false;
    var cb = document.querySelector('button[data-action="cinematic"]');
    if (cb) cb.classList.remove('on');
    var sp = (ev.pointerType === 'touch') ? 0.006 : 0.0048;
    cam.tYaw -= dx*sp;
    cam.tPitch = clamp(cam.tPitch + dy*sp*0.8, -0.04, 1.05);
  });
  function endDrag(ev){
    if (!cam.dragging) return;
    cam.dragging = false;
    cvs.classList.remove('drag');
    try { cvs.releasePointerCapture(ev.pointerId); } catch(e){}
  }
  cvs.addEventListener('pointerup', endDrag);
  cvs.addEventListener('pointercancel', endDrag);
  cvs.addEventListener('wheel', function(ev){
    ev.preventDefault();
    cam.tDist = clamp(cam.tDist * Math.exp(ev.deltaY*0.0011), cam.minDist, cam.maxDist);
    wakeUI();
  }, {passive:false});
  cvs.addEventListener('dblclick', function(){ resetView(); });
}

function updateUI(now){
  var ui = document.getElementById('ui');
  if (now - lastWake > 10000){
    if (!ui.classList.contains('idle')) ui.classList.add('idle');
  }
}

      cam.fit = fitDistance(cam.tYaw, cam.tPitch);
      cam.minDist = cam.fit*0.6; cam.maxDist = cam.fit*2.4;
      return { fit: cam.fit };
    },
    look: function(x,y,z,d){ CFG.camTarget=[x,y,z]; if(d!==undefined){ cam.tDist=d; cam.dist=d; } cam.fit=fitDistance(cam.tYaw,cam.tPitch); cam.minDist=cam.fit*0.4; cam.maxDist=cam.fit*2.4; },
    heroTarget: function(){ CFG.camTarget=[0.0,6.2,0.0]; cam.fit=fitDistance(cam.tYaw,cam.tPitch); cam.tDist=cam.fit; cam.dist=cam.fit; },
    debug: function(o){ if(o) for(var k in o) DBG[k]=o[k]; return DBG; },
    project: function(x,y,z){ var q=transformPoint(F.vp,[x,y,z]); return { x:(q[0]*0.5+0.5)*W, y:(1-(q[1]*0.5+0.5))*H }; },
    vprobe: function(x,z){ var out=[]; var n=SV.length/12; for(var i=0;i<n;i++){ var o=i*12; if (Math.abs(SV[o]-x)<0.4 && Math.abs(SV[o+1])<0.4 && Math.abs(SV[o+2]-z)<0.4 && SV[o+4]>0.9){ out.push({p:[SV[o],SV[o+1],SV[o+2]], c:[+SV[o+6].toFixed(3),+SV[o+7].toFixed(3),+SV[o+8].toFixed(3)], m:SV[o+9], e:SV[o+10], s:+SV[o+11].toFixed(2)}); if(out.length>10) break; } } return out; },
    lights: function(){ return { sun:F.sun, key:F.keyColor, keyI:F.keyI, amb:F.amb, gnd:F.gnd, exp:F.exposure, dir:F.sunDir, lanternI:F.lantern, lamp:F.lampColor, cloudLit:F.cloudLit, cloudDark:F.cloudDark }; },
    probe: function(x,z){ var g=groundMatAt(x,z); return {mat:g.mat, col:[+g.c[0].toFixed(3),+g.c[1].toFixed(3),+g.c[2].toFixed(3)], paved:isPaved(x,z), h:groundH(x,z)}; },
    setPhase: function(p){ clock.phase = p; clock.phaseTarget = -1; },
    setTime: function(v){ clock.world = v; },
    setRain: function(v){ clock.rainAmt = v; clock.wet = v; },
    state: function(){
      return {
        phase: clock.phase, targetPhase: clock.phaseTarget, raining: clock.raining, bob: F.bob, planeY: F.planeY,
        rainAmt: clock.rainAmt, wet: clock.wet, paused: clock.paused,
        cinematic: cam.cinematic, yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist,
        fit: cam.fit, blur: cam.blur, sunElev: F.sunDir[1], sunVis: F.sunVis, points: FIT_PTS.length,
        exposure: F.exposure, night: F.night, lantern: F.lantern,

      };
    }
  };
  var last = performance.now();
  var frames = 0, acc = 0, fpsT = 0;
  function loop(now){
    var dt = (now - last)/1000;

    if (dt > 0.05) dt = 0.05;

      STATS.fps = Math.round(perf.frames / perf.acc);
      perf.frames = 0; perf.acc = 0;
      window.__stats = { fps: STATS.fps, drawCalls: STATS.calls, phase: clock.phase, raining: clock.raining, blur: cam.blur };
    }
    try {
      updateFrame(dt);
      updateCamera(dt);
      updateUI(now);
      render();
      if (!started){
        started = true;
        var boot = document.getElementById('boot');
        if (boot){ boot.classList.add('gone'); setTimeout(function(){ if (boot.parentNode) boot.parentNode.removeChild(boot); }, 1400); }
      }
    } catch(err){
      showError('The renderer stopped unexpectedly.', err && err.stack ? err.stack : String(err));
      return;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.addEventListener('resize', function(){ wakeUI(); onResize(); });
  window.addEventListener('orientationchange', function(){ setTimeout(onResize, 220); });
}

requestAnimationFrame(function(){
  requestAnimationFrame(function(){
    setTimeout(function(){
      try {
        initEverything();
      } catch(err){
        showError('The scene could not be built.', err && err.stack ? err.stack : String(err));
      }
    }, 30);
  });
});

})();
</script>
