function makeWrackGeometry() {
  const geos = [];
  const rng = new RNG(SITE.seed + 1200);
  for (let i = 0; i < 5; i++) {
    const a = rng.range(0, TAU);
    const len = rng.range(0.13, 0.28);
    const wid = rng.range(0.025, 0.05);
    const pos = [
      Math.cos(a) * len, 0.012, Math.sin(a) * len,
      Math.cos(a + 1.8) * wid, 0.0, Math.sin(a + 1.8) * wid,
      -Math.cos(a + 0.2) * len * 0.7, 0.008, -Math.sin(a + 0.2) * len * 0.7
    ];
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute([0, 1, 0, 0, 1, 0, 0, 1, 0], 3));
    geos.push(g);
  }
  return mergeGeos(geos);
}
function buildWrack() {
  const max = 240;
  const geo = makeWrackGeometry();
  const list = [];
  for (let i = 0; i < max; i++) list.push({ pos: [0, -50, 0], rot: [0, 0, 0], scale: 0.0001, color: '#4a3f26' });
  const mesh = instancedFrom(geo, MAT.wrack, list, { cast: false, receive: true });
  mesh.frustumCulled = false;
  mesh.count = 0;
  SCENE.add(mesh);
  SEA.wrack = { mesh, max, used: 0, cursor: 0, items: list, dummy: makeDummy() };
}
function spawnWrackAt(x, z, surfaceY, scale, hue) {
  const W = SEA.wrack;
  const idx = W.cursor % W.max;
  W.cursor++;
  W.used = Math.min(W.max, Math.max(W.used, W.cursor));
  W.mesh.count = W.used;
  const d = W.dummy;
  setDummy(d, x, surfaceY + 0.014, z, 0, hue, 0, scale, scale, scale);
  W.mesh.setMatrixAt(idx, d.m);
  const c = new THREE.Color().setHSL(0.075 + (hue % 1) * 0.05, 0.48, 0.34 + (scale % 0.2) * 0.5);
  W.mesh.setColorAt(idx, c);
  W.mesh.instanceMatrix.needsUpdate = true;
  if (W.mesh.instanceColor) W.mesh.instanceColor.needsUpdate = true;
}

/* ---------------- updates ---------------- */
function spawnSprayBurst(x, y, z, n, power) {
  const S = SEA.spray;
  if (!S) return;
  const st = S.state;
  for (let i = 0; i < n; i++) {
    const k = st.next % st.max; st.next++;
    st.life[k] = 0;
    st.maxLife[k] = 0.7 + FXR.next() * 0.9;
    st.positions[k * 3] = x + (FXR.next() - 0.5) * 2.0;
    st.positions[k * 3 + 1] = y + FXR.next() * 0.5;
    st.positions[k * 3 + 2] = z + (FXR.next() - 0.5) * 1.2;
    const up = 1.2 + FXR.next() * 2.4;
    st.vel[k * 3] = (FXR.next() - 0.5) * 1.1 + SITE.wind.x * 1.0;
    st.vel[k * 3 + 1] = up * power;
    st.vel[k * 3 + 2] = (FXR.next() - 0.5) * 1.1 + SITE.wind.z * 1.3;
    st.sizes[k] = 0.06 + FXR.next() * 0.16;
    st.alphas[k] = 0.7 + FXR.next() * 0.3;
  }
  S.geo.attributes.position.needsUpdate = true;
  S.geo.attributes.aSize.needsUpdate = true;
  S.geo.attributes.aAlpha.needsUpdate = true;
}
function spawnTongueSpray(count, zFront, power) {
  const S = SEA.spray;
  if (!S) return;
  const st = S.state;
  for (let i = 0; i < count; i++) {
    const k = st.next % st.max; st.next++;
    st.life[k] = 0;
    st.maxLife[k] = 0.55 + FXR.next() * 0.7;
    const x = LAYOUT.steps.x + (FXR.next() - 0.5) * 2.4;
    const zz = zFront + (FXR.next() - 0.5) * 0.5;
    const gy = OBJ.surfaceAt ? OBJ.surfaceAt(x, zz) : groundHeight(x, zz);
    st.positions[k * 3] = x;
    st.positions[k * 3 + 1] = gy + 0.05;
    st.positions[k * 3 + 2] = zz;
    st.vel[k * 3] = (FXR.next() - 0.5) * 0.8 + SITE.wind.x * 0.9;
    st.vel[k * 3 + 1] = (0.4 + FXR.next() * 1.2) * power;
    st.vel[k * 3 + 2] = (FXR.next() - 0.5) * 0.8 + SITE.wind.z * 1.0;
    st.sizes[k] = 0.04 + FXR.next() * 0.1;
    st.alphas[k] = 0.55 + FXR.next() * 0.3;
  }
  S.geo.attributes.position.needsUpdate = true;
  S.geo.attributes.aSize.needsUpdate = true;
  S.geo.attributes.aAlpha.needsUpdate = true;
}
function spawnSmokePuff() {
  const S = SEA.smoke;
  if (!S) return;
  const st = S.state;
  const k = st.next % st.max; st.next++;
  const c = OBJ.chimneyWorld || new THREE.Vector3(0, 9, -7);
  st.life[k] = 0;
  st.maxLife[k] = 3.8 + FXR.next() * 2.4;
  st.positions[k * 3] = c.x + (FXR.next() - 0.5) * 0.14;
  st.positions[k * 3 + 1] = c.y;
  st.positions[k * 3 + 2] = c.z + (FXR.next() - 0.5) * 0.14;
  const windLean = 0.72;
  st.vel[k * 3] = SITE.wind.x * windLean + (FXR.next() - 0.5) * 0.07;
  st.vel[k * 3 + 1] = 0.20 + FXR.next() * 0.18;
  st.vel[k * 3 + 2] = SITE.wind.z * windLean + (FXR.next() - 0.5) * 0.07;
  st.sizes[k] = 0.30 + FXR.next() * 0.38;
  st.alphas[k] = 0.38 + FXR.next() * 0.24;
  S.geo.attributes.position.needsUpdate = true;
  S.geo.attributes.aSize.needsUpdate = true;
  S.geo.attributes.aAlpha.needsUpdate = true;
}

function stepWaterPhysics(h) {
  // spray
  const S = SEA.spray;
  if (S) {
    const st = S.state;
    for (let k = 0; k < st.max; k++) {
      if (st.life[k] >= st.maxLife[k]) { st.alphas[k] = 0; continue; }
      st.life[k] += h;
      const f = st.life[k] / st.maxLife[k];
      st.vel[k * 3 + 1] -= 7.5 * h;
      st.vel[k * 3] += SITE.wind.x * 0.7 * h;
      st.vel[k * 3 + 2] += SITE.wind.z * 0.7 * h;
      st.positions[k * 3] += st.vel[k * 3] * h;
      st.positions[k * 3 + 1] += st.vel[k * 3 + 1] * h;
      st.positions[k * 3 + 2] += st.vel[k * 3 + 2] * h;
      st.alphas[k] = (1 - f) * (0.35 + 0.65 * Math.min(1, f * 4));
    }
    S.geo.attributes.position.needsUpdate = true;
    S.geo.attributes.aAlpha.needsUpdate = true;
  }
  // smoke
  const K = SEA.smoke;
  if (K) {
    const st = K.state;
    for (let k = 0; k < st.max; k++) {
      if (st.life[k] >= st.maxLife[k]) { st.alphas[k] = 0; continue; }
      st.life[k] += h;
      const f = st.life[k] / st.maxLife[k];
      st.vel[k * 3] += SITE.wind.x * 0.05 * h;
      st.vel[k * 3 + 2] += SITE.wind.z * 0.05 * h;
      st.positions[k * 3] += st.vel[k * 3] * h;
      st.positions[k * 3 + 1] += st.vel[k * 3 + 1] * h;
      st.positions[k * 3 + 2] += st.vel[k * 3 + 2] * h;
      st.sizes[k] += 0.34 * h;
      st.alphas[k] = Math.sin(Math.PI * Math.min(1, f)) * 0.50;
    }
    K.geo.attributes.position.needsUpdate = true;
    K.geo.attributes.aSize.needsUpdate = true;
    K.geo.attributes.aAlpha.needsUpdate = true;
  }
  // wetness dries slowly
  if (WET.data) {
    const d = WET.data;
    const decay = Math.exp(-h / 7.5);
    for (let i = 0; i < WET.w * WET.h; i++) {
      const v = d[i * 4] / 255;
      if (v < 0.004) { d[i * 4] = 0; continue; }
      d[i * 4] = Math.round(v * decay * 255);
    }
    WET.dirty = true;
  }
}

function paintWet(x, z, amount) {
  const u = (x - WET.x0) / (WET.x1 - WET.x0);
  const v = (z - WET.z0) / (WET.z1 - WET.z0);
  if (u < 0 || u > 1 || v < 0 || v > 1) return;
  const i = Math.min(WET.w - 1, Math.floor(u * WET.w));
  const j = Math.min(WET.h - 1, Math.floor(v * WET.h));
  const k = (j * WET.w + i) * 4;
  const cur = WET.data[k] / 255;
  WET.data[k] = Math.round(Math.min(1, cur + amount) * 255);
  WET.dirty = true;
}

function updateWater(dt, renderT) {
  if (!SEA.u) return;
  const u = SEA.u;
  u.uTime.value = SIM.t;
  u.uSwellAmp.value = SEA_CFG.swellAmp + 0.012 * Math.sin(SIM.t * 0.11);
  u.uComberPos.value = SIM.comber.pos;
  u.uComberAmp.value = SIM.comber.amp;
  u.uComberW.value = SIM.comber.width;
  u.uSpill.value = SIM.spill;
  // cloud shadow drifts slowly offshore
  const cd = SKY.cloud;
  const cx = cd.center.x + Math.sin(SIM.t * 0.013) * 2.4 - 0.9;
  const cz = cd.center.y + Math.cos(SIM.t * 0.017) * 1.6;
  u.uCloudCenter.value.set(cx, cz);
  u.uCloudStrength.value = cd.strength;

  if (SEA.tu) {
    const tu = SEA.tu;
    tu.uTime.value = SIM.t;
    tu.uFill.value = SIM.tongue.fill;
    tu.uFront.value = SIM.tongue.front;
    const vis = SIM.tongue.fill > 0.012 && SIM.tongue.front > 0.1;
    SEA.tongue.visible = vis;
  }
  if (WET.dirty && WET.tex) {
    WET.tex.needsUpdate = true;
    WET.dirty = false;
  }
  // point sizes for orthographic projection
  if (CAMERA) {
    const vh = (CAMERA.top - CAMERA.bottom) || 40;
    const scale = (RENDERER.domElement.height) / vh;
    if (SEA.spray) SEA.spray.mat.uniforms.uPointScale.value = scale;
    if (SEA.smoke) SEA.smoke.mat.uniforms.uPointScale.value = scale;
  }
}

function buildWater() {
  buildSea();
  buildTongue();
  buildSpray();
  buildSmoke();
  buildWrack();
  // a tide line left by the last set, so the shore reads as a place the sea visits
  for (let i = 0; i < 30; i++) {
    const z = 1.18 + (FXR.next() - 0.5) * 0.3;
    const x = notchCenter(z) + (FXR.next() - 0.5) * 2.3;
    const y = OBJ.surfaceAt ? OBJ.surfaceAt(x, z) : groundHeight(x, z);
    spawnWrackAt(x, z, y, 0.9 + FXR.next() * 1.1, FXR.next() * 1.4);
  }
  for (let i = 0; i < 9; i++) {
    const z = 2.35 + FXR.next() * 0.5;
    const x = notchCenter(z) + (FXR.next() - 0.5) * 3.0;
    spawnWrackAt(x, z, OBJ.surfaceAt ? OBJ.surfaceAt(x, z) : groundHeight(x, z), 0.8 + FXR.next() * 0.8, FXR.next() * 1.4);
  }
  // smoke puff cadence is driven by simulation time via a sim stepper
  SIM_STEPPERS.push(stepWaterPhysics);
}


/* ======================= 75_sim.js ======================= */
/* ==========================================================================
   75 — the tide clock. Fixed-step simulation of the swell train, the green
        comber, the notch surge, the stranded wrack and the weather.
   ========================================================================== */

const SIM = {
  t: 0,
  frame: 0,
  comber: { active: false, startT: 0, impactT: 0, pos: 24, amp: 0, width: 1.55, larger: false, impacted: false, baseAmp: 0.6 },
  tongue: { state: 'idle', tt: 0, fill: 0, front: 0, target: 5.65, larger: false, minor: false, wrackSpawned: 0, peak: 0 },
  spill: 0,
  nextImpact: 10.2,
  setIndex: 0,
  largerArmed: false,
  lastEventLarger: false,
  wrackRecordZ: 99,
  wrackRecordLarger: false,
  minorTimer: 3.0,
  smokeTimer: 0.8,
  status: '',
  statusFlash: 0,
  statusHold: 0,
  sprayTimer: 0
};

function simStatus(msg, flash = false) {
  SIM.status = msg;
  SIM.statusFlash = flash ? 1.0 : 0;
  SIM.statusHold = 4.5;
}

function armLargerSet() {
  if (SIM.largerArmed) return false;
  SIM.largerArmed = true;
  simStatus('Larger set armed — next comber one step higher', true);
  return true;
}

function startComber() {
  const larger = SIM.largerArmed;
  if (larger) SIM.largerArmed = false;
  SIM.comber.active = true;
  SIM.comber.startT = SIM.t;
  SIM.comber.impactT = 0;
  SIM.comber.pos = 18.6;
  SIM.comber.amp = 0;
  SIM.comber.baseAmp = larger ? 1.02 : 0.76;
  SIM.comber.width = larger ? 1.8 : 1.45;
  SIM.comber.larger = larger;
  SIM.comber.impacted = false;
  SIM.setIndex++;
  simStatus(larger ? 'Larger set — a bigger comber is building' : 'A green comber is building offshore');
}

function startTongue(targetFront, larger, minor) {
  const T = SIM.tongue;
  T.state = 'rise';
  T.tt = 0;
  T.fill = 0;
  T.front = 0;
  T.target = targetFront;
  T.larger = larger;
  T.minor = minor;
  T.wrackSpawned = 0;
  T.peak = 0;
}

function spawnWrackLine(zCenter, larger) {
  const count = larger ? 34 : 24;
  const spread = larger ? 1.45 : 1.25;
  for (let i = 0; i < count; i++) {
    const z = zCenter + FXR.gauss(0, 0.13);
    const x = notchCenter(z) + FXR.gauss(0, spread * 0.55);
    const surf = OBJ.surfaceAt ? OBJ.surfaceAt(x, z) : groundHeight(x, z);
    spawnWrackAt(x, z, surf, FXR.range(1.1, 2.3), FXR.range(0, 1.4));
  }
  // a few bits washing back with the draining sheet
  for (let i = 0; i < 10; i++) {
    const z = zCenter + FXR.range(0.25, 0.95);
    const x = notchCenter(z) + FXR.gauss(0, spread * 0.5);
    const surf = OBJ.surfaceAt ? OBJ.surfaceAt(x, z) : groundHeight(x, z);
    spawnWrackAt(x, z, surf, FXR.range(0.9, 1.8), FXR.range(0, 1.4));
  }
  SIM.wrackRecordZ = Math.min(SIM.wrackRecordZ, zCenter);
  SIM.wrackRecordLarger = SIM.wrackRecordLarger || larger;
}

function comberImpact() {
  const C = SIM.comber;
  C.impacted = true;
  C.impactT = SIM.t;
  SIM.spill = 1.0;
  const strength = C.larger ? 1.35 : 1.0;
  spawnSprayBurst(0.33, 0.5, 4.9, C.larger ? 90 : 68, strength);
  spawnSprayBurst(2.7, 0.45, 5.15, 26, strength * 0.8);
  spawnSprayBurst(-2.2, 0.4, 4.95, 24, strength * 0.7);
  const target = C.larger ? 6.04 : 5.65;
  startTongue(target, C.larger, false);
  simStatus(C.larger ? 'Larger set — the crest spills over the ledge' : 'Comber impact — the notch takes the sea', true);
}

function stepTongue(h) {
  const T = SIM.tongue;
  if (T.state === 'idle') { T.fill = 0; T.front = 0; return; }
  T.tt += h;
  const minorScale = T.minor ? 0.55 : 1.0;
  if (T.state === 'rise') {
    const f = sat(T.tt / (T.minor ? 0.8 : 1.15));
    const e = easeOut(f);
    T.front = T.target * e;
    T.fill = smoothstep(0.0, 0.55, T.tt) * minorScale;
    T.peak = Math.max(T.peak, T.front);
    if (!T.minor) {
      SIM.sprayTimer -= h;
      if (SIM.sprayTimer <= 0) {
        SIM.sprayTimer = 0.075;
        spawnTongueSpray(4, 6.7 - T.front, 0.85);
      }
    }
    if (f >= 1) { T.state = 'hold'; T.tt = 0; }
  } else if (T.state === 'hold') {
    T.front = T.target * (1 + 0.012 * Math.sin(T.tt * 9));
    T.fill = lerp(minorScale, minorScale * 0.86, sat(T.tt / 0.5));
    if (T.tt >= 0.55) {
      T.state = 'drain';
      T.tt = 0;
      if (!T.minor && !T.larger) spawnWrackLine(6.7 - T.target, false);
      if (!T.minor && T.larger) spawnWrackLine(6.7 - T.target, true);
    }
  } else if (T.state === 'drain') {
    const k = sat(T.tt / 2.3);
    T.front = T.target * (1 - 0.62 * easeInOut(k));
    T.fill = minorScale * (1 - easeInOut(k)) * 0.92;
    if (T.tt > 0.5 && T.wrackSpawned === 0 && !T.minor) {
      T.wrackSpawned = 1;
      const z = 6.7 - T.front;
      // a handful of flecks left by the falling sheet, below the high-water line
      for (let i = 0; i < 6; i++) {
        const zz = z + FXR.range(0.1, 0.6);
        const x = notchCenter(zz) + FXR.gauss(0, 0.7);
        spawnWrackAt(x, zz, OBJ.surfaceAt ? OBJ.surfaceAt(x, zz) : groundHeight(x, zz), FXR.range(0.4, 0.95), FXR.range(0, 1.4));
      }
    }
    if (k >= 1) {
      T.state = 'idle'; T.fill = 0; T.front = 0;
      if (!T.minor) simStatus(T.larger ? 'Wrack stranded one step higher — the yard stayed dry' : 'The sheet drains back through the notch', true);
      else SIM.minorTimer = Math.max(SIM.minorTimer, 1.2);
    }
  }
  // darken the shingle wherever the sheet has been
  if (T.fill > 0.04 && T.front > 0.15) {
    for (let i = 0; i < 14; i++) {
      const s = lerp(Math.max(0.2, T.front - 3.6), T.front, FXR.next());
      const z = 6.7 - s;
      if (z < -0.45 || z > 6.6) continue;
      const x = notchCenter(z) + FXR.gauss(0, 0.55 + s * 0.15);
      paintWet(x, z, 0.16);
    }
  }
}

function stepSim(h) {
  SIM.t += h;
  SIM.frame++;
  // peat smoke
  SIM.smokeTimer -= h;
  if (SIM.smokeTimer <= 0) {
    SIM.smokeTimer += 0.58;
    spawnSmokePuff();
  }
  // comber lifecycle
  const C = SIM.comber;
  if (!C.active && SIM.t >= SIM.nextImpact - 7.3) startComber();
  if (C.active) {
    const age = SIM.t - C.startT;
    C.pos = 18.6 - age * 1.86;
    const ramp = smoothstep(0.0, 1.1, age);
    let fade = 1;
    if (C.impacted) fade = Math.max(0, 1 - (SIM.t - C.impactT) / 0.9);
    C.amp = C.baseAmp * ramp * fade;
    if (!C.impacted && C.pos <= 5.08) {
      comberImpact();
      SIM.nextImpact += 21.5;
      SIM.lastEventLarger = C.larger;
    }
    if (C.pos < -1.5) { C.active = false; C.amp = 0; C.pos = 24; }
  }
  SIM.spill = Math.max(0, SIM.spill - h * 1.15);
  stepTongue(h);
  // gentle swashes between the sets, so the notch is never dead
  if (SIM.tongue.state === 'idle') {
    SIM.minorTimer -= h;
    const comberClose = C.active && !C.impacted && C.pos < 12;
    if (SIM.minorTimer <= 0 && !comberClose) {
      SIM.minorTimer += 6.25;
      startTongue(3.45, false, true);
    }
  }
  // status hold
  SIM.statusHold = Math.max(0, SIM.statusHold - h);
  SIM.statusFlash = Math.max(0, SIM.statusFlash - h * 1.4);
  if (SIM.statusHold <= 0 && SIM.status !== '') {
    if (SIM.wrackRecordLarger) SIM.status = 'Wrack line: one step higher \u00b7 yard dry';
    else if (SIM.t > 3) SIM.status = 'Set ' + Math.max(1, SIM.setIndex) + ' \u00b7 wrack line below the boots';
  }
}

/* convenience for the camera to know when the event is on */
function eventPhase() {
  if (SIM.comber.active && !SIM.comber.impacted) return 'inbound';
  if (SIM.tongue.state !== 'idle') return 'surge';
  return 'calm';
}


/* ======================= 80_camera.js ======================= */
/* ==========================================================================
   80 — the cinematic rig: an orthographic 360° orbit at constant angular
        speed, damped manual takeover, zoom, and a clean reset.
   ========================================================================== */

const CAM = {
  camera: null,
  target: new THREE.Vector3(SITE.target.x, SITE.target.y, SITE.target.z),
  bearing: SITE.openBearing,
  pitch: SITE.pitch,
  zoom: 1,
  targetBearing: SITE.openBearing,
  targetPitch: SITE.pitch,
  targetZoom: 1,
  cine: true,
  cineBearing: SITE.openBearing,
  rejoining: false,
  dragging: false,
  spin: 0,
  pointers: new Map(),
  pinchDist: 0,
  viewHeight: SITE.viewHeight,
  aspect: 1.6,
  onCinematicChange: null,
  radius: SITE.radius
};

function createCamera() {
  CAM.camera = new THREE.OrthographicCamera(-30, 30, 20, -20, 0.5, 1200);
  CAM.camera.up.set(0, 1, 0);
  CAM.applyPose();
  CAM.resize(window.innerWidth, window.innerHeight);
  return CAM.camera;
}
function cameraAspectViewHeight(aspect) {
  let vh = SITE.viewHeight;
  if (aspect < 1.45) {
    // on narrow screens pull back enough to keep the miniature in frame
    vh = Math.max(vh, Math.min(72, 54 / Math.max(0.45, aspect)));
  }
  return vh;
}
CAM.resize = function (w, h) {
  if (!CAM.camera) return;
  const aspect = Math.max(0.2, w / h);
  CAM.aspect = aspect;
  CAM.viewHeight = cameraAspectViewHeight(aspect);
  const vh = CAM.viewHeight / CAM.zoom;
  const vw = vh * aspect;
  CAM.camera.left = -vw / 2;
  CAM.camera.right = vw / 2;
  CAM.camera.top = vh / 2;
  CAM.camera.bottom = -vh / 2;
  CAM.camera.updateProjectionMatrix();
  CAM.applyPose();
};
CAM.applyPose = function () {
  const p = CAM.pitch;
  const r = CAM.radius;
  const cx = CAM.target.x + Math.sin(CAM.bearing) * Math.cos(p) * r;
  const cy = CAM.target.y + Math.sin(p) * r;
  const cz = CAM.target.z + Math.cos(CAM.bearing) * Math.cos(p) * r;
  CAM.camera.position.set(cx, cy, cz);
  CAM.camera.up.set(0, 1, 0);
  CAM.camera.lookAt(CAM.target);
  CAM.camera.updateMatrixWorld();
};
CAM.setViewHeightNow = function () {
  const vh = CAM.viewHeight / CAM.zoom;
  const vw = vh * CAM.aspect;
  CAM.camera.left = -vw / 2; CAM.camera.right = vw / 2;
  CAM.camera.top = vh / 2; CAM.camera.bottom = -vh / 2;
  CAM.camera.updateProjectionMatrix();
};
CAM.setCinematic = function (on) {
  on = !!on;
  if (on === CAM.cine) return;
  CAM.cine = on;
  if (on) {
    // ease back onto the circle from the current bearing
    CAM.cineBearing = CAM.bearing;
    CAM.targetPitch = SITE.pitch;
    CAM.rejoining = true;
    CAM.spin = 0;
  } else {
    CAM.targetBearing = CAM.bearing;
    CAM.targetPitch = CAM.pitch;
    CAM.targetZoom = CAM.zoom;
  }
  if (CAM.onCinematicChange) CAM.onCinematicChange(CAM.cine);
};
CAM.takeover = function () {
  if (!CAM.cine) return;
  CAM.setCinematic(false);
};
CAM.resetView = function () {
  CAM.bearing = SITE.openBearing;
  CAM.targetBearing = SITE.openBearing;
  CAM.pitch = SITE.pitch;
  CAM.targetPitch = SITE.pitch;
  CAM.zoom = 1;
  CAM.targetZoom = 1;
  CAM.spin = 0;
  CAM.rejoining = false;
  CAM.cineBearing = SITE.openBearing;
  CAM.cine = true;
  CAM.setViewHeightNow();
  CAM.applyPose();
  if (CAM.onCinematicChange) CAM.onCinematicChange(true);
};
CAM.zoomBy = function (factor) {
  CAM.targetZoom = clamp(CAM.targetZoom * factor, SITE.zoomMin, SITE.zoomMax);
  CAM.zoom = CAM.targetZoom;
  CAM.setViewHeightNow();
};
CAM.update = function (dt) {
  if (!CAM.camera) return;
  const t = Math.min(dt, 0.1);
  if (CAM.cine) {
    CAM.cineBearing -= SITE.cineOmega * t;
    // ease the actual bearing onto the circle from wherever the viewer left it
    const diff = wrapAngle(CAM.bearing - CAM.cineBearing);
    if (Math.abs(diff) > 0.0004 || CAM.rejoining) {
      CAM.bearing = CAM.cineBearing + diff * Math.exp(-2.6 * t);
      if (Math.abs(diff) < 0.002) CAM.rejoining = false;
    } else {
      CAM.bearing = CAM.cineBearing;
    }
    CAM.pitch = damp(CAM.pitch, SITE.pitch, 3.4, t);
    const z = damp(CAM.zoom, CAM.targetZoom, 6.0, t);
    if (Math.abs(z - CAM.zoom) > 1e-6) { CAM.zoom = z; CAM.setViewHeightNow(); }
    CAM.applyPose();
    return;
  }
  // damped manual orbit
  if (CAM.spin !== 0) {
    CAM.targetBearing += CAM.spin * t;
    CAM.spin *= Math.exp(-5.5 * t);
    if (Math.abs(CAM.spin) < 0.004) CAM.spin = 0;
  }
  const kb = 9.0, kp = 9.0, kz = 8.0;
  CAM.bearing = damp(CAM.bearing, CAM.targetBearing, kb, t);
  CAM.pitch = damp(CAM.pitch, CAM.targetPitch, kp, t);
  const prevZoom = CAM.zoom;
  CAM.zoom = damp(CAM.zoom, CAM.targetZoom, kz, t);
  if (Math.abs(CAM.zoom - prevZoom) > 1e-5) CAM.setViewHeightNow();
  CAM.applyPose();
};
CAM.bindInput = function (el) {
  const onDown = (e) => {
    if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
    el.setPointerCapture && el.setPointerCapture(e.pointerId);
    CAM.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (CAM.pointers.size === 1) {
      CAM.takeover();
      CAM.dragging = true;
      CAM.spin = 0;
      el.classList.add('drag');
    } else if (CAM.pointers.size === 2) {
      const [a, b] = [...CAM.pointers.values()];
      CAM.pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
  };
  const onMove = (e) => {
    if (!CAM.pointers.has(e.pointerId)) return;
    const prev = CAM.pointers.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    prev.x = e.clientX; prev.y = e.clientY;
    if (CAM.pointers.size >= 2) {
      const [a, b] = [...CAM.pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (CAM.pinchDist > 0 && d > 0) {
        CAM.targetZoom = clamp(CAM.targetZoom * (d / CAM.pinchDist), SITE.zoomMin, SITE.zoomMax);
        CAM.zoom = damp(CAM.zoom, CAM.targetZoom, 12, 1 / 60);
        CAM.setViewHeightNow();
      }
      CAM.pinchDist = d;
      return;
    }
    if (!CAM.dragging) return;
    CAM.targetBearing -= dx * 0.0055;
    CAM.targetPitch = clamp(CAM.targetPitch - dy * 0.0040, SITE.pitchMin, SITE.pitchMax);
    CAM.spin = -dx * 0.0055 * 60 * 0.35;
  };
  const onUp = (e) => {
    CAM.pointers.delete(e.pointerId);
    if (CAM.pointers.size === 0) {
      CAM.dragging = false;
      el.classList.remove('drag');
    }
    if (CAM.pointers.size < 2) CAM.pinchDist = 0;
  };
  const onWheel = (e) => {
    e.preventDefault();
    CAM.targetZoom = clamp(CAM.targetZoom * (1 - e.deltaY * 0.0011), SITE.zoomMin, SITE.zoomMax);
    CAM.zoom = CAM.targetZoom;
    CAM.setViewHeightNow();
  };
  el.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  el.addEventListener('wheel', onWheel, { passive: false });
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  // keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'c' || e.key === 'C') { CAM.setCinematic(!CAM.cine); if (UI && UI.syncCinematic) UI.syncCinematic(); }
    if (e.key === 'r' || e.key === 'R') { CAM.resetView(); if (UI && UI.syncCinematic) UI.syncCinematic(); }
    if (e.key === 'l' || e.key === 'L') { armLargerSet(); }
  });
};
CAM.takeoverThenZoom = function () {
  if (CAM.cine) CAM.setCinematic(false);
};


/* ======================= 90_ui.js ======================= */
/* ==========================================================================
   90 — the instrument panel: cinematic switch, reset, larger set, status.
   ========================================================================== */

const UI = {
  statusEl: null,
  cinEl: null,
  hint: null,
  lastStatus: '',
  hintTimer: 0,
  booted: false
};

UI.syncCinematic = function () {
  if (!UI.cinEl) return;
  UI.cinEl.setAttribute('aria-pressed', CAM.cine ? 'true' : 'false');
};

UI.update = function (dt) {
  if (!UI.statusEl) return;
  const msg = SIM.status || 'First set \u00b7 the notch is breathing';
  if (msg !== UI.lastStatus) {
    UI.lastStatus = msg;
    UI.statusEl.textContent = msg;
    UI.statusEl.style.opacity = '1';
  }
  if (SIM.statusFlash > 0.05) UI.statusEl.classList.add('flash');
  else UI.statusEl.classList.remove('flash');
  if (UI.hintTimer > 0) {
    UI.hintTimer -= dt;
    if (UI.hintTimer <= 0 && UI.hint) UI.hint.classList.remove('show');
  }
};

function buildUI() {
  UI.statusEl = document.getElementById('status');
  UI.cinEl = document.getElementById('cin');
  const resetEl = document.getElementById('reset');
  const largerEl = document.getElementById('larger');
  UI.hint = document.getElementById('hint');
  UI.cinEl.addEventListener('click', () => {
    CAM.setCinematic(!CAM.cine);
    UI.syncCinematic();
  });
  resetEl.addEventListener('click', () => {
    CAM.resetView();
    UI.syncCinematic();
    simStatus('Opening view restored', true);
  });
  largerEl.addEventListener('click', () => {
    armLargerSet();
  });
  CAM.onCinematicChange = () => UI.syncCinematic();
  UI.syncCinematic();
  UI.statusEl.textContent = 'First set \u00b7 a comber is building offshore';
}

function revealScene() {
  document.getElementById('title').classList.add('show');
  document.getElementById('dock').classList.add('show');
  if (UI.hint) {
    UI.hint.classList.add('show');
    UI.hintTimer = 11.0;
  }
  const canvas = document.getElementById('scene');
  canvas.classList.add('ready');
  const veil = document.getElementById('veil');
  if (veil) veil.classList.add('gone');
  // hide the hint as soon as the viewer interacts
  window.addEventListener('pointerdown', () => {
    if (UI.hint) { UI.hint.classList.remove('show'); UI.hintTimer = 0; }
  }, { once: true, capture: true });
}


/* ======================= 99_main.js ======================= */
/* ==========================================================================
   99 — boot, build order, resize, the fixed-timestep loop and test hooks.
   ========================================================================== */

const APP = {
  booted: false,
  fixed: 1 / 60,
  acc: 0,
  last: 0,
  frames: 0,
  fps: 0,
  fpsAcc: 0,
  errorShown: false,
  paused: false,
  perfAcc: 0,
  perfN: 0,
  perfScale: 1
};

async function boot() {
  try {
    setProgress(0.01, 'setting the scene');
    SCENE = new THREE.Scene();
    CAMERA = createCamera();
    document.getElementById('scene').addEventListener('contextmenu', e => e.preventDefault());

    await bootStep(0.05, 'painting limewash and slate', () => buildTextures());
    await bootStep(0.24, 'mixing the material cabinet', () => buildMaterials());
    await bootStep(0.30, 'lighting the evening sky', () => buildSkyAndLights());
    await bootStep(0.36, 'folding the slate', () => {
      const maps = bakeTerrainMaps((f) => setProgress(0.36 + f * 0.22, 'combing the grass and shingle'));
      OBJ.terrainMaps = maps;
    });
    await bootStep(0.60, 'thatching the ground', () => {
      buildTerrainMesh(OBJ.terrainMaps);
      buildWetnessTexture();
    });
    await bootStep(0.66, 'cutting the plinth', () => buildCliff());
    await bootStep(0.71, 'setting the shore rocks', () => buildRocks());
    await bootStep(0.76, 'raising the croft', () => buildCottage());
    await bootStep(0.81, 'curling the wall', () => buildWall());
    await bootStep(0.85, 'laying the path and the boots', () => buildPathStepsBoots());
    await bootStep(0.90, 'seeding thrift and wind-blown grass', () => buildVegetation());
    await bootStep(0.93, 'waking the gulls', () => buildBirds());
    await bootStep(0.95, 'letting in the sea', () => buildWater());
    await bootStep(0.985, 'trimming the wick', () => {
      buildUI();
      CAM.bindInput(document.getElementById('scene'));
      CAM.resetView();
      UI.syncCinematic();
      SIM.status = 'First set \u00b7 a comber is building offshore';
      RENDERER.compile(SCENE, CAMERA);
    });
    setProgress(1.0, 'ready');
    await nextFrame();
    revealScene();
    APP.booted = true;
    APP.last = performance.now();
    requestAnimationFrame(frame);
    // expose the scene for inspection / automated checks
    window.__croft = {
      ready: true,
      renderer: RENDERER, scene: SCENE, camera: CAMERA, cam: CAM, sim: SIM, sea: SEA, ui: UI,
      THREE, SITE,
      groundHeight,
      setPose(bearing, pitch, zoom) {
        CAM.cine = false;
        CAM.bearing = bearing; CAM.targetBearing = bearing;
        if (pitch !== undefined) { CAM.pitch = pitch; CAM.targetPitch = pitch; }
        if (zoom !== undefined) { CAM.zoom = zoom; CAM.targetZoom = zoom; CAM.setViewHeightNow(); }
        CAM.applyPose();
      },
      setTarget(x, y, z) { CAM.target.set(x, y, z); CAM.applyPose(); },
      resetTarget() { CAM.target.set(SITE.target.x, SITE.target.y, SITE.target.z); CAM.applyPose(); },
      pause(p) { APP.paused = !!p; },
      resetSim() {
        SIM.t = 0; SIM.frame = 0; SIM.nextImpact = 10.2; SIM.setIndex = 0;
        SIM.largerArmed = false; SIM.lastEventLarger = false; SIM.wrackRecordZ = 99;
        SIM.wrackRecordLarger = false; SIM.minorTimer = 3.0; SIM.smokeTimer = 0.8;
        SIM.status = ''; SIM.statusHold = 0; SIM.statusFlash = 0; SIM.sprayTimer = 0; SIM.spill = 0;
        SIM.comber.active = false; SIM.comber.pos = 24; SIM.comber.amp = 0; SIM.comber.impacted = false;
        SIM.tongue.state = 'idle'; SIM.tongue.fill = 0; SIM.tongue.front = 0; SIM.tongue.tt = 0;
        if (SEA.wrack) { SEA.wrack.cursor = 0; SEA.wrack.used = 0; SEA.wrack.mesh.count = 0; }
        if (SEA.spray) { const st = SEA.spray.state; for (let i = 0; i < st.max; i++) { st.alphas[i] = 0; st.life[i] = 1e9; } SEA.spray.geo.attributes.aAlpha.needsUpdate = true; }
        if (SEA.smoke) { const st = SEA.smoke.state; for (let i = 0; i < st.max; i++) { st.alphas[i] = 0; st.life[i] = 1e9; } SEA.smoke.geo.attributes.aAlpha.needsUpdate = true; }
        if (WET.data) { for (let i = 0; i < WET.w * WET.h; i++) WET.data[i * 4] = 0; WET.dirty = true; }
      },
      render() { RENDERER.render(SCENE, CAMERA); },
      counts: {
        grass: OBJ.grassCount || 0,
        tall: OBJ.tallCount || 0,
        thrift: OBJ.thriftCount || 0
      },
      setBearing(rad) { CAM.bearing = rad; CAM.targetBearing = rad; CAM.cine = false; CAM.applyPose(); },
      setCinematic(on) { CAM.setCinematic(on); UI.syncCinematic(); },
      reset() { CAM.resetView(); UI.syncCinematic(); },
      larger() { return armLargerSet(); },
      advance(seconds) {
        const n = Math.round(seconds / APP.fixed);
        for (let i = 0; i < n; i++) {
          stepSim(APP.fixed);
          for (const s of SIM_STEPPERS) s(APP.fixed);
        }
        updateWater(0.016);
        for (let i = 0; i < UPDATERS.length; i++) UPDATERS[i](0, SIM.t);
        RENDERER.render(SCENE, CAMERA);
        return { t: SIM.t, event: eventPhase(), tongue: { fill: SIM.tongue.fill, front: SIM.tongue.front, state: SIM.tongue.state }, status: SIM.status, wrackZ: SIM.wrackRecordZ };
      }
    };
  } catch (err) {
    showError(err);
  }
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  RENDERER.setSize(w, h, false);
  if (CAMERA) CAM.resize(w, h);
}
window.addEventListener('resize', () => { resize(); });

let frameErrorShown = false;
function frame(now) {
  if (!APP.booted) return;
  requestAnimationFrame(frame);
  const dtMs = Math.max(0, now - APP.last);
  APP.last = now;
  const dt = Math.min(0.1, dtMs / 1000);
  APP.frames++;
  APP.fpsAcc += dt;
  if (APP.fpsAcc > 0.7) { APP.fps = APP.frames / APP.fpsAcc; APP.frames = 0; APP.fpsAcc = 0; }
  try {
    // --- fixed-step physics: independent of the render rate ---
    if (!APP.paused) {
      APP.acc += dt;
      let steps = 0;
      while (APP.acc >= APP.fixed && steps < 6) {
        stepSim(APP.fixed);
        for (let i = 0; i < SIM_STEPPERS.length; i++) SIM_STEPPERS[i](APP.fixed);
        APP.acc -= APP.fixed;
        steps++;
      }
      if (steps === 6) APP.acc = 0;
    }
    // --- camera ---
    CAM.update(dt);
    // --- per-frame look updates ---
    updateWater(dt);
    for (let i = 0; i < UPDATERS.length; i++) UPDATERS[i](dt, SIM.t);
    UI.update(dt);
    RENDERER.render(SCENE, CAMERA);
    // the scene is a static sunlit model: bake the shadow map once, then reuse it
    if (APP.frames === 3) RENDERER.shadowMap.autoUpdate = false;
    // --- adaptive resolution: keep the frame rate smooth on integrated GPUs ---
    APP.perfAcc += dtMs;
    APP.perfN++;
    if (APP.perfN >= 70) {
      const avg = APP.perfAcc / APP.perfN;
      APP.perfAcc = 0; APP.perfN = 0;
      if (avg > 46 && APP.perfScale > 0.85) {
        APP.perfScale = Math.max(0.85, APP.perfScale - 0.06);
        applyPixelRatio(APP.perfScale);
      } else if (avg < 34 && APP.perfScale < 1) {
        APP.perfScale = Math.min(1, APP.perfScale + 0.05);
        applyPixelRatio(APP.perfScale);
      }
    }
  } catch (err) {
    if (!frameErrorShown) { frameErrorShown = true; showError(err); }
  }
}

resize();
boot();

</script>
