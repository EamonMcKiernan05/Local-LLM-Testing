function buildPeatStack() {
  const p = LAYOUT.peat;
  const rng = new RNG(SITE.seed + 620);
  const baseY = groundHeight(p.x, p.z);
  const grp = new THREE.Group();
  grp.position.set(p.x, baseY, p.z);
  grp.rotation.y = p.rot;
  const geo = boxGeo(0.58, 0.21, 0.28, 1.4);
  const peats = [];
  const layers = [
    { n: 5, d: 3, y: 0.11, jitter: 0.7 },
    { n: 5, d: 3, y: 0.32, jitter: 0.6 },
    { n: 5, d: 3, y: 0.53, jitter: 0.7 },
    { n: 4, d: 2, y: 0.74, jitter: 0.8 },
    { n: 3, d: 2, y: 0.95, jitter: 0.7 }
  ];
  const colors = ['#a89680', '#94836d', '#b3a28b', '#867662', '#bcab94', '#7d6d5b', '#9d8a72'];
  for (let li = 0; li < layers.length; li++) {
    const L = layers[li];
    for (let r = 0; r < L.d; r++) {
      for (let k = 0; k < L.n; k++) {
        if (rng.chance(0.07)) continue;
        const x = (k - (L.n - 1) / 2) * 0.62 + rng.range(-0.04, 0.04) + (r % 2 ? 0.08 : 0);
        const z = (r - (L.d - 1) / 2) * 0.32 + rng.range(-0.025, 0.025);
        peats.push({
          pos: [x, L.y + rng.range(-0.015, 0.015), z],
          rot: [rng.range(-0.05, 0.05), rng.range(-0.10, 0.10), rng.range(-0.04, 0.04)],
          scale3: [1, 1, 1], color: rng.pick(colors)
        });
      }
    }
  }
  const mesh = instancedFrom(geo, MAT.peat, peats, { cast: true, receive: true });
  grp.add(mesh);
  // two weathered stakes driven through the stack, and a few peats propped at the foot
  const stakeGeo = boxGeo(0.055, 1.5, 0.055, 1.0);
  for (const sx of [-0.9, 0.95]) {
    const stake = new THREE.Mesh(stakeGeo, MAT.woodGrey);
    stake.position.set(sx, 0.75, 0.12);
    stake.rotation.y = 0.3;
    stake.castShadow = true;
    grp.add(stake);
  }
  const loose = [];
  for (let i = 0; i < 5; i++) {
    loose.push({
      pos: [rng.range(-1.8, 1.8), 0.11, rng.range(-0.9, 0.9)],
      rot: [0, rng.range(0, TAU), 0], scale3: [1, 1, 1], color: rng.pick(['#94836d', '#7d6d5b'])
    });
  }
  grp.add(instancedFrom(geo, MAT.peat, loose, { cast: true, receive: true }));
  const stoneGeo = new THREE.IcosahedronGeometry(0.13, 0);
  const stones = [];
  for (let i = 0; i < 3; i++) {
    stones.push({ pos: [rng.range(-1.0, 1.0), 1.16 + rng.range(0, 0.04), rng.range(-0.4, 0.4)], rot: [0, rng.range(0, TAU), 0], scale: rng.range(0.7, 1.15), color: rng.pick(['#a9a294', '#8d877c', '#c0b8a6']) });
  }
  grp.add(instancedFrom(stoneGeo, MAT.stone, stones, { cast: true, receive: true }));
  SCENE.add(grp);
  OBJ.peatStack = grp;
}

/* ==========================================================================
   45 — the drystone wall that curls around the yard, its coping, and the gate.
   ========================================================================== */

function buildWallRibbon(pts, width, height, opts = {}) {
  const curve = curvePoints2D(pts, false);
  const len = curve.getLength();
  const steps = Math.max(10, Math.ceil(len / 0.35));
  const pos = [], uv = [], idx = [];
  const p = new THREE.Vector3(), t = new THREE.Vector3();
  let run = 0;
  const prev = new THREE.Vector3();
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    curve.getPoint(u, p);
    curve.getTangent(u, t);
    if (i > 0) run += p.distanceTo(prev);
    prev.copy(p);
    const nx = -t.z, nz = t.x;
    const w = width * 0.5;
    const gy = groundHeight(p.x, p.z);
    const hh = height * (0.92 + 0.16 * Math.sin(u * 19.3 + 0.4) + 0.06 * Math.sin(u * 51.0));
    const x0 = p.x + nx * w, z0 = p.z + nz * w;
    const x1 = p.x - nx * w, z1 = p.z - nz * w;
    const gy0 = groundHeight(x0, z0), gy1 = groundHeight(x1, z1);
    // cross-section: outer (left), top-left, top-right, outer(right)
    const topY0 = gy0 + hh, topY1 = gy1 + hh;
    const base0 = gy0 - 0.25, base1 = gy1 - 0.25;
    const vbase = pos.length / 3;
    // 6 verts: left bottom, left top, right top, right bottom (+ duplicated for the crown)
    pos.push(x0, base0, z0, x0, topY0, z0, x1, topY1, z1, x1, base1, z1);
    const uu = run * 0.62;
    uv.push(uu, 0, uu, hh * 0.62, uu, hh * 0.62, uu, 0);
    if (i < steps) {
      const a = vbase, b = vbase + 1, c = vbase + 2, d = vbase + 3;
      const na = vbase + 4, nb = vbase + 5, nc = vbase + 6, nd = vbase + 7;
      // placeholder indices filled after all vertices are laid out (handled below)
    }
  }
  // rebuild with proper quads: each station contributes 4 verts and a top strip
  pos.length = 0; uv.length = 0;
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    curve.getPoint(u, p);
    curve.getTangent(u, t);
    const nx = -t.z, nz = t.x;
    const w = width * 0.5;
    const gy = groundHeight(p.x, p.z);
    const hh = height * (0.94 + 0.14 * Math.sin(u * 19.3 + 0.4) + 0.05 * Math.sin(u * 51.0));
    const x0 = p.x + nx * w, z0 = p.z + nz * w;
    const x1 = p.x - nx * w, z1 = p.z - nz * w;
    const gy0 = groundHeight(x0, z0), gy1 = groundHeight(x1, z1);
    const topY0 = Math.max(gy, gy0) + hh, topY1 = Math.max(gy, gy1) + hh;
    const base0 = gy0 - 0.30, base1 = gy1 - 0.30;
    const crownY = (topY0 + topY1) / 2 + 0.03;
    pos.push(
      x0, base0, z0,       // 0 left bottom
      x0, topY0, z0,       // 1 left top
      x1, topY1, z1,       // 2 right top
      x1, base1, z1,       // 3 right bottom
      p.x + nx * (w * 0.42), crownY, p.z + nz * (w * 0.42), // 4 crown left
      p.x - nx * (w * 0.42), crownY, p.z - nz * (w * 0.42)  // 5 crown right
    );
    const uu = run * 0.62;
    uv.push(uu, 0, uu, hh * 0.62, uu, hh * 0.62, uu, 0, uu, hh * 0.62, uu, hh * 0.62);
  }
  for (let i = 0; i < steps; i++) {
    const a = i * 6, b = (i + 1) * 6;
    // left face
    idx.push(a, a + 1, b, a + 1, b + 1, b);
    // right face
    idx.push(a + 2, a + 3, b + 2, a + 3, b + 3, b + 2);
    // crown
    idx.push(a + 4, a + 5, b + 4, a + 5, b + 5, b + 4);
    // small bevels between crown and faces
    idx.push(a + 1, a + 4, b + 1, a + 4, b + 4, b + 1);
    idx.push(a + 4, a + 2, b + 4, a + 4, b + 2, b + 4);
    idx.push(a + 5, a + 3, b + 5, a + 5, b + 3, b + 5);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function buildWall() {
  const rng = new RNG(SITE.seed + 700);
  const wallGeos = [];
  const stoneInstances = [];
  const copingInstances = [];
  const segs = [LAYOUT.wall.east, LAYOUT.wall.west];
  for (const pts of segs) {
    const geo = buildWallRibbon(pts, 0.62, 1.05);
    wallGeos.push(geo);
    const curve = curvePoints2D(pts, false);
    const len = curve.getLength();
    const steps = Math.ceil(len / 0.34);
    const p = new THREE.Vector3(), t = new THREE.Vector3();
    for (let i = 0; i < steps; i++) {
      const u = (i + 0.5) / steps;
      curve.getPoint(u, p);
      curve.getTangent(u, t);
      const nx = -t.z, nz = t.x;
      const ang = Math.atan2(t.x, t.z);
      for (const side of [-1, 1]) {
        if (rng.chance(0.12)) continue;
        const gy = groundHeight(p.x, p.z);
        const course = rng.int(0, 2);
        const hh = 0.80 + course * 0.2;
        const w = 0.34 + (side > 0 ? 0.04 : 0);
        stoneInstances.push({
          pos: [
            p.x + nx * side * w + rng.range(-0.03, 0.03),
            gy + hh - 0.12 + rng.range(-0.03, 0.03),
            p.z + nz * side * w + rng.range(-0.03, 0.03)
          ],
          rot: [rng.range(-0.06, 0.06), ang + rng.range(-0.12, 0.12), rng.range(-0.07, 0.07)],
          scale3: [rng.range(0.75, 1.15), rng.range(0.7, 1.1), rng.range(0.75, 1.15)],
          color: rng.pick(['#b8b2a4', '#a29c8e', '#c6bfae', '#948e82', '#ada695', '#87837a', '#b4a992'])
        });
      }
      // coping stones on the crown, tilted
      if (i % 2 === 0) {
        const gy = groundHeight(p.x, p.z);
        copingInstances.push({
          pos: [p.x + rng.range(-0.02, 0.02), gy + 1.02 + rng.range(-0.02, 0.03), p.z + rng.range(-0.02, 0.02)],
          rot: [rng.range(-0.13, 0.13), ang + rng.range(-0.1, 0.1), rng.range(-0.14, 0.14)],
          scale3: [rng.range(0.8, 1.25), rng.range(0.7, 1.05), rng.range(0.8, 1.3)],
          color: rng.pick(['#c2bba9', '#a9a294', '#b6ad99', '#d0c8b6'])
        });
      }
    }
  }
  const merged = mergeGeos(wallGeos);
  const wallMesh = new THREE.Mesh(merged, MAT.stone);
  wallMesh.castShadow = true; wallMesh.receiveShadow = true;
  SCENE.add(wallMesh);
  const stoneGeo = jitterBoxGeo(rng, 0.46, 0.26, 0.30, 0.18, 0.82);
  const stones = instancedFrom(stoneGeo, MAT.stone, stoneInstances, { cast: true, receive: true });
  SCENE.add(stones);
  const copeGeo = jitterBoxGeo(rng, 0.42, 0.30, 0.28, 0.22, 0.95);
  const cope = instancedFrom(copeGeo, MAT.stone, copingInstances, { cast: true, receive: true });
  SCENE.add(cope);
  // chunky pier stones at either side of the gate
  buildGate(rng);
  OBJ.wallStones = stoneInstances;
}

function buildGate(rng) {
  const e = LAYOUT.wall.east[LAYOUT.wall.east.length - 1];
  const w = LAYOUT.wall.west[0];
  const mid = new THREE.Vector3((e[0] + w[0]) / 2, groundHeight((e[0] + w[0]) / 2, (e[1] + w[1]) / 2), (e[1] + w[1]) / 2);
  const ang = Math.atan2(w[0] - e[0], w[1] - e[1]);
  const gate = new THREE.Group();
  gate.position.copy(mid);
  gate.rotation.y = ang;
  const postGeo = jitterBoxGeo(rng, 0.42, 1.55, 0.42, 0.12, 0.9);
  for (const side of [-1, 1]) {
    const post = new THREE.Mesh(postGeo, MAT.stone);
    post.position.set(side * 0.78, 0.62, 0);
    post.castShadow = true; post.receiveShadow = true;
    gate.add(post);
  }
  const gateW = 1.30;
  const wood = [];
  for (let i = 0; i < 4; i++) {
    wood.push({
      pos: [-0.02, 0.28 + i * 0.235, 0], rot: [0, 0, 0],
      scale3: [1, 1, 1]
    });
  }
  const bars = new GeoBatch();

/* ======================= 46_wallbuild.js ======================= */
/* ==========================================================================
   46 — drystone wall, rebuilt with correct outward faces and dressed stones.
   ========================================================================== */

function buildWallRibbon(pts, width, height, opts = {}) {
  const curve = curvePoints2D(pts, false);
  const len = curve.getLength();
  const steps = Math.max(14, Math.ceil(len / 0.32));
  const pos = [], uv = [], idx = [];
  const p = new THREE.Vector3(), t = new THREE.Vector3();
  let run = 0;
  const prev = new THREE.Vector3();
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    curve.getPoint(u, p);
    curve.getTangent(u, t);
    if (i > 0) run += p.distanceTo(prev);
    prev.copy(p);
    const nx = -t.z, nz = t.x;
    const w = width * 0.5;
    const hh = height * (0.93 + 0.13 * Math.sin(u * 17.0 + 0.7) + 0.05 * Math.sin(u * 43.0 + 1.3));
    const xL = p.x + nx * w, zL = p.z + nz * w;
    const xR = p.x - nx * w, zR = p.z - nz * w;
    const gyL = groundHeight(xL, zL), gyR = groundHeight(xR, zR);
    const gy = Math.max(gyL, gyR);
    const topL = gyL + hh, topR = gyR + hh;
    const baseL = gyL - 0.38, baseR = gyR - 0.38;
    // 0 left bottom, 1 left top, 2 right top, 3 right bottom
    pos.push(xL, baseL, zL, xL, topL, zL, xR, topR, zR, xR, baseR, zR);
    const uu = run * 0.55;
    uv.push(uu, 0, uu, hh * 0.55, uu, hh * 0.55, uu, 0);
  }
  for (let i = 0; i < steps; i++) {
    const a = i * 4, b = (i + 1) * 4;
    // left outer face (normal towards +side)
    idx.push(a, b, a + 1, a + 1, b, b + 1);
    // right outer face
    idx.push(a + 3, a + 2, b + 3, a + 2, b + 2, b + 3);
    // crown
    idx.push(a + 1, b + 1, a + 2, a + 2, b + 1, b + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function buildWall() {
  const rng = new RNG(SITE.seed + 700);
  const wallGeos = [];
  const stoneInstances = [];
  const copingInstances = [];
  const segs = [LAYOUT.wall.east, LAYOUT.wall.west];
  for (const pts of segs) {
    wallGeos.push(buildWallRibbon(pts, 0.66, 1.18));
    const curve = curvePoints2D(pts, false);
    const len = curve.getLength();
    const steps = Math.ceil(len / 0.30);
    const p = new THREE.Vector3(), t = new THREE.Vector3();
    for (let i = 0; i < steps; i++) {
      const u = (i + 0.5) / steps;
      curve.getPoint(u, p);
      curve.getTangent(u, t);
      const nx = -t.z, nz = t.x;
      const ang = Math.atan2(t.x, t.z);
      const gy = groundHeight(p.x, p.z);
      for (const side of [-1, 1]) {
        const courses = 5;
        for (let c = 0; c < courses; c++) {
          if (rng.chance(0.08)) continue;
          const y = gy + 0.12 + c * 0.21 + rng.range(-0.022, 0.022);
          const palettes = [
            ['#8d907a', '#7e826c', '#999b83', '#b0ac9c', '#868a74', '#a3a189'],
            ['#b8b2a2', '#a9a293', '#bfb6a3', '#9c9789', '#afa691', '#949083'],
            ['#c2bbaa', '#b3ac9c', '#cabfa8', '#a7a195', '#baaf98', '#9c9a8c'],
            ['#ccc6b4', '#bdb6a6', '#d2cab7', '#b1ac9c', '#c2b9a3', '#a9a596'],
            ['#d6cfbf', '#c9c2b1', '#e0d8c6', '#cdc8b6', '#bdb9a8', '#d8d2bf']
          ];
          const mossy = c <= 1 && rng.chance(0.28);
          stoneInstances.push({
            pos: [
              p.x + nx * side * 0.33 + rng.range(-0.035, 0.035),
              y,
              p.z + nz * side * 0.33 + rng.range(-0.035, 0.035)
            ],
            rot: [rng.range(-0.07, 0.07), ang + rng.range(-0.12, 0.12), rng.range(-0.09, 0.09)],
            scale3: [rng.range(0.68, 1.12), rng.range(0.75, 1.0), rng.range(0.7, 1.1)],
            color: rng.pick(mossy ? ['#7d8466', '#8c9278', '#727a60'] : palettes[Math.min(4, c)])
          });
        }
      }
      // coping: chunky tilted capstones along the crown
      if (i % 2 === 0) {
        copingInstances.push({
          pos: [p.x + rng.range(-0.02, 0.02), gy + 1.16 + rng.range(-0.01, 0.03), p.z + rng.range(-0.02, 0.02)],
          rot: [rng.range(-0.12, 0.12), ang + rng.range(-0.08, 0.08), rng.range(-0.13, 0.13)],
          scale3: [rng.range(0.95, 1.35), rng.range(0.85, 1.1), rng.range(1.0, 1.5)],
          color: rng.chance(0.15) ? rng.pick(['#a6a68e', '#b7b6a1', '#9a9c86']) : rng.pick(['#ddd6c4', '#c9c2b1', '#b8b1a1', '#e6ddc9'])
        });
      }
    }
  }
  const merged = mergeGeos(wallGeos);
  const wallMesh = new THREE.Mesh(merged, MAT.stoneDark);
  wallMesh.castShadow = true; wallMesh.receiveShadow = true;
  SCENE.add(wallMesh);
  const stoneGeo = jitterBoxGeo(rng, 0.34, 0.20, 0.23, 0.18, 0.86);
  SCENE.add(instancedFrom(stoneGeo, MAT.wallStone, stoneInstances, { cast: true, receive: true }));
  const copeGeo = jitterBoxGeo(rng, 0.42, 0.26, 0.42, 0.24, 0.95);
  SCENE.add(instancedFrom(copeGeo, MAT.wallStone, copingInstances, { cast: true, receive: true }));
  buildGate(rng);
  OBJ.wallStones = stoneInstances;
}

function buildGate(rng) {
  const e = LAYOUT.wall.east[LAYOUT.wall.east.length - 1];
  const w = LAYOUT.wall.west[0];
  const mid = new THREE.Vector3((e[0] + w[0]) / 2, groundHeight((e[0] + w[0]) / 2, (e[1] + w[1]) / 2), (e[1] + w[1]) / 2);
  const ang = Math.atan2(w[0] - e[0], w[1] - e[1]);
  const gate = new THREE.Group();
  gate.position.copy(mid);
  gate.rotation.y = ang;
  const postGeo = jitterBoxGeo(rng, 0.46, 1.75, 0.46, 0.12, 0.9);
  for (const side of [-1, 1]) {
    const post = new THREE.Mesh(postGeo, MAT.wallStone);
    post.position.set(side * 0.80, 0.72, 0);
    post.castShadow = true; post.receiveShadow = true;
    gate.add(post);
    const cap = new THREE.Mesh(jitterBoxGeo(rng, 0.52, 0.18, 0.52, 0.2, 0.9), MAT.quartz);
    cap.position.set(side * 0.80, 1.65, 0);
    cap.castShadow = true;
    gate.add(cap);
  }
  const gateW = 1.32;
  const bars = new GeoBatch();
  for (let i = 0; i < 4; i++) bars.box(gateW, 0.075, 0.05, 0, 0.30 + i * 0.25, 0, 0, 0, 0, 1);
  bars.box(0.09, 1.06, 0.065, -gateW / 2 + 0.06, 0.73, 0, 0, 0, 0, 1);
  bars.box(0.09, 1.06, 0.065, gateW / 2 - 0.06, 0.73, 0, 0, 0, 0, 1);
  bars.box(0.07, 1.28, 0.055, 0.02, 0.72, 0.01, 0, 0, 0.85, 1);
  const gateMesh = bars.build(MAT.woodGrey, { cast: true, receive: true });
  gate.add(gateMesh);
  const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.24, 8), MAT.metalRust);
  hinge.rotation.z = Math.PI / 2;
  hinge.position.set(-gateW / 2 + 0.06, 0.95, 0.03);
  gate.add(hinge);
  const hinge2 = hinge.clone(); hinge2.position.y = 0.44; gate.add(hinge2);
  SCENE.add(gate);
  OBJ.gate = gate;
}


/* ======================= 50_path_boots.js ======================= */
/* ==========================================================================
   50 — the path, the stone steps, the pale top step, and the pair of boots.
   ========================================================================== */

function buildPathStepsBoots() {
  const rng = new RNG(SITE.seed + 800);
  // ---- the path down through the thrift ----
  const pathGeo = ribbonOnGround(LAYOUT.path, 0.74, 0.025, groundHeight, { steps: 120 });
  {
    const uv = pathGeo.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 1.15, uv.getY(i) * 1.75);
    uv.needsUpdate = true;
  }
  const pathMesh = new THREE.Mesh(pathGeo, MAT.path);
  pathMesh.receiveShadow = true;
  pathMesh.castShadow = false;
  SCENE.add(pathMesh);
  // worn edges: a scatter of little stones along the path
  const edgeStones = [];
  const curve = curvePoints2D(LAYOUT.path, false);
  const N = 90;
  const p = new THREE.Vector3(), t = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    const u = i / N;
    curve.getPoint(u, p);
    curve.getTangent(u, t);
    const nx = -t.z, nz = t.x;
    for (const side of [-1, 1]) {
      if (rng.chance(0.45)) continue;
      const off = 0.46 + rng.range(0, 0.14);
      const x = p.x + nx * off * side, z = p.z + nz * off * side;
      const gy = groundHeight(x, z);
      const s = rng.range(0.025, 0.08);
      edgeStones.push({
        pos: [x, gy + s * 0.3, z], rot: [0, rng.range(0, TAU), 0],
        scale3: [s * rng.range(1, 1.6), s * 0.6, s * rng.range(1, 1.6)],
        color: rng.pick(['#b8b2a4', '#a7a092', '#c8c0ae', '#969083'])
      });
    }
  }
  const edgeGeo = new THREE.IcosahedronGeometry(1, 0);
  SCENE.add(instancedFrom(edgeGeo, MAT.stone, edgeStones, { cast: false, receive: true }));

  // ---- the steps ----
  const st = LAYOUT.steps;
  const stepTops = [];
  const stepZ = [];
  const stepGroup = new THREE.Group();
  let prevTop = -1e9;
  for (let i = 0; i < st.n; i++) {
    const zc = st.zFront - i * st.dz;
    const gy = groundHeight(st.x, zc - st.dz * 0.30);
    let top = gy + 0.10;
    if (i > 0) top = Math.max(top, prevTop + 0.21);
    prevTop = top;
    stepTops.push(top);
    stepZ.push(zc);
    const pale = i === 3;          // the pale quartz step behind the boots
    const mat = pale ? MAT.quartz : MAT.stone;
    const tread = new THREE.Mesh(boxGeo(st.width * (pale ? 1.10 : 1.0), 0.17, st.dz + 0.07, 1.5), mat);
    tread.position.set(st.x + rng.range(-0.015, 0.015), top - 0.085, zc);
    tread.rotation.y = rng.range(-0.016, 0.016);
    tread.castShadow = true; tread.receiveShadow = true;
    stepGroup.add(tread);
    if (i > 0) {
      const rise = top - stepTops[i - 1];
      const riser = new THREE.Mesh(boxGeo(st.width * (pale ? 1.10 : 1.0), rise + 0.02, 0.11, 1.5), pale ? MAT.quartz : MAT.stone);
      riser.position.set(st.x, stepTops[i - 1] + rise / 2, zc + st.dz * 0.5 + 0.02);
      riser.castShadow = true; riser.receiveShadow = true;
      stepGroup.add(riser);
    }
    // cheek stones at either side
    for (const side of [-1, 1]) {
      if (rng.chance(0.4)) continue;
      const cheek = new THREE.Mesh(jitterBoxGeo(rng, 0.34, 0.30, 0.5, 0.2, 0.8), MAT.stone);
      cheek.position.set(st.x + side * (st.width / 2 + 0.16), top - 0.16, zc + rng.range(-0.1, 0.1));
      cheek.rotation.y = rng.range(-0.3, 0.3);
      cheek.castShadow = true; cheek.receiveShadow = true;
      stepGroup.add(cheek);
    }
  }
  SCENE.add(stepGroup);
  OBJ.steps = stepGroup;
  OBJ.stepTops = stepTops;
  OBJ.stepZ = stepZ;
  // a surface probe that includes the stone treads (used by water + wrack)
  OBJ.surfaceAt = (x, z) => {
    let y = groundHeight(x, z);
    if (Math.abs(x - st.x) <= st.width * 0.5 + 0.10) {
      for (let i = 0; i < st.n; i++) {
        if (Math.abs(z - stepZ[i]) <= st.dz * 0.5 + 0.05) y = Math.max(y, stepTops[i]);
      }
    }
    return y;
  };
  const paleZ = stepZ[3];
  const paleTop = stepTops[3];

  // a pale quartz kerb-slab on the step behind the boots, so the dark pair
  // reads as a silhouette from the seaward opening bearing
  const paleSlab = new THREE.Mesh(boxGeo(1.02, 0.52, 0.14, 1.6), MAT.quartz);
  paleSlab.position.set(st.x, paleTop + 0.26, paleZ + 0.10);
  paleSlab.rotation.x = -0.06;
  paleSlab.rotation.y = 0.02;
  paleSlab.castShadow = true; paleSlab.receiveShadow = true;
  SCENE.add(paleSlab);

  // ---- boots ----
  const bootTopStep = 2;
  const bootY = stepTops[bootTopStep] + 0.005;
  const bootZ = stepZ[bootTopStep] + st.dz * 0.12;
  buildBootPair(bootY, bootZ);
  // a contact patch beneath each boot so they sit into the stone
  const aoTex = texFrom(radialSprite(128, [
    [0, 'rgba(10,8,6,.55)'], [0.45, 'rgba(10,8,6,.30)'], [1, 'rgba(10,8,6,0)']
  ]), { srgb: false, wrap: THREE.ClampToEdgeWrapping });
  for (const side of [-1, 1]) {
    const decal = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.74), new THREE.MeshBasicMaterial({
      map: aoTex, transparent: true, depthWrite: false, opacity: 0.85
    }));
    decal.rotation.x = -Math.PI / 2;
    decal.position.set(LAYOUT.boots.x + side * 0.155, bootY + 0.004, bootZ + 0.04);
    decal.renderOrder = 2;
    SCENE.add(decal);
  }
  // a coil of rope resting on the pale step
  const rope = new THREE.Group();
  for (let i = 0; i < 5; i++) {
    const r = 0.16 - i * 0.014;
    const torus = new THREE.Mesh(new THREE.TorusGeometry(r, 0.018, 6, 18), MAT.rope);
    torus.rotation.x = Math.PI / 2;
    torus.position.y = i * 0.026;
    rope.add(torus);
  }
  rope.position.set(st.x - 0.62, paleTop + 0.005, paleZ - 0.03);
  rope.rotation.y = 0.3;
  rope.children.forEach(o => { o.castShadow = true; o.receiveShadow = true; });
  SCENE.add(rope);
  // a creel / basket left on the shingle below
  const creel = new THREE.Group();
  const creelMat = MAT.woodGrey;
  const box = new THREE.Mesh(boxGeo(0.34, 0.22, 0.24, 1), creelMat);
  box.position.y = 0.11; creel.add(box);
  for (let i = 0; i < 4; i++) {
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.36, 5), MAT.rope);
    bar.rotation.z = Math.PI / 2;
    bar.position.set(0, 0.06 + i * 0.05, 0.13);
    creel.add(bar);
  }
  const creelY = groundHeight(2.0, 2.55);
  creel.position.set(2.0, creelY, 2.55);
  creel.rotation.y = -0.5;
  creel.children.forEach(o => { o.castShadow = true; o.receiveShadow = true; });
  SCENE.add(creel);

  // driftwood and a weathered float stranded on the shingle
  const drift = new THREE.Group();
  const logGeo = new THREE.CylinderGeometry(0.055, 0.10, 1.55, 7);
  const log1 = new THREE.Mesh(logGeo, MAT.woodGrey);
  log1.rotation.z = Math.PI / 2;
  log1.rotation.y = 0.35;
  log1.position.y = 0.085;
  drift.add(log1);
  const log2 = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.065, 0.9, 6), MAT.woodGrey);
  log2.rotation.z = Math.PI / 2;
  log2.rotation.y = -0.6;
  log2.position.set(0.35, 0.22, 0.18);
  drift.add(log2);
  for (let i = 0; i < 2; i++) {
    const stub = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.03, 0.34, 5), MAT.woodGrey);
    stub.rotation.z = 0.7 + i * 0.5;
    stub.rotation.y = 0.4 + i * 1.2;
    stub.position.set(-0.25 + i * 0.35, 0.2, 0.02);
    drift.add(stub);
  }
  const driftY = groundHeight(-3.6, 2.9);
  drift.position.set(-3.6, driftY, 2.9);
  drift.rotation.y = -0.5;
  drift.children.forEach(o => { o.castShadow = true; o.receiveShadow = true; });
  SCENE.add(drift);

  const floatGrp = new THREE.Group();
  const fgeo = new THREE.SphereGeometry(0.14, 9, 7);
  fgeo.scale(1, 0.85, 0.7);
  const fl = new THREE.Mesh(fgeo, MAT.cloth);
  fl.position.y = 0.13;
  floatGrp.add(fl);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.142, 0.142, 0.055, 12), MAT.woodGrey);
  band.position.y = 0.13;
  floatGrp.add(band);
  const fy = groundHeight(4.35, 3.3);
  floatGrp.position.set(4.35, fy, 3.3);
  floatGrp.rotation.set(0.2, 0.6, 0.3);
  floatGrp.children.forEach(o => { o.castShadow = true; o.receiveShadow = true; });
  SCENE.add(floatGrp);
}

function makeBootGeometry() {
  const g = new THREE.Group();
  // sole: heel + mid + toe
  const soleMat = MAT.rubber;
  const heel = new THREE.Mesh(new THREE.BoxGeometry(0.125, 0.05, 0.12), soleMat);
  heel.position.set(0, 0.025, -0.075);
  const mid = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.045, 0.20), soleMat);
  mid.position.set(0, 0.027, 0.01);
  const toe = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), soleMat);
  toe.scale.set(0.96, 0.36, 1.25);
  toe.position.set(0, 0.03, 0.115);
  const soleEdge = new THREE.Mesh(new THREE.BoxGeometry(0.132, 0.016, 0.30), MAT.rubber);
  soleEdge.position.set(0, 0.055, 0.0);
  // upper
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), MAT.leather);
  foot.scale.set(0.94, 0.78, 1.62);
  foot.position.set(0, 0.105, 0.025);
  const toeCap = new THREE.Mesh(new THREE.SphereGeometry(0.062, 14, 10), MAT.leather);
  toeCap.scale.set(0.92, 0.62, 0.98);
  toeCap.position.set(0, 0.095, 0.125);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.075, 0.20, 14, 1, true), MAT.leather);
  shaft.position.set(0, 0.20, -0.045);
  const shaftTop = new THREE.Mesh(new THREE.TorusGeometry(0.062, 0.012, 6, 16), MAT.leather);
  shaftTop.rotation.x = Math.PI / 2;
  shaftTop.position.set(0, 0.30, -0.045);
  const opening = new THREE.Mesh(new THREE.CircleGeometry(0.056, 14), new THREE.MeshBasicMaterial({ color: 0x120d09 }));
  opening.rotation.x = -Math.PI / 2;
  opening.position.set(0, 0.301, -0.045);
  const heelBack = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 8), MAT.leather);
  heelBack.scale.set(1, 0.9, 1.1);
  heelBack.position.set(0, 0.12, -0.10);
  // laces
  const laces = [];
  for (let i = 0; i < 4; i++) {
    const lace = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, 0.11, 5), MAT.lace);
    lace.rotation.z = Math.PI / 2 * (i % 2 ? 1 : -1);
    lace.rotation.y = rngLace(i);
    lace.position.set(0, 0.145 + i * 0.028, 0.06 - i * 0.008);
    laces.push(lace);
  }
  const tongue = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.012, 0.10), MAT.leather);
  tongue.position.set(0, 0.175, 0.042);
  tongue.rotation.x = -0.35;
  const all = [heel, mid, toe, soleEdge, foot, toeCap, shaft, shaftTop, opening, heelBack, tongue, ...laces];
  for (const m of all) { m.castShadow = true; m.receiveShadow = true; g.add(m); }
  return g;
}
function rngLace(i) { return (i * 0.6 + 0.2) * (i % 2 ? 1 : -1); }

function buildBootPair(stepY, stepZ) {
  const pair = new THREE.Group();
  const base = makeBootGeometry();
  const b1 = base.clone(true);
  b1.position.set(-0.085, 0, 0);
  b1.rotation.y = -0.16;
  b1.rotation.z = 0.045;
  const b2 = base.clone(true);
  b2.position.set(0.095, 0.004, -0.025);
  b2.rotation.y = 0.22;
  b2.rotation.z = -0.03;
  pair.add(b1, b2);
  pair.position.set(LAYOUT.boots.x, stepY, stepZ);
  pair.rotation.y = LAYOUT.boots.rotY;
  pair.scale.set(2.2, 2.2, 2.2);
  SCENE.add(pair);
  OBJ.boots = pair;
  OBJ.bootsWorld = new THREE.Vector3(LAYOUT.boots.x, stepY, stepZ);
}

   60 — vegetation: sheltered yard turf, wild brae grass, sea thrift, campion,
        heather, and the tall seed stems that comb over the exposed wall cap.

const WIND_SHADERS = [];
let WIND_MAT_ID = 0;

function addVertexColor(geo, hex) {
  const c = new THREE.Color(hex);
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}
function mergeColored(geos) {
  const list = geos.map(g => (g.index ? g.toNonIndexed() : g));
  let total = 0;
  for (const g of list) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3);
  let o = 0;
  for (const g of list) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array, o * 3);
    if (g.attributes.color) col.set(g.attributes.color.array, o * 3);
    else { for (let i = 0; i < n * 3; i++) col[o * 3 + i] = 0.5; }
    o += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeBoundingSphere();
  return out;
}

function windMaterial(opts, bend) {
  const mat = new THREE.MeshStandardMaterial(opts);
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = { value: 0 };
    shader.uniforms.uWindDir = { value: new THREE.Vector2(SITE.wind.x, SITE.wind.z).normalize() };
    shader.uniforms.uBend = { value: bend };
    shader.uniforms.uGustScale = { value: 1.0 };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        attribute vec3 aPhase;
        attribute vec2 aRot;
        uniform float uTime;
        uniform vec2 uWindDir;
        uniform float uBend;
        uniform float uGustScale;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float yN = clamp(position.y, 0.0, 1.0);
        vec3 ip = instanceMatrix[3].xyz;
        vec2 ldir = vec2(aRot.x * uWindDir.x - aRot.y * uWindDir.y,
                         aRot.y * uWindDir.x + aRot.x * uWindDir.y);
        float along = dot(ip.xz, uWindDir);
        float gust = 0.52 + 0.48 * sin(uTime * 0.82 - along * 0.16 + aPhase.x * 1.3);
        gust = gust * 0.72 + 0.28 * sin(uTime * 0.31 + along * 0.05 + 1.7);
        float sway = sin(uTime * 2.35 + aPhase.x * 7.1) * 0.55 + sin(uTime * 3.9 + aPhase.x * 2.3) * 0.22;
        float b = uBend * (gust * uGustScale * 0.78 + sway * 0.30) * mix(0.16, 1.0, aPhase.y) * aPhase.z;
        float k = pow(yN, 1.6);
        float sx = max(length(instanceMatrix[0].xyz), 0.001);
        float sz = max(length(instanceMatrix[2].xyz), 0.001);
        float sy = max(length(instanceMatrix[1].xyz), 0.001);
        transformed.x += ldir.x * b * k / sx;
        transformed.z += ldir.y * b * k / sz;
        transformed.y -= abs(b) * k * 0.42 / sy;`);
    mat.userData.shader = shader;
    WIND_SHADERS.push(shader);
  };
  const mid = WIND_MAT_ID++;
  mat.customProgramCacheKey = () => 'windVeg' + mid + '_' + bend;
  return mat;
}

function makeVegetationInstances(geo, mat, list, opts = {}) {
  const im = new THREE.InstancedMesh(geo, mat, list.length);
  im.castShadow = !!opts.cast;
  im.receiveShadow = opts.receive !== false;
  const phase = new Float32Array(list.length * 3);
  const rot = new Float32Array(list.length * 2);
  const hasColor = list.some(e => e.color);
  if (hasColor) im.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(list.length * 3), 3);
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const v = new THREE.Vector3();
  const s = new THREE.Vector3();
  const col = new THREE.Color();
  for (let i = 0; i < list.length; i++) {
    const e = list[i];
    const yaw = e.rotY || 0;
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
    s.set(e.sx, e.sy, e.sz !== undefined ? e.sz : e.sx);
    v.set(e.x, e.y, e.z);
    m.compose(v, q, s);
    im.setMatrixAt(i, m);
    phase[i * 3] = e.phase !== undefined ? e.phase : (i * 2.399963) % TAU;
    phase[i * 3 + 1] = e.stiff !== undefined ? e.stiff : 0.5;
    phase[i * 3 + 2] = e.shelter !== undefined ? e.shelter : 1;
    rot[i * 2] = Math.cos(yaw);
    rot[i * 2 + 1] = Math.sin(yaw);
    if (hasColor) { col.set(e.color || '#ffffff'); im.setColorAt(i, col); }
  }
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phase, 3));
  geo.setAttribute('aRot', new THREE.InstancedBufferAttribute(rot, 2));
  im.frustumCulled = false;
  return im;
}

/* ---------------- vegetation geometry ---------------- */
function makeTuftGeometry(rng, planes = 4) {
  const geos = [];
  for (let i = 0; i < planes; i++) {
    const g = new THREE.PlaneGeometry(1, 1, 1, 1);
    g.translate(0, 0.5, 0);
    g.rotateZ(rng.range(-0.07, 0.07));
    g.rotateY(i / planes * Math.PI + rng.range(-0.22, 0.22));
    geos.push(g);
  }
  const merged = mergeGeos(geos);
  // grass cards should gather light from the sky, not present as black vertical
  // slivers: tilt their normals strongly skyward while keeping a little facing.
  const n = merged.attributes.normal;
  for (let i = 0; i < n.count; i++) {
    const nx = n.getX(i), ny = n.getY(i), nz = n.getZ(i);
    const vx = nx * 0.34, vy = 0.90 + ny * 0.12, vz = nz * 0.34;
    const l = Math.hypot(vx, vy, vz) || 1;
    n.setXYZ(i, vx / l, vy / l, vz / l);
  }
  return merged;
}
function makeTallStemGeometry(rng) {
  const geos = [];
  const stem = (height, width, lean, col) => {
    const pos = [], idx = [];
    const segs = 3;
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const w = width * (1 - t * 0.72) * 0.5;
      const x = lean * t * t;
      const y = t * height;
      pos.push(x - w, y, 0, x + w, y, 0);
      if (i < segs) {
        const a = i * 2;
        idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    // seed head: a fan of awns and a couple of little seed shapes
    const hx = lean, hy = height;
    const head = [];
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * TAU;
      const spread = 0.105;
      const outx = Math.cos(a) * spread, outz = Math.sin(a) * spread;
      const tipx = outx * 2.1, tipy = hy + 0.075 + (i % 3) * 0.028, tipz = outz * 2.1;
      head.push(hx, hy - 0.01, 0, hx + outx, tipy - 0.03, outz, hx + tipx, tipy, tipz);
      head.push(hx + outx, tipy - 0.03, outz, hx + outx * 0.8, tipy - 0.05, outz * 0.8, hx + tipx, tipy, tipz);
    }
    const hg = new THREE.BufferGeometry();
    hg.setAttribute('position', new THREE.Float32BufferAttribute(head, 3));
    hg.computeVertexNormals();
    addVertexColor(g, col[0]);
    addVertexColor(hg, col[1]);
    geos.push(g, hg);
  };
  stem(1.0, 0.042, rng.range(0.05, 0.14), [0x6b7a40, 0xc2b36c]);
  stem(0.82, 0.034, rng.range(-0.10, -0.03), [0x748345, 0xccbd76]);
  stem(0.66, 0.028, rng.range(-0.05, 0.16), [0x6f7f44, 0xb6a966]);
  return mergeColored(geos);
}
function makeThriftFoliageGeometry(rng) {
  // a low cushion of narrow chive-like leaves
  const geos = [];
  const n = 9;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + rng.range(-0.3, 0.3);
    const len = rng.range(0.38, 0.62);
    const w = rng.range(0.035, 0.06);
    const tipR = rng.range(0.35, 0.55);
    const pos = [
      0, 0, 0,
      Math.cos(a) * w, len * 0.4, Math.sin(a) * w,
      Math.cos(a) * tipR * len, len, Math.sin(a) * tipR * len
    ];
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute([0, 1, 0, 0, 1, 0, 0, 1, 0], 3));
    addVertexColor(g, i % 3 === 0 ? 0x667a3e : 0x53672f);
    geos.push(g);
  }
  return mergeColored(geos);
}
function makeThriftFlowerGeometry(rng) {
  const geos = [];
  const stems = 5;
  for (let i = 0; i < stems; i++) {
    const a = i / stems * TAU + rng.range(-0.4, 0.4);
    const h = rng.range(0.5, 0.9);
    const out = rng.range(0.12, 0.30);
    const px = Math.cos(a) * out * 0.3, pz = Math.sin(a) * out * 0.3;
    const tx = Math.cos(a) * out, tz = Math.sin(a) * out;
    const pos = [px - 0.008, 0.02, pz, px + 0.008, 0.02, pz, tx, h, tz];
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute([0, 1, 0, 0, 1, 0, 0, 1, 0], 3));
    addVertexColor(g, 0x4e6030);
    geos.push(g);
    const head = new THREE.IcosahedronGeometry(0.045 + rng.range(0, 0.013), 0);
    head.translate(tx, h, tz);
    addVertexColor(head, rng.chance(0.25) ? 0xc98a96 : 0xb26b7f);
    geos.push(head);
  }
  return mergeColored(geos);
}
function makeCampionGeometry(rng) {
  const geos = [];
  for (let i = 0; i < 3; i++) {
    const a = i / 3 * TAU + rng.range(0, 1);
    const h = rng.range(0.28, 0.45);
    const tx = Math.cos(a) * 0.10, tz = Math.sin(a) * 0.10;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0.012, 0.02, 0, tx, h, tz], 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute([0, 1, 0, 0, 1, 0, 0, 1, 0], 3));
    addVertexColor(g, 0x5c7040);
    geos.push(g);
    const head = new THREE.IcosahedronGeometry(0.026, 0);
    head.translate(tx, h, tz);
    addVertexColor(head, 0xe8e2ce);
    geos.push(head);
  }
  return mergeColored(geos);
}
function makeHeatherGeometry(rng) {
  const geos = [];
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * TAU + rng.range(-0.3, 0.3);
    const len = rng.range(0.25, 0.42);
    const w = 0.03;
    const pos = [0, 0, 0, Math.cos(a) * w, len * 0.4, Math.sin(a) * w, Math.cos(a) * len * 0.6, len, Math.sin(a) * len * 0.6];
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute([0, 1, 0, 0, 1, 0, 0, 1, 0], 3));
    addVertexColor(g, i % 3 === 0 ? 0x5e4f3a : 0x4b4a33);
    geos.push(g);
    if (i % 2 === 0) {
      const tip = new THREE.IcosahedronGeometry(0.022, 0);
      tip.translate(Math.cos(a) * len * 0.6, len, Math.sin(a) * len * 0.6);
      addVertexColor(tip, 0x7c5f6e);
      geos.push(tip);
    }
  }
  return mergeColored(geos);
}

/* ---------------- placement ---------------- */
const GRASS_COLORS = ['#a2ad6c', '#b0b878', '#909d5e', '#b9bd86', '#85955a', '#c2bd8c', '#9ca666', '#cac292'];
const TALL_COLORS = ['#b3a46a', '#c0b078', '#a19358', '#ccbc86', '#aa9a60'];
const THRIFT_COLORS = ['#8b9a5e', '#7c8d52', '#96a365'];

function windShelterOutsideWall(x, z) {
  // how exposed is this point to the sea wind: 1 exposed, 0.2 in the lee
  let best = 1e9, side = 0;
  for (const pts of [LAYOUT.wall.east, LAYOUT.wall.west]) {
    const pd = polylineDistance(x, z, pts);
    if (pd.d < best) { best = pd.d; side = 1; }
  }
  const inYard = yardMask(x, z) > 0.45;
  if (inYard) return lerp(0.18, 0.45, smoothstep(0.4, 2.6, best));
  return 1.0;
}

function buildVegetation() {
  const rng = new RNG(SITE.seed + 900);
  const yard = [], brae = [], tall = [], wallTall = [], thrift = [], campion = [], heather = [];
  const c = LAYOUT.cottage;
  const nearCottage = (x, z, pad = 0.5) => {
    const dx = Math.abs(x - c.x) < c.w / 2 + pad + 0.6;
    const dz = Math.abs(z - c.z) < c.d / 2 + pad + 0.6;
    return dx && dz;
  };
  const nearPeat = (x, z) => Math.hypot(x - LAYOUT.peat.x, z - LAYOUT.peat.z) < 1.9;
  const nearSteps = (x, z) => Math.abs(x - LAYOUT.steps.x) < 1.5 && z > LAYOUT.steps.zFront - LAYOUT.steps.n * LAYOUT.steps.dz - 0.6 && z < LAYOUT.steps.zFront + 0.8;
  const nearWall = (x, z) => {
    for (const pts of [LAYOUT.wall.east, LAYOUT.wall.west]) if (polylineDistance(x, z, pts).d < 0.55) return true;
    return false;
  };
  const tooCloseToPath = (x, z, w = 0.58) => pathDistance(x, z) < w;
  const onLand = (x, z) => {
    if (!insideFootprint(x, z, 0.55)) return false;
    const h = groundHeight(x, z);
    if (h < 0.42) return false;
    if (slopeAt(x, z) > 1.35) return false;
    return true;
  };
  const exposedAt = (x, z) => {
    // distance seaward of the yard walls: tall stems live on the exposed brae
    let d = 1e9;
    for (const pts of [LAYOUT.wall.east, LAYOUT.wall.west]) d = Math.min(d, polylineDistance(x, z, pts).d);
    return d;
  };

  // --- yard turf (short, sheltered, barely moves) ---
  for (let i = 0; i < 2600; i++) {
    const x = rng.range(-9.5, 6.4), z = rng.range(-11.6, -2.6);
    if (yardMask(x, z) < 0.35) continue;
    if (nearCottage(x, z) || nearPeat(x, z) || nearWall(x, z) || tooCloseToPath(x, z)) continue;
    const h = groundHeight(x, z);
    if (h < 3.4) continue;
    const s = rng.range(0.09, 0.20);
    yard.push({
      x, y: h - 0.02, z, rotY: rng.range(0, TAU),
      sx: s * rng.range(0.85, 1.45), sy: s * rng.range(0.36, 0.62), sz: s * rng.range(0.85, 1.45),
      phase: rng.range(0, TAU), stiff: rng.range(0.75, 0.95),
      shelter: rng.range(0.12, 0.28), color: rng.pick(GRASS_COLORS)
    });
  }
  // --- wild brae and inland grass ---
  for (let i = 0; i < 3800; i++) {
    const x = rng.range(-14.5, 14.5), z = rng.range(-15.2, 3.4);
    if (!onLand(x, z)) continue;
    if (yardMask(x, z) > 0.3) continue;
    if (nearCottage(x, z) || nearPeat(x, z) || nearWall(x, z) || nearSteps(x, z) || tooCloseToPath(x, z, 0.7)) continue;
    if (rockZoneMask(x, z) > 0.35) continue;
    const h = groundHeight(x, z);
    const d = coastZ(x) - z;
    if (d < 2.4 && h < 0.8) continue; // keep the bare swash apron open
    const exposed = exposedAt(x, z);
    const s = rng.range(0.10, 0.24) * (d > 8 ? 1.05 : 0.9);
    brae.push({
      x, y: h - 0.02, z, rotY: rng.range(0, TAU),
      sx: s * rng.range(0.7, 1.25), sy: s * rng.range(0.55, 1.05), sz: s * rng.range(0.7, 1.25),
      phase: rng.range(0, TAU), stiff: rng.range(0.45, 0.8),
      shelter: (d < 4.5 && exposed < 2.8) ? rng.range(0.55, 0.85) : rng.range(0.75, 1.0),
      color: rng.pick(GRASS_COLORS)
    });
  }
  // --- tall seed stems on the exposed brae, combing over the wall ---
  for (const pts of [LAYOUT.wall.east, LAYOUT.wall.west]) {
    const curve = curvePoints2D(pts, false);
    const len = curve.getLength();
    const n = Math.ceil(len / 0.72);
    const p = new THREE.Vector3(), t = new THREE.Vector3();
    for (let i = 0; i < n; i++) {
      const u = (i + rng.range(0.1, 0.9)) / n;
      curve.getPoint(u, p);
      curve.getTangent(u, t);
      const nx = -t.z, nz = t.x;
      // find the downhill (seaward) side of the wall for this point
      let best = null;
      for (const side of [-1, 1]) {
        for (const off of [0.72, 1.2, 1.8]) {
          const x = p.x + nx * off * side, z = p.z + nz * off * side;
          if (!insideFootprint(x, z, 0.6)) continue;
          if (yardMask(x, z) > 0.42) continue;
          const h = groundHeight(x, z);
          if (h < 2.1) continue;
          if (!best || h < best.h) best = { x, z, h };
        }
      }
      if (!best) continue;
      const s = rng.range(0.65, 1.05);
      tall.push({
        x: best.x + rng.range(-0.20, 0.20), y: best.h - 0.02, z: best.z + rng.range(-0.20, 0.20),
        rotY: rng.range(0, TAU),
        sx: s * 0.9, sy: rng.range(1.15, 1.9), sz: s * 0.9,
        phase: rng.range(0, TAU), stiff: rng.range(0.85, 1.0), shelter: rng.range(0.95, 1.2),
        color: rng.pick(TALL_COLORS)
      });
      if (tall.length > 260) break;
    }
  }
  // --- a handful of tall stems rooted in the wall crown itself ---
  for (const pts of [LAYOUT.wall.east, LAYOUT.wall.west]) {
    const curve = curvePoints2D(pts, false);
    const len = curve.getLength();
    const n = Math.ceil(len / 1.05);
    const p = new THREE.Vector3();
    for (let i = 0; i < n; i++) {
      if (rng.chance(0.12)) continue;
      curve.getPoint((i + rng.range(0.15, 0.85)) / n, p);
      if (Math.abs(p.x - LAYOUT.gate.x) < 1.4 && Math.abs(p.z - LAYOUT.gate.z) < 1.4) continue;
      const h = groundHeight(p.x, p.z) + 0.98;
      const s = rng.range(0.50, 0.78);
      wallTall.push({
        x: p.x + rng.range(-0.08, 0.08), y: h, z: p.z + rng.range(-0.08, 0.08),
        rotY: rng.range(0, TAU),
        sx: s * 0.9, sy: rng.range(1.0, 1.55), sz: s * 0.9,
        phase: rng.range(0, TAU), stiff: rng.range(0.9, 1.0), shelter: rng.range(1.0, 1.25),
        color: rng.pick(TALL_COLORS)
      });
    }
  }
  // --- sea thrift on the banks beside the path and along the beach lip ---
  for (let i = 0; i < 1300; i++) {
    let x, z;
    if (rng.chance(0.55)) {
      // cluster around the lower brae and the path
      const p = LAYOUT.path[rng.int(1, 8)];
      x = p[0] + rng.gauss(0, 2.3);
      z = p[1] + rng.gauss(0, 1.7);
    } else {
      x = rng.range(-13, 13);
      z = coastZ(x) + rng.range(-0.4, 3.0);
    }
    if (!insideFootprint(x, z, 0.7)) continue;
    const h = groundHeight(x, z);
    if (h < 0.35 || h > 3.1) continue;
    if (slopeAt(x, z) > 1.9) continue;
    if (tooCloseToPath(x, z, 0.62)) continue;
    if (nearSteps(x, z) || nearCottage(x, z)) continue;
    if (rockZoneMask(x, z) > 0.6) continue;
    const s = rng.range(0.30, 0.58);
    const item = {
      x, y: h - 0.015, z, rotY: rng.range(0, TAU), sx: s, sy: s * rng.range(0.75, 1.15), sz: s,
      phase: rng.range(0, TAU), stiff: rng.range(0.35, 0.6),
      shelter: rng.range(0.7, 1.0), color: rng.pick(THRIFT_COLORS)
    };
    thrift.push(item);
    if (thrift.length > 210) break;
  }
  // --- campion among the thrift ---
  for (let i = 0; i < 120; i++) {
    const p = LAYOUT.path[rng.int(2, 7)];
    const x = p[0] + rng.gauss(0, 2.4), z = p[1] + rng.gauss(0, 1.6);
    if (!insideFootprint(x, z, 0.8)) continue;
    const h = groundHeight(x, z);
    if (h < 0.7 || h > 2.4) continue;
    if (tooCloseToPath(x, z, 0.75) || nearSteps(x, z) || nearWall(x, z)) continue;
    if (rockZoneMask(x, z) > 0.45) continue;
    const s = rng.range(0.26, 0.45);
    campion.push({
      x, y: h - 0.01, z, rotY: rng.range(0, TAU), sx: s, sy: s * rng.range(0.9, 1.2), sz: s,
      phase: rng.range(0, TAU), stiff: rng.range(0.4, 0.7), shelter: rng.range(0.8, 1.0),
      color: rng.pick(['#e8e2ce', '#f2ecd8', '#dcd6c2'])
    });
    if (campion.length > 26) break;
  }
  // --- heather and moor grass on the back shoulder ---
  for (let i = 0; i < 700; i++) {
    const x = rng.range(-12, 12), z = rng.range(-16, -11.4);
    if (!insideFootprint(x, z, 0.7)) continue;
    if (yardMask(x, z) > 0.3) continue;
    if (nearCottage(x, z) || nearWall(x, z)) continue;

  const tallGeo = makeTallStemGeometry(new RNG(SITE.seed + 902));
  const tallMat = windMaterial({ vertexColors: true, color: 0xffffff, roughness: 0.88, metalness: 0, side: THREE.DoubleSide, envMapIntensity: 0.4, emissive: 0x0a1004, emissiveIntensity: 0.4 }, 0.52);
  const tallMesh = makeVegetationInstances(tallGeo, tallMat, tall, { cast: false });
  const wallTallMesh = makeVegetationInstances(tallGeo.clone(), tallMat, wallTall, { cast: false });
  SCENE.add(tallMesh, wallTallMesh);
  OBJ.tallCount = tall.length + wallTall.length;

  const thriftFol = makeThriftFoliageGeometry(new RNG(SITE.seed + 903));
  const thriftMat = windMaterial({ vertexColors: true, color: 0xffffff, roughness: 0.9, metalness: 0, side: THREE.DoubleSide, envMapIntensity: 0.35 }, 0.14);
  const folMesh = makeVegetationInstances(thriftFol, thriftMat, thrift, { cast: false });
  const flowerGeo = makeThriftFlowerGeometry(new RNG(SITE.seed + 904));
  const flowerMat = windMaterial({ vertexColors: true, color: 0xffffff, roughness: 0.82, metalness: 0, side: THREE.DoubleSide, envMapIntensity: 0.45 }, 0.22);
  const flowerMesh = makeVegetationInstances(flowerGeo, flowerMat, thrift, { cast: false });

  const campionGeo = makeCampionGeometry(new RNG(SITE.seed + 905));

  });
}

/* ==========================================================================
   65 — a few Manx gulls wheeling over the water. Small, cheap, alive.
   ========================================================================== */

function buildBirds() {
  const matBody = new THREE.MeshStandardMaterial({ color: 0xf0ede4, roughness: 0.82, metalness: 0, envMapIntensity: 0.6 });
  const matWing = new THREE.MeshStandardMaterial({ color: 0xcfd0cd, roughness: 0.86, metalness: 0, envMapIntensity: 0.5, side: THREE.DoubleSide });
  const matTip = new THREE.MeshStandardMaterial({ color: 0x3c3c3c, roughness: 0.8, metalness: 0 });
  const matBeak = new THREE.MeshStandardMaterial({ color: 0xc08a3a, roughness: 0.7, metalness: 0 });
  const birds = [];
  const specs = [
    { cx: 6.0, cz: 10.0, r: 9.5, h: 14.5, speed: 0.19, phase: 0.2, flap: 4.6, scale: 1.15 },
    { cx: -3.0, cz: 13.0, r: 13.0, h: 17.5, speed: -0.13, phase: 2.4, flap: 4.1, scale: 0.95 },
    { cx: 12.0, cz: 6.0, r: 7.0, h: 11.5, speed: 0.25, phase: 4.0, flap: 5.2, scale: 0.8 }
  ];
  for (const sp of specs) {
    const g = new THREE.Group();
    g.userData.bird = true;
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), matBody);
    body.scale.set(0.7, 0.8, 2.2);
    g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 6), matBody);
    head.position.set(0, 0.04, 0.20);
    g.add(head);
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.022, 0.09, 6), matBeak);
    beak.position.set(0, 0.035, 0.30);
    beak.rotation.x = Math.PI / 2;
    g.add(beak);
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.18, 4), matBody);
    tail.position.set(0, 0.015, -0.25);
    tail.rotation.x = -Math.PI / 2;
    tail.scale.set(1.2, 1, 0.35);
    g.add(tail);
    const wings = [];
    for (const side of [-1, 1]) {
      const wing = new THREE.Group();
      const pt = (x, z) => new THREE.Vector3(side * x, 0, z);
      const geo = new THREE.BufferGeometry();
      const v = [
        pt(0.05, 0.10), pt(0.05, -0.08), pt(0.58, 0.02),
        pt(0.58, 0.02), pt(0.05, -0.08), pt(0.52, -0.10)
      ];
      const arr = [];
      for (const p of v) arr.push(p.x, p.y, p.z);
      geo.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, matWing);
      wing.add(m);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.017, 4, 3), matTip);
      tip.position.set(side * 0.56, 0, 0.02);
      tip.scale.set(1, 0.25, 2.2);
      wing.add(tip);
      wing.position.set(side * 0.08, 0.03, 0.0);
      g.add(wing);
      wings.push(wing);
    }
    g.scale.setScalar(sp.scale);
    g.rotation.order = 'YXZ';
    SCENE.add(g);
    birds.push({ group: g, wings, spec: sp, wingbase: 0.12 });
  }
  OBJ.birds = birds;
  UPDATERS.push((dt, t) => {
    for (const b of birds) {
      const sp = b.spec;
      const ang = sp.phase + t * sp.speed;
      const x = sp.cx + Math.cos(ang) * sp.r;
      const z = sp.cz + Math.sin(ang) * sp.r;
      const y = sp.h + Math.sin(t * 0.55 + sp.phase) * 0.8;
      b.group.position.set(x, y, z);
      const heading = sp.speed > 0 ? -ang : Math.PI - ang;
      b.group.rotation.y = heading;
      b.group.rotation.z = Math.sin(t * 0.7 + sp.phase) * 0.10;
      const flap = Math.sin(t * sp.flap + sp.phase) * 0.42 + 0.06;
      b.wings[0].rotation.z = flap;
      b.wings[1].rotation.z = -flap;
    }
  });
}

/* ==========================================================================
   70 — the sea: swell train, green comber, breaking ledge, the shallow notch
        tongue, spray, smoke and the wrack that marks each reach.
   ========================================================================== */

const SEA = {
  u: null,
  tu: null,
  mesh: null,
  tongue: null,
  spray: null,
  smoke: null,
  wrack: null,
  wetDirty: true
};
const SEA_CFG = {
  minX: -17.5, maxX: 17.5, minZ: 0.6, maxZ: 19.2,
  nx: 160, nz: 96,
  swellAmp: 0.26,
  comberWidth: 1.55,
  impactZ: 5.0
};

function buildSeaGeometry() {
  // One water object: a polar surface disc that reaches the model rim, plus a
  // skirt of the same mesh dropping from the rim down to the seabed. Surface
  // and cut face share the rim ring exactly, so there is no seam or gap.
  const NT = 320, NR = 64;
  const P = [], BED = [], TOP = [], SIDE = [], idx = [];
  const inset = 0.02;
  const rimR = (th) => Math.max(0.8, footprintR(th) - inset);
  // --- surface rings ---
  for (let i = 0; i <= NR; i++) {
    const t = i / NR;
    for (let j = 0; j < NT; j++) {
      const th = j / NT * TAU;
      const rr = t * rimR(th);
      const x = Math.sin(th) * rr, z = Math.cos(th) * rr;
      P.push(x, 0, z);
      BED.push(groundHeight(x, z));
      TOP.push(1);
      SIDE.push(0);
    }
  }
  for (let i = 0; i < NR; i++) {
    for (let j = 0; j < NT; j++) {
      const jn = (j + 1) % NT;
      const a = i * NT + j, b = i * NT + jn, c = (i + 1) * NT + j, d = (i + 1) * NT + jn;
      idx.push(a, c, b, b, c, d);
    }
  }
  // --- rim skirt: from the wave surface down into the seabed, same mesh ---
  const rimTop = new Array(NT).fill(-1), rimBot = new Array(NT).fill(-1);
  for (let j = 0; j < NT; j++) {
    const th = j / NT * TAU;
    const rr = rimR(th);
    const x = Math.sin(th) * rr, z = Math.cos(th) * rr;
    const gy = groundHeight(x, z);
    if (gy > SITE.waterY - 0.035) continue;
    rimTop[j] = P.length / 3;
    P.push(x, 0, z); BED.push(gy); TOP.push(1); SIDE.push(1);
    rimBot[j] = P.length / 3;
    P.push(x, 0, z); BED.push(gy); TOP.push(0); SIDE.push(1);
  }
  for (let j = 0; j < NT; j++) {
    const jn = (j + 1) % NT;
    if (rimTop[j] < 0 || rimTop[jn] < 0) continue;
    const t0 = rimTop[j], b0 = rimBot[j], t1 = rimTop[jn], b1 = rimBot[jn];
    idx.push(t0, t1, b0, t1, b1, b0);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('aBed', new THREE.Float32BufferAttribute(BED, 1));
  g.setAttribute('aTop', new THREE.Float32BufferAttribute(TOP, 1));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(SIDE, 1));
  g.setIndex(idx);
  g.computeBoundingSphere();
  g.boundingSphere.radius += 2.5;
  return g;
}

const SEA_VERT = `
  uniform float uTime;
  uniform float uWaterY;
  uniform float uSwellAmp;
  uniform float uComberPos;
  uniform float uComberAmp;
  uniform float uComberW;
  attribute float aBed;
  attribute float aTop;
  attribute float aSide;
  varying vec3 vWorld;
  varying vec3 vNormalW;
  varying float vDepth;
  varying float vCrest;
  varying float vWaveH;
  varying float vShoal;
  varying float vBedDbg;
  varying float vSide;

  float waveAt(vec2 p, float depth) {
    float t = uTime;
    float phase = 0.72 * (p.y + 1.40 * t) + 0.34 * sin(p.x * 0.13 + 0.4) + 0.10 * sin(p.x * 0.37 - 1.0);
    float shoal = smoothstep(1.85, 0.22, depth);
    float st = sin(phase) + (0.15 + 0.24 * shoal) * sin(2.0 * phase + 1.1) + 0.05 * sin(3.0 * phase);
    float amp = uSwellAmp * mix(0.55, 1.8, shoal) * smoothstep(-0.12, 0.22, depth);
    float h = amp * st;
    // a slower cross-swell so the train never looks like corduroy
    float phase2 = 0.52 * (p.x * 0.62 + p.y * 0.78) + 1.02 * t + 1.7;
    h += amp * 0.10 * sin(phase2) * (0.6 + 0.5 * sin(p.x * 0.21 - 0.7));
    h += amp * 0.05 * sin(0.9 * (p.x * 0.45 - p.y * 0.89) + 1.3 * t + 2.0) * (0.7 + 0.4 * cos(p.y * 0.18 + 0.4));
    h += 0.006 * sin(1.7 * (p.x * 0.30 + p.y * 0.95) + 2.4 * t);
    h += 0.004 * sin(3.1 * (p.x * 0.75 + p.y * 0.66) - 3.6 * t);
    float cx = (p.y - uComberPos) / uComberW;
    h += uComberAmp * exp(-cx * cx * 1.25) * (1.0 + 0.42 * shoal);
    h += 0.005 * sin(p.x * 3.1 + t * 2.6 + p.y * 1.3);
    h += 0.008 * sin(p.x * 7.3 - t * 3.2 + p.y * 1.7);
    h += 0.004 * sin(p.x * 2.2 + t * 2.3 - p.y * 0.7);
    return h;
  }
  void main() {
    vec4 wp = modelMatrix * vec4(position, 1.0);
    float depth = uWaterY - aBed;
    float shoal = smoothstep(1.85, 0.22, depth);
    float h = waveAt(wp.xz, depth);
    float e = 0.38;
    float hx = waveAt(wp.xz + vec2(e, 0.0), depth);
    float hz = waveAt(wp.xz + vec2(0.0, e), depth);
    float surfY = uWaterY + h;
    // surface vertices ride the wave; skirt-bottom vertices sit in the seabed
    wp.y = mix(aBed - 0.05, surfY, aTop);
    vec3 nW = normalize(vec3(h - hx, e, h - hz));
    float crest = clamp(h / (max(uSwellAmp, 0.001) * 2.4) + 0.5, 0.0, 1.0);
    vWorld = wp.xyz; vNormalW = nW; vDepth = depth; vShoal = shoal; vWaveH = h;
    vCrest = crest;
    vBedDbg = aBed;
    vSide = aSide;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;
const SEA_FRAG = `
  uniform float uTime;
  uniform float uWaterY;
  uniform sampler2D uFoam;
  uniform sampler2D uWaterN;
  uniform sampler2D uEnv;
  uniform vec3 uSunDir;
  uniform float uSpill;
  uniform float uComberPos;
  uniform float uComberAmp;
  uniform float uComberW;
  uniform vec2 uCloudCenter;
  uniform vec2 uCloudRad;
  uniform float uCloudStrength;
  uniform float uDebug;
  uniform float uFoamScale;
  uniform float uReflScale;
  varying vec3 vWorld;
  varying vec3 vNormalW;
  varying float vDepth;
  varying float vCrest;
  varying float vWaveH;
  varying float vShoal;
  varying float vBedDbg;
  varying float vSide;

  vec3 skyRefl(vec3 R) {
    float u = atan(R.z, R.x) / 6.2831853 + 0.5;
    float v = 0.5 + asin(clamp(R.y, -1.0, 1.0)) / 3.14159265;
    vec3 c = texture2D(uEnv, vec2(u, v)).rgb;
    // the equirect sky is stored sRGB; work in linear
    c = pow(c, vec3(2.2));
    c *= 1.05;
    return c;
  }
  void main() {
    vec3 body;
    float alpha;
    if (vSide > 0.5) {
      // the one water object's cut face: a depth-graded slice of seawater
      float sd = clamp((uWaterY - vWorld.y) / 3.4, 0.0, 1.0);
      vec3 secTop = vec3(0.028, 0.098, 0.094);
      vec3 secMid = vec3(0.006, 0.038, 0.050);
      vec3 secDeep = vec3(0.0015, 0.007, 0.014);
      vec3 col = mix(secMid, secDeep, smoothstep(0.12, 0.92, sd));
      col = mix(secTop, col, smoothstep(0.0, 0.26, sd));
      float sn = texture2D(uFoam, vec2((vWorld.x + vWorld.z) * 0.24, vWorld.y * 0.55 + uTime * 0.015)).r;
      float sn2 = texture2D(uFoam, vec2((vWorld.x - vWorld.z) * 0.07, vWorld.y * 0.18 - uTime * 0.01)).r;
      col += vec3(0.012, 0.028, 0.026) * smoothstep(0.62, 0.9, sn * 0.7 + sn2 * 0.5) * (1.0 - sd) * 0.55;
      col += vec3(0.008, 0.020, 0.022) * smoothstep(0.78, 0.97, sn2) * sd * 0.5;
      float lip = smoothstep(0.16, 0.0, uWaterY - vWorld.y);
      col += vec3(0.16, 0.15, 0.11) * lip * 0.10;
      col *= 1.0 - lip * 0.18;
      col *= 0.72 + 0.30 * smoothstep(0.0, 0.6, sd);
      body = col;
      alpha = 1.0;
    } else {
      if (vBedDbg >= uWaterY - 0.02) discard;
      float depth = vDepth;
      if (depth < -0.015) discard;
      float shore = smoothstep(0.10, 0.0, depth);

    vec2 distort = texture2D(uFoam, vWorld.xz * 0.045 + vec2(uTime * 0.004, -uTime * 0.003)).rg - 0.5;
    // smooth, non-tiled warp that keeps the ripple tile from lacing into a grid
    vec2 warp = vec2(
      sin(vWorld.z * 0.37 + uTime * 0.21) + 0.6 * sin(vWorld.x * 0.23 - uTime * 0.17),
      cos(vWorld.x * 0.31 - uTime * 0.19) + 0.5 * cos(vWorld.z * 0.27 + uTime * 0.13)
    );
    distort += warp * 0.22;
    // rotate the two octaves apart so the tile never laces into a grid
    mat2 rotA = mat2(0.866, 0.5, -0.5, 0.866);
    mat2 rotB = mat2(0.259, -0.966, 0.966, 0.259);
    vec2 ruv = rotA * vWorld.xz * 0.27 + distort * 0.55 + vec2(uTime * 0.030, -uTime * 0.058);
    vec3 rn = texture2D(uWaterN, ruv).xyz * 2.0 - 1.0;
    vec2 ruv2 = rotB * vWorld.xz * 0.71 + distort * 0.9 - vec2(uTime * 0.052, uTime * 0.17);
    vec3 rn2 = texture2D(uWaterN, ruv2).xyz * 2.0 - 1.0;
    vec3 N = normalize(vNormalW + vec3(rn.x * 0.7 + rn2.x * 0.45, 0.0, rn.y * 0.7 + rn2.y * 0.45) * 0.03);
    vec3 V = normalize(cameraPosition - vWorld);
    float diff = max(dot(N, uSunDir), 0.0);

    vec3 shallow = vec3(0.022, 0.062, 0.058);
    vec3 deep = vec3(0.004, 0.016, 0.028);
    body = mix(shallow, deep, smoothstep(0.05, 2.7, depth));
    // the shallow sand shelf: warmer, greener, with soft caustic mottling
    float sandBand = smoothstep(0.62, 0.05, depth);
    float caustic = texture2D(uFoam, vWorld.xz * 0.72 + vec2(uTime * 0.018, -uTime * 0.024)).r;
    body = mix(body, vec3(0.058, 0.118, 0.098), sandBand * 0.55);
    body *= 0.92 + 0.20 * caustic * sandBand;
    body += vec3(0.020, 0.030, 0.026) * sandBand * smoothstep(0.55, 0.85, caustic);
    body += vec3(0.09, 0.075, 0.035) * diff * 0.20;

    vec3 R = reflect(-V, N);
    vec3 sky = skyRefl(R) * 0.76;
    float fres = 0.035 + 0.80 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
    float fresDepth = mix(0.55, 1.0, smoothstep(0.05, 1.1, depth));
    body = mix(body, sky, clamp(fres, 0.0, 0.44) * fresDepth * uReflScale);
    // steep faces are the body of the wave: translucent green, not mirrored
    float steep = 1.0 - N.y;
    body = mix(body, vec3(0.012, 0.072, 0.050), smoothstep(0.14, 0.72, steep) * 0.75);
    // the comber's front face glows green as it stands up
    float cxd = (vWorld.z - uComberPos) / max(uComberW, 0.4);
    float comberFace = smoothstep(0.18, 0.72, uComberAmp) * exp(-cxd * cxd * 1.55) * smoothstep(0.02, 0.30, steep);
    body = mix(body, vec3(0.018, 0.155, 0.105), comberFace * 0.55);
    // swell shading: crests catch the sky, troughs sit in their own shadow
    body *= 0.88 + 0.24 * smoothstep(0.18, 0.82, vCrest);
    body += vec3(0.018, 0.055, 0.045) * smoothstep(0.62, 1.0, vCrest) * 0.7;

    vec3 H = normalize(V + uSunDir);
    float spec = pow(max(dot(vNormalW, H), 0.0), 900.0);
    // break the regular glitter rows with slow surface turbulence
    float specBreak = 0.35 + 0.65 * smoothstep(0.25, 0.75, texture2D(uFoam, vWorld.xz * 0.33 + vec2(uTime * 0.03, -uTime * 0.02)).r);
    body += vec3(1.15, 0.75, 0.40) * spec * 0.95 * specBreak;
    // sunset glitter path: a warm lane where the surface mirrors the low sun
    float sunGlint = pow(max(dot(reflect(-V, vNormalW), uSunDir), 0.0), 70.0);
    body += vec3(1.05, 0.65, 0.30) * sunGlint * 0.26 * specBreak;
    // a little diffuse sheen on the windward faces, no screen-wide glitter
    body += vec3(0.10, 0.10, 0.075) * smoothstep(0.55, 0.9, vCrest) * smoothstep(0.1, 0.7, depth) * 0.5;

    // the green comber: light transmitted through the thin, backlit crest
    float crestLift = smoothstep(0.58, 0.94, vCrest);
    float sunFacing = 0.35 + 0.65 * max(dot(V, uSunDir), 0.0);
    body += vec3(0.025, 0.10, 0.068) * crestLift * sunFacing * (0.5 + vShoal * 0.7);

    // whitewater: breaking at the ledge, churn at the notch, a lick along the tide line
    // whitewater: only where the water actually breaks or churns
    float foamTex = texture2D(uFoam, vWorld.xz * 0.48 + vec2(0.06 * sin(uTime * 0.4), -uTime * 0.50)).r;
    float foamTex2 = texture2D(uFoam, vWorld.xz * 1.2 + vec2(uTime * 0.12, -uTime * 1.05)).r;
    float fPattern = smoothstep(0.55, 0.86, foamTex * 0.7 + foamTex2 * 0.5);
    float breaking = smoothstep(0.09, 0.02, depth) * smoothstep(0.68, 0.9, vCrest);
    float notchD = length(vWorld.xz - vec2(0.33, 4.45));
    float churn = smoothstep(2.4, 0.3, notchD) * uSpill;
    float foam = fPattern * (breaking * 0.95 + churn * 1.05);
    foam += smoothstep(0.60, 0.85, fPattern) * uSpill * smoothstep(3.2, 1.0, notchD) * 0.55;
    foam += shore * fPattern * 0.8;
    foam += smoothstep(0.05, 0.005, depth) * smoothstep(0.30, 0.70, foamTex) * 0.25;
    // crisp last waterline against the shingle
    foam += smoothstep(0.042, 0.006, depth) * smoothstep(0.50, 0.80, foamTex2) * 0.45;
    // the last swash running up the shingle in a thin unbroken lace
    float swash = smoothstep(0.14, 0.0, depth) * (0.35 + 0.35 * sin(vWorld.x * 1.35 + 0.7 * sin(vWorld.z * 0.9) + uTime * 0.8));
    foam += swash * smoothstep(0.42, 0.72, foamTex2) * 0.5;
    // the green comber's own crest breaks into whitewater
    float comberCrest = smoothstep(0.18, 0.6, uComberAmp) * exp(-cxd * cxd * 1.8) * smoothstep(-0.2, 0.35, vWaveH);
    foam += comberCrest * (0.45 + 0.55 * smoothstep(0.30, 0.72, foamTex));
    foam = clamp(foam, 0.0, 1.0) * uFoamScale;
    vec3 foamCol = vec3(0.70, 0.66, 0.58) * (0.55 + 0.45 * diff) + vec3(0.30, 0.20, 0.10) * pow(max(dot(N, H), 0.0), 6.0);
    body = mix(body, foamCol, foam * 0.92);

    // the detached cloud's soft shade
    vec2 cd = (vWorld.xz - uCloudCenter) / uCloudRad;
    float cloud = 1.0 - uCloudStrength * smoothstep(1.0, 0.1, length(cd));
    body *= cloud;

    alpha = smoothstep(-0.015, 0.07, depth) * mix(0.93, 0.99, smoothstep(0.0, 0.35, depth));
    alpha = clamp(alpha, 0.0, 0.99);
    if (uDebug > 0.5) {
      vec3 dbg = body;
      if (uDebug < 1.5) dbg = sky;
      else if (uDebug < 2.5) dbg = vec3(sunGlint);
      else if (uDebug < 3.5) dbg = vec3(spec * 3.4);
      else if (uDebug < 4.5) dbg = vec3(steep);
      else if (uDebug < 5.5) dbg = vec3(foam);
      else if (uDebug < 6.5) dbg = shallow;
      else if (uDebug < 7.5) dbg = vec3(fres);
      else if (uDebug < 8.5) dbg = vec3(mix(0.0, 1.0, smoothstep(0.0, 1.6, depth)));
      else if (uDebug < 9.5) dbg = vec3(clamp(vBedDbg * 0.4 + 0.5, 0.0, 1.0));
      else if (uDebug < 10.5) dbg = vec3(clamp(depth * 0.25, 0.0, 1.0));
      else if (uDebug < 11.5) dbg = vec3(alpha);
      else if (uDebug < 12.5) dbg = body;
      else if (uDebug < 13.5) dbg = vec3(vWorld.z / 22.0, vWorld.x / 35.0 + 0.5, 0.0);
      else dbg = vec3(clamp(depth * 0.3, 0.0, 1.0), clamp(vBedDbg * 0.2 + 0.5, 0.0, 1.0), 0.0);
      body = dbg;
      if (uDebug > 12.5 && uDebug < 14.5) alpha = 1.0;
    }
    }
    gl_FragColor = vec4(body, alpha);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

/* ---------------- the notch tongue ---------------- */
const TONGUE_VERT = `
  uniform float uTime;
  uniform float uWaterY;
  uniform float uFill;
  uniform float uFront;
  attribute float aAlong;
  attribute float aAcross;
  attribute float aBed;
  varying vec3 vWorld;
  varying float vCover;
  varying float vAlong;
  varying float vAcross;
  varying float vDepth;

  void main() {
    float bed = aBed;
    float along = aAlong;
    float fl = uFront - along;
    float cover = smoothstep(-0.55, 0.30, fl);
    float thick = 0.11 + 0.17 * (1.0 - smoothstep(0.8, 6.0, along));
    float depth = uFill * cover * thick;
    depth += uFill * 0.12 * exp(-pow((along - uFront + 0.34) / 0.34, 2.0));
    depth += 0.010 * sin(position.x * 4.0 + uTime * 5.0) * cover;
    float y = bed + max(depth, 0.0);
    // the seaward end sinks into the open sea surface
    y = mix(y, uWaterY + 0.03, smoothstep(1.2, 0.15, along) * 0.55);
    vWorld = vec3(position.x, y, position.z);
    vCover = cover; vAlong = along; vAcross = aAcross; vDepth = depth;
    gl_Position = projectionMatrix * viewMatrix * vec4(position.x, y, position.z, 1.0);
  }
`;
const TONGUE_FRAG = `
  uniform float uTime;
  uniform float uFill;
  uniform float uFront;
  uniform sampler2D uFoam;
  uniform vec3 uSunDir;
  varying vec3 vWorld;
  varying float vCover;
  varying float vAlong;
  varying float vAcross;
  varying float vDepth;

  vec3 skyRefl(vec3 R) {
    float h = clamp(R.y, 0.0, 1.0);
    vec3 col = mix(vec3(0.46, 0.48, 0.46), vec3(0.12, 0.20, 0.32), smoothstep(0.0, 0.55, h));
    col = mix(col, vec3(0.82, 0.58, 0.36), pow(1.0 - h, 4.0) * 0.5);
    float sd = max(dot(R, uSunDir), 0.0);
    col += vec3(1.5, 0.95, 0.5) * pow(sd, 80.0) * 2.0;
    return col;
  }
  void main() {
    vec3 N = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
    if (N.y < 0.0) N = -N;
    vec3 V = normalize(cameraPosition - vWorld);
    vec3 R = reflect(-V, N);
    float fres = 0.03 + 0.85 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
    vec3 body = vec3(0.045, 0.105, 0.095);
    body += vec3(0.015, 0.035, 0.03) * smoothstep(0.0, 0.15, vDepth);
    body = mix(body, skyRefl(R), clamp(fres * 0.9, 0.0, 0.8));
    vec3 H = normalize(V + uSunDir);
    body += vec3(1.4, 0.95, 0.55) * pow(max(dot(N, H), 0.0), 180.0) * 2.0;
    float frontGlow = smoothstep(0.62, 0.04, abs(vAlong - uFront + 0.30));
    float n = texture2D(uFoam, vWorld.xz * 1.6 + vec2(uTime * 0.2, -uTime * 0.9)).r;
    float n2 = texture2D(uFoam, vWorld.xz * 0.55 + vec2(-uTime * 0.1, uTime * 0.15)).r;
    float foam = frontGlow * smoothstep(0.28, 0.65, n) * 0.85;
    foam += frontGlow * 0.45;
    foam += smoothstep(0.58, 0.86, n2 * 0.8 + n * 0.4) * 0.16;
    body = mix(body, vec3(0.86, 0.82, 0.72), clamp(foam, 0.0, 0.94));
    body = mix(body, vec3(0.085, 0.085, 0.062), smoothstep(0.18, 0.0, vDepth) * 0.30);
    // ripple streaking across the flowing sheet
    float sheet = smoothstep(0.35, 0.75, n2) * smoothstep(0.0, 0.6, vCover) * 0.18;
    body += vec3(0.06, 0.08, 0.07) * sheet;
    float edgeFade = smoothstep(1.0, 0.62, abs(vAcross) + 0.10 * (n2 - 0.5));
    float alpha = vCover * (0.68 + 0.28 * smoothstep(0.0, 0.12, vDepth)) * edgeFade;
    alpha *= smoothstep(0.0, 0.55, vAlong);
    alpha = clamp(alpha, 0.0, 0.95);
    gl_FragColor = vec4(body, alpha);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

function buildTongue() {
  const rows = 72, cols = 15;
  const zSea = 6.7, zLand = -0.5;
  const pos = [], along = [], across = [], bedArr = [], idx = [];
  for (let i = 0; i <= rows; i++) {
    const t = i / rows;
    const z = lerp(zSea, zLand, t);
    const cx = notchCenter(z);
    const widen = smoothstep(6.4, 2.2, z);
    const halfW = 0.60 + widen * 2.35 + smoothstep(1.4, -0.2, z) * 0.7;
    for (let j = 0; j <= cols; j++) {
      const a = j / cols * 2 - 1;
      const x = cx + a * halfW;
      pos.push(x, 0, z);
      along.push(zSea - z);
      across.push(a);
      bedArr.push(OBJ.surfaceAt ? OBJ.surfaceAt(x, z) : groundHeight(x, z));
    }
  }
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const a = i * (cols + 1) + j, b = a + 1, c = a + cols + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aAlong', new THREE.Float32BufferAttribute(along, 1));
  g.setAttribute('aAcross', new THREE.Float32BufferAttribute(across, 1));
  g.setAttribute('aBed', new THREE.Float32BufferAttribute(bedArr, 1));
  g.setIndex(idx);
  g.computeBoundingSphere();
  SEA.tu = {
    uTime: { value: 0 },
    uWaterY: { value: SITE.waterY },
    uFill: { value: 0 },
    uFront: { value: 0 },
    uFoam: { value: TEX.foam },
    uSunDir: { value: SITE.sunDir.clone() }
  };
  const mat = new THREE.ShaderMaterial({
    uniforms: SEA.tu,
    vertexShader: TONGUE_VERT,
    fragmentShader: TONGUE_FRAG,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    side: THREE.DoubleSide,
    fog: false
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.renderOrder = 5;
  mesh.frustumCulled = false;
  mesh.visible = false;
  SCENE.add(mesh);
  SEA.tongue = mesh;
}

}

function buildSpray() {

  const state = { max, next: 0, alive: 0, positions, sizes, alphas, vel, life, maxLife };
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  g.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));

    },
    vertexShader: `
      attribute float aSize;
      attribute float aAlpha;
      uniform float uPointScale;
      varying float vA;
      void main() {
        vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = max(1.0, aSize * uPointScale);
      }`,
    fragmentShader: `
      uniform sampler2D uMap;
      uniform vec3 uColor;

      void main() {
        vec4 t = texture2D(uMap, gl_PointCoord);
        if (t.a < 0.01) discard;
        gl_FragColor = vec4(uColor * t.rgb, t.a * vA);

    transparent: true,
    depthWrite: false,
