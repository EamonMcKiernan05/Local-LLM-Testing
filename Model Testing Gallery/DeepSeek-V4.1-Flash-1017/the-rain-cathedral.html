}

function updateChainAnimation(h) {
  for (let ci = 0; ci < ANIM.chains.length; ci++) {
    const grp = ANIM.chains[ci];
    const meta = grp.userData.chain;
    if (!meta) continue;
    const u = grp.userData.sway || (grp.userData.sway = { a: 0, v: 0 });
    const force = ANIM.gust * 0.55 * (ci === 0 ? 1 : 0.7);
    u.v += (-u.a * 14.0 - u.v * 3.2 + force) * h;
    u.a += u.v * h;
    u.a = clamp(u.a, -0.12, 0.12);
    grp.rotation.z = u.a;
    grp.rotation.x = Math.sin(STATE.simTime * 0.7 + ci) * 0.004;
  }
  // water beads running down the chains, with a gust-driven wave
  const beads = ANIM.chainBeads;
  if (!beads) return;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3();
  let idx = 0;
  for (let ci = 0; ci < ANIM.chains.length; ci++) {
    const grp = ANIM.chains[ci];
    const meta = grp.userData.chain;
    if (!meta) continue;
    const sway = grp.rotation.z;
    const n = 18;
    for (let i = 0; i < n; i++) {
      const phase = ((STATE.simTime * (ci === 0 ? 0.34 : 0.26) + i / n) % 1);
      const dist = phase * meta.length;
      const wx = meta.x + Math.sin(sway) * dist;
      const wy = meta.yTop - Math.cos(sway) * dist;
      const wz = meta.z;
      const wavePos = ANIM.gustWave;
      const wave = Math.exp(-Math.pow((phase - wavePos) * 9.0, 2)) * ANIM.gust;
      const sc = 0.8 + wave * 2.0;
      p.set(wx, wy, wz);
      q.setFromEuler(e.set(0, 0, 0));
      s.set(sc, sc, sc);
      m4.compose(p, q, s);
      beads.setMatrixAt(idx++, m4);
    }
  }
  beads.count = idx;
  beads.instanceMatrix.needsUpdate = true;
}

function gustAt(t) {
  const period = 22.0, start = 10.5, dur = 6.0;
  let local = (t - start) % period;
  if (local < 0) local += period;
  if (local > dur) return 0;
  const p = local / dur;
  return smoothstep(0, 0.14, p) * (1 - smoothstep(0.55, 1, p));
}

function updateWeather(dt) {
  const t = STATE.simTime;
  const g = gustAt(t);
  ANIM.gust = g;
  const windX = 0.18 + g * 2.9 + Math.sin(t * 0.13) * 0.12;
  const windZ = 0.05 + g * 0.28;
  RAIN.mat.uniforms.uTime.value = t;
  RAIN.mat.uniforms.uWind.value.set(windX, windZ);
  RAIN.mat.uniforms.uOpacity.value = 1.0 + g * 0.22;
  // ripple + splash clocks
  RAIN.rings.material.uniforms.uTime.value = t;
  RAIN.splashes.material.uniforms.uTime.value = t;
  RAIN.beams.material.uniforms.uTime.value = t;
  // stream texture scroll
  if (RAIN.streamTex) RAIN.streamTex.offset.y -= dt * 1.4;
  // gust timing drives the chain droplet wave
  const period = 22.0, start = 10.5, dur = 6.0;
  let local = (t - start) % period;
  if (local < 0) local += period;
  ANIM.gustWave = local < dur ? smoothstep(0.0, 0.45, local / dur) : 0;
  // the gust pushes a burst of fast real rain streaks sideways across the hall,
  // briefly veiling then clearing the distant clock
  if (RAIN.surge && RAIN.surgeMat) {
    const p = local / dur;
    const sweep = easeInOutCubic(clamp(p / 0.52, 0, 1));
    RAIN.surgeMat.uniforms.uTime.value = t;
    RAIN.surgeMat.uniforms.uWind.value.set(windX, windZ);
    RAIN.surgeMat.uniforms.uSurgeX.value = lerp(-10.0, 16.0, sweep);
    RAIN.surgeMat.uniforms.uOpacity.value = smoothstep(0.0, 0.05, p) * (1.0 - smoothstep(0.3, 0.46, p));
  }
}

/* ==========================================================================
   CAMERA, INPUT, UI, AUDIO AND THE MAIN LOOP
   ========================================================================== */
const CINE_LOOP = 96;
const CAM = { mode: 'cinematic', t: 0, transition: null, manual: null };
const DRAG = { active: false, id: null, lastX: 0, lastY: 0, startX: 0, startY: 0, moved: false };
const POINTERS = new Map();
let PINCH = null;
const _pA = new THREE.Vector3();
const _pB = new THREE.Vector3();
const _pC = new THREE.Vector3();
const _qA = new THREE.Quaternion();
const _qB = new THREE.Quaternion();
const _mTmp = new THREE.Matrix4();

function cinematicSample(u, pos, target) {
  const s = 0.5 - 0.5 * Math.cos(u * Math.PI * 2);
  const x = 1.28 * Math.sin(u * Math.PI * 4 + 0.35) * (0.3 + 0.7 * s) + 0.26 * Math.sin(u * Math.PI * 2 + 0.7);
  pos.set(x, 2.95 - 0.28 * s + 0.05 * Math.sin(u * Math.PI * 6 + 1.2), 42.4 - 39.5 * s);
  target.set(0.55 * Math.sin(u * Math.PI * 2 + 0.9), 6.35 - 0.75 * s, -56.0);
}
function applyCinematic(u) {
  cinematicSample(u, _pA, _pB);
  camera.position.copy(_pA);
  camera.lookAt(_pB);
  camera.fov = 55 - 5 * (0.5 - 0.5 * Math.cos(u * Math.PI * 2));
  camera.updateProjectionMatrix();
  CAM.t = u * CINE_LOOP;
}
function nearestCinematicPhase() {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < 240; i++) {
    const u = i / 240;
    cinematicSample(u, _pA, _pB);
    const d = camera.position.distanceToSquared(_pA);
    if (d < bestD) { bestD = d; best = u; }
  }
  return best;
}
function startTransition(phase) {
  cinematicSample(phase, _pA, _pB);
  _mTmp.lookAt(_pA, _pB, new THREE.Vector3(0, 1, 0));
  _qA.setFromRotationMatrix(_mTmp);
  CAM.transition = {
    t: 0, dur: 2.6,
    fromP: camera.position.clone(), fromQ: camera.quaternion.clone(),
    toP: _pA.clone(), toQ: _qA.clone(), phase,
  };
  CAM.mode = 'transition';
  updateModeButtons();
}
function enterManual() {
  if (CAM.mode === 'manual') return;
  CAM.transition = null;
  camera.getWorldDirection(_pC);
  const pivot = camera.position.clone().addScaledVector(_pC, 15);
  const off = camera.position.clone().sub(pivot);
  const radius = Math.max(7.5, off.length());
  const yaw = Math.atan2(off.x, off.z);
  const pitch = Math.asin(clamp(off.y / radius, -0.98, 0.98));
  CAM.manual = {
    pivot, radius, yaw, pitch,
    yawT: yaw, pitchT: pitch, radiusT: radius,
    yawVel: 0, pitchVel: 0, baseYaw: yaw, basePitch: pitch,
  };
  CAM.mode = 'manual';
  updateModeButtons();
}
function clampCameraPos(p) {
  p.y = clamp(p.y, 1.7, 14.5);
  p.x = clamp(p.x, -21.2, 21.2);
  p.z = clamp(p.z, -58.5, 44.6);
  if (Math.abs(p.x) > 12.4) p.y = Math.max(p.y, 1.85);
  return p;
}
function updateCamera(dt) {
  if (CAM.mode === 'cinematic') {
    CAM.t += dt;
    let u = (CAM.t / CINE_LOOP) % 1;
    if (u < 0) u += 1;
    cinematicSample(u, _pA, _pB);
    // a breath of handheld drift so the shot feels photographed, not tracked
    _pA.x += Math.sin(CAM.t * 0.73) * 0.014;
    _pA.y += Math.sin(CAM.t * 1.13 + 1.2) * 0.010;
    _pB.x += Math.sin(CAM.t * 0.51 + 2.0) * 0.02;
    _pB.y += Math.sin(CAM.t * 0.89 + 0.4) * 0.014;
    camera.position.copy(_pA);
    camera.lookAt(_pB);
    const fov = 55 - 5 * (0.5 - 0.5 * Math.cos(u * Math.PI * 2));
    if (Math.abs(camera.fov - fov) > 0.005) { camera.fov = fov; camera.updateProjectionMatrix(); }
  } else if (CAM.mode === 'transition') {
    const tr = CAM.transition;
    tr.t += dt;
    const e = easeInOutCubic(clamp(tr.t / tr.dur, 0, 1));
    camera.position.lerpVectors(tr.fromP, tr.toP, e);
    camera.quaternion.slerpQuaternions(tr.fromQ, tr.toQ, e);
    if (tr.t >= tr.dur) {
      CAM.mode = 'cinematic';
      CAM.t = tr.phase * CINE_LOOP;
      CAM.transition = null;
      updateModeButtons();
    }
  } else if (CAM.mode === 'manual') {
    const m = CAM.manual;
    if (!DRAG.active) {
      m.yawT += m.yawVel * dt;
      m.pitchT += m.pitchVel * dt;
      m.yawVel *= Math.exp(-3.6 * dt);
      m.pitchVel *= Math.exp(-3.6 * dt);
    }
    m.yawT = clamp(m.yawT, m.baseYaw - 1.25, m.baseYaw + 1.25);
    m.pitchT = clamp(m.pitchT, m.basePitch - 0.3, m.basePitch + 0.58);
    m.yaw = damp(m.yaw, m.yawT, 9, dt);
    m.pitch = damp(m.pitch, m.pitchT, 9, dt);
    m.radius = damp(m.radius, m.radiusT, 6.5, dt);
    const cp = Math.cos(m.pitch), sp = Math.sin(m.pitch);
    _pA.set(
      m.pivot.x + Math.sin(m.yaw) * cp * m.radius,
      m.pivot.y + sp * m.radius,
      m.pivot.z + Math.cos(m.yaw) * cp * m.radius,
    );
    clampCameraPos(_pA);
    camera.position.x = damp(camera.position.x, _pA.x, 22, dt);
    camera.position.y = damp(camera.position.y, _pA.y, 22, dt);
    camera.position.z = damp(camera.position.z, _pA.z, 22, dt);
    camera.lookAt(m.pivot.x, m.pivot.y + 0.2, m.pivot.z);
    if (Math.abs(camera.fov - 53) > 0.01) { camera.fov = damp(camera.fov, 53, 5, dt); camera.updateProjectionMatrix(); }
  }
  camera.updateMatrixWorld();
}

/* ---------------- pointer / wheel / pinch ---------------- */
function setupInteraction() {
  const canvas = DOM.canvas;
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    wakeUI();
    canvas.setPointerCapture(e.pointerId);
    POINTERS.set(e.pointerId, { x: e.clientX, y: e.clientY });
    DRAG.active = true;
    DRAG.id = e.pointerId;
    DRAG.lastX = e.clientX; DRAG.lastY = e.clientY;
    DRAG.startX = e.clientX; DRAG.startY = e.clientY;
    DRAG.moved = false;
    if (POINTERS.size === 2) {
      const pts = [...POINTERS.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const m = CAM.manual;
      PINCH = { d0: Math.max(24, d), r0: m ? m.radiusT : 15, id0: pts[0], id1: pts[1] };
      if (CAM.mode !== 'manual') enterManual();
      CAM.manual.radiusT = PINCH.r0;
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!POINTERS.has(e.pointerId)) return;
    POINTERS.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (POINTERS.size >= 2 && PINCH) {
      const pts = [...POINTERS.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (CAM.mode !== 'manual') enterManual();
      CAM.manual.radiusT = clamp(PINCH.r0 * (PINCH.d0 / Math.max(24, d)), 8, 27);
      DRAG.moved = true;
      return;
    }
    if (e.pointerId !== DRAG.id) return;
    const dx = e.clientX - DRAG.lastX;
    const dy = e.clientY - DRAG.lastY;
    DRAG.lastX = e.clientX; DRAG.lastY = e.clientY;
    if (!DRAG.moved && Math.hypot(e.clientX - DRAG.startX, e.clientY - DRAG.startY) < 3) return;
    DRAG.moved = true;
    if (CAM.mode !== 'manual') enterManual();
    const m = CAM.manual;
    m.yawT -= dx * 0.0042;
    m.pitchT -= dy * 0.0035;
    m.yawVel = -dx * 0.0042 * 2.6;
    m.pitchVel = -dy * 0.0035 * 2.6;
    wakeUI();
  });
  function endPointer(e) {
    if (!POINTERS.has(e.pointerId)) return;
    POINTERS.delete(e.pointerId);
    if (POINTERS.size < 2) PINCH = null;
    if (POINTERS.size === 1) {
      const p = [...POINTERS.values()][0];
      DRAG.id = [...POINTERS.keys()][0];
      DRAG.lastX = p.x; DRAG.lastY = p.y;
      DRAG.moved = true;
    } else if (POINTERS.size === 0) {
      DRAG.active = false;
      DRAG.id = null;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    wakeUI();
    if (CAM.mode !== 'manual') enterManual();
    const m = CAM.manual;
    if (!m) return;
    m.radiusT = clamp(m.radiusT * Math.exp(e.deltaY * 0.0011), 8, 27);
  }, { passive: false });
  window.addEventListener('blur', () => {
    POINTERS.clear(); DRAG.active = false; DRAG.id = null; PINCH = null;
  });
}

/* ---------------- UI wiring ---------------- */
function setButtonLabel(btn, text) {
  for (const node of btn.childNodes) {
    if (node.nodeType === 3) { node.nodeValue = text; return; }
  }
  btn.appendChild(document.createTextNode(text));
}
function updateModeButtons() {
  DOM.btnCinematic.setAttribute('aria-pressed', String(CAM.mode === 'cinematic' || CAM.mode === 'transition'));
}
function updatePauseButton() {
  DOM.btnPause.setAttribute('aria-pressed', String(STATE.paused));
  setButtonLabel(DOM.btnPause, STATE.paused ? 'Resume' : 'Pause');
}
function updateSoundButton() {
  const on = AUDIO.enabled && !AUDIO.muted;
  DOM.btnSound.setAttribute('aria-pressed', String(on));
  setButtonLabel(DOM.btnSound, on ? 'Mute' : 'Sound');
}
function setupUI() {
  DOM.btnCinematic.addEventListener('click', () => {
    wakeUI();
    if (CAM.mode === 'manual' || CAM.mode === 'transition') startTransition(nearestCinematicPhase());
    else applyCinematic((CAM.t / CINE_LOOP) % 1);
    updateModeButtons();
  });
  DOM.btnReset.addEventListener('click', () => {
    wakeUI();
    startTransition(0);
    CAM.t = 0;
  });
  DOM.btnPause.addEventListener('click', () => {
    wakeUI();
    STATE.paused = !STATE.paused;
    if (!STATE.paused) simAcc = 0;
    updatePauseButton();
  });
  DOM.btnSound.addEventListener('click', () => {
    wakeUI();
    toggleSound();
  });
  window.addEventListener('pointermove', wakeUI, { passive: true });
  window.addEventListener('pointerdown', wakeUI, { passive: true });
  window.addEventListener('wheel', wakeUI, { passive: true });
  window.addEventListener('keydown', wakeUI);
  document.addEventListener('focusin', wakeUI);
  DOM.controls.addEventListener('pointerenter', () => { pointerOverUI = true; wakeUI(); });
  DOM.controls.addEventListener('pointerleave', () => { pointerOverUI = false; wakeUI(); });
  if (QS.get('ui') === '0') DOM.ui.style.display = 'none';
  if (QS.get('idle') === '1') document.body.classList.add('idle');
  updateModeButtons();
  updatePauseButton();
  updateSoundButton();
}
let pointerOverUI = false;
let lastUIWake = performance.now();
function wakeUI() {
  lastUIWake = performance.now();
  if (document.body.classList.contains('idle')) document.body.classList.remove('idle');
}
function updateIdle(now) {
  if (now - lastUIWake > 4600 && !pointerOverUI) {
    if (!document.body.classList.contains('idle') && STATE.ready) document.body.classList.add('idle');
  }
}

/* ---------------- procedural audio ---------------- */
const AUDIO = {
  ctx: null, master: null, send: null, enabled: false, muted: false,
  nextDrip: 0, gustGain: null, ready: false,
};
function audioCreate() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  try { AUDIO.ctx = new AC(); } catch (err) { return false; }
  const ctx = AUDIO.ctx;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -20; comp.knee.value = 14; comp.ratio.value = 3.2;
  comp.attack.value = 0.004; comp.release.value = 0.3;
  const master = ctx.createGain();
  master.gain.value = 0.0001;
  master.connect(comp); comp.connect(ctx.destination);
  AUDIO.master = master;
  // long, dark hall impulse response
  const irLen = Math.floor(ctx.sampleRate * 3.8);
  const ir = ctx.createBuffer(2, irLen, ctx.sampleRate);
  const irRand = mulberry32(SEED ^ 0xa11);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < irLen; i++) {
      const t = i / irLen;
      const n = (irRand() * 2 - 1) * Math.pow(1 - t, 3.1);
      lp += (n - lp) * 0.23;
      d[i] = lp * (ch ? 0.94 : 1);
    }
  }
  const conv = ctx.createConvolver();
  conv.buffer = ir;
  const wet = ctx.createGain();
  wet.gain.value = 0.95;
  conv.connect(wet); wet.connect(master);
  const send = ctx.createGain();
  send.gain.value = 0.32;
  send.connect(conv);
  AUDIO.send = send;
  function noiseBuf(sec, seedNum, brown) {
    const n = Math.floor(ctx.sampleRate * sec);
    const b = ctx.createBuffer(2, n, ctx.sampleRate);
    const r = mulberry32(seedNum);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      let last = 0;
      for (let i = 0; i < n; i++) {
        const w = r() * 2 - 1;
        if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.0; }
        else d[i] = w;
      }
    }
    return b;
  }
  function layer(buffer, type, freq, q, gainVal, sendAmt) {
    const src = ctx.createBufferSource();
    src.buffer = buffer; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.value = gainVal;
    src.connect(f); f.connect(g); g.connect(master);
    const s = ctx.createGain(); s.gain.value = sendAmt; g.connect(s); s.connect(send);
    src.start();
    return g;
  }
  const white = noiseBuf(3.7, SEED ^ 0x11, false);
  layer(white, 'lowpass', 1650, 0.5, 0.15, 0.55);
  layer(white, 'bandpass', 4400, 0.8, 0.032, 0.6);
  layer(white, 'highpass', 7600, 0.7, 0.014, 0.5);
  const white2 = noiseBuf(4.3, SEED ^ 0x22, false);
  layer(white2, 'lowpass', 950, 0.6, 0.085, 0.65);
  const brown = noiseBuf(5.1, SEED ^ 0x33, true);
  layer(brown, 'lowpass', 100, 0.6, 0.19, 0.7);
  const pour = noiseBuf(2.9, SEED ^ 0x44, false);
  layer(pour, 'bandpass', 2500, 1.1, 0.026, 0.5);
  const gust = layer(noiseBuf(3.3, SEED ^ 0x55, false), 'bandpass', 750, 0.9, 0.0001, 0.7);
  AUDIO.gustGain = gust;
  const drone = ctx.createOscillator(); drone.type = 'sine'; drone.frequency.value = 53;
  const dg = ctx.createGain(); dg.gain.value = 0.013;
  drone.connect(dg); dg.connect(master);
  const ds = ctx.createGain(); ds.gain.value = 0.25; dg.connect(ds); ds.connect(send);
  drone.start();
  const drone2 = ctx.createOscillator(); drone2.type = 'sine'; drone2.frequency.value = 81.4;
  const dg2 = ctx.createGain(); dg2.gain.value = 0.005;
  drone2.connect(dg2); dg2.connect(master);
  drone2.start();
  AUDIO.nextDrip = ctx.currentTime + 0.6;
  AUDIO.ready = true;
  return true;
}
function scheduleDrip(t) {
  const ctx = AUDIO.ctx;
  if (!ctx) return;
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const out = ctx.createGain();
  out.gain.value = 0.7;
  if (pan) {
    pan.pan.value = (Math.random() * 1.7) - 0.85;
    out.connect(pan); pan.connect(AUDIO.master);
    const s = ctx.createGain(); s.gain.value = 0.45; pan.connect(s); s.connect(AUDIO.send);
  } else {
    out.connect(AUDIO.master);
  }
  const g = ctx.createGain();
  g.connect(out);
  const f = 620 + Math.random() * 1500;
  const amp = 0.018 + Math.random() * 0.035;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(amp, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22 + Math.random() * 0.62);
  const o = ctx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 0.6, t + 0.32);
  o.connect(g); o.start(t); o.stop(t + 1.1);
  const o2 = ctx.createOscillator();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(f * 2.63, t);
  const g2 = ctx.createGain(); g2.gain.value = 0.32;
  o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t + 0.7);
}
function toggleSound() {
  if (!AUDIO.enabled) {
    if (!AUDIO.ctx && !audioCreate()) { DOM.btnSound.disabled = true; return; }
    const ctx = AUDIO.ctx;
    if (ctx.state === 'suspended') ctx.resume();
    AUDIO.enabled = true;
    AUDIO.muted = false;
    AUDIO.master.gain.cancelScheduledValues(ctx.currentTime);
    AUDIO.master.gain.setTargetAtTime(0.5, ctx.currentTime, 0.7);
    AUDIO.nextDrip = ctx.currentTime + 0.6;
  } else {
    AUDIO.muted = !AUDIO.muted;
    const ctx = AUDIO.ctx;
    AUDIO.master.gain.setTargetAtTime(AUDIO.muted ? 0.0001 : 0.5, ctx.currentTime, 0.25);
    AUDIO.nextDrip = ctx.currentTime + 0.5;
  }
  updateSoundButton();
}
function audioUpdate(dt) {
  if (!AUDIO.ready || !AUDIO.enabled) return;
  const ctx = AUDIO.ctx;
  if (AUDIO.gustGain) AUDIO.gustGain.gain.setTargetAtTime(ANIM.gust * 0.05, ctx.currentTime, 0.18);
  if (!AUDIO.muted) {
    const now = ctx.currentTime;
    let guard = 0;
    while (AUDIO.nextDrip < now + 0.25 && guard++ < 6) {
      scheduleDrip(AUDIO.nextDrip);
      AUDIO.nextDrip += 0.35 + Math.random() * 2.1;
    }
  } else {
    AUDIO.nextDrip = ctx.currentTime + 0.5;
  }
}
document.addEventListener('visibilitychange', () => {
  if (!AUDIO.ctx) return;
  if (document.hidden) AUDIO.ctx.suspend();
  else if (AUDIO.enabled) AUDIO.ctx.resume();
});

/* ---------------- main loop ---------------- */
const LOOP_CLOCK = new THREE.Clock();
let simAcc = 0;
let fpsAcc = 0, fpsFrames = 0, avgFps = 60, qualitySteps = 0, lastQualityDrop = 0, lowFpsStreak = 0, runStart = 0;
function animate() {
  requestAnimationFrame(animate);
  if (!STATE.ready) return;
  const rawDt = LOOP_CLOCK.getDelta();
  const dt = Math.min(rawDt, 0.1);
  // fixed-step simulation for the rain field constraints
  if (!STATE.paused) {
    simAcc += dt;
    const h = 1 / 60;
    let steps = 0;
    while (simAcc >= h && steps < 6) {
      STATE.simTime += h;
      ANIM.gust = gustAt(STATE.simTime);
      simulateRain(h);
      updateChainAnimation(h);
      simAcc -= h;
      steps++;
    }
    if (steps >= 6) simAcc = 0;
  } else {
    simAcc = 0;
  }
  updateWeather(STATE.paused ? 0 : dt);
  updateCamera(dt);
  if (MAT.floor && MAT.floor.userData.shader) {
    MAT.floor.userData.shader.uniforms.uTime.value = STATE.simTime;
  }
  if (STATE.frame < 3) renderer.shadowMap.needsUpdate = true;
  updateReflection();
  finalPass.uniforms.uTime.value = STATE.simTime;
  if (DEBUG.nopost) renderer.render(scene, camera);
  else composer.render();
  audioUpdate(dt);
  updateIdle(performance.now());
  // gentle adaptive resolution: protect the frame rate before sacrificing detail counts
  fpsAcc += rawDt; fpsFrames++;
  if (fpsAcc > 1.6) {
    avgFps = fpsFrames / fpsAcc;
    STATE.fps = Math.round(avgFps);
    fpsAcc = 0; fpsFrames = 0;
    const now = performance.now();
    if (avgFps < 30) lowFpsStreak++; else lowFpsStreak = 0;
    if (!DEBUG.low && !DEBUG.noadapt && lowFpsStreak >= 3 && qualitySteps < 1 && now - lastQualityDrop > 5000 && now - runStart > 6000) {
      qualitySteps++;
      lastQualityDrop = now;
      lowFpsStreak = 0;
      qualityFactor *= 0.84;
      recomputeRenderScale();
      resizeRenderer();
    }
  }
  if (STATE.frame === 1) {
    DOM.veil.classList.add('gone');
    STATE.ready = true;
  }
  STATE.frame++;
}

function boot() {
  try {
    initRenderer();
    buildTextures();
    initSkyEnvironment();
    buildMaterials();
    initPost();
    buildWorld();
    setupInteraction();
    setupUI();
    resizeRenderer();
    window.addEventListener('resize', () => { recomputeRenderScale(); resizeRenderer(); });
    if (QS.has('ct')) CAM.t = parseFloat(QS.get('ct')) * CINE_LOOP;
    CAM.t = ((CAM.t % CINE_LOOP) + CINE_LOOP) % CINE_LOOP;
    applyCinematic(CAM.t / CINE_LOOP);
    updateWeather(0);
    updateChainAnimation(0.016);
    STATE.ready = true;
    window.__RC = {
      scene, camera, renderer, world, STATE, REFLECT, TEX, MAT, THREE, CAM, ANIM, RAIN, DEBUG, AUDIO,
      composer, bloomPass, finalPass,
      setSimTime(t) { STATE.simTime = t; updateWeather(0); },
      setCinemaTime(t) { CAM.t = t; applyCinematic(((t % CINE_LOOP) + CINE_LOOP) % CINE_LOOP / CINE_LOOP); },
      setScale(s) { RENDER_SCALE = s; resizeRenderer(); },    };
    lastUIWake = performance.now();
    runStart = performance.now();
    animate();
  } catch (err) {
    console.error('[rain-cathedral] fatal', err);
    DOM.fatal.classList.add('on');
  }
}
boot();
</script>
