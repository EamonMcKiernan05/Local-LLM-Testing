function buildFloor() {
  const geo = new THREE.PlaneGeometry(W.floorHalfX * 2, W.floorLength, 112, 240);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, 0, (W.rearZ + W.farZ) / 2);
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const dep = fbm2(x * 0.055 + 4.1, z * 0.055 + 9.7, 3);
    const fine = fbm2(x * 0.35 + 1.0, z * 0.35 + 5.0, 2);
    pos.setY(i, -0.075 * dep - 0.014 * fine);
    uv.setXY(i, (x + W.floorHalfX) / (W.floorHalfX * 2), (W.rearZ - z) / W.floorLength);
    uv.setXY(i, (x + W.floorHalfX) / (W.floorHalfX * 2) * 9.0, (W.rearZ - z) / 5.35);
  }
  geo.computeVertexNormals();
  const mat = createWetFloorMaterial();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'wetFloor';
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  mesh.renderOrder = 0;
  // reflection projection needs real world positions; the floor shader gets them
  REFLECT.floorMesh = mesh;
  world.add(mesh);
  MAT.floor = mat;
}

function platformTopGeometry(side) {
  const width = 10.2;
  const len = 108;
  const geo = new THREE.PlaneGeometry(width, len, 10, 96);
  geo.rotateX(-Math.PI / 2);
  geo.translate(side * (13.2 + width / 2), W.platformY + 0.002, -9);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    uv.setXY(i, (x - side * 13.2) / 5.3, (z + 63) / 5.3);
    pos.setY(i, W.platformY + 0.002 + (fbm2(x * 0.2, z * 0.2, 2) - 0.5) * 0.008);
  }
  geo.computeVertexNormals();
  return geo;
}

function buildPlatforms() {
  const masonryParts = [];
  const stoneParts = [];
  const darkParts = [];
  const lineParts = [];
  for (const side of [-1, 1]) {
    // solid brick mass under the platform
    addBox(masonryParts, 10.2, W.platformY, 108, side * 18.3, W.platformY / 2, -9, 2.4);
    // stone coping overhanging the track side
    addBox(stoneParts, 0.62, 0.11, 108, side * 13.02, W.platformY - 0.02, -9, 1.8);
    addBox(stoneParts, 0.2, 0.09, 108, side * 13.34, W.platformY + 0.015, -9, 1.8);
    // a faded white safety line on the platform surface
    addBox(lineParts, 0.075, 0.006, 106, side * 13.86, W.platformY + 0.012, -9, 1.0);
    // recessed panels along the platform face
    for (let i = 0; i < 18; i++) {
      const z = 39 - i * 5.9;
      addBox(darkParts, 0.035, 0.46, 3.8, side * 12.985, 0.3, z, 1.2);
      addBox(stoneParts, 0.07, 0.08, 4.1, side * 12.99, 0.6, z, 1.2);
    }
    // stone kerb caps at the ends
    addBox(stoneParts, 10.2, 0.14, 0.5, side * 18.3, W.platformY + 0.02, 44.8, 1.8);
    addBox(stoneParts, 10.2, 0.14, 0.5, side * 18.3, W.platformY + 0.02, -62.8, 1.8);
    // drainage grates set into the platform near the edge
    for (let i = 0; i < 24; i++) {
      const z = 38 - i * 4.3;
      const g = new THREE.PlaneGeometry(0.34, 0.52);
      g.rotateX(-Math.PI / 2);
      g.translate(side * 14.3, W.platformY + 0.013, z);
      darkParts.push(g);
    }
    const top = new THREE.Mesh(platformTopGeometry(side), MAT.platformTop);
    top.receiveShadow = true;
    top.castShadow = false;
    top.name = 'platformTop';
    (side < 0 ? world : world).add(top);
  }
  addMerged(masonryParts, MAT.brick, { name: 'platforms', tone: (x, y) => (0.62 + 0.38 * smoothstep(0, 0.85, y)) });
  addMerged(stoneParts, MAT.stone, { name: 'platformCoping' });
  addMerged(darkParts, MAT.steelDark, { name: 'platformVents' });
  addMerged(lineParts, std({ color: 0xb2ab9d, roughness: 0.88, metalness: 0.0 }), { name: 'platformLine', cast: false });
}

function buildTrackAndFloorDetails() {
  const rails = [], tops = [], fish = [], groove = [];
  for (const side of [-1, 1]) {
    for (const off of [10.02, 11.45]) {
      const x = side * off;
      addBox(rails, 0.078, 0.062, 104, x, 0.024, -8, 1.1);
      addBox(tops, 0.055, 0.006, 104, x, 0.057, -8, 1.0);
      // buried groove either side of the rail head
      const gl = new THREE.PlaneGeometry(0.34, 104);
      gl.rotateX(-Math.PI / 2);
      gl.translate(x, 0.007, -8);
      groove.push(gl);
      for (let i = 0; i < 8; i++) {
        addBox(fish, 0.16, 0.055, 0.42, x, 0.046, 37 - i * 12.4, 0.8);
        addBox(fish, 0.2, 0.012, 0.5, x, 0.004, 37 - i * 12.4, 0.8);
      }
    }
  }
  addMerged(rails, MAT.rail, { name: 'rails', cast: false, receive: true });
  addMerged(tops, MAT.railTop, { name: 'railHeads', cast: false });
  addMerged(fish, MAT.rust, { name: 'railJoints', cast: false });
  const grooveMat = new THREE.MeshBasicMaterial({
    color: 0x141312, transparent: true, opacity: 0.62, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  });
  addMerged(groove, grooveMat, { name: 'railGrooves', cast: false, receive: false });

  // expansion joints across the concourse
  const joints = [], jointDark = [];
  for (let i = 0; i < 13; i++) {
    const z = archZ(i);
    const g = new THREE.PlaneGeometry(48, 0.2);
    g.rotateX(-Math.PI / 2);
    g.translate(0, 0.008, z);
    joints.push(g);
    for (let k = 0; k < 12; k++) {
      const w = 0.5 + rand() * 2.4;
      const gg = new THREE.PlaneGeometry(w, 0.05 + rand() * 0.04);
      gg.rotateX(-Math.PI / 2);
      gg.rotateY(rand() * 0.5 - 0.25);
      gg.translate((rand() - 0.5) * 46, 0.006, z + (rand() - 0.5) * 0.2);
      jointDark.push(gg);
    }
  }
  addMerged(joints, new THREE.MeshBasicMaterial({
    color: 0x141412, transparent: true, opacity: 0.72, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  }), { name: 'expansionJoints', cast: false, receive: false });
  addMerged(jointDark, new THREE.MeshBasicMaterial({
    color: 0x24221c, transparent: true, opacity: 0.5, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  }), { name: 'jointDebris', cast: false, receive: false });

  // a few long cracks in the terrazzo
  const cracks = [];
  for (let i = 0; i < 7; i++) {
    let x = (rand() - 0.5) * 36;
    let z = W.rearZ - 8 - rand() * 95;
    for (let s = 0; s < 9; s++) {
      const nx = x + (rand() - 0.5) * 2.4;
      const nz = z - 0.8 - rand() * 2.6;
      const g = new THREE.PlaneGeometry(Math.hypot(nx - x, nz - z), 0.011 + rand() * 0.01);
      g.rotateX(-Math.PI / 2);
      g.rotateY(-Math.atan2(nz - z, nx - x));
      g.translate((x + nx) / 2, 0.005, (z + nz) / 2);
      cracks.push(g);
      x = nx; z = nz;
    }
  }
  addMerged(cracks, new THREE.MeshBasicMaterial({
    color: 0x1b1916, transparent: true, opacity: 0.34, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  }), { name: 'floorCracks', cast: false, receive: false });

  // central cast-iron drainage channel
  const chanGl = new THREE.PlaneGeometry(0.42, 106);
  chanGl.rotateX(-Math.PI / 2);
  chanGl.translate(0, 0.004, -9);
  addMerged([chanGl], new THREE.MeshBasicMaterial({ color: 0x121615, transparent: true, opacity: 0.18, depthWrite: false }), { name: 'channel', cast: false, receive: false });
  const grateGl = new THREE.PlaneGeometry(0.38, 106);
  grateGl.rotateX(-Math.PI / 2);
  const guv = grateGl.attributes.uv;
  for (let i = 0; i < guv.count; i++) guv.setXY(i, guv.getX(i) * 1.0, guv.getY(i) * (106 / 1.35));
  grateGl.translate(0, 0.011, -9);
  const grateMesh = new THREE.Mesh(grateGl, MAT.grate);
  grateMesh.receiveShadow = true;
  grateMesh.castShadow = false;
  grateMesh.name = 'centralGrate';
  grateMesh.layers.set(2);
  world.add(grateMesh);
  // grounded contact shadows where platforms and walls meet the floor
  const baseShadows = [];
  for (const side of [-1, 1]) {
    const g1 = new THREE.PlaneGeometry(1.9, 106);
    g1.rotateX(-Math.PI / 2);
    g1.translate(side * 12.75, 0.013, -9);
    baseShadows.push(g1);
    const g2 = new THREE.PlaneGeometry(1.7, 110);
    g2.rotateX(-Math.PI / 2);
    g2.translate(side * 23.1, 0.013, -10);
    baseShadows.push(g2);
  }
  const baseShadowMesh = new THREE.Mesh(mergeGeometries(baseShadows, false), MAT.contact);
  baseShadowMesh.layers.set(2);
  baseShadowMesh.receiveShadow = false;
  world.add(baseShadowMesh);
}

/* ==========================================================================
   IRONWORK: ARCHES, PURLINS, ROOF BAYS, LANTERN
   ========================================================================== */
const PHI0 = Math.atan2(W.springY - W.archCY, W.springX);
const PHI1 = Math.PI - PHI0;
const OPEN_BAYS = [
  { b: 1, x0: -12.6, x1: 12.2 },
  { b: 3, x0: -10.2, x1: 13.0 },
  { b: 5, x0: -14.0, x1: 5.2 },
  { b: 7, x0: -8.4, x1: 12.6 },
  { b: 9, x0: -12.2, x1: 9.4 },
];
const SKY_BANDS = [3, 9]; // bands between purlin lines that are glazed on intact bays
const ROOF_EDGES = [-W.springX, -22.6, -18.1, -13.6, -9.1, -4.6, -2.6, 2.6, 4.6, 9.1, 13.6, 18.1, 22.6, W.springX];

function thetaForX(x) {
  return Math.atan2(ARCH_Y(x) - W.archCY, x) + Math.PI / 2;
}
function arcPoint(phi, rOff = 0, z = 0) {
  const R = W.archR + rOff;
  return new THREE.Vector3(R * Math.cos(phi), W.archCY + R * Math.sin(phi), z);
}

function buildArches() {
  const N = 26;
  const steelLocal = [];
  const rivetLocal = [];
  const top = [], bot = [];
  for (let j = 0; j <= N; j++) {
    const phi = PHI0 + (PHI1 - PHI0) * (j / N);
    top.push(arcPoint(phi, 0, 0));
    bot.push(arcPoint(phi, -0.95, 0));
  }
  for (let j = 0; j < N; j++) {
    const a = top[j], b = top[j + 1];
    strut(steelLocal, a.x, a.y, a.z, b.x, b.y, b.z, 0.27, 0.64, 1.4);
    const c = bot[j], d = bot[j + 1];
    strut(steelLocal, c.x, c.y, c.z, d.x, d.y, d.z, 0.22, 0.52, 1.4);
    if (j % 2 === 0) strut(steelLocal, a.x, a.y, a.z, d.x, d.y, d.z, 0.11, 0.16, 1.2);
    else strut(steelLocal, c.x, c.y, c.z, b.x, b.y, b.z, 0.11, 0.16, 1.2);
  }
  for (let j = 1; j < N; j++) {
    const a = top[j], c = bot[j];
    strut(steelLocal, a.x, a.y, a.z, c.x, c.y, c.z, 0.17, 0.2, 1.2);
  }
  for (let j = 0; j <= N; j++) {
    for (const zz of [-0.37, 0.37]) {
      rivetLocal.push([top[j].x, top[j].y, zz]);
      if (j % 2 === 0) rivetLocal.push([bot[j].x, bot[j].y, zz * 0.78]);
    }
  }
  const geo = mergeList(steelLocal, 'archRib');
  applyTone(geo, (x, y) => 0.72 + 0.28 * smoothstep(20.5, 12.0, y));
  const mesh = new THREE.InstancedMesh(geo, MAT.steel, W.archCount);
  const m4 = new THREE.Matrix4();
  for (let i = 0; i < W.archCount; i++) {
    m4.makeTranslation(0, 0, archZ(i));
    mesh.setMatrixAt(i, m4);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = 'latticeArches';
  world.add(mesh);

  // rivets
  const rivets = [];
  for (let i = 0; i < W.archCount; i++) {
    const z0 = archZ(i);
    for (const r of rivetLocal) rivets.push({ p: [r[0], r[1], z0 + r[2]], s: 1 });
  }
  const rg = new THREE.SphereGeometry(0.052, 6, 4);
  addInstanced(rg, MAT.steel, rivets, { name: 'rivets', cast: false, receive: false });

  // spring shoes and stone bearing blocks
  const shoes = [], bearings = [], bracing = [];
  for (let i = 0; i < W.archCount; i++) {
    const zc = archZ(i);
    for (const side of [-1, 1]) {
      addBox(shoes, 1.9, 0.52, 1.05, side * 23.85, 11.86, zc, 1.4);
      addBox(shoes, 1.2, 0.28, 0.7, side * 23.3, 11.98, zc, 1.2);
      addBox(bearings, 2.2, 0.72, 1.3, side * 24.05, 11.35, zc, 2.0);
      addBox(bearings, 2.6, 0.2, 1.5, side * 24.05, 11.7, zc, 2.0);
    }
  }
  // roof-plane bracing between adjacent arches
  const braceNodes = [4, 8, 13, 18, 22];
  for (let b = 0; b < W.archCount - 1; b++) {
    const z0 = archZ(b), z1 = archZ(b + 1);
    for (let k = 0; k < braceNodes.length; k++) {
      const j = braceNodes[k];
      const phiA = PHI0 + (PHI1 - PHI0) * (j / 26);
      const phiB = PHI0 + (PHI1 - PHI0) * ((j + (k % 2 === 0 ? 1 : -1)) / 26);
      const a = arcPoint(phiA, 0.1, z0);
      const c = arcPoint(phiB, 0.1, z1);
      strut(bracing, a.x, a.y, a.z, c.x, c.y, c.z, 0.055, 0.055, 1.0);
    }
  }
  addMerged(shoes, MAT.steelDark, { name: 'archShoes' });
  addMerged(bearings, MAT.stone, { name: 'archBearings' });
  addMerged(bracing, MAT.steelDark, { name: 'roofBracing', cast: false });
}

function buildPurlins() {
  const parts = [];
  for (const x of ROOF_EDGES) {
    if (Math.abs(x) < 2.7) continue;
    const y = ARCH_Y(x) - 0.78;
    const len = 112.4;
    addBox(parts, 0.34, 0.08, len, x, y + 0.2, -10, 1.5);
    addBox(parts, 0.34, 0.08, len, x, y - 0.2, -10, 1.5);
    addBox(parts, 0.1, 0.38, len, x, y, -10, 1.5);
  }
  // lantern curb beams
  for (const x of [-2.62, 2.62]) {
    addBox(parts, 0.3, 0.24, 112.4, x, ARCH_Y(x) + 0.05, -10, 1.4);
  }
  addMerged(parts, MAT.steelDark, {
    name: 'purlins',
    tone: (x, y) => 0.62 + 0.38 * smoothstep(23.5, 12.0, y),
  });
}

function roofBandGeo(x0, x1, z0, z1, radius = W.archR, centerY = W.archCY, tile = 2.2) {
  const y0 = (centerY + Math.sqrt(Math.max(1, radius * radius - x0 * x0)));
  const y1 = (centerY + Math.sqrt(Math.max(1, radius * radius - x1 * x1)));
  const phiA = Math.atan2(y0 - centerY, x0), phiB = Math.atan2(y1 - centerY, x1);
  const thA = phiA + Math.PI / 2, thB = phiB + Math.PI / 2;
  const start = Math.min(thA, thB);
  const len = Math.abs(thB - thA);
  const height = Math.abs(z0 - z1);
  const g = new THREE.CylinderGeometry(radius, radius, height, Math.max(2, Math.ceil(len * radius / 1.6)), 1, true, start, len);
  g.rotateX(Math.PI / 2);
  g.translate(0, centerY, (z0 + z1) / 2);
  const uv = g.attributes.uv;
  const arcLen = len * radius;
  for (let i = 0; i < uv.count; i++) {
    uv.setXY(i, uv.getY(i) * (height / tile), uv.getX(i) * (arcLen / tile));
  }
  return g;
}

function shatteredEdgeParts(xEdge, z0, z1, slateParts, shardParts, rustParts) {
  const yEdge = ARCH_Y(xEdge);
  const count = Math.max(2, Math.round(Math.abs(z1 - z0) / 2.6));
  for (let i = 0; i < count; i++) {
    const z = lerp(Math.min(z0, z1) + 0.4, Math.max(z0, z1) - 0.4, (i + 0.5) / count);
    const w = 0.2 + rand() * 0.45;
    const h = 0.16 + rand() * 0.55;
    const g = new THREE.PlaneGeometry(w, h);
    g.rotateY(Math.PI / 2);
    g.rotateX((rand() - 0.5) * 0.7 + 0.2);
    g.rotateY((rand() - 0.5) * 0.6);
    g.translate(xEdge + (rand() - 0.5) * 0.22, yEdge - h * 0.35, z);
    shardParts.push(g);
    if (i % 3 === 0) {
      const len = 0.25 + rand() * 0.7;
      strut(rustParts, xEdge, yEdge - 0.15, z + (rand() - 0.5) * 0.6,
        xEdge + (rand() - 0.5) * 0.25, yEdge - 0.15 - len, z + (rand() - 0.5) * 0.6, 0.02, 0.02, 1.0);
    }
  }
}

function buildRoof() {
  const slate = [], glass = [], shards = [], rustBits = [];
  const openMap = new Map(OPEN_BAYS.map(o => [o.b, o]));
  for (let b = 0; b < W.archCount - 1; b++) {
    const z0 = archZ(b), z1 = archZ(b + 1);
    const open = openMap.get(b);
    for (let k = 0; k < ROOF_EDGES.length - 1; k++) {
      const xa = ROOF_EDGES[k], xb = ROOF_EDGES[k + 1];
      if (xr_overlap_apex(xa, xb)) continue;
      if (open) {
        if (xb > open.x0 && xa < open.x1) continue;
        slate.push(roofBandGeo(xa, xb, z0 - 0.02, z1 + 0.02));
      } else {
        if (SKY_BANDS.includes(k) && (b === 4 || b === 8)) {
          glass.push(roofBandGeo(xa, xb, z0 - 0.02, z1 + 0.02));
        } else {
          slate.push(roofBandGeo(xa, xb, z0 - 0.02, z1 + 0.02));
        }
      }
    }
    if (open) {
      if (open.x0 > -W.springX + 1.2) shatteredEdgeParts(open.x0, z0, z1, slate, shards, rustBits);
      if (open.x1 < W.springX - 1.2) shatteredEdgeParts(open.x1, z0, z1, slate, shards, rustBits);
      // a few surviving slates cling to the break edge
      for (let i = 0; i < 2; i++) {
        const x = open.x0 + rand() * 2.2;
        const z = lerp(z0 + 0.8, z1 - 0.8, rand());
        const g = new THREE.PlaneGeometry(0.7 + rand() * 0.8, 1.1 + rand() * 1.4);
        g.rotateX(-Math.PI / 2);
        g.rotateZ((rand() - 0.5) * 0.9);
        g.translate(x, ARCH_Y(x) + 0.05, z);
        shards.push(g);
      }
    }
  }
  addMerged(slate, MAT.roofSheet, {
    name: 'roofSlate',
    tone: (x, y) => 0.82 + 0.18 * smoothstep(21.0, 13.0, y),
  });
  const glassMesh = addMerged(glass, MAT.glass, { name: 'roofGlazing', cast: false, receive: false });
  if (glassMesh) glassMesh.renderOrder = 2;
  addMerged(shards, MAT.roofSheet, { name: 'brokenSlate', cast: true, receive: true });
  addMerged(rustBits, MAT.rust, { name: 'brokenTies', cast: false });
}

function xr_overlap_apex(xa, xb) {
  // leave a longitudinal opening at the ridge for the lantern
  return xa < 2.6 && xb > -2.6;
}

function buildLantern() {
  const frame = [], glass = [], cap = [], shards = [];
  const sides = [-1, 1];
  const openBays = new Set(OPEN_BAYS.map(o => o.b));
  for (let b = 0; b < W.archCount - 1; b++) {
    const z0 = archZ(b), z1 = archZ(b + 1);
    const mid = (z0 + z1) / 2;
    const open = openBays.has(b);
    // base curb and top plate
    for (const s of sides) {
      addBox(frame, 0.2, 0.16, 9.0, s * 2.62, ARCH_Y(2.62) + 0.02, mid, 1.2);
      addBox(frame, 0.16, 0.1, 9.0, s * 2.6, 21.86, mid, 1.2);
      addBox(frame, 1.9 + rand() * 0.6, 0.12, 0.12, s * 1.3, 22.2, mid, 1.0);
      // mullions and rails
      for (let m = 0; m <= 6; m++) {
        const z = z0 - m * 1.5;
        if (open && chance(0.42)) continue;
        addBox(frame, 0.09, 1.6, 0.09, s * 2.6, 21.02, z, 1.0);
        if (!open ? chance(0.93) : chance(0.24)) {
          const g = new THREE.PlaneGeometry(1.32, 1.28);
          const uv = g.attributes.uv;
          for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 1.3, uv.getY(i) * 1.3);
          g.rotateY(Math.PI / 2);
          g.translate(s * 2.59, 21.0, z - 0.75);
          glass.push(g);
        }
      }
      addBox(frame, 0.08, 0.08, 9.0, s * 2.6, 20.35, mid, 1.0);
      addBox(frame, 0.08, 0.08, 9.0, s * 2.6, 21.85, mid, 1.0);
      // diagonal braces at bay ends
      if (chance(0.7)) {
        strut(frame, s * 2.6, 20.35, z0 - 0.1, s * 2.6, 21.85, z0 - 1.8, 0.045, 0.045, 1.0);
        strut(frame, s * 2.6, 21.85, z0 - 0.1, s * 2.6, 20.35, z0 - 1.8, 0.045, 0.045, 1.0);
      }
    }
    // curved cap
    const capSegs = open ? 3 : 5;
    for (let cs = 0; cs < capSegs; cs++) {
      if (open && chance(0.5)) continue;
      const za = z0 - (9 / capSegs) * cs, zb = z0 - (9 / capSegs) * (cs + 1);
      cap.push(roofBandGeo(-2.6, 2.6, za, zb, 3.11, 20.19, 1.6));
    }
    if (open) {
      for (let i = 0; i < 3; i++) {
        const g = new THREE.PlaneGeometry(0.3 + rand() * 0.6, 0.24 + rand() * 0.6);
        g.rotateY(rand() * Math.PI);
        g.rotateX((rand() - 0.5) * 0.9);
        g.translate((rand() - 0.5) * 3.2, 22.1 - rand() * 0.6, z0 - rand() * 8);
        shards.push(g);
      }
    }
  }
  // continuous ridge ribs and louvre plates tie the monitor roofs together
  for (const rx of [-1.4, 0, 1.4]) {
    const ry = 20.19 + Math.sqrt(Math.max(0, 3.11 * 3.11 - rx * rx));
    addBox(frame, 0.1, 0.1, 112.0, rx, ry + 0.02, -10, 1.0);
  }
  addMerged(frame, MAT.steelDark, {
    name: 'lanternFrame',
    tone: (x, y) => 0.5 + 0.5 * smoothstep(23.5, 12.0, y),
  });
  const gm = addMerged(glass, MAT.glass, { name: 'lanternGlass', cast: false, receive: false });
  if (gm) gm.renderOrder = 2;
  addMerged(cap, MAT.capMetal, {
    name: 'lanternCap',
    tone: () => 0.78,
  });
  addMerged(shards, MAT.roofSheet, { name: 'lanternShards', cast: false });
}

/* ==========================================================================
   MASONRY: SIDE WALLS, GABLE ENDS, MAINTENANCE ROOM
   ========================================================================== */
function archShape(halfW, straightH) {
  const s = new THREE.Shape();
  s.moveTo(-halfW, 0);
  s.lineTo(halfW, 0);
  s.lineTo(halfW, straightH);
  s.absarc(0, straightH, halfW, 0, Math.PI, false);
  s.lineTo(-halfW, 0);
  return s;
}
function shapeGeoUV(shape, tile = 2.4) {
  const g = new THREE.ShapeGeometry(shape, 18);
  const pos = g.attributes.position;
  const uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    uv.setXY(i, pos.getX(i) / tile, pos.getY(i) / tile);
  }
  return g;
}
function gableShape(holes) {
  const s = new THREE.Shape();
  s.moveTo(-W.springX, 0);
  s.lineTo(W.springX, 0);
  s.lineTo(W.springX, W.springY);
  s.absarc(0, W.archCY, W.archR, Math.atan2(W.springY - W.archCY, W.springX), Math.atan2(W.springY - W.archCY, -W.springX), false);
  s.lineTo(-W.springX, 0);
  if (holes) for (const h of holes) s.holes.push(h);
  return s;
}
function circleHole(cx, cy, r) {
  const p = new THREE.Path();
  p.absarc(cx, cy, r, 0, Math.PI * 2, true);
  return p;
}
function semicircleHole(cx, cy, r) {
  const p = new THREE.Path();
  p.moveTo(cx - r, cy);
  p.absarc(cx, cy, r, Math.PI, 0, true);
  p.lineTo(cx + r, cy);
  p.lineTo(cx - r, cy);
  return p;
}
function archHole(cx, y0, halfW, straightH) {
  const p = new THREE.Path();
  p.moveTo(cx - halfW, y0);
  p.lineTo(cx + halfW, y0);
  p.lineTo(cx + halfW, y0 + straightH);
  p.absarc(cx, y0 + straightH, halfW, 0, Math.PI, true);
  p.lineTo(cx - halfW, y0);
  return p;
}

function buildSideWalls() {
  const masonry = [], stone = [], dark = [], boards = [], trim = [], plaques = [];
  const posters = [[], [], []];
  const streaks = [[], []];
  const recessGeos = [];
  for (const side of [-1, 1]) {
    const wx = side * W.sideX;
    // main slab, plinth, cornice
    addBox(masonry, 1.1, 11.4, 112, side * (W.sideX + 0.55), 6.0, -10, 1.8);
    addBox(stone, 1.35, 0.62, 112, side * (W.sideX - 0.1), 0.31, -10, 1.8);
    addBox(stone, 1.0, 0.14, 112, side * (W.sideX - 0.15), 0.72, -10, 1.6);
    addBox(masonry, 1.2, 0.85, 112, side * (W.sideX + 0.05), 11.75, -10, 1.8);
    addBox(stone, 1.0, 0.22, 112, side * (W.sideX - 0.32), 11.3, -10, 1.6);
    // piers at every arch line
    for (let i = 0; i < W.archCount + 1; i++) {
      const z = i < W.archCount ? archZ(i) : W.farZ + 0.8;
      addBox(masonry, 1.25, 11.5, 1.55, side * (W.sideX - 0.62), 5.75, z, 1.8);
      addBox(masonry, 1.55, 0.9, 2.0, side * (W.sideX - 0.82), 10.6, z, 1.8);
      addBox(stone, 0.65, 0.18, 2.1, side * (W.sideX - 1.08), 11.12, z, 1.6);
      addBox(stone, 0.8, 0.5, 1.8, side * (W.sideX - 0.7), 0.25, z, 1.6);
    }
    for (let b = 0; b < W.archCount - 1; b++) {
      const zc = (archZ(b) + archZ(b + 1)) / 2;
      // dark arched recess applied to the wall face
      const shape = archShape(3.25, 3.85);
      const g = shapeGeoUV(shape, 2.4);
      g.rotateY(side > 0 ? -Math.PI / 2 : Math.PI / 2);
      g.translate(side * (W.sideX - 0.065), 0.55, zc);
      recessGeos.push(g);
      // boarded-up infill within the lower half of the recess
      const bw = 4.6, bh = 2.55;
      const bg = new THREE.PlaneGeometry(bw, bh);
      scaleUV(bg, bw / 1.1, bh / 1.1);
      bg.rotateY(side > 0 ? -Math.PI / 2 : Math.PI / 2);
      bg.translate(side * (W.sideX - 0.1), 0.62 + bh / 2, zc);
      boards.push(bg);
      for (let p = 0; p < 5; p++) {
        const pb = boxGeo(bw * 0.96, 0.12, 0.05, 1.0);
        pb.rotateY(side > 0 ? -Math.PI / 2 : Math.PI / 2);
        pb.translate(side * (W.sideX - 0.125), 0.75 + p * 0.5 + rand() * 0.05, zc + (rand() - 0.5) * 0.1);
        boards.push(pb);
      }
      // stone voussoir trim around the arch head
      const yBase = 0.55 + 3.85;
      const r = 3.25;
      for (let v = 0; v < 10; v++) {
        const a0 = Math.PI * (v / 10), a1 = Math.PI * ((v + 1) / 10);
        const z0 = zc + Math.cos(a0) * r, z1 = zc + Math.cos(a1) * r;
        const y0 = yBase + Math.sin(a0) * r, y1 = yBase + Math.sin(a1) * r;
        strut(stone, side * (W.sideX - 0.09), y0, z0, side * (W.sideX - 0.09), y1, z1, 0.34, 0.34, 1.4);
      }
      strut(stone, side * (W.sideX - 0.06), yBase + r - 0.28, zc - 0.3, side * (W.sideX - 0.06), yBase + r - 0.28, zc + 0.3, 0.42, 0.42, 1.4);
      // upper wall vents / grilles
      if (b % 2 === 0) {
        addBox(dark, 0.14, 0.5, 0.9, side * (W.sideX - 0.1), 9.85, zc, 1.0);
        for (let l = 0; l < 4; l++) addBox(trim, 0.06, 0.04, 0.92, side * (W.sideX - 0.19), 9.68 + l * 0.12, zc, 1.0);
      }
      // posters and water streaks
      if (chance(0.62)) {
        const pg = new THREE.PlaneGeometry(1.15 + rand() * 0.4, 1.7 + rand() * 0.5);
        pg.rotateY(side > 0 ? -Math.PI / 2 : Math.PI / 2);
        pg.rotateZ((rand() - 0.5) * 0.05);
        pg.translate(side * (W.sideX - 0.14), 2.3 + rand() * 1.4, zc + (rand() - 0.5) * 4.2);
        posters[(b * 3 + (side > 0 ? 1 : 0)) % 3].push(pg);
      }
      if (chance(0.7)) {
        const sg = new THREE.PlaneGeometry(1.2 + rand() * 1.6, 2.2 + rand() * 2.4);
        sg.rotateY(side > 0 ? -Math.PI / 2 : Math.PI / 2);
        sg.translate(side * (W.sideX - 0.12), 3.4 + rand() * 3.0, zc + (rand() - 0.5) * 5.0);
        streaks[chance(0.55) ? 0 : 1].push(sg);
      }
      // wall base stain
      const bs = new THREE.PlaneGeometry(3.2 + rand() * 2.0, 1.25);
      bs.rotateY(side > 0 ? -Math.PI / 2 : Math.PI / 2);
      bs.translate(side * (W.sideX - 0.08), 0.72, zc + (rand() - 0.5) * 3);
      streaks[1].push(bs);
    }
  }
  addMerged(masonry, MAT.masonry, { name: 'sideWalls', tone: wallTone });
  addMerged(stone, MAT.stone, { name: 'wallStone' });
  addMerged(dark, MAT.steelDark, { name: 'wallVents', cast: false });
  addMerged(trim, MAT.steelDark, { name: 'ventLouvers', cast: false });
  addMerged(boards, MAT.woodDark, { name: 'wallBoarding' });
  const recess = addMerged(recessGeos, MAT.masonryDark, { name: 'wallRecesses', tone: wallTone });
  if (recess) recess.receiveShadow = true;
  addMerged(posters[0], MAT.poster0, { name: 'posters0', cast: false });
  addMerged(posters[1], MAT.poster1, { name: 'posters1', cast: false });
  addMerged(posters[2], MAT.poster2, { name: 'posters2', cast: false });
  addMerged(streaks[0], MAT.streakA, { name: 'wallStreaksA', cast: false, receive: false });
  addMerged(streaks[1], MAT.streakB, { name: 'wallStreaksB', cast: false, receive: false });
}

function makeWallLettering(text) {
  const W2 = 2048, H2 = 512;
  const c = makeCanvas(W2, H2), ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ 0x88e1);
  ctx.clearRect(0, 0, W2, H2);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 176px Georgia, "Times New Roman", serif';
  ctx.fillStyle = 'rgba(26,26,22,0.62)';
  letterSpaced(ctx, text, W2 / 2, H2 / 2, 20);
  // paint has weathered away in patches
  ctx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 500; i++) {
    ctx.fillStyle = `rgba(0,0,0,${0.2 + local() * 0.75})`;
    ctx.beginPath();
    ctx.ellipse(local() * W2, H2 * 0.1 + local() * H2 * 0.85, 2 + local() * 26, 1 + local() * 13, local() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  for (let i = 0; i < 26; i++) {
    const x = local() * W2;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(x, 0, 2 + local() * 10, H2);
  }
  ctx.globalCompositeOperation = 'source-over';
  return canvasTexture(c, { srgb: true, clamp: true, aniso: MAX_ANISO });
}

function addBoardedArch(list, trimList, cx, y0, halfW, h, zFace, facingZ, opts = {}) {
  // dark recess
  const shape = archShape(halfW, h);
  const g = shapeGeoUV(shape, 2.4);
  if (facingZ < 0) g.rotateY(Math.PI);
  g.translate(cx, y0, zFace);
  list.push(g);
  // boarding
  const bw = halfW * 1.9, bh = h * 0.72;
  const bg = new THREE.PlaneGeometry(bw, bh);
  scaleUV(bg, bw / 1.05, bh / 1.05);
  if (facingZ < 0) bg.rotateY(Math.PI);
  bg.translate(cx, y0 + 0.1 + bh / 2, zFace + facingZ * 0.05);
  opts.boards && opts.boards.push(bg);
  for (let p = 0; p < 8; p++) {
    const pb = boxGeo(bw * 0.97, 0.13, 0.05, 1.0);
    if (facingZ < 0) pb.rotateY(Math.PI);
    pb.translate(cx + (rand() - 0.5) * 0.15, y0 + 0.28 + p * (bh / 8), zFace + facingZ * 0.08);
    opts.battens && opts.battens.push(pb);
  }
  // voussoirs
  const yBase = y0 + h;
  for (let v = 0; v < 9; v++) {
    const a0 = Math.PI * (v / 9), a1 = Math.PI * ((v + 1) / 9);
    const x0 = cx + Math.cos(a0) * halfW, x1 = cx + Math.cos(a1) * halfW;
    const ya = yBase + Math.sin(a0) * halfW, yb = yBase + Math.sin(a1) * halfW;
    strut(trimList, x0, ya, zFace + facingZ * 0.1, x1, yb, zFace + facingZ * 0.1, 0.3, 0.3, 1.4);
  }
  // keystone
  strut(trimList, cx - 0.24, yBase + halfW - 0.3, zFace + facingZ * 0.12, cx + 0.24, yBase + halfW - 0.3, zFace + facingZ * 0.12, 0.42, 0.42, 1.4);
}

function makeWarmSpill() {
  const S = 256;
  const c = makeCanvas(S, S), ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ 0x99a);
  const g = ctx.createRadialGradient(S / 2, S * 0.3, 4, S / 2, S * 0.5, S / 2);
  g.addColorStop(0, 'rgba(255,186,110,0.55)');
  g.addColorStop(0.4, 'rgba(255,170,90,0.22)');
  g.addColorStop(1, 'rgba(255,160,80,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = `rgba(255,190,120,${0.02 + local() * 0.05})`;
    ctx.beginPath(); ctx.arc(local() * S, local() * S, 4 + local() * 40, 0, Math.PI * 2); ctx.fill();
  }
  return canvasTexture(c, { srgb: true, clamp: true, aniso: 4 });
}

   SKY ENVIRONMENT
   ========================================================================== */
function initSkyEnvironment() {
  scene.background = null;
  if ('backgroundIntensity' in scene) scene.backgroundIntensity = 1.12;
  try {
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    envRT = pmrem.fromEquirectangular(TEX.sky);
    scene.environment = envRT.texture;
    pmrem.dispose();
  } catch (err) {
    console.warn('[rain-cathedral] environment generation failed', err);
  }
}
function buildSkyDome() {
  const geo = new THREE.SphereGeometry(380, 48, 26);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uSky: { value: TEX.sky } },
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform sampler2D uSky;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        float u = atan(d.z, d.x) / 6.28318530718 + 0.5;
        float v = asin(clamp(d.y, -1.0, 1.0)) / 3.14159265359 + 0.5;
        vec3 c = texture2D(uSky, vec2(fract(u), clamp(v, 0.0, 1.0))).rgb;
        c = mix(c, c * vec3(0.86, 0.92, 1.0), 0.55);
        c *= 0.93;
        gl_FragColor = vec4(c, 1.0);
      }
    `,
    side: THREE.BackSide,
    depthWrite: false,
    depthTest: true,
    fog: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, 4, -10);
  mesh.frustumCulled = false;
  mesh.renderOrder = 900;
  mesh.name = 'skyDome';
  scene.add(mesh);
}

/* ==========================================================================
   WET TERRAZZO — cheap lit floor + hand-written puddle reflection
   ========================================================================== */
function createWetFloorMaterial() {
  const mat = new THREE.MeshPhongMaterial({
    map: TEX.terrazzo, normalMap: TEX.terrazzoNormal,
    normalScale: new THREE.Vector2(0.75, 0.75),
    color: 0xb4ada0, specular: 0x0e0e0d, shininess: 34,
  });
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uReflection = { value: REFLECT.rt ? REFLECT.rt.texture : null };
    shader.uniforms.uTextureMatrix = { value: REFLECT.textureMatrix };
    shader.uniforms.uWetMap = { value: TEX.floorWet };
    shader.uniforms.uWaterNormal = { value: TEX.waterNormal };
    shader.uniforms.uTime = { value: 0 };
    shader.uniforms.uReflectOn = { value: DEBUG.noreflect ? 0 : 1 };
    mat.userData.shader = shader;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        uniform mat4 uTextureMatrix;
        varying vec3 vWPos;
        varying vec4 vReflUv;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec4 rcW = modelMatrix * vec4(transformed, 1.0);
        vWPos = rcW.xyz;
        vReflUv = uTextureMatrix * rcW;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform sampler2D uReflection;
        uniform sampler2D uWetMap;
        uniform sampler2D uWaterNormal;
        uniform float uTime;
        uniform float uReflectOn;
        varying vec3 vWPos;
        varying vec4 vReflUv;
        ${GLSL_NOISE}`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        vec2 wetUv = clamp(vec2((vWPos.x + 24.0) / 48.0, (46.0 - vWPos.z) / 112.0), 0.0, 1.0);
        vec4 wetSample = texture2D(uWetMap, wetUv);
        float microWet = vnoise(vWPos.xz * 1.35) * 0.5 + vnoise(vWPos.xz * 4.1 + 9.0) * 0.3 + vnoise(vWPos.xz * 11.0 + 2.0) * 0.2;
        float wet = clamp(smoothstep(0.16, 0.7, wetSample.r) + (microWet - 0.5) * 0.3, 0.0, 1.0);
        float puddle = smoothstep(0.3, 0.78, wetSample.r * 0.8 + microWet * 0.2);
        float dirt = wetSample.g;
        diffuseColor.rgb *= mix(1.0, 0.42, wet * 0.9);
        diffuseColor.rgb *= mix(1.0, 0.78, dirt * 0.7);
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(0.76, 0.82, 0.79), wet * 0.85);
        vec3 wnA = texture2D(uWaterNormal, vWPos.xz * 0.16 + vec2(uTime * 0.006, uTime * 0.0045)).xyz * 2.0 - 1.0;
        vec3 wnB = texture2D(uWaterNormal, vWPos.xz * 0.31 - vec2(uTime * 0.0085, uTime * 0.006)).xyz * 2.0 - 1.0;
        vec3 waterN = normalize(vec3((wnA.x + wnB.x) * 0.55 * wet, 1.0, (wnA.y + wnB.y) * 0.55 * wet));`)
      .replace('#include <opaque_fragment>', `
        vec3 rcRefl = vec3(0.0);
        if (uReflectOn > 0.5) {
          vec4 ruv = vReflUv;
          ruv.xy += (waterN.xz * 0.6 + vec2(wnA.y, wnB.x) * 0.22) * ruv.w * 0.055 * (0.35 + wet);
          rcRefl = texture2DProj(uReflection, ruv).rgb;
          rcRefl *= vec3(0.76, 0.81, 0.79) * (0.88 + 0.12 * microWet);
        }
        float ndv = clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0);
        float fres = pow(1.0 - ndv, 3.2);
        float refAmt = uReflectOn * (puddle * 0.92 + wet * 0.06) * mix(0.12, 0.96, fres);
        refAmt = clamp(refAmt, 0.0, 0.93);
        outgoingLight = mix(outgoingLight, rcRefl, refAmt);
        outgoingLight += rcRefl * wet * 0.035;
        outgoingLight += vec3(0.014, 0.016, 0.015) * wet * (1.0 - puddle);
        #include <opaque_fragment>`);
  };
  mat.customProgramCacheKey = () => 'wet-terrazzo-phong-v2';
  return mat;
}

function buildStationClock() {
  const g = new THREE.Group();
  g.position.set(0, 8.65, W.clockZ);
  g.rotation.x = 0.1;
  g.name = 'stationClock';
  const steel = [], dark = [];
  // hanger rods from the arch above
  const rodLen = 11.2;
  for (const x of [-0.78, 0.78]) {
    const rod = new THREE.CylinderGeometry(0.026, 0.026, rodLen, 6);
    rod.translate(x, 1.1 + rodLen / 2, -0.03);
    steel.push(rod);
  }
  addBox(steel, 2.1, 0.12, 0.12, 0, 12.28, -0.03, 1.0);
  addBox(steel, 0.3, 1.0, 0.14, 0, 11.7, -0.02, 1.0);
  // swinging bracket / top finial
  const finial = new THREE.SphereGeometry(0.13, 10, 8);
  finial.translate(0, 12.4, 0);
  steel.push(finial);
  // case back
  const back = new THREE.CylinderGeometry(1.16, 1.16, 0.2, 36);
  back.rotateX(Math.PI / 2);
  back.translate(0, 0, -0.1);
  dark.push(back);
  // bezel
  const bezel = new THREE.TorusGeometry(1.13, 0.1, 8, 44);
  bezel.translate(0, 0, 0.03);
  steel.push(bezel);
  const innerBezel = new THREE.TorusGeometry(1.02, 0.035, 6, 40);
  innerBezel.translate(0, 0, 0.07);
  steel.push(innerBezel);
  // face
  const face = new THREE.Mesh(new THREE.CircleGeometry(1.03, 48), MAT.clockFace);
  face.position.z = 0.035;
  face.receiveShadow = true;
  g.add(face);
  // hands stopped at 4.37
  const handMat = std({ color: 0x1b1a17, roughness: 0.6, metalness: 0.35 });
  const hourAngle = -((4 + 37 / 60) / 12) * Math.PI * 2 + Math.PI / 2;
  const minuteAngle = -(37 / 60) * Math.PI * 2 + Math.PI / 2;
  function makeHand(angle, length, width) {
    const handGroup = new THREE.Group();
    const hg = new THREE.BoxGeometry(width, length, 0.025);
    hg.translate(0, length / 2 - 0.06, 0);
    const hm = new THREE.Mesh(hg, handMat);
    hm.castShadow = false;
    handGroup.add(hm);
    const spade = new THREE.Mesh(new THREE.CircleGeometry(width * 1.9, 10), handMat);
    spade.position.set(0, length * 0.62, 0.014);
    handGroup.add(spade);
    handGroup.rotation.z = angle;
    handGroup.position.z = 0.08;
    return handGroup;
  }
  g.add(makeHand(minuteAngle, 0.82, 0.05));
  g.add(makeHand(hourAngle, 0.58, 0.075));
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.05, 12), MAT.brass);
  hub.rotation.x = Math.PI / 2;
  hub.position.z = 0.1;
  g.add(hub);
  const glass = new THREE.Mesh(new THREE.CircleGeometry(1.07, 48), MAT.clockGlass);
  glass.position.z = 0.115;
  glass.layers.set(2);
  g.add(glass);
  const steelMesh = new THREE.Mesh(mergeGeometries(steel, false), MAT.steelDark);
  steelMesh.castShadow = true;
  g.add(steelMesh);
  const darkMesh = new THREE.Mesh(mergeGeometries(dark, false), MAT.steelDark);
  darkMesh.castShadow = true;
  g.add(darkMesh);
  world.add(g);
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

function buildLuggageTrolley() {
  const g = new THREE.Group();
  const px = -13.9, pz = 6.5, y = W.platformY;
  g.position.set(px, y, pz);
  g.rotation.y = 0.34;
  const wood = [], steel = [], leather = [], brass = [];
  addBox(wood, 2.2, 0.09, 1.12, 0, 0.52, 0, 1.1);
  for (let i = 0; i < 7; i++) addBox(wood, 2.16, 0.02, 0.13, 0, 0.575, -0.45 + i * 0.15, 1.0);
  // frame
  addBox(steel, 2.3, 0.06, 0.06, 0, 0.46, 0.56, 1.0);
  addBox(steel, 2.3, 0.06, 0.06, 0, 0.46, -0.56, 1.0);
  addBox(steel, 0.07, 0.6, 0.07, -1.08, 0.32, 0.56, 1.0);
  addBox(steel, 0.07, 0.6, 0.07, 1.08, 0.32, 0.56, 1.0);
  addBox(steel, 0.07, 0.6, 0.07, -1.08, 0.32, -0.56, 1.0);
  addBox(steel, 0.07, 0.6, 0.07, 1.08, 0.32, -0.56, 1.0);
  // wheels
  for (const wx of [-0.82, 0.82]) for (const wz of [-0.56, 0.56]) {
    const wheel = new THREE.CylinderGeometry(0.17, 0.17, 0.12, 12);
    wheel.rotateX(Math.PI / 2);
    wheel.translate(wx, 0.17, wz);
    steel.push(wheel);
    const hub = new THREE.CylinderGeometry(0.05, 0.05, 0.15, 8);
    hub.rotateX(Math.PI / 2);
    hub.translate(wx, 0.17, wz);
    brass.push(hub);
  }
  // push handles
  for (const s of [-1, 1]) {
    const handle = new THREE.CylinderGeometry(0.035, 0.035, 1.25, 6);
    handle.rotateZ(Math.PI / 2);
    handle.rotateY(0.0);
    handle.translate(0, 1.05, s * 0.56);
    steel.push(handle);
    for (const hx of [-0.9, 0.9]) {
      const post = new THREE.CylinderGeometry(0.03, 0.03, 0.55, 6);
      post.translate(hx, 0.78, s * 0.56);
      steel.push(post);
    }
  }
  // two old cases and a trunk
  const caseA = boxGeo(0.92, 0.3, 0.52, 1.0);
  caseA.rotateY(0.12);
  caseA.translate(-0.38, 0.75, 0.02);
  leather.push(caseA);
  const caseB = boxGeo(0.7, 0.26, 0.46, 1.0);
  caseB.rotateY(-0.35);
  caseB.translate(0.32, 0.72, -0.05);
  leather.push(caseB);
  const trunk = boxGeo(1.1, 0.44, 0.62, 1.0);
  trunk.rotateY(0.06);
  trunk.translate(0.0, 0.34, 0.0);
  leather.push(trunk);
  for (const bx of [-0.36, 0.36]) {
    addBox(brass, 0.08, 0.06, 0.56, bx, 0.98, 0.02, 0.6);
    addBox(brass, 0.06, 0.3, 0.04, bx, 0.82, 0.29, 0.6);
  }
  // a rope coil over the handle
  for (let i = 0; i < 5; i++) {
    const torus = new THREE.TorusGeometry(0.13 + i * 0.008, 0.018, 4, 10);
    torus.rotateY(Math.PI / 2);
    torus.translate(0.92, 1.18, 0.3 + i * 0.02);
    const rope = new THREE.Mesh(torus, std({ color: 0x8a7a5c, roughness: 0.95 }));
    g.add(rope);
  }
  const woodMesh = new THREE.Mesh(mergeGeometries(wood, false), MAT.wood);
  const steelMesh = new THREE.Mesh(mergeGeometries(steel, false), MAT.steel);
  const leatherMesh = new THREE.Mesh(mergeGeometries(leather, false), std({ color: 0x5b4632, roughness: 0.72, metalness: 0.05, envMapIntensity: 0.6 }));
  const brassMesh = new THREE.Mesh(mergeGeometries(brass, false), MAT.brass);
  for (const m of [woodMesh, steelMesh, leatherMesh, brassMesh]) { m.castShadow = true; m.receiveShadow = true; g.add(m); }
  world.add(g);

function makeChain(x, yTop, z, length, links) {
  const grp = new THREE.Group();
  grp.position.set(x, yTop, z);
  const linkGeo = new THREE.TorusGeometry(0.075, 0.018, 5, 10);
  const inst = new THREE.InstancedMesh(linkGeo, MAT.steelDark, links);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3(1, 1, 1);
  for (let i = 0; i < links; i++) {
    const t = i / links;
    e.set(0, (i % 2) * Math.PI / 2, 0);
    q.setFromEuler(e);
    p.set(0, -t * length, Math.sin(t * 9.0) * 0.02);
    m4.compose(p, q, s);
    inst.setMatrixAt(i, m4);
  }
  inst.instanceMatrix.needsUpdate = true;
  inst.castShadow = false;
  grp.add(inst);
  // hopper / hook at the top
  const hopper = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.11, 0.36, 8, 1, true), MAT.steelDark);
  hopper.position.y = 0.05;
  grp.add(hopper);
  const hook = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.02, 5, 10), MAT.steelDark);
  hook.rotation.x = Math.PI / 2;
  hook.position.y = -0.12;
  grp.add(hook);
  grp.userData.chain = { length, links, x, yTop, z };
  world.add(grp);
  return grp;
}

function buildWeeds() {
  const p1 = new THREE.PlaneGeometry(0.62, 0.62);

  function addWeed(x, z, y, scale) {
    items.push({
      p: [x, y - 0.02, z], r: [0, rand() * Math.PI * 2, 0],
      s: [scale * (0.8 + rand() * 0.5), scale * (0.8 + rand() * 0.7), scale],
      c: pick(colours),

  for (let i = 0; i < 13; i++) {
    const z = archZ(i);

      const x = (rand() - 0.5) * 44;
      if (Math.abs(x) < 1.2) continue;

    }
  }
  for (let k = 0; k < 150; k++) {
    const side = chance(0.5) ? 1 : -1;

    const z = (rand() - 0.5) * 100;

  for (let k = 0; k < 130; k++) {
    const side = chance(0.5) ? 1 : -1;

    const z = (rand() - 0.5) * 100;

  buildDebris();
}

/* ==========================================================================
   RAIN, RUNOFF, RIPPLES, SPLASH, GUST
   ========================================================================== */
const RAIN = {
  lines: null,
  mat: null,
  columns: [],
  streaks: 0,
  rings: null,
  ringData: null,
  splashes: null,
  splashData: null,
  surge: null,
  surgeMat: null,
  beams: null,
  streams: [],
  streamTex: null,
  gusts: 0,
  gustWave: 0,
  spillPatches: null,
};
const SIM = { ringAcc: 0, splashAcc: 0, chainAcc: 0, beadPhase: 0 };

function makeStreamTexture() {
  const c = makeCanvas(64, 256);
  const ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ 0x77aa);
  ctx.clearRect(0, 0, 64, 256);
  for (let i = 0; i < 26; i++) {
    const x = local() * 64;
    const w = 1 + local() * 6;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.5, `rgba(255,255,255,${0.22 + local() * 0.5})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, -20, w, 300);
  }
  for (let i = 0; i < 45; i++) {
    ctx.fillStyle = `rgba(255,255,255,${0.15 + local() * 0.4})`;
    ctx.fillRect(local() * 64, local() * 256, 1, 8 + local() * 30);
  }
  const t = canvasTexture(c, { clamp: false, aniso: 2 });
  t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, 3);
  return t;
}

function rainColumns() {
  const cols = [];
  const totalArea = OPEN_BAYS.reduce((a, b) => a + (b.x1 - b.x0), 0);
  const STREAKS = DEBUG.low ? 2600 : 4200;
  for (const ob of OPEN_BAYS) {
    const z0 = archZ(ob.b), z1 = archZ(ob.b + 1);
    const x0 = Math.max(-23.4, ob.x0), x1 = Math.min(23.4, ob.x1);
    const area = x1 - x0;
    cols.push({
      cx: (x0 + x1) / 2, cz: (z0 + z1) / 2,
      hx: area / 2, hz: 3.75, top: 20.1,
      count: Math.round(STREAKS * (area / totalArea)),
    });
  }
  // narrow leaks through cracked glazing in otherwise intact bays
  const leaks = [
    { cx: 2.5, cz: 2.0, hx: 0.1, hz: 0.5, top: 22.3, count: 42 },
    { cx: -2.5, cz: -23.2, hx: 0.1, hz: 0.5, top: 22.3, count: 42 },
    { cx: -11.2, cz: -17.3, hx: 0.55, hz: 0.3, top: 19.9, count: 46 },
    { cx: 11.2, cz: 31.0, hx: 0.55, hz: 0.3, top: 19.9, count: 46 },
    { cx: -11.2, cz: -40.6, hx: 0.55, hz: 0.3, top: 19.9, count: 40 },
    { cx: 11.2, cz: -49.0, hx: 0.55, hz: 0.3, top: 19.9, count: 34 },
  ];
  for (const l of leaks) cols.push(l);
  return cols;
}

function buildRain() {
  const cols = rainColumns();
  RAIN.columns = cols;
  let count = 0;
  for (const c of cols) count += c.count;
  RAIN.streaks = count;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 2 * 3);
  const randA = new Float32Array(count * 2 * 3);
  const shaftA = new Float32Array(count * 2 * 4);
  const paramA = new Float32Array(count * 2 * 3);
  const endA = new Float32Array(count * 2);
  let vi = 0;
  const lr = mulberry32(SEED ^ 0x5eed);
  for (const c of cols) {
    for (let i = 0; i < c.count; i++) {
      const r1 = lr(), r2 = lr(), r3 = lr(), r4 = lr();
      const speed = 13 + lr() * 5.5;
      const len = 0.28 + lr() * 0.5;
      const alpha = 0.2 + lr() * 0.32;
      for (let e = 0; e < 2; e++) {
        const o3 = vi * 3, o4 = vi * 4;
        randA[o3] = r1; randA[o3 + 1] = r2; randA[o3 + 2] = r3;
        shaftA[o4] = c.cx; shaftA[o4 + 1] = c.cz; shaftA[o4 + 2] = c.hx; shaftA[o4 + 3] = c.hz;
        paramA[o3] = speed; paramA[o3 + 1] = len; paramA[o3 + 2] = alpha;
        endA[vi] = e;
        vi++;
      }
    }
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aRand', new THREE.BufferAttribute(randA, 3));
  geo.setAttribute('aShaft', new THREE.BufferAttribute(shaftA, 4));
  geo.setAttribute('aParams', new THREE.BufferAttribute(paramA, 3));
  geo.setAttribute('aEnd', new THREE.BufferAttribute(endA, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 10, 0), 160);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uWind: { value: new THREE.Vector2(0.18, 0.04) },
      uOpacity: { value: 1.0 },
    },
    vertexShader: /* glsl */`
      attribute vec3 aRand;
      attribute vec4 aShaft;
      attribute vec3 aParams;
      attribute float aEnd;
      uniform float uTime;
      uniform vec2 uWind;
      varying float vAlpha;
      varying float vDepth;
      varying vec2 vUvR;
      void main(){
        float top = 20.1;
        float speed = aParams.x;
        float phase = fract(aRand.z + uTime * speed / top);
        float y = top - phase * top;
        float drift = (1.0 - y / top);
        float x = aShaft.x + (aRand.x * 2.0 - 1.0) * aShaft.z + uWind.x * drift * 2.6;
        float z = aShaft.y + (aRand.y * 2.0 - 1.0) * aShaft.w + uWind.y * drift * 2.6;
        vec3 head = vec3(x, y, z);
        vec3 dir = normalize(vec3(uWind.x * 0.62, -1.0, uWind.y * 0.62));
        vec3 p = head - dir * aParams.y * aEnd;
        float lifeFade = smoothstep(0.0, 0.07, phase) * (1.0 - smoothstep(0.9, 1.0, phase));
        float nearFade = smoothstep(0.0, 1.6, y);
        vAlpha = aParams.z * lifeFade * nearFade;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vDepth = -mv.z;
        vUvR = vec2(aRand.x, aRand.y);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uOpacity;
      varying float vAlpha;
      varying float vDepth;
      varying vec2 vUvR;
      void main(){
        float d = clamp(vDepth / 58.0, 0.0, 1.0);
        float a = vAlpha * uOpacity * (1.0 - d * 0.82);
        a *= smoothstep(2.5, 10.0, vDepth) * 0.65 + 0.35;
        vec3 col = mix(vec3(0.62, 0.69, 0.7), vec3(0.78, 0.8, 0.78), vUvR.x);
        gl_FragColor = vec4(col, a * 0.16);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending,
    fog: false,
  });
  RAIN.mat = mat;
  const lines = new THREE.LineSegments(geo, mat);
  lines.frustumCulled = false;
  lines.renderOrder = 5;
  world.add(lines);
  RAIN.lines = lines;
  buildRipplesAndSplashes();
  buildGustSurge();
  buildVolumetrics();
  buildStreams();
}

/* ---------------- expanding floor rings + splash droplets ---------------- */
function buildRipplesAndSplashes() {
  const MAXR = DEBUG.low ? 150 : 260;
  const base = new THREE.PlaneGeometry(1, 1);
  base.rotateX(-Math.PI / 2);
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = base.index;
  geo.setAttribute('position', base.attributes.position);
  geo.setAttribute('uv', base.attributes.uv);
  geo.instanceCount = MAXR;
  const offsets = new Float32Array(MAXR * 3);
  const starts = new Float32Array(MAXR);
  const strengths = new Float32Array(MAXR);
  for (let i = 0; i < MAXR; i++) { starts[i] = -99; strengths[i] = 0; offsets[i * 3 + 1] = 0.02; }
  const aOffset = new THREE.InstancedBufferAttribute(offsets, 3);
  const aStart = new THREE.InstancedBufferAttribute(starts, 1);
  const aStrength = new THREE.InstancedBufferAttribute(strengths, 1);
  aOffset.setUsage(THREE.DynamicDrawUsage);
  aStart.setUsage(THREE.DynamicDrawUsage);
  aStrength.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aOffset', aOffset);
  geo.setAttribute('aStart', aStart);
  geo.setAttribute('aStrength', aStrength);
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 1, -10), 120);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: /* glsl */`
      attribute vec3 aOffset;
      attribute float aStart;
      attribute float aStrength;
      uniform float uTime;
      varying vec2 vUv;
      varying float vFade;
      varying float vStrength;
      void main(){
        float life = 1.35;
        float age = uTime - aStart;
        float t = clamp(age / life, 0.0, 1.0);
        float radius = 0.1 + t * 0.72;
        vec3 p = aOffset + vec3(position.x, 0.0, position.z) * radius;
        vUv = uv;
        vFade = (1.0 - t) * (1.0 - t);
        vStrength = aStrength * step(0.0, age);
        gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec2 vUv;
      varying float vFade;
      varying float vStrength;
      void main(){
        float d = length(vUv - 0.5) * 2.0;
        float ring = smoothstep(0.60, 0.82, d) * (1.0 - smoothstep(0.84, 0.99, d));
        float core = (1.0 - smoothstep(0.0, 0.22, d)) * 0.55;
        float a = (ring * 0.9 + core * 0.45) * vFade * vStrength;
        gl_FragColor = vec4(vec3(0.78, 0.85, 0.84), a * 0.22);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 4;
  world.add(mesh);
  RAIN.rings = mesh;
  RAIN.ringData = { offsets, starts, strengths, next: 0, max: MAXR, attrs: { aOffset, aStart, aStrength } };

  // splash droplets
  const MAXS = DEBUG.low ? 140 : 240;
  const sgeo = new THREE.BufferGeometry();
  const sp = new Float32Array(MAXS * 3);
  const sStart = new Float32Array(MAXS);
  const sVel = new Float32Array(MAXS * 3);
  const sSize = new Float32Array(MAXS);
  for (let i = 0; i < MAXS; i++) { sStart[i] = -99; sSize[i] = 0; }
  sgeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  sgeo.setAttribute('aStart', new THREE.BufferAttribute(sStart, 1));
  sgeo.setAttribute('aVel', new THREE.BufferAttribute(sVel, 3));
  sgeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1));
  sgeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 1, -10), 120);
  const smat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSprite: { value: TEX.sprite } },
    vertexShader: /* glsl */`
      attribute float aStart;
      attribute vec3 aVel;
      attribute float aSize;
      uniform float uTime;
      varying float vFade;
      void main(){
        float age = uTime - aStart;
        float life = 0.82;
        float t = clamp(age / life, 0.0, 1.0);
        vec3 p = position + aVel * age + vec3(0.0, -4.9 * age * age, 0.0);
        vFade = (1.0 - t) * (1.0 - t) * step(0.0, age) * step(age, life);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = clamp(aSize * (34.0 / max(0.4, -mv.z)) * (1.0 - t * 0.6), 0.0, 22.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uSprite;
      varying float vFade;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float d = 1.0 - smoothstep(0.05, 0.5, length(c));
        gl_FragColor = vec4(vec3(0.86, 0.92, 0.92), d * vFade * 0.7);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending,
  });
  const pts = new THREE.Points(sgeo, smat);
  pts.frustumCulled = false;
  pts.renderOrder = 5;
  world.add(pts);
  RAIN.splashes = pts;
  RAIN.splashData = { pos: sp, start: sStart, vel: sVel, size: sSize, next: 0, max: MAXS, attrs: { pos: sgeo.attributes.position, start: sgeo.attributes.aStart, vel: sgeo.attributes.aVel, size: sgeo.attributes.aSize } };
}

function spawnRing(x, y, z, strength) {
  const d = RAIN.ringData;
  const i = d.next;
  d.next = (d.next + 1) % d.max;
  d.offsets[i * 3] = x;
  d.offsets[i * 3 + 1] = y;
  d.offsets[i * 3 + 2] = z;
  d.starts[i] = STATE.simTime;
  d.strengths[i] = strength;
}
function spawnSplash(x, y, z, spread) {
  const d = RAIN.splashData;
  const i = d.next;
  d.next = (d.next + 1) % d.max;
  d.pos[i * 3] = x; d.pos[i * 3 + 1] = y + 0.02; d.pos[i * 3 + 2] = z;
  d.start[i] = STATE.simTime;
  const a = rand() * Math.PI * 2;
  const sp = 0.35 + rand() * 1.1;
  d.vel[i * 3] = Math.cos(a) * sp * spread;
  d.vel[i * 3 + 1] = 0.7 + rand() * 1.6;
  d.vel[i * 3 + 2] = Math.sin(a) * sp * spread;
  d.size[i] = 0.6 + rand() * 1.4;
}

function pickImpact() {
  const cols = RAIN.columns;
  let col = cols[(rand() * cols.length) | 0];
  if (col.count < 200) col = cols[(rand() * 5) | 0];
  for (let tries = 0; tries < 5; tries++) {
    const x = col.cx + (rand() * 2 - 1) * col.hx;
    const z = col.cz + (rand() * 2 - 1) * col.hz;
    const wet = FLOOR_WET.at(x, z);
    if (wet > 0.1 || rand() < 0.18) return { x, y: 0.0, z, wet };
  }
  return { x: col.cx + (rand() - 0.5) * 4, y: 0, z: col.cz + (rand() - 0.5) * 4, wet: 0.2 };
}

function simulateRain(h) {
  // ring impacts in the shafts
  const ringRate = 78 * (0.75 + ANIM.gust * 0.9);
  SIM.ringAcc += ringRate * h;
  while (SIM.ringAcc >= 1) {
    SIM.ringAcc -= 1;
    const p = pickImpact();
    spawnRing(p.x, 0.02 + p.wet * 0.004, p.z, 0.5 + p.wet * 0.8);
    if (chance(0.42)) spawnSplash(p.x, 0.0, p.z, 0.7);
  }
  // stream bases
  for (const s of RAIN.streams) {
    if (!s.base) continue;
    SIM.splashAcc += (s.rate || 0) * h;
    while (SIM.splashAcc >= 1) {
      SIM.splashAcc -= 1;
      spawnRing(s.base.x + (rand() - 0.5) * 0.5, s.base.y + 0.02, s.base.z + (rand() - 0.5) * 0.5, 0.9);
      if (chance(0.7)) spawnSplash(s.base.x, s.base.y, s.base.z, 1.3);
    }
  }
  // chain drips
  const chainBases = [{ x: 9.1, y: 0, z: 11.5 }, { x: -18.1, y: 0.86, z: -26.5 }];
  for (const c of chainBases) {
    SIM.chainAcc += 6 * h;
    while (SIM.chainAcc >= 1) {
      SIM.chainAcc -= 1;
      spawnRing(c.x + (rand() - 0.5) * 0.7, c.y + 0.02, c.z + (rand() - 0.5) * 0.7, 0.7);
      if (chance(0.5)) spawnSplash(c.x, c.y, c.z, 0.8);
    }
  }
  RAIN.ringData.attrs.aOffset.needsUpdate = true;
  RAIN.ringData.attrs.aStart.needsUpdate = true;
  RAIN.ringData.attrs.aStrength.needsUpdate = true;
  const sd = RAIN.splashData;
  sd.attrs.pos.needsUpdate = true;
  sd.attrs.start.needsUpdate = true;
  sd.attrs.vel.needsUpdate = true;
  sd.attrs.size.needsUpdate = true;
}

/* ---------------- gust surge: dense real rain streaks, no billboard sheet ---------------- */
function buildGustSurge() {
  const COUNT = DEBUG.low ? 900 : 2400;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(COUNT * 2 * 3);
  const randA = new Float32Array(COUNT * 2 * 3);
  const baseA = new Float32Array(COUNT * 2 * 2);
  const paramA = new Float32Array(COUNT * 2 * 2);
  const endA = new Float32Array(COUNT * 2);
  const lr = mulberry32(SEED ^ 0x9a17);
  let vi = 0;
  for (let i = 0; i < COUNT; i++) {
    const ox = (lr() * 2 - 1) * 13.0;
    const oz = -30.0 - lr() * 16.0;
    const r1 = lr(), r2 = lr(), r3 = lr();
    const speed = 13 + lr() * 6.0;
    const len = 0.5 + lr() * 0.6;
    const alpha = 0.55 + lr() * 0.45;
    for (let e = 0; e < 2; e++) {
      const o3 = vi * 3;
      randA[o3] = r1; randA[o3 + 1] = r2; randA[o3 + 2] = r3;
      baseA[vi * 2] = ox; baseA[vi * 2 + 1] = oz;
      paramA[vi * 2] = speed; paramA[vi * 2 + 1] = len;
      endA[vi] = e;
      vi++;
    }
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aRand', new THREE.BufferAttribute(randA, 3));
  geo.setAttribute('aBase', new THREE.BufferAttribute(baseA, 2));
  geo.setAttribute('aParams', new THREE.BufferAttribute(paramA, 2));
  geo.setAttribute('aEnd', new THREE.BufferAttribute(endA, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 10, -38), 80);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uWind: { value: new THREE.Vector2(0.2, 0) },
      uSurgeX: { value: 0 },
      uOpacity: { value: 0 },
    },
    vertexShader: /* glsl */`
      attribute vec3 aRand;
      attribute vec2 aBase;
      attribute vec2 aParams;
      attribute float aEnd;
      uniform float uTime;
      uniform vec2 uWind;
      uniform float uSurgeX;
      uniform float uOpacity;
      varying float vAlpha;
      varying float vDepth;
      varying vec3 vTint;
      void main(){
        float top = 20.1;
        float speed = aParams.x;
        float phase = fract(aRand.z + uTime * speed / top);
        float y = top - phase * top;
        float drift = 1.0 - y / top;
        float x = aBase.x + uSurgeX * (0.55 + 0.45 * drift)
                + uWind.x * drift * 3.2
                + (aRand.x * 2.0 - 1.0) * 1.2;
        float z = aBase.y + (aRand.y * 2.0 - 1.0) * 3.4 + uWind.y * drift * 2.4;
        vec3 head = vec3(x, y, z);
        vec3 dir = normalize(vec3(uWind.x * 0.62, -1.0, uWind.y * 0.62));
        vec3 p = head - dir * aParams.y * aEnd;
        float lifeFade = smoothstep(0.0, 0.06, phase) * (1.0 - smoothstep(0.9, 1.0, phase));
        float nearFade = smoothstep(0.0, 1.4, y);
        float edge = smoothstep(23.5, 17.5, abs(x));
        vAlpha = uOpacity * (0.55 + 0.45 * aRand.x) * lifeFade * nearFade * edge;
        vTint = vec3(0.7 + aRand.y * 0.15, 0.77 + aRand.y * 0.12, 0.8);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      varying float vAlpha;
      varying float vDepth;
      varying vec3 vTint;
      void main(){
        float d = clamp(vDepth / 65.0, 0.0, 1.0);
        float a = vAlpha * (1.0 - d * 0.72);
        gl_FragColor = vec4(vTint, a * 0.2);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending,
    fog: false,
  });
  RAIN.surgeMat = mat;
  const lines = new THREE.LineSegments(geo, mat);
  lines.frustumCulled = false;
  lines.renderOrder = 5;
  world.add(lines);
  RAIN.surge = lines;
}

/* ---------------- volumetric shafts and floor pools of light ---------------- */
function buildVolumetrics() {
  const verts = [], uvs = [], seeds = [], idx = [];
  const dir = SUN_DIR.clone().negate().normalize();
  let quadIndex = 0;
  function addBeam(cx, cz, width, top) {
    const start = new THREE.Vector3(cx, top, cz);
    const t = top / -dir.y;
    const end = start.clone().addScaledVector(dir, t);
    const rights = [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 1)];
    for (const r of rights) {
      const rw = r.clone().normalize();
      const p1 = start.clone().addScaledVector(rw, -width / 2);
      const p2 = start.clone().addScaledVector(rw, width / 2);
      const p3 = end.clone().addScaledVector(rw, width / 2);
      const p4 = end.clone().addScaledVector(rw, -width / 2);
      const seed = rand();
      const quad = [p1, p2, p3, p4];
      const uvq = [[0, 0], [1, 0], [1, 1], [0, 1]];
      const base = quadIndex * 4;
      for (let i = 0; i < 4; i++) {
        verts.push(quad[i].x, quad[i].y, quad[i].z);
        uvs.push(uvq[i][0], uvq[i][1]);
        seeds.push(seed);
      }
      idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
      quadIndex++;
    }
  }
  for (const ob of OPEN_BAYS) {
    const zc = (archZ(ob.b) + archZ(ob.b + 1)) / 2;
    const w = Math.min(11, (ob.x1 - ob.x0) / 2);
    addBeam((ob.x0 + ob.x1) / 2, zc, w * 0.86, 20.0);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setAttribute('aSeed', new THREE.Float32BufferAttribute(seeds, 1));
  geo.setIndex(idx);
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 10, -10), 140);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uStrength: { value: 1.0 } },
    vertexShader: /* glsl */`
      attribute float aSeed;
      varying vec2 vUv;
      varying float vSeed;
      void main(){ vUv = uv; vSeed = aSeed; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uTime;
      uniform float uStrength;
      varying vec2 vUv;
      varying float vSeed;
      float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
      float noise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        vec2 u = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
      }
      void main(){
        float edge = smoothstep(0.0, 0.32, vUv.x) * smoothstep(1.0, 0.68, vUv.x);
        float vert = smoothstep(0.0, 0.18, vUv.y) * smoothstep(1.0, 0.45, vUv.y);
        float n = noise(vec2(vUv.x * 4.0 + vSeed * 9.0, vUv.y * 3.2 - uTime * 0.06));
        float n2 = noise(vec2(vUv.x * 9.0 - vSeed * 3.0, vUv.y * 6.0 - uTime * 0.04));
        float a = edge * vert * (0.3 + n * 0.5 + n2 * 0.2) * 0.022 * uStrength;
        vec3 col = vec3(0.82, 0.83, 0.77);
        gl_FragColor = vec4(col, a);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    fog: false,
  });
  const beams = new THREE.Mesh(geo, mat);
  beams.frustumCulled = false;
  beams.renderOrder = 3;
  world.add(beams);
  RAIN.beams = beams;
  // floor pools where the shafts land
  const poolGeoms = [];
  for (const ob of OPEN_BAYS) {
    const zc = (archZ(ob.b) + archZ(ob.b + 1)) / 2;
    const cx = (ob.x0 + ob.x1) / 2;
    const t = 20.0 / -dir.y;
    const px = cx + dir.x * t * 0.96;
    const pz = zc + dir.z * t * 0.96;
    const g = new THREE.PlaneGeometry(10, 7);
    g.rotateX(-Math.PI / 2);
    g.rotateY(0.2);
    g.translate(px, 0.03, pz);
    poolGeoms.push(g);
  }
  // skylight pools
  for (const [bx, bz] of [[12, 15], [-12, -30], [12, -45]]) {
    const g = new THREE.PlaneGeometry(3.0, 8);
    g.rotateX(-Math.PI / 2);
    g.translate(bx + 8, 0.03, bz);
    poolGeoms.push(g);
  }
  const poolMat = new THREE.MeshBasicMaterial({
    map: TEX.sprite, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending,
    depthWrite: false, color: 0xd6dbd0, toneMapped: true,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  });
  const pools = new THREE.Mesh(mergeGeometries(poolGeoms, false), poolMat);
  pools.layers.set(2);
  pools.renderOrder = 2;
  world.add(pools);
  RAIN.spillPatches = pools;
}

/* ---------------- visible runoff streams ---------------- */
function buildStreams() {

    toneMapped: true,
  });
  function addStream(points, radius, base, rate) {
    const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
    const geo = new THREE.TubeGeometry(curve, 22, radius, 5, false);
    const uv = geo.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setY(i, uv.getY(i) * 6);

    mesh.frustumCulled = false;
    mesh.renderOrder = 4;
    world.add(mesh);
    RAIN.streams.push({ mesh, mat, base: base ? new THREE.Vector3(base[0], base[1], base[2]) : null, rate });
  }
  addStream([[12.78, 0.62, -18.0], [12.62, 0.42, -18.2], [12.55, 0.13, -18.42], [12.55, 0.02, -18.5]], 0.05, [12.55, 0, -18.5], 22);
  addStream([[-12.78, 0.62, 8.0], [-12.62, 0.42, 8.2], [-12.55, 0.13, 8.42], [-12.55, 0.02, 8.5]], 0.05, [-12.55, 0, 8.5], 20);
  addStream([[23.75, 5.55, 1.38], [23.72, 4.6, 1.38], [23.7, 3.0, 1.38], [23.7, 1.7, 1.38], [23.72, 0.9, 1.4]], 0.04, [23.72, 0.88, 1.4], 14);
  addStream([[-23.75, 5.55, -43.6], [-23.72, 4.4, -43.6], [-23.7, 2.8, -43.6], [-23.7, 1.6, -43.6], [-23.72, 0.9, -43.6]], 0.04, [-23.72, 0.88, -43.6], 14);
  addStream([[13.0, 17.75, 11.5], [12.9, 17.2, 11.5], [12.45, 16.4, 11.5]], 0.03, null, 0);
