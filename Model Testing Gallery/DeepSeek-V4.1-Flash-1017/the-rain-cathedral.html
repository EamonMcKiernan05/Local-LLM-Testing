<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0e0e'/%3E%3Cpath d='M2 12 L8 3 L14 12 Z' fill='none' stroke='%23d9b98a' stroke-width='1'/%3E%3C/svg%3E">
<title>The Rain Cathedral — Ashcombe Terminus</title>
<style>
  :root{
    --ink: rgba(236, 238, 231, .93);
    --dim: rgba(236, 238, 231, .46);
    --hair: rgba(236, 238, 231, .22);
    --warm: #d9b98a;
    --font-title: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --font-ui: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ margin:0; padding:0; height:100%; background:#090b0b; overflow:hidden; }
  body{
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overscroll-behavior:none;
  }
  #stage{
    position:fixed; inset:0; display:block; width:100%; height:100%;
    outline:none; touch-action:none; cursor:grab;
  }
  #stage.dragging{ cursor:grabbing; }
  #veil{
    position:fixed; inset:0; z-index:40; background:#070909; pointer-events:none;
    transition:opacity 1.6s ease;
  }
  #veil.gone{ opacity:0; }
  .ui{
    position:fixed; inset:0; z-index:20; pointer-events:none;
    transition:opacity 1.15s ease, visibility 0s linear 1.15s;
    opacity:1; visibility:visible;
  }
  body.idle .ui{ opacity:0; visibility:hidden; }
  body.idle #stage{ cursor:none; }

  .title{
    position:absolute;
    left:clamp(18px, 3.4vw, 54px);
    bottom:clamp(20px, 4.2vh, 48px);
    max-width:min(72vw, 560px);
    text-shadow:0 1px 26px rgba(4,7,7,.72), 0 0 3px rgba(4,7,7,.4);
  }
  .title::before{
    content:""; display:block; width:44px; height:1px;
    background:linear-gradient(90deg, var(--dim), transparent);
    margin-bottom:15px;
  }
  .title h1{
    margin:0;
    font-family:var(--font-title);
    font-weight:400;
    font-size:clamp(15px, 1.55vw, 25px);
    letter-spacing:.34em;
    text-transform:uppercase;
    line-height:1.1;
    white-space:nowrap;
  }
  .title p{
    margin:11px 0 0;
    font-size:clamp(8px, .68vw, 10.5px);
    letter-spacing:.27em;
    text-transform:uppercase;
    color:var(--dim);
    line-height:1.5;
  }
  .hint{
    position:absolute; left:0; right:0; bottom:clamp(20px, 4.2vh, 48px);
    text-align:center;
    font-size:9px; letter-spacing:.24em; text-transform:uppercase;
    color:rgba(236,238,231,.3);
    text-shadow:0 1px 18px rgba(4,7,7,.7);
    pointer-events:none;
    transition:opacity 1s ease;
  }
  .controls{
    position:absolute;
    right:clamp(16px, 3vw, 48px);
    bottom:clamp(18px, 3.8vh, 42px);
    display:flex; gap:6px; align-items:center;
    flex-wrap:wrap; justify-content:flex-end;
    max-width:min(86vw, 560px);
    pointer-events:auto;
  }
  .btn{
    appearance:none;
    -webkit-appearance:none;
    font-family:var(--font-ui);
    font-size:9.5px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ink);
    background:rgba(12,16,16,.22);
    border:1px solid rgba(236,238,231,.2);
    border-radius:1px;
    padding:10px 13px 9px;
    min-height:36px;
    display:inline-flex; align-items:center; gap:7px;
    cursor:pointer;
    backdrop-filter:blur(7px) saturate(.8);
    -webkit-backdrop-filter:blur(7px) saturate(.8);
    transition:background .25s ease, border-color .25s ease, color .25s ease, opacity .25s ease;
    text-shadow:0 1px 8px rgba(0,0,0,.45);
  }
  .btn:hover{ background:rgba(28,34,33,.44); border-color:rgba(236,238,231,.42); }
  .btn:focus-visible{ outline:1px solid var(--warm); outline-offset:2px; }
  .btn:active{ background:rgba(40,46,44,.5); }
  .btn .dot{
    width:4px; height:4px; border-radius:50%;
    background:transparent;
    box-shadow:inset 0 0 0 1px rgba(236,238,231,.35);
    transition:background .25s ease, box-shadow .25s ease;
  }
  .btn[aria-pressed="true"]{ border-color:rgba(217,185,138,.55); color:#f1e7d8; }
  .btn[aria-pressed="true"] .dot{ background:var(--warm); box-shadow:0 0 8px rgba(217,185,138,.6); }
  .btn[disabled]{ opacity:.35; cursor:default; }
  .sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

  #fatal{
    position:fixed; inset:0; z-index:60; display:none;
    align-items:center; justify-content:center; padding:28px;
    background:#0a0c0c; color:rgba(236,238,231,.8);
    font-family:var(--font-ui); font-size:12px; letter-spacing:.12em; line-height:1.8;
    text-transform:uppercase; text-align:center;
  }
  #fatal.on{ display:flex; }

  @media (max-width: 640px){
    .title h1{ letter-spacing:.22em; }
    .title p{ letter-spacing:.18em; }
    .controls{ right:12px; bottom:12px; left:12px; justify-content:flex-end; }
    .btn{ padding:9px 9px 8px; font-size:8.5px; letter-spacing:.12em; }
    .hint{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    #veil, .ui, .btn{ transition-duration:.01s; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="The Rain Cathedral: an abandoned railway terminus interior in overcast daylight and rain" role="img"></canvas>
<div id="veil"></div>
<div class="ui" id="ui">
  <header class="title">
    <h1>The Rain Cathedral</h1>
    <p>Ashcombe Terminus &nbsp;·&nbsp; Closed 1969 &nbsp;·&nbsp; Overcast, after rain</p>
  </header>
  <div class="hint" id="hint" aria-hidden="true"></div>
  <div class="controls" id="controls" role="group" aria-label="Scene controls">
    <button class="btn" id="btn-cinematic" type="button" aria-pressed="true"><span class="dot" aria-hidden="true"></span>Cinematic</button>
    <button class="btn" id="btn-reset" type="button">Reset View</button>
    <button class="btn" id="btn-pause" type="button" aria-pressed="false"><span class="dot" aria-hidden="true"></span>Pause</button>
    <button class="btn" id="btn-sound" type="button" aria-pressed="false"><span class="dot" aria-hidden="true"></span>Sound</button>
  </div>
</div>
<div id="fatal">This scene needs WebGL 2.<br>Please open it in a current desktop browser.</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ==========================================================================
   THE RAIN CATHEDRAL
   A disused Victorian terminus. All geometry, textures, sky, water and sound
   are generated in code from the deterministic seed below.
   ========================================================================== */

const SEED = 1337;

/* ---------- deterministic random ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(SEED);
const rand = () => rnd();
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(a + (b - a + 1) * rnd());
const pick = (arr) => arr[(rnd() * arr.length) | 0];
const chance = (p) => rnd() < p;
function forkRand() { return mulberry32((rnd() * 4294967296) | 0); }

/* ---------- small math ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const smoothstep = (a, b, v) => { const t = invLerp(a, b, v); return t * t * (3 - 2 * t); };
const smootherstep = (a, b, v) => { const t = invLerp(a, b, v); return t * t * t * (t * (t * 6 - 15) + 10); };
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const damp = (cur, target, lambda, dt) => lerp(cur, target, 1 - Math.exp(-lambda * dt));
const DEG = Math.PI / 180;

/* ---------- seeded value noise (CPU) ---------- */
function hash2i(x, y) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(SEED, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2i(xi, yi), b = hash2i(xi + 1, yi), c = hash2i(xi, yi + 1), d = hash2i(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm2(x, y, oct = 4, lac = 2.03, gain = 0.5) {
  let v = 0, amp = 0.5, fx = x, fy = y, norm = 0;
  for (let i = 0; i < oct; i++) {
    v += amp * vnoise2(fx, fy);
    norm += amp;
    fx = fx * lac + 17.3; fy = fy * lac + 9.7;
    amp *= gain;
  }
  return v / norm;
}
function ridged2(x, y, oct = 4) {
  let v = 0, amp = 0.5, fx = x, fy = y, norm = 0;
  for (let i = 0; i < oct; i++) {
    v += amp * (1 - Math.abs(vnoise2(fx, fy) * 2 - 1));
    norm += amp;
    fx = fx * 2.03 + 4.1; fy = fy * 2.03 - 2.6;
    amp *= 0.5;
  }
  return v / norm;
}

/* ---------- canvas helpers ---------- */
const _nativeGetContext = HTMLCanvasElement.prototype.getContext;
HTMLCanvasElement.prototype.getContext = function (type, attrs) {
  if (type === '2d') {
    const a = Object.assign({ willReadFrequently: true }, attrs || {});
    return _nativeGetContext.call(this, type, a);
  }
  return _nativeGetContext.call(this, type, attrs);
};
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function canvasTexture(canvas, opts = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = opts.srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = opts.clamp ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
  t.anisotropy = opts.aniso || 8;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}
function heightToNormal(heightCanvas, strength = 2.0) {
  const w = heightCanvas.width, h = heightCanvas.height;
  const src = heightCanvas.getContext('2d').getImageData(0, 0, w, h).data;
  const out = makeCanvas(w, h);
  const octx = out.getContext('2d');
  const img = octx.createImageData(w, h);
  const d = img.data;
  const at = (x, y) => src[((((y % h) + h) % h) * w + (((x % w) + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dx = (at(x + 1, y) - at(x - 1, y)) * strength;
      const dy = (at(x, y + 1) - at(x, y - 1)) * strength;
      let nx = -dx, ny = -dy, nz = 1;
      const len = Math.hypot(nx, ny, nz);
      nx /= len; ny /= len; nz /= len;
      const i = (y * w + x) * 4;
      d[i] = (nx * 0.5 + 0.5) * 255;
      d[i + 1] = (ny * 0.5 + 0.5) * 255;
      d[i + 2] = (nz * 0.5 + 0.5) * 255;
      d[i + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  return out;
}
function drawNoiseOverlay(ctx, w, h, amount, seedRnd) {
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const lr = seedRnd || Math.random;
  for (let i = 0; i < d.length; i += 4) {
    const n = (lr() - 0.5) * amount;
    d[i] = clamp(d[i] + n, 0, 255);
    d[i + 1] = clamp(d[i + 1] + n, 0, 255);
    d[i + 2] = clamp(d[i + 2] + n, 0, 255);
  }
  ctx.putImageData(img, 0, 0);
}
function grainCanvas(ctx, w, h, alpha = 0.05, lr = Math.random) {
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (lr() - 0.5) * 255 * alpha * 4;
    d[i] = clamp(d[i] + n, 0, 255);
    d[i + 1] = clamp(d[i + 1] + n, 0, 255);
    d[i + 2] = clamp(d[i + 2] + n, 0, 255);
  }
  ctx.putImageData(img, 0, 0);
}
const rgba = (rgb, a) => `rgba(${rgb[0] | 0},${rgb[1] | 0},${rgb[2] | 0},${a})`;
function softBlotch(ctx, x, y, rx, ry, rgb, alpha) {
  const rr0 = Math.max(rx, 1);
  const sq = Math.max(ry, 0.001) / rr0;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, sq);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rr0);
  g.addColorStop(0, rgba(rgb, alpha));
  g.addColorStop(0.5, rgba(rgb, alpha * 0.55));
  g.addColorStop(1, rgba(rgb, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, rr0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* ---------- three helpers ---------- */
const _v1 = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const _v3 = new THREE.Vector3();
const _q1 = new THREE.Quaternion();
const _m1 = new THREE.Matrix4();
const Z_AXIS = new THREE.Vector3(0, 0, 1);

function boxGeo(w, h, d, uvScale = 1) {
  const g = new THREE.BoxGeometry(w, h, d);
  const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const nx = nor.getX(i), ny = nor.getY(i), nz = nor.getZ(i);
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const ax = Math.abs(nx), ay = Math.abs(ny), az = Math.abs(nz);
    let u, v;
    if (ax >= ay && ax >= az) { u = z * Math.sign(nx || 1); v = y; }
    else if (ay >= az) { u = x; v = z * Math.sign(ny || 1); }
    else { u = x * Math.sign(nz || 1); v = y; }
    uv.setXY(i, u / uvScale, v / uvScale);
  }
  g.deleteAttribute('uv1');
  return g;
}
function addBox(list, w, h, d, x, y, z, uvScale = 1, quat = null) {
  const g = boxGeo(w, h, d, uvScale);
  if (quat) g.applyQuaternion(quat);
  g.translate(x, y, z);
  list.push(g);
  return g;
}
function strut(list, ax, ay, az, bx, by, bz, w, d, uvScale = 1.3) {
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const len = Math.hypot(dx, dy, dz);
  if (len < 1e-5) return;
  const g = boxGeo(w, d, len, uvScale);
  _q1.setFromUnitVectors(Z_AXIS, _v1.set(dx / len, dy / len, dz / len));
  g.applyQuaternion(_q1);
  g.translate((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
  list.push(g);
}
function mergeList(list, name) {
  if (!list.length) return null;
  const merged = mergeGeometries(list, false);
  merged.computeBoundingSphere();
  merged.computeBoundingBox();
  merged.name = name || 'merged';
  return merged;
}
function makeMesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  if (opts.name) m.name = opts.name;
  return m;
}
function scaleUV(geo, su, sv) {
  const uv = geo.attributes.uv;
  if (!uv) return geo;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  uv.needsUpdate = true;
  return geo;
}
function planeWorldUV(w, h, su, sv) {
  const g = new THREE.PlaneGeometry(w, h);
  scaleUV(g, su, sv);
  return g;
}
/* local truss member between two points in a plane, used by arches etc. */
function memberBetween(list, a, b, w, d) {
  strut(list, a.x, a.y, a.z, b.x, b.y, b.z, w, d);
}

/* ---------- GLSL snippets ---------- */
const GLSL_NOISE = /* glsl */`
float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash31(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.63, 1.21, -1.21, 1.63);
  for (int i = 0; i < 5; i++) { v += a * vnoise(p); p = m * p; a *= 0.5; }
  return v;
}
float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash31(i), n100 = hash31(i + vec3(1,0,0));
  float n010 = hash31(i + vec3(0,1,0)), n110 = hash31(i + vec3(1,1,0));
  float n001 = hash31(i + vec3(0,0,1)), n101 = hash31(i + vec3(1,0,1));
  float n011 = hash31(i + vec3(0,1,1)), n111 = hash31(i + vec3(1,1,1));
  return mix(mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
             mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y), f.z);
}
`;

/* ---------- world constants ---------- */
const W = {
  seed: SEED,
  bay: 9,
  firstArchZ: 38,
  archCount: 12,
  springX: 24,
  springY: 12,
  apexY: 20,
  archR: 40,
  archCY: -20,
  sideX: 24.4,
  floorHalfX: 24.0,
  rearZ: 46,
  farZ: -66,
  floorLength: 112,
  platformMinX: 13.0,
  platformMaxX: 23.4,
  platformY: 0.86,
  maintX: -5.2,
  maintZ: -62.4,
  clockZ: -52,
};
const ARCH_Y = (x) => W.archCY + Math.sqrt(Math.max(0, W.archR * W.archR - x * x));
const ARCH_ANGLE = (x) => Math.atan2(ARCH_Y(x) - W.archCY, x); // from +x axis, 53..127 deg
const archZ = (i) => W.firstArchZ - W.bay * i;

/* ---------- DOM ---------- */
const DOM = {
  canvas: document.getElementById('stage'),
  ui: document.getElementById('ui'),
  controls: document.getElementById('controls'),
  hint: document.getElementById('hint'),
  veil: document.getElementById('veil'),
  fatal: document.getElementById('fatal'),
  btnCinematic: document.getElementById('btn-cinematic'),
  btnReset: document.getElementById('btn-reset'),
  btnPause: document.getElementById('btn-pause'),
  btnSound: document.getElementById('btn-sound'),
};

/* ---------- debug / test hooks ---------- */
const QS = new URLSearchParams(location.search);
const DEBUG = {
  t: QS.has('t') ? parseFloat(QS.get('t')) : 0,
  freeze: QS.has('freeze'),
  nofx: QS.has('nofx'),
  nopost: QS.has('nopost'),
  nobloom: QS.has('nobloom'),
  nomsaa: QS.has('nomsaa'),
  noadapt: QS.has('noadapt'),
  dpr: QS.has('dpr') ? parseFloat(QS.get('dpr')) : 0,
  noshadow: QS.has('noshadow'),
  noreflect: QS.has('noreflect'),
  low: QS.has('low'),
};
const STATE = {
  ready: false,
  paused: false,
  audioOn: false,
  audioMuted: false,
  mode: 'cinematic',      // cinematic | manual | transition
  idleTimer: 0,
  simTime: DEBUG.t,
  frame: 0,
  fps: 0,
};

/* ==========================================================================
   TEXTURES — every map in the scene is painted here, once, from the seed.
   ========================================================================== */
const TEX = {};
let MAX_ANISO = 8;
const SUN_DIR = new THREE.Vector3(-0.34, 0.82, 0.32).normalize();

function chipsAt(ctx, w, h, x, y, draw) {
  draw(x, y);
  if (x < 10) draw(x + w, y);
  if (x > w - 10) draw(x - w, y);
  if (y < 10) draw(x, y + h);
  if (y > h - 10) draw(x, y - h);
}

function makeSky() {
  const w = 2048, h = 1024;
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0.00, '#8796a1');
  grad.addColorStop(0.16, '#a9b4bb');
  grad.addColorStop(0.32, '#c8d0cf');
  grad.addColorStop(0.43, '#e4e4da');
  grad.addColorStop(0.50, '#f2eee0');
  grad.addColorStop(0.55, '#ddd7c7');
  grad.addColorStop(0.64, '#afa99a');
  grad.addColorStop(0.78, '#787266');
  grad.addColorStop(1.00, '#43413a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // low-resolution fbm cloud field, upscaled smoothly and mirrored for a seamless wrap
  const nw = 512, nh = 256;
  const nc = makeCanvas(nw, nh);
  const nctx = nc.getContext('2d');
  const nimg = nctx.createImageData(nw, nh);
  const nd = nimg.data;
  const lr = mulberry32(SEED ^ 0x51af);
  for (let y = 0; y < nh; y++) {
    for (let x = 0; x < nw; x++) {
      const u = x / nw, v = y / nh;
      const big = fbm2(u * 3.4, v * 2.2 + 11.0, 4);
      const det = fbm2(u * 11.0 + 4.0, v * 6.0 + 2.0, 4);
      const streak = fbm2(u * 22.0 + 9.0, v * 3.0 + 5.0, 3);
      let n = big * 0.52 + det * 0.34 + streak * 0.14;
      n = clamp((n - 0.32) / 0.5, 0, 1);
      const i = (y * nw + x) * 4;
      const lum = 110 + n * 145;
      nd[i] = lum * 1.01;
      nd[i + 1] = lum;
      nd[i + 2] = lum * 0.985;
      nd[i + 3] = 255;
    }
  }
  nctx.putImageData(nimg, 0, 0);

  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.5;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(nc, 0, 0, w, h);
  ctx.globalAlpha = 0.24;
  ctx.drawImage(nc, w, 0, w, h);
  ctx.drawImage(nc, -w, 0, w, h);
  ctx.drawImage(nc, 0, 0, w, h);
  ctx.restore();

  // broad luminous rift in the overcast where the hidden sun sits
  const su = 0.5 + Math.atan2(SUN_DIR.z, SUN_DIR.x) / (Math.PI * 2);
  const sv = 0.5 - Math.asin(clamp(SUN_DIR.y, -1, 1)) / Math.PI;
  const sx = su * w, sy = sv * h;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  softBlotch(ctx, sx, sy, 620, 360, [236, 234, 222], 0.16);
  softBlotch(ctx, sx, sy, 260, 200, [250, 246, 232], 0.26);
  softBlotch(ctx, sx, sy, 90, 80, [255, 252, 242], 0.34);
  ctx.restore();

  // heavier cloud banks, low above the horizon
  const cr = mulberry32(SEED ^ 0x9d2);
  for (let i = 0; i < 26; i++) {
    const x = cr() * w;
    const y = h * (0.33 + cr() * 0.18);
    const rx = 100 + cr() * 340;
    const ry = 14 + cr() * 40;
    softBlotch(ctx, x, y, rx, ry, [66, 72, 78], 0.035 + cr() * 0.055);
  }
  // horizon haze
  const hz = ctx.createLinearGradient(0, h * 0.42, 0, h * 0.6);
  hz.addColorStop(0, 'rgba(230,228,218,0)');
  hz.addColorStop(0.45, 'rgba(230,228,218,0.30)');
  hz.addColorStop(1, 'rgba(210,206,193,0)');
  ctx.fillStyle = hz;
  ctx.fillRect(0, h * 0.42, w, h * 0.18);
  grainCanvas(ctx, w, h, 0.006, mulberry32(SEED ^ 0x77));

  const t = canvasTexture(c, { srgb: true, clamp: true, aniso: MAX_ANISO });
  t.mapping = THREE.EquirectangularReflectionMapping;
  return t;
}

function makeTerrazzo() {
  const S = 2048;
  const c = makeCanvas(S, S), ctx = c.getContext('2d');
  ctx.fillStyle = '#79746a';
  ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 90; i++) {
    const warm = chance(0.5) ? [112, 106, 94] : [148, 142, 128];
    softBlotch(ctx, rand() * S, rand() * S, 60 + rand() * 420, 60 + rand() * 420, warm, 0.05 + rand() * 0.1);
  }
  const pal = [
    [184, 177, 160], [162, 154, 140], [133, 126, 114], [203, 196, 178],
    [98, 92, 83], [172, 165, 150], [145, 138, 125], [115, 110, 100],
    [212, 205, 187], [88, 84, 77], [156, 148, 132], [126, 120, 108],
  ];
  ctx.save();
  for (let i = 0; i < 38000; i++) {
    const x = rand() * S, y = rand() * S;
    const r = 0.7 + Math.pow(rand(), 2.4) * 7.5;
    const col = pick(pal);
    const a = 0.35 + rand() * 0.55;
    const rot = rand() * Math.PI;
    const sq = 0.5 + rand() * 0.7;
    chipsAt(ctx, S, S, x, y, (cx, cy) => {
      ctx.fillStyle = rgba(col, a);
      ctx.beginPath();
      ctx.ellipse(cx, cy, r, r * sq, rot, 0, Math.PI * 2);
      ctx.fill();
      if (r > 3.4 && chance(0.4)) {
        ctx.fillStyle = rgba([228, 222, 206], a * 0.35);
        ctx.beginPath();
        ctx.ellipse(cx - r * 0.18, cy - r * 0.22, r * 0.55, r * sq * 0.5, rot, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }
  // dark aggregate and hairline stains
  for (let i = 0; i < 9000; i++) {
    const x = rand() * S, y = rand() * S, r = 0.4 + rand() * 1.7;
    chipsAt(ctx, S, S, x, y, (cx, cy) => {
      ctx.fillStyle = rgba([46, 44, 40], 0.3 + rand() * 0.5);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  ctx.restore();
  // stains: iron, oil, moss in the joints
  for (let i = 0; i < 42; i++) {
    const x = rand() * S, y = rand() * S;
    const kind = rand();
    const col = kind < 0.45 ? [86, 58, 38] : kind < 0.72 ? [48, 48, 44] : [74, 82, 60];
    softBlotch(ctx, x, y, 25 + rand() * 190, 18 + rand() * 120, col, 0.05 + rand() * 0.1);
  }
  for (let i = 0; i < 26; i++) {
    const x = rand() * S;
    const g = ctx.createLinearGradient(x, 0, x + 60, 0);
    g.addColorStop(0, 'rgba(58,55,49,0)');
    g.addColorStop(0.5, `rgba(58,55,49,${0.04 + rand() * 0.07})`);
    g.addColorStop(1, 'rgba(58,55,49,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 40, 0, 100, S);
  }
  grainCanvas(ctx, S, S, 0.02, mulberry32(SEED ^ 0x31));
  const albedo = canvasTexture(c, { srgb: true, aniso: MAX_ANISO });

  // height -> normal
  const H = 1024;
  const hc = makeCanvas(H, H), hctx = hc.getContext('2d');
  hctx.fillStyle = '#7d7d7d';
  hctx.fillRect(0, 0, H, H);
  for (let i = 0; i < 15000; i++) {
    const x = rand() * H, y = rand() * H, r = 0.5 + Math.pow(rand(), 2.2) * 5.5;
    const v = 100 + (rand() * 100) | 0;
    chipsAt(hctx, H, H, x, y, (cx, cy) => {
      hctx.fillStyle = `rgb(${v},${v},${v})`;
      hctx.beginPath();
      hctx.ellipse(cx, cy, r, r * (0.5 + rand() * 0.6), rand() * Math.PI, 0, Math.PI * 2);
      hctx.fill();
    });
  }
  grainCanvas(hctx, H, H, 0.05, mulberry32(SEED ^ 0x32));
  const normal = canvasTexture(heightToNormal(hc, 1.9), { aniso: MAX_ANISO });

  const R = 512;
  const rc = makeCanvas(R, R), rctx = rc.getContext('2d');
  rctx.fillStyle = '#7a7a7a';
  rctx.fillRect(0, 0, R, R);
  for (let i = 0; i < 2600; i++) {
    const v = 110 + rand() * 80;
    rctx.fillStyle = `rgba(${v},${v},${v},0.5)`;
    rctx.beginPath();
    rctx.arc(rand() * R, rand() * R, 0.6 + rand() * 5, 0, Math.PI * 2);
    rctx.fill();
  }
  for (let i = 0; i < 30; i++) softBlotch(rctx, rand() * R, rand() * R, 20 + rand() * 90, 20 + rand() * 90, [190, 190, 190], 0.12);
  const rough = canvasTexture(rc, { aniso: MAX_ANISO });
  return { albedo, normal, rough };
}

function makeMasonry(seedOff, tint) {
  const S = 1024, TILE = 2.4;
  const c = makeCanvas(S, S), ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ seedOff);
  const baseCol = tint || [176, 169, 154];
  ctx.fillStyle = '#847d70';
  ctx.fillRect(0, 0, S, S);
  const rows = 8, rh = S / rows;
  for (let r = 0; r < rows; r++) {
    let x = (r % 2 ? -60 : 0) + local() * 40;
    while (x < S) {
      const bw = 150 + local() * 210;
      const bh = rh - 5 - local() * 3;
      const y = r * rh + 2.5;
      const v = (local() - 0.5) * 26;
      const soot = local() < 0.18 ? -26 : 0;
      const col = [baseCol[0] + v + soot, baseCol[1] + v + soot, baseCol[2] + v * 0.9 + soot];
      ctx.fillStyle = rgba(col, 1);
      ctx.fillRect(x, y, bw, bh);
      // chalky surface breakup
      ctx.fillStyle = rgba([255, 252, 240], 0.03 + local() * 0.05);
      ctx.fillRect(x + 4, y + 3, bw - 8, bh * 0.4);
      const nPits = 12 + (local() * 26) | 0;
      for (let p = 0; p < nPits; p++) {
        const px = x + 4 + local() * (bw - 8), py = y + 3 + local() * (bh - 6);
        ctx.fillStyle = rgba([70, 65, 56], 0.12 + local() * 0.22);
        ctx.beginPath();
        ctx.ellipse(px, py, 0.7 + local() * 2.4, 0.5 + local() * 1.6, local() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      if (local() < 0.16) {
        const g = ctx.createLinearGradient(x, y, x, y + bh);
        g.addColorStop(0, 'rgba(52,50,44,0.16)');
        g.addColorStop(1, 'rgba(52,50,44,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x, y, bw, bh);
      }
      x += bw + 4;
    }
  }
  // soot / water staining from above
  for (let i = 0; i < 18; i++) {
    const x = local() * S;
    const g = ctx.createLinearGradient(x, 0, x + 30 + local() * 80, S);
    g.addColorStop(0, `rgba(44,41,36,${0.035 + local() * 0.082})`);
    g.addColorStop(0.6, `rgba(44,41,36,${0.012 + local() * 0.035})`);
    g.addColorStop(1, 'rgba(44,41,36,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 20, 0, 40 + local() * 110, S);
  }
  for (let i = 0; i < 12; i++) softBlotch(ctx, local() * S, local() * S, 24 + local() * 130, 20 + local() * 110, [92, 84, 68], 0.035 + local() * 0.065);
  // hairline cracks
  ctx.strokeStyle = 'rgba(52,48,41,0.34)';
  for (let i = 0; i < 8; i++) {
    let x = local() * S, y = local() * S;
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let s = 0; s < 9; s++) {
      x += (local() - 0.5) * 60;
      y += (local() - 0.2) * 44;
      ctx.lineTo(x, y);
    }
    ctx.lineWidth = 0.5 + local();
    ctx.stroke();
  }
  grainCanvas(ctx, S, S, 0.03, mulberry32(seedOff ^ 0x8f));
  const albedo = canvasTexture(c, { srgb: true, aniso: MAX_ANISO });

  // height
  const hc = makeCanvas(S, S), hctx = hc.getContext('2d');
  hctx.fillStyle = '#464646';
  hctx.fillRect(0, 0, S, S);
  const l2 = mulberry32(SEED ^ seedOff ^ 0x1212);
  for (let r = 0; r < rows; r++) {
    let x = (r % 2 ? -60 : 0) + l2() * 40;
    while (x < S) {
      const bw = 150 + l2() * 210;
      const y = r * rh + 2.5;
      const bh = rh - 5 - l2() * 3;
      hctx.fillStyle = `rgb(${150 + l2() * 34 | 0},${150 + l2() * 34 | 0},${150 + l2() * 34 | 0})`;
      hctx.fillRect(x, y, bw, bh);
      for (let p = 0; p < 30; p++) {
        const px = x + 4 + l2() * (bw - 8), py = y + 3 + l2() * (bh - 6);
        const v = 110 + l2() * 60 | 0;
        hctx.fillStyle = `rgb(${v},${v},${v})`;
        hctx.beginPath();
        hctx.ellipse(px, py, 0.8 + l2() * 2.6, 0.6 + l2() * 1.8, l2() * 3, 0, Math.PI * 2);
        hctx.fill();
      }
      x += bw + 4;
    }
  }
  grainCanvas(hctx, S, S, 0.045, mulberry32(seedOff ^ 0x77));
  const normal = canvasTexture(heightToNormal(hc, 2.3), { aniso: MAX_ANISO });

  const rc = makeCanvas(512, 512), rctx = rc.getContext('2d');
  rctx.fillStyle = '#d6d6d6';
  rctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 900; i++) {
    const v = 190 + rand() * 55;
    rctx.fillStyle = `rgba(${v},${v},${v},0.35)`;
    rctx.beginPath();
    rctx.arc(rand() * 512, rand() * 512, 1 + rand() * 9, 0, Math.PI * 2);
    rctx.fill();
  }
  const rough = canvasTexture(rc, { aniso: MAX_ANISO });
  return { albedo, normal, rough };
}

function makeBrick() {
  const S = 1024;
  const c = makeCanvas(S, S), ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ 0x4b2);
  ctx.fillStyle = '#8d8576';
  ctx.fillRect(0, 0, S, S);
  const rows = 16, rh = S / rows;
  const brickW = S / 5.2;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * brickW * 0.5;
    for (let b = -1; b < 6; b++) {
      const x = b * brickW + off + 2;
      const y = r * rh + 1.5;
      const bw = brickW - 4, bh = rh - 3;
      const k = local();
      const col = k < 0.12 ? [74, 58, 50] : k < 0.3 ? [110, 78, 62] : k < 0.7 ? [92, 60, 48] : k < 0.87 ? [124, 86, 68] : [58, 48, 43];
      ctx.fillStyle = rgba(col, 1);
      ctx.fillRect(x, y, bw, bh);
      ctx.fillStyle = 'rgba(255,244,225,0.05)';
      ctx.fillRect(x + 2, y + 1, bw - 4, bh * 0.3);
      for (let p = 0; p < 9; p++) {
        ctx.fillStyle = `rgba(30,24,20,${0.08 + local() * 0.2})`;
        ctx.fillRect(x + local() * bw, y + local() * bh, 1 + local() * 4, 1 + local() * 2);
      }
    }
  }
  for (let i = 0; i < 26; i++) softBlotch(ctx, local() * S, local() * S, 30 + local() * 160, 20 + local() * 140, [40, 34, 30], 0.07 + local() * 0.12);
  for (let i = 0; i < 20; i++) softBlotch(ctx, local() * S, local() * S, 8 + local() * 26, 8 + local() * 26, [104, 78, 48], 0.15 + local() * 0.2);
  grainCanvas(ctx, S, S, 0.035, mulberry32(SEED ^ 0x4b3));
  const albedo = canvasTexture(c, { srgb: true, aniso: MAX_ANISO });

  const hc = makeCanvas(512, 512), hctx = hc.getContext('2d');
  hctx.fillStyle = '#4a4a4a';
  hctx.fillRect(0, 0, 512, 512);
  const l2 = mulberry32(SEED ^ 0x4b4);
  for (let r = 0; r < 16; r++) {
    const off = (r % 2) * (512 / 5.2) * 0.5;
    for (let b = -1; b < 6; b++) {
      const x = b * (512 / 5.2) + off + 1;
      const y = r * (512 / 16) + 1;
      hctx.fillStyle = `rgb(${140 + l2() * 40 | 0},${140 + l2() * 40 | 0},${140 + l2() * 40 | 0})`;
      hctx.fillRect(x, y, 512 / 5.2 - 2, 512 / 16 - 1.5);
    }
  }
  grainCanvas(hctx, 512, 512, 0.06, mulberry32(SEED ^ 0x4b5));
  const normal = canvasTexture(heightToNormal(hc, 1.7), { aniso: MAX_ANISO });
  const rc = makeCanvas(256, 256), rctx = rc.getContext('2d');
  rctx.fillStyle = '#d2d2d2'; rctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 400; i++) {
    rctx.fillStyle = `rgba(210,210,210,${0.2 + rand() * 0.3})`;
    rctx.beginPath(); rctx.arc(rand() * 256, rand() * 256, 2 + rand() * 12, 0, Math.PI * 2); rctx.fill();
  }
  const rough = canvasTexture(rc, { aniso: MAX_ANISO });
  return { albedo, normal, rough };
}

function makeSteel() {
  const S = 1024;
  const c = makeCanvas(S, S), ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ 0x5c1);
  ctx.fillStyle = '#26282a';
  ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 55; i++) {
    const col = local() < 0.55 ? [40, 42, 43] : [30, 30, 31];
    softBlotch(ctx, local() * S, local() * S, 40 + local() * 260, 40 + local() * 260, col, 0.08 + local() * 0.12);
  }
  // plate seams
  for (let i = 0; i < 3; i++) {
    const y = 170 + i * 330;
    ctx.fillStyle = 'rgba(8,9,10,0.7)';
    ctx.fillRect(0, y, S, 5);
    ctx.fillStyle = 'rgba(120,124,120,0.16)';
    ctx.fillRect(0, y - 4, S, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, y + 5, S, 5);
  }
  // rivet rows
  const rivets = [];
  for (let row = 0; row < 8; row++) {
    const y = 52 + row * 128;
    for (let i = 0; i < 12; i++) {
      const x = 40 + i * 86 + (row % 2) * 22;
      rivets.push([x, y]);
    }
  }
  for (const [x, y] of rivets) {
    const g = ctx.createRadialGradient(x - 3, y - 3, 1, x, y, 11);
    g.addColorStop(0, 'rgba(140,144,140,0.55)');
    g.addColorStop(0.5, 'rgba(52,54,55,0.8)');
    g.addColorStop(1, 'rgba(12,13,14,0.9)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, 10.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // rust blooms and streaks
  for (let i = 0; i < 38; i++) {
    const x = local() * S, y = local() * S;
    const col = local() < 0.5 ? [88, 52, 30] : [118, 70, 38];
    softBlotch(ctx, x, y, 8 + local() * 80, 6 + local() * 60, col, 0.12 + local() * 0.24);
  }
  for (let i = 0; i < 30; i++) {
    const x = local() * S;
    const g = ctx.createLinearGradient(x, 0, x + 12 + local() * 30, S);
    g.addColorStop(0, `rgba(96,58,32,${0.10 + local() * 0.2})`);
    g.addColorStop(0.5, `rgba(72,48,30,${0.05 + local() * 0.1})`);
    g.addColorStop(1, 'rgba(60,44,30,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 10, 0, 26 + local() * 46, S);
  }
  // pale chalky lime splash near the bottom of walls
  for (let i = 0; i < 12; i++) softBlotch(ctx, local() * S, S - local() * 300, 20 + local() * 80, 12 + local() * 40, [166, 160, 142], 0.04 + local() * 0.06);
  grainCanvas(ctx, S, S, 0.03, mulberry32(SEED ^ 0x5c2));
  const albedo = canvasTexture(c, { srgb: true, aniso: MAX_ANISO });

  const hc = makeCanvas(S, S), hctx = hc.getContext('2d');
  hctx.fillStyle = '#6d6d6d'; hctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 2; i++) {
    const y = 170 + i * 330;
    hctx.fillStyle = '#2e2e2e'; hctx.fillRect(0, y, S, 5);
  }
  for (const [x, y] of rivets) {
    const g = hctx.createRadialGradient(x, y, 1, x, y, 11);
    g.addColorStop(0, '#e8e8e8');
    g.addColorStop(0.55, '#aeaeae');
    g.addColorStop(1, '#5a5a5a');
    hctx.fillStyle = g;
    hctx.beginPath(); hctx.arc(x, y, 10.5, 0, Math.PI * 2); hctx.fill();
  }
  grainCanvas(hctx, S, S, 0.05, mulberry32(SEED ^ 0x5c3));
  for (let i = 0; i < 900; i++) {
    const v = 40 + local() * 50 | 0;
    hctx.fillStyle = `rgb(${v},${v},${v})`;
    hctx.beginPath(); hctx.arc(local() * S, local() * S, 0.8 + local() * 3.2, 0, Math.PI * 2); hctx.fill();
  }
  const normal = canvasTexture(heightToNormal(hc, 2.8), { aniso: MAX_ANISO });

  const rc = makeCanvas(512, 512), rctx = rc.getContext('2d');
  rctx.fillStyle = '#8c8c8c'; rctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 700; i++) {
    const v = 140 + rand() * 90 | 0;
    rctx.fillStyle = `rgba(${v},${v},${v},0.3)`;
    rctx.beginPath(); rctx.arc(rand() * 512, rand() * 512, 2 + rand() * 14, 0, Math.PI * 2); rctx.fill();
  }
  const rough = canvasTexture(rc, { aniso: MAX_ANISO });
  return { albedo, normal, rough };
}

function makeSlate() {
  const S = 1024;
  const c = makeCanvas(S, S), ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ 0x6a1);
  ctx.fillStyle = '#20262a'; ctx.fillRect(0, 0, S, S);
  const rows = 9, rh = S / rows;
  for (let r = 0; r < rows; r++) {
    let x = (r % 2 ? -40 : 0) - local() * 30;
    while (x < S) {
      const w = 70 + local() * 120;
      const y = r * rh;
      const v = (local() - 0.5) * 22;
      const moss = local() < 0.1;
      const col = moss ? [64 + v, 74 + v, 52 + v] : [43 + v, 49 + v, 53 + v];
      ctx.fillStyle = rgba(col, 1);
      ctx.fillRect(x + 1, y + 1, w - 2, rh - 1);
      ctx.fillStyle = 'rgba(180,190,190,0.07)';
      ctx.fillRect(x + 1, y + 1, w - 2, 3);
      ctx.fillStyle = 'rgba(4,6,8,0.45)';
      ctx.fillRect(x + 1, y + rh - 3, w - 2, 3);
      for (let p = 0; p < 10; p++) {
        ctx.fillStyle = `rgba(${local() < 0.5 ? '130,140,140' : '10,12,14'},${0.03 + local() * 0.06})`;
        ctx.fillRect(x + local() * w, y + 4 + local() * (rh - 8), 1 + local() * 22, 1);
      }
      x += w;
    }
  }
  for (let i = 0; i < 30; i++) {
    const col = local() < 0.4 ? [86, 64, 38] : local() < 0.7 ? [64, 76, 56] : [24, 28, 31];
    softBlotch(ctx, local() * S, local() * S, 8 + local() * 90, 6 + local() * 60, col, 0.1 + local() * 0.2);
  }
  grainCanvas(ctx, S, S, 0.03, mulberry32(SEED ^ 0x6a2));
  const albedo = canvasTexture(c, { srgb: true, aniso: MAX_ANISO });

  const hc = makeCanvas(512, 512), hctx = hc.getContext('2d');
  hctx.fillStyle = '#3a3a3a'; hctx.fillRect(0, 0, 512, 512);
  const l2 = mulberry32(SEED ^ 0x6a3);
  const rr2 = 512 / 9;
  for (let r = 0; r < 9; r++) {
    let x = (r % 2 ? -20 : 0) - l2() * 15;
    while (x < 512) {
      const w = 35 + l2() * 60;
      hctx.fillStyle = `rgb(${150 + l2() * 40 | 0},${150 + l2() * 40 | 0},${150 + l2() * 40 | 0})`;
      hctx.fillRect(x + 1, r * rr2 + 1, w - 2, rr2 - 2);
      x += w;
    }
  }
  const normal = canvasTexture(heightToNormal(hc, 2.1), { aniso: MAX_ANISO });
  const rc = makeCanvas(256, 256), rctx = rc.getContext('2d');
  rctx.fillStyle = '#8a8a8a'; rctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 400; i++) {
    const v = 120 + rand() * 110 | 0;
    rctx.fillStyle = `rgba(${v},${v},${v},0.35)`;
    rctx.beginPath(); rctx.arc(rand() * 256, rand() * 256, 2 + rand() * 15, 0, Math.PI * 2); rctx.fill();
  }
  const rough = canvasTexture(rc, { aniso: MAX_ANISO });
  return { albedo, normal, rough };
}

function makeWood() {
  const S = 512;
  const c = makeCanvas(S, S), ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ 0x7d1);
  ctx.fillStyle = '#6b5c49'; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 60; i++) {
    const col = local() < 0.5 ? [92, 78, 60] : [76, 64, 50];
    softBlotch(ctx, local() * S, local() * S, 10 + local() * 90, 30 + local() * 150, col, 0.08 + local() * 0.16);
  }
  // grain
  for (let i = 0; i < 210; i++) {
    const y = local() * S;
    ctx.strokeStyle = `rgba(${local() < 0.5 ? '40,32,24' : '140,118,88'},${0.05 + local() * 0.13})`;
    ctx.lineWidth = 0.6 + local() * 1.6;
    ctx.beginPath();
    let x = 0;
    ctx.moveTo(0, y);
    while (x < S) {
      x += 30 + local() * 80;
      ctx.lineTo(x, y + (local() - 0.5) * 9);
    }
    ctx.stroke();
  }
  // worn paint traces
  for (let i = 0; i < 9; i++) {
    const x = local() * S, y = local() * S;
    ctx.fillStyle = `rgba(${local() < 0.5 ? '58,72,64' : '128,120,100'},${0.12 + local() * 0.2})`;
    ctx.beginPath();
    ctx.ellipse(x, y, 10 + local() * 60, 6 + local() * 26, local() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  for (let i = 0; i < 7; i++) {
    const x = local() * S, y = local() * S;
    ctx.fillStyle = 'rgba(38,26,18,0.55)';
    ctx.beginPath(); ctx.ellipse(x, y, 2 + local() * 5, 1.6 + local() * 3, 0, 0, Math.PI * 2); ctx.fill();
  }
  grainCanvas(ctx, S, S, 0.04, mulberry32(SEED ^ 0x7d2));
  const albedo = canvasTexture(c, { srgb: true, aniso: MAX_ANISO });
  const hc = makeCanvas(256, 256), hctx = hc.getContext('2d');
  hctx.fillStyle = '#909090'; hctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 220; i++) {
    const v = 110 + local() * 70 | 0;
    hctx.strokeStyle = `rgba(${v},${v},${v},0.5)`;
    hctx.lineWidth = 1 + local() * 2;
    const y = local() * 256;
    hctx.beginPath(); hctx.moveTo(0, y); hctx.lineTo(256, y + (local() - 0.5) * 12); hctx.stroke();
  }
  const normal = canvasTexture(heightToNormal(hc, 1.2), { aniso: MAX_ANISO });
  const rc = makeCanvas(128, 128), rctx = rc.getContext('2d');
  rctx.fillStyle = '#b4b4b4'; rctx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 90; i++) {
    const v = 150 + rand() * 90 | 0;
    rctx.fillStyle = `rgba(${v},${v},${v},0.4)`;
    rctx.beginPath(); rctx.arc(rand() * 128, rand() * 128, 2 + rand() * 10, 0, Math.PI * 2); rctx.fill();
  }
  const rough = canvasTexture(rc, { aniso: MAX_ANISO });
  return { albedo, normal, rough };
}

/* ---------- painted lettering ---------- */
function trackedText(ctx, text, x, y, tracking) {
  let cx = x;
  for (const ch of text) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + tracking;
  }
  return cx;
}
function trackedWidth(ctx, text, tracking) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + tracking;
  return w - tracking;
}

function makeGlass() {
  const S = 512;

  ctx.clearRect(0, 0, S, S);

  ctx.fillStyle = 'rgba(150,168,168,0.26)';
  ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 40; i++) {
    const x = local() * S;
    const g = ctx.createLinearGradient(x, 0, x + 18 + local() * 60, S);
    g.addColorStop(0, `rgba(46,52,46,${0.05 + local() * 0.2})`);
    g.addColorStop(0.5, `rgba(46,52,46,${0.02 + local() * 0.12})`);

}

function makeClockFace() {
  const S = 1024;
  const c = makeCanvas(S, S), ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ 0xb7);
  ctx.clearRect(0, 0, S, S);
  const cx = S / 2, cy = S / 2, R = S * 0.475;
  const g = ctx.createRadialGradient(cx - 60, cy - 80, 40, cx, cy, R);
  g.addColorStop(0, '#ece4ce');
  g.addColorStop(0.55, '#e3d9c0');
  g.addColorStop(0.86, '#d3c6a9');
  g.addColorStop(1, '#b8a988');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  // age: foxing, rust freckles, hairline cracks
  for (let i = 0; i < 80; i++) softBlotch(ctx, cx + (local() - 0.5) * R * 1.8, cy + (local() - 0.5) * R * 1.8, 6 + local() * 90, 5 + local() * 80, [122, 96, 58], 0.03 + local() * 0.08);
  for (let i = 0; i < 260; i++) {
    ctx.fillStyle = `rgba(${local() < 0.6 ? '96,72,44' : '58,54,44'},${0.1 + local() * 0.24})`;
    ctx.beginPath(); ctx.arc(cx + (local() - 0.5) * R * 1.9, cy + (local() - 0.5) * R * 1.9, 0.6 + local() * 2.6, 0, Math.PI * 2); ctx.fill();
  }
  // minute track
  ctx.strokeStyle = 'rgba(38,34,28,0.72)';
  ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.935, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.895, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(30,28,24,0.8)';
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const inner = i % 5 === 0 ? R * 0.80 : R * 0.853;
    const outer = R * 0.888;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(a);
    ctx.fillRect(inner === R * 0.80 ? -3.2 : -1.15, -outer, inner === R * 0.80 ? 6.4 : 2.3, outer - inner);
    ctx.restore();
  }
  // roman numerals
  const nums = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
    const r = R * 0.7;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    ctx.font = `${i === 0 ? 92 : 82}px Georgia, "Times New Roman", serif`;
    ctx.fillStyle = 'rgba(28,26,22,0.86)';
    ctx.fillText(nums[i], x, y + (i === 0 ? 2 : 0));
  }
  // brand and station
  ctx.font = '30px Georgia, "Times New Roman", serif';
  ctx.fillStyle = 'rgba(48,42,32,0.72)';
  ctx.fillText('MERIDIAN & NORTHERN', cx, cy - R * 0.36);
  ctx.font = '25px Georgia, "Times New Roman", serif';
  ctx.fillText('ASHCOMBE', cx, cy + R * 0.4);
  ctx.font = '15px Georgia, "Times New Roman", serif';
  letterSpaced(ctx, 'RAILWAY CLOCK', cx, cy + R * 0.47, 5);
  // hairline crack
  ctx.strokeStyle = 'rgba(70,62,50,0.4)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  let x = cx + R * 0.15, y = cy - R * 0.35;
  ctx.moveTo(x, y);
  for (let k = 0; k < 7; k++) { x += (local() - 0.3) * 60; y += 34 + local() * 26; ctx.lineTo(x, y); }
  ctx.stroke();
  // outer enamel rim grime
  ctx.strokeStyle = 'rgba(70,54,34,0.35)';
  ctx.lineWidth = 16;
  ctx.beginPath(); ctx.arc(cx, cy, R - 8, 0, Math.PI * 2); ctx.stroke();
  return canvasTexture(c, { srgb: true, clamp: true, aniso: MAX_ANISO });
}
function letterSpaced(ctx, text, cx, cy, tracking) {
  const w = trackedWidth(ctx, text, tracking);
  trackedText(ctx, text, cx - w / 2, cy + 10, tracking);
}

function makeWeed() {
  const S = 512;
  const c = makeCanvas(S, S), ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ 0xd00d);
  ctx.clearRect(0, 0, S, S);
  const baseX = S * 0.5, baseY = S * 0.985;
  for (let i = 0; i < 30; i++) {
    const spread = (local() - 0.5) * 1.35;
    const tipX = baseX + spread * S * 0.42;
    const tipY = S * (0.04 + local() * 0.5);
    const ctrlX = baseX + spread * S * 0.16 + (local() - 0.5) * 40;
    const ctrlY = S * (0.5 + local() * 0.2);
    const stemW = 1.4 + local() * 3.6;
    const dry = local();
    let col;
    if (dry < 0.27) col = [116, 104, 64];
    else if (dry < 0.62) col = [78, 88, 52];
    else if (dry < 0.86) col = [64, 74, 44];
    else col = [96, 88, 56];
    ctx.strokeStyle = rgba(col, 0.82 + local() * 0.18);
    ctx.lineCap = 'round';
    const steps = 16;
    let px = baseX, py = baseY;
    for (let s = 1; s <= steps; s++) {
      const t = s / steps;
      const x = (1 - t) * (1 - t) * baseX + 2 * (1 - t) * t * ctrlX + t * t * tipX;
      const y = (1 - t) * (1 - t) * baseY + 2 * (1 - t) * t * ctrlY + t * t * tipY;
      ctx.lineWidth = Math.max(0.5, stemW * (1 - t * 0.92));
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
      px = x; py = y;
    }
    if (local() < 0.4) {
      ctx.fillStyle = rgba([96, 88, 58], 0.9);
      ctx.beginPath(); ctx.ellipse(tipX, tipY, 2.4 + local() * 4.6, 6 + local() * 14, spread, 0, Math.PI * 2); ctx.fill();
    }
  }
  // small dark base clump
  for (let i = 0; i < 20; i++) {
    ctx.strokeStyle = 'rgba(46,50,32,0.75)';
    ctx.lineWidth = 0.8 + local() * 1.4;
    ctx.beginPath();
    const x = baseX + (local() - 0.5) * S * 0.3;
    ctx.moveTo(x, baseY);
    ctx.lineTo(x + (local() - 0.5) * 44, baseY - 40 - local() * 90);
    ctx.stroke();
  }
  return canvasTexture(c, { srgb: true, clamp: true, aniso: MAX_ANISO });
}

function makeWaterNormal() {
  const S = 512;
  const hc = makeCanvas(S, S), hctx = hc.getContext('2d');
  const img = hctx.createImageData(S, S);
  const d = img.data;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const u = x / S, v = y / S;
      const n = fbm2(u * 5.0 + 3.0, v * 5.0 - 1.0, 4) * 0.6 +
        fbm2(u * 17.0 - 6.0, v * 17.0 + 4.0, 3) * 0.3 +
        fbm2(u * 42.0, v * 42.0, 2) * 0.1;
      const val = 120 + (n - 0.5) * 70;
      const i = (y * S + x) * 4;
      d[i] = val; d[i + 1] = val; d[i + 2] = val; d[i + 3] = 255;
    }
  }
  hctx.putImageData(img, 0, 0);
  return canvasTexture(heightToNormal(hc, 1.15), { aniso: MAX_ANISO });
}

function makeStreakDecal(seedOff, tint) {
  const W2 = 512, H2 = 1024;
  const c = makeCanvas(W2, H2), ctx = c.getContext('2d');
  const local = mulberry32(SEED ^ seedOff);
  ctx.clearRect(0, 0, W2, H2);
  for (let i = 0; i < 46; i++) {
    const x = local() * W2;
    const len = H2 * (0.25 + local() * 0.72);
    const wid = 2 + local() * 26;
    const g = ctx.createLinearGradient(x - wid, 0, x + wid, 0);
    const col = tint || (local() < 0.55 ? '70,54,36' : '40,42,36');
    g.addColorStop(0, `rgba(${col},0)`);
    g.addColorStop(0.5, `rgba(${col},${0.05 + local() * 0.16})`);
    g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(x - wid, 0, wid * 2, len);
    ctx.fillStyle = `rgba(${col},${0.09 + local() * 0.14})`;
    ctx.fillRect(x - 1 + local() * 2, len * 0.4, 1 + local() * 2.4, len * (0.2 + local() * 0.5));
  }
  for (let i = 0; i < 26; i++) softBlotch(ctx, local() * W2, local() * H2, 10 + local() * 70, 8 + local() * 40, tint || [60, 52, 36], 0.05 + local() * 0.12);
  grainCanvas(ctx, W2, H2, 0.02, mulberry32(SEED ^ (seedOff + 1)));
  return canvasTexture(c, { srgb: true, clamp: true, aniso: MAX_ANISO });
}

function makePaper() {

  ctx.fill();

  ctx.fillText('THE NORTHERN', 36, 92);

  // torn edge
  ctx.globalCompositeOperation = 'destination-out';

    const t = i / 30;
    const x = 12 + t * (S - 24);
    const y = S - 10 + (local() - 0.5) * 46;
    ctx.beginPath(); ctx.arc(x, y, 10 + local() * 22, 0, Math.PI * 2); ctx.fill();
  }

}

function makePoster(variant) {
  const W2 = 512, H2 = 720;

    { bg: '#2c3f4d', band: '#d8c690', ink: '#efe8d2', accent: '#b4492e', title: 'BY TRAIN', sub: 'TO THE COAST' },
    { bg: '#cbbf9c', band: '#334a40', ink: '#26332d', accent: '#9c452c', title: 'SEASIDE', sub: 'EXCURSIONS' },
    { bg: '#5a3030', band: '#d9cba6', ink: '#e8dfc6', accent: '#2c3f4d', title: 'THE MOORS', sub: 'BY RAIL' },
  ];

  } else if (variant % 3 === 0) {
    ctx.fillStyle = s.accent;
    ctx.beginPath(); ctx.moveTo(90, 520); ctx.lineTo(W2 / 2, 360); ctx.lineTo(W2 - 90, 520); ctx.closePath(); ctx.fill();
    ctx.fillStyle = s.ink;
    for (let i = 0; i < 4; i++) ctx.fillRect(80, 552 + i * 20, W2 - 160, 5);
  } else {
    ctx.fillStyle = s.accent;

      ctx.beginPath();
      ctx.moveTo(60, 400 + i * 30); ctx.lineTo(W2 / 2, 330 + i * 8); ctx.lineTo(W2 - 60, 400 + i * 30);
      ctx.lineTo(W2 - 60, 418 + i * 30); ctx.lineTo(W2 / 2, 352 + i * 8); ctx.lineTo(60, 418 + i * 30);

  ctx.fillStyle = s.ink;
  ctx.font = '600 26px Georgia, "Times New Roman", serif';

  // aging and tears
  for (let i = 0; i < 26; i++) softBlotch(ctx, local() * W2, local() * H2, 6 + local() * 80, 5 + local() * 60, [92, 76, 48], 0.04 + local() * 0.14);
  ctx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 22; i++) {
    const edge = local();
    const x = edge < 0.5 ? local() * 70 : W2 - local() * 70;
    const y = local() < 0.5 ? local() * 120 : H2 - local() * 120;
    ctx.beginPath(); ctx.arc(x, y, 4 + local() * 26, 0, Math.PI * 2); ctx.fill();

}

function makeContactShadow() {

function makeGrate() {

/* ---------- floor wetness: puddles follow unevenness, joints and drains ---------- */
const FLOOR_WET = { w: 512, h: 1024, data: null, at(x, z) { return 0; } };
function makeFloorWetness() {
  const w = 512, h = 1024;
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  const outlets = [
    [12.55, -18.0, 3.2], [-12.55, 8.0, 3.0], [15.2, -64.2, 2.6], [-22.0, 44.0, 2.2],
  ];
  const chainBase = [9.1, 11.5, 2.5];
  const puddleSeeds = [
    [-7.0, 35.0, 4.6, 2.8, 0.95],
    [8.2, 29.5, 3.8, 2.3, 0.9],
    [-9.6, 14.0, 4.0, 2.7, 0.85],
    [9.4, -7.5, 4.5, 2.9, 0.9],
    [-6.4, -26.0, 4.0, 2.6, 0.8],
    [5.4, -44.0, 3.6, 2.4, 0.85],
    [-4.0, -55.5, 3.2, 2.1, 0.8],
    [-2.8, 20.0, 3.0, 2.0, 0.75],
    [4.0, 8.0, 3.2, 2.2, 0.8],
  ];
  const joints = [];
  for (let i = 0; i < 13; i++) joints.push(archZ(i));
  for (let y = 0; y < h; y++) {
    const z = W.rearZ - (y + 0.5) / h * W.floorLength;
    for (let x = 0; x < w; x++) {
      const wx = -W.floorHalfX + (x + 0.5) / w * (W.floorHalfX * 2);
      const i = (y * w + x) * 4;
      // floor unevenness: broad fbm plus a couple of settled depressions
      const uneven = fbm2(wx * 0.062 + 4.1, z * 0.062 + 9.7, 4) * 0.6 +
        fbm2(wx * 0.17 - 3.0, z * 0.17 + 2.0, 3) * 0.3 +
        fbm2(wx * 0.5 + 8.0, z * 0.5 + 7.0, 2) * 0.1;
      const low = smoothstep(0.40, 0.66, uneven);
      let wet = low;
      // water settles along expansion joints
      {
        let zz = (z - W.firstArchZ) % W.bay;
        if (zz < 0) zz += W.bay;
        const dz = Math.min(zz, W.bay - zz);
        wet += Math.exp(-(dz * dz) / (0.55 * 0.55)) * 0.22;
      }
      // long shallow hollows beside the platform bases and the buried rails
      wet += Math.exp(-Math.pow((Math.abs(wx) - 12.7) / 0.9, 2)) * 0.26;
      wet += Math.exp(-Math.pow((Math.abs(wx) - 10.6) / 1.1, 2)) * 0.20;
      // central drainage channel
      wet += Math.exp(-Math.pow(wx / 0.75, 2)) * 0.42;
      // runoff pools at pipe outlets and chain base
      for (const o of outlets) {
        const dx = (wx - o[0]) / o[2], dz = (z - o[1]) / (o[2] * 1.4);
        wet += Math.exp(-(dx * dx + dz * dz) * 1.4) * 0.62;
      }
      {
        const dx = (wx - chainBase[0]) / chainBase[2], dz = (z - chainBase[1]) / (chainBase[2] * 1.6);
        wet += Math.exp(-(dx * dx + dz * dz) * 1.5) * 0.55;
      }
      for (let pi = 0; pi < puddleSeeds.length; pi++) {
        const pd = puddleSeeds[pi];
        const dx = (wx - pd[0]) / pd[2];
        const dz = (z - pd[1]) / pd[3];
        wet += Math.exp(-(dx * dx + dz * dz) * 1.15) * pd[4];
      }
      // standing water under the open bays (rain reaches the floor there)
      wet += smoothstep(0.5, 0.72, fbm2(wx * 0.09 + 21.0, z * 0.09 - 6.0, 3)) * 0.18;
      wet = clamp(wet, 0, 1);
      const water = smoothstep(0.38, 0.78, wet) * (0.35 + low * 0.65);
      // dirt: fine debris gathered at joints, edges and the platform line
      let dirt = 0.25 + fbm2(wx * 0.4 + 12.0, z * 0.4 + 2.0, 3) * 0.3;
      {
        let zz = (z - W.firstArchZ) % W.bay;
        if (zz < 0) zz += W.bay;
        const dz = Math.min(zz, W.bay - zz);
        dirt += Math.exp(-(dz * dz) / (0.09)) * 0.5;
      }
      dirt += Math.exp(-Math.pow((Math.abs(wx) - 12.9) / 0.4, 2)) * 0.4;
      dirt = clamp(dirt, 0, 1);
      d[i] = clamp(water, 0, 1) * 255;
      d[i + 1] = clamp(dirt, 0, 1) * 255;
      d[i + 2] = clamp(smoothstep(0.3, 0.75, wet), 0, 1) * 255;
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  FLOOR_WET.w = w; FLOOR_WET.h = h; FLOOR_WET.data = d;
  FLOOR_WET.at = function (x, z) {
    const u = (x + W.floorHalfX) / (W.floorHalfX * 2);
    const v = (W.rearZ - z) / W.floorLength;
    if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
    const px = clamp((u * w) | 0, 0, w - 1), py = clamp((v * h) | 0, 0, h - 1);
    return d[(py * w + px) * 4] / 255;
  };
  const t = canvasTexture(c, { clamp: true, aniso: 4 });
  t.flipY = false;
  return t;
}

/* ==========================================================================
   SMALL, FAST BLOOM (bright pass + separable blur at quarter resolution)
   ========================================================================== */
class BloomLite {
  constructor(threshold = 1.0, strength = 0.55, radius = 1.0) {
    this.enabled = true;
    this.needsSwap = false;
    this.threshold = threshold;
    this.strength = strength;
    this.radius = radius;
    this.w = 1; this.h = 1;
    const rtOpts = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false };
    this.rtA = new THREE.WebGLRenderTarget(1, 1, rtOpts);
    this.rtB = new THREE.WebGLRenderTarget(1, 1, rtOpts);
    this.quad = new FullScreenQuad();
    this.brightMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uThreshold: { value: threshold } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform sampler2D tDiffuse;
        uniform float uThreshold;
        varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          float l = max(max(c.r, c.g), c.b);
          float k = smoothstep(uThreshold, uThreshold * 1.7, l);
          gl_FragColor = vec4(c * k, 1.0);
        }
      `,
      depthTest: false, depthWrite: false,
    });
    this.blurMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(1, 0) } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform sampler2D tDiffuse;
        uniform vec2 uDir;
        varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb * 0.227027;
          c += texture2D(tDiffuse, vUv + uDir * 1.3846).rgb * 0.316216;
          c += texture2D(tDiffuse, vUv - uDir * 1.3846).rgb * 0.316216;
          c += texture2D(tDiffuse, vUv + uDir * 3.2308).rgb * 0.070270;
          c += texture2D(tDiffuse, vUv - uDir * 3.2308).rgb * 0.070270;
          gl_FragColor = vec4(c, 1.0);
        }
      `,
      depthTest: false, depthWrite: false,
    });
    this.compMat = new THREE.ShaderMaterial({
      uniforms: { tBloom: { value: null }, uStrength: { value: strength } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform sampler2D tBloom;
        uniform float uStrength;
        varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tBloom, vUv).rgb;
          gl_FragColor = vec4(c * uStrength, 1.0);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthTest: false,
      depthWrite: false,
    });
  }
  setSize(w, h) {
    this.w = Math.max(2, Math.floor(w * 0.25));
    this.h = Math.max(2, Math.floor(h * 0.25));
    this.rtA.setSize(this.w, this.h);
    this.rtB.setSize(this.w, this.h);
  }
  render(renderer, writeBuffer, readBuffer) {
    if (!this.enabled) return;
    const prevAuto = renderer.autoClear;
    renderer.autoClear = false;
    const prevRT = renderer.getRenderTarget();
    this.brightMat.uniforms.tDiffuse.value = readBuffer.texture;
    this.quad.material = this.brightMat;
    renderer.setRenderTarget(this.rtA);
    renderer.clear(true, false, false);
    this.quad.render(renderer);
    this.blurMat.uniforms.tDiffuse.value = this.rtA.texture;
    this.blurMat.uniforms.uDir.value.set(1 / this.w, 0);
    this.quad.material = this.blurMat;
    renderer.setRenderTarget(this.rtB);
    renderer.clear(true, false, false);
    this.quad.render(renderer);
    this.blurMat.uniforms.tDiffuse.value = this.rtB.texture;
    this.blurMat.uniforms.uDir.value.set(0, 1 / this.h);
    this.quad.material = this.blurMat;
    renderer.setRenderTarget(this.rtA);
    renderer.clear(true, false, false);
    this.quad.render(renderer);
    this.compMat.uniforms.tBloom.value = this.rtA.texture;
    this.quad.material = this.compMat;
    renderer.setRenderTarget(readBuffer);
    this.quad.render(renderer);
    renderer.setRenderTarget(prevRT);
    renderer.autoClear = prevAuto;
  }
}

function targetRenderScale() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
  const cssPx = Math.max(1, window.innerWidth * window.innerHeight);
  const maxPx = DEBUG.low ? 0.9e6 : 1.3e6;
  let scale = dpr;
  if (cssPx * scale * scale > maxPx) scale = Math.sqrt(maxPx / cssPx);
  return clamp(scale, 0.6, 1.6);
}

function initRenderer() {

    canvas: DOM.canvas,
    antialias: false,
    stencil: false,
    alpha: false,
    powerPreference: 'high-performance',

  });
  if (!renderer.capabilities.isWebGL2) {
    DOM.fatal.classList.add('on');
    throw new Error('WebGL2 unavailable');
  }
  MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  RENDER_SCALE = DEBUG.dpr > 0 ? DEBUG.dpr : targetRenderScale();
  renderer.setPixelRatio(RENDER_SCALE);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;

const FinalShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uExposure: { value: 1.46 },
    uVignette: { value: 1.0 },
    uGrain: { value: 0.03 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uExposure;
    uniform float uVignette;
    uniform float uGrain;
    varying vec2 vUv;
    vec3 aces(vec3 x){
      float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }
    vec3 toSRGB(vec3 c){
      return mix(12.92 * c, 1.055 * pow(max(c, vec3(0.0)), vec3(0.41666)) - 0.055, step(vec3(0.0031308), c));
    }
    float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main(){
      vec2 uv = vUv;
      // a whisper of edge aberration, photographic rather than graphic
      vec2 q = uv - 0.5;
      vec2 dir = q * 0.0012;
      vec3 c;
      c.r = texture2D(tDiffuse, uv + dir).r;
      c.g = texture2D(tDiffuse, uv).g;
      c.b = texture2D(tDiffuse, uv - dir).b;
      c = aces(c * uExposure);
      c = toSRGB(c);
      // photographic S-curve and split-tone: cool shadows, warm highlights
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      vec3 contrast = c * c * (3.0 - 2.0 * c);
      c = mix(c, contrast, 0.2);
      float l2 = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c += vec3(-0.008, -0.003, 0.009) * (1.0 - smoothstep(0.0, 0.5, l2));
      c = mix(c, c * vec3(1.04, 1.008, 0.968), smoothstep(0.35, 0.95, l2) * 0.8);
      c = mix(vec3(dot(c, vec3(0.2126, 0.7152, 0.0722))), c, 1.13);
      float vig = 1.0 - dot(q, q) * 0.38 * uVignette;
      c *= vig;
      // fine animated grain, strongest in the shadows
      float g = hash(uv * vec2(1733.7, 977.3) + fract(uTime) * 41.0) - 0.5;
      c += g * uGrain * (1.15 - l * 0.6);
      // gentle dither to stop banding in the haze
      c += (hash(uv * vec2(811.3, 631.7) + fract(uTime * 1.7)) - 0.5) * 0.002;
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    }
  `,
};

function initPost() {

  const h = Math.floor(window.innerHeight * RENDER_SCALE);

  let rt;

  rt = new THREE.WebGLRenderTarget(w, h, rtOptions);

/* mirror camera for the floor reflection (oblique-clipped like a real reflector) */
const _refl = {
  normal: new THREE.Vector3(0, 1, 0),
  planePoint: new THREE.Vector3(0, 0, 0),
  view: new THREE.Vector3(),
  target: new THREE.Vector3(),
  lookAt: new THREE.Vector3(0, 0, -1),
  rot: new THREE.Matrix4(),
  clipPlane: new THREE.Vector4(),
  q: new THREE.Vector4(),
  floorPos: new THREE.Vector3(0, 0, 0),
  camPos: new THREE.Vector3(),
};
function updateReflection() {
  if (!REFLECT.enabled || !REFLECT.rt || !REFLECT.floorMesh) return;
  const vc = REFLECT.cam;
  const normal = _refl.normal.set(0, 1, 0);
  const p = _refl.planePoint.set(0, 0, 0);
  camera.updateMatrixWorld();
  _refl.camPos.setFromMatrixPosition(camera.matrixWorld);
  _refl.view.subVectors(p, _refl.camPos);
  if (_refl.view.dot(normal) > -0.001) return;
  _refl.view.reflect(normal).negate().add(p);
  _refl.rot.extractRotation(camera.matrixWorld);
  _refl.lookAt.set(0, 0, -1).applyMatrix4(_refl.rot).add(_refl.camPos);
  _refl.target.subVectors(p, _refl.lookAt).reflect(normal).negate().add(p);
  vc.position.copy(_refl.view);
  vc.up.set(0, 1, 0).applyMatrix4(_refl.rot).reflect(normal);
  vc.lookAt(_refl.target);
  vc.far = camera.far;
  vc.near = camera.near;
  vc.updateMatrixWorld();
  vc.projectionMatrix.copy(camera.projectionMatrix);

  REFLECT.textureMatrix.set(
    0.5, 0.0, 0.0, 0.5,
    0.0, 0.5, 0.0, 0.5,
    0.0, 0.0, 0.5, 0.5,
    0.0, 0.0, 0.0, 1.0,
  );
  REFLECT.textureMatrix.multiply(vc.projectionMatrix);
  REFLECT.textureMatrix.multiply(vc.matrixWorldInverse);

  // oblique near-plane clipping against the floor plane
  const plane = REFLECT.plane.setFromNormalAndCoplanarPoint(normal, p);
  plane.applyMatrix4(vc.matrixWorldInverse);
  const clip = _refl.clipPlane.set(plane.normal.x, plane.normal.y, plane.normal.z, plane.constant);
  const pm = vc.projectionMatrix;
  const q = _refl.q;
  q.x = (Math.sign(clip.x) + pm.elements[8]) / pm.elements[0];
  q.y = (Math.sign(clip.y) + pm.elements[9]) / pm.elements[5];
  q.z = -1.0;
  q.w = (1.0 + pm.elements[10]) / pm.elements[14];
  clip.multiplyScalar(2.0 / clip.dot(q));
  pm.elements[2] = clip.x;
  pm.elements[6] = clip.y;
  pm.elements[10] = clip.z + 1.0;
  pm.elements[14] = clip.w;

  const prevRT = renderer.getRenderTarget();
  const prevShadow = renderer.shadowMap.autoUpdate;
  const prevFloorVisible = REFLECT.floorMesh.visible;
  renderer.shadowMap.autoUpdate = false;
  REFLECT.floorMesh.visible = false;
  renderer.setRenderTarget(REFLECT.rt);
  renderer.clear();
  renderer.render(scene, vc);
  REFLECT.floorMesh.visible = prevFloorVisible;
  renderer.shadowMap.autoUpdate = prevShadow;
  renderer.setRenderTarget(prevRT);
}

function resizeRenderer() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(RENDER_SCALE);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (composer) {
    const iw = Math.floor(w * RENDER_SCALE), ih = Math.floor(h * RENDER_SCALE);
    composer.setPixelRatio(RENDER_SCALE);
    composer.setSize(w, h);
    if (REFLECT.rt) {
      const rw = clamp(Math.round(iw * 0.5), 320, 1280);
      const rh = clamp(Math.round(ih * 0.5), 200, 800);
      REFLECT.width = rw; REFLECT.height = rh;
      REFLECT.rt.setSize(rw, rh);
    }
  }
}
function recomputeRenderScale() {
  RENDER_SCALE = (DEBUG.dpr > 0 ? DEBUG.dpr : targetRenderScale()) * qualityFactor;
}

/* vertex colours used as cheap baked occlusion / soot on merged architecture */
function applyTone(geo, fn) {
  const pos = geo.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const k = clamp(fn(pos.getX(i), pos.getY(i), pos.getZ(i)), 0, 1);
    cols[i * 3] = k; cols[i * 3 + 1] = k; cols[i * 3 + 2] = k;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  return geo;
}
function wallTone(x, y, z) {
  const high = smoothstep(12.0, 8.5, y) * 0.3 + 0.7;      // soot high up
  const low = smoothstep(0.0, 2.6, y) * 0.4 + 0.6;        // damp base
  const recess = 0.96;
  return high * low * recess;
}
function addMerged(list, mat, opts = {}) {
  const geo = mergeList(list, opts.name);
  if (!geo) return null;
  if (opts.tone) applyTone(geo, opts.tone);
  const m = makeMesh(geo, mat, opts);
  if (opts.layer !== undefined) m.layers.set(opts.layer);
  (opts.parent || world).add(m);
  return m;
}
function addInstanced(geo, mat, items, opts = {}) {
  const inst = new THREE.InstancedMesh(geo, mat, items.length);
  const m4 = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  const p = new THREE.Vector3();
  const s = new THREE.Vector3();
  let coloured = false;
  items.forEach((it, i) => {
    p.set(it.p[0], it.p[1], it.p[2]);
    if (it.q) q.copy(it.q);
    else { e.set(it.r ? it.r[0] : 0, it.r ? it.r[1] : 0, it.r ? it.r[2] : 0); q.setFromEuler(e); }
    const sc = it.s === undefined ? 1 : it.s;
    if (Array.isArray(sc)) s.set(sc[0], sc[1], sc[2]); else s.set(sc, sc, sc);
    m4.compose(p, q, s);
    inst.setMatrixAt(i, m4);
    if (it.c) { inst.setColorAt(i, new THREE.Color(it.c[0], it.c[1], it.c[2])); coloured = true; }
  });
  inst.instanceMatrix.needsUpdate = true;
  if (coloured && inst.instanceColor) inst.instanceColor.needsUpdate = true;
  inst.castShadow = opts.cast !== false;
  inst.receiveShadow = opts.receive !== false;
  if (opts.name) inst.name = opts.name;
  if (opts.layer !== undefined) inst.layers.set(opts.layer);
  (opts.parent || world).add(inst);
  return inst;
}
function addContactShadow(x, z, sx, sz, rot = 0, y = 0.012) {
  const g = new THREE.PlaneGeometry(sx, sz);
  g.rotateX(-Math.PI / 2);
  g.rotateY(rot);
  g.translate(x, y, z);
  return g;
}
