<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c0f0e'/%3E%3Cpath d='M1 11 L16 5' stroke='%23e9dcc4' stroke-width='1.4'/%3E%3Cpath d='M1 13 L16 7' stroke='%23c8a98a' stroke-width='.7' opacity='.7'/%3E%3C/svg%3E">
<title>Salt Mirror — A Coastal Saltworks</title>
<style>
  :root{
    --ink: #f0ece3;
    --ink-dim: rgba(240,236,227,.62);
    --ink-faint: rgba(240,236,227,.36);
    --hair: rgba(240,236,227,.20);
    --hair-soft: rgba(240,236,227,.11);
    --warm: #e9d3ab;
    --glass: rgba(17,20,18,.34);
    --glass-hi: rgba(30,34,30,.52);
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:#0a0c0b; overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  body{ font-family:var(--sans); color:var(--ink); overscroll-behavior:none; }
  #stage{
    display:block; position:fixed; inset:0; width:100%; height:100%;
    outline:none; cursor:grab; touch-action:none;
    opacity:0; transition:opacity 2.6s cubic-bezier(.32,0,.2,1);
    background:#0a0c0b;
  }
  #stage.ready{ opacity:1; filter:saturate(1.14) contrast(1.06) brightness(1.005); }
  #stage.dragging{ cursor:grabbing; }

  /* photographic grade over the render: gentle falloff, cool edges, warm centre */
  #grade{
    position:fixed; inset:0; pointer-events:none; z-index:3;
    background:
      radial-gradient(128% 108% at 50% 44%, rgba(0,0,0,0) 40%, rgba(7,10,9,.14) 72%, rgba(3,6,5,.40) 100%),
      linear-gradient(to bottom, rgba(7,10,10,.18), rgba(7,10,10,0) 16%, rgba(7,10,10,0) 76%, rgba(4,7,6,.24));
  }
  #grain{
    position:fixed; inset:0; pointer-events:none; z-index:4;
    opacity:.05; mix-blend-mode:overlay;
  }

  #ui{
    position:fixed; inset:0; z-index:6; pointer-events:none;
    opacity:1; transition:opacity 1.5s ease;
  }
  #ui.faded{ opacity:0; transition:opacity 2.2s ease; }

  /* ---------- lower-left title ---------- */
  #title{
    position:fixed; left:clamp(18px,3.2vw,46px); bottom:clamp(20px,3.6vh,40px);
    pointer-events:none; max-width:min(440px,62vw);
    text-shadow:0 1px 18px rgba(6,10,8,.55);
  }
  #title .eyebrow{
    display:block; font-size:10px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--ink-dim); margin-bottom:10px;
  }
  #title h1{
    margin:0; font-family:var(--serif); font-weight:400;
    font-size:clamp(24px,3.1vw,40px); line-height:1.02;
    letter-spacing:.20em; text-transform:uppercase; color:var(--ink);
  }
  #title .rule{
    display:block; width:44px; height:1px; margin:14px 0 12px;
    background:linear-gradient(to right, var(--hair), rgba(240,236,227,0));
  }
  #title .sub{
    display:block; font-family:var(--serif); font-style:italic;
    font-size:clamp(12px,1.05vw,15px); line-height:1.45;
    letter-spacing:.015em; color:var(--ink-dim);
  }

  /* ---------- lower-right controls ---------- */
  #controls{
    position:fixed; right:clamp(16px,3.0vw,42px); bottom:clamp(20px,3.6vh,40px);
    display:flex; flex-direction:column; align-items:flex-end; gap:10px;
    pointer-events:none;
  }
  #buttons{
    display:flex; align-items:center; gap:6px; pointer-events:auto;
    padding:5px; border:1px solid var(--hair-soft); border-radius:999px;
    background:var(--glass); backdrop-filter:blur(10px) saturate(.9);
    -webkit-backdrop-filter:blur(10px) saturate(.9);
  }
  #buttons button{
    appearance:none; -webkit-appearance:none; border:0; cursor:pointer;
    font-family:var(--sans); font-size:9.5px; font-weight:500;
    letter-spacing:.20em; text-transform:uppercase; color:var(--ink-dim);
    background:transparent; border-radius:999px; padding:9px 13px 8px;
    transition:color .35s ease, background-color .35s ease;
  }
  #buttons button:hover{ color:var(--ink); background:rgba(240,236,227,.055); }
  #buttons button:focus-visible{ outline:1px solid rgba(240,236,227,.55); outline-offset:2px; color:var(--ink); }
  #buttons button[aria-pressed="true"]{ color:var(--warm); background:rgba(233,211,171,.08); }
  #buttons .sep{ width:1px; height:16px; background:var(--hair-soft); margin:0 2px; }
  #hint{
    font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-faint); padding-right:8px; pointer-events:none;
    transition:opacity .8s ease;
  }

  /* ---------- load veil ---------- */
  #veil{
    position:fixed; inset:0; z-index:20; background:#0a0c0b;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 1.9s ease, visibility 0s linear 1.9s;
  }
  #veil.done{ opacity:0; visibility:hidden; pointer-events:none; }
  #veil .inner{ text-align:center; transform:translateY(-2vh); }
  #veil .kicker{
    font-size:9.5px; letter-spacing:.42em; text-transform:uppercase;
    color:rgba(240,236,227,.34); margin-bottom:16px;
  }
  #veil .name{
    font-family:var(--serif); font-weight:400; font-size:clamp(22px,3vw,34px);
    letter-spacing:.26em; text-transform:uppercase; color:rgba(240,236,227,.80);
  }
  #veil .bar{
    width:120px; height:1px; margin:22px auto 0; background:rgba(240,236,227,.12);
    overflow:hidden;
  }
  #veil .bar i{
    display:block; width:40%; height:100%; background:rgba(233,211,171,.6);
    transform:translateX(-110%); animation:load 2.2s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes load{ 0%{transform:translateX(-110%)} 55%{transform:translateX(160%)} 100%{transform:translateX(160%)} }
  #err{
    position:fixed; left:50%; bottom:8vh; transform:translateX(-50%); z-index:30;
    max-width:min(640px,86vw); padding:12px 16px; display:none;
    font-size:12px; line-height:1.5; color:#f3dede;
    background:rgba(40,14,14,.86); border:1px solid rgba(243,222,222,.18); border-radius:6px;
  }
  @media (max-width:760px){
    #title h1{ letter-spacing:.14em; }
    #hint{ display:none; }
    #buttons button{ padding:9px 10px 8px; letter-spacing:.14em; }
    #title{ max-width:74vw; }
  }
  @media (pointer:coarse){
    #hint{ display:none; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Salt Mirror — a coastal saltworks rendered in real time" tabindex="0"></canvas>
<div id="grade" aria-hidden="true"></div>
<canvas id="grain" aria-hidden="true"></canvas>

<div id="ui">
  <div id="title">
    <span class="eyebrow">Coastal Saltworks · Evaporation Pans</span>
    <h1>Salt Mirror</h1>
    <span class="rule"></span>
    <span class="sub">First light, and the cloud gap crossing the brine.</span>
  </div>
  <div id="controls">
    <div id="hint">Drag to orbit · scroll to zoom</div>
    <div id="buttons" role="group" aria-label="Scene controls">
      <button id="btn-cinematic" type="button" aria-pressed="true" title="Toggle the slow cinematic glide">Cinematic</button>
      <button id="btn-reset" type="button" title="Restore the opening view">Reset view</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-pause" type="button" aria-pressed="false" title="Freeze scene time">Pause</button>
      <button id="btn-sound" type="button" aria-pressed="false" title="Enable procedural sound">Sound</button>
    </div>
  </div>
</div>

<div id="veil"><div class="inner">
  <div class="kicker">A real-time study in brine &amp; light</div>
  <div class="name">Salt Mirror</div>
  <div class="bar"><i></i></div>
</div></div>
<div id="err" role="alert"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">

/* ===================== 00_core.js ===================== */
/* SALT MIRROR — core: deterministic helpers, renderer, scene, camera, shared uniforms. */

import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------------------
// deterministic pseudo-randomness (seed 1337)
// ---------------------------------------------------------------------------
const SEED = 1337;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rand = mulberry32(SEED);
const randIn = (a, b) => a + (b - a) * rand();
const randInt = (a, b) => a + Math.floor((b - a + 1) * rand());
const chance = (p) => rand() < p;
const pick = (arr) => arr[Math.min(arr.length - 1, Math.floor(rand() * arr.length))];

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const smootherstep = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * t * (t * (t * 6 - 15) + 10);
};
const DEG = Math.PI / 180;

function hash2i(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// smooth 2D value noise + fbm (deterministic, used for textures & placement)
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2i(xi, yi), b = hash2i(xi + 1, yi);
  const c = hash2i(xi, yi + 1), d = hash2i(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

function fbm2(x, y, oct = 4, lac = 2.03, gain = 0.5) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    s += vnoise(x * f, y * f) * amp;
    norm += amp;
    amp *= gain; f *= lac;
  }
  return s / norm;
}

// ---------------------------------------------------------------------------
// configuration
// ---------------------------------------------------------------------------
const CFG = {
  seed: SEED,
  // detailed saltworks + beach (metres). x east, z south, y up.
  field: { x0: -54, x1: 54, z0: -39.5, z1: 36.5 },
  // layout rows: z bands of basins, north (sea side) first
  rows: [
    { z0: -39.5, z1: -31.2, kind: 'turquoise', wMin: 7.5, wMax: 15.0, gapMin: 1.0, gapMax: 1.5 },
    { z0: -29.8, z1: -22.8, kind: 'turquoise', wMin: 5.0, wMax: 9.5, gapMin: 0.85, gapMax: 1.35 },
    { z0: -21.4, z1: -15.0, kind: 'turquoise', wMin: 4.2, wMax: 8.5, gapMin: 0.8, gapMax: 1.25 },
    { z0: -13.6, z1: -6.4, kind: 'ochre', wMin: 4.2, wMax: 9.0, gapMin: 0.85, gapMax: 1.3 },
    { z0: -5.0, z1: 2.4, kind: 'ochre', wMin: 5.5, wMax: 11.5, gapMin: 0.95, gapMax: 1.45 },
    { z0: 3.8, z1: 12.6, kind: 'pink', wMin: 8.0, wMax: 18.0, gapMin: 1.1, gapMax: 1.6 },
    { z0: 14.0, z1: 23.6, kind: 'pink', wMin: 12.0, wMax: 24.0, gapMin: 1.25, gapMax: 1.8 },
  ],
  // dry, raked salt pan in the foreground (not a basin)
  dryPan: { x0: -34, x1: 4, z0: 24.6, z1: 35.6 },
  plainY: 1.40,
  crestY: 1.545,
  bankRun: 1.15,
  seaY: 0.0,
  sun: { az: 247.0, el: 22.0 },
  camera: { pos: [14, 14, 46], target: [-14, 0.3, 6], fov: 39 },
  wind: { x: 0.842, z: -0.540, speed: 7.4 }, // direction the cloud shadows travel
  cloud: { height: 420, tileMetres: 1500 },
  heroBonus: 1.0,
};

// sun direction (towards the sun), from azimuth (deg from north, clockwise) + elevation
const SUN_AZ = CFG.sun.az * DEG;
const SUN_EL = CFG.sun.el * DEG;
const sunDir = new THREE.Vector3(
  Math.sin(SUN_AZ) * Math.cos(SUN_EL),
  Math.sin(SUN_EL),
  -Math.cos(SUN_AZ) * Math.cos(SUN_EL)
).normalize();

const WIND_DIR = new THREE.Vector2(CFG.wind.x, CFG.wind.z).normalize();
const WIND_SPEED = CFG.wind.speed;

// surface-history map rectangle (shared by terrain + water shaders)
const MACRO = { x0: -66, x1: 66, z0: -49, z1: 40 };

// ---------------------------------------------------------------------------
// renderer / scene / camera
// ---------------------------------------------------------------------------
const canvasEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({
  canvas: canvasEl,
  antialias: true,
  powerPreference: 'high-performance',
  stencil: false,
  preserveDrawingBuffer: false,
});
const DPR_CAP_HI = 1.5;
const DPR_CAP_LO = 0.85;
let dprCap = DPR_CAP_HI;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, dprCap));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setClearColor(0x0a0c0b, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color('#b8c3c2'), 0.00105);

const camera = new THREE.PerspectiveCamera(CFG.camera.fov, window.innerWidth / window.innerHeight, 0.35, 6000);
camera.position.set(...CFG.camera.pos);

// ---------------------------------------------------------------------------
// shared uniforms — one object per value, referenced by every material
// ---------------------------------------------------------------------------
const C = (hex) => new THREE.Color(hex); // sRGB hex -> linear working colour

const U = {
  uTime: { value: 0 },
  uCamPos: { value: new THREE.Vector3() },
  uSunDir: { value: sunDir.clone() },
  uSunColor: { value: C('#ffd9a8') },
  uSunIntensity: { value: 3.05 },
  uSkyZenith: { value: C('#3f6a8c') },
  uSkyHorizon: { value: C('#9aa39b') },
  uSkyHaze: { value: C('#b9bcae') },
  uCloudBright: { value: C('#e2d8c4') },
  uCloudShade: { value: C('#6e7a84') },
  uCloudTex: { value: null },
  uCloudTile: { value: CFG.cloud.tileMetres },
  uCloudOffset: { value: new THREE.Vector2(0, 0) },
  uCloudCover: { value: 0.86 },
  uCloudHeight: { value: CFG.cloud.height },
  uMacroTex: { value: null },
  uMacroRect: { value: new THREE.Vector4(MACRO.x0, MACRO.z0, MACRO.x1, MACRO.z1) },
  uGapCenter: { value: new THREE.Vector2(0, 0) },
  uGapDir: { value: new THREE.Vector2(0.86, -0.51) },
  uGapHalfLen: { value: 24 },
  uGapHalfWid: { value: 15 },
  uGapOpen: { value: 0.0 },
  uWind: { value: new THREE.Vector2(WIND_DIR.x, WIND_DIR.y) },
  uWindStrength: { value: 1.0 },
  uHero: { value: 0.0 },
  uDebug: { value: 0.0 },
  uRipples: {
    value: Array.from({ length: 8 }, () => new THREE.Vector4(0, 0, -1000, 0)),
  },
  uRippleCount: { value: 0 },
  uSluiceA: { value: new THREE.Vector2(0, 0) },
  uSluiceB: { value: new THREE.Vector2(0, 0) },
  uSluiceTop: { value: 2.8 },
  uFogColor: { value: new THREE.Color('#b8c3c2') },
  uFogDensity: { value: 0.00105 },
  uReflectScale: { value: 1.0 },
};

// ---------------------------------------------------------------------------
// global state
// ---------------------------------------------------------------------------
let camRig = null;
let sizeGrain = null;

const state = {
  started: 0,
  t: 0,            // scene time (pauses)
  wall: 0,         // real elapsed seconds
  paused: false,
  ready: false,
  frame: 0,
  fps: 0,
  hero: 0,         // 0..1 gap-over-foreground intensity
  firstFrame: true,
};

const clock = new THREE.Clock();

function now() { return state.t; }

// ---------------------------------------------------------------------------
// resize
// ---------------------------------------------------------------------------
function applySize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, dprCap));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (typeof sizeGrain === 'function') sizeGrain();
}

window.addEventListener('resize', applySize);

// ---------------------------------------------------------------------------
// small scene utilities
// ---------------------------------------------------------------------------
const tmpV = new THREE.Vector3();
const tmpV2 = new THREE.Vector3();
const tmpQ = new THREE.Quaternion();
const tmpM = new THREE.Matrix4();
const UP = new THREE.Vector3(0, 1, 0);

function mat4At(x, y, z, ry = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromAxisAngle(UP, ry);
  m.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(sx, sy, sz));
  return m;
}

// merge an array of {geo, matrix} into one BufferGeometry (single draw call)
function mergeParts(parts) {
  const geos = [];
  for (const p of parts) {
    const g = p.geo.clone();
    if (g.attributes.uv2) g.deleteAttribute('uv2');
    g.applyMatrix4(p.matrix);
    geos.push(g);
  }
  const merged = mergeGeometries(geos, false);
  for (const g of geos) g.dispose();
  return merged;
}

// a rounded box geometry used for timber
function boxGeo(w, h, d, bevel = 0.012) {
  const g = new THREE.BoxGeometry(w, h, d, 1, 1, 1);
  return g;
}

// display error to the user (and console) instead of a silent black screen
function showError(msg) {
  console.error('[salt-mirror]', msg);
  const el = document.getElementById('err');
  if (el) { el.style.display = 'block'; el.textContent = String(msg); }
}
window.addEventListener('error', (e) => {
  if (!state.ready) showError(e.message || 'Failed to start the scene.');
});

// debug / inspection hook
const debugAPI = {
  THREE, scene, camera, renderer, U, CFG, state, sunDir,
  ready: false,
  buildInfo: null,
  setCamera(px, py, pz, tx, ty, tz) {
    if (camRig && camRig.jumpTo) camRig.jumpTo(px, py, pz, tx, ty, tz);
  },
  setCinematic() { if (camRig) camRig.setMode('cinematic'); },
  pause(b) { state.paused = !!b; },
  setTime(t) { state.t = t; U.uTime.value = t; if (typeof syncTimeDeps === 'function') syncTimeDeps(t); },
  setHero(on) { if (typeof forceHero === 'function') forceHero(on); },
  stats() {
    return {
      fps: state.fps,
      calls: renderer.info.render.calls,
      tris: renderer.info.render.triangles,
      time: state.t,
      hero: state.hero,
      dpr: renderer.getPixelRatio(),
    };
  },
};
window.__salt = debugAPI;


/* ===================== 05_layout.js ===================== */
/* SALT MIRROR — saltworks layout: irregular basin rows, gates, sluice line, props. */

// Local RNG stream so layout stays stable if later code consumes the global stream.
function buildLayout() {
  const r = mulberry32(SEED ^ 0x9e3779b9);
  const R = (a, b) => a + (b - a) * r();
  const RI = (a, b) => a + Math.floor((b - a + 1) * r());

  const cells = [];
  const rows = [];
  let id = 0;

  const rowWater = [];
  for (let i = 0; i < CFG.rows.length; i++) rowWater.push(1.305 - i * 0.043);

  // ---------------------------------------------------------------- rows ---
  CFG.rows.forEach((row, ri) => {
    const z0 = row.z0, z1 = row.z1;
    const zc = (z0 + z1) * 0.5;
    const rowCells = [];

    // deliberate foreground hero pond, then two neighbours
    let spans = [];
    if (ri === CFG.rows.length - 1) {
      const hero = { x0: -21.0, x1: 5.5 };
      spans.push([-54.0, hero.x0 - 1.5]);
      spans.push([hero.x0, hero.x1]);
      spans.push([hero.x1 + 1.6, 28.5]);
      spans.push([30.0, 54.0]);
      var forcedHero = hero;
    } else {
      const insetA = ri % 2 === 0 ? 0 : R(0.4, 2.4);
      const insetB = ri % 3 === 1 ? R(0.2, 2.2) : 0;
      let x = CFG.field.x0 + insetA;
      const xEnd = CFG.field.x1 - insetB;
      while (x < xEnd - 3.2) {
        let w = R(row.wMin, row.wMax);
        if (r() < 0.14) w *= 1.55;
        let x1 = x + w;
        if (x1 > xEnd) x1 = xEnd;
        if (x1 - x < 2.6) break;
        spans.push([x, x1]);
        x = x1 + R(row.gapMin, row.gapMax);
      }
      if (spans.length === 0) spans.push([CFG.field.x0, CFG.field.x1]);
    }

    spans.forEach((sp, si) => {
      const isHero = forcedHero && sp[0] === forcedHero.x0 && sp[1] === forcedHero.x1;
      const w = sp[1] - sp[0];
      let kind = row.kind;
      // sparse seasonal variety near the row transitions
      if (!isHero && r() < 0.10) {
        kind = kind === 'ochre' ? (r() < 0.5 ? 'pink' : 'turquoise') : kind === 'pink' ? 'ochre' : 'ochre';
      }
      const depth = isHero ? 0.30 : R(0.20, 0.46) * (ri === 0 ? 1.3 : 1.0);
      const waterY = rowWater[ri] + (isHero ? -0.012 : R(-0.012, 0.012));
      const cell = {
        id: id++,
        row: ri,
        x0: sp[0], x1: sp[1],
        z0, z1,
        cx: (sp[0] + sp[1]) * 0.5,
        cz: zc,
        w, d: z1 - z0,
        waterY,
        depth,
        bedY: waterY - depth,
        kind,
        hero: !!isHero,
        shelter: isHero ? 0.9 : clamp(0.30 + R(0.0, 0.62) * (w < 7 ? 1.15 : 0.8), 0.15, 0.95),
        salinity: clamp((ri / (CFG.rows.length - 1)) * 0.72 + R(-0.12, 0.12), 0.05, 0.98),
        seed: R(0, 1000),
      };
      cells.push(cell);
      rowCells.push(cell);
    });

    rows.push({ z0, z1, cells: rowCells });
  });

  // ------------------------------------------------------ brine tints ---
  const tints = {
    turquoise: { shallow: C('#7fa79e'), deep: C('#3d8b84') },
    ochre: { shallow: C('#a98a58'), deep: C('#a06a2a') },
    pink: { shallow: C('#b07a76'), deep: C('#b05a52') },
  };
  for (const c of cells) {
    const t = tints[c.kind];
    const s1 = t.shallow.clone().offsetHSL(R(-0.012, 0.012), R(-0.05, 0.05), R(-0.03, 0.03));
    const d1 = t.deep.clone().offsetHSL(R(-0.015, 0.015), R(-0.08, 0.08), R(-0.035, 0.035));
    if (c.hero) {
      s1.set('#b07a76');
      d1.set('#b05a52');
    }
    c.shallowCol = s1;
    c.deepCol = d1;
    // selective absorption of the brine; depth + salinity drive the hue
    const take = {
      turquoise: [2.75, 0.42, 0.78],
      ochre: [0.42, 0.92, 2.75],
      pink: [0.34, 1.55, 2.30],
    }[c.kind];
    const gain = (0.9 + c.salinity * 0.7) * (0.85 + 0.3 * R(0, 1));
    c.absorb = new THREE.Vector3(take[0] * gain, take[1] * gain, take[2] * gain);
    // bed colour roughly: dark mineral mud tinted by the brine family
    const bed = new THREE.Color();
    if (c.kind === 'turquoise') bed.set(R(0, 1) < 0.5 ? '#4a4e40' : '#55503e');
    else if (c.kind === 'ochre') bed.set(R(0, 1) < 0.5 ? '#5c4a2f' : '#51432e');
    else bed.set(R(0, 1) < 0.5 ? '#513c38' : '#463734');
    bed.offsetHSL(R(-0.01, 0.01), R(-0.04, 0.04), R(-0.03, 0.03));
    c.bedCol = bed;
  }

  // ------------------------------------------------------------ gates ---
  const gates = [];
  for (let ri = 0; ri < rows.length - 1; ri++) {
    const above = rows[ri].cells, below = rows[ri + 1].cells;
    const zMid = (rows[ri].z1 + rows[ri + 1].z0) * 0.5;
    const pairs = [];
    for (const a of above) {
      const b = below.find((c) => Math.min(c.x1, a.x1) - Math.max(c.x0, a.x0) > 2.4);
      if (b) pairs.push([a, b]);
    }
    // shuffle (deterministic)
    for (let i = pairs.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = pairs[i]; pairs[i] = pairs[j]; pairs[j] = t;
    }
    const take = Math.min(pairs.length, ri >= 3 ? 2 : 1);
    for (let p = 0; p < take; p++) {
      const [a, b] = pairs[p];
      const lo = Math.max(a.x0, b.x0) + 1.2;
      const hi = Math.min(a.x1, b.x1) - 1.2;
      if (hi - lo < 1.0) continue;
      const gx = lo + (hi - lo) * r();
      gates.push({
        kind: 'weir',
        x: gx, z: zMid,
        w: R(0.78, 1.05),
        high: a, low: b,
        waterHigh: a.waterY,
        waterLow: b.waterY,
        phase: R(0, 100),
        period: R(16, 31),
        offset: R(0, 1),
        open: 0,
        streamAmt: 0,
        rippleClock: -1,
      });
    }
  }

  // ------------------------------------------------------------ sluice ---
  // A raised timber launder crossing the pans diagonally, from the sea intake
  // down to the head of the foreground crystalliser.
  const A = { x: 27.5, z: -41.0 };
  const B = { x: -6.0, z: 20.4 };
  const dx = B.x - A.x, dz = B.z - A.z;
  const len = Math.hypot(dx, dz);
  const dir = { x: dx / len, z: dz / len };
  const sluice = {
    a: A, b: B, dir,
    len,
    deckY: 2.42,     // bottom of the flume
    wallH: 0.30,
    waterY: 2.56,
    width: 1.16,
    heroT: 0.865,    // parameter along the launder where the hero gate is
  };
  sluice.hero = {
    x: A.x + dx * sluice.heroT,
    z: A.z + dz * sluice.heroT,
    x2: A.x + dx * (sluice.heroT + 0.06),
    z2: A.z + dz * (sluice.heroT + 0.06),
  };

  // --------------------------------------------------------- hero cell ---
  const hero = cells.find((c) => c.hero) || cells[cells.length - 1];
  // put the sluice outlet over the hero pond
  hero.heroSluice = { x: sluice.hero.x, z: sluice.hero.z };

  // --------------------------------------------------------- dry props ---
  const piles = [
    { x: -10.6, z: 29.6, r: 2.55, h: 1.55, rot: R(0, 6.28) },
    { x: -3.1, z: 31.8, r: 1.65, h: 1.05, rot: R(0, 6.28) },
    { x: -16.6, z: 32.9, r: 1.15, h: 0.74, rot: R(0, 6.28) },
    { x: 2.6, z: 27.2, r: 1.7, h: 1.05, rot: R(0, 6.28) },
  ].map((p) => ({ ...p, baseY: 0 }));

  const boardwalk = {
    // walkway along the eastern bund of the foreground crystalliser
    axis: 'z',
    x: 6.35,
    z0: 13.0,
    z1: 24.6,
    deckY: 1.84,
    width: 1.18,
    platform: { x0: 3.4, x1: 8.8, z0: 9.9, z1: 13.4 },
    // a short landing at the sea intake
    landing: { x0: 31.0, x1: 34.2, z0: -44.0, z1: -41.6 },
  };

  // intake works: sea end of the launder
  const intake = { x: 29.0, z: -42.4, deckY: 2.35 };

  // ------------------------------------------------------- rivulets ---
  // shallow drainage veins on the foreground salt pan
  const rivulets = [];
  const spring = [
    { x: -16.5, z: 25.4, ex: -10.5, ez: 34.6, w: 0.34 },
    { x: -7.0, z: 26.2, ex: -3.4, ez: 33.4, w: 0.24 },
    { x: -26.5, z: 27.0, ex: -22.0, ez: 35.0, w: 0.30 },
    { x: 7.5, z: 26.0, ex: 4.6, ez: 33.8, w: 0.20 },
  ];
  for (const s of spring) {
    const pts = [];
    const n = 18;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const nx = Math.sin(t * 7.2 + s.x) * 0.55 + Math.sin(t * 17.0) * 0.16;
      const nz = Math.cos(t * 5.1 + s.z) * 0.35;
      pts.push({
        x: lerp(s.x, s.ex, t) + nx,
        z: lerp(s.z, s.ez, t) + nz,
      });
    }
    rivulets.push({ pts, width: s.w });
  }

  const layout = {
    cells, rows, gates, sluice, hero, piles, boardwalk, intake,
    rivulets,
    rowWater,
    tints,
  };
  return layout;
}

const LAYOUT = buildLayout();
const CELLS = LAYOUT.cells;
const HERO = LAYOUT.hero;

// fast lookup helpers ------------------------------------------------------
function cellAt(x, z) {
  for (let i = 0; i < CELLS.length; i++) {
    const c = CELLS[i];
    if (x >= c.x0 - 2.2 && x <= c.x1 + 2.2 && z >= c.z0 - 2.2 && z <= c.z1 + 2.2) {
      if (x >= c.x0 && x <= c.x1 && z >= c.z0 && z <= c.z1) return c;
    }
  }
  return null;
}

function nearestCell(x, z) {
  let best = null, bestD = 1e9;
  for (let i = 0; i < CELLS.length; i++) {
    const c = CELLS[i];
    const dx = Math.max(c.x0 - x, 0, x - c.x1);
    const dz = Math.max(c.z0 - z, 0, z - c.z1);
    const d = dx * dx + dz * dz - (dx === 0 && dz === 0 ? 1 : 0);
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}


/* ===================== 10_textures.js ===================== */
/* SALT MIRROR — procedural textures, all generated once in code. */

const TEX = {};

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// periodic smooth value noise (tileable textures)
function pnoise(x, y, px, py) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const x0 = ((xi % px) + px) % px, y0 = ((yi % py) + py) % py;
  const x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
  const a = hash2i(x0, y0), b = hash2i(x1, y0);
  const c = hash2i(x0, y1), d = hash2i(x1, y1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

function pfbm(x, y, px, py, oct = 4) {
  let s = 0, amp = 0.5, norm = 0, fx = 1, fy = 1;
  for (let i = 0; i < oct; i++) {
    s += pnoise(x * fx, y * fy, px * fx, py * fy) * amp;
    norm += amp;
    amp *= 0.5; fx *= 2; fy *= 2;
  }
  return s / norm;
}

// height array (0..1) -> tileable normal map texture
function normalTextureFromHeight(height, w, h, strength) {
  const data = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const l = height[y * w + ((x - 1 + w) % w)];
      const r = height[y * w + ((x + 1) % w)];
      const u = height[((y - 1 + h) % h) * w + x];
      const d = height[((y + 1) % h) * w + x];
      let nx = (l - r) * strength;
      let ny = (u - d) * strength;
      let nz = 1.0;
      const inv = 1 / Math.hypot(nx, ny, nz);
      nx *= inv; ny *= inv; nz *= inv;
      const i = (y * w + x) * 4;
      data[i] = Math.round((nx * 0.5 + 0.5) * 255);
      data[i + 1] = Math.round((ny * 0.5 + 0.5) * 255);
      data[i + 2] = Math.round((nz * 0.5 + 0.5) * 255);
      data[i + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  tex.needsUpdate = true;
  return tex;
}

// ---------------------------------------------------------------------------
// cloud field: broad soft cloud shadows + thin cloud deck for the sky
// ---------------------------------------------------------------------------
function buildCloudTexture() {
  const S = 1024;
  const data = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      // long, streaky cloud fields (stretched east-west)
      const base = pfbm(u * 5.0, v * 9.0, 5, 9, 4) * 0.72
                 + pfbm(u * 11.0 + 0.31, v * 17.0 + 0.17, 11, 17, 3) * 0.28;
      const mask = pfbm(u * 1.6 + 0.4, v * 2.3 + 0.2, 1.6, 2.3, 2);
      const dens = smoothstep(0.40, 0.66, base * 0.8 + mask * 0.33);
      // high-frequency detail/edges
      const detail = pnoise(u * 96, v * 128, 96, 128) * 0.6
                   + pfbm(u * 22, v * 30, 22, 30, 3) * 0.4;
      const i = (y * S + x) * 4;
      data[i] = Math.round(clamp(dens, 0, 1) * 255);
      data[i + 1] = Math.round(clamp(detail, 0, 1) * 255);
      data[i + 2] = Math.round(clamp(mask, 0, 1) * 255);
      data[i + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, S, S, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  tex.needsUpdate = true;
  return tex;
}

// ---------------------------------------------------------------------------
// fine granular ground detail (tileable normal map)
// ---------------------------------------------------------------------------
function buildGroundDetailNormal() {
  const S = 512;
  const height = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      let h = pfbm(u * 7, v * 7, 7, 7, 4) * 0.5;
      h += pfbm(u * 23, v * 23, 23, 23, 3) * 0.26;
      h += pnoise(u * 88, v * 88, 88, 88) * 0.16;
      h += pnoise(u * 190, v * 190, 190, 190) * 0.08;
      height[y * S + x] = h;
    }
  }
  return normalTextureFromHeight(height, S, S, 3.4);
}

// ---------------------------------------------------------------------------
// weathered timber: albedo + normal
// ---------------------------------------------------------------------------
function buildWoodTextures() {
  const S = 512;
  const albedo = makeCanvas(S, S);
  const actx = albedo.getContext('2d');
  const img = actx.createImageData(S, S);
  const height = new Float32Array(S * S);
  const grime = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      const warp = pfbm(u * 3.0, v * 5.0, 3, 5, 3);
      const bands = Math.sin((v * 34.0 + warp * 5.2) * Math.PI * 2.0) * 0.5 + 0.5;
      const fibre = pnoise(u * 26, v * 190, 26, 190) * 0.6 + pnoise(u * 60, v * 320, 60, 320) * 0.4;
      let h = bands * 0.55 + fibre * 0.45;
      // splits / checks running with the grain
      const split = smoothstep(0.86, 0.995, pnoise(u * 12, v * 55, 12, 55));
      h -= split * 0.5;
      // knots
      const kx = 0.28, ky = 0.22;
      const kd = Math.hypot((u - kx) * 1.0, (v - ky) * 2.4);
      if (kd < 0.075) {
        const ring = Math.sin(kd * 210) * 0.5 + 0.5;
        h = lerp(h, ring * 0.75, smoothstep(0.075, 0.02, kd));
      }
      height[y * S + x] = clamp(h, 0, 1);
      grime[y * S + x] = pnoise(u * 8, v * 8, 8, 8) * 0.6 + pnoise(u * 40, v * 40, 40, 40) * 0.4;
      const warm = 0.52 + h * 0.30 + (warp - 0.5) * 0.14;
      const grey = 0.52 + h * 0.26 + (warp - 0.5) * 0.10;
      const silver = clamp(0.9 - grime[y * S + x] * 0.55, 0, 1);
      const rr = lerp(warm * 0.72, grey * 0.86, silver) * 255;
      const gg = lerp(warm * 0.63, grey * 0.84, silver) * 255;
      const bb = lerp(warm * 0.52, grey * 0.80, silver) * 255;
      const i = (y * S + x) * 4;
      img.data[i] = clamp(rr, 0, 255);
      img.data[i + 1] = clamp(gg, 0, 255);
      img.data[i + 2] = clamp(bb, 0, 255);
      img.data[i + 3] = 255;
    }
  }
  actx.putImageData(img, 0, 0);
  // a few darker damp streaks
  for (let i = 0; i < 22; i++) {
    const x = rand() * S, y = rand() * S;
    const g = actx.createLinearGradient(x, y, x + randIn(-30, 30), y + randIn(60, 220));
    g.addColorStop(0, 'rgba(28,24,20,0)');
    g.addColorStop(0.5, `rgba(28,24,20,${randIn(0.08, 0.22)})`);
    g.addColorStop(1, 'rgba(28,24,20,0)');
    actx.fillStyle = g;
    actx.fillRect(x - 40, y, 80, 260);
  }
  const tex = new THREE.CanvasTexture(albedo);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const nrm = normalTextureFromHeight(height, S, S, 2.6);
  return { map: tex, normal: nrm };
}

// ---------------------------------------------------------------------------
// dry salt / crust
// ---------------------------------------------------------------------------
function buildSaltTextures() {
  const S = 512;
  const albedo = makeCanvas(S, S);
  const actx = albedo.getContext('2d');
  const img = actx.createImageData(S, S);
  const height = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      const grain = pfbm(u * 9, v * 9, 9, 9, 4);
      const speck = pnoise(u * 150, v * 150, 150, 150);
      const coarse = pfbm(u * 20, v * 26, 20, 26, 3);
      height[y * S + x] = coarse * 0.6 + grain * 0.3 + speck * 0.1;
      let l = 0.895 + grain * 0.07 + coarse * 0.035;
      if (speck > 0.86) l += 0.035;
      const i = (y * S + x) * 4;
      img.data[i] = clamp((l * 1.005) * 255, 0, 255);
      img.data[i + 1] = clamp((l * 0.995) * 255, 0, 255);
      img.data[i + 2] = clamp((l * 0.955) * 255, 0, 255);
      img.data[i + 3] = 255;
    }
  }
  actx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(albedo);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const nrm = normalTextureFromHeight(height, S, S, 2.2);
  return { map: tex, normal: nrm };
}

// ---------------------------------------------------------------------------
// large "surface history" map of the saltworks: beds, crusts, rake marks, paths
// ---------------------------------------------------------------------------
function buildMacroTexture() {
  const W = 2048, H = 1280;
  const cv = makeCanvas(W, H);
  const ctx = cv.getContext('2d');
  const sx = W / (MACRO.x1 - MACRO.x0);
  const sz = H / (MACRO.z1 - MACRO.z0);
  const X = (x) => (x - MACRO.x0) * sx;
  const Z = (z) => (z - MACRO.z0) * sz;
  const rect = (x0, z0, x1, z1) => [X(x0), Z(z0), (x1 - x0) * sx, (z1 - z0) * sz];

  const hex = (c) => '#' + c.getHexString();
  const rgba = (c, a) => `rgba(${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)},${a})`;

  // --- dry coastal earth base
  ctx.fillStyle = '#8d7f69';
  ctx.fillRect(0, 0, W, H);

  // --- beach and tidal flat north of the works
  {
    const [bx, bz, bw, bh] = rect(MACRO.x0, MACRO.z0, MACRO.x1, -40.0);
    const g = ctx.createLinearGradient(0, bz, 0, bz + bh);
    g.addColorStop(0, '#a89c85');
    g.addColorStop(0.36, '#b4a88e');
    g.addColorStop(0.72, '#9c917c');
    g.addColorStop(1, '#837a68');
    ctx.fillStyle = g;
    ctx.fillRect(bx, bz, bw, bh);
    // wet sand / tidal zone
    const wetZ = Z(-44.4);
    const wetH = Z(-49) - wetZ;
    const gw = ctx.createLinearGradient(0, wetZ, 0, wetZ + wetH);
    gw.addColorStop(0, 'rgba(84,83,74,0)');
    gw.addColorStop(0.35, 'rgba(84,83,74,.34)');
    gw.addColorStop(1, 'rgba(66,68,62,.52)');
    ctx.fillStyle = gw;
    ctx.fillRect(bx, wetZ, bw, wetH);
    // swash lines parallel to the shore
    for (let i = 0; i < 90; i++) {
      const zz = Z(-44.6 - i * 0.048) + randIn(-2, 2);
      ctx.globalAlpha = randIn(0.04, 0.12);
      ctx.strokeStyle = rand() < 0.5 ? '#d0c6ae' : '#6f6b5e';
      ctx.lineWidth = randIn(0.8, 2.6);
      ctx.beginPath();
      for (let s = 0; s <= 16; s++) {
        const xx = bx + (s / 16) * bw;
        const yy = zz + Math.sin(s * 0.9 + i) * 2.2;
        if (s === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // pebbles and shell grit
    for (let i = 0; i < 2600; i++) {
      const xx = bx + rand() * bw, yy = bz + rand() * bh;
      ctx.globalAlpha = randIn(0.06, 0.3);
      ctx.fillStyle = pick(['#5f5a4e', '#776f5f', '#d6cdb6', '#8e8371', '#3f3d36']);
      ctx.beginPath(); ctx.arc(xx, yy, randIn(0.5, 2.1), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // wrack line of weed and driftwood
    for (let i = 0; i < 190; i++) {
      const xx = bx + rand() * bw;
      const yy = Z(-45.2) + randIn(-22, 22);
      ctx.globalAlpha = randIn(0.10, 0.34);
      ctx.strokeStyle = pick(['#3a3529', '#4c432f', '#2e2c25']);
      ctx.lineWidth = randIn(0.8, 2.4);
      ctx.beginPath();
      ctx.moveTo(xx, yy);
      ctx.quadraticCurveTo(xx + randIn(-14, 14), yy + randIn(-6, 6), xx + randIn(-26, 26), yy + randIn(-8, 8));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // a handful of tidal pools holding sky
    for (let i = 0; i < 22; i++) {
      const xx = bx + rand() * bw, yy = Z(randIn(-47.6, -43.2));
      const rr = randIn(8, 34);
      const g2 = ctx.createRadialGradient(xx, yy, rr * 0.15, xx, yy, rr);
      g2.addColorStop(0, 'rgba(118,131,131,.52)');
      g2.addColorStop(0.72, 'rgba(96,104,100,.30)');
      g2.addColorStop(1, 'rgba(96,104,100,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.ellipse(xx, yy, rr, rr * 0.45, randIn(-0.4, 0.4), 0, 7); ctx.fill();
    }
  }
  const earthPalette = ['#6b5d49', '#9a8b73', '#7a6b53', '#a2917a', '#584f40', '#93856d'];
  for (let i = 0; i < 2600; i++) {
    const x = rand() * W, y = rand() * H, r = randIn(6, 120);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const col = pick(earthPalette);
    g.addColorStop(0, col);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = randIn(0.06, 0.22);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // saltmarsh / dry vegetation mottles toward the field edges
  for (let i = 0; i < 900; i++) {
    const x = rand() * W, y = rand() * H, r = randIn(4, 34);
    ctx.globalAlpha = randIn(0.05, 0.16);
    ctx.fillStyle = pick(['#5e6249', '#77795a', '#4e5540', '#7c7a5d']);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // --- basin beds
  const bedPalette = {
    turquoise: ['#6c7d70', '#768677', '#5f7468', '#80907c', '#6a7a6a'],
    ochre: ['#8d7548', '#7d663c', '#9a8150', '#73603a', '#a08a58'],
    pink: ['#8a6a64', '#967670', '#7c5d58', '#a07b74', '#8c6663'],
  };
  for (const c of CELLS) {
    const [rx, rz, rw, rh] = rect(c.x0, c.z0, c.x1, c.z1);
    ctx.fillStyle = hex(c.bedCol);
    ctx.fillRect(rx, rz, rw, rh);
    const pal = bedPalette[c.kind];
    for (let i = 0; i < 110; i++) {
      const x = rx + rand() * rw, y = rz + rand() * rh, r = randIn(4, 46);
      ctx.globalAlpha = randIn(0.08, 0.26);
      ctx.fillStyle = pick(pal);
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // darker, wetter rim inside the basin
    const rim = Math.min(rw, rh) * 0.10;
    const g = ctx.createLinearGradient(rx, rz, rx + rim, rz);
    g.addColorStop(0, 'rgba(26,22,17,.48)');
    g.addColorStop(1, 'rgba(26,22,17,0)');
    ctx.fillStyle = g;
    ctx.fillRect(rx, rz, rim, rh);
    ctx.save();
    ctx.translate(rx + rw, rz); ctx.rotate(Math.PI / 2);
    const g2 = ctx.createLinearGradient(0, -rw, rim, -rw);
    g2.addColorStop(0, 'rgba(26,22,17,.45)');
    g2.addColorStop(1, 'rgba(26,22,17,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, rim, rw);
    ctx.restore();
    // granular bed speckle
    for (let i = 0; i < 900; i++) {
      const x = rx + rand() * rw, y = rz + rand() * rh;
      const r = randIn(0.5, 2.6);
      ctx.globalAlpha = randIn(0.10, 0.42);
      ctx.fillStyle = rand() < 0.5 ? pick(pal) : (rand() < 0.4 ? '#d8cfb9' : '#2b271f');
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // mineral/algae blooms
    for (let i = 0; i < 9; i++) {
      const bx = rx + rand() * rw, by = rz + rand() * rh;
      const br = randIn(8, 52);
      const g3 = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      const tint = c.kind === 'turquoise' ? 'rgba(78,122,92,' : c.kind === 'ochre' ? 'rgba(166,106,38,' : 'rgba(152,66,78,';
      g3.addColorStop(0, tint + '0.30)');
      g3.addColorStop(1, tint + '0)');
      ctx.fillStyle = g3;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill();
    }
  }

  // --- salt rime at the waterline of every basin
  for (const c of CELLS) {
    const t = clamp((CFG.crestY - c.waterY) / (CFG.crestY - c.bedY), 0.05, 1);
    const insetM = CFG.bankRun * t * 0.92 + 0.10;
    const ix = insetM * sx, iz = insetM * sz;
    const [rx, rz, rw, rh] = rect(c.x0, c.z0, c.x1, c.z1);
    const x0 = rx + ix, x1 = rx + rw - ix, y0 = rz + iz, y1 = rz + rh - iz;
    const sides = [
      [x0, y0, x1, y0], [x1, y0, x1, y1],
      [x1, y1, x0, y1], [x0, y1, x0, y0],
    ];
    for (const [ax, ay, bx, by] of sides) {
      const steps = Math.max(8, Math.floor(Math.hypot(bx - ax, by - ay) / 7));
      for (let s = 0; s < steps; s++) {
        const tt = (s + 0.5) / steps;
        const px = lerp(ax, bx, tt) + randIn(-2.6, 2.6);
        const py = lerp(ay, by, tt) + randIn(-2.6, 2.6);
        const rr = randIn(1.2, 4.6);
        ctx.globalAlpha = randIn(0.10, 0.42);
        ctx.fillStyle = pick(['#e9e1cf', '#dcd3bd', '#f0e8d6', '#cfc6b1']);
        ctx.beginPath(); ctx.arc(px, py, rr, 0, 7); ctx.fill();
      }
    }
    // soft damp shadow just outside the crust
    ctx.globalAlpha = 0.14;
    ctx.strokeStyle = '#3f382e';
    ctx.lineWidth = 5;
    ctx.strokeRect(x0 - 2, y0 - 2, (x1 - x0) + 4, (y1 - y0) + 4);
    ctx.globalAlpha = 1;
  }

  // --- wooden walkway / worn path beside the eastern bund
  {
    const bw = LAYOUT.boardwalk;
    const [rx, rz, rw, rh] = rect(bw.x - 1.1, bw.z0 - 1.0, bw.x + 1.3, bw.z1 + 1.0);
    const g = ctx.createLinearGradient(rx, 0, rx + rw, 0);
    g.addColorStop(0, 'rgba(84,71,53,0)');
    g.addColorStop(0.5, 'rgba(84,71,53,.46)');
    g.addColorStop(1, 'rgba(84,71,53,0)');
    ctx.fillStyle = g;
    ctx.fillRect(rx, rz, rw, rh);
    const p = bw.platform;
    const [px, pz, pw2, ph2] = rect(p.x0 - 0.3, p.z0 - 0.3, p.x1 + 0.3, p.z1 + 0.3);
    ctx.fillStyle = 'rgba(84,71,53,.34)';
    ctx.fillRect(px, pz, pw2, ph2);
    for (let i = 0; i < 900; i++) {
      ctx.globalAlpha = randIn(0.05, 0.22);
      ctx.fillStyle = pick(['#5c4d3a', '#8b7a5f', '#6f5f47']);
      const qx = rx + rand() * rw, qy = rz + rand() * rh;
      ctx.fillRect(qx, qy, randIn(0.6, 3.2), randIn(0.6, 3.2));
    }
    ctx.globalAlpha = 1;
  }

  // --- foreground dry pan: raked salt, crust polygons, drainage stains
  {
    const p = CFG.dryPan;
    const [rx, rz, rw, rh] = rect(p.x0, p.z0, p.x1, p.z1);
    ctx.fillStyle = '#cfc7b2';
    ctx.fillRect(rx, rz, rw, rh);
    // subtle tonal drifts
    for (let i = 0; i < 900; i++) {
      ctx.globalAlpha = randIn(0.03, 0.13);
      ctx.fillStyle = pick(['#bdb49d', '#e0d9c6', '#c6bda6', '#d7cfba']);
      const x = rx + rand() * rw, y = rz + rand() * rh, r = randIn(6, 70);
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // polygonal salt crust cells
    for (let i = 0; i < 300; i++) {
      const cx = rx + rand() * rw, cy = rz + rand() * rh;
      const rad = randIn(9, 42);
      const n = randInt(5, 8);
      ctx.beginPath();
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2 + randIn(-0.18, 0.18);
        const r2 = rad * randIn(0.72, 1.16);
        const px = cx + Math.cos(a) * r2, py = cy + Math.sin(a) * r2 * 0.8;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.globalAlpha = randIn(0.20, 0.48);
      ctx.strokeStyle = rand() < 0.55 ? '#8a7f68' : '#f4eddb';
      ctx.lineWidth = randIn(0.7, 2.1);
      ctx.stroke();
      ctx.globalAlpha = randIn(0.02, 0.06);
      ctx.fillStyle = '#b3a98f';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // rake fans
    for (let f = 0; f < 26; f++) {
      const cx = rx + rand() * rw, cy = rz + rand() * rh;
      const a0 = rand() * Math.PI * 2;
      const span = randIn(0.5, 1.6);
      const count = randInt(5, 13);
      const gap = randIn(2.2, 4.6);
      for (let k = 0; k < count; k++) {
        const rad = 8 + k * gap + randIn(-0.6, 0.6);
        ctx.beginPath();
        for (let s = 0; s <= 14; s++) {
          const a = a0 + (s / 14) * span;
          const rr = rad * randIn(0.995, 1.005);
          const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
          if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.globalAlpha = randIn(0.10, 0.26);
        ctx.strokeStyle = rand() < 0.5 ? '#8b8068' : '#f3ecd9';
        ctx.lineWidth = randIn(0.7, 1.4);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    // damp drainage stains and crystal rims
    for (let i = 0; i < 46; i++) {
      const x = rx + rand() * rw, y = rz + rand() * rh;
      const rr = randIn(6, 30);
      const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
      g.addColorStop(0, 'rgba(66,58,47,.20)');
      g.addColorStop(1, 'rgba(66,58,47,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, 7); ctx.fill();
    }
    // footprints / small tracks
    for (let t = 0; t < 6; t++) {
      let x = rx + rand() * rw, y = rz + rand() * rh;
      const dir = rand() * Math.PI * 2;
      for (let s = 0; s < 22; s++) {
        const side = s % 2 === 0 ? 1 : -1;
        ctx.globalAlpha = randIn(0.06, 0.16);
        ctx.fillStyle = '#6d6350';
        ctx.beginPath();
        ctx.ellipse(x + Math.sin(dir) * s * 3, y + Math.cos(dir) * s * 3.2 + side * 2.6, 2.2, 3.4, dir, 0, 7);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // --- spill patches from the sluice and gates, wet mud around them
  for (const g of LAYOUT.gates) {
    const [rx, rz, rw, rh] = rect(g.x - 1.0, g.z + 0.2, g.x + 1.0, g.z + 3.4);
    const grd = ctx.createLinearGradient(rx, rz, rx, rz + rh);
    grd.addColorStop(0, 'rgba(58,50,40,.30)');
    grd.addColorStop(1, 'rgba(58,50,40,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(rx, rz, rw, rh);
  }
  {
    // permanently damp run below the launder outlet
    const hx = LAYOUT.hero.heroSluice ? LAYOUT.hero.heroSluice.x : 0;
    const hz = LAYOUT.hero.heroSluice ? LAYOUT.hero.heroSluice.z : 0;
    const [rx, rz, rw, rh] = rect(hx - 2.2, hz + 0.4, hx + 2.2, hz + 5.2);
    const grd = ctx.createLinearGradient(rx, rz, rx, rz + rh);
    grd.addColorStop(0, 'rgba(46,40,34,.26)');
    grd.addColorStop(1, 'rgba(46,40,34,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(rx, rz, rw, rh);
  }

  // --- salt piles: pale spill aprons
  for (const p of LAYOUT.piles) {
    const [rx, rz, rw, rh] = rect(p.x - p.r * 1.8, p.z - p.r * 1.8, p.x + p.r * 1.8, p.z + p.r * 1.8);
    const g = ctx.createRadialGradient(rx + rw / 2, rz + rh / 2, 0, rx + rw / 2, rz + rh / 2, rw * 0.5);
    g.addColorStop(0, 'rgba(244,239,226,.55)');
    g.addColorStop(0.55, 'rgba(232,225,209,.24)');
    g.addColorStop(1, 'rgba(232,225,209,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(rx + rw / 2, rz + rh / 2, rw * 0.5, 0, 7); ctx.fill();
  }

  // --- head channel / intake wet mud
  {
    const [rx, rz, rw, rh] = rect(24, -42, 34, -37.5);
    const g = ctx.createRadialGradient(rx + rw / 2, rz + rh / 2, 0, rx + rw / 2, rz + rh / 2, rw * 0.55);
    g.addColorStop(0, 'rgba(72,74,62,.36)');
    g.addColorStop(1, 'rgba(72,74,62,0)');
    ctx.fillStyle = g;
    ctx.fillRect(rx, rz, rw, rh);
  }

  // --- scattered salt dust, stones, glints over everything dry
  for (let i = 0; i < 5200; i++) {
    const x = rand() * W, y = rand() * H;
    const bright = rand() < 0.62;
    ctx.globalAlpha = bright ? randIn(0.08, 0.30) : randIn(0.05, 0.18);
    ctx.fillStyle = bright ? pick(['#f1ead8', '#e5ddc9']) : pick(['#544c3f', '#6a6051']);
    const r = bright ? randIn(0.4, 1.9) : randIn(0.5, 2.2);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // --- granular high-frequency grain, baked once
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (hash2i(i * 0.017, 731) - 0.5) * 22;
    d[i] = clamp(d[i] + n, 0, 255);
    d[i + 1] = clamp(d[i + 1] + n, 0, 255);
    d[i + 2] = clamp(d[i + 2] + n * 0.9, 0, 255);
  }
  ctx.putImageData(img, 0, 0);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.flipY = false;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

function buildTextures() {
  TEX.cloud = buildCloudTexture();
  TEX.groundNormal = buildGroundDetailNormal();
  const wood = buildWoodTextures();
  TEX.wood = wood.map;
  TEX.woodNormal = wood.normal;
  const salt = buildSaltTextures();
  TEX.salt = salt.map;
  TEX.saltNormal = salt.normal;
  TEX.macro = buildMacroTexture();
  U.uCloudTex.value = TEX.cloud;
  U.uMacroTex.value = TEX.macro;
}


/* ===================== 15_glsl.js ===================== */
/* SALT MIRROR — shared GLSL: sky model, cloud field, hero gap, noise. */

const GLSL_NOISE = /* glsl */`
float sHash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float sHash13(vec3 p3) {
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
float sNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(sHash12(i), sHash12(i + vec2(1.0, 0.0)), u.x),
             mix(sHash12(i + vec2(0.0, 1.0)), sHash12(i + vec2(1.0, 1.0)), u.x), u.y);
}
float sFbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) {
    s += sNoise(p) * a;
    p = p * 2.03 + 17.1;
    a *= 0.5;
  }
  return s;
}
`;

// uniforms are declared in each material's shader header (GLSL_UNIFORMS)
const GLSL_UNIFORMS = /* glsl */`
uniform float uTime;
uniform vec3 uCamPos;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform float uSunIntensity;
uniform vec3 uSkyZenith;
uniform vec3 uSkyHorizon;
uniform vec3 uSkyHaze;
uniform vec3 uCloudBright;
uniform vec3 uCloudShade;
uniform sampler2D uCloudTex;
uniform float uCloudTile;
uniform vec2 uCloudOffset;
uniform float uCloudCover;
uniform vec2 uGapCenter;
uniform vec2 uGapDir;
uniform float uGapHalfLen;
uniform float uGapHalfWid;
uniform float uGapOpen;
uniform vec2 uWind;
uniform float uWindStrength;
uniform vec3 uFogColor;
uniform float uFogDensity;
uniform float uCloudHeight;
uniform sampler2D uMacroTex;
uniform vec4 uMacroRect;
uniform float uHero;
uniform float uDebug;
`;

const GLSL_SKY = /* glsl */`
// 0 = clear, 1 = thick cloud, evaluated at a world xz position
float cloudField(vec2 wxz) {
  vec2 q = (wxz - uCloudOffset) / uCloudTile;
  float a = texture2D(uCloudTex, q).r;
  float b = texture2D(uCloudTex, q * 2.13 + vec2(0.37, 0.11)).r;
  float c = texture2D(uCloudTex, q * 0.47 + vec2(0.11, 0.53)).r;
  return clamp((a * 0.55 + b * 0.20 + c * 0.42) * 1.22 - 0.16, 0.0, 1.0);
}

// broad, soft, moving cloud masses in world space
float cloudShadowAt(vec2 wxz) {
  vec2 q = (wxz - uCloudOffset) * 0.0125;
  float f = sNoise(q) * 0.58 + sNoise(q * 2.31 + 13.1) * 0.27 + sNoise(q * 0.37 + 5.7) * 0.48;
  float d = smoothstep(0.22, 0.92, f);
  // a slower, larger modulation makes openings pass as whole banks
  float big = sNoise(q * 0.235 + 31.7);
  d *= smoothstep(0.10, 0.72, big);
  return d;
}

// the hero clear gap: a soft ragged opening that crosses the pans
float gapMask(vec2 wxz) {
  vec2 d = wxz - uGapCenter;
  float along = dot(d, uGapDir);
  float across = dot(d, vec2(-uGapDir.y, uGapDir.x));
  float n = texture2D(uCloudTex, wxz * 0.0118 + vec2(0.51, 0.27)).g;
  float n2 = texture2D(uCloudTex, wxz * 0.0031 + vec2(0.13, 0.71)).r;
  float rr = length(vec2(along / uGapHalfLen, across / uGapHalfWid));
  float edge = 0.78 + n * 0.34 + n2 * 0.22;
  return (1.0 - smoothstep(0.10, 1.02, rr / edge)) * uGapOpen;
}

// sunlight fraction at a ground position (0 in cloud shade, 1 in the clear)
float sunVisibility(vec2 wxz) {
  // the coastal sky is broken: most of the site sits under thin cloud most of
  // the time, and the gap is the exception that lights a moving patch.
  float shade = 0.62 + 0.24 * cloudShadowAt(wxz) * uCloudCover;
  float v = 1.0 - shade * 0.93;
  float gap = gapMask(wxz);
  v = mix(v, 1.48, gap);
  return clamp(v, 0.06, 1.55);
}

// procedural sky radiance for a direction (towards the sky)
vec3 skyRadiance(vec3 dir, float withSun) {
  float y = clamp(dir.y, -0.06, 1.0);
  vec3 col = mix(uSkyHorizon, uSkyZenith, pow(clamp(y, 0.0, 1.0), 0.52));
  col = mix(uSkyHaze, col, smoothstep(-0.005, 0.16, y));
  float sd = max(dot(dir, uSunDir), 0.0);
  col += uSunColor * pow(sd, 2400.0) * 26.0 * withSun;
  col += uSunColor * pow(sd, 48.0) * 0.20 * withSun;
  col += uSunColor * pow(sd, 5.0) * 0.055 * withSun;

  if (dir.y > 0.006) {
    float t = (uCloudHeight - uCamPos.y) / max(dir.y, 0.006);
    vec2 pp = uCamPos.xz + dir.xz * t;
    vec2 q = (pp - uCloudOffset) / uCloudTile;
    float d1 = texture2D(uCloudTex, q).r;
    float d2 = texture2D(uCloudTex, q * 2.63 + vec2(0.17, 0.41)).r;
    float dens = smoothstep(0.30, 0.66, d1 * 0.72 + d2 * 0.28);
    dens *= smoothstep(0.006, 0.10, dir.y);
    float sunSide = clamp(dot(dir, uSunDir) * 0.5 + 0.55, 0.0, 1.0);
    vec3 cc = mix(uCloudShade, uCloudBright, sunSide);
    // slight warm rim on the sunward side of thin cloud
    cc += uSunColor * pow(max(dot(dir, uSunDir), 0.0), 12.0) * 0.10;
    col = mix(col, cc, dens * 0.9);
  }
  return col;
}

// cheap sky reflection for water surfaces: smooth haze-dominant mirror
vec3 skyReflect(vec3 dir) {
  float y = clamp(dir.y, 0.0, 1.0);
  vec3 col = mix(uSkyHorizon, uSkyZenith, pow(y, 0.65));
  col = mix(uSkyHaze, col, smoothstep(0.0, 0.22, y));
  float sd = max(dot(dir, uSunDir), 0.0);
  col += uSunColor * pow(sd, 32.0) * 0.10;
  float fade = smoothstep(0.02, 0.34, y);
  vec2 q = (uCamPos.xz + dir.xz * (uCloudHeight / max(dir.y, 0.02)) - uCloudOffset) / uCloudTile;
  float d = texture2D(uCloudTex, q).r;
  d = smoothstep(0.40, 0.80, d) * fade;
  col = mix(col, mix(uCloudShade, uCloudBright, 0.55), d * 0.38);
  return col;
}

vec3 fogApply(vec3 col, float dist) {
  float f = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
  return mix(col, uFogColor, clamp(f, 0.0, 0.92));
}
`;


/* ===================== 20_sky.js ===================== */
/* SALT MIRROR — sky, sun, ambient light, distant coast. */

const skyMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_Position.z = gl_Position.w; // pin to far plane
    }
  `,

// ---------------------------------------------------------------------------
// distant headland and island silhouettes (composition depth)
// ---------------------------------------------------------------------------
function buildDistantCoast() {
  const group = new THREE.Group();

  function ridge(cx, cz, len, wid, rot, hMax, seedOff) {
    const nx = 64, nz = 14;
    const geo = new THREE.PlaneGeometry(len, wid, nx, nz);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const r = mulberry32(SEED ^ seedOff);
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      const u = (x / len) + 0.5;
      const v = (z / wid) + 0.5;
      const envelope = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.75) *
                       Math.pow(Math.sin(Math.PI * clamp(v, 0, 1)), 1.2);
      const ridgeLine = 0.55 + 0.45 * Math.sin(u * 9.0 + seedOff) * Math.sin(u * 3.7 + 1.3);
      let h = hMax * envelope * ridgeLine;
      h += (r() - 0.5) * hMax * 0.12;
      h *= smoothstep(0.0, 0.16, u) * smoothstep(1.0, 0.84, u);
      pos.setY(i, Math.max(-1.5, h - 2.0));
    }
    geo.computeVertexNormals();
    const m = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#4c5a52'),
      roughness: 0.96,
      metalness: 0.0,
    });
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.set(cx, 0, cz);
    mesh.rotation.y = rot;
    mesh.receiveShadow = false;
    mesh.castShadow = false;
    group.add(mesh);
  }

  // headland to the north-west, low island further out, both deep in the haze
  ridge(-420, -560, 620, 170, -0.30, 26, 0x51a1);
  ridge(-760, -720, 460, 140, 0.16, 17, 0x51a2);
  ridge(-115, -620, 340, 100, 0.08, 8, 0x51a3);
  group.traverse((o) => { o.frustumCulled = false; });
  scene.add(group);
  return group;
}

const distantCoast = buildDistantCoast();

/* SALT MIRROR — sea: distant water, waves, sky reflection, shore foam. */

function buildSea() {
  const geo = new THREE.PlaneGeometry(6400, 3400, 1, 1);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U, {
      uSeaDeep: { value: new THREE.Color('#1f383e') },
      uSeaShallow: { value: new THREE.Color('#4a6661') },
    }),
    vertexShader: /* glsl */`
      varying vec3 vW;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vW = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      ${GLSL_UNIFORMS}
      ${GLSL_NOISE}
      ${GLSL_SKY}
      uniform vec3 uSeaDeep;
      uniform vec3 uSeaShallow;
      varying vec3 vW;
      void main() {
        vec3 V = normalize(uCamPos - vW);
        float dist = length(uCamPos - vW);
        vec2 p = vW.xz;
        float t = uTime;
        // long swell + one chop field, flattened with distance
        float amp = 1.0 / (1.0 + dist * 0.035);
        vec2 g = vec2(0.0);
        g += vec2(0.86, 0.50) * cos(dot(p, vec2(0.86, 0.50)) * 0.22 + t * 0.62) * 0.030;
        g += vec2(-0.42, 0.91) * cos(dot(p, vec2(-0.42, 0.91)) * 0.39 - t * 0.84) * 0.022;
        g += vec2(0.97, -0.24) * cos(dot(p, vec2(0.97, -0.24)) * 0.79 + t * 1.17) * 0.014;
        float nch = sNoise(p * 0.31 + vec2(t * 0.05, 0.0));
        float nch2 = sNoise(p * 0.47 + vec2(0.0, -t * 0.07));
        g += vec2(nch - 0.5, nch2 - 0.5) * 0.055;
        vec3 N = normalize(vec3(-g.x * amp, 1.0, -g.y * amp));
        float ndv = max(dot(N, V), 0.0);
        vec3 R = reflect(-V, N);
        R.y = abs(R.y);
        vec3 refl = skyReflect(R) * 0.86;
        float F = 0.022 + 0.978 * pow(1.0 - ndv, 5.0);
        vec3 body = mix(uSeaShallow, uSeaDeep, smoothstep(20.0, 160.0, dist));
        body *= 0.86 + 0.22 * nch;
        vec3 H = normalize(V + uSunDir);
        float spec = pow(max(dot(N, H), 0.0), 420.0) * 0.75;
        vec3 col = mix(body, refl, clamp(F, 0.0, 1.0)) + uSunColor * spec * 0.30;
        col = fogApply(col, dist);
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
    fog: false,
    depthWrite: true,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, 0, -40 - 1700);
  mesh.receiveShadow = false;
  mesh.castShadow = false;
  scene.add(mesh);
  return mesh;
}


/* ===================== 30_terrain.js ===================== */
/* SALT MIRROR — terrain: irregular basin heightfield, surface history, materials. */

// ---------------------------------------------------------------------------
// surface sampling
// ---------------------------------------------------------------------------
const _surf = { h: 0, cell: null, sdf: 0, dOut: 0, gate: null };

function outerPlainHeight(x, z) {
  let h = CFG.plainY;
  h += (fbm2(x * 0.021 + 13.2, z * 0.027 + 5.7, 3) - 0.5) * 0.55;
  h += (fbm2(x * 0.11 + 2.1, z * 0.13 + 9.4, 2) - 0.5) * 0.10;
  // gentle landward rise away from the shore
  h += smoothstep(10, 120, z) * 0.55;
  return h;
}

// distance from a point to a polyline, used for the drainage veins
function distToPolyline(x, z, pts) {
  let best = 1e9;
  for (let i = 0; i < pts.length - 1; i++) {
    const ax = pts[i].x, az = pts[i].z, bx = pts[i + 1].x, bz = pts[i + 1].z;
    const vx = bx - ax, vz = bz - az;
    const wx = x - ax, wz = z - az;
    const l2 = vx * vx + vz * vz;
    let t = l2 > 0 ? (wx * vx + wz * vz) / l2 : 0;
    t = clamp(t, 0, 1);
    const dx = wx - vx * t, dz = wz - vz * t;
    const d = Math.sqrt(dx * dx + dz * dz);
    if (d < best) best = d;
  }
  return best;
}

function sampleSurface(x, z, out) {
  out = out || _surf;
  out.cell = null; out.gate = null; out.sdf = 0;
  const f = CFG.field;

  // ---- beach & tidal flat
  if (z < f.z0 - 0.6) {
    const t = smoothstep(f.z0 - 0.2, -47.8, z);
    let h = lerp(CFG.plainY, -1.35, t);
    h += (fbm2(x * 0.09 + 11.3, z * 0.11 + 3.1, 3) - 0.5) * 0.26 * (1 - t * 0.75);
    // stone intake channel to the pumps
    const cd = Math.abs(x - LAYOUT.intake.x);
    if (cd < 4.0) {
      const floor = lerp(0.10, -1.0, smoothstep(-41.6, -47.6, z));
      const carve = smoothstep(3.6, 1.2, cd) * smoothstep(-40.8, -43.0, z);
      h = lerp(h, floor, carve);
    }
    out.h = h;
    out.dOut = 999;
    return out;
  }

  // ---- nearest basin
  let cell = null, cellD = 1e9, sdf = 0;
  for (let i = 0; i < CELLS.length; i++) {
    const c = CELLS[i];
    const ox = Math.max(c.x0 - x, 0, x - c.x1);
    const oz = Math.max(c.z0 - z, 0, z - c.z1);
    const d2 = ox * ox + oz * oz;
    if (d2 < cellD) {
      cellD = d2;
      cell = c;
      sdf = (ox > 0 || oz > 0) ? 1 : -Math.min(x - c.x0, c.x1 - x, z - c.z0, c.z1 - z);
    }
  }
  if (cell) {
    if (cellD > 0) {
      const ox = Math.max(cell.x0 - x, 0, x - cell.x1);
      const oz = Math.max(cell.z0 - z, 0, z - cell.z1);
      sdf = Math.sqrt(ox * ox + oz * oz);
    }
  }

  // ---- basin cross-section: bed -> bank -> flat berm
  let h = CFG.plainY;
  if (cell) {
    const t = smootherstep(-CFG.bankRun, 0.0, sdf);
    h = lerp(cell.bedY, CFG.crestY, t);
    // bed micro-relief and bank erosion
    const micro = (fbm2(x * 0.75 + cell.seed, z * 0.75 - cell.seed, 3) - 0.5);
    h += micro * (sdf < -CFG.bankRun ? 0.035 : 0.02);
    h += (fbm2(x * 2.4, z * 2.4, 2) - 0.5) * 0.006;
    // slight crown on the berm top
    if (sdf > 0.0) h += 0.012 * smoothstep(0, 0.8, sdf);
  }

  // ---- blend to the outer plain from the field perimeter
  const dOutX = Math.max(f.x0 - x, 0, x - f.x1);
  let dOut = Math.hypot(dOutX, Math.max(f.z0 - z, 0, z - f.z1));
  if (x >= f.x0 && x <= f.x1 && z >= f.z0 && z <= f.z1) dOut = 0;
  if (dOut > 0) {
    const outer = outerPlainHeight(x, z);
    const mask = 1 - smoothstep(0.0, 3.2, dOut);
    h = lerp(outer, h, mask);
  }

  // ---- foreground dry pan (raked salt flat, lower than the bunds)
  const dp = CFG.dryPan;
  const inPan = x > dp.x0 - 1.4 && x < dp.x1 + 1.4 && z > dp.z0 - 1.4 && z < dp.z1 + 1.4;
  if (inPan) {
    const pen = Math.min(
      smoothstep(dp.x0 - 1.4, dp.x0 + 0.6, x),
      smoothstep(dp.x1 + 1.4, dp.x1 - 0.6, x),
      smoothstep(dp.z0 - 1.4, dp.z0 + 0.6, z),
      smoothstep(dp.z1 + 1.4, dp.z1 - 0.6, z)
    );
    let panH = 1.335 + (fbm2(x * 0.42 + 4.1, z * 0.42 + 7.7, 3) - 0.5) * 0.035;
    // drainage veins
    for (const rv of LAYOUT.rivulets) {
      const d = distToPolyline(x, z, rv.pts);
      if (d < rv.width * 3.2) {
        const carve = Math.exp(-(d / rv.width) * (d / rv.width) * 2.0);
        panH -= 0.085 * carve;
      }
    }
    h = lerp(h, panH, pen);
  }

  // ---- gate openings carved through the bunds
  for (const g of LAYOUT.gates) {
    const dx = Math.abs(x - g.x), dz = Math.abs(z - g.z);
    if (dx > g.w * 0.5 + 1.35 || dz > 1.55) continue;
    const along = smoothstep(g.w * 0.5 + 1.25, g.w * 0.5 - 0.2, dx);
    const across = smoothstep(1.45, 0.35, dz);
    const mask = along * across;
    if (mask <= 0) continue;
    const floor = lerp(g.waterLow - 0.16, g.waterHigh - 0.16, smoothstep(g.z - 0.8, g.z + 0.8, z));
    h = lerp(h, floor, mask);
    out.gate = g;
  }

  out.h = h;
  out.cell = cell;
  out.sdf = sdf;
  out.dOut = dOut;
  return out;
}

function surfaceHeight(x, z) {
  return sampleSurface(x, z, _surf).h;
}

// ---------------------------------------------------------------------------
// shared material helper: adds procedural cloud shadows to any standard material
// ---------------------------------------------------------------------------
const SITE_MATERIALS = [];

function makeSiteMaterial(params, key) {
  const m = new THREE.MeshStandardMaterial(params);
  m.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = 'varying vec3 vCloudW;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       vec4 cw = vec4(transformed, 1.0);
       #ifdef USE_INSTANCING
         cw = instanceMatrix * cw;
       #endif
       vCloudW = (modelMatrix * cw).xyz;
      `
    );
    shader.fragmentShader = GLSL_UNIFORMS + GLSL_NOISE + GLSL_SKY + 'varying vec3 vCloudW;\n' + shader.fragmentShader;
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <aomap_fragment>',
      `#include <aomap_fragment>
       float cCloudVis = sunVisibility(vCloudW.xz);
       reflectedLight.directDiffuse *= cCloudVis;
       reflectedLight.directSpecular *= cCloudVis;
       reflectedLight.indirectDiffuse *= mix(0.52, 1.0, cCloudVis);
       reflectedLight.indirectSpecular *= mix(0.58, 1.0, cCloudVis);
      `
    );
  };
  m.customProgramCacheKey = () => 'site-' + key;
  m.userData.key = key;
  SITE_MATERIALS.push(m);
  return m;
}

// ---------------------------------------------------------------------------
// ground material: surface-history colouring + granular normal + cloud light
// ---------------------------------------------------------------------------
function makeGroundMaterial() {
  const m = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.88,
    metalness: 0.0,
    normalMap: TEX.groundNormal,
    envMapIntensity: 0.4,
    dithering: true,
  });
  m.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader =
      GLSL_UNIFORMS + GLSL_NOISE + GLSL_SKY +
      'attribute vec4 aSurf;\nvarying vec4 vSurf;\nvarying vec3 vWPos;\nvarying vec3 vWNormal;\nvarying float vSunVis;\n' +
      shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       vSurf = aSurf;
       vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
       vWNormal = normalize(mat3(modelMatrix) * objectNormal);
       vSunVis = sunVisibility(vWPos.xz);
       #ifdef USE_UV
         vUv = transformed.xz * 0.62;
       #endif
      `
    );
    shader.fragmentShader =
      GLSL_UNIFORMS + GLSL_NOISE + GLSL_SKY +
      'varying vec4 vSurf;\nvarying vec3 vWPos;\nvarying vec3 vWNormal;\nvarying float vSunVis;\n' +
      shader.fragmentShader;

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <color_fragment>',
      `#include <color_fragment>
       vec2 muv = (vWPos.xz - uMacroRect.xy) / (uMacroRect.zw - uMacroRect.xy);
       float mW = (1.0 - smoothstep(0.0, 0.045, max(max(-muv.x, muv.x - 1.0), max(-muv.y, muv.y - 1.0))));
       vec3 macroCol = texture2D(uMacroTex, clamp(muv, 0.0015, 0.9985)).rgb;
       vec3 plainCol = vec3(0.185, 0.162, 0.122) * (0.85 + 0.3 * macroCol.r);
       vec3 base = mix(plainCol, macroCol, mW);
       if (mW < 0.995) {
         // large scale variation for the open coastal plain beyond the map
         float pn1 = sNoise(vWPos.xz * 0.071);
         float pn2 = sNoise(vWPos.xz * 0.019 + 17.0);
         vec3 outer = base * (0.74 + 0.46 * pn1);
         outer = mix(outer, outer * vec3(0.84, 0.98, 0.76), smoothstep(0.50, 0.82, pn2) * 0.85);
         outer = mix(outer, outer * 1.14, smoothstep(0.62, 0.95, sNoise(vWPos.xz * 0.24 + 3.0)) * 0.5);
         base = mix(outer, base, mW);
       }
       // beach sand: keep the macro grain and wrack visible
       vec3 sandTint = vec3(0.31, 0.268, 0.20);
       base = mix(base, base * 0.62 + sandTint * 0.72, clamp(vSurf.w, 0.0, 1.0) * 0.9);
       // salt crust: bleached, crystalline
       float crustN = texture2D(uMacroTex, muv * 2.0 + 0.37).r;
       vec3 saltCol = vec3(0.50, 0.487, 0.452) * (0.84 + crustN * 0.30);
       base = mix(base, saltCol, clamp(vSurf.y, 0.0, 1.0) * 0.85);
       // wet earth / brine-darkened banks
       base *= mix(1.0, 0.42, clamp(vSurf.x, 0.0, 1.0));
       base *= 0.90 + 0.14 * crustN;
       if (uDebug > 0.5) base = vec3(vSunVis, vSunVis * 0.25, 0.0);
       diffuseColor.rgb = base;
       gWet = vSurf.x;
       gCrust = vSurf.y;
       gAO = vSurf.z;
      `
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <roughnessmap_fragment>',
      `#include <roughnessmap_fragment>
       roughnessFactor = mix(0.94, 0.42, clamp(gWet, 0.0, 1.0));
       roughnessFactor = mix(roughnessFactor, 0.99, clamp(gCrust, 0.0, 1.0) * 0.55);
      `
    );

    // declare shared globals before main
    shader.fragmentShader = shader.fragmentShader.replace(
      'void main() {',
      'float gWet = 0.0;\nfloat gCrust = 0.0;\nfloat gAO = 1.0;\nvoid main() {'
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <aomap_fragment>',
      `#include <aomap_fragment>
       float gSunVis = vSunVis;
       reflectedLight.directDiffuse *= gSunVis;
       reflectedLight.directSpecular *= gSunVis;
       reflectedLight.indirectDiffuse *= mix(0.46, 1.0, gSunVis) * mix(0.72, 1.0, gAO);
       reflectedLight.indirectSpecular *= mix(0.52, 1.0, gSunVis) * mix(0.74, 1.0, gAO);
       // glittering salt grains
       vec3 Vw = normalize(uCamPos - vWPos);
       vec3 Hw = normalize(Vw + uSunDir);
       float cell = sHash12(floor(vWPos.xz * 64.0) + floor(vWPos.y * 41.0));
       float glint = smoothstep(0.975, 0.998, cell);
       float sp = pow(max(dot(normalize(vWNormal), Hw), 0.0), 110.0);
       float sparkleAmt = smoothstep(0.15, 0.9, gCrust) * glint * sp * 2.4 * (1.0 + 1.4 * uHero);
       reflectedLight.directSpecular += uSunColor * sparkleAmt * gSunVis;
       // wet mud sheen near the waterline
       float sheen = pow(max(dot(normalize(vWNormal), Hw), 0.0), 22.0) * smoothstep(0.35, 0.95, gWet);
       reflectedLight.directSpecular += uSunColor * sheen * 0.10 * gSunVis;
      `
    );
  };
  m.customProgramCacheKey = () => 'ground';
  return m;
}

// ---------------------------------------------------------------------------
// mesh construction
// ---------------------------------------------------------------------------
function buildTerrain() {
  // non-uniform grid: dense over the works, expanding to the horizon
  const xs = [];
  const denseX0 = -62, denseX1 = 62, stepX = 0.38;
  const denseXs = [];
  for (let x = denseX0; x <= denseX1 + 1e-6; x += stepX) denseXs.push(x);
  let grow = 0.45, edge = denseX1;
  const ext = [];
  while (grow < 700) { edge += grow; ext.push(edge); grow *= 1.9; }
  const left = ext.map((e) => -e).reverse();
  xs.push(...left, ...denseXs, ...ext);

  const zs = [];
  const denseZ0 = -48, denseZ1 = 42, stepZ = 0.38;
  for (let z = denseZ0; z <= denseZ1 + 1e-6; z += stepZ) zs.push(z);
  grow = 0.5; edge = denseZ1;
  while (grow < 700) { edge += grow; zs.push(edge); grow *= 1.9; }

  const nx = xs.length, nz = zs.length;
  const pos = new Float32Array(nx * nz * 3);
  const uvs = new Float32Array(nx * nz * 2);
  const surf = new Float32Array(nx * nz * 4);
  const heightAt = new Float32Array(nx * nz);
  const info = { h: 0, cell: null, sdf: 0, dOut: 0, gate: null };

  for (let j = 0; j < nz; j++) {
    const z = zs[j];
    for (let i = 0; i < nx; i++) {
      const x = xs[i];
      const k = j * nx + i;
      sampleSurface(x, z, info);
      const h = info.h;
      pos[k * 3] = x; pos[k * 3 + 1] = h; pos[k * 3 + 2] = z;
      uvs[k * 2] = x * 0.62;
      uvs[k * 2 + 1] = z * 0.62;
      heightAt[k] = h;

      // surface attributes: wetness, salt crust, ambient occlusion, sandiness
      let wet = 0.0, crust = 0.0, ao = 1.0, sand = 0.0;
      const noiseA = fbm2(x * 0.85 + 3.7, z * 0.85 + 8.3, 2);
      const noiseB = fbm2(x * 0.19 + 1.1, z * 0.19 + 4.4, 2);
      if (z < CFG.field.z0 - 0.6) {
        sand = smoothstep(-41.0, -45.6, z);
        wet = smoothstep(-44.2, -46.9, z) * 0.85;
        crust = 0.06 * noiseB;
        ao = 1.0;
      } else if (info.cell && info.dOut < 0.5) {
        const c = info.cell;
        const dw = h - c.waterY;
        if (dw < -0.01) {
          wet = 1.0;
          ao = 0.72;
        } else {
          wet = 0.85 * Math.exp(-dw * 14.0) + 0.20 * Math.exp(-dw * 3.2);
          crust = smoothstep(0.005, 0.055, dw) * (1.0 - smoothstep(0.13, 0.34, dw)) * 0.80;
          crust += 0.07 * (1.0 - smoothstep(0.1, 0.55, dw));
          ao = 0.74 + 0.26 * smoothstep(-CFG.bankRun, -0.05, info.sdf);
          if (info.sdf > 0.05) {
            crust = clamp(crust + 0.08 + noiseA * 0.20, 0, 1);
            wet *= 0.25;
          }
        }
        crust = clamp(crust + noiseA * 0.08 - 0.02, 0, 1);
        wet = clamp(wet * (0.75 + noiseA * 0.5), 0, 1);
      } else {
        // dry pans, bunds, plain
        sand = 0.05 * smoothstep(0.4, 0.9, noiseB);
        wet = 0.10 * smoothstep(0.55, 0.95, noiseA);
        crust = 0.08 + 0.28 * smoothstep(0.35, 0.85, noiseB);
        crust = clamp(crust + 0.14 * smoothstep(0.25, 0.9, fbm2(x * 0.09, z * 0.09, 2)), 0, 1);
        ao = 0.94 + 0.06 * noiseB;
      }
      // the dry pan is thick white crust
      const dp = CFG.dryPan;
      if (x > dp.x0 && x < dp.x1 && z > dp.z0 && z < dp.z1) {
        crust = clamp(crust + 0.62, 0, 1);
        wet = Math.max(wet, 0.22);
        sand = 0.0;
      }
      surf[k * 4] = wet;
      surf[k * 4 + 1] = crust;
      surf[k * 4 + 2] = ao;
      surf[k * 4 + 3] = sand;
    }
  }

  const idx = new Uint32Array((nx - 1) * (nz - 1) * 6);
  let o = 0;
  for (let j = 0; j < nz - 1; j++) {
    for (let i = 0; i < nx - 1; i++) {
      const a = j * nx + i;
      const b = a + 1;
      const c = a + nx;
      const d = c + 1;
      idx[o++] = a; idx[o++] = c; idx[o++] = b;
      idx[o++] = b; idx[o++] = c; idx[o++] = d;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setAttribute('aSurf', new THREE.BufferAttribute(surf, 4));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  geo.computeBoundingSphere();

  const mat = makeGroundMaterial();
  const mesh = new THREE.Mesh(geo, mat);
  // terrain does not cast into the shadow map (large pass, subtle berm shadows);
  // props and timber still do, and the banks keep their baked contact shading.
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  scene.add(mesh);

  debugAPI.buildInfo = { terrainVerts: nx * nz, terrainTris: idx.length / 3 };
  return mesh;
}

// salt surfaces that glint when the gap passes over them
function makeSaltSparkMaterial() {

    map: TEX.salt, normalMap: TEX.saltNormal,
