function makeCrystalMaterial() {
  const m = new THREE.MeshStandardMaterial({
    color: new THREE.Color('#e2dccd'),
    roughness: 0.24,
    metalness: 0.0,
    envMapIntensity: 0.55,
    transparent: true,
    opacity: 0.93,
  });
  m.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = 'varying vec3 vCryW;\nvarying vec3 vCryN;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       vec4 cw = vec4(transformed, 1.0);
       vec3 cn = objectNormal;
       #ifdef USE_INSTANCING
         cw = instanceMatrix * cw;
         cn = mat3(instanceMatrix) * cn;
       #endif
       vCryW = (modelMatrix * cw).xyz;
       vCryN = normalize(mat3(modelMatrix) * cn);
      `
    );
    shader.fragmentShader =
      GLSL_UNIFORMS + GLSL_NOISE + GLSL_SKY +
      'varying vec3 vCryW;\nvarying vec3 vCryN;\n' + shader.fragmentShader;
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <aomap_fragment>',
      `#include <aomap_fragment>
       float cv = sunVisibility(vCryW.xz);
       reflectedLight.directDiffuse *= cv;
       reflectedLight.directSpecular *= cv;
       vec3 Vw = normalize(uCamPos - vCryW);
       vec3 Hw = normalize(Vw + uSunDir);
       float sp = pow(max(dot(normalize(vCryN), Hw), 0.0), 240.0);
       float face = sHash12(floor(vCryW.xz * 210.0) + floor(vCryW.y * 180.0));
       float g = smoothstep(0.55, 0.95, face);
       float hero = 0.3 + 2.4 * uHero;
       reflectedLight.directSpecular += uSunColor * (sp * 3.4 + g * 0.9) * cv * hero;
       reflectedLight.indirectSpecular *= 0.9 + 0.9 * uHero;
      `
    );
  };
  m.customProgramCacheKey = () => 'crystal';
  return m;
}

// ---------------------------------------------------------------------------
// geometry helpers
// ---------------------------------------------------------------------------
function boxPart(w, h, d, x, y, z, ry = 0, rx = 0, rz = 0) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ'));
  m.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(1, 1, 1));
  return { geo: g, matrix: m };
}

// merge timber parts, giving them continuous world-space grain UVs
function mergeTimber(parts, uvScale = 0.62) {
  const geos = [];
  for (const p of parts) {
    const g = p.geo.clone();
    if (g.attributes.uv2) g.deleteAttribute('uv2');
    g.applyMatrix4(p.matrix);
    const pos = g.attributes.position, nrm = g.attributes.normal;
    const uv = new Float32Array(pos.count * 2);
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const nx = Math.abs(nrm.getX(i)), ny = Math.abs(nrm.getY(i)), nz = Math.abs(nrm.getZ(i));
      let u, v;
      if (ny >= nx && ny >= nz) { u = x; v = z; }
      else if (nx >= nz) { u = z; v = y; }
      else { u = x; v = y; }
      uv[i * 2] = u / uvScale;
      uv[i * 2 + 1] = v / uvScale;
    }
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geos.push(g);
  }
  const merged = mergeGeometries(geos, false);
  for (const g of geos) g.dispose();
  return merged;
}

// cylinder between two points (ropes, braces)
function tubePart(r1, r2, ax, ay, az, bx, by, bz, radial = 5, open = false) {
  const a = new THREE.Vector3(ax, ay, az), b = new THREE.Vector3(bx, by, bz);
  const len = a.distanceTo(b);
  const g = new THREE.CylinderGeometry(r2, r1, len, radial, 1, open);
  const m = new THREE.Matrix4();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const dir = b.clone().sub(a).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  m.compose(mid, q, new THREE.Vector3(1, 1, 1));
  return { geo: g, matrix: m };
}

function addMesh(geo, mat, cast = true, receive = true, parent = scene) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  parent.add(mesh);
  return mesh;
}

// soft radial texture used for splash foam / shadow decals
function makeRadialTexture(size, inner, outer) {
  const cv = makeCanvas(size, size);
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, inner);
  g.addColorStop(0.55, outer);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}


/* ===================== 40_water.js ===================== */
/* SALT MIRROR — brine: absorption-tinted shallow water, sky mirror, ripples. */

const WATER_VERT = /* glsl */`
${GLSL_UNIFORMS}
${GLSL_NOISE}
${GLSL_SKY}
  varying vec3 vW;
  varying vec2 vUvLocal;
  varying float vSunVis;
  void main() {
    vUvLocal = uv;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vW = wp.xyz;
    vSunVis = sunVisibility(wp.xz);
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const WATER_FRAG = /* glsl */`
${GLSL_UNIFORMS}
${GLSL_NOISE}
${GLSL_SKY}

uniform vec4 uRect;
uniform float uDepth;
uniform vec3 uShallow;
uniform vec3 uDeep;
uniform vec3 uAbsorb;
uniform float uShelter;
uniform float uSeed;
uniform float uWaterY;
uniform float uSalinity;
uniform vec4 uRipples[8];
uniform float uRippleCount;
uniform vec2 uSluiceA;
uniform vec2 uSluiceB;
uniform float uSluiceTop;
varying vec3 vW;
varying vec2 vUvLocal;
varying float vSunVis;

float distToSeg(vec2 p, vec2 a, vec2 b) {
  vec2 ab = b - a;
  float t = clamp(dot(p - a, ab) / max(dot(ab, ab), 1e-5), 0.0, 1.0);
  return length(p - (a + ab * t));
}

// a more structured sky for the pan mirrors: reflected cloud masses show
vec3 mirrorSky(vec3 dir) {
  float y = clamp(dir.y, 0.0, 1.0);
  vec3 col = mix(uSkyHorizon, uSkyZenith, pow(y, 0.58));
  col = mix(uSkyHaze, col, smoothstep(0.0, 0.20, y));
  float sd = max(dot(dir, uSunDir), 0.0);
  col += uSunColor * pow(sd, 26.0) * 0.10;
  vec2 q = (uCamPos.xz + dir.xz * (uCloudHeight / max(dir.y, 0.02)) - uCloudOffset) / uCloudTile;
  float d1 = texture2D(uCloudTex, q).r;
  float d2 = texture2D(uCloudTex, q * 2.63 + vec2(0.17, 0.41)).r;
  float dens = smoothstep(0.40, 0.74, d1 * 0.70 + d2 * 0.30);
  dens *= smoothstep(0.004, 0.11, dir.y);
  vec3 cc = mix(uCloudShade, uCloudBright, 0.52);
  col = mix(col, cc, dens * 0.55);
  return col;
}

void main() {
  vec2 p = vW.xz;
  float t = uTime;

  // ---- shallowness profile: brine thins toward the earthen rim
  vec2 e = min(p - uRect.xy, uRect.zw - p);
  float edgeD = min(e.x, e.y);
  float depth = 0.012 + uDepth * smoothstep(0.48, 1.95, edgeD);
  float deepF = smoothstep(0.0, 0.85, depth);

  // ---- surface normals: wind chop (roughness) + event rings
  vec2 grad = vec2(0.0);
  float rough = mix(1.0, 0.24, uShelter);
  {
    vec2 d1 = normalize(vec2(0.82, 0.57));
    vec2 d2 = normalize(vec2(-0.55, 0.84));
    vec2 d3 = normalize(vec2(0.97, -0.24));
    grad += d1 * cos(dot(p, d1) * 1.55 + t * 0.85 + uSeed) * 0.15;
    grad += d2 * cos(dot(p, d2) * 2.65 - t * 1.20 + uSeed * 1.7) * 0.090;
    grad += d3 * cos(dot(p, d3) * 4.30 + t * 1.85 + uSeed * 0.6) * 0.050;
    // broken fine chop
    float n1 = sNoise(p * 2.6 + vec2(t * 0.26, -t * 0.19) + uSeed);
    float n2 = sNoise(p * 4.9 - vec2(t * 0.39, t * 0.16) + uSeed * 2.3);
    grad += vec2(n1 - 0.5, n2 - 0.5) * 0.085;
  }
  // incoming sluice / weir rings
  for (int i = 0; i < 8; i++) {
    if (float(i) >= uRippleCount) break;
    vec4 rp = uRipples[i];
    if (rp.x < uRect.x || rp.x > uRect.z || rp.y < uRect.y || rp.y > uRect.w) continue;
    float dt = t - rp.z;
    if (dt <= 0.0 || dt > 8.0) continue;
    vec2 dv = p - rp.xy;
    float r = length(dv) + 1e-4;
    float ring = dt * 1.85;
    float dr = r - ring;
    float env = exp(-dr * dr * 1.7) * exp(-dt * 0.50);
    float w = sin(dr * 11.5) * env * rp.w;
    grad += (dv / r) * w * 0.5;
  }
  grad *= rough;
  vec3 N = normalize(vec3(-grad.x * 0.24, 1.0, -grad.y * 0.24));

  vec3 V = normalize(uCamPos - vW);
  float ndv = clamp(dot(N, V), 0.0, 1.0);
  float sunVis = vSunVis;

  // ---- the pan floor, seen through the brine
  vec2 muv = (p - uMacroRect.xy) / (uMacroRect.zw - uMacroRect.xy);
  muv += N.xz * 0.008;
  vec3 bed = texture2D(uMacroTex, clamp(muv, 0.0, 1.0)).rgb;
  // cloud shade falls on the bed before the light is filtered by the brine
  vec3 bedLit = bed * mix(0.28, 1.0, sunVis);
  vec3 trans = exp(-uAbsorb * depth * 6.2);
  vec3 under = bedLit * trans;
  // upwelling scatter from the brines themselves
  under += uDeep * (1.0 - trans) * mix(0.12, 1.45, sunVis);
  // shallow margin: pale salt mud showing through
  under = mix(under, uShallow * 0.38 * mix(0.35, 1.0, sunVis), smoothstep(1.15, 0.35, edgeD) * 0.5);
  // contact darkening and cool bounce near the earthen rim
  under *= 0.78 + 0.22 * smoothstep(0.2, 1.8, edgeD);

  // ---- mirror: the sky above the far horizon
  vec3 R = reflect(-V, N);
  R.y = abs(R.y);
  vec3 refl = mirrorSky(R) * 1.12;
  refl *= 0.80 + 0.20 * sunVis;
  float F = 0.022 + 0.978 * pow(1.0 - ndv, 5.0);
  F *= mix(0.78, 1.42, uShelter);
  F = clamp(F, 0.0, 0.62);

  // ---- direct sun: glitter and grazing highlights
  vec3 H = normalize(V + uSunDir);
  float spec = pow(max(dot(N, H), 0.0), 900.0) * 1.15
             + pow(max(dot(N, H), 0.0), 70.0) * 0.035;
  float glintCell = sHash12(floor(p * 150.0) + floor(uSeed));
  float glint = smoothstep(0.9955, 0.9995, glintCell) * (0.25 + 0.55 * uShelter);
  spec += glint * pow(max(dot(N, H), 0.0), 40.0) * (0.9 + 2.4 * uHero);
  vec3 sunCol = uSunColor * uSunIntensity * 0.30;

  // the raised launder's shadow, projected on the brine
  float sluiceVis = 1.0;
  {
    float hgt = max(0.15, uSluiceTop - uWaterY);
    vec2 off = uSunDir.xz * (hgt / max(uSunDir.y, 0.15));
    vec2 a = uSluiceA - off;
    vec2 b = uSluiceB - off;
    float d = distToSeg(p, a, b);
    float band = 0.42 + 0.35 * smoothstep(0.0, 8.0, length(p - uSluiceA));
    sluiceVis -= 0.36 * (1.0 - smoothstep(0.0, band + 1.1, d));
  }

  // ---- shoreline rime: salt crust and a thin foam line
  float rimeN = sNoise(p * 6.0 + uSeed);
  float rime = smoothstep(1.42, 0.55, edgeD) * smoothstep(0.18, 0.55, edgeD);
  vec3 rimeCol = vec3(0.48, 0.465, 0.43) * (0.82 + 0.3 * rimeN);
  float foam = smoothstep(0.90, 0.52, edgeD) * smoothstep(0.2, 0.5, edgeD) *
               smoothstep(0.45, 0.8, sNoise(p * 8.5 - uTime * 0.15));

  vec3 col = under * (1.0 - F) + refl * F;
  col += sunCol * spec * sunVis * sluiceVis;
  col = mix(col, rimeCol, clamp(rime * 0.38 + foam * 0.42, 0.0, 0.62));
  // a whisper of wind-driven brightness across the mirror
  col += vec3(0.012, 0.013, 0.014) * sunVis * smoothstep(0.4, 0.9, sNoise(p * 0.5 + vec2(t * 0.03, 0.0)));

  col = fogApply(col, length(uCamPos - vW));

  if (uDebug > 0.5) col = vec3(vSunVis, vSunVis * 0.25, 0.0);

  gl_FragColor = vec4(col, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}
`;

function makeBasinWater(c) {
  const geo = new THREE.PlaneGeometry(c.x1 - c.x0, c.z1 - c.z0, 8, 8);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U, {
      uRect: { value: new THREE.Vector4(c.x0, c.z0, c.x1, c.z1) },
      uDepth: { value: c.depth },
      uShallow: { value: c.shallowCol },
      uDeep: { value: c.deepCol },
      uAbsorb: { value: c.absorb },
      uShelter: { value: c.shelter },
      uSeed: { value: c.seed },
      uWaterY: { value: c.waterY },
      uSalinity: { value: c.salinity },
    }),
    vertexShader: WATER_VERT,
    fragmentShader: WATER_FRAG,
    fog: false,
    transparent: false,
    depthWrite: true,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(c.cx, c.waterY, c.cz);
  mesh.receiveShadow = false;
  mesh.castShadow = false;
  mesh.userData.cell = c;
  scene.add(mesh);
  return mesh;
}

let WATER_MESHES = [];

function buildWater() {
  WATER_MESHES = CELLS.map((c) => makeBasinWater(c));
  U.uSluiceA.value.set(LAYOUT.sluice.a.x, LAYOUT.sluice.a.z);
  U.uSluiceB.value.set(LAYOUT.sluice.b.x, LAYOUT.sluice.b.z);
  U.uSluiceTop.value = LAYOUT.sluice.waterY + 0.18;
  return WATER_MESHES;
}


/* ===================== 45_sluice.js ===================== */
/* SALT MIRROR — the diagonal timber launder, sluice gates, weirs, pump wheels. */

const SLUICE = { gates: [], streams: [], wheels: [], head: null, splash: [] };

// ---------------------------------------------------------------------------
// flowing-water ribbon shader (launder water, falling streams, weir spills)
// ---------------------------------------------------------------------------
function makeFlowMaterial(colA, colB, speed, opacity, seed) {
  return new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U, {
      uColA: { value: new THREE.Color(colA) },
      uColB: { value: new THREE.Color(colB) },
      uSpeed: { value: speed },
      uOpacity: { value: opacity },
      uSeed: { value: seed },
    }),
    vertexShader: /* glsl */`
      varying vec2 vF;
      varying vec3 vW;
      void main() {
        vF = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vW = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      ${GLSL_UNIFORMS}
      ${GLSL_NOISE}
      ${GLSL_SKY}
      uniform vec3 uColA;
      uniform vec3 uColB;
      uniform float uSpeed;
      uniform float uOpacity;
      uniform float uSeed;
      varying vec2 vF;
      varying vec3 vW;
      void main() {
        float t = uTime;
        vec2 q = vec2(vF.x * 2.4, vF.y * 0.55);
        float n = sNoise(q * vec2(3.0, 1.0) + vec2(0.0, -t * uSpeed));
        float n2 = sNoise(q * vec2(7.0, 2.2) + vec2(3.7, -t * uSpeed * 2.15));
        float foam = smoothstep(0.52, 0.86, n * 0.58 + n2 * 0.42);
        vec3 col = mix(uColA, uColB, foam);
        // light on the water surface
        vec3 V = normalize(uCamPos - vW);
        float fres = pow(1.0 - clamp(abs(V.y), 0.0, 1.0), 3.0);
        col += vec3(0.10, 0.11, 0.115) * (0.3 + fres);
        float sparkle = step(0.994, sHash12(floor(vec2(vF.x * 160.0, vF.y * 620.0 - t * uSpeed * 70.0)) + uSeed));
        col += vec3(0.35) * sparkle * smoothstep(0.4, 0.9, foam);
        float alpha = uOpacity * (0.62 + 0.38 * foam);
        gl_FragColor = vec4(col, alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    fog: false,
  });
}

function makeRibbon(points, widthFn, sideX, sideZ, uOffset) {
  const n = points.length;
  const pos = [];
  const uv = [];
  const idx = [];
  let dist = 0;
  const side = new THREE.Vector3(sideX, 0, sideZ).normalize();
  for (let i = 0; i < n; i++) {
    const p = points[i];
    if (i > 0) dist += p.distanceTo(points[i - 1]);
    const w = widthFn(i / (n - 1)) * 0.5;
    pos.push(p.x + side.x * w, p.y, p.z + side.z * w);
    pos.push(p.x - side.x * w, p.y, p.z - side.z * w);
    uv.push(0.0, dist + uOffset);
    uv.push(1.0, dist + uOffset);
    if (i > 0) {
      const a = (i - 1) * 2, b = a + 1, c = i * 2, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeBoundingSphere();
  return g;
}

// ---------------------------------------------------------------------------
// the launder
// ---------------------------------------------------------------------------
function buildSluice() {
  const S = LAYOUT.sluice;
  const A = S.a, B = S.b;
  const d = S.dir;
  const side = { x: -d.z, z: d.x };
  const theta = Math.atan2(-d.z, d.x);
  const midX = (A.x + B.x) * 0.5, midZ = (A.z + B.z) * 0.5;
  const deck = S.deckY;
  const L = S.len;

  // ---------- static timber: flume box, trestles, head frame ----------
  const dark = [], grey = [];

  // three long boards forming the trough (bottom, two sides)
  dark.push(boxPart(L, 0.07, S.width, midX, deck, midZ, theta));
  dark.push(boxPart(L, S.wallH, 0.055, midX + side.x * (S.width * 0.5), deck + S.wallH * 0.5,
    midZ + side.z * (S.width * 0.5), theta));
  dark.push(boxPart(L, S.wallH, 0.055, midX - side.x * (S.width * 0.5), deck + S.wallH * 0.5,
    midZ - side.z * (S.width * 0.5), theta));
  // outer cap rails
  grey.push(boxPart(L, 0.05, 0.11, midX + side.x * (S.width * 0.5 + 0.02), deck + S.wallH + 0.02,
    midZ + side.z * (S.width * 0.5 + 0.02), theta));
  grey.push(boxPart(L, 0.05, 0.11, midX - side.x * (S.width * 0.5 + 0.02), deck + S.wallH + 0.02,
    midZ - side.z * (S.width * 0.5 + 0.02), theta));

  // plank catwalk with a rope rail along the camera-facing side of the trough
  {
    const wx = midX + side.x * (S.width * 0.5 + 0.26);
    const wz = midZ + side.z * (S.width * 0.5 + 0.26);
    dark.push(boxPart(L, 0.045, 0.38, wx, deck + S.wallH + 0.03, wz, theta));
    for (let s = 1.2; s < L - 1.0; s += 4.4) {
      const px = A.x + d.x * s + side.x * (S.width * 0.5 + 0.26);
      const pz = A.z + d.z * s + side.z * (S.width * 0.5 + 0.26);
      grey.push(tubePart(0.03, 0.028, px, deck + S.wallH + 0.02, pz,
        px, deck + S.wallH + 0.52, pz, 4, true));
    }
    const p1x = A.x + d.x * 1.2 + side.x * (S.width * 0.5 + 0.26);
    const p1z = A.z + d.z * 1.2 + side.z * (S.width * 0.5 + 0.26);
    const p2x = A.x + d.x * (L - 1.0) + side.x * (S.width * 0.5 + 0.26);
    const p2z = A.z + d.z * (L - 1.0) + side.z * (S.width * 0.5 + 0.26);
    grey.push(tubePart(0.022, 0.022, p1x, deck + S.wallH + 0.5, p1z,
      p2x, deck + S.wallH + 0.5, p2z, 4, true));
  }

  // trestles
  const trestleCount = 17;
  for (let i = 0; i <= trestleCount; i++) {
    const s = (i / trestleCount) * (L - 1.2) + 0.6;
    const px = A.x + d.x * s, pz = A.z + d.z * s;
    const ground = surfaceHeight(px, pz);
    const top = deck - 0.16;
    if (top - ground < 0.15) continue;
    for (const sgn of [-1, 1]) {
      const ox = side.x * 0.56 * sgn, oz = side.z * 0.56 * sgn;
      // slight batter for timber trestles
      const lean = 0.14;
      dark.push(tubePart(0.075, 0.065,
        px + ox + side.x * lean, ground - 0.15, pz + oz + side.z * lean,
        px + ox, top, pz + oz, 5, true));
    }
    grey.push(boxPart(1.5, 0.09, 0.13, px, top - 0.02, pz, theta));
    // diagonal brace every other trestle
    if (i % 2 === 0) {
      const ax = px + side.x * 0.54, az = pz + side.z * 0.54;
      const bx = px - side.x * 0.2, bz = pz - side.z * 0.2;
      dark.push(tubePart(0.045, 0.045, ax, top - 0.05, az, bx, top - 1.0, bz, 4, true));
    }
    // short cap plates under the trough
    grey.push(boxPart(0.34, 0.05, 1.12, px, top - 0.09, pz, theta));
  }

  // ---------- head box at the sea intake ----------
  {
    const hx = A.x - d.x * 0.4, hz = A.z - d.z * 0.4;
    const t2 = Math.atan2(-d.z, d.x);
    dark.push(boxPart(2.3, 0.06, 1.9, hx, 1.86, hz, t2));
    dark.push(boxPart(2.3, 0.5, 0.06, hx + side.x * 0.95, 2.1, hz + side.z * 0.95, t2));
    dark.push(boxPart(2.3, 0.5, 0.06, hx - side.x * 0.95, 2.1, hz - side.z * 0.95, t2));
    dark.push(boxPart(0.06, 0.5, 1.9, hx + d.x * 1.12, 2.1, hz + d.z * 1.12, t2));
    for (const sgn of [-1, 1]) {
      for (const sgn2 of [-1, 1]) {
        grey.push(tubePart(0.09, 0.08,
          hx + side.x * 0.9 * sgn + d.x * 0.95 * sgn2, 0.6,
          hz + side.z * 0.9 * sgn + d.z * 0.95 * sgn2,
          hx + side.x * 0.9 * sgn + d.x * 0.95 * sgn2, 2.28,
          hz + side.z * 0.9 * sgn + d.z * 0.95 * sgn2, 5, true));
      }
    }
    // lifting gear: a small windlass and chain
    grey.push(tubePart(0.05, 0.05, hx + d.x * 1.15, 2.55, hz + d.z * 1.15,
      hx + d.x * 1.15, 3.05, hz + d.z * 1.15, 5, true));
    grey.push(boxPart(0.12, 0.12, 1.0, hx + d.x * 1.15, 3.06, hz + d.z * 1.15, theta));
  }

  const staticMesh = new THREE.Mesh(mergeTimber(dark), MATS.woodDark);
  staticMesh.castShadow = true; staticMesh.receiveShadow = true;
  scene.add(staticMesh);
  const greyMesh = new THREE.Mesh(mergeTimber(grey), MATS.woodGrey);
  greyMesh.castShadow = true; greyMesh.receiveShadow = true;
  scene.add(greyMesh);

  // ---------- water running in the trough ----------
  {
    const pts = [];
    const startS = 0.6, endS = L - 0.12;
    const N = 6;
    for (let i = 0; i <= N; i++) {
      const s = lerp(startS, endS, i / N);
      pts.push(new THREE.Vector3(A.x + d.x * s, deck + 0.17, A.z + d.z * s));
    }
    const geo = makeRibbon(pts, () => S.width - 0.12, side.x, side.z, 0);
    // rotate uv so flow runs along length: UV.y is already metres along length
    const mat = makeFlowMaterial('#2f4440', '#cfd8cf', 2.6, 0.95, 3.0);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = 4;
    mesh.frustumCulled = false;
    scene.add(mesh);
    SLUICE.flumeWater = mesh;
  }

  // ---------- hero gate at the end of the launder ----------
  {
    const Bx = B.x, Bz = B.z;
    const gate = { kind: 'sluiceEnd', x: Bx + d.x * 1.1, z: Bz + d.z * 1.1, open: 0, stream: 0 };

    // end bulkhead in three pieces leaving a low opening
    const bw = S.width;
    const openW = 0.52, openH = 0.30;
    const frameParts = [];
    // sides + top of the end bulkhead
    frameParts.push(boxPart((bw - openW) * 0.5, S.wallH + 0.55, 0.07,
      Bx + side.x * (openW + (bw - openW) * 0.5) * 0.5, deck + 0.42, Bz + side.z * (openW + (bw - openW) * 0.5) * 0.5, theta));
    frameParts.push(boxPart((bw - openW) * 0.5, S.wallH + 0.55, 0.07,
      Bx - side.x * (openW + (bw - openW) * 0.5) * 0.5, deck + 0.42, Bz - side.z * (openW + (bw - openW) * 0.5) * 0.5, theta));
    frameParts.push(boxPart(bw + 0.14, 0.18, 0.08, Bx, deck + S.wallH + 0.64, Bz, theta));
    // frame posts and head beam
    for (const sgn of [-1, 1]) {
      frameParts.push(boxPart(0.12, 1.25, 0.12,
        Bx + side.x * (bw * 0.5 + 0.1) * sgn + d.x * 0.12, deck + 0.55,
        Bz + side.z * (bw * 0.5 + 0.1) * sgn + d.z * 0.12, theta));
    }
    frameParts.push(boxPart(bw + 0.5, 0.12, 0.12, Bx + d.x * 0.12, deck + 1.2, Bz + d.z * 0.12, theta));
    // chute lip angling down/out
    frameParts.push(boxPart(openW + 0.24, 0.05, 0.62, Bx + d.x * 0.45, deck + 0.05,
      Bz + d.z * 0.45, theta, 0.42));
    const gateFrame = new THREE.Mesh(mergeTimber(frameParts), MATS.woodDark);
    gateFrame.castShadow = true; gateFrame.receiveShadow = true;
    scene.add(gateFrame);

    // the rising board
    const boardGeo = new THREE.BoxGeometry(openW + 0.12, openH + 0.34, 0.055);
    const board = new THREE.Mesh(boardGeo, MATS.woodWet);
    const closedY = deck + 0.16;
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, theta, 0, 'YXZ'));
    board.quaternion.copy(q);
    board.position.set(Bx + d.x * 0.20, closedY, Bz + d.z * 0.20);
    board.castShadow = true; board.receiveShadow = true;
    board.userData.closedY = closedY;
    board.userData.openLift = 0.52;
    scene.add(board);
    gate.board = board;
    gate.mesh = board;
    gate.closedY = closedY;
    gate.openLift = 0.52;

    // falling stream curtain
    const pts = [];
    const startTop = new THREE.Vector3(Bx + d.x * 0.72, deck + 0.02, Bz + d.z * 0.72);
    const base = HERO ? { x: cellAt(Bx, Bz) ? cellAt(Bx, Bz).cx : Bx, z: HERO.cz } : { x: Bx, z: Bz };
    const heroCell = cellAt(Bx, Bz) || HERO;
    const endX = Bx + d.x * 1.28, endZ = Bz + d.z * 1.28;
    const N = 9;
    for (let i = 0; i <= N; i++) {
      const tt = i / N;
      const x = lerp(startTop.x, endX, tt) + Math.sin(tt * 3.0) * 0.03;
      const z = lerp(startTop.z, endZ, tt);
      const y = deck + 0.02 - (deck + 0.02 - (heroCell.waterY + 0.03)) * (tt * tt * 0.75 + tt * 0.25);
      pts.push(new THREE.Vector3(x, y, z));
    }
    const streamGeo = makeRibbon(pts, (t0) => 0.22 + 0.2 * t0, side.x, side.z, 0);
    const streamMat = makeFlowMaterial('#4c6b62', '#e8efe9', 4.2, 0.92, 7.0);
    const stream = new THREE.Mesh(streamGeo, streamMat);
    stream.frustumCulled = false;
    stream.renderOrder = 5;
    stream.visible = false;
    scene.add(stream);
    gate.streamMesh = stream;
    gate.impact = { x: endX, z: endZ, y: heroCell.waterY };
    gate.cell = heroCell;
    gate.schedule = { period: 24.0, rise: 0.55, hold: 2.9, fall: 0.7, offset: 4.4 };
    SLUICE.gates.push(gate);
    SLUICE.heroGate = gate;
    HERO.heroGate = gate;
  }

  // ---------- two side drops along the launder ----------
  const dropParams = [0.331, 0.615];
  dropParams.forEach((tp, idx) => {
    const px = A.x + d.x * L * tp, pz = A.z + d.z * L * tp;
    const cell = cellAt(px, pz) || HERO;
    const gate = { kind: 'drop', x: px, z: pz, open: 0, stream: 0, cell };
    const frameParts = [];
    // penstock box on the camera side of the trough
    const ox = side.x * (S.width * 0.5 + 0.16), oz = side.z * (S.width * 0.5 + 0.16);
    frameParts.push(boxPart(0.78, 0.62, 0.08, px + ox, deck + 0.26, pz + oz, theta));
    for (const sgn of [-1, 1]) {
      frameParts.push(boxPart(0.09, 1.05, 0.32,
        px + ox + side.x * 0.3 * sgn, deck + 0.55, pz + oz + side.z * 0.3 * sgn, theta));
    }
    frameParts.push(boxPart(0.9, 0.1, 0.34, px + ox, deck + 1.06, pz + oz, theta));
    const fr = new THREE.Mesh(mergeTimber(frameParts), MATS.woodDark);
    fr.castShadow = true; fr.receiveShadow = true;
    scene.add(fr);
    const board = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.42, 0.05), MATS.woodWet);
    board.quaternion.setFromEuler(new THREE.Euler(0, theta, 0, 'YXZ'));
    const cy = deck + 0.42;
    board.position.set(px + ox + d.x * 0.02, cy, pz + oz + d.z * 0.02);
    board.castShadow = true;
    scene.add(board);
    gate.board = board;
    gate.mesh = board;
    gate.closedY = cy;
    gate.openLift = 0.4;

    // short sloped chute and falling stream
    const chuteEnd = new THREE.Vector3(px + ox * 1.7 + d.x * 0.2, deck + 0.14, pz + oz * 1.7 + d.z * 0.2);
    const pts = [];
    const impactX = chuteEnd.x + side.x * 0.35 + d.x * 0.1;
    const impactZ = chuteEnd.z + side.z * 0.35 + d.z * 0.1;
    const impactY = cell.waterY + 0.02;
    for (let i = 0; i <= 7; i++) {
      const tt = i / 7;
      pts.push(new THREE.Vector3(
        lerp(chuteEnd.x, impactX, tt),
        lerp(chuteEnd.y, impactY, tt * tt),
        lerp(chuteEnd.z, impactZ, tt)
      ));
    }
    const geo = makeRibbon(pts, (t0) => 0.14 + 0.10 * t0, side.x, side.z, 0);
    const stream = new THREE.Mesh(geo, makeFlowMaterial('#4f6d63', '#e7eee8', 4.0, 0.9, 11.0 + idx));
    stream.frustumCulled = false;
    stream.renderOrder = 5;
    stream.visible = false;
    scene.add(stream);
    gate.streamMesh = stream;
    gate.impact = { x: impactX, z: impactZ, y: impactY };
    gate.schedule = { period: 17.0 + idx * 6.0, rise: 0.5, hold: 2.2, fall: 0.6, offset: 1.0 + idx * 7.5 };
    SLUICE.gates.push(gate);
  });

  // ---------- earthen weirs (the openings in the bunds) ----------
  LAYOUT.gates.forEach((g, idx) => {
    const cellLow = g.low;
    const zNorth = g.z - 0.82, zSouth = g.z + 0.82;
    const parts = [];
    // timber lining of the notch
    parts.push(boxPart(g.w + 0.34, 0.07, 1.5, g.x, g.waterLow - 0.12, g.z, 0));
    for (const sgn of [-1, 1]) {
      parts.push(boxPart(0.08, 0.62, 1.55, g.x + (g.w * 0.5 + 0.1) * sgn, g.waterLow + 0.14, g.z, 0));
    }
    // upstream lip and downstream sill
    parts.push(boxPart(g.w + 0.4, 0.10, 0.16, g.x, g.waterHigh - 0.02, g.z - 0.76, 0));
    parts.push(boxPart(g.w + 0.5, 0.12, 0.2, g.x, g.waterLow - 0.06, g.z + 0.72, 0));
    // posts
    for (const sgn of [-1, 1]) {
      parts.push(boxPart(0.11, 0.92, 0.11, g.x + (g.w * 0.5 + 0.18) * sgn, g.waterLow + 0.34, g.z - 0.25, 0));
    }
    const frame = new THREE.Mesh(mergeTimber(parts), MATS.woodDark);
    frame.castShadow = true; frame.receiveShadow = true;
    scene.add(frame);
    // the sliding weir board
    const boardTop = Math.max(g.waterHigh, g.waterLow) + 0.40;
    const boardBot = g.waterLow - 0.10;
    const boardH = boardTop - boardBot;
    const board = new THREE.Mesh(new THREE.BoxGeometry(g.w + 0.02, boardH, 0.05), MATS.woodWet);
    board.position.set(g.x, boardBot + boardH * 0.5, g.z - 0.25);
    board.castShadow = true;
    scene.add(board);
    const gate = {
      kind: 'weir', x: g.x, z: g.z, cellLow, cellHigh: g.high,
      board, mesh: board,
      closedY: boardBot + boardH * 0.5,
      openLift: boardH * 0.72,
      impact: { x: g.x, z: g.z + 0.62, y: cellLow.waterY },
      schedule: { period: g.period, rise: 0.45, hold: 1.5, fall: 0.5, offset: g.offset * g.period },
      open: 0, stream: 0,
    };
    // trickle stream across the notch
    const pts = [];
    for (let i = 0; i <= 6; i++) {
      const tt = i / 6;
      pts.push(new THREE.Vector3(
        g.x,
        lerp(g.waterHigh - 0.04, cellLow.waterY + 0.02, tt),
        lerp(zNorth + 0.06, zSouth + 0.1, tt)
      ));
    }
    const geo = makeRibbon(pts, (t0) => 0.20 + 0.09 * t0, 1, 0, 0);
    const stream = new THREE.Mesh(geo, makeFlowMaterial('#3f5c55', '#e6ede7', 3.2, 0.88, 21.0 + idx));
    stream.frustumCulled = false;
    stream.renderOrder = 5;
    stream.visible = false;
    scene.add(stream);
    gate.streamMesh = stream;
    SLUICE.gates.push(gate);
  });

  // ---------- splash foam discs at the impact points ----------
  const foamTex = makeRadialTexture(128, 'rgba(255,255,255,.95)', 'rgba(228,235,230,.35)');
  for (const gate of SLUICE.gates) {
    if (!gate.impact) continue;
    const mat = new THREE.MeshBasicMaterial({
      map: foamTex, transparent: true, opacity: 0, depthWrite: false,
      blending: THREE.AdditiveBlending, toneMapped: false, color: new THREE.Color('#dfe8e2'),
    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.8), mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(gate.impact.x, gate.impact.y + 0.02, gate.impact.z);
    m.renderOrder = 6;
    m.visible = false;
    scene.add(m);
    gate.splash = m;
  }

  // ---------- the intake pump wheels ----------
  buildPumpWheels();

  // ---------- seawater feed channel ----------
  {
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const tt = i / 8;
      pts.push(new THREE.Vector3(
        LAYOUT.intake.x + Math.sin(tt * 3.0) * 0.25,
        lerp(0.09, 0.16, tt),
        lerp(-48.6, -41.8, tt)
      ));
    }
    const geo = makeRibbon(pts, () => 2.5, 1, 0, 0);
    const mesh = new THREE.Mesh(geo, makeFlowMaterial('#41605c', '#cdd8d2', 1.6, 0.9, 31.0));
    mesh.frustumCulled = false;
    mesh.renderOrder = 4;
    scene.add(mesh);
    SLUICE.intakeWater = mesh;
  }

  debugAPI.buildInfo = Object.assign(debugAPI.buildInfo || {}, {
    sluiceGates: SLUICE.gates.length,
  });
  debugAPI.sluice = SLUICE;
  return SLUICE;
}

// ---------------------------------------------------------------------------
// paddle wheels at the sea intake
// ---------------------------------------------------------------------------
function makeWheelGeometry(radius, width, paddles) {
  const parts = [];
  const rim = new THREE.TorusGeometry(radius, 0.05, 6, 24);
  // torus lies in XY; rotate to YZ (axle along X)
  for (const sgn of [-1, 1]) {
    const g = rim.clone();
    const m = new THREE.Matrix4().makeRotationY(Math.PI / 2);
    m.multiply(new THREE.Matrix4().makeTranslation(0, 0, 0));
    m.multiply(new THREE.Matrix4().makeRotationY(0));
    // translate along X after rotating
    const m2 = new THREE.Matrix4().makeTranslation(sgn * width * 0.5, 0, 0);
    m2.multiply(m);
    parts.push({ geo: g, matrix: m2 });
  }
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const y = Math.cos(a) * radius * 0.5, z = Math.sin(a) * radius * 0.5;
    const spoke = new THREE.CylinderGeometry(0.035, 0.035, radius, 5);
    const m = new THREE.Matrix4().makeRotationX(a);
    m.setPosition(0, y, z);
    // orient cylinder along radial direction
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, Math.cos(a), Math.sin(a)));
    m.compose(new THREE.Vector3(0, y, z), q, new THREE.Vector3(1, 1, 1));
    parts.push({ geo: spoke, matrix: m });
  }
  for (let i = 0; i < paddles; i++) {
    const a = (i / paddles) * Math.PI * 2;
    const pg = new THREE.BoxGeometry(width * 0.98, 0.24, 0.05);
    const m = new THREE.Matrix4();
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(a, 0, Math.PI / 2, 'ZYX'));
    m.compose(new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius), q, new THREE.Vector3(1, 1, 1));
    parts.push({ geo: pg, matrix: m });
  }
  // axle
  const axle = new THREE.CylinderGeometry(0.075, 0.075, width * 1.8, 8);
  const am = new THREE.Matrix4().makeRotationZ(Math.PI / 2);
  parts.push({ geo: axle, matrix: am });
  const geos = parts.map((p) => { const g = p.geo.clone(); g.applyMatrix4(p.matrix); return g; });
  const merged = mergeGeometries(geos, false);
  for (const g of geos) g.dispose();
  rim.dispose();
  return merged;
}

function buildPumpWheels() {
  const ix = LAYOUT.intake.x;
  const wheelGroup = new THREE.Group();
  // timber frame
  const parts = [];
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      parts.push(tubePart(0.09, 0.08,
        ix + sx * 1.5, 0.45, -42.9 + sz * 1.5,
        ix + sx * 1.5, 3.2, -42.9 + sz * 1.5, 5, true));
    }
  }
  parts.push(boxPart(3.4, 0.14, 0.16, ix, 3.15, -42.9 + 1.5, 0));
  parts.push(boxPart(3.4, 0.14, 0.16, ix, 3.15, -42.9 - 1.5, 0));
  parts.push(boxPart(0.16, 0.14, 3.2, ix - 1.5, 3.15, -42.9, 0));
  parts.push(boxPart(0.16, 0.14, 3.2, ix + 1.5, 3.15, -42.9, 0));
  // feed trough from wheels to head box

// ---------------------------------------------------------------------------

function buildBoardwalk() {

  for (let z = bw.z0 + 0.7; z < bw.z1; z += 2.15) {

  // handrail on the pond side (west)
  for (let z = bw.z0 + 1.1; z < bw.z1; z += 2.4) {

  grey.push(tubePart(0.032, 0.032, x - w * 0.5 + 0.08, deck + 0.9, bw.z0 + 0.5, x - w * 0.5 + 0.08, deck + 0.9, bw.z1 - 0.5, 5, true));
  grey.push(tubePart(0.028, 0.028, x - w * 0.5 + 0.08, deck + 0.52, bw.z0 + 0.5, x - w * 0.5 + 0.08, deck + 0.52, bw.z1 - 0.5, 5, true));

    }
    for (const sgn of [-1, 1]) {
      grey.push(boxPart(0.09, 0.14, pd + 0.2, pcx + sgn * (pw * 0.5 - 0.1), deck - 0.09, pcz, 0));

    for (const px of [p.x0 + 0.5, p.x1 - 0.5]) {

function saltPileGeometry(radius, height, seed) {
  const r = mulberry32(seed);
  const pts = [];
  const rings = 14;
  for (let i = 0; i <= rings; i++) {
    const t = i / rings;
    const rr = radius * Math.pow(1 - t, 1.3) * (1 + (r() - 0.5) * 0.05);
    pts.push(new THREE.Vector2(Math.max(0.001, rr), height * t));
  }
  const geo = new THREE.LatheGeometry(pts, 32);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const a = Math.atan2(z, x);
    const n = 0.055 * Math.sin(a * 9 + y * 5.0) + 0.04 * Math.sin(a * 23 - y * 9.0);
    const f = 1 + n;
    pos.setXYZ(i, x * f, y + Math.sin(a * 6 + r() * 6) * 0.012, z * f);
  }
  geo.computeVertexNormals();
  return geo;
}

// ---------------------------------------------------------------------------
// crusted stakes and ropes along the pan edges
// ---------------------------------------------------------------------------
function buildStakes() {
  const rr = mulberry32(SEED ^ 0x1a5f3);
  const parts = [];
  const crustParts = [];
  const stakes = [];

  function addStake(x, z, h, tiltX, tiltZ) {
    const y0 = surfaceHeight(x, z);
    const geo = new THREE.CylinderGeometry(0.045, 0.055, h, 6, 3);
    const m = new THREE.Matrix4();
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(tiltX, rr() * 6.28, tiltZ, 'XYZ'));
    m.compose(new THREE.Vector3(x, y0 + h * 0.5 - 0.08, z), q, new THREE.Vector3(1, 1, 1));
    parts.push({ geo, matrix: m });
    stakes.push({ x, z, y: y0 + h });
    // crust collar at the base
    const crustGeo = new THREE.CylinderGeometry(0.085, 0.10, 0.22, 6, 1, true);
    const mc = new THREE.Matrix4().compose(
      new THREE.Vector3(x, y0 + 0.12, z), new THREE.Quaternion(), new THREE.Vector3(1, 1, 1)
    );
    crustParts.push({ geo: crustGeo, matrix: mc });
  }

  // along the hero pond perimeter and the main bunds
  const paths = [
    { x0: HERO.x0 + 0.8, x1: HERO.x1 - 0.8, z: HERO.z0 + 0.55, step: 2.6 },
    { x0: HERO.x0 + 0.8, x1: HERO.x1 - 0.8, z: HERO.z1 - 0.55, step: 3.1 },
    { z0: -34.0, z1: 10.0, x: 37.0, step: 3.4 },
    { z0: -30.0, z1: 8.0, x: -43.0, step: 3.8 },
  ];
  for (const p of paths) {
    if (p.x !== undefined) {
      for (let z = p.z0; z <= p.z1; z += p.step) {
        if (rr() < 0.28) continue;
        addStake(p.x + (rr() - 0.5) * 0.35, z, 1.0 + rr() * 0.65, (rr() - 0.5) * 0.10, (rr() - 0.5) * 0.12);
      }
    } else {
      for (let x = p.x0; x <= p.x1; x += p.step) {
        if (rr() < 0.34) continue;
        addStake(x, p.z + (rr() - 0.5) * 0.3, 1.0 + rr() * 0.6, (rr() - 0.5) * 0.12, (rr() - 0.5) * 0.10);
      }
    }
  }
  // a few marker stakes on the dry pan
  for (let i = 0; i < 14; i++) {
    addStake(randIn(CFG.dryPan.x0 + 1, CFG.dryPan.x1 - 1), randIn(CFG.dryPan.z0 + 1, CFG.dryPan.z1 - 1),
      1.1 + rr() * 0.5, (rr() - 0.5) * 0.14, (rr() - 0.5) * 0.14);
  }

  const mesh = new THREE.Mesh(mergeTimber(parts, 0.35), MATS.woodGrey);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  if (crustParts.length) {
    const crust = new THREE.Mesh(mergeTimber(crustParts, 0.4), MATS.crust);
    crust.castShadow = true; crust.receiveShadow = true;
    scene.add(crust);
  }

  // ropes sagging between selected stakes along the hero pond
  const ropeParts = [];
  for (let i = 0; i < stakes.length - 2; i += 3) {
    const a = stakes[i], b = stakes[i + 1];
    if (!a || !b) continue;
    if (Math.hypot(a.x - b.x, a.z - b.z) > 5.5) continue;
    for (let s = 0; s <= 6; s++) {
      const t = s / 6;
      const sag = Math.sin(t * Math.PI) * 0.16;
      const x = lerp(a.x, b.x, t);
      const z = lerp(a.z, b.z, t);
      const y = lerp(a.y - 0.3, b.y - 0.3, t) - sag;
      if (s < 6) {
        const t2 = (s + 1) / 6;
        const sag2 = Math.sin(t2 * Math.PI) * 0.16;
        ropeParts.push(tubePart(0.014, 0.014, x, y, z,
          lerp(a.x, b.x, t2), lerp(a.y - 0.3, b.y - 0.3, t2) - sag2, lerp(a.z, b.z, t2), 3, true));
      }
    }
  }
  if (ropeParts.length) {
    const rope = new THREE.Mesh(mergeGeometries(ropeParts.map((p) => {
      const g = p.geo.clone(); g.applyMatrix4(p.matrix); return g;
    }), false), MATS.rope);
    rope.castShadow = true;
    scene.add(rope);
  }
  return mesh;
}

// ---------------------------------------------------------------------------
// polygonal salt crystals along the exposed margins
// ---------------------------------------------------------------------------
function hopperCrystalGeometry(scale) {
  const s = scale;
  const r = mulberry32(SEED ^ 0x5aa1);
  const rings = [
    { y: 0.0, rr: 0.85, n: 5 },
    { y: 0.32, rr: 1.0, n: 5 },
    { y: 0.46, rr: 0.82, n: 5 },
    { y: 0.52, rr: 0.35, n: 5 },
  ];
  const pos = [];
  rings.forEach((ring, ri) => {
    const off = ri % 2 === 0 ? 0.1 : 0.0;
    for (let i = 0; i < ring.n; i++) {
      const a = (i / ring.n) * Math.PI * 2 + off;
      const rr = ring.rr * (0.86 + r() * 0.22);
      pos.push(new THREE.Vector3(Math.cos(a) * rr * s, ring.y * s, Math.sin(a) * rr * s));
    }
  });
  const idx = [];
  const n = 5;
  for (let ri = 0; ri < rings.length - 1; ri++) {
    for (let i = 0; i < n; i++) {
      const a = ri * n + i, b = ri * n + (i + 1) % n;
      const c = (ri + 1) * n + i, d = (ri + 1) * n + (i + 1) % n;
      idx.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pos);
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

function buildCrystals() {
  const rr = mulberry32(SEED ^ 0x2f7d);
  const placements = [];
  // margins of the hero pond: the exposed salt crust band
  const band = 1.05;
  for (let i = 0; i < 300; i++) {
    const side = Math.floor(rr() * 4);
    const t = rr();
    let x, z;
    const c = HERO;
    if (side === 0) { x = lerp(c.x0, c.x1, t); z = c.z0 + band * (0.5 + rr() * 0.5); }
    else if (side === 1) { x = lerp(c.x0, c.x1, t); z = c.z1 - band * (0.5 + rr() * 0.5); }
    else if (side === 2) { x = c.x0 + band * (0.5 + rr() * 0.5); z = lerp(c.z0, c.z1, t); }
    else { x = c.x1 - band * (0.5 + rr() * 0.5); z = lerp(c.z0, c.z1, t); }
    const y = surfaceHeight(x, z);
    if (y < c.waterY + 0.02 || y > c.waterY + 0.42) continue;
    placements.push({ x, y, z, s: 0.032 + rr() * 0.075, ry: rr() * 6.28, tilt: (rr() - 0.5) * 0.25 });
  }
  // the dry pan: bigger hoppers and plates
  for (let i = 0; i < 210; i++) {
    const x = randIn(CFG.dryPan.x0 + 1.5, CFG.dryPan.x1 - 1.5);
    const z = randIn(CFG.dryPan.z0 + 1.0, CFG.dryPan.z1 - 1.0);
    // avoid the piles
    let ok = true;
    for (const p of LAYOUT.piles) if (Math.hypot(x - p.x, z - p.z) < p.r * 1.4) { ok = false; break; }
    if (!ok) continue;
    placements.push({ x, y: surfaceHeight(x, z), z, s: 0.030 + rr() * 0.085, ry: rr() * 6.28, tilt: (rr() - 0.5) * 0.35 });
  }
  // a conspicuous crystal crust along the near margin of the foreground pond
  {
    const c = HERO;
    for (let i = 0; i < 160; i++) {
      const x = randIn(c.x0 + 1.0, c.x1 - 0.8);
      const z = c.z1 - randIn(0.55, 1.35);
      const y = surfaceHeight(x, z);
      if (y < c.waterY + 0.015 || y > c.waterY + 0.34) continue;
      placements.push({
        x, y, z,
        s: 0.07 + rr() * 0.16,
        ry: rr() * 6.28,
        tilt: (rr() - 0.5) * 0.3,
      });
    }
    // and around the damp spill at the sluice outlet
    const hx = HERO.heroSluice ? HERO.heroSluice.x : 0;
    const hz = HERO.heroSluice ? HERO.heroSluice.z : 0;
    for (let i = 0; i < 90; i++) {
      const a = rr() * Math.PI * 2, rad = 1.4 + rr() * 4.6;
      const x = hx + Math.cos(a) * rad, z = hz + Math.sin(a) * rad * 0.7;
      const y = surfaceHeight(x, z);
      if (y < HERO.waterY - 0.1 || y > HERO.waterY + 0.3) continue;
      placements.push({ x, y, z, s: 0.05 + rr() * 0.11, ry: rr() * 6.28, tilt: (rr() - 0.5) * 0.25 });
    }
  }

  // sparse crystals on other warm margins
  for (let i = 0; i < 170; i++) {
    const c = CELLS[Math.floor(rr() * CELLS.length)];
    const side = Math.floor(rr() * 4);
    const t = rr();
    let x, z;
    if (side < 2) { x = lerp(c.x0, c.x1, t); z = side === 0 ? c.z0 + 1.1 * rr() : c.z1 - 1.1 * rr(); }
    else { z = lerp(c.z0, c.z1, t); x = side === 2 ? c.x0 + 1.1 * rr() : c.x1 - 1.1 * rr(); }
    const y = surfaceHeight(x, z);
    if (y < c.waterY + 0.015 || y > c.waterY + 0.3) continue;
    placements.push({ x, y, z, s: 0.028 + rr() * 0.055, ry: rr() * 6.28, tilt: (rr() - 0.5) * 0.2 });
  }

  const geo = hopperCrystalGeometry(1.0);
  const inst = new THREE.InstancedMesh(geo, MATS.crystal, placements.length);
  const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), e4 = new THREE.Euler();
  const qTilt = new THREE.Quaternion();
  const col = new THREE.Color();
  placements.forEach((p, i) => {
    e4.set(p.tilt, p.ry, p.tilt * 0.6);
    q4.setFromEuler(e4);
    m4.compose(new THREE.Vector3(p.x, p.y + p.s * 0.18, p.z), q4, new THREE.Vector3(p.s, p.s * (0.8 + (i % 5) * 0.09), p.s));
    inst.setMatrixAt(i, m4);
    const tone = 0.68 + (i % 7) * 0.022;
    col.setRGB(tone, tone * 0.97, tone * 0.90);
    inst.setColorAt(i, col);
  });
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
  inst.castShadow = true; inst.receiveShadow = true;
  inst.frustumCulled = true;
  inst.computeBoundingSphere();
  scene.add(inst);
  return inst;
}

// drainage rivulets on the salt pan
// ---------------------------------------------------------------------------
function buildRivulets() {
  const group = new THREE.Group();
  const rr = mulberry32(SEED ^ 0x3c31);
  for (const rv of LAYOUT.rivulets) {
    const pts = rv.pts.map((p) => new THREE.Vector3(p.x, surfaceHeight(p.x, p.z) + 0.035, p.z));
    const geo = makeRibbon(pts, (t) => rv.width * (0.7 + 0.6 * t), 1, 0, 0);
    const mat = makeFlowMaterial('#5d6f66', '#dde6df', 1.1, 0.55, 41 + rr() * 10);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    mesh.renderOrder = 4;
    group.add(mesh);
  }
  scene.add(group);
  return group;
}

// ---------------------------------------------------------------------------
// gulls and a small weathered pennant
// ---------------------------------------------------------------------------
const LIFE = { birds: [], flag: null, flagBase: null };

function buildLife() {
  // gulls: two triangles per bird, animated in a vertex shader
  const birdCount = 9;
  const pos = [], wing = [], phase = [], scale = [];
  const rr = mulberry32(SEED ^ 0x0b1d);
  for (let i = 0; i < birdCount; i++) {
    const base = new THREE.Vector3(randIn(-120, 90), randIn(26, 46), randIn(-130, -30));
    const s = 0.7 + rr() * 0.6;
    const ph = rr() * 6.28;
    for (let sgn = -1; sgn <= 1; sgn += 2) {
      // triangle: body centre, wing tip, back
      pos.push(base.x, base.y, base.z);
      wing.push(0, i, sgn);
      phase.push(ph);
      scale.push(s);
      pos.push(base.x + sgn * 1.1 * s, base.y + 0.05 * s, base.z - 0.32 * s);
      wing.push(1, i, sgn);
      phase.push(ph);
      scale.push(s);
      pos.push(base.x, base.y, base.z - 0.5 * s);
      wing.push(0, i, sgn);
      phase.push(ph);
      scale.push(s);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('aWing', new THREE.Float32BufferAttribute(wing, 3));
  geo.setAttribute('aPhase', new THREE.Float32BufferAttribute(phase, 1));
  geo.setAttribute('aScale', new THREE.Float32BufferAttribute(scale, 1));
  const birdMat = new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U, {}),
    vertexShader: /* glsl */`
      uniform float uTime;
      attribute vec3 aWing;
      attribute float aPhase;
      attribute float aScale;
      varying float vShade;
      void main() {
        vec3 p = position;
        float flap = sin(uTime * 5.2 + aPhase) * 0.9;
        if (aWing.x > 0.5) {
          p.y += flap * 0.55 * aScale;
          p.z += sin(uTime * 5.2 + aPhase) * 0.18 * aScale;
        }
        vec4 wp = modelMatrix * vec4(p, 1.0);
        vShade = 0.55 + 0.45 * abs(flap);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      varying float vShade;
      void main() {
        vec3 col = vec3(0.62, 0.64, 0.63) * vShade;
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
    side: THREE.DoubleSide,
    fog: false,
  });
  const birds = new THREE.Mesh(geo, birdMat);
  birds.frustumCulled = false;
  scene.add(birds);
  LIFE.birds = birds;

  // pennant on the viewing deck
  const fx = 8.2, fz = 11.2;
  const fy = LAYOUT.boardwalk.deckY;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 3.2, 6), MATS.woodGrey);
  pole.position.set(fx, fy + 1.6, fz);
  pole.castShadow = true;
  scene.add(pole);
  const fgeo = new THREE.PlaneGeometry(1.25, 0.55, 10, 3);
  fgeo.translate(0.625, 0, 0);
  const flag = new THREE.Mesh(fgeo, MATS.cloth);
  flag.position.set(fx, fy + 2.75, fz);
  flag.rotation.y = -0.5;
  flag.castShadow = true;
  scene.add(flag);
  LIFE.flag = flag;
  LIFE.flagBase = fgeo.attributes.position.array.slice();
  return birds;
}

// animate birds drifting, pennant flapping
function updateLife(dt) {
  if (LIFE.birds) {
    LIFE.birds.position.x = Math.sin(state.wall * 0.012) * 9;
    LIFE.birds.position.z = Math.cos(state.wall * 0.009) * 6;
  }
  if (LIFE.flag) {
    const p = LIFE.flag.geometry.attributes.position;
    const base = LIFE.flagBase;
    const t = state.wall;
    for (let i = 0; i < p.count; i++) {
      const x = base[i * 3], y = base[i * 3 + 1];
      const k = x / 1.25;
      p.setZ(i, Math.sin(x * 4.0 + t * 3.2) * 0.10 * k + Math.cos(y * 5.0 + t * 2.4) * 0.04 * k);
      p.setY(i, y + Math.sin(x * 3.0 + t * 2.8) * 0.035 * k);
    }
    p.needsUpdate = true;
    LIFE.flag.geometry.computeVertexNormals();
  }
}


/* ===================== 60_sim.js ===================== */
/* SALT MIRROR — fixed-step sluice/ripple simulation + per-frame visual updates. */

const SIM = {
  accum: 0,
  step: 1 / 60,
  ripple: 0,
  time: 0,
  log: [],
};

// ripple ring-buffer (matches the GLSL uniform array size)
const RIPPLE_SLOTS = 8;
let rippleWrite = 0;

function emitRipple(x, z, strength) {
  const slot = U.uRipples.value[rippleWrite % RIPPLE_SLOTS];
  slot.set(x, z, state.t, strength);
  rippleWrite++;
  state.rippleCount = rippleWrite;
}

function gateOpenAt(gate, t) {
  const s = gate.schedule;
  const rise = 1.15, hold = 2.7, fall = 0.95;
  const period = s.period;
  const tt = ((t - s.offset) % period + period) % period;
  if (tt < rise) return smoothstep(0, 1, tt / rise) * 0.98;
  if (tt < rise + hold) return 1.0;
  if (tt < rise + hold + fall) return 1.0 - smoothstep(0, 1, (tt - rise - hold) / fall);
  return 0.0;
}

function initSim() {
  U.uRippleCount.value = RIPPLE_SLOTS;
  for (let i = 0; i < RIPPLE_SLOTS; i++) U.uRipples.value[i].set(0, 0, -1000, 0);
  for (const g of SLUICE.gates) {
    g.open = gateOpenAt(g, 0);
    g.prevOpen = g.open;
    g.lastPulse = -100;
  }
  // initial ripples so the mirror is never completely dead at the opening frame
  if (HERO.heroGate) emitRipple(HERO.heroGate.impact.x, HERO.heroGate.impact.z, 0.55);
  emitRipple(12.0, -6.0, 0.35);
  simSync(0);
}

function simStepFixed(dt) {
  SIM.time += dt;
  const t = state.t;
  for (const g of SLUICE.gates) {
    const open = gateOpenAt(g, t);
    // rising edge: start a ring and a gate creak
    if (g.prevOpen < 0.02 && open >= 0.02) {
      emitRipple(g.impact.x, g.impact.z, g.kind === 'weir' ? 0.30 : 0.62);
      g.lastPulse = t;
      if (typeof audioGate === 'function') audioGate(g.kind === 'weir' ? 0.45 : 1.0);
    }
    // while open, pulses keep the rings coming from the inflow
    if (open > 0.4 && t - g.lastPulse > 1.15) {
      emitRipple(g.impact.x, g.impact.z, (g.kind === 'weir' ? 0.18 : 0.38) * open);
      g.lastPulse = t;
    }
    if (g.prevOpen >= 0.02 && open < 0.02 && typeof audioGate === 'function') audioGate(0.2);
    g.prevOpen = open;
    g.open = open;
  }
}

function stepSim(dt) {
  SIM.accum += dt;
  let steps = 0;
  while (SIM.accum >= SIM.step && steps < 5) {
    simStepFixed(SIM.step);
    SIM.accum -= SIM.step;
    steps++;
  }
  if (steps === 5) SIM.accum = 0;
}

// debug: jump simulation state to an arbitrary time
function simSync(t) {
  for (const g of SLUICE.gates) {
    g.open = gateOpenAt(g, t);
    g.prevOpen = g.open;
    g.lastPulse = t;
  }
}

// ---------------------------------------------------------------------------
// per-frame visual updates for gates, streams, wheels, splash, life
// ---------------------------------------------------------------------------
function updateSceneAnim(dt) {
  const t = state.t;
  for (const g of SLUICE.gates) {
    if (g.board) {
      g.board.position.y = g.closedY + g.open * g.openLift;
    }
    if (g.streamMesh) {
      const vis = g.open > 0.025;
      g.streamMesh.visible = vis;
      if (vis) {
        g.streamMesh.material.uniforms.uOpacity.value = (g.kind === 'weir' ? 0.62 : 0.9) * clamp(g.open * 1.4, 0, 1);
        g.streamMesh.material.uniforms.uTime.value = t;
      }
    }
    if (g.splash) {
      const vis = g.open > 0.18;
      g.splash.visible = vis;
      if (vis) {
        const pulse = 0.72 + 0.28 * Math.sin(t * 9.0 + g.impact.x);
        const sc = (0.7 + 0.45 * g.open) * pulse;
        g.splash.scale.set(sc, sc, sc);
        g.splash.material.opacity = 0.32 * g.open * pulse;
      }
    }
  }
  // wheels turn with the lift
  for (const w of SLUICE.wheels) w.rotation.x -= dt * 0.62;
  if (SLUICE.intakeWater) SLUICE.intakeWater.material.uniforms.uTime.value = t;
  if (SLUICE.flumeWater) SLUICE.flumeWater.material.uniforms.uTime.value = t;

  updateLife(dt);
}

// debug helper: force the hero gap over the foreground pond now
function forceHero(on) {
  state.heroOverride = !!on;
  if (on) {
    U.uGapCenter.value.set(HERO.cx, HERO.cz);
    state.hero = 1;
    U.uHero.value = 1;
  }
}


/* ===================== 70_audio.js ===================== */
/* SALT MIRROR — procedural coastal soundscape (WebAudio, opt-in). */

const AUDIO = {
  ctx: null,
  master: null,
  muted: true,
  ready: false,
  windGain: null,
  trickleGain: null,
  dripClock: 0,
  gateCooldown: 0,
};

function audioNoiseBuffer(ctx, seconds) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    last = last * 0.86 + w * 0.14;
    d[i] = last;
  }
  // fade ends so the loop seam is inaudible
  const fade = Math.floor(ctx.sampleRate * 0.12);
  for (let i = 0; i < fade; i++) {
    const t = i / fade;
    d[i] *= t;
    d[len - 1 - i] *= t;
  }
  return buf;
}

function audioInit() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  const ctx = new Ctx();
  AUDIO.ctx = ctx;

  const master = ctx.createGain();
  master.gain.value = 0.0;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -20;
  comp.knee.value = 18;
  comp.ratio.value = 3.5;
  comp.attack.value = 0.006;
  comp.release.value = 0.28;
  master.connect(comp);
  comp.connect(ctx.destination);
  AUDIO.master = master;

  const noise = audioNoiseBuffer(ctx, 3.2);

  // ---- coastal wind: two filtered noise beds with slow movement
  const windSrc = ctx.createBufferSource();
  windSrc.buffer = noise;
  windSrc.loop = true;
  const windLp = ctx.createBiquadFilter();
  windLp.type = 'lowpass';
  windLp.frequency.value = 360;
  windLp.Q.value = 0.6;
  const windGain = ctx.createGain();
  windGain.gain.value = 0.11;
  windSrc.connect(windLp);
  windLp.connect(windGain);
  windGain.connect(master);

  const wind2 = ctx.createBufferSource();
  wind2.buffer = noise;
  wind2.loop = true;
  wind2.playbackRate.value = 1.37;
  const windBp = ctx.createBiquadFilter();
  windBp.type = 'bandpass';
  windBp.frequency.value = 880;
  windBp.Q.value = 0.9;
  const wind2Gain = ctx.createGain();
  wind2Gain.gain.value = 0.028;
  wind2.connect(windBp);
  windBp.connect(wind2Gain);
  wind2Gain.connect(master);

  // slow gust movement
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 0.045;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 0.045;
  lfo.connect(lfoGain);
  lfoGain.connect(windGain.gain);
  lfo.start();
  windGain.connect(master);

  // ---- brine trickle: noisy seep through a narrow resonance
  const trSrc = ctx.createBufferSource();
  trSrc.buffer = noise;
  trSrc.loop = true;
  trSrc.playbackRate.value = 0.83;
  const trBp = ctx.createBiquadFilter();
  trBp.type = 'bandpass';
  trBp.frequency.value = 1750;
  trBp.Q.value = 1.6;
  const trickleGain = ctx.createGain();
  trickleGain.gain.value = 0.0;
  trSrc.connect(trBp);
  trBp.connect(trickleGain);
  trickleGain.connect(master);

  const trLfo = ctx.createOscillator();
  trLfo.type = 'triangle';
  trLfo.frequency.value = 0.13;
  const trLfoGain = ctx.createGain();
  trLfoGain.gain.value = 0.012;
  trLfo.connect(trLfoGain);
  trLfoGain.connect(trickleGain.gain);
  trLfo.start();

  windSrc.start();
  wind2.start();
  trSrc.start();

  AUDIO.windGain = windGain;
  AUDIO.trickleGain = trickleGain;
  AUDIO.noise = noise;
  AUDIO.ready = true;
}

async function audioEnable() {
  if (!AUDIO.ctx) audioInit();
  if (!AUDIO.ctx) return;
  await AUDIO.ctx.resume();
  AUDIO.muted = false;
  AUDIO.master.gain.setTargetAtTime(0.32, AUDIO.ctx.currentTime, 0.4);
}

function audioMute(m) {
  if (!AUDIO.ctx) return;
  AUDIO.muted = !!m;
  AUDIO.master.gain.setTargetAtTime(m ? 0.0 : 0.32, AUDIO.ctx.currentTime, 0.25);
}

function audioTick(evt) {
  // tiny interface ticks: pause/resume/reset are intentionally silent
}

// wooden gate groan when the penstock lifts
function audioGate(strength) {
  if (!AUDIO.ctx || AUDIO.muted) return;
  const ctx = AUDIO.ctx;
  const now = ctx.currentTime;
  if (AUDIO.gateCooldown > now) return;
  AUDIO.gateCooldown = now + 1.6;
  const g = ctx.createGain();
  g.gain.value = 0;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 240;
  bp.Q.value = 7.0;
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  const base = 58 + Math.random() * 22;
  osc.frequency.setValueAtTime(base * 1.7, now);
  osc.frequency.exponentialRampToValueAtTime(base, now + 0.9);
  const osc2 = ctx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(base * 2.6, now);
  osc2.frequency.exponentialRampToValueAtTime(base * 1.5, now + 0.8);
  const g2 = ctx.createGain();
  g2.gain.value = 0.35;
  osc.connect(bp);
  osc2.connect(g2);
  g2.connect(bp);
  bp.connect(g);
  g.connect(AUDIO.master);
  const level = 0.12 * clamp(strength, 0, 1);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(level, now + 0.08);
  g.gain.linearRampToValueAtTime(level * 0.7, now + 0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.15);
  osc.start(now); osc.stop(now + 1.2);
  osc2.start(now); osc2.stop(now + 1.2);
  // wood knock
  const knock = ctx.createOscillator();
  knock.type = 'sine';
  knock.frequency.value = 92;
  const kg = ctx.createGain();
  kg.gain.setValueAtTime(0.10 * clamp(strength, 0, 1), now + 0.02);
  kg.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
  knock.connect(kg);
  kg.connect(AUDIO.master);
  knock.start(now + 0.02); knock.stop(now + 0.25);
}

// a droplet ping for the trickles
function audioDrip() {
  if (!AUDIO.ctx || AUDIO.muted) return;
  const ctx = AUDIO.ctx;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  const f = 700 + Math.random() * 1400;
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * 0.55, now + 0.09);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0, now);
  g.gain.linearRampToValueAtTime(0.012 + Math.random() * 0.018, now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
  osc.connect(g);
  g.connect(AUDIO.master);
  osc.start(now); osc.stop(now + 0.18);
}

let audioUpdateClock = 0;
function updateAudio(dt) {
  if (!AUDIO.ready || AUDIO.muted) return;
  const ctx = AUDIO.ctx;
  // trickle level tracks how many sluices are open
  let openSum = 0;
  if (typeof SLUICE !== 'undefined' && SLUICE.gates) {
    for (const g of SLUICE.gates) openSum += g.open;
  }
  const target = 0.005 + Math.min(0.05, openSum * 0.007);
  AUDIO.trickleGain.gain.setTargetAtTime(target, ctx.currentTime, 0.5);
  // wind sighs with the gap
  const gust = 0.085 + 0.035 * Math.sin(state.wall * 0.21) + 0.025 * state.hero;
  AUDIO.windGain.gain.setTargetAtTime(gust, ctx.currentTime, 0.8);
  audioUpdateClock += dt;
  const interval = openSum > 0.6 ? 0.28 : 0.75;
  if (audioUpdateClock > interval) {
    audioUpdateClock = 0;
    if (Math.random() < 0.7) audioDrip();
  }
}

debugAPI.audioState = () => ({
  ready: AUDIO.ready,
  context: AUDIO.ctx ? AUDIO.ctx.state : 'none',
  muted: AUDIO.muted,
  master: AUDIO.master ? +AUDIO.master.gain.value.toFixed(3) : 0,
});


/* ===================== 80_camera_ui.js ===================== */
/* SALT MIRROR — camera rig (cinematic glide + damped orbit/zoom) and interface. */

const OPEN_POS = new THREE.Vector3(...CFG.camera.pos);
const OPEN_TARGET = new THREE.Vector3(...CFG.camera.target);
const GLIDE = new THREE.Vector3(-0.4786, 0, 0.8780).normalize();
const CINE_PERIOD = 84.0;

function cinematicPose(wall, cineStart, outPos, outTgt) {
  const phase = ((wall - cineStart) / CINE_PERIOD) * Math.PI * 2;
  const g = Math.sin(phase);
  const g2 = Math.sin(phase * 0.71 + 0.6);
  outPos.copy(OPEN_POS)
    .addScaledVector(GLIDE, 8.0 * g)
    .add(new THREE.Vector3(0.6 * g2, 0.75 * Math.sin(phase + 1.05), 0));
  outTgt.copy(OPEN_TARGET)
    .addScaledVector(GLIDE, 6.4 * g)
    .add(new THREE.Vector3(0.35 * g2, 0.22 * Math.sin(phase * 0.9), 0));
}

function makeCameraRig() {
  const baseOffset = OPEN_POS.clone().sub(OPEN_TARGET);
  const baseR = baseOffset.length();
  const baseEl = Math.asin(baseOffset.y / baseR);
  const baseAz = Math.atan2(baseOffset.x, baseOffset.z);

  const rig = {
    mode: 'cinematic',
    focus: new THREE.Vector3().copy(OPEN_TARGET),
    smoothTarget: new THREE.Vector3().copy(OPEN_TARGET),
    smoothPos: new THREE.Vector3().copy(OPEN_POS),
    az: baseAz, el: baseEl, r: baseR,
    tAz: baseAz, tEl: baseEl, tR: baseR,
    cineStart: 0,
    boost: 0,
    dragging: false,
    pointers: new Map(),
    pinchPrev: 0,

    setMode(mode) {
      if (mode === this.mode) return;
      if (mode === 'manual') {
        this.focus.copy(this.smoothTarget);
        const off = this.smoothPos.clone().sub(this.focus);
        const rr = Math.max(38, off.length());
        this.az = this.tAz = Math.atan2(off.x, off.z);
        this.el = this.tEl = Math.asin(clamp(off.y / rr, -1, 1));
        this.r = this.tR = rr;
      } else {
        this.cineStart = state.wall;
        this.boost = 1;
      }
      this.mode = mode;
      syncCameraButtons();
    },

    reset() {
      this.mode = 'cinematic';
      this.cineStart = state.wall;
      this.boost = 1;
      syncCameraButtons();
      if (typeof audioTick === 'function') audioTick('reset');
    },

    jumpTo(px, py, pz, tx, ty, tz) {
      this.mode = 'manual';
      this.cineStart = state.wall;
      this.focus.set(tx, ty, tz);
      this.smoothTarget.copy(this.focus);
      const off = new THREE.Vector3(px - tx, py - ty, pz - tz);
      this.r = this.tR = Math.max(8, off.length());
      this.az = this.tAz = Math.atan2(off.x, off.z);
      this.el = this.tEl = Math.asin(clamp(off.y / this.r, -1, 1));
      this.smoothPos.set(px, py, pz);
      camera.position.copy(this.smoothPos);
      camera.lookAt(this.smoothTarget);
      syncCameraButtons();
    },

    takeover() {
      if (this.mode !== 'manual') this.setMode('manual');
    },

    update(dt) {
      const wall = state.wall;
      const desiredPos = tmpV;
      const desiredTgt = tmpV2;
      const smoothingK = this.boost > 0 ? 2.4 : 1.25;
      this.boost = Math.max(0, this.boost - dt * 0.55);

      if (this.mode === 'cinematic') {
        cinematicPose(wall, this.cineStart, desiredPos, desiredTgt);
        const k = 1 - Math.exp(-dt * smoothingK);
        this.smoothPos.lerp(desiredPos, k);
        this.smoothTarget.lerp(desiredTgt, 1 - Math.exp(-dt * smoothingK * 1.15));
      } else {
        // damped manual orbit
        const k = 1 - Math.exp(-dt * 7.5);
        this.az += (this.tAz - this.az) * k;
        this.el += (this.tEl - this.el) * k;
        this.r += (this.tR - this.r) * k;
        if (this.idleOrbit) {
          // a whisper of drift so the still frame never feels frozen
          this.tAz += dt * 0.0035;
        }
        const ce = Math.cos(this.el), se = Math.sin(this.el);
        desiredPos.set(
          this.focus.x + this.r * ce * Math.sin(this.az),
          this.focus.y + this.r * se,
          this.focus.z + this.r * ce * Math.cos(this.az)
        );
        // never sink into the ground
        const ground = surfaceHeight(desiredPos.x, desiredPos.z);
        if (desiredPos.y < ground + 4.0) desiredPos.y = ground + 4.0;
        this.smoothPos.lerp(desiredPos, 1 - Math.exp(-dt * 13.0));
        this.smoothTarget.lerp(this.focus, 1 - Math.exp(-dt * 11.0));
      }

      camera.position.copy(this.smoothPos);
      camera.lookAt(this.smoothTarget);
    },

    // ---- input ----
    onDown(e) {
      try { canvasEl.setPointerCapture?.(e.pointerId); } catch (err) { /* synthetic pointer */ }
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      this.takeover();
      this.dragging = true;
      this.idleOrbit = false;
      canvasEl.classList.add('dragging');
      if (this.pointers.size === 2) {
        const pts = [...this.pointers.values()];
        this.pinchPrev = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      }
      pokeUI();
    },
    onMove(e) {
      const p = this.pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (this.pointers.size >= 2) {
        const pts = [...this.pointers.values()];
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (this.pinchPrev > 0) {
          this.tR = clamp(this.tR * (this.pinchPrev / Math.max(1, d)), 40, 138);
        }
        this.pinchPrev = d;
      } else {
        const sens = 0.0029;
        this.tAz -= dx * sens;
        this.tEl = clamp(this.tEl + dy * sens * 0.9, 0.14, 1.08);
      }
      pokeUI();
    },
    onUp(e) {
      this.pointers.delete(e.pointerId);
      if (this.pointers.size === 0) {
        this.dragging = false;
        canvasEl.classList.remove('dragging');
        this.idleOrbit = true;
      }
      this.pinchPrev = 0;
    },
    onWheel(e) {
      e.preventDefault();
      this.takeover();
      const k = Math.exp(clamp(e.deltaY, -180, 180) * 0.0012);
      this.tR = clamp(this.tR * k, 40, 138);
      pokeUI();
    },
  };
  return rig;
}

// ---------------------------------------------------------------------------
// interface: buttons, fade, hints, grain
// ---------------------------------------------------------------------------
let uiFadeAt = 0;
let uiHidden = false;
let overlayPoked = 0;
const cineBtn = document.getElementById('btn-cinematic');
const resetBtn = document.getElementById('btn-reset');
const pauseBtn = document.getElementById('btn-pause');
const soundBtn = document.getElementById('btn-sound');
const uiRoot = document.getElementById('ui');
const hintEl = document.getElementById('hint');

function syncCameraButtons() {
  if (!camRig) return;
  cineBtn.setAttribute('aria-pressed', camRig.mode === 'cinematic' ? 'true' : 'false');
}

function pokeUI() {
  overlayPoked = state.wall;
  if (uiHidden) {
    uiHidden = false;
    uiRoot.classList.remove('faded');
  }
}

function updateUI() {
  // fade the overlay after a long pause in interaction; restore on movement/focus
  const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('#buttons');
  const overControls = false;
  if (!uiHidden && state.wall - overlayPoked > 7.0 && !focused && !camRig.dragging && !overControls) {
    uiHidden = true;
    uiRoot.classList.add('faded');
  }
}

function initGrain() {
  const gcv = document.getElementById('grain');
  if (!gcv) return;
  const tile = document.createElement('canvas');
  tile.width = 160; tile.height = 160;
  const tctx = tile.getContext('2d');
  const id = tctx.createImageData(160, 160);
  const r2 = mulberry32(SEED ^ 0x77aa11);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 118 + Math.floor(r2() * 62);
    id.data[i] = v; id.data[i + 1] = v; id.data[i + 2] = v;
    id.data[i + 3] = 255;
  }
  tctx.putImageData(id, 0, 0);
  const pattern = tctx.createPattern(tile, 'repeat');
  sizeGrain = function () {
    gcv.width = Math.max(2, window.innerWidth);
    gcv.height = Math.max(2, window.innerHeight);
    const c = gcv.getContext('2d');
    c.fillStyle = pattern;
    c.fillRect(0, 0, gcv.width, gcv.height);
  };
  sizeGrain();
}

function initUI() {
  camRig = makeCameraRig();
  debugAPI.camRig = camRig;
  camera.position.copy(camRig.smoothPos);
  camera.lookAt(camRig.smoothTarget);
  syncCameraButtons();
  overlayPoked = 0;

  cineBtn.addEventListener('click', () => {
    pokeUI();
    if (camRig.mode === 'cinematic') {
      camRig.setMode('manual');
      camRig.tA = camRig.tAz;
    } else {
      camRig.setMode('cinematic');
    }
  });
  resetBtn.addEventListener('click', () => { pokeUI(); camRig.reset(); });
  pauseBtn.addEventListener('click', () => {
    pokeUI();
    state.paused = !state.paused;
    pauseBtn.setAttribute('aria-pressed', state.paused ? 'true' : 'false');
    pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
    if (typeof audioTick === 'function') audioTick(state.paused ? 'pause' : 'resume');
  });

  let audioOn = false;
  soundBtn.addEventListener('click', async () => {
    pokeUI();
    if (!audioOn) {
      try {
        await audioEnable();
        audioOn = true;
        soundBtn.setAttribute('aria-pressed', 'true');
        soundBtn.textContent = 'Sound on';
      } catch (err) {
        console.warn('audio unavailable', err);
      }
    } else {
      audioOn = false;
      audioMute(true);
      soundBtn.setAttribute('aria-pressed', 'false');
      soundBtn.textContent = 'Sound';
    }
  });

  // pointer / wheel / touch
  window.addEventListener('pointermove', (e) => {
    pokeUI();
    camRig.onMove(e);
  }, { passive: true });
  canvasEl.addEventListener('pointerdown', (e) => camRig.onDown(e));
  window.addEventListener('pointerup', (e) => camRig.onUp(e));
  window.addEventListener('pointercancel', (e) => camRig.onUp(e));
  canvasEl.addEventListener('wheel', (e) => camRig.onWheel(e), { passive: false });
  canvasEl.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    pokeUI();
    if (e.target && /input|textarea/i.test(e.target.tagName || '')) return;
    const k = e.key.toLowerCase();
    if (k === 'c') { camRig.mode === 'cinematic' ? camRig.setMode('manual') : camRig.setMode('cinematic'); }
    else if (k === 'r') camRig.reset();
    else if (k === 'p') pauseBtn.click();
    else if (k === 'm') soundBtn.click();
  });

  document.addEventListener('focusin', (e) => {
    if (e.target && e.target.closest && e.target.closest('#buttons')) pokeUI();
  });
  document.addEventListener('pointerdown', () => pokeUI(), { passive: true });

  initGrain();
  pokeUI();
}


/* ===================== 99_main.js ===================== */
/* SALT MIRROR — simulation clock, sky motion, boot sequence, render loop. */

// ---------------------------------------------------------------------------
// weather choreography: cloud drift + the hero gap path
// ---------------------------------------------------------------------------
const GAP_BASE = new THREE.Vector2(-124.6, 93.4);
const GAP_CYCLE = 34.0;
const GAP_PATH = WIND_SPEED * GAP_CYCLE;
const GAP_PHASE0 = 132.0;

function gapCenterAt(t, out) {
  const d = ((GAP_PHASE0 + WIND_SPEED * t) % GAP_PATH + GAP_PATH) % GAP_PATH;
  return out.set(GAP_BASE.x + WIND_DIR.x * d, GAP_BASE.y + WIND_DIR.y * d);
}

const _gapTmp = new THREE.Vector2();
function gapIntensityAt(x, z) {
  gapCenterAt(state.t, _gapTmp);
  const dx = x - _gapTmp.x, dz = z - _gapTmp.y;
  const along = dx * WIND_DIR.x + dz * WIND_DIR.y;
  const across = dx * -WIND_DIR.y + dz * WIND_DIR.x;
  const len = U.uGapHalfLen.value, wid = U.uGapHalfWid.value;
  const rr = Math.sqrt((along / len) * (along / len) + (across / wid) * (across / wid));
  return 1 - smoothstep(0.25, 1.02, rr);
}

function updateWeather(t) {
  U.uTime.value = t;
  const drift = WIND_SPEED * t;
  U.uCloudOffset.value.set(WIND_DIR.x * drift, WIND_DIR.y * drift);
  if (state.heroOverride) {
    U.uGapCenter.value.set(HERO.cx - 1.0, HERO.cz + 1.5);
    U.uGapHalfLen.value = 46;
    U.uGapHalfWid.value = 32;
  } else {
    gapCenterAt(t, U.uGapCenter.value);
    U.uGapHalfLen.value = 24;
    U.uGapHalfWid.value = 16;
  }
  U.uGapDir.value.copy(WIND_DIR);
  U.uGapOpen.value = 1.0;
  // how strongly the gap is over the foreground mirror and its salt flats
  const heroGap = gapIntensityAt(HERO.cx, HERO.cz);
  const crystalGap = gapIntensityAt(-14, 29);
  state.hero = state.heroOverride ? 1 : clamp(Math.max(heroGap, crystalGap * 0.75), 0, 1);
  U.uHero.value = state.hero;
}

function syncTimeDeps(t) {
  updateWeather(t);
  if (typeof simSync === 'function') simSync(t);
}

// ---------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------
let terrainMesh = null;
let seaMesh = null;
let built = {};

function boot() {
  const t0 = performance.now();
  buildTextures();
  initMaterials();
  terrainMesh = buildTerrain();
  seaMesh = buildSea();
  bakeEnvironment();
  if (typeof buildWater === 'function') built.water = buildWater();
  if (typeof buildSluice === 'function') built.sluice = buildSluice();
  if (typeof buildBoardwalk === 'function') built.boardwalk = buildBoardwalk();
  if (typeof buildIntake === 'function') built.intake = buildIntake();
  if (typeof buildSaltPiles === 'function') built.piles = buildSaltPiles();
  if (typeof buildStakes === 'function') built.stakes = buildStakes();
  if (typeof buildCrystals === 'function') built.crystals = buildCrystals();
  if (typeof buildRakeMarks === 'function') built.rakes = buildRakeMarks();
  if (typeof buildRivulets === 'function') built.rivulets = buildRivulets();
  if (typeof buildLife === 'function') built.life = buildLife();
  if (typeof initSim === 'function') initSim();
  initUI();
  applySize();
  updateWeather(0);
  camRig.update(0.016);
  U.uCamPos.value.copy(camera.position);
  skyDome.position.copy(camera.position);
  debugAPI.ready = true;
  debugAPI.buildInfo = Object.assign(debugAPI.buildInfo || {}, {
    ms: Math.round(performance.now() - t0),
    cells: CELLS.length,
    gates: LAYOUT.gates.length,
    calls: renderer.info.render.calls,
  });
  console.log('[salt-mirror] built in', Math.round(performance.now() - t0), 'ms', debugAPI.buildInfo);
  requestAnimationFrame(animate);
}

// ---------------------------------------------------------------------------
// render loop
// ---------------------------------------------------------------------------
let lastFrameTime = 0;
let fpAccum = 0, fpFrames = 0, fpTimer = 0;
let adaptiveChecked = false;
let adaptiveChecked2 = false;

function animate(now) {
  requestAnimationFrame(animate);
  if (!lastFrameTime) lastFrameTime = now;
  const dtRaw = (now - lastFrameTime) / 1000;
  lastFrameTime = now;
  const dt = Math.min(Math.max(dtRaw, 0.00001), 0.06);

  state.frame++;
  state.wall += dt;
  if (!state.paused) state.t += dt;

  // fixed-step simulation (constraints/gates/ripples), independent of framerate
  if (typeof stepSim === 'function') stepSim(dt);

  updateWeather(state.t);
  if (typeof updateSceneAnim === 'function') updateSceneAnim(dt);
  camRig.update(dt);
  U.uCamPos.value.copy(camera.position);
  skyDome.position.copy(camera.position);
  if (typeof updateAudio === 'function') updateAudio(dt);
  updateUI();

  renderer.render(scene, camera);

  if (state.firstFrame) {
    state.firstFrame = false;
    state.started = performance.now();
    state.ready = true;
    canvasEl.classList.add('ready');
    const veil = document.getElementById('veil');
    if (veil) veil.classList.add('done');
  }

  // fps meter + one-shot adaptive resolution step
  fpFrames++;
  fpTimer += dtRaw;
  if (fpTimer > 0.6) {
    state.fps = fpFrames / fpTimer;
    fpFrames = 0; fpTimer = 0;
    if (!adaptiveChecked && state.wall > 6.0) {
      adaptiveChecked = true;
      // step the resolution down when the GPU is struggling; still capped
      if (state.fps < 38 && renderer.getPixelRatio() > DPR_CAP_LO + 0.01) {
        dprCap = DPR_CAP_LO;
        applySize();
      }
    } else if (!adaptiveChecked2 && state.wall > 16.0) {
      adaptiveChecked2 = true;
      // a second, gentler step for very weak GPUs keeps motion fluid
      if (state.fps < 34 && renderer.getPixelRatio() > 0.72) {
        dprCap = 0.72;
        applySize();
      }
    }
  }
}

window.addEventListener('load', () => {
  try {
    boot();
  } catch (err) {
    showError(err && err.message ? err.message : String(err));
    console.error(err);
  }
});

// if the load event already fired (module executed late), boot immediately
if (document.readyState === 'complete') {
  try { boot(); } catch (err) { showError(err && err.message ? err.message : String(err)); console.error(err); }
}
