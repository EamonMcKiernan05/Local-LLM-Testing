<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b9c8cc">
<title>Bronze Grass at Crane Lake</title>
<style>
  :root {
    color-scheme: only light;
    --paper: rgba(250, 247, 239, .82);
    --paper-hi: rgba(255, 253, 247, .95);
    --ink: #2c2a24;
    --ink-soft: #625d50;
    --ink-faint: #8e8878;
    --line: rgba(60, 54, 40, .16);
    --brass: #a9854f;
    --brass-hi: #c5a36c;
    --slate: #22241f;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --shadow: 0 16px 44px rgba(24, 27, 22, .22), 0 1px 0 rgba(255,255,255,.55) inset;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #b8c6c8; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body { touch-action: none; }
  #scene {
    display: block; position: fixed; inset: 0;
    width: 100vw; height: 100vh; outline: none;
    cursor: grab; opacity: 0;
    transition: opacity 1.8s cubic-bezier(.4,0,.2,1);
  }
  #scene.ready { opacity: 1; }
  #scene.drag { cursor: grabbing; }

  #vignette, #grade {
    position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0;
    transition: opacity 2.2s ease;
  }
  #vignette {
    background:
      radial-gradient(120% 90% at 50% 48%, rgba(22,18,12,0) 53%, rgba(24,22,16,.16) 82%, rgba(18,17,12,.34) 100%),
      linear-gradient(180deg, rgba(26,30,28,.22) 0%, rgba(26,30,28,0) 16%);
  }
  #grade {
    background: linear-gradient(180deg, rgba(255,224,178,.05), rgba(78,104,110,.05));
    mix-blend-mode: soft-light;
  }
  #vignette.show { opacity: 1; }
  #grade.show { opacity: 1; }

  /* ------------------------------------------------------------- masthead */
  #masthead {
    position: fixed; left: clamp(18px, 3.4vw, 46px); top: clamp(16px, 2.9vh, 34px);
    z-index: 5; pointer-events: none; opacity: 0; transform: translateY(-8px);
    transition: opacity 1.8s ease .5s, transform 2.0s cubic-bezier(.2,.8,.2,1) .5s;
    color: #f7f2e7; text-shadow: 0 1px 18px rgba(20,26,24,.42), 0 1px 2px rgba(20,26,24,.30);
  }
  #masthead.show { opacity: 1; transform: none; }
  #masthead .kicker {
    font: 500 9px/1.2 var(--sans);
    letter-spacing: .34em; text-transform: uppercase;
    color: rgba(247,242,231,.78); margin: 0 0 8px 2px;
  }
  #masthead h1 {
    margin: 0; font-family: var(--serif); font-weight: 400;
    font-size: clamp(28px, 4vw, 56px); line-height: .94;
    letter-spacing: -.012em; color: #fbf6ea;
  }
  #masthead .sub {
    margin: 7px 0 0 3px; font-family: var(--serif); font-style: italic;
    font-size: clamp(13px, 1.35vw, 18px); color: rgba(246,239,224,.86);
    letter-spacing: .012em;
  }
  #masthead .rule {
    width: 34px; height: 1px; margin: 13px 0 0 3px;
    background: linear-gradient(90deg, rgba(201,168,106,.92), rgba(201,168,106,0));
  }

  /* ---------------------------------------------------------------- clock */
  #clock {
    position: fixed; right: clamp(16px, 2.8vw, 38px); top: clamp(16px, 2.9vh, 32px);
    z-index: 5; display: flex; align-items: center; gap: 12px;
    padding: 8px 13px 8px 9px; border-radius: 999px;
    background: rgba(28,31,27,.30); border: 1px solid rgba(255,252,240,.14);
    -webkit-backdrop-filter: blur(14px) saturate(1.1); backdrop-filter: blur(14px) saturate(1.1);
    color: #f4eee1; opacity: 0; transition: opacity 1.6s ease .7s;
    font-family: var(--sans); user-select: none;
  }
  #clock.show { opacity: 1; }
  #clock .ring { width: 26px; height: 26px; flex: 0 0 26px; transform: rotate(-90deg); }
  #clock .ring circle { fill: none; stroke-width: 1.6; }
  #clock .ring .trk { stroke: rgba(255,250,238,.18); }
  #clock .ring .bar { stroke: #d3b17a; stroke-linecap: round; }
  #clock .read { display: flex; flex-direction: column; gap: 2px; }
  #clock .tc {
    font-size: 10.5px; letter-spacing: .16em; font-variant-numeric: tabular-nums;
    color: rgba(250,245,233,.94);
  }
  #clock .tc b { font-weight: 600; color: #fffdf6; }
  #clock .meta {
    font-size: 8.5px; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(247,239,224,.60);
  }
  #clock .lens {
    font: 500 9px/1 var(--sans); letter-spacing: .17em; font-variant-numeric: tabular-nums;
    color: rgba(250,243,229,.76); padding-left: 11px; border-left: 1px solid rgba(255,250,238,.16);
  }
  #clock .lens b { font-weight: 600; color: #f6eeda; }

  /* ----------------------------------------------------------------- dock */
  #dock {
    position: fixed; left: 50%; bottom: clamp(14px, 2.8vh, 28px); transform: translate(-50%, 10px);
    z-index: 6; display: flex; align-items: center; gap: 3px; padding: 5px;
    border-radius: 16px; background: rgba(30,31,26,.56);
    border: 1px solid rgba(255,252,240,.15);
    box-shadow: 0 18px 46px rgba(14,16,12,.30), 0 1px 0 rgba(255,255,255,.10) inset;
    -webkit-backdrop-filter: blur(18px) saturate(1.15); backdrop-filter: blur(18px) saturate(1.15);
    opacity: 0; transition: opacity 1.5s ease .9s, transform 1.6s cubic-bezier(.2,.8,.2,1) .9s;
    font-family: var(--sans); max-width: calc(100vw - 20px); flex-wrap: nowrap;
  }
  #dock.show { opacity: 1; transform: translate(-50%, 0); }
  #dock button {
    appearance: none; border: 0; background: transparent; color: rgba(248,242,229,.72);
    font: 500 9.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase;
    padding: 11px 13px; border-radius: 11px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .25s ease, color .25s ease, transform .25s ease;
  }
  #dock button:hover { background: rgba(255,250,238,.08); color: #fffdf4; }
  #dock button:active { transform: translateY(1px); }
  #dock button:focus-visible { outline: 1px solid rgba(211,177,122,.75); outline-offset: 1px; }
  #dock .sep { width: 1px; height: 16px; margin: 0 4px; background: rgba(255,250,238,.14); }
  #cin { color: #f7efe0; }
  #cin .pip {
    width: 5px; height: 5px; border-radius: 50%; background: rgba(238,227,204,.34);
    box-shadow: 0 0 0 0 rgba(211,177,122,0); transition: background .3s, box-shadow .3s;
  }
  #cin[aria-pressed="true"] .pip {
    background: #d9b880; box-shadow: 0 0 0 4px rgba(211,177,122,.14), 0 0 12px rgba(219,184,128,.5);
  }
  #cin b { font-weight: 600; letter-spacing: .14em; color: #f0dfc2; }
  #pause[aria-pressed="true"] { background: rgba(211,177,122,.14); color: #fffdf6; }
  #sound .wave { display: inline-flex; align-items: flex-end; gap: 2px; height: 9px; opacity: .55; }
  #sound .wave i { width: 1.5px; background: currentColor; border-radius: 1px; height: 3px; transition: height .25s; }
  #sound[aria-pressed="true"] .wave i:nth-child(1) { height: 4px; }
  #sound[aria-pressed="true"] .wave i:nth-child(2) { height: 8px; }
  #sound[aria-pressed="true"] .wave i:nth-child(3) { height: 6px; }
  #sound[aria-pressed="true"] .wave { opacity: .9; }

  /* ----------------------------------------------------------------- hint */
  #hint {
    position: fixed; left: 50%; bottom: calc(clamp(14px, 2.8vh, 28px) + 58px);
    transform: translate(-50%, 4px); z-index: 5;
    font: 500 8.5px/1.4 var(--sans); letter-spacing: .20em; text-transform: uppercase;
    color: rgba(250,244,231,.70); text-shadow: 0 1px 10px rgba(20,24,20,.5);
    opacity: 0; transition: opacity 1.1s ease; pointer-events: none; white-space: nowrap;
  }
  #hint.show { opacity: 1; }
  #hint.gone { opacity: 0; }

  /* ----------------------------------------------------------------- veil */
  #veil {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(90% 80% at 52% 42%, #d6dbd2 0%, #b9c4c1 46%, #94a4a3 100%);
    transition: opacity 1.7s cubic-bezier(.5,0,.2,1), visibility 0s linear 1.7s;
  }
  #veil.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #veil .inner { width: min(420px, 74vw); text-align: center; color: #33382f; }
  #veil .kicker {
    font: 500 8.5px/1 var(--sans); letter-spacing: .42em; text-transform: uppercase;
    color: rgba(52,58,48,.62); margin-bottom: 17px;
  }
  #veil h2 {
    margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 4.4vw, 50px);
    line-height: 1; letter-spacing: -.01em; color: #2f342c;
  }
  #veil .it { font-family: var(--serif); font-style: italic; font-size: 15px; color: #4b5244; margin-top: 9px; }
  #veil .track {
    width: 100%; height: 1px; background: rgba(48,54,44,.19); margin: 33px 0 11px; overflow: hidden;
  }
  #veil .fill { height: 100%; width: 1%; background: linear-gradient(90deg, #7a6a4c, #b59a66); transition: width .5s ease; }
  #veil .step {
    font: 500 8px/1.5 var(--sans); letter-spacing: .24em; text-transform: uppercase;
    color: rgba(50,56,46,.56); min-height: 12px;
  }

  /* ---------------------------------------------------------------- error */
  #fail {
    position: fixed; inset: 0; z-index: 60; display: none; padding: 8vh 7vw;
    background: #f3efe6; color: #5e3128; overflow: auto;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #fail.on { display: block; }
  #fail h3 { font: 500 16px/1.4 var(--sans); letter-spacing: .08em; margin: 0 0 18px; }
  #fail pre { white-space: pre-wrap; }

  @media (max-width: 640px) {
    #masthead .kicker { letter-spacing: .26em; }
    #masthead h1 { font-size: 28px; }
    #clock { padding: 7px 9px; gap: 8px; }
    #clock .meta { display: none; }
    #clock .lens { display: none; }
    #dock { gap: 0; padding: 4px; border-radius: 14px; }
    #dock button { padding: 10px 8px; font-size: 8.5px; letter-spacing: .13em; }
    #sound .lbl { display: none; }
    #hint { bottom: calc(clamp(14px, 2.8vh, 28px) + 52px); font-size: 7.5px; letter-spacing: .15em; }
  }
  @media (prefers-reduced-motion: reduce) {
    #scene, #veil, #masthead, #dock, #clock { transition-duration: .01s !important; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Bronze grass steppe basin at Crane Lake, with cranes circling a shallow lake, a felt camp and burial mounds"></canvas>
<div id="vignette"></div>
<div id="grade"></div>

<div id="masthead">
  <div class="kicker">Steppe basin · 60-second study</div>
  <h1>Bronze Grass</h1>
  <p class="sub">at Crane Lake</p>
  <div class="rule"></div>
</div>

<div id="clock" aria-hidden="true">
  <svg class="ring" viewBox="0 0 26 26">
    <circle class="trk" cx="13" cy="13" r="11"></circle>
    <circle class="bar" id="ringBar" cx="13" cy="13" r="11" stroke-dasharray="69.115" stroke-dashoffset="69.115"></circle>
  </svg>
  <div class="read">
    <div class="tc"><b id="tc">00:00</b> <span style="opacity:.45">/ 01:00</span></div>
    <div class="meta">master loop · morning</div>
  </div>
  <div class="lens"><b id="lens">35</b> mm</div>
</div>

<div id="dock" role="group" aria-label="Playback and camera controls">
  <button id="cin" aria-pressed="true"><span class="pip"></span>Cinematic <b id="cinState">On</b></button>
  <button id="pause" aria-pressed="false">Pause</button>
  <button id="reset">Reset View</button>
  <div class="sep"></div>
  <button id="sound" aria-pressed="false"><span class="wave"><i></i><i></i><i></i></span><span class="lbl">Sound</span></button>
</div>

<div id="hint">drag to look · scroll for lens · space to pause</div>

<div id="veil">
  <div class="inner">
    <div class="kicker">A fixed-seed procedural landscape</div>
    <h2>Bronze Grass</h2>
    <div class="it">at Crane Lake</div>
    <div class="track"><div class="fill" id="veilBar"></div></div>
    <div class="step" id="veilStep">reading the morning</div>
  </div>
</div>

<div id="fail"><h3>The basin did not open.</h3><pre id="failText"></pre></div>

const PI = Math.PI;
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const SEED = 0xC7A4E10B;

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sat = (v) => v < 0 ? 0 : (v > 1 ? 1 : v);
const smoothstep = (e0, e1, x) => {
  const t = sat((x - e0) / (e1 - e0 || 1e-9));
  return t * t * (3 - 2 * t);
};
const smootherstep = (e0, e1, x) => {
  const t = sat((x - e0) / (e1 - e0 || 1e-9));
  return t * t * t * (t * (t * 6 - 15) + 10);
};
const damp = (a, b, lambda, dt) => b + (a - b) * Math.exp(-lambda * dt);
const wrapPi = (a) => ((a + PI) % TAU + TAU) % TAU - PI;
const wrapTau = (a) => ((a % TAU) + TAU) % TAU;
const dist2 = (x0, z0, x1, z1) => Math.hypot(x1 - x0, z1 - z0);
const sign = (v) => v < 0 ? -1 : 1;

/* ---------------------------------------------------------------- random */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);

const randi = (a, b) => Math.floor(rand(a, b + 1 - 1e-9));
const pick = (arr) => arr[Math.floor(rng() * arr.length) % arr.length];
const jitter = (s) => (rng() * 2 - 1) * s;

    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x),
               mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  float fbm4(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 4; i++) { s += a * vn(p); p = mat2(1.7, 1.15, -1.15, 1.7) * p + 9.1; a *= 0.5; }
    return s;
  }
  float fbm5(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) { s += a * vn(p); p = mat2(1.62, 1.18, -1.18, 1.62) * p + 7.7; a *= 0.5; }
    return s;
  }
  /* drag of the morning cloud shadows across the basin: closed loop, 60 s */
  float cloudShadowAt(vec2 xz, float phase) {
    vec2 o1 = vec2(cos(CR_TAU * phase), sin(CR_TAU * phase)) * 162.0;
    vec2 o2 = vec2(cos(CR_TAU * phase + 2.1), sin(CR_TAU * phase + 2.1)) * 69.0;
    float n = fbm4((xz + o1) * 0.00115) * 0.68 + fbm4((xz + o2) * 0.0027 + 13.0) * 0.32;
    return smoothstep(0.44, 0.66, n);
  }
`;

/* --------------------------------------------------------------- sky dome */
const ENV_U = {
  uPhase: { value: 0 },
  uSunDir: { value: WORLD.sunDir.clone() },
  uWindDir: { value: WORLD.windDir.clone() },
  uTime: { value: 0 }
};

const SKY = {
  mat: null,
  mesh: null,
  uniforms: null
};

function buildSky() {
  const uniforms = {
    uProjInv: { value: new THREE.Matrix4() },
    uCamWorld: { value: new THREE.Matrix4() },
    uSunDir: ENV_U.uSunDir,
    uPhase: ENV_U.uPhase,
    uTime: ENV_U.uTime,
    uFogColor: { value: new THREE.Color(WORLD.fogColor) }
  };
  const mat = new THREE.ShaderMaterial({
    uniforms,
    depthTest: false,
    depthWrite: false,
    fog: false,
    side: THREE.DoubleSide,
    vertexShader: /* glsl */`
      varying vec2 vUv;
      varying vec3 vViewRay;
      uniform mat4 uProjInv;
      void main() {
        vUv = uv;
        vec4 v = uProjInv * vec4(position.xy, 1.0, 1.0);
        vViewRay = v.xyz / v.w;
        gl_Position = vec4(position.xy, 1.0, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec2 vUv;
      varying vec3 vViewRay;
      uniform mat4 uCamWorld;
      uniform vec3 uSunDir;
      uniform float uPhase;
      uniform float uTime;
      uniform vec3 uFogColor;
      ${GLSL_NOISE}
      void main() {
        vec3 d = normalize(mat3(uCamWorld) * normalize(vViewRay));
        float up = clamp(d.y, -1.0, 1.0);
        float g = pow(1.0 - clamp(up, 0.0, 1.0), 3.6);

        /* the clear, cool morning zenith over a pale dusty horizon */
        vec3 zen = vec3(0.020, 0.080, 0.220);
        vec3 mid = vec3(0.060, 0.200, 0.440);
        vec3 hor = vec3(0.430, 0.560, 0.625);
        vec3 col = mix(zen, mid, smoothstep(0.03, 0.55, up));
        col = mix(col, hor, pow(1.0 - clamp(up, 0.0, 1.0), 2.4));

        float cs = max(dot(d, uSunDir), 0.0);
        float azToSun = max(dot(normalize(d.xz + 1e-5), normalize(uSunDir.xz + 1e-5)), 0.0);
        float lowWarm = pow(1.0 - clamp(up, 0.0, 1.0), 5.0) * pow(azToSun, 2.4);
        col += vec3(0.30, 0.20, 0.095) * lowWarm * 0.75;
        col += vec3(0.42, 0.29, 0.155) * pow(cs, 22.0);
        col += vec3(1.25, 0.94, 0.62) * pow(cs, 380.0);
        col += vec3(1.7, 1.42, 1.05) * smoothstep(0.99986, 0.99997, cs);

        /* high cirrus: long pale filaments of the morning jet */
        if (up > 0.012) {
          vec2 cp = d.xz * (5200.0 / max(up, 0.012)) * 0.00034;
          vec2 drift = vec2(cos(CR_TAU * uPhase), sin(CR_TAU * uPhase)) * 0.019;
          vec2 q = vec2(cp.x * 0.65 + cp.y * 0.32, cp.y * 1.85 - cp.x * 0.22) + drift;
          float c1 = fbm4(q * 1.15 + 3.7);
          float c2 = fbm4(q * 2.6 - 8.3);
          float cir = smoothstep(0.56, 0.82, c1 * 0.72 + c2 * 0.28);
          cir *= smoothstep(0.05, 0.34, up) * (1.0 - smoothstep(0.72, 1.0, up));
          vec3 cc = mix(vec3(0.62, 0.67, 0.70), vec3(1.18, 1.04, 0.86), pow(azToSun, 2.0));
          col = mix(col, cc, cir * 0.28);
        }

        /* fair-weather cumulus, projected onto a 2.7 km plane */
        if (up > 0.020) {
          vec2 cp = d.xz * (2700.0 / max(up, 0.02)) * 0.00052;
          vec2 drift = vec2(cos(CR_TAU * uPhase + 0.7), sin(CR_TAU * uPhase + 0.7)) * 0.0175;
          vec2 q = cp + drift;
          float n = fbm5(q * 0.92 + 4.0);
          float n2 = fbm4(q * 2.35 + 19.0 + drift.yx * 1.3);
          float shape = n * 0.72 + n2 * 0.30;
          float cover = smoothstep(0.630, 0.780, shape);
          float rim = smoothstep(0.60, 0.70, shape) * (1.0 - smoothstep(0.70, 0.78, shape));
          float horizonFade = smoothstep(0.018, 0.16, up) * (1.0 - smoothstep(0.60, 0.94, up) * 0.55);
          cover *= horizonFade;
          /* sun-side tops are creamy, the bellies cool and grey */
          float toSun = clamp(dot(normalize(vec3(-d.x, 0.55, -d.z)), uSunDir) * 0.5 + 0.5, 0.0, 1.0);
          vec3 lit = mix(vec3(0.94, 0.94, 0.90), vec3(1.38, 1.24, 1.00), pow(azToSun, 1.5));
          vec3 shade = vec3(0.34, 0.40, 0.48);
          vec3 cloud = mix(shade, lit, clamp(0.30 + 0.62 * toSun + 0.20 * rim, 0.0, 1.0));
          cloud += vec3(0.10, 0.065, 0.03) * rim * lowWarm;
          col = mix(col, cloud, cover * 0.74);
        }

        /* ground haze and the blue hour boundary of the plain */
        float band = exp(-max(up, 0.0) * 9.0);
        col = mix(col, uFogColor * 1.03, band * 0.30);
        if (up < 0.0) {
          col = mix(vec3(0.50, 0.52, 0.47), uFogColor, smoothstep(0.0, 0.10, -up));
        }
        col *= 0.985;
        float grain = h21(gl_FragCoord.xy + fract(uTime) * 137.0) - 0.5;
        col += grain * 0.006;
        gl_FragColor = vec4(max(col, vec3(0.0)), 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = -100000;
  mesh.layers.set(3);
  mesh.matrixAutoUpdate = false;
  SCENE.add(mesh);
  SKY.mat = mat;
  SKY.mesh = mesh;
  SKY.uniforms = uniforms;
  updateSkyUniforms();
  return mesh;
}

function updateSkyUniforms() {
  if (!SKY.uniforms || !CAMERA) return;
  SKY.uniforms.uProjInv.value.copy(CAMERA.projectionMatrixInverse);
  SKY.uniforms.uCamWorld.value.copy(CAMERA.matrixWorld);
  SKY.uniforms.uPhase.value = SIM.t / LOOP_SECONDS;
  SKY.uniforms.uTime.value = SIM.t;
  ENV_U.uPhase.value = SIM.t / LOOP_SECONDS;
  ENV_U.uTime.value = SIM.t;
}

/* ---------------------------------------------------------------- lights */
let SUN_LIGHT = null;
let HEMI_LIGHT = null;
let SKY_FILL = null;
const SUN_FOCUS = new THREE.Vector3();

function buildLights() {

  SUN_LIGHT.shadow.mapSize.set(sm, sm);
  const sc = SUN_LIGHT.shadow.camera;

  sc.near = 32; sc.far = 820;

  SUN_LIGHT.shadow.normalBias = 0.045;

  SCENE.background = new THREE.Color(WORLD.fogColor);
}

/** Keep the one shadow map over the ground the camera is actually looking at. */
function updateSunShadow() {
  if (!SUN_LIGHT || !CAMERA) return;
  const fwd = new THREE.Vector3();
  CAMERA.getWorldDirection(fwd);
  fwd.y = 0;
  if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1);
  fwd.normalize();
  const groundY = typeof sampleHeight === 'function' ? sampleHeight(CAMERA.position.x + fwd.x * 38, CAMERA.position.z + fwd.z * 38) : 0;
  SUN_FOCUS.set(
    CAMERA.position.x + fwd.x * 34 - fwd.z * 6,
    clamp(groundY, -1, 60) + 2,
    CAMERA.position.z + fwd.z * 34 + fwd.x * 6
  );
  SUN_LIGHT.target.position.copy(SUN_FOCUS);
  SUN_LIGHT.position.copy(SUN_FOCUS).addScaledVector(WORLD.sunDir, 380);
  SUN_LIGHT.target.updateMatrixWorld();
  SUN_LIGHT.updateMatrixWorld();
  const cam = SUN_LIGHT.shadow.camera;
  /* size the shadow box with altitude: tight for the low reeds, broader above camp */
  const alt = Math.max(2, CAMERA.position.y - SUN_FOCUS.y);
  const extent = clamp(70 + alt * 2.0, 90, 200);
  if (Math.abs(cam.right + 180) > 1 || Math.abs(extent - cam.right) > 1) {
    cam.left = -extent; cam.right = extent; cam.top = extent; cam.bottom = -extent;
    cam.updateProjectionMatrix();
  }
}

/* ---------------------------------------------------------------- camera */
const CAM = {
  camera: null,
  cine: true,
  yawOff: 0,
  pitchOff: 0,
  yawT: 0,
  pitchT: 0,
  lensScale: 1,
  lensScaleT: 1,
  dragging: false,
  pointers: new Map(),
  pinchDist: 0,
  rejoin: 0,
  onCinematicChange: null,
  onLensChange: null,
  flight: null,
  dist: 0,
  speed: 0,
  lens: 35,
  bank: 0,
  phase: 0
};

function createCamera() {
  CAMERA = new THREE.PerspectiveCamera(38, window.innerWidth / Math.max(1, window.innerHeight), WORLD.near, WORLD.far);
  CAMERA.up.set(0, 1, 0);
  CAMERA.layers.enableAll();
  CAM.camera = CAMERA;
  return CAMERA;
}

function lensToFov(lens) {
  /* full-frame vertical field of view */
  return 2 * Math.atan(12 / Math.max(8, lens)) * 180 / Math.PI;
}

CAM.setCinematic = function (on) {
  on = !!on;
  if (on === CAM.cine) return;
  CAM.cine = on;
  if (on) {
    CAM.rejoin = 1;
    CAM.yawT = 0; CAM.pitchT = 0;
    CAM.lensScaleT = 1;
  } else {
    CAM.rejoin = 0;
  }
  if (CAM.onCinematicChange) CAM.onCinematicChange(CAM.cine);
};

CAM.takeover = function () {
  if (CAM.cine) CAM.setCinematic(false);
};

CAM.resetView = function () {
  SIM.t = 0;
  SIM.acc = 0;
  SIM.wakeAcc = 0;
  CAM.yawOff = CAM.pitchOff = CAM.yawT = CAM.pitchT = 0;
  CAM.lensScale = CAM.lensScaleT = 1;
  CAM.cine = true;
  CAM.rejoin = 0;
  CAM.dragging = false;
  if (typeof restartWake === 'function') restartWake();
  if (CAM.onCinematicChange) CAM.onCinematicChange(true);
  if (typeof UI !== 'undefined' && UI.syncPaused) UI.syncPaused();
};

CAM.zoomBy = function (factor) {
  if (CAM.cine) CAM.takeover();
  CAM.lensScaleT = clamp(CAM.lensScaleT / factor, 0.62, 1.55);
  if (CAM.onLensChange) CAM.onLensChange();
};

CAM.bindInput = function (el) {
  let dragMoved = false;
  let downX = 0, downY = 0;
  const onDown = (e) => {
    if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
    if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
    CAM.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    downX = e.clientX; downY = e.clientY;
    dragMoved = false;
    if (CAM.pointers.size === 1) {
      CAM.dragging = true;
      el.classList.add('drag');
    } else if (CAM.pointers.size === 2) {
      const [a, b] = [...CAM.pointers.values()];
      CAM.pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
      CAM.takeover();
    }
    hideHintSoon();
  };
  const onMove = (e) => {
    if (!CAM.pointers.has(e.pointerId)) return;
    const prev = CAM.pointers.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    prev.x = e.clientX; prev.y = e.clientY;
    if (CAM.pointers.size >= 2) {
      const [a, b] = [...CAM.pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (CAM.pinchDist > 0 && d > 0) {
        CAM.zoomBy(d / CAM.pinchDist);
      }
      CAM.pinchDist = d;
      return;
    }
    if (!CAM.dragging) return;
    if (!dragMoved && Math.hypot(e.clientX - downX, e.clientY - downY) > 2.5) {
      dragMoved = true;
      CAM.takeover();
    }
    if (!dragMoved) return;
    const focal = Math.min(70, Math.max(24, CAM.lens));
    CAM.yawT = clamp(CAM.yawT - dx * 0.0026 * (focal / 35), -0.95, 0.95);
    CAM.pitchT = clamp(CAM.pitchT - dy * 0.0022 * (focal / 35), -0.58, 0.52);
    if (CAM.onLensChange) CAM.onLensChange();
  };
  const onUp = (e) => {
    if (!CAM.pointers.has(e.pointerId)) return;
    CAM.pointers.delete(e.pointerId);
    if (CAM.pointers.size === 0) {
      CAM.dragging = false;
      el.classList.remove('drag');
    }
    if (CAM.pointers.size < 2) CAM.pinchDist = 0;
  };
  const onWheel = (e) => {
    if (!e.ctrlKey) e.preventDefault();
    const f = Math.exp(-e.deltaY * 0.0011);
    CAM.zoomBy(f);
    hideHintSoon();
  };
  el.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  el.addEventListener('wheel', onWheel, { passive: false });
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (typeof togglePause === 'function') togglePause();
    }
    if (e.key === 'c' || e.key === 'C') {
      CAM.setCinematic(!CAM.cine);
      if (typeof UI !== 'undefined' && UI.syncCinematic) UI.syncCinematic();
    }
    if (e.key === 'r' || e.key === 'R') {
      CAM.resetView();
      if (typeof UI !== 'undefined' && UI.syncCinematic) UI.syncCinematic();
    }
    if (e.key === 'm' || e.key === 'M') {
      if (typeof toggleSound === 'function') toggleSound();
    }
  });
};

CAM.update = function (dt) {
  if (!CAMERA) return;
  const rate = 9.0;
  const k = 1 - Math.exp(-rate * Math.min(dt, 0.1));
  CAM.yawOff += (CAM.yawT - CAM.yawOff) * k;
  CAM.pitchOff += (CAM.pitchT - CAM.pitchOff) * k;
  CAM.lensScale += (CAM.lensScaleT - CAM.lensScale) * (1 - Math.exp(-5.5 * Math.min(dt, 0.1)));
  if (CAM.rejoin > 0) {
    /* gentle, exact return to the authored framing after Manual */
    const rk = 1 - Math.exp(-2.6 * Math.min(dt, 0.1));
    CAM.yawT *= (1 - rk);
    CAM.pitchT *= (1 - rk);
    CAM.lensScaleT += (1 - CAM.lensScaleT) * rk;
    if (Math.abs(CAM.yawT) < 1e-4 && Math.abs(CAM.pitchT) < 1e-4 && Math.abs(CAM.lensScaleT - 1) < 1e-4) {
      CAM.yawT = CAM.pitchT = 0;
      CAM.lensScaleT = 1;
      CAM.rejoin = 0;
    }
  }
  if (typeof updateFlightCamera === 'function') updateFlightCamera();
};

function hideHintSoon() {
  if (typeof hideHint === 'function') hideHint();
}

/* --------------------------------------------------------- world registry */
const UPDATERS = [];
const COLLIDERS = {
  capsules: [],   /* {ax,ay,az,bx,by,bz,r} for trunks, poles, ropes */
  spheres: [],    /* {x,y,z,r} for rocks, crowns, heads */
  cones: [],      /* {x,z,r,h,y0} for mounds, gers, stacks */
  boxes: [],      /* {x,y,z,hx,hy,hz,yaw} for walls, carts */
  discs: []       /* {x,z,r,y} for low, walkable prop bases */
};
function addCapsule(ax, ay, az, bx, by, bz, r) {
  COLLIDERS.capsules.push({ ax, ay, az, bx, by, bz, r });
}
function addSphere(x, y, z, r) { COLLIDERS.spheres.push({ x, y, z, r }); }
function addCone(x, z, r, h, y0 = 0) { COLLIDERS.cones.push({ x, z, r, h, y0 }); }
function addBox(x, y, z, hx, hy, hz, yaw = 0) { COLLIDERS.boxes.push({ x, y, z, hx, hy, hz, yaw }); }

function updateUniforms() {
  ENV_U.uTime.value = SIM.t;
  ENV_U.uPhase.value = SIM.t / LOOP_SECONDS;
  if (SKY.uniforms) {
    SKY.uniforms.uPhase.value = SIM.t / LOOP_SECONDS;
    SKY.uniforms.uTime.value = SIM.t;
  }
  updateSkyUniforms();
}


/* ======================= 02-textures.js ======================= */
/* ==========================================================================
   02 — every texture in the basin is painted here from the fixed seed:
        steppe turf, mud and ruts, granite, felt with its sewn seams, kilim,
        horsehair, crane feathers, smoke and the wind's foam tiles.
   ========================================================================== */

const TEX = {};
const MAT = {};

/* --------------------------------------------------------- tiling noise */
function hash2i(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1013904223);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function tileNoise(u, v, fx, fy, seed) {
  const x = u * fx, y = v * fy;
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const sx = (v2) => ((v2 % fx) + fx) % fx;
  const sy = (v2) => ((v2 % fy) + fy) % fy;
  const u0 = xf * xf * (3 - 2 * xf), v0 = yf * yf * (3 - 2 * yf);
  const a = hash2i(sx(xi), sy(yi), seed);
  const b = hash2i(sx(xi + 1), sy(yi), seed);
  const c = hash2i(sx(xi), sy(yi + 1), seed);
  const d = hash2i(sx(xi + 1), sy(yi + 1), seed);
  return lerp(lerp(a, b, u0), lerp(c, d, u0), v0);
}
function tileFbm(u, v, fx, fy, oct, seed, gain = 0.5) {
  let s = 0, amp = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    s += amp * tileNoise(u, v, fx << i, fy << i, seed + i * 37);
    norm += amp; amp *= gain;
  }
  return s / norm;
}
function makeTileField(W, H, fx, fy, oct, seed) {
  const a = new Float32Array(W * H);
  for (let j = 0; j < H; j++) {
    const v = (j + 0.5) / H;
    for (let i = 0; i < W; i++) {
      a[j * W + i] = tileFbm((i + 0.5) / W, v, fx, fy, oct, seed);
    }
  }
  return a;
}
function dataTex(canvas, opts = {}) {
  return canvasTex(canvas, { ...opts, srgb: opts.srgb === undefined ? false : opts.srgb });
}

/* ------------------------------------------------------------ ground */
function makeGroundTextures() {
  const W = 512;
  const hgt = makeTileField(W, W, 18, 18, 4, 91);
  const fine = makeTileField(W, W, 64, 64, 3, 133);
  const c = mkCanvas(W, W);
  const x = c2d(c, true);
  const img = x.createImageData(W, W);
  const d = img.data;
  for (let j = 0; j < W; j++) {
    for (let i = 0; i < W; i++) {
      const k = j * W + i;
      const u = i / W, v = j / W;
      const n = hgt[k], f = fine[k];
      const fibre = tileFbm(u, v, 96, 22, 2, 301);
      let tone = 0.70 + n * 0.20 + (f - 0.5) * 0.16 + (fibre - 0.5) * 0.10;
      let r = 168 * tone, g = 174 * tone, b = 138 * tone;
      /* the odd bleached stalk and dark seed head */
      const speck = hash2i(i, j, 771);
      if (speck > 0.9975) { r *= 1.25; g *= 1.22; b *= 1.06; }
      if (speck < 0.0022) { r *= 0.55; g *= 0.56; b *= 0.50; }
      const o = k * 4;
      d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  TEX.ground = canvasTex(c, { repeat: [1, 1], aniso: MAX_ANISO });
  TEX.ground.wrapS = TEX.ground.wrapT = THREE.RepeatWrapping;

  const nrmC = heightToNormalCanvas(hgt.map((v, i) => v * 0.7 + fine[i] * 0.3), W, W, 3.6, true);
  TEX.groundNormal = dataTex(nrmC, { aniso: MAX_ANISO });

  /* broad colour patchwork: greenness / dryness / bareness of the steppe */
  const M = 512;
  const m1 = makeTileField(M, M, 4, 4, 4, 411);
  const m2 = makeTileField(M, M, 8, 8, 3, 431);
  const mc = mkCanvas(M, M);
  const mx = c2d(mc, true);
  const mi = mx.createImageData(M, M);
  const md = mi.data;
  for (let j = 0; j < M; j++) {
    for (let i = 0; i < M; i++) {
      const k = j * M + i;
      const a = m1[k], b = m2[k];
      const dry = clamp(a * 1.5 - 0.25 + b * 0.3, 0, 1);
      const green = clamp(1.1 - a * 1.3 + b * 0.2, 0, 1);
      md[k * 4] = Math.round(dry * 255);
      md[k * 4 + 1] = Math.round(green * 255);
      md[k * 4 + 2] = Math.round(clamp(b * 255, 0, 255));
      md[k * 4 + 3] = Math.round(green * 255);
    }
  }
  mx.putImageData(mi, 0, 0);
  TEX.macro = canvasTex(mc, { aniso: MAX_ANISO, srgb: false });
  TEX.macro.wrapS = TEX.macro.wrapT = THREE.RepeatWrapping;
}

/* ------------------------------------------------------------- the track */
function makeTrackTextures() {
  const W = 512, H = 512;
  const n = makeTileField(W, H, 14, 34, 4, 517);
  const fine = makeTileField(W, H, 48, 110, 3, 533);
  const c = mkCanvas(W, H);
  const x = c2d(c, true);
  const img = x.createImageData(W, H);
  const d = img.data;
  for (let j = 0; j < H; j++) {
    const v = j / H;
    for (let i = 0; i < W; i++) {
      const k = j * W + i;
      const u = i / W;
      /* two compacted ruts, a raised grassy crown, soft shoulders */
      const rut = Math.exp(-Math.pow((u - 0.30) / 0.085, 2)) + Math.exp(-Math.pow((u - 0.72) / 0.09, 2));
      const crown = Math.exp(-Math.pow((u - 0.51) / 0.09, 2));
      const edge = smoothstep(0.0, 0.10, u) * smoothstep(1.0, 0.90, u);
      let tone = 0.78 + (n[k] - 0.5) * 0.30 + (fine[k] - 0.5) * 0.14;
      tone *= 0.76 + 0.30 * edge;
      tone *= 1.0 - rut * 0.19 + crown * 0.06;
      let r = 188 * tone + 11 * crown;
      let g = 173 * tone + 17 * crown;
      let b = 140 * tone + 6 * crown;
      const sp = hash2i(i, j, 99);
      if (sp > 0.995) { r = 86; g = 82; b = 72; }
      if (sp < 0.004 && crown > 0.35) { r *= 0.72; g *= 0.86; b *= 0.58; }
      const o = k * 4;
      d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  TEX.track = canvasTex(c);
  TEX.track.wrapS = TEX.track.wrapT = THREE.RepeatWrapping;
  TEX.trackNormal = dataTex(heightToNormalCanvas(n, W, H, 2.1, true));
}

/* ---------------------------------------------------------------- stone */
function makeStoneTextures() {
  const W = 512;
  const a = makeTileField(W, W, 10, 10, 5, 617);
  const b = makeTileField(W, W, 40, 40, 3, 641);
  const c = mkCanvas(W, W);
  const x = c2d(c, true);
  const img = x.createImageData(W, W);
  const d = img.data;
  for (let j = 0; j < W; j++) {
    for (let i = 0; i < W; i++) {
      const k = j * W + i;
      const grain = hash2i(i, j, 701);
      let tone = 0.56 + a[k] * 0.34 + (b[k] - 0.5) * 0.22 + (grain - 0.5) * 0.13;
      let r = 136 * tone, g = 134 * tone, bl = 126 * tone;
      if (grain > 0.988) { r *= 1.3; g *= 1.28; bl *= 1.2; }
      const vein = Math.abs(tileFbm((i + 0.5) / W, (j + 0.5) / W, 6, 6, 3, 733) - 0.5);
      if (vein < 0.012) { r *= 0.72; g *= 0.73; bl *= 0.75; }
      const o = k * 4;
      d[o] = r; d[o + 1] = g; d[o + 2] = bl; d[o + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  TEX.stone = canvasTex(c);
  TEX.stoneNormal = dataTex(heightToNormalCanvas(a, W, W, 3.1, true));
}

/* ----------------------------------------------------------------- wood */
function makeWoodTextures() {
  const W = 512, H = 512;
  const c = mkCanvas(W, H);
  const x = c2d(c, true);
  const grain = makeTileField(W, H, 3, 36, 4, 811);
  const img = x.createImageData(W, H);
  const d = img.data;
  for (let j = 0; j < H; j++) {
    for (let i = 0; i < W; i++) {
      const k = j * W + i;
      const u = i / W;
      const knot = Math.exp(-Math.pow((u - 0.32) / 0.025, 2) - Math.pow((j / H - 0.62) / 0.06, 2));
      let tone = 0.56 + grain[k] * 0.36 + (hash2i(i, j, 823) - 0.5) * 0.08;
      tone *= 1 - knot * 0.5;
      const r = 150 * tone, g = 126 * tone, b = 95 * tone;
      const o = k * 4;
      d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  TEX.wood = canvasTex(c);
  TEX.woodNormal = dataTex(heightToNormalCanvas(grain, W, H, 2.2, true));
}

/* ---------------------------------------------------------------- felt */
function makeFeltTextures() {
  const W = 1024, H = 1024;
  const c = mkCanvas(W, H);
  const x = c2d(c, true);
  const R = mulberry32(SEED ^ 0xfe17);
  x.fillStyle = '#d9d1bd';
  x.fillRect(0, 0, W, H);
  /* soft mottling from the fulling and years of smoke */
  for (let i = 0; i < 260; i++) {
    const px = R() * W, py = R() * H;
    const r = 30 + R() * 160;
    const dark = R() < 0.45;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, dark ? `rgba(120,108,88,${0.035 + R() * 0.05})` : `rgba(255,249,232,${0.03 + R() * 0.06})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  /* fibre: thousands of short, hooked strands */
  x.lineWidth = 1;
  for (let i = 0; i < 9000; i++) {
    const px = R() * W, py = R() * H, len = 3 + R() * 13;
    const ang = (R() - 0.5) * 0.9 + (R() < 0.5 ? 0 : PI);
    x.strokeStyle = R() < 0.5 ? `rgba(110,99,80,${0.05 + R() * 0.10})` : `rgba(255,250,236,${0.05 + R() * 0.11})`;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + 2, py + Math.sin(ang) * len * 0.5, px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  /* sewn panel seams: four across, two down, with visible stitching */
  const seam = (horizontal, pos) => {
    x.strokeStyle = 'rgba(94,84,66,.42)';
    x.lineWidth = 5;
    x.beginPath();
    if (horizontal) { x.moveTo(0, pos); x.lineTo(W, pos); } else { x.moveTo(pos, 0); x.lineTo(pos, H); }
    x.stroke();
    x.strokeStyle = 'rgba(244,236,216,.5)';
    x.lineWidth = 1.5;
    x.beginPath();
    if (horizontal) { x.moveTo(0, pos - 5); x.lineTo(W, pos - 5); } else { x.moveTo(pos - 5, 0); x.lineTo(pos - 5, H); }
    x.stroke();
    /* the stitch itself */
    x.strokeStyle = 'rgba(78,67,51,.66)';
    x.lineWidth = 2.1;
    for (let t = 0; t < (horizontal ? W : H); t += 16) {
      const jitter = (R() - 0.5) * 2.0;
      x.beginPath();
      if (horizontal) {
        x.moveTo(t + jitter, pos - 7); x.lineTo(t + 6 + jitter, pos + 7);
      } else {
        x.moveTo(pos - 7, t + jitter); x.lineTo(pos + 7, t + 6 + jitter);
      }
      x.stroke();
    }
  };
  seam(true, 256); seam(true, 512); seam(true, 768);
  seam(false, 512);
  /* two neat patches, stitched on */
  const patch = (px, py, w, h, tone) => {
    x.fillStyle = tone;
    x.fillRect(px, py, w, h);
    x.strokeStyle = 'rgba(88,76,58,.55)';
    x.lineWidth = 2;
    x.setLineDash([5, 5]);
    x.strokeRect(px + 5, py + 5, w - 10, h - 10);
    x.setLineDash([]);
    x.strokeStyle = 'rgba(250,242,222,.35)';
    x.lineWidth = 1;
    for (let t = 0; t < w; t += 11) {
      x.beginPath(); x.moveTo(px + t, py + 4); x.lineTo(px + t + 5, py); x.stroke();
      x.beginPath(); x.moveTo(px + t, py + h - 4); x.lineTo(px + t + 5, py + h); x.stroke();
    }
  };
  patch(96, 620, 200, 120, 'rgba(198,184,157,.55)');
  patch(640, 300, 150, 170, 'rgba(212,201,177,.42)');
  /* smoke-darkened skirt along the bottom and a few old stains */
  const grime = x.createLinearGradient(0, H * 0.62, 0, H);
  grime.addColorStop(0, 'rgba(84,70,49,0)');
  grime.addColorStop(1, 'rgba(76,62,43,.30)');
  x.fillStyle = grime;
  x.fillRect(0, H * 0.62, W, H * 0.38);
  for (let i = 0; i < 20; i++) {
    const px = R() * W, py = H * 0.55 + R() * H * 0.45, r = 8 + R() * 40;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, `rgba(70,55,36,${0.06 + R() * 0.1})`);
    g.addColorStop(1, 'rgba(70,55,36,0)');
    x.fillStyle = g;
    x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  TEX.felt = canvasTex(c, { aniso: MAX_ANISO });
  TEX.felt.wrapS = TEX.felt.wrapT = THREE.RepeatWrapping;

  /* a lighter, cleaner felt for the roof and the new tent */
  const c2 = mkCanvas(512, 512);
  const y = c2d(c2, true);
  y.fillStyle = '#e2dbc9';
  y.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 5000; i++) {
    const px = R() * 512, py = R() * 512, len = 3 + R() * 9;
    y.strokeStyle = R() < 0.5 ? `rgba(120,110,90,${0.04 + R() * 0.07})` : `rgba(255,252,240,${0.05 + R() * 0.1})`;
    y.lineWidth = 1;
    y.beginPath(); y.moveTo(px, py); y.lineTo(px + (R() - 0.5) * len, py + len); y.stroke();
  }
  TEX.feltRoof = canvasTex(c2, { aniso: MAX_ANISO });
  TEX.feltRoof.wrapS = TEX.feltRoof.wrapT = THREE.RepeatWrapping;

  const nh = makeTileField(256, 256, 24, 24, 3, 907);
  TEX.feltNormal = dataTex(heightToNormalCanvas(nh, 256, 256, 1.4, true));
}

/* --------------------------------------------------------------- kilim */
function makeKilimTexture() {
  const W = 512, H = 512;
  const c = mkCanvas(W, H);
  const x = c2d(c, true);
  const R = mulberry32(SEED ^ 0x9017);
  x.fillStyle = '#711f21';
  x.fillRect(0, 0, W, H);
  const bands = [
    [30, 40, '#d9c8a8'], [110, 16, '#293a44'], [160, 20, '#b97836'],
    [240, 46, '#d9c8a8'], [310, 18, '#293a44'], [360, 22, '#8a3a2a'],
    [430, 40, '#cbb58f']
  ];
  for (const [py, h, col] of bands) {
    x.fillStyle = col;
    x.fillRect(0, py, W, h);
  }
  /* hooked medallions */
  x.strokeStyle = '#2a3030';
  x.lineWidth = 5;
  for (let i = 0; i < 5; i++) {
    const cx = 60 + i * 100, cy = 240;
    x.beginPath();
    x.moveTo(cx - 30, cy + 10); x.lineTo(cx - 30, cy - 22); x.lineTo(cx, cy - 40);
    x.lineTo(cx + 30, cy - 22); x.lineTo(cx + 30, cy + 10); x.lineTo(cx - 30, cy + 10);
    x.stroke();
    x.fillStyle = '#b97836';
    x.beginPath(); x.moveTo(cx, cy - 26); x.lineTo(cx + 14, cy + 4); x.lineTo(cx - 14, cy + 4); x.closePath(); x.fill();
  }
  /* woven flecks and wear */
  for (let i = 0; i < 7000; i++) {
    x.fillStyle = `rgba(${R() < 0.5 ? '250,240,215' : '40,30,24'},${0.025 + R() * 0.06})`;
    x.fillRect(R() * W, R() * H, 1, 1 + R() * 2);
  }
  TEX.kilim = canvasTex(c);
  TEX.kilim.wrapS = TEX.kilim.wrapT = THREE.RepeatWrapping;
}

/* --------------------------------------------------------------- horse */
function makeHorseTextures() {
  const W = 512, H = 512;

  const x = c2d(c, true);
  x.fillStyle = '#b4a99a';
  x.fillRect(0, 0, W, H);

    const px = R() * W, py = R() * H;

    x.strokeStyle = R() < 0.5 ? `rgba(255,248,234,${0.02 + R() * 0.05})` : `rgba(70,56,44,${0.02 + R() * 0.05})`;
    x.lineWidth = 1;
    x.beginPath();
    x.moveTo(px, py);

/* ------------------------------------------------------------ feathers */
function makeFeatherTexture() {
  const W = 256, H = 128;
  const c = mkCanvas(W, H);
  const x = c2d(c, true);
  x.clearRect(0, 0, W, H);
  /* a primary: rachis tapering left to right, barbs sweeping back */
  const shaftY = H * 0.5;
  x.strokeStyle = 'rgba(238,236,226,.95)';
  x.lineWidth = 3.2;
  x.beginPath(); x.moveTo(6, shaftY); x.quadraticCurveTo(W * 0.62, shaftY - 4, W - 6, shaftY + 2); x.stroke();
  for (let i = 0; i < 110; i++) {
    const t = i / 110;
    const px = 8 + t * (W - 18);
    const breadth = Math.sin(Math.pow(t, 0.55) * PI) * H * 0.44 + 2;
    for (const s of [-1, 1]) {
      const len = breadth * (0.62 + 0.38 * Math.sin(t * 9.0 + (s > 0 ? 0 : 1.7)));
      const ex = px + 16 + t * 10;
      const ey = shaftY + s * len;
      x.strokeStyle = `rgba(240,238,229,${0.30 + 0.55 * (1 - t)})`;
      x.lineWidth = 0.8 + (1 - t) * 1.2;
      x.beginPath();
      x.moveTo(px, shaftY + s * 1.5);
      x.quadraticCurveTo(px + 9, shaftY + s * len * 0.45, ex, ey);
      x.stroke();
    }
  }
  /* soften the outline at the tip */
  x.globalCompositeOperation = 'destination-in';
  const g = x.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(0.82, 'rgba(0,0,0,0.96)');
  g.addColorStop(1, 'rgba(0,0,0,0.0)');
  x.fillStyle = g;
  x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = 'source-over';
  TEX.feather = canvasTex(c, { srgb: true });
  TEX.feather.wrapS = TEX.feather.wrapT = THREE.ClampToEdgeWrapping;
}

/* --------------------------------------------------------------- smoke */
function makeSmokeTexture() {
  const W = 128;
  const c = mkCanvas(W, W);
  const x = c2d(c, true);
  const img = x.createImageData(W, W);
  const d = img.data;
  for (let j = 0; j < W; j++) {
    for (let i = 0; i < W; i++) {
      const u = i / W * 2 - 1, v = j / W * 2 - 1;
      const r = Math.hypot(u, v * 0.9);
      const n = tileFbm((i + 0.5) / W, (j + 0.5) / W, 5, 5, 3, 1211);
      let a = (1 - smoothstep(0.25, 1.0, r)) * (0.5 + n * 0.7);
      a = clamp(a, 0, 1) * (1 - smoothstep(0.82, 1.0, r));
      const o = (j * W + i) * 4;
      d[o] = 236; d[o + 1] = 232; d[o + 2] = 222;
      d[o + 3] = Math.round(a * 235);
    }
  }
  x.putImageData(img, 0, 0);
  TEX.smoke = canvasTex(c, { srgb: true });
  TEX.smoke.wrapS = TEX.smoke.wrapT = THREE.ClampToEdgeWrapping;
}

/* -------------------------------------------------------- wind and water */
function makeWindTextures() {
  const W = 512;
  const c = mkCanvas(W, W);
  const x = c2d(c, true);
  const img = x.createImageData(W, W);
  const d = img.data;
  for (let j = 0; j < W; j++) {
    for (let i = 0; i < W; i++) {
      const u = (i + 0.5) / W, v = (j + 0.5) / W;
      const streak = tileFbm(u, v, 4, 42, 4, 2017);
      const patch = tileFbm(u, v, 3, 3, 3, 2039);
      const sparkle = tileFbm(u, v, 90, 90, 2, 2063);
      const o = (j * W + i) * 4;
      d[o] = Math.round(clamp((streak - 0.42) * 3.0, 0, 1) * 255);
      d[o + 1] = Math.round(clamp((sparkle - 0.55) * 5.0, 0, 1) * 255);
      d[o + 2] = Math.round(clamp((patch - 0.35) * 2.0, 0, 1) * 255);
      d[o + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  TEX.wind = dataTex(c, { aniso: MAX_ANISO });
  TEX.wind.wrapS = TEX.wind.wrapT = THREE.RepeatWrapping;

  /* small ripple normal, tiled over the whole lake */
  const N = 256;
  const hgt = new Float32Array(N * N);
  const waves = [[3, 2, 0.42, 0.3], [5, -2, 0.30, 1.1], [-2, 5, 0.24, 2.4], [7, 3, 0.16, 4.0],
    [1, -7, 0.14, 5.2], [9, -4, 0.10, 0.8], [-6, 9, 0.08, 3.1], [11, 6, 0.06, 4.7],
    [-9, -5, 0.05, 2.0], [13, -11, 0.04, 5.8]];
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const u = i / N, v = j / N;
      let h = 0;
      for (const w of waves) h += Math.sin(TAU * (u * w[0] + v * w[1]) + w[3]) * w[2];
      h += (tileFbm(u, v, 9, 9, 3, 2081) - 0.5) * 0.55;
      hgt[j * N + i] = h;
    }
  }
  TEX.rippleNormal = dataTex(heightToNormalCanvas(hgt, N, N, 1.15, true), { aniso: MAX_ANISO });
}

/* ------------------------------------------------------------- materials */
function makeStandard(opts) {
  return new THREE.MeshStandardMaterial({
    roughness: 0.88,
    metalness: 0.0,
    ...opts
  });
}

function makeTerrainMaterial() {
  const mat = makeStandard({
    map: TEX.ground,
    normalMap: TEX.groundNormal,
    normalScale: new THREE.Vector2(0.55, 0.55),
    vertexColors: true,
    color: 0xffffff,
    roughness: 0.93,
    metalness: 0.0,
    dithering: true
  });
  const uniforms = {
    uMacro: { value: TEX.macro },
    uPhase: ENV_U.uPhase,
    uSunDir: ENV_U.uSunDir,
    uRockTint: { value: new THREE.Color(0x7c7a70) }
  };
  mat.userData.uniforms = uniforms;
  mat.onBeforeCompile = (shader) => {
    for (const k of Object.keys(uniforms)) shader.uniforms[k] = uniforms[k];
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float aWet;
        attribute float aRock;
        varying vec3 vWPos;
        varying float vWet;
        varying float vRock;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
        vWet = aWet;
        vRock = aRock;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        ${GLSL_NOISE}
        uniform sampler2D uMacro;
        uniform float uPhase;
        uniform vec3 uRockTint;
        varying vec3 vWPos;
        varying float vWet;
        varying float vRock;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        {
          vec2 wp = vWPos.xz;
          vec2 muv = wp * 0.0019;
          vec4 mac = texture2D(uMacro, muv);
          float dryness = mac.r;
          float green = mac.a;
          float patchN = texture2D(uMacro, wp * 0.0071 + vec2(0.37, 0.61)).a;
          /* the detail map is already tiled by uv; add a second, finer sample */
          vec3 fine = texture2D(map, wp * 0.31).rgb;
          diffuseColor.rgb *= 0.88 + fine.g * 0.20;
          vec3 dryTint = vec3(1.20, 1.08, 0.78);
          vec3 greenTint = vec3(0.72, 1.03, 0.66);
          diffuseColor.rgb *= mix(greenTint, dryTint, clamp(dryness, 0.0, 1.0));
          /* rock and strata: the escarpment and the granite crags */
          if (vRock > 0.01) {
            float band = sin(vWPos.y * 1.65 + fbm4(wp * 0.014) * 6.0) * 0.5 + 0.5;
            vec3 rock = uRockTint * (0.66 + band * 0.28 + fine.g * 0.14);
            rock *= 0.92 + patchN * 0.16;
            diffuseColor.rgb = mix(diffuseColor.rgb, rock, smoothstep(0.02, 0.55, vRock) * 0.88);
          }
          float wetBand = smoothstep(0.75, 0.15, vWPos.y) * vWet;
          diffuseColor.rgb *= 1.0 - wetBand * 0.58;
          float cloud = cloudShadowAt(wp, uPhase);
          diffuseColor.rgb *= 1.0 - cloud * 0.15;
          /* the detail tiles must not moire the far hillside: fade to the
             broad vertex colour before the texture rows can alias */
          float detailFade = smoothstep(320.0, 1050.0, length(cameraPosition - vWPos));
          diffuseColor.rgb = mix(diffuseColor.rgb, vColor.rgb * 0.92, detailFade * 0.94);
        }`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.34, clamp(vWet * smoothstep(0.8, 0.1, vWPos.y), 0.0, 1.0));`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        {
          /* far hills are hazed into one soft plane: this stops the low sun
             from breaking the long scarp into horizontal lighting terraces */
          float farFade = smoothstep(260.0, 820.0, length(cameraPosition - vWPos));
          vec3 flatN = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);
          normal = normalize(mix(normal, flatN, farFade * 0.94));
        }`);
  };
  mat.customProgramCacheKey = () => 'crane-terrain-v1';
  return mat;
}

function bindCloudShadow(mat, key) {
  const uniforms = { uPhase: ENV_U.uPhase };
  mat.userData.uniforms = uniforms;
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uPhase = ENV_U.uPhase;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\n${GLSL_NOISE}\nuniform float uPhase;\nvarying vec3 vWPos;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        diffuseColor.rgb *= 1.0 - cloudShadowAt(vWPos.xz, uPhase) * 0.16;`);
  };
  mat.customProgramCacheKey = () => 'crane-cloud-' + key;
  return mat;
}
