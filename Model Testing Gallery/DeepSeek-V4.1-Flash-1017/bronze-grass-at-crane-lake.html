/* ======================= 03-terrain.js ======================= */
/* ==========================================================================
   03 — the land: one shallow lake basin, seven burial mounds, the long
        south-facing escarpment, the old track, its stones and its bones.
   All heights in metres. Water level is exactly 0.
   ========================================================================== */

const LAYOUT = {
  lake: {
    cx: -20, halfLength: 1060,
    baseWidth: 205,
    camp: { x: -548, z: 221, r: 58, level: 2.32 },
    start: { x: -218, z: 585 }
  },
  mounds: [
    { x: -350, z: 345, h: 16.2, rx: 62, rz: 58, rot: 0.32 },
    { x: -150, z: 350, h: 11.4, rx: 46, rz: 42, rot: -0.22 },
    { x: 248, z: 444, h: 20.0, rx: 96, rz: 88, rot: 0.58 },
    { x: 566, z: 352, h: 8.8, rx: 47, rz: 43, rot: -0.47 },
    { x: -770, z: 338, h: 12.6, rx: 66, rz: 61, rot: 0.12 },
    { x: -250, z: -360, h: 7.6, rx: 53, rz: 48, rot: 1.05 },
    { x: 548, z: -408, h: 10.2, rx: 62, rz: 57, rot: -0.35 },
    { x: -924, z: -205, h: 6.8, rx: 46, rz: 42, rot: 0.75 }
  ],
  /* separate grazed clearings, each with its own horse */
  patches: [
    { x: -676, z: 332, r: 25, level: 0 },
    { x: -22, z: 292, r: 24, level: 0 }
  ],
  track: [
    [-2580, 742], [-2150, 690], [-1700, 626], [-1310, 556], [-1020, 486],
    [-840, 418], [-700, 350], [-634, 296], [-590, 262], [-540, 250],
    [-470, 250], [-404, 265], [-346, 291], [-298, 322], [-266, 362],
    [-250, 410], [-243, 462], [-232, 520], [-214, 578], [-178, 632],
    [-118, 686], [-26, 736], [98, 778], [252, 818], [448, 852],
    [704, 880], [1010, 898], [1380, 900], [1780, 884], [2230, 850], [2620, 800]
  ]
};

const TRACK = { curve: null, pts: [], width: 4.8 };
const TERRAIN = { mesh: null, grid: null, bedTex: null };

/* ----------------------------------------------------------- lake outline */
function lakeCenterZ(x) {
  return 10 + 40 * Math.sin(x * 0.0009 + 0.3) + 14 * Math.sin(x * 0.0027 - 1.1);
}
function lakeHalfWidth(x) {
  const t = clamp(x / LAYOUT.lake.halfLength, -1.02, 1.02);
  const end = Math.sqrt(Math.max(0, 1 - t * t));
  const base = LAYOUT.lake.baseWidth + 18 * Math.sin(x * 0.0041 + 0.7) + 9 * Math.sin(x * 0.0103 - 2.2);
  return Math.max(2, base * end);
}
function lakeQ(x, z) {
  const w = lakeHalfWidth(x);
  const dz = z - lakeCenterZ(x);
  let q = Math.abs(dz) / Math.max(2, w);
  const wob = 1 + (fbm2(x * 0.0068 + 12.1, z * 0.0068 - 4.3, 3) - 0.5) * 0.24
    + (fbm2(x * 0.024 + 3.7, z * 0.024, 2) - 0.5) * 0.07;
  return q * wob;
}
function lakeBedProfile(q) {
  return -1.96
    + 1.38 * smoothstep(0.34, 0.90, q)
    + 0.68 * smoothstep(0.88, 1.03, q)
    + 0.52 * smoothstep(1.01, 1.19, q);
}

/* --------------------------------------------------------- the broad land */
function escarpmentHeight(x, z) {
  const d = -z;
  const wobble = 82 * Math.sin(x * 0.00105 + 0.4) + 46 * Math.sin(x * 0.0029 + 1.9) + 22 * Math.sin(x * 0.0071 - 0.7);
  const face = smoothstep(1250, 1480, d + wobble * 0.6);
  const plateau = smoothstep(1450, 2350, d + wobble * 0.4);
  const gully = ridged2(x * 0.0017 + 7.3, 0.0, 3);
  let e = face * 168 + plateau * 36;
  e -= face * (1 - plateau) * gully * 38;
  e += smoothstep(1000, 1250, d + wobble) * (1 - face) * 8;
  return e;
}
function rawTerrain(x, z) {
  let h = 4.15 + 0.0042 * (z + 160);
  h += (fbm2(x * 0.00062 + 3.1, z * 0.00062 - 1.7, 4) - 0.5) * 10.8;
  h += (fbm2(x * 0.0027 + 8.2, z * 0.0027 + 4.4, 3) - 0.5) * 2.1;
  h += (ridged2(x * 0.00085 + 11.0, z * 0.00125 - 2.0, 4) - 0.42) * 10.5 * smoothstep(900, 3000, Math.abs(z) + Math.abs(x) * 0.2);
  h += 34 * smoothstep(1500, 4600, z) * (0.62 + 0.38 * fbm2(x * 0.0006 + 21, z * 0.0006, 3));
  h += 26 * smoothstep(2500, 7200, Math.abs(x)) * (0.55 + 0.45 * fbm2(x * 0.0004, z * 0.0004 + 31, 3));
  h += escarpmentHeight(x, z);
  h += (fbm2(x * 0.00035 + 5.5, z * 0.00035 - 8.1, 4) - 0.5) * 22 * smoothstep(1800, 3600, -z);
  return h;
}

/* ------------------------------------------------------------- the mounds */
function moundField(x, z) {
  let h = 0;
  for (let i = 0; i < LAYOUT.mounds.length; i++) {
    const m = LAYOUT.mounds[i];
    const ca = Math.cos(m.rot), sa = Math.sin(m.rot);
    const dx = x - m.x, dz = z - m.z;
    const lx = dx * ca + dz * sa;
    const lz = -dx * sa + dz * ca;
    const r = Math.hypot(lx / m.rx, lz / m.rz);
    if (r < 1.85) {
      const dome = Math.pow(1 - smoothstep(0.0, 1.0, r), 1.22);
      const rough = 0.965 + 0.07 * fbm2(x * 0.02 + i * 9.3, z * 0.02 - i * 4.1, 2);
      h += m.h * dome * rough;
      h -= m.h * 0.072 * Math.exp(-Math.pow((r - 1.075) / 0.075, 2));
    }
  }
  return h;
}

/* ground-flattening patches: camp terrace, horse clearings */
function flattenPatches(x, z, h) {
  const c = LAYOUT.lake.camp;
  const dc = Math.hypot(x - c.x, z - c.z);
  if (dc < c.r + 30) {
    const t = smoothstep(c.r + 30, c.r - 4, dc) * smoothstep(0.99, 1.08, lakeQ(x, z));
    h = lerp(h, c.level, t);
  }
  for (const p of LAYOUT.patches) {
    const d = Math.hypot(x - p.x, z - p.z);
    if (d < p.r + 16) {
      const t = smoothstep(p.r + 16, p.r - 2, d) * 0.92;
      h = lerp(h, p.level, t);
    }
  }
  return h;
}

function landBankProfile(q) {
  if (q <= 0.985) return -0.02;
  if (q < 1.12) return 0.60 * Math.pow((q - 0.985) / 0.135, 1.18);
  return 0.60 + Math.min(3.6, (q - 1.12) * 1.9);
}
function heightAt(x, z) {
  let base = rawTerrain(x, z);
  const q = lakeQ(x, z);
  let wet = 0;
  if (q < 1.25) {
    const bed = lakeBedProfile(q);
    const t = smoothstep(0.97, 1.18, q);
    base = lerp(bed, base, t);
    wet = 1 - smoothstep(0.98, 1.06, q);
    base += (fbm2(x * 0.052 + 1.3, z * 0.052 - 7.2, 2) - 0.5) * 0.075 * wet;
  }
  /* the hard mud shelf and the low steppe bank: dry land is never below
     the lake, so the one surface can only ever be seen inside its basin */
  if (q > 0.985) {
    const bank = landBankProfile(q) + (fbm2(x * 0.045 + 4.1, z * 0.045 - 9.3, 2) - 0.5) * 0.10 * smoothstep(1.0, 1.07, q);
    const floor = 1.25 * smoothstep(1.09, 1.35, q) + 1.15 * smoothstep(1.10, 2.4, q) + 0.65 * (0.5 + 0.5 * fbm2(x * 0.016 + 2.2, z * 0.016, 2));
    base = Math.max(base, bank, floor);
  }
  base += moundField(x, z) * smoothstep(1.04, 1.30, q);
  base = flattenPatches(x, z, base);
  /* the old track is compacted a hand's depth into the turf */
  if (TRACK.bin) {
    const td = trackDistance(x, z);
    if (td < 4.5) base -= 0.22 * smoothstep(4.5, 1.2, td);
  }
  return base;
}

/* lazy horse-patch levels, once the raw land is known */
(function initPatchLevels() {
  for (const p of LAYOUT.patches) p.level = Math.max(1.4, rawTerrain(p.x, p.z) + 0.25);
})();

/* ------------------------------------------------ analytic morning shadow */
const SUN_XZ = new THREE.Vector2(WORLD.sunDir.x, WORLD.sunDir.z).normalize();
const SUN_SHADOW_DIR = new THREE.Vector2(-SUN_XZ.x, -SUN_XZ.y).normalize();
const SUN_TAN_EL = WORLD.sunDir.y / Math.hypot(WORLD.sunDir.x, WORLD.sunDir.z);
function moundShadowAt(x, z) {
  let shade = 0;
  for (let i = 0; i < LAYOUT.mounds.length; i++) {
    const m = LAYOUT.mounds[i];
    const dx = x - m.x, dz = z - m.z;
    const proj = dx * SUN_SHADOW_DIR.x + dz * SUN_SHADOW_DIR.y;
    if (proj <= 0) continue;
    const lat = Math.abs(dx * -SUN_SHADOW_DIR.y + dz * SUN_SHADOW_DIR.x);
    const L = m.rx * 0.9 + m.h / Math.max(0.05, SUN_TAN_EL);
    if (proj > L * 1.2) continue;
    const t = clamp(proj / L, 0, 1);
    const width = m.rz * 0.82 * (1 - t * 0.72) + m.rz * 0.22;
    if (lat < width) {
      const edge = smoothstep(width, width * 0.55, lat);
      const along = smoothstep(L * 1.2, L * 0.20, proj);
      shade = Math.max(shade, edge * along * 0.86);
    }
  }
  return shade;
}
function sunShadeAt(x, z) {
  return 1 - moundShadowAt(x, z);
}

/* --------------------------------------------------------- normal and uv */
function sampleHeight(x, z) { return heightAt(x, z); }
function sampleNormal(x, z, eps = 2.0) {
  const hl = heightAt(x - eps, z), hr = heightAt(x + eps, z);
  const hd = heightAt(x, z - eps), hu = heightAt(x, z + eps);
  return new THREE.Vector3(hl - hr, 2 * eps, hd - hu).normalize();
}

/* ------------------------------------------------------------ terrain mesh */
function seqAxis(a, b, step) {
  const arr = [];
  const n = Math.max(1, Math.round((b - a) / step));
  for (let i = 0; i <= n; i++) arr.push(a + i * (b - a) / n);
  return arr;
}
function outerAxis(near, far, count) {
  const arr = [];
  for (let i = 1; i <= count; i++) {
    const t = i / count;
    arr.push(near + (far - near) * Math.pow(t, 2.7));
  }
  return arr;
}
function axisZones(zones, outer, outerCount) {
  const arr = [];
  arr.push(...outerAxis(zones[0][0], -outer, outerCount).reverse());
  for (let z = 0; z < zones.length; z++) {
    const [a, b, step] = zones[z];
    const seq = seqAxis(a, b, step);
    if (z > 0) seq.shift();
    arr.push(...seq);
  }
  const lastEnd = zones[zones.length - 1][1];
  arr.push(...outerAxis(lastEnd, outer, outerCount));
  return arr;
}

function terrainColor(x, z, h, n, shade, q) {
  const macroA = fbm2(x * 0.0068 + 17.1, z * 0.0068 - 3.4, 3);
  const macroB = fbm2(x * 0.0013 - 8.2, z * 0.0013 + 5.6, 4);
  const dry = clamp(0.38 + macroA * 0.62 + macroB * 0.24, 0, 1);
  const green = clamp(0.60 - macroA * 0.65 + macroB * 0.18, 0, 1);
  const slope = 1 - Math.abs(n.y);
  const rock = smoothstep(0.14, 0.36, slope) * 0.92;

  let r = lerp(0.120, 0.330, dry);
  let g = lerp(0.195, 0.315, dry);
  let b = lerp(0.058, 0.115, dry);
  r = lerp(r, 0.072, green * 0.45); g = lerp(g, 0.145, green * 0.38); b = lerp(b, 0.048, green * 0.28);

  /* scale grit on the scarp */
  if (rock > 0.01) {
    const band = 0.5 + 0.5 * fbm2(x * 0.03, z * 0.03, 2);
    const rr = 0.255 + band * 0.030;
    r = lerp(r, rr * 1.04, rock); g = lerp(g, rr, rock); b = lerp(b, rr * 0.94, rock);
  }
  /* hard mud and pale salt crust at the shore */
  if (h < 1.45 && q < 1.5) {
    const wetness = smoothstep(0.55, -0.2, h);
    const m = smoothstep(1.5, 0.9, q);
    const mr2 = lerp(0.165, 0.340, smoothstep(0.3, 1.2, h));
    const mg2 = lerp(0.145, 0.300, smoothstep(0.3, 1.2, h));
    const mb2 = lerp(0.100, 0.210, smoothstep(0.3, 1.2, h));
    r = lerp(r, mr2 * (1 - wetness * 0.24), m);
    g = lerp(g, mg2 * (1 - wetness * 0.22), m);
    b = lerp(b, mb2 * (1 - wetness * 0.20), m);
  }
  /* bleached mound crowns and old turf on their flanks */
  if (q > 1.28) {
    const mh = moundField(x, z);
    if (mh > 0.5) {
      const crown = smoothstep(0.5, 7.0, mh);
      r = lerp(r, 0.395, crown * 0.42); g = lerp(g, 0.360, crown * 0.40); b = lerp(b, 0.225, crown * 0.30);
    }
  }
  /* the track's pale dust spills a little into the turf */
  if (TRACK.curve) {
    const d = trackDistance(x, z);
    if (d < 7.5) {
      const t = smoothstep(7.5, 2.2, d) * 0.60;
      r = lerp(r, 0.430, t); g = lerp(g, 0.365, t); b = lerp(b, 0.235, t);
    }
  }
  const s = 0.48 + 0.52 * shade;
  return [r * s, g * s, b * s];
}

function buildTerrainMesh() {
  const xs = axisZones([[-1600, 1600, PROBE_LOW ? 8 : 6]], PROBE_LOW ? 20000 : 26000, PROBE_LOW ? 16 : 22);
  const zA = axisZones([[-2050, -1500, PROBE_LOW ? 6 : 5], [-1500, -1000, PROBE_LOW ? 3 : 3], [-1000, -620, PROBE_LOW ? 10 : 8], [-620, 620, PROBE_LOW ? 4 : 3.5], [620, 1320, PROBE_LOW ? 14 : 10]], PROBE_LOW ? 20000 : 26000, PROBE_LOW ? 16 : 22);

  const cols = xs.length, rows = zA.length;
  const count = cols * rows;
  const pos = new Float32Array(count * 3);
  const uv = new Float32Array(count * 2);
  const wet = new Float32Array(count);
  const rock = new Float32Array(count);
  const col = new Float32Array(count * 3);
  const hs = new Float32Array(count);

  for (let j = 0; j < rows; j++) {
    const z = zA[j];
    for (let i = 0; i < cols; i++) {
      const x = xs[i];
      const k = j * cols + i;
      const h = heightAt(x, z);
      hs[k] = h;
      pos[k * 3] = x;
      pos[k * 3 + 1] = h;
      pos[k * 3 + 2] = z;
      uv[k * 2] = x / 6.0;
      uv[k * 2 + 1] = z / 6.0;
    }
  }
  const idx = [];
  for (let j = 0; j < rows - 1; j++) {
    for (let i = 0; i < cols - 1; i++) {
      const a = j * cols + i, b = a + 1, c = a + cols, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  /* soften the facets on the great scarp: a two-pass normal blur keeps the
     low morning light from breaking the long face into horizontal steps */
  for (let pass = 0; pass < 2; pass++) {
    const src = g.attributes.normal.array;
    const dst = new Float32Array(src.length);
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const o = (j * cols + i) * 3;
        let nx = src[o] * 2, ny = src[o + 1] * 2, nz = src[o + 2] * 2;
        if (i > 0) { nx += src[o - 3]; ny += src[o - 2]; nz += src[o - 1]; }
        if (i < cols - 1) { nx += src[o + 3]; ny += src[o + 4]; nz += src[o + 5]; }
        if (j > 0) { const q = o - cols * 3; nx += src[q]; ny += src[q + 1]; nz += src[q + 2]; }
        if (j < rows - 1) { const q = o + cols * 3; nx += src[q]; ny += src[q + 1]; nz += src[q + 2]; }
        const l = Math.hypot(nx, ny, nz) || 1;
        dst[o] = nx / l; dst[o + 1] = ny / l; dst[o + 2] = nz / l;
      }
    }
    g.attributes.normal.array.set(dst);
  }
  g.attributes.normal.needsUpdate = true;
  const nrm = g.attributes.normal.array;

  const cA = new THREE.Color();
  const cB = new THREE.Color();
  for (let j = 0; j < rows; j++) {
    const z = zA[j];
    for (let i = 0; i < cols; i++) {
      const x = xs[i];
      const k = j * cols + i;
      const h = hs[k];
      const n = new THREE.Vector3(nrm[k * 3], nrm[k * 3 + 1], nrm[k * 3 + 2]);
      const q = lakeQ(x, z);
      const shade = sunShadeAt(x, z);
      const rgb = terrainColor(x, z, h, n, shade, q);
      col[k * 3] = rgb[0]; col[k * 3 + 1] = rgb[1]; col[k * 3 + 2] = rgb[2];
      wet[k] = clamp(1 - smoothstep(-0.1, 1.05, h), 0, 1);
      rock[k] = clamp(smoothstep(0.13, 0.34, 1 - Math.abs(n.y)) + (h > 30 ? 0.20 : 0), 0, 1);
    }
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aWet', new THREE.BufferAttribute(wet, 1));
  g.setAttribute('aRock', new THREE.BufferAttribute(rock, 1));
  g.computeBoundingSphere();
  const mesh = new THREE.Mesh(g, MAT.ground);
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  mesh.layers.set(0);
  mesh.frustumCulled = false;
  SCENE.add(mesh);
  TERRAIN.mesh = mesh;
  TERRAIN.grid = { xs, zs: zA, cols, rows };
  return mesh;
}

/* ---------------------------------------------------------- track pathing */
function trackDistance(x, z) {
  if (!TRACK.curve) return 1e9;
  const B = TRACK.bin;
  let best = 1e9;
  const ix = Math.floor((x - B.x0) / B.size), iz = Math.floor((z - B.z0) / B.size);
  for (let dj = -1; dj <= 1; dj++) {
    for (let di = -1; di <= 1; di++) {
      const cell = B.cells.get((ix + di) * 10007 + (iz + dj));
      if (!cell) continue;
      for (let i = 0; i < cell.length; i++) {
        const p = cell[i];
        const dx = x - p.x, dz = z - p.z;
        const d = dx * dx + dz * dz;
        if (d < best) best = d;
      }
    }
  }
  if (best > 1e17) return 1e9;
  return Math.sqrt(best);
}

function buildTrackPath() {
  const v = LAYOUT.track.map(p => new THREE.Vector3(p[0], 0, p[1]));
  const c = new THREE.CatmullRomCurve3(v, false, 'centripetal', 0.5);
  c.arcLengthDivisions = 4000;
  c.updateArcLengths();
  TRACK.curve = c;
  const L = c.getLength();
  const n = Math.ceil(L / 5);
  TRACK.pts = [];
  for (let i = 0; i <= n; i++) {
    const p = c.getPoint(i / n);
    TRACK.pts.push({ x: p.x, z: p.z, t: i / n });
  }
  /* spatial bins so turf colouring is not a polyline scan per vertex */
  const B = { x0: -2800, z0: 150, size: 60, cells: new Map() };
  for (const p of TRACK.pts) {
    const ix = Math.floor((p.x - B.x0) / B.size), iz = Math.floor((p.z - B.z0) / B.size);
    const key = ix * 10007 + iz;
    if (!B.cells.has(key)) B.cells.set(key, []);
    B.cells.get(key).push(p);
  }
  TRACK.bin = B;
}

function buildTrackMesh() {
  const L = TRACK.curve.getLength();
  const n = Math.ceil(L / 4.5);
  const halfW = TRACK.width * 0.5;
  const pos = [], uvs = [], cols = [], idx = [];
  const cTmp = new THREE.Color();
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const p = TRACK.curve.getPointAt(u);
    const tan = TRACK.curve.getTangentAt(u);
    const nx = -tan.z, nz = tan.x;
    const run = u * L;
    const wob = 1 + 0.12 * Math.sin(u * 380) + 0.07 * Math.sin(u * 91 + 1.2);
    for (let s = -1; s <= 1; s += 2) {
      const w = halfW * wob * (s < 0 ? 1.0 : 0.94);
      const x = p.x + nx * w * s;
      const z = p.z + nz * w * s;
      const h = heightAt(x, z) + 0.12;
      pos.push(x, h, z);
      uvs.push(s * 0.5 + 0.5, run / 16);
      const shade = sunShadeAt(x, z);
      cTmp.setRGB(0.56 + 0.16 * shade, 0.44 + 0.13 * shade, 0.265 + 0.09 * shade);
      cols.push(cTmp.r, cTmp.g, cTmp.b);
    }
    if (i < n) {
      const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
      idx.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, MAT.track);
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  mesh.layers.set(0);
  SCENE.add(mesh);
  return mesh;
}

/* ------------------------------------------------------------ rock garden */
function makeRockGeo(seed, detail = 1) {
  const g = new THREE.IcosahedronGeometry(1, detail);
  const r = mulberry32(seed);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.set(p.getX(i), p.getY(i), p.getZ(i));
    const n = 0.78 + 0.34 * fbm2(v.x * 1.7 + seed * 0.01, v.z * 1.7 + v.y * 0.9, 3);
    v.multiplyScalar(n);
    v.y *= 0.72;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

const ROCK_GEOS = [];
function buildRocks() {
  for (let i = 0; i < 3; i++) ROCK_GEOS.push(makeRockGeo(SEED ^ (0x7000 + i * 91), i === 0 ? 2 : 1));
  const r = mulberry32(SEED ^ 0x80cc);
  const groups = [[], [], []];
  const big = [];
  let tries = 0;
  while (big.length < 140 && tries < 4000) {
    tries++;
    const x = -1400 + r() * 2800;
    const z = -1200 + r() * 2000;
    const q = lakeQ(x, z);
    const h = heightAt(x, z);
    if (h < 1.0 || q < 1.2) continue;
    if (r() < 0.5 && Math.abs(x + 200) > 700) continue;
    const s = 0.35 + Math.pow(r(), 2.2) * 2.8;
    const e = { x, y: h - s * 0.24, z, ry: r() * TAU, rx: (r() - 0.5) * 0.35, rz: (r() - 0.5) * 0.35, s, sx: 0.85 + r() * 0.4, sy: 0.7 + r() * 0.5, sz: 0.8 + r() * 0.5 };
    groups[Math.floor(r() * 3)].push(e);
    if (s > 1.2) {
      addSphere(x, h + s * 0.35, z, s * 0.8);
      big.push(e);
    }
  }
  for (let gi = 0; gi < 3; gi++) {
    const im = instancedFrom(ROCK_GEOS[gi], MAT.rock, groups[gi], { cast: true, receive: true });
    im.layers.set(1);
    im.castShadow = true;
    SCENE.add(im);
  }

  /* stone rings around the kurgans */
  const ringGroups = [[], [], []];
  for (const m of LAYOUT.mounds) {
    const n = Math.round(m.rx * 0.55);
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + (r() - 0.5) * 0.08;
      const rad = 0.88 + (r() - 0.5) * 0.07;
      const x = m.x + Math.cos(a) * m.rx * rad;
      const z = m.z + Math.sin(a) * m.rz * rad;
      const h = heightAt(x, z);
      const s = 0.30 + r() * 0.62;
      ringGroups[i % 3].push({
        x, y: h - s * 0.3, z, ry: r() * TAU, rx: (r() - 0.5) * 0.4,
        s, sx: 1 + r() * 0.5, sy: 0.7 + r() * 0.4, sz: 1 + r() * 0.5
      });
    }
  }
  for (let gi = 0; gi < 3; gi++) {
    const im = instancedFrom(ROCK_GEOS[gi], MAT.rock, ringGroups[gi], { cast: true, receive: true });
    im.layers.set(1);
    SCENE.add(im);
  }

  /* lone standing stones and one small stone enclosure on the nearest mound */
  buildBalbals(r);
}

function buildBalbals(r) {
  const items = [
    { x: -338, z: 366, h: 2.5, w: 0.52, lean: 0.06, face: 0.22 },
    { x: -318, z: 352, h: 2.1, w: 0.46, lean: -0.09, face: 0.27 },
    { x: -296, z: 340, h: 1.65, w: 0.4, lean: 0.04, face: 0.3 },
    { x: -278, z: 328, h: 1.2, w: 0.36, lean: 0.1, face: 0.18 },
    { x: -566, z: 300, h: 1.9, w: 0.42, lean: -0.05, face: 0.2 },
    { x: 288, z: 360, h: 2.3, w: 0.5, lean: 0.08, face: 0.16 }
  ];
  const batch = new GeoBatch();
  for (const it of items) {
    const y = heightAt(it.x, it.z);
    const g = new THREE.CylinderGeometry(it.w * 0.38, it.w * 0.5, it.h, 6, 3);
    g.translate(0, it.h * 0.5, 0);
    /* a rough shoulder and a weathered face plane */
    const m = matrixTRS(it.x, y - 0.12, it.z, 0, it.face, it.lean);
    batch.add(g, m);
    const head = new THREE.BoxGeometry(it.w * 0.62, it.h * 0.24, it.w * 0.42);
    batch.add(head, matrixTRS(it.x + Math.sin(it.face) * 0.02, y + it.h * 0.98, it.z, 0, it.face, it.lean));
    addCapsule(it.x, y, it.z, it.x, y + it.h, it.z, it.w * 0.55);
  }
  const mesh = batch.build(MAT.stele, { cast: true, receive: true });
  mesh.layers.set(0);
  SCENE.add(mesh);

  /* a low stone enclosure on the crown of the second kurgan */
  const m2 = LAYOUT.mounds[1];
  const g = heightAt(m2.x + 34, m2.z - 18);
  const wallBatch = new GeoBatch();
  const W = 7.4, D = 5.6, hgt = 0.78;
  const place = (x, z, w, d, ry) => {
    const yy = heightAt(x, z);
    wallBatch.box(w, hgt, d, x, yy + hgt * 0.5, z, 0, ry, 0);
    addBox(x, yy + hgt * 0.5, z, w * 0.5, hgt * 0.5, d * 0.5, ry);
  };
  place(m2.x + 34, m2.z - 18 - D / 2, W, 0.62, 0);
  place(m2.x + 34, m2.z - 18 + D / 2, W, 0.62, 0);
  place(m2.x + 34 - W / 2, m2.z - 18, 0.62, D, 0);
  place(m2.x + 34 + W / 2, m2.z - 18, 0.62, D, 0);
  const wall = wallBatch.build(MAT.stele, { cast: true, receive: true });
  wall.layers.set(0);
  SCENE.add(wall);
}

/* ------------------------------------------------------- water bed texture */
function buildBedTexture() {
  const W = 768, H = 384;
  const x0 = -1560, x1 = 1560, z0 = -560, z1 = 560;
  const data = new Uint8Array(W * H * 4);
  for (let j = 0; j < H; j++) {
    const z = z0 + (j + 0.5) / H * (z1 - z0);
    for (let i = 0; i < W; i++) {
      const x = x0 + (i + 0.5) / W * (x1 - x0);
      const h = heightAt(x, z);
      const q = lakeQ(x, z);
      const k = (j * W + i) * 4;
      data[k] = Math.round(clamp((h + 3.0) / 6.0, 0, 1) * 255);
      data[k + 1] = Math.round(clamp(1 - (-h) / 2.0, 0, 1) * 255);
      data[k + 2] = Math.round(clamp(1 - q, 0, 1) * 255);
      data[k + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat);
  tex.needsUpdate = true;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.colorSpace = THREE.NoColorSpace;
  TERRAIN.bedTex = tex;
  TERRAIN.bedBox = new THREE.Vector4(x0, z0, x1 - x0, z1 - z0);
  return tex;
}

/* ---------------------------------------------------------- shore detail */
function buildShoreRibbon() {
  const rows = 7;
  const pos = [], uv = [], col = [], idx = [];
  let base = 0;
  const c = new THREE.Color();
  for (const side of [1, -1]) {
    const xs = [];
    for (let x = -1040; x <= 1040; x += 4) xs.push(x);
    for (let i = 0; i < xs.length; i++) {
      const x = xs[i];
      const cz = lakeCenterZ(x), hw = lakeHalfWidth(x);
      let lo = cz + side * hw * 0.72;
      let hi = cz + side * hw * 1.45;
      if (heightAt(x, lo) > 0) lo = cz + side * hw * 0.4;
      if (heightAt(x, hi) < 0) hi = cz + side * hw * 1.8;
      for (let it = 0; it < 18; it++) {
        const mid = (lo + hi) * 0.5;
        if (heightAt(x, mid) > 0) hi = mid; else lo = mid;
      }
      const z0 = (lo + hi) * 0.5;
      for (let r = 0; r < rows; r++) {
        const t = r / (rows - 1);
        const z = z0 + side * (-3.2 + t * 9.2);
        const y = heightAt(x, z) + 0.025;
        pos.push(x, y, z);
        uv.push(x / 6, z / 6);
        const wet = smoothstep(0.45, -0.10, y);
        const pale = smoothstep(0.1, 0.65, y);
        const n = fbm2(x * 0.05 + 3.2, z * 0.05 - 1.7, 2);
        let R = lerp(0.12, 0.235, pale) * (0.88 + n * 0.24);
        let G = lerp(0.105, 0.205, pale) * (0.88 + n * 0.24);
        let B = lerp(0.075, 0.14, pale) * (0.88 + n * 0.24);
        R *= 1 - wet * 0.42; G *= 1 - wet * 0.40; B *= 1 - wet * 0.34;
        const shade = sunShadeAt(x, z);
        const s = 0.5 + 0.5 * shade;
        c.setRGB(R * s, G * s, B * s);
        col.push(c.r, c.g, c.b);
      }
      if (i < xs.length - 1) {
        for (let r = 0; r < rows - 1; r++) {
          const a = base + i * rows + r, b = a + 1, cc = a + rows, d = cc + 1;
          idx.push(a, cc, b, b, cc, d);
        }
      }
    }
    base += xs.length * rows;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, MAT.shore);
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  mesh.layers.set(0);
  mesh.frustumCulled = false;
  SCENE.add(mesh);
  return mesh;
}

/* ------------------------------------------------------------------ build */
function buildTerrain() {
  buildTrackPath();
  const mesh = buildTerrainMesh();
  buildTrackMesh();
  buildShoreRibbon();
  buildRocks();
  buildBedTexture();
  updateSunShadow();
}


/* ======================= 04-water.js ======================= */
/* ==========================================================================
   04 — exactly one water object for the whole scene.
        One BufferGeometry, indexed, shared vertices, fixed at the origin.
        Waves are a bounded displacement in its vertex shader; foam, wind
        lines, shore lace and the swans' wakes are painted in its fragment
        shader. Nothing else in the scene is water.
   ========================================================================== */

const WATER = {
  mesh: null,
  geometry: null,
  material: null,
  uniforms: null,
  refl: {
    rt: null, cam: null, texMatrix: new THREE.Matrix4(), width: 512, height: 512
  },
  wakeCanvas: null,
  wakeTex: null,
  wakeCtx: null,
  wakeLastT: -1,
  level: 0.0
};

const WATER_U = {
  uTime: { value: 0 },
  uPhase: ENV_U.uPhase,
  uSunDir: ENV_U.uSunDir,
  uWindDir: { value: WORLD.windDir.clone() },
  uBedTex: { value: null },
  uBedBox: { value: new THREE.Vector4(-1560, -560, 3120, 1120) },
  uReflTex: { value: null },
  uReflMat: { value: new THREE.Matrix4() },
  uWindTex: { value: null },
  uRippleNormal: { value: null },
  uWakeTex: { value: null },
  uFogColor: { value: new THREE.Color(WORLD.fogColor) },
  uFogDensity: { value: WORLD.fogDensity },
  uReflStrength: { value: 0.55 }
};

const REFL_BIAS = new THREE.Matrix4().set(
  0.5, 0.0, 0.0, 0.5,
  0.0, 0.5, 0.0, 0.5,
  0.0, 0.0, 0.5, 0.5,
  0.0, 0.0, 0.0, 1.0
);

/* ------------------------------------------------------------- reflection */
function makeReflectionTarget() {
  const w = Math.max(400, Math.min(1536, Math.round(RENDERER.domElement.width * 0.62)));
  const h = Math.max(300, Math.min(900, Math.round(RENDERER.domElement.height * 0.62)));
  const rt = new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    type: THREE.UnsignedByteType,
    depthBuffer: true,
    stencilBuffer: false,
    generateMipmaps: false,
    samples: 0
  });
  rt.texture.colorSpace = THREE.NoColorSpace;
  rt.texture.wrapS = rt.texture.wrapT = THREE.ClampToEdgeWrapping;
  WATER.refl.width = w;
  WATER.refl.height = h;
  return rt;
}

const _mirrorPos = new THREE.Vector3();
const _mirrorTarget = new THREE.Vector3();
const _mirrorUp = new THREE.Vector3();
const _reflPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function updateReflectionCamera() {
  if (!WATER.refl.cam || !CAMERA) return false;
  const cam = CAMERA;
  const level = WATER.level;
  if (cam.position.y <= level + 0.02) return false;
  const sys = WATER.refl;
  _mirrorPos.set(cam.position.x, 2 * level - cam.position.y, cam.position.z);
  const fwd = new THREE.Vector3();
  cam.getWorldDirection(fwd);
  _mirrorTarget.set(cam.position.x + fwd.x * 100, 2 * level - (cam.position.y + fwd.y * 100), cam.position.z + fwd.z * 100);
  _mirrorUp.set(0, 1, 0).applyQuaternion(cam.quaternion);
  _mirrorUp.y = -_mirrorUp.y;
  sys.cam.position.copy(_mirrorPos);
  sys.cam.up.copy(_mirrorUp);
  sys.cam.lookAt(_mirrorTarget);
  sys.cam.near = cam.near;
  sys.cam.far = cam.far;
  sys.cam.fov = cam.fov;
  sys.cam.aspect = cam.aspect;
  sys.cam.updateProjectionMatrix();
  sys.cam.updateMatrixWorld();
  sys.texMatrix.copy(REFL_BIAS)
    .multiply(sys.cam.projectionMatrix)
    .multiply(sys.cam.matrixWorldInverse);
  WATER_U.uReflMat.value.copy(sys.texMatrix);
  return true;
}

function renderReflections() {
  if (!WATER.refl.rt || !WATER.refl.cam) return;
  if (!updateReflectionCamera()) return;
  const prevRT = RENDERER.getRenderTarget();
  const prevClip = RENDERER.clippingPlanes;
  const prevBg = SCENE.background;
  const prevAuto = RENDERER.shadowMap.autoUpdate;
  const prevClear = new THREE.Color();
  const prevAlpha = RENDERER.getClearAlpha();
  RENDERER.getClearColor(prevClear);

  SCENE.background = null;
  RENDERER.setClearColor(0x000000, 0);
  RENDERER.clippingPlanes = [_reflPlane];
  _reflPlane.constant = 0.015;
  RENDERER.shadowMap.autoUpdate = false;
  RENDERER.setRenderTarget(WATER.refl.rt);
  RENDERER.clear(true, true, false);
  RENDERER.render(SCENE, WATER.refl.cam);
  RENDERER.setRenderTarget(prevRT);
  RENDERER.clippingPlanes = prevClip || [];
  RENDERER.setClearColor(prevClear, prevAlpha);
  SCENE.background = prevBg;
  RENDERER.shadowMap.autoUpdate = prevAuto;
}

/* --------------------------------------------------------------- shader */
const WATER_VERT = /* glsl */`
  uniform float uTime;
  uniform float uPhase;
  uniform vec2 uWindDir;
  varying vec3 vWorld;
  varying vec2 vGrad;
  varying float vDisp;
  varying float vAmp;
  #include <common>
  #include <logdepthbuf_pars_vertex>
  const float CR_TAU = 6.283185307179586;

  void main() {
    vec3 p = position;
    vec2 xz = p.xz;
    float ph = uPhase;

    /* the wind's broad reach: calm at the upwind end, rougher downwind */
    float reach = clamp((xz.x + 1500.0) / 3100.0, 0.0, 1.0);
    float gust = sin(CR_TAU * (ph * 2.0 - (xz.x + 1600.0) / 3200.0));
    float gustMask = smoothstep(-0.35, 0.85, gust);
    float gust2 = 0.5 + 0.5 * sin(CR_TAU * (ph * 3.0 + (xz.x - 800.0) / 2400.0));
    float amp = (0.24 + 0.76 * reach) * (0.52 + 0.48 * gustMask) * (0.72 + 0.28 * gust2);

    /* four travelling components, every period an exact division of 60 s */
    float d1 = dot(uWindDir, xz) * 0.0885 + CR_TAU * (uTime / 10.0) + 0.7;
    float d2 = dot(uWindDir, xz) * 0.1337 - CR_TAU * (uTime / 7.5) + 2.9;
    float d3 = dot(vec2(-uWindDir.y, uWindDir.x), xz) * 0.2166 + CR_TAU * (uTime / 12.0) + 4.1;
    float d4 = dot(normalize(uWindDir + vec2(-0.42, 0.36)), xz) * 0.3300 - CR_TAU * (uTime / 6.0) + 1.3;
    float s1 = sin(d1), s2 = sin(d2), s3 = sin(d3), s4 = sin(d4);
    float sum = s1 * 0.44 + s2 * 0.28 + s3 * 0.18 + s4 * 0.10;
    /* strictly bounded vertical displacement */
    float disp = clamp(sum, -1.0, 1.0) * (0.040 + 0.120 * amp);
    p.y = disp;

    vec2 grad = vec2(0.0);
    grad += uWindDir * (cos(d1) * 0.0885 * 0.44);
    grad += uWindDir * (cos(d2) * 0.1337 * 0.28);
    grad += vec2(-uWindDir.y, uWindDir.x) * (cos(d3) * 0.2166 * 0.18);
    grad += normalize(uWindDir + vec2(-0.42, 0.36)) * (cos(d4) * 0.3300 * 0.10);
    grad *= (0.040 + 0.120 * amp) * 5.5;

    vWorld = (modelMatrix * vec4(p, 1.0)).xyz;
    vGrad = grad;
    vDisp = disp;
    vAmp = amp;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    #include <logdepthbuf_vertex>
  }
`;

const WATER_FRAG = /* glsl */`
  uniform float uTime;
  uniform float uPhase;
  uniform vec3 uSunDir;
  uniform vec2 uWindDir;
  uniform sampler2D uBedTex;
  uniform vec4 uBedBox;
  uniform sampler2D uReflTex;
  uniform mat4 uReflMat;
  uniform sampler2D uWindTex;
  uniform sampler2D uRippleNormal;
  uniform sampler2D uWakeTex;
  uniform vec3 uFogColor;
  uniform float uFogDensity;
  uniform float uReflStrength;
  varying vec3 vWorld;
  varying vec2 vGrad;
  varying float vDisp;
  varying float vAmp;
  ${GLSL_NOISE}
  #include <common>
  #include <logdepthbuf_pars_fragment>

  float bedHeightAt(vec2 p) {
    vec2 uv = (p - uBedBox.xy) / uBedBox.zw;
    if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) return -2.4;
    return texture2D(uBedTex, uv).r * 6.0 - 3.0;
  }

  vec3 skyReflect(vec3 R) {
    float up = clamp(R.y, 0.0, 1.0);
    vec3 zen = vec3(0.06, 0.18, 0.36);
    vec3 mid = vec3(0.25, 0.44, 0.60);
    vec3 hor = vec3(0.66, 0.74, 0.75);
    vec3 c = mix(zen, mid, smoothstep(0.02, 0.5, up));
    c = mix(c, hor, pow(1.0 - up, 2.6));
    float sd = max(dot(R, uSunDir), 0.0);
    c += vec3(0.9, 0.68, 0.42) * pow(sd, 26.0) * 0.22;
    c += vec3(1.6, 1.3, 0.92) * pow(sd, 620.0);
    return c;
  }

  void main() {
    #include <logdepthbuf_fragment>
    vec2 wp = vWorld.xz;
    vec4 bed = texture2D(uBedTex, (wp - uBedBox.xy) / uBedBox.zw);
    float bedH = bedHeightAt(wp);
    float depth = max(0.0, -bedH);
    float ph = uPhase;

    /* four nested ripple scales, plus a capillary shimmer */
    vec2 n1 = texture2D(uRippleNormal, wp / 43.0 + vec2(ph * 4.0, ph * 2.0)).xy * 2.0 - 1.0;
    vec2 n2 = texture2D(uRippleNormal, wp / 17.5 - vec2(ph * 7.0, ph * 3.0)).xy * 2.0 - 1.0;
    vec2 n3 = texture2D(uRippleNormal, wp / 7.0 + vec2(ph * 11.0, -ph * 5.0)).xy * 2.0 - 1.0;
    vec2 n4 = texture2D(uRippleNormal, wp / 3.1 - vec2(ph * 16.0, ph * 9.0)).xy * 2.0 - 1.0;
    vec2 rip = (n1 * 0.50 + n2 * 0.26 + n3 * 0.16 + n4 * 0.08) * (0.13 + 0.34 * vAmp);
    rip += vec2(sin(wp.y * 1.70 + CR_TAU * ph * 24.0), cos(wp.x * 1.90 - CR_TAU * ph * 31.0)) * (0.006 + 0.012 * vAmp);
    float closeW = smoothstep(95.0, 5.0, length(cameraPosition - vWorld));
    vec2 n5 = texture2D(uRippleNormal, wp / 1.45 + vec2(ph * 41.0, -ph * 27.0)).xy * 2.0 - 1.0;
    rip += n5 * 0.050 * closeW * (0.45 + 0.55 * vAmp);
    rip += vec2(sin(wp.x * 3.7 + CR_TAU * ph * 41.0), cos(wp.y * 4.3 - CR_TAU * ph * 33.0)) * 0.013 * closeW;
    vec3 N = normalize(vec3(-vGrad.x - rip.x, 1.0, -vGrad.y - rip.y));

    vec3 V = normalize(cameraPosition - vWorld);
    float cosT = clamp(dot(V, N), 0.0, 1.0);
    float fres = 0.02 + 0.42 * pow(1.0 - cosT, 3.0);

    /* reflection: the rendered world where it exists, the sky elsewhere */
    vec3 R = reflect(-V, N);
    R.y = max(R.y, 0.012);
    vec3 sky = skyReflect(R);
    vec4 rc = uReflMat * vec4(vWorld, 1.0);
    vec2 ruv = rc.xy / max(rc.w, 1e-4);
    ruv += vec2(N.x, N.z) * (0.050 + 0.095 * vAmp);
    ruv = clamp(ruv, vec2(0.002), vec2(0.998));
    vec4 rt = texture2D(uReflTex, ruv);
    vec2 ruv2 = clamp(ruv + vec2(N.z, -N.x) * (0.012 + 0.018 * vAmp), vec2(0.002), vec2(0.998));
    vec3 rt2 = texture2D(uReflTex, ruv2).rgb;
    rt.rgb = mix(rt.rgb, rt2, 0.32);
    float reflMask = smoothstep(0.0, 0.55, rt.a);
    vec3 refl = mix(sky, rt.rgb, reflMask * uReflStrength);

    /* sun and sky glints on the wind, at three scales */
    float sd = max(dot(R, uSunDir), 0.0);
    float microGlint = texture2D(uWindTex, wp / 3.4 + vec2(ph * 29.0, -ph * 17.0)).g;
    float spec = pow(sd, 1200.0) * 0.30 + pow(sd, 240.0) * 0.055 + pow(sd, 42.0) * 0.018;
    spec += microGlint * closeW * pow(sd, 90.0) * 0.10;
    float sheen = pow(sd, 30.0) * 0.10;

    /* body colour: the pale bed in the shallows, cold depth beyond */
    vec3 shallow = vec3(0.12, 0.19, 0.155);
    vec3 deep = vec3(0.016, 0.055, 0.075);
    vec3 body = mix(shallow, deep, smoothstep(0.02, 1.55, depth));
    body *= 0.95 + 0.10 * fbm4(wp * 0.12 + vec2(cos(CR_TAU * ph), sin(CR_TAU * ph)) * 0.6);
    float caustic = smoothstep(0.56, 0.86, fbm4(wp * 1.45 + vec2(ph * 9.0, -ph * 7.0)));
    body += vec3(0.040, 0.052, 0.036) * caustic * smoothstep(1.3, 0.05, depth) * (0.5 + 0.5 * vAmp);

    /* the wind line: two bands of streak foam, both exact one-turn loops */
    vec2 wuv1 = vec2(wp.x / 900.0 + ph, wp.y / 240.0);
    vec2 wuv2 = vec2(wp.x / 1400.0 + ph * 2.0, wp.y / 310.0 + 0.5);
    float streak1 = texture2D(uWindTex, wuv1).r;
    float streak2 = texture2D(uWindTex, wuv2).r;
    float gustPatch = texture2D(uWindTex, vec2(wp.x / 700.0 + ph * 2.0, wp.y / 430.0)).b;
    float sparkle = texture2D(uWindTex, wp / 24.0 + vec2(ph * 6.0, -ph * 2.0)).g;
    float windLine = smoothstep(0.45, 0.80, streak1 * (0.55 + 0.55 * vAmp) + streak2 * 0.30);
    windLine *= smoothstep(0.20, 0.85, depth) * (0.35 + 0.65 * vAmp);
    float whitecaps = smoothstep(0.64, 0.92, gustPatch * 0.5 + vDisp * 4.0 + 0.22) * smoothstep(0.30, 0.85, vAmp);

    /* the lace at the mud */
    float shoreLace = smoothstep(0.55, 0.015, depth) * smoothstep(0.10, 0.55, fbm4(wp * 2.8 + vec2(ph * 37.0, -ph * 13.0)) + 0.20);
    shoreLace *= 0.55 + 0.45 * smoothstep(-0.5, 0.8, sin(wp.x * 0.22 + wp.y * 0.17 - CR_TAU * ph * 10.0));
    /* fine foam grain keeps the lace and the wind line from looking like paint */
    float foamGrain = texture2D(uWindTex, wp / 6.5 + vec2(ph * 13.0, -ph * 8.0)).g;
    float foamGrain2 = fbm4(wp * 4.2 + vec2(ph * 21.0, ph * 15.0));

    /* swan wakes, painted into this same surface */
    vec2 wakeUv = (wp - vec2(-1500.0, -700.0)) / vec2(3000.0, 1400.0);
    float wake = 0.0;
    if (wakeUv.x > 0.0 && wakeUv.y > 0.0 && wakeUv.x < 1.0 && wakeUv.y < 1.0) {
      wake = texture2D(uWakeTex, wakeUv).a;
    }
    vec2 swirl = texture2D(uRippleNormal, wp / 9.0 + vec2(wake * 0.4, ph * 2.0)).xy * 2.0 - 1.0;
    N = normalize(N + vec3(swirl.x, 0.0, swirl.y) * wake * 0.20);

    float crest = smoothstep(0.035, 0.13, vDisp) * smoothstep(0.45, 0.95, vAmp) * 0.26;
    float foam = clamp(windLine * 0.30 + whitecaps * 0.24 + shoreLace * 0.58 + wake * 0.86 + crest, 0.0, 1.0);
    foam *= 0.78 + 0.32 * foamGrain + 0.22 * (foamGrain2 - 0.5);
    foam = clamp(foam, 0.0, 1.0);
    vec3 foamCol = vec3(0.88, 0.89, 0.84) * (0.92 + 0.08 * sparkle);

    vec3 col = body + refl * (0.008 + 0.10 * fres) * uReflStrength + vec3(0.12, 0.13, 0.11) * sheen;
    col *= 0.94 + 0.22 * (vDisp / 0.16 + 0.5);
    col += vec3(1.0, 0.93, 0.78) * spec;
    col = mix(col, foamCol, foam * 0.86);

    float alpha = mix(0.82, 0.97, smoothstep(0.0, 0.55, depth));
    alpha = max(alpha, foam * 0.92);
    alpha = max(alpha, smoothstep(0.35, 0.95, fres) * smoothstep(0.0, 0.2, depth) * 0.85);

    float dist = length(cameraPosition - vWorld);
    float fog = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
    col = mix(col, uFogColor, clamp(fog, 0.0, 0.96));
    alpha = mix(alpha, 1.0, fog * 0.85);

    gl_FragColor = vec4(col, clamp(alpha, 0.0, 0.98));
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

/* --------------------------------------------------------------- geometry */
function buildWaterGeometry() {
  const xs = axisZones([[-1600, 1600, PROBE_LOW ? 5 : 4]], 26000, 12);
  const zs = axisZones([[-700, 700, PROBE_LOW ? 5 : 4]], 26000, 12);
  const cols = xs.length, rows = zs.length;
  const count = cols * rows;
  const pos = new Float32Array(count * 3);
  const idx = [];
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const k = j * cols + i;
      pos[k * 3] = xs[i];
      pos[k * 3 + 1] = WATER.level;
      pos[k * 3 + 2] = zs[j];
    }
  }
  for (let j = 0; j < rows - 1; j++) {
    for (let i = 0; i < cols - 1; i++) {
      const a = j * cols + i, b = a + 1, c = a + cols, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeBoundingSphere();
  g.boundingSphere.radius = 1e7; /* the whole basin is one surface */
  return g;
}

function buildWater() {
  const geo = buildWaterGeometry();
  buildWakeTexture();
  const uniforms = {
    ...WATER_U,
    uBedTex: { value: TERRAIN.bedTex },
    uBedBox: { value: TERRAIN.bedBox },
    uWindTex: { value: TEX.wind },
    uRippleNormal: { value: TEX.rippleNormal },
    uReflTex: { value: WATER.refl.rt ? WATER.refl.rt.texture : null },
    uWakeTex: { value: WATER.wakeTex }
  };
  const mat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: WATER_VERT,
    fragmentShader: WATER_FRAG,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    side: THREE.FrontSide,
    fog: false,
    premultipliedAlpha: false
  });
  geo.computeBoundingSphere();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, 0, 0);
  mesh.rotation.set(0, 0, 0);
  mesh.scale.set(1, 1, 1);
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  mesh.updateMatrixWorld(true);
  mesh.renderOrder = 20;
  mesh.frustumCulled = false;
  mesh.layers.set(2);
  mesh.receiveShadow = false;
  mesh.castShadow = false;
  mesh.name = 'CraneLakeSurface';
  SCENE.add(mesh);
  WATER.mesh = mesh;
  WATER.geometry = geo;
  WATER.material = mat;
  WATER.uniforms = uniforms;
  WATER.refl.cam = new THREE.PerspectiveCamera(40, 1.6, WORLD.near, WORLD.far);
  WATER.refl.cam.layers.set(0);
  WATER.refl.cam.up.set(0, 1, 0);
  WATER.refl.rt = makeReflectionTarget();
  uniforms.uReflTex.value = WATER.refl.rt.texture;
  uniforms.uWakeTex.value = WATER.wakeTex;
  updateWater(0);
  return mesh;
}

/* ----------------------------------------------------------- swan wakes */
function buildWakeTexture() {
  const W = 512, H = 256;
  const c = mkCanvas(W, H);
  const x = c2d(c, true);
  x.clearRect(0, 0, W, H);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.NoColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  WATER.wakeCanvas = c;
  WATER.wakeCtx = x;
  WATER.wakeTex = tex;
}

/** The wake history runs modulo the 60 s loop, so the seam is seamless. */
function paintWake(t) {
  if (!WATER.wakeCtx) return;
  const x = WATER.wakeCtx;
  const W = WATER.wakeCanvas.width, H = WATER.wakeCanvas.height;
  x.clearRect(0, 0, W, H);
  if (typeof swanWakePoints !== 'function') return;
  const pts = swanWakePoints(t, 19.0, 0.38);
  x.globalCompositeOperation = 'source-over';
  for (const p of pts) {
    const u = (p.x + 1500) / 3000 * W;
    const v = (p.z + 700) / 1400 * H;
    if (u < -20 || v < -20 || u > W + 20 || v > H + 20) continue;
    const r = (0.9 + p.age * 0.34) / 3000 * W * 3.2 + 2;
    const a = Math.pow(1 - p.age / 19.0, 1.7) * p.strength;
    const g = x.createRadialGradient(u, v, 0, u, v, r);
    g.addColorStop(0, `rgba(255,255,255,${(a * 0.56).toFixed(3)})`);
    g.addColorStop(0.45, `rgba(255,255,255,${(a * 0.22).toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.beginPath();
    x.arc(u, v, r, 0, TAU);
    x.fill();
  }
  WATER.wakeTex.needsUpdate = true;
}

function restartWake() {
  WATER.wakeLastT = -1;
  paintWake(SIM.t);
}

/* ------------------------------------------------------------- per frame */
function updateWater(dt) {
  if (!WATER.material) return;
  WATER_U.uTime.value = SIM.t;
  WATER_U.uPhase.value = SIM.t / LOOP_SECONDS;
  const t = SIM.t;
  if (Math.abs(t - WATER.wakeLastT) > 0.07 || t < WATER.wakeLastT) {
    WATER.wakeLastT = t;
    paintWake(t);
  }
  if (WATER.uniforms) WATER.uniforms.uReflTex.value = WATER.refl.rt ? WATER.refl.rt.texture : null;
}

function resizeWater(w, h) {
  if (!WATER.refl.rt) return;
  const rw = Math.max(400, Math.min(1536, Math.round(w * 0.62)));
  const rh = Math.max(300, Math.min(900, Math.round(h * 0.62)));
  WATER.refl.rt.setSize(rw, rh);
  WATER.refl.width = rw;
  WATER.refl.height = rh;
}


/* ======================= 05-camp.js ======================= */
/* ==========================================================================
   05 — the felt camp: three sewn gers, a canvas tent, a cart, a stone
        fold, a hearth with its smoke, and the two herders who live here.
   ========================================================================== */

const CAMP = {
  group: null,
  flaps: [],
  smoke: [],
  people: [],
  flame: [],
  fireLight: null,
  anchor: new THREE.Vector3(LAYOUT.lake.camp.x, LAYOUT.lake.camp.level, LAYOUT.lake.camp.z)
};

function bentPoleGeo(a, b, bow, radius, seg = 10, radial = 5) {
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const dir = new THREE.Vector3().subVectors(b, a).normalize();
  const side = new THREE.Vector3(-dir.z, 0, dir.x).normalize();
  mid.addScaledVector(side, bow).addScaledVector(dir, 0).y += bow * 0.18;
  const curve = new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone());
  return new THREE.TubeGeometry(curve, seg, radius, radial, false);
}

function makeDoorFlap(width, height, cols = 7, rows = 9) {
  const g = new THREE.PlaneGeometry(width, height, cols, rows);
  g.translate(0, -height * 0.5, 0);
  const mesh = new THREE.Mesh(g, MAT.felt);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.layers.set(0);
  return { mesh, geo: g, base: Float32Array.from(g.attributes.position.array), cols, rows, width, height };
}

function buildGer(cfg) {
  const R = cfg.r;
  const wallH = 1.82 + R * 0.08;
  const topY = wallH + R * 0.42;
  const crownR = R * 0.19;
  const doorHalf = Math.min(0.5, Math.atan(0.78 / R));
  const group = new THREE.Group();
  group.position.set(cfg.x, cfg.y, cfg.z);
  group.rotation.y = cfg.yaw;
  group.layers.set(0);
  CAMP.group.add(group);

  const felt = new GeoBatch();
  const dark = new GeoBatch();
  const wood = new GeoBatch();
  const rope = new GeoBatch();
  const metal = new GeoBatch();

  /* walls: an outer sewn felt cylinder with a real doorway cut out */
  const wall = new THREE.CylinderGeometry(R, R * 1.015, wallH, 48, 1, true, doorHalf, TAU - doorHalf * 2);
  wall.translate(0, wallH * 0.5, 0);
  felt.add(wall);
  const inner = new THREE.CylinderGeometry(R - 0.075, R - 0.065, wallH, 40, 1, true, doorHalf - 0.02, TAU - doorHalf * 2 + 0.04);
  inner.translate(0, wallH * 0.5, 0);
  dark.add(inner);
  /* floor and a dark interior back, so the door reads as a deep opening */
  const floor = new THREE.CylinderGeometry(R - 0.06, R - 0.06, 0.08, 36);
  floor.translate(0, 0.04, 0);
  dark.add(floor);
  const back = new THREE.PlaneGeometry(1.6, 1.5);
  dark.add(back, matrixTRS(0, 0.85, -R * 0.55, 0, 0, 0));
  /* wall top and bottom bands for thickness */
  for (const yy of [0.06, wallH - 0.05]) {
    const band = new THREE.CylinderGeometry(R * 1.012, R * 1.012, 0.11, 48, 1, true, doorHalf, TAU - doorHalf * 2);
    band.translate(0, yy, 0);
    felt.add(band);
  }
  /* doorway edge posts show the wall's thickness */
  for (const s of [-1, 1]) {
    const a = s * doorHalf;
    const px = Math.sin(a) * (R - 0.02), pz = Math.cos(a) * (R - 0.02);
    wood.add(new THREE.BoxGeometry(0.09, wallH + 0.05, 0.16), matrixTRS(px, wallH * 0.5, pz, 0, a, 0));
    addCapsule(cfg.x + Math.sin(cfg.yaw) * pz + Math.cos(cfg.yaw) * px, cfg.y, cfg.z + Math.cos(cfg.yaw) * pz - Math.sin(cfg.yaw) * px,
      cfg.x + Math.sin(cfg.yaw) * pz + Math.cos(cfg.yaw) * px, cfg.y + wallH, cfg.z + Math.cos(cfg.yaw) * pz - Math.sin(cfg.yaw) * px, 0.14);
  }
  /* door frame and painted lintel */
  const doorYaw = 0;
  wood.box(0.12, wallH + 0.22, 0.14, -0.86, wallH * 0.5, R * 0.99, 0, 0, 0);
  wood.box(0.12, wallH + 0.22, 0.14, 0.86, wallH * 0.5, R * 0.99, 0, 0, 0);
  wood.box(1.98, 0.17, 0.18, 0, wallH + 0.10, R * 0.99, 0, 0, 0);
  /* a kilim valance over the door */
  const valance = new THREE.PlaneGeometry(1.72, 0.46, 6, 1);
  valance.translate(0, wallH + 0.02 - 0.23, R * 1.01);
  const valMesh = new THREE.Mesh(valance, MAT.kilim);
  valMesh.castShadow = true;
  group.add(valMesh);

  /* the roof: felt lathe, optionally rolled back to show the rafters */
  const profile = [
    new THREE.Vector2(R * 1.035, wallH + 0.01),
    new THREE.Vector2(R * 1.0, wallH + 0.18),
    new THREE.Vector2(R * 0.88, wallH + 0.34),
    new THREE.Vector2(R * 0.70, wallH + 0.62),
    new THREE.Vector2(R * 0.46, wallH + R * 0.34),
    new THREE.Vector2(crownR + 0.06, topY - 0.05),
    new THREE.Vector2(crownR - 0.01, topY)
  ];
  const phiStart = cfg.openRoof ? 0.42 : 0;
  const phiLen = cfg.openRoof ? TAU - 0.84 : TAU;
  const roof = new THREE.LatheGeometry(profile, cfg.openRoof ? 44 : 56, phiStart, phiLen);
  roof.translate(0, 0, 0);
  felt.add(roof);
  /* a second, thicker rim over the roof edge */
  const rim = new THREE.LatheGeometry([
    new THREE.Vector2(R * 1.055, wallH - 0.02),
    new THREE.Vector2(R * 1.07, wallH + 0.10),
    new THREE.Vector2(R * 1.035, wallH + 0.20)
  ], 56);
  felt.add(rim);

  /* bent rafters, all the way from wall top to the crown */
  const rafters = cfg.openRoof ? 26 : 22;
  for (let i = 0; i < rafters; i++) {
    const a = i / rafters * TAU + 0.11;
    const y0 = wallH + 0.03;
    const a0 = new THREE.Vector3(Math.sin(a) * (R - 0.10), y0, Math.cos(a) * (R - 0.10));
    const a1 = new THREE.Vector3(Math.sin(a + 0.04) * (crownR + 0.06), topY - 0.02, Math.cos(a + 0.04) * (crownR + 0.06));
    wood.add(bentPoleGeo(a0, a1, 0.10 + R * 0.02, 0.032, 8, 4));
  }
  /* crown ring and its little square cap */
  rope.add(new THREE.TorusGeometry(crownR + 0.03, 0.045, 6, 26), matrixTRS(0, topY + 0.01, 0, PI / 2, 0, 0));
  wood.add(new THREE.TorusGeometry(crownR + 0.06, 0.035, 5, 24), matrixTRS(0, topY + 0.07, 0, PI / 2, 0, 0));
  /* roof ropes cross the felt from the crown down to the wall */
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + 0.4;
    const p0 = new THREE.Vector3(Math.sin(a) * (crownR + 0.06), topY + 0.03, Math.cos(a) * (crownR + 0.06));
    const p1 = new THREE.Vector3(Math.sin(a) * (R + 0.07), wallH + 0.06, Math.cos(a) * (R + 0.07));
    wood.add(bentPoleGeo(p0, p1, 0.06, 0.018, 10, 4));
  }
  /* the stitched wall bands */
  for (const hh of [0.46, 0.94, 1.42]) {
    rope.add(new THREE.TorusGeometry(R + 0.015, 0.017, 4, 48, TAU - doorHalf * 2), matrixTRS(0, hh, 0, PI / 2, 0, 0));
  }
  /* stove pipe and lid */
  const pipeX = Math.sin(cfg.yaw + 0.8) * R * 0.45, pipeZ = Math.cos(cfg.yaw + 0.8) * R * 0.45;
  metal.add(new THREE.CylinderGeometry(0.09, 0.10, 0.75, 10), matrixTRS(Math.sin(0.8) * R * 0.44, wallH + R * 0.33, Math.cos(0.8) * R * 0.44, 0, 0, 0));
  metal.add(new THREE.CylinderGeometry(0.15, 0.13, 0.07, 10), matrixTRS(Math.sin(0.8) * R * 0.44, wallH + R * 0.33 + 0.40, Math.cos(0.8) * R * 0.44, 0, 0, 0));

  /* ropes and pegs at the wall base */
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU + 0.15;
    rope.add(new THREE.CylinderGeometry(0.016, 0.016, 1.1, 4), matrixTRS(Math.sin(a) * (R + 0.03), 0.62, Math.cos(a) * (R + 0.03), 0, 0, 0));
  }

  if (cfg.openRoof) {
    /* the rolled-back felt panel resting at the edge of the opening */
    const roll = new THREE.CylinderGeometry(0.16, 0.16, R * 0.95, 10);
    roll.rotateZ(PI / 2);
    felt.add(roll, matrixTRS(R * 0.72, wallH + 0.48, 0, 0, 0.5, 0));
    /* a couple of loose lashings */
    for (const s of [-1, 1]) {
      rope.add(new THREE.CylinderGeometry(0.025, 0.025, 0.6, 5), matrixTRS(R * 0.72 + s * 0.4, wallH + 0.57, 0, 0, 0, PI / 2 + 0.3));
    }
  }

  const meshes = [
    felt.build(MAT.felt, { cast: true, receive: true }),
    dark.build(cfg.interiorMat || MAT.feltDark, { cast: false, receive: true }),
    wood.build(MAT.woodPale, { cast: true, receive: true }),
    rope.build(MAT.rope, { cast: false, receive: true }),
    metal.build(MAT.metal, { cast: true, receive: true })
  ];
  for (const m of meshes) if (m) { m.layers.set(0); group.add(m); }

  /* the door flap, tied open, still breathing in the wind */
  const flap = makeDoorFlap(1.56, 1.62);
  const hinge = new THREE.Group();
  hinge.position.set(0, wallH + 0.06, R * 1.0);
  hinge.rotation.x = -1.06;
  hinge.add(flap.mesh);
  group.add(hinge);
  CAMP.flaps.push({ ...flap, hinge, kind: 'door', amp: 0.075, phase: cfg.x * 0.13 + cfg.z * 0.07 });

  /* the crown flap, tethered by a rope to the roof edge */
  const crown = new THREE.PlaneGeometry(0.78, 0.78, 5, 6);
  crown.translate(0, -0.39, 0);
  const crownMesh = new THREE.Mesh(crown, MAT.feltDark);
  crownMesh.castShadow = true;
  const crownHinge = new THREE.Group();
  crownHinge.position.set(0, topY + 0.10, -0.18);
  crownHinge.rotation.x = -0.42;
  crownHinge.add(crownMesh);
  group.add(crownHinge);
  CAMP.flaps.push({
    mesh: crownMesh, geo: crown, base: Float32Array.from(crown.attributes.position.array),
    cols: 5, rows: 6, width: 0.78, height: 0.78, hinge: crownHinge, kind: 'crown',
    amp: 0.09, phase: cfg.x * 0.21 + 2.1
  });
  /* the tether rope from flap corner to a roof peg */
  const tether = bentPoleGeo(
    new THREE.Vector3(0.36, topY - 0.16, 0.26),
    new THREE.Vector3(0.72, wallH + 0.35, R * 0.72),
    0.05, 0.017, 6, 4
  );
  const tetherMesh = new THREE.Mesh(tether, MAT.rope);
  tetherMesh.castShadow = true;
  group.add(tetherMesh);

  /* collider: a broad cone under the ger */
  addCone(cfg.x, cfg.z, R + 0.4, topY + 0.2, cfg.y);
  addSphere(cfg.x, cfg.y + topY + 0.4, cfg.z, 0.4);

  return { group, topY, anchor: new THREE.Vector3(cfg.x, cfg.y + wallH + R * 0.28, cfg.z) };
}

function buildTent(x, z, yaw) {
  const y = heightAt(x, z);
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = yaw;
  g.layers.set(0);
  CAMP.group.add(g);
  const wood = new GeoBatch();
  const canvas = new GeoBatch();
  const R = 2.05, H = 2.35, L = 4.1;
  /* two bent ridge poles */
  for (const s of [-1, 1]) {
    wood.add(bentPoleGeo(
      new THREE.Vector3(s * R, 0.05, -L * 0.5),
      new THREE.Vector3(s * R * 0.72, H, L * 0.45),
      0.22, 0.033, 9, 4
    ));
  }
  wood.add(bentPoleGeo(new THREE.Vector3(-R * 0.8, H, L * 0.45), new THREE.Vector3(R * 0.8, H, L * 0.45), 0.08, 0.028, 6, 4));
  /* the canvas: two sloped sheets over the ridge, open at the front */
  for (const s of [-1, 1]) {
    const sheet = new THREE.PlaneGeometry(2.95, L * 0.88, 7, 12);
    const pos = sheet.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const u = pos.getX(i) / 2.95 + 0.5;
      const v = pos.getY(i) / (L * 0.88) + 0.5;
      const sag = Math.sin(u * PI) * 0.075 + Math.sin(v * PI) * 0.05;
      pos.setZ(i, -sag);
    }
    sheet.computeVertexNormals();
    sheet.rotateX(-PI / 2);
    canvas.add(sheet, matrixTRS(s * 1.32, 1.06, -0.25, 0, 0, s * -1.02));
  }
  /* a low back wall and the rolled front edge */
  const back = new THREE.PlaneGeometry(3.9, H * 0.94, 4, 4);
  canvas.add(back, matrixTRS(0, 1.15, -L * 0.48, 0, 0, 0));
  const roll = new THREE.CylinderGeometry(0.09, 0.09, 3.3, 8);
  roll.rotateZ(PI / 2);
  canvas.add(roll, matrixTRS(0, 0.06, L * 0.5, 0, 0, 0));
  const door = new THREE.PlaneGeometry(1.75, 2.0);
  const dm = new THREE.Mesh(door, MAT.feltDark);
  dm.position.set(0.05, 1.05, L * 0.5 - 0.35);
  g.add(dm);
  for (let i = 0; i < 5; i++) {
    wood.add(new THREE.CylinderGeometry(0.018, 0.018, 2.6, 4), matrixTRS((i - 2) * 0.7, 0.9, L * 0.5 - 0.2, 0.15, 0, 0.06));
  }
  const wm = wood.build(MAT.woodPale, { cast: true, receive: true });
  const cm = canvas.build(MAT.canvasTent, { cast: true, receive: true });
  if (wm) { wm.layers.set(0); g.add(wm); }
  if (cm) { cm.layers.set(0); g.add(cm); }
  addCone(x, z, 2.6, 2.5, y);
}

function buildCart(x, z, yaw) {
  const y = heightAt(x, z);
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = yaw;
  g.layers.set(0);
  CAMP.group.add(g);
  const wood = new GeoBatch();
  const metal = new GeoBatch();
  wood.box(3.3, 0.16, 1.7, 0, 0.72, 0);
  for (const s of [-1, 1]) {
    wood.box(3.3, 0.55, 0.10, 0, 0.98, s * 0.82);
    for (let i = 0; i < 5; i++) {
      wood.box(0.08, 0.52, 0.09, -1.5 + i * 0.75, 0.98, s * 0.875, 0, 0, 0);
    }
  }
  wood.box(0.12, 0.16, 1.55, -1.66, 0.55, 0);
  wood.box(0.12, 0.16, 1.55, 1.66, 0.55, 0);
  for (const s of [-1, 1]) {
    const wheel = new THREE.Group();
    wheel.position.set(0.45, 0.7, s * 0.92);
    const rim = new THREE.TorusGeometry(0.68, 0.055, 6, 24);
    wood.add(rim, matrixTRS(0.45, 0.7, s * 0.92, 0, PI / 2, 0));
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU;
      wood.add(new THREE.CylinderGeometry(0.026, 0.026, 1.30, 4), matrixTRS(0.45, 0.7, s * 0.92, 0, 0, a));
    }
    metal.add(new THREE.CylinderGeometry(0.10, 0.10, 0.16, 10), matrixTRS(0.45, 0.7, s * 0.92, PI / 2, 0, 0));
  }
  /* shafts and a yoke */
  for (const s of [-1, 1]) {
    wood.box(1.6, 0.09, 0.10, 2.25, 0.62, s * 0.55, 0, 0.13 * s, 0);
  }
  wood.box(0.14, 0.09, 1.35, 3.0, 0.63, 0);
  const wm = wood.build(MAT.wood, { cast: true, receive: true });

  /* a folded felt load in the bed */
  const load = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 2.2, 10), MAT.feltDark);
  load.rotation.z = PI / 2;
  load.position.set(-0.2, 1.08, 0);
  load.castShadow = true;
  g.add(load);
  addBox(x, y + 1.0, z, 1.8, 0.8, 1.1, yaw);
}

function buildCorral(x, z) {
  const y = heightAt(x, z);
  const W = 17, D = 11, h = 0.92;
  const batch = new GeoBatch();
  const r = mulberry32(SEED ^ 0x3c011);
  const seg = 2.4;
  const placeWall = (cx, cz, len, across) => {
    const n = Math.round(len / seg);
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n - 0.5;
      const px = cx + (across ? 0 : t * len), pz = cz + (across ? t * len : 0);
      const yy = heightAt(px, pz);
      batch.add(new THREE.BoxGeometry(across ? 0.56 : seg * 0.94, h * (0.82 + r() * 0.24), across ? seg * 0.94 : 0.56),
        matrixTRS(px, yy + h * 0.4, pz, 0, (r() - 0.5) * 0.08, 0));
    }
  };
  placeWall(x, z - D / 2, W, false);
  placeWall(x, z + D / 2, W, false);
  placeWall(x - W / 2, z, D, true);
  placeWall(x + W / 2, z, D, true);
  /* gate gap in the east wall */
  const wall = batch.build(MAT.stele, { cast: true, receive: true });
  if (wall) { wall.layers.set(0); CAMP.group.add(wall); }
  addBox(x, y + h / 2, z - D / 2, W / 2, h / 2, 0.4);
  addBox(x, y + h / 2, z + D / 2, W / 2, h / 2, 0.4);
  addBox(x - W / 2, y + h / 2, z, 0.4, h / 2, D / 2);
  addBox(x + W / 2, y + h / 2, z, 0.4, h / 2, D / 2);
  /* a few stone piles and a gate hurdle */
  for (let i = 0; i < 7; i++) {
    const px = x + (r() - 0.5) * W * 0.6, pz = z + (r() - 0.5) * D * 0.6;
    const s = 0.2 + r() * 0.3;
    const m = new THREE.Mesh(ROCK_GEOS[i % 3], MAT.rock);
    m.position.set(px, heightAt(px, pz) + s * 0.3, pz);
    m.scale.setScalar(s);
    m.castShadow = true;
    m.layers.set(1);
    CAMP.group.add(m);
  }
}

function makePerson(cfg) {
  const g = new THREE.Group();

  g.position.set(cfg.x, y, cfg.z);
  g.rotation.y = cfg.yaw;
  g.layers.set(0);
  CAMP.group.add(g);
  const robeMat = cfg.robe || MAT.humanRobe;
  const robe = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.42, cfg.seated ? 0.82 : 1.06, 10, 1), robeMat);
  robe.position.y = cfg.seated ? 0.42 : 0.58;
  robe.castShadow = true;
  g.add(robe);
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.25, 0.52, 9), robeMat);
  torso.position.y = cfg.seated ? 0.98 : 1.27;
  torso.castShadow = true;
  g.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.115, 12, 9), MAT.humanSkin);
  head.position.y = cfg.seated ? 1.30 : 1.61;
  head.castShadow = true;
  g.add(head);
  const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.19, 0.10, 12), MAT.humanHat);
  hat.position.y = cfg.seated ? 1.40 : 1.71;
  hat.castShadow = true;
  g.add(hat);
  const sash = new THREE.Mesh(new THREE.CylinderGeometry(0.255, 0.255, 0.11, 10), MAT.humanSash);
  sash.position.y = cfg.seated ? 0.78 : 1.06;
  g.add(sash);
  for (const s of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.048, 0.52, 7), robeMat);
    arm.position.set(s * 0.25, cfg.seated ? 1.04 : 1.30, cfg.seated ? 0.10 : 0.02);
    arm.rotation.set(cfg.seated ? -0.9 : -0.1, 0, s * (cfg.seated ? 0.5 : 0.16));
    arm.castShadow = true;
    g.add(arm);
  }
  if (!cfg.seated) {
    for (const s of [-1, 1]) {
      const boot = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.18, 0.26), MAT.humanBoot);
      boot.position.set(s * 0.12, 0.09, 0.04);
      g.add(boot);
    }
  } else {
    for (const s of [-1, 1]) {
      const knee = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.16, 0.38), robeMat);
      knee.position.set(s * 0.14, 0.34, 0.24);
      knee.castShadow = true;
      g.add(knee);
    }
  }
  addCapsule(cfg.x, y, cfg.z, cfg.x, y + (cfg.seated ? 1.1 : 1.8), cfg.z, 0.35);
  CAMP.people.push({ group: g, phase: cfg.x * 0.11 + cfg.z * 0.03, seated: cfg.seated });
  return g;
}
