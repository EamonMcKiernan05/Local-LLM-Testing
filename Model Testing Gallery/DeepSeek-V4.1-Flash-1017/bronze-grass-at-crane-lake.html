      cols: 2, rows: 3, width: 0.22, height: 0.8, kind: 'strip', hinge: null, amp: 0.06, phase: i * 0.9
    });
  }

  makePerson({ x: -543.5, z: 228.4, yaw: 4.2, seated: true, robe: MAT.humanRobe2 });
  makePerson({ x: -534, z: 223.5, yaw: 2.3, seated: false, robe: MAT.humanRobe });
}

function buildSmoke() {
  for (const anchor of CAMP.smokeAnchors) {
    const puffs = [];
    const n = anchor.scale > 1 ? 11 : 9;
    for (let i = 0; i < n; i++) {
      const mat = new THREE.SpriteMaterial({
        map: TEX.smoke, color: 0xe7e4da, transparent: true, opacity: 0,
        depthWrite: false, blending: THREE.NormalBlending
      });
      const sp = new THREE.Sprite(mat);
      sp.renderOrder = 30;
      CAMP.group.add(sp);
      puffs.push({ sprite: sp, mat, phase: i / n, spin: (i * 1.7) % TAU });
    }
    CAMP.smoke.push({ anchor, puffs });
  }
}

function updateCamp() {
  const t = SIM.t;
  const ph = t / LOOP_SECONDS;
  const gust = 0.62 + 0.38 * Math.sin(TAU * ph * 3 + 0.4) * Math.sin(TAU * ph * 7 + 1.2);
  /* fluttering felt */
  for (const f of CAMP.flaps) {
    const g = f.geo;
    const pos = g.attributes.position;
    const base = f.base;
    const h = f.height;
    const cols = f.cols;
    const across = 1 - Math.min(1, Math.abs((pos.getX(0) || 0)) / (f.width * 0.5 + 1e-5));
    for (let i = 0; i < pos.count; i++) {
      const bx = base[i * 3], by = base[i * 3 + 1];
      const down = clamp(-by / h, 0, 1);
      const wave = Math.sin(TAU * (ph * 34 + f.phase) + bx * 4.4 + down * 2.1)
        + 0.5 * Math.sin(TAU * (ph * 51 + f.phase * 1.7) - bx * 2.0);
      const amp = f.amp * (0.45 + 0.55 * gust) * down * down * f.width;
      pos.setXYZ(i, bx, by, wave * amp);
    }
    pos.needsUpdate = true;
    g.computeVertexNormals();
    if (f.hinge) {
      const baseRot = f.kind === 'door' ? -1.06 : -0.42;
      f.hinge.rotation.x = baseRot + Math.sin(TAU * (ph * 22 + f.phase)) * 0.022 * (0.4 + gust);
    }
  }
  /* hearth fire: a small, periodic flicker */
  for (const fl of CAMP.flame) {
    const p = (ph * 46 + fl.phase / TAU) % 1;
    fl.sprite.position.y = 0.10 + Math.sin(p * PI) * 0.55 + 0.05 * Math.sin(TAU * ph * 31 + fl.phase);
    fl.sprite.position.x = Math.cos(fl.phase) * 0.10 + Math.sin(TAU * ph * 13 + fl.phase) * 0.03;
    fl.sprite.position.z = Math.sin(fl.phase) * 0.10 + Math.cos(TAU * ph * 17 + fl.phase) * 0.03;
    const s = (0.26 + 0.16 * Math.sin(p * PI)) * (0.9 + 0.1 * Math.sin(TAU * ph * 27 + fl.phase));
    fl.sprite.scale.setScalar(s);
    fl.mat.opacity = Math.sin(p * PI) * 0.42;
  }
  if (CAMP.fireLight) {
    CAMP.fireLight.intensity = 1.9 + 0.35 * Math.sin(TAU * ph * 31) + 0.18 * Math.sin(TAU * ph * 17 + 1.1);
  }
  /* smoke rises, leans downwind, and starts again exactly at the seam */
  for (const plume of CAMP.smoke) {
    const a = plume.anchor;
    for (const p of plume.puffs) {
      const life = (ph * 2 + p.phase) % 1; /* two smoke lifetimes per loop */
      const up = life * 1.0;
      const x = a.x + WORLD.windDir.x * up * 6.5 + Math.sin(p.spin + up * 7) * 0.35;
      const z = a.z + WORLD.windDir.y * up * 6.5 + Math.cos(p.spin + up * 6) * 0.35;
      const y = a.y + up * 7.2;
      p.sprite.position.set(x, y, z);
      const s = (0.5 + up * 4.6) * a.scale;
      p.sprite.scale.set(s, s * 0.86, 1);
      p.mat.opacity = Math.pow(1 - life, 1.6) * (0.16 + 0.10 * life) * a.scale;
    }
  }
  /* the herders breathe; their postures stay put */
  for (const q of CAMP.people) {
    q.group.rotation.z = Math.sin(TAU * (ph * 4 + q.phase)) * 0.006;
  }
}

function buildCamp() {
  CAMP.group = new THREE.Group();
  CAMP.group.name = 'felt-camp';
  SCENE.add(CAMP.group);
  const cy = LAYOUT.lake.camp.level;
  const cx = LAYOUT.lake.camp.x, cz = LAYOUT.lake.camp.z;

  buildGer({ x: cx - 16, z: cz - 8, y: cy, yaw: 0.36, r: 3.2, openRoof: false });
  buildGer({ x: cx + 25, z: cz + 10, y: cy, yaw: 1.02, r: 2.7, openRoof: true });
  buildGer({ x: cx - 39, z: cz + 17, y: cy, yaw: -0.42, r: 2.35, openRoof: false });
  buildTent(cx + 40, cz - 14, 0.75);
  buildCart(-505, 238, -0.14);
  buildCorral(-650, 262);
  buildCampProps();

  CAMP.group.traverse(o => {
    if (o.isMesh) {
      o.receiveShadow = true;
      if (o.material && o.material.side === THREE.DoubleSide) o.castShadow = true;
    }
  });
}


/* ======================= 06-vegetation.js ======================= */
/* ======================= 06-vegetation.js ======================= */
/* ==========================================================================
   06 — the cover of the basin: feathergrass, grazed lawns, reed margins,
        sage and the willow and poplar grove that shelters the camp.
        Tall grass answers the wind fully; grazed grass barely moves.
   ========================================================================== */

const VEG = { counts: {}, meshes: [], trees: [], leafTex: null, leafMat: null };
const VEG_SCALE = PROBE_LOW ? 0.58 : 1.0;

/* --------------------------------------------------------------- palettes */
const PAL = {
  featherRoot: new THREE.Color(0x23251a),
  featherMid: new THREE.Color(0x8f8959),
  featherTip: new THREE.Color(0xd8cfa6),
  grazedRoot: new THREE.Color(0x272b1b),
  grazedTip: new THREE.Color(0x6d7448),
  reedRoot: new THREE.Color(0x2d301e),
  reedTip: new THREE.Color(0xa89a63),
  reedHead: new THREE.Color(0x6c5235),
  shrubTip: new THREE.Color(0x7c8162),
  sunBleach: new THREE.Color(0xe0d6ae)
};

/* ---------------------------------------------------------- grass geometry */
function bladeTuftGeometry(seed, opts) {
  const R = mulberry32(seed);
  const blades = opts.blades;
  const segs = opts.segs;
  const height = opts.height;
  const spread = opts.spread;
  const width = opts.width;
  const droop = opts.droop === undefined ? 0.25 : opts.droop;
  const awns = opts.awns || 0;
  const pos = [], col = [], bend = [], idx = [];
  const c = new THREE.Color();
  let vi = 0;
  const addBlade = (ang, offset, hgt, wid, lean, phase) => {
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const rows = segs + 1;
    const start = vi;
    for (let r = 0; r < rows; r++) {
      const t = r / segs;
      const y = hgt * t;
      const w = wid * (1 - t) * (0.5 + 0.5 * Math.sin(PI * Math.min(1, t * 1.15 + 0.08)));
      const curve = lean * t * t;
      const halfX = ca * w, halfZ = sa * w;
      const bx = offset * ca + curve * 0.35 * sa;
      const bz = offset * sa - curve * 0.35 * ca;
      const cx = ca * (offset + curve) + (R() - 0.5) * 0.002;
      const cz = sa * (offset + curve) + (R() - 0.5) * 0.002;
      const px = cx + halfX, pz = cz + halfZ;
      const py = y - Math.pow(t, 2.2) * hgt * droop;
      pos.push(px, py, pz);
      pos.push(cx - halfX, py - 0.001, cz - halfZ);
      const tipT = clamp(t * 0.9 + 0.10, 0, 1);
      c.copy(PAL.featherRoot).lerp(PAL.featherMid, smoothstep(0, 0.55, tipT)).lerp(PAL.featherTip, smoothstep(0.45, 1, tipT));
      const shade = 0.72 + 0.28 * R();
      col.push(c.r * shade, c.g * shade, c.b * shade);
      c.multiplyScalar(0.93);
      col.push(c.r, c.g, c.b);
      bend.push(t * t, t * t);
    }
    for (let r = 0; r < segs; r++) {
      const a = start + r * 2, b = a + 1, d = a + 2, e = a + 3;
      idx.push(a, d, b, b, d, e);
    }
    vi += rows * 2;
    if (awns && R() < awns) {
      const tipY = hgt - hgt * droop;
      const ax = Math.cos(ang) * (offset + lean) * 1.1;
      const az = Math.sin(ang) * (offset + lean) * 1.1;
      const len = hgt * (0.28 + R() * 0.35);
      const sway = (R() - 0.5) * 0.16;
      pos.push(ax - 0.006, tipY - 0.05, az); col.push(0.55, 0.50, 0.33); bend.push(0.8);
      pos.push(ax + sway, tipY + len, az + sway * 0.3); col.push(PAL.featherTip.r, PAL.featherTip.g, PAL.featherTip.b); bend.push(1.0);
      pos.push(ax + 0.006, tipY - 0.07, az); col.push(0.5, 0.46, 0.3); bend.push(0.85);
      idx.push(vi, vi + 1, vi + 2);
      vi += 3;
    }
  };
  for (let i = 0; i < blades; i++) {
    const ang = (i / blades) * TAU + (R() - 0.5) * 0.8;
    const off = R() * spread;
    addBlade(ang, off, height * (0.68 + R() * 0.42), width * (0.7 + R() * 0.7), height * (0.16 + R() * 0.4), R() * TAU);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aBend', new THREE.Float32BufferAttribute(bend, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  /* foliage normals: mostly up so the low morning sun catches every blade */
  const nrm = g.attributes.normal;
  for (let i = 0; i < nrm.count; i++) {
    const ny = 0.72 + 0.26 * Math.abs(nrm.getY(i));
    const nx = nrm.getX(i) * 0.6, nz = nrm.getZ(i) * 0.6;
    const l = Math.hypot(nx, ny, nz);
    nrm.setXYZ(i, nx / l, ny / l, nz / l);
  }
  return g;
}

function grazedTuftGeometry(seed) {
  const R = mulberry32(seed);
  const pos = [], col = [], bend = [], idx = [];
  const c = new THREE.Color();
  let vi = 0;
  const blades = 5;
  for (let i = 0; i < blades; i++) {
    const a = (i / blades) * TAU + R() * 0.9;
    const ca = Math.cos(a), sa = Math.sin(a);
    const h = 0.12 + R() * 0.20;
    const w = 0.014 + R() * 0.014;
    const off = R() * 0.14;
    const rows = 3;
    const start = vi;
    for (let r = 0; r < rows; r++) {
      const t = r / (rows - 1);
      const y = h * t;
      const ww = w * (1 - t * 0.85);
      const bx = ca * off + ca * t * 0.06;
      const bz = sa * off + sa * t * 0.06;
      pos.push(bx + ca * ww, y, bz + sa * ww);
      pos.push(bx - ca * ww, y, bz - sa * ww);
      c.copy(PAL.grazedRoot).lerp(PAL.grazedTip, t * t * 0.9);
      col.push(c.r, c.g, c.b, c.r * 0.9, c.g * 0.9, c.b * 0.9);
      bend.push(t * t, t * t);
    }
    for (let r = 0; r < rows - 1; r++) {
      const a0 = start + r * 2;
      idx.push(a0, a0 + 2, a0 + 1, a0 + 1, a0 + 2, a0 + 3);
    }
    vi += rows * 2;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aBend', new THREE.Float32BufferAttribute(bend, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function reedClumpGeometry(seed) {
  const R = mulberry32(seed);
  const pos = [], col = [], bend = [], idx = [];
  const c = new THREE.Color();
  let vi = 0;
  const stalks = 6;
  for (let i = 0; i < stalks; i++) {
    const a = (i / stalks) * TAU + R() * 0.6;
    const ca = Math.cos(a), sa = Math.sin(a);
    const h = 1.55 + R() * 1.15;
    const off = R() * 0.22;
    const lean = (R() - 0.5) * 0.3;
    const rows = 4;
    const start = vi;
    const w0 = 0.013 + R() * 0.009;
    for (let r = 0; r < rows; r++) {
      const t = r / (rows - 1);
      const y = h * t;
      const w = w0 * (1 - t * 0.75);
      const bx = ca * (off + lean * t * t);
      const bz = sa * (off + lean * t * t);
      pos.push(bx + ca * w, y, bz + sa * w);
      pos.push(bx - ca * w, y, bz - sa * w);
      c.copy(PAL.reedRoot).lerp(PAL.reedTip, smoothstep(0.05, 0.9, t));
      col.push(c.r, c.g, c.b, c.r * 0.86, c.g * 0.86, c.b * 0.86);
      bend.push(t * t, t * t);
    }
    for (let r = 0; r < rows - 1; r++) {
      const a0 = start + r * 2;
      idx.push(a0, a0 + 2, a0 + 1, a0 + 1, a0 + 2, a0 + 3);
    }
    vi += rows * 2;
    /* the brown seed head, a narrow hovering blade */
    if (R() < 0.8) {
      const ty = h;
      const bx = ca * (off + lean);
      const bz = sa * (off + lean);
      const hh = 0.18 + R() * 0.16;
      pos.push(bx - 0.035, ty, bz); col.push(0.32, 0.24, 0.15); bend.push(1.0);
      pos.push(bx + 0.035, ty, bz); col.push(0.34, 0.26, 0.16); bend.push(1.0);
      pos.push(bx, ty + hh, bz); col.push(0.45, 0.34, 0.20); bend.push(1.05);
      idx.push(vi, vi + 1, vi + 2);
      vi += 3;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aBend', new THREE.Float32BufferAttribute(bend, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function shrubGeometry(seed) {
  const R = mulberry32(seed);
  const pos = [], col = [], bend = [], idx = [];
  const c = new THREE.Color();
  let vi = 0;
  const cards = 16;
  for (let i = 0; i < cards; i++) {
    const a = R() * TAU;
    const rad = 0.15 + R() * 0.45;
    const h = 0.15 + R() * 0.55;
    const bx = Math.cos(a) * rad, bz = Math.sin(a) * rad;
    const w = 0.08 + R() * 0.16;
    const tx = bx + (R() - 0.5) * 0.16, tz = bz + (R() - 0.5) * 0.16;
    pos.push(bx - w, h * 0.3, bz, bx + w, h * 0.45, bz, tx, h + 0.1 + R() * 0.2, tz);
    c.copy(PAL.grazedRoot).lerp(PAL.shrubTip, 0.4 + R() * 0.6);
    col.push(c.r * 0.8, c.g * 0.8, c.b * 0.8, c.r, c.g, c.b, c.r * 1.12, c.g * 1.1, c.b * 1.05);
    bend.push(0.2, 0.35, 0.8);
    idx.push(vi, vi + 1, vi + 2);
    vi += 3;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aBend', new THREE.Float32BufferAttribute(bend, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ------------------------------------------------------------- wind shader */
function applyPlantWind(mat, key, opts = {}) {
  const strength = opts.strength === undefined ? 1.0 : opts.strength;
  const phaseSpeed = opts.phaseSpeed || 30;
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uPhase = ENV_U.uPhase;
    shader.uniforms.uWindDir = ENV_U.uWindDir;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float aBend;
        attribute float aPhase;
        attribute float aStiff;
        uniform float uPhase;
        uniform vec2 uWindDir;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        {
          vec3 iPos = vec3(0.0);
          #ifdef USE_INSTANCING
            iPos = instanceMatrix[3].xyz;
          #else
            iPos = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
          #endif
          float ph = uPhase;
          float gust = 0.52 + 0.48 * sin(6.2831853 * (ph * 3.0 - (iPos.x + 1400.0) / 2300.0));
          float sw = sin(6.2831853 * (ph * ${phaseSpeed.toFixed(1)} + aPhase) + iPos.x * 0.13 + iPos.z * 0.08) * 0.62
                   + sin(6.2831853 * (ph * ${(phaseSpeed * 1.73).toFixed(1)} + aPhase * 1.7) - iPos.x * 0.27 + iPos.z * 0.19) * 0.38;
          float amp = (0.055 + 0.30 * aStiff) * aStiff * gust * ${strength.toFixed(2)};
          transformed.xz += uWindDir * sw * amp * aBend;
          transformed.y -= abs(sw) * amp * aBend * 0.22;
        }`);
  };
  mat.customProgramCacheKey = () => 'crane-plant-' + key;
  return mat;
}

function makePlantMaterial(key, opts = {}) {
  return applyPlantWind(new THREE.MeshLambertMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    color: opts.color === undefined ? 0xffffff : opts.color,
    emissive: 0x000000,
    fog: true
  }), key, opts);
}

/* --------------------------------------------------------- scatter helpers */
function nearLowRoute(x, z, r) {
  const pts = [[-205, 312], [-120, 224], [-20, 232], [120, 240], [300, 262], [480, 251], [640, 220]];
  for (let i = 0; i < pts.length - 1; i++) {
    const ax = pts[i][0], az = pts[i][1], bx = pts[i + 1][0], bz = pts[i + 1][1];
    const vx = bx - ax, vz = bz - az;
    const t = clamp(((x - ax) * vx + (z - az) * vz) / (vx * vx + vz * vz || 1), 0, 1);
    if (Math.hypot(x - (ax + vx * t), z - (az + vz * t)) < r) return true;
  }
  return false;
}

function groundPlantable(x, z, margin = 1.0) {
  const h = heightAt(x, z);
  if (h < 0.36 + margin * 0.3) return false;
  if (trackDistance(x, z) < 5.5) return false;
  const c = LAYOUT.lake.camp;
  if (Math.hypot(x - c.x, z - c.z) < 43) return false;
  for (const p of LAYOUT.patches) {
    if (Math.hypot(x - p.x, z - p.z) < p.r - 3) return false;
  }
  const q = lakeQ(x, z);
  if (q < 1.02) return false;
  return true;
}
function nearTree(x, z, r = 3) {
  for (const t of VEG.trees) if (Math.hypot(x - t.x, z - t.z) < r) return false;
  return true;
}

function makeInstancedPlants(geo, mat, list, phaseSpeed, stiffnessFn) {
  const mesh = new THREE.InstancedMesh(geo, mat, Math.max(1, list.length));
  mesh.count = list.length;
  mesh.castShadow = false;
  mesh.receiveShadow = false;
  mesh.frustumCulled = false;
  const phase = new Float32Array(Math.max(1, list.length));
  const stiff = new Float32Array(Math.max(1, list.length));
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const s = new THREE.Vector3();
  const p = new THREE.Vector3();
  const col = new THREE.Color();
  mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(Math.max(1, list.length) * 3), 3);
  for (let i = 0; i < list.length; i++) {
    const e = list[i];
    q.setFromEuler(new THREE.Euler(e.rx || 0, e.ry || 0, e.rz || 0, 'YXZ'));
    s.set(e.sx === undefined ? e.scale : e.sx * e.scale, e.sy === undefined ? e.scale : e.sy * e.scale, e.sz === undefined ? e.scale : e.sz * e.scale);
    p.set(e.x, e.y, e.z);
    m.compose(p, q, s);
    mesh.setMatrixAt(i, m);
    phase[i] = e.phase;
    stiff[i] = stiffnessFn ? stiffnessFn(e) : e.stiff;
    col.setRGB(e.tintR, e.tintG, e.tintB);
    mesh.setColorAt(i, col);
  }
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phase, 1));
  geo.setAttribute('aStiff', new THREE.InstancedBufferAttribute(stiff, 1));
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.layers.set(1);
  mesh.name = 'plants';
  SCENE.add(mesh);
  VEG.meshes.push(mesh);
  return mesh;
}

/* -------------------------------------------------------- grass card art */
function makeGrassCardTexture(kind) {
  const W = 256, H = 256;
  const c = mkCanvas(W, H);
  const x = c2d(c, true);
  x.clearRect(0, 0, W, H);
  const R = mulberry32(SEED ^ (kind === 'feather' ? 0xfea7 : kind === 'grazed' ? 0x9a11 : 0xeed1));
  const feather = kind === 'feather', grazed = kind === 'grazed';
  const n = feather ? 96 : grazed ? 112 : 24;
  x.lineCap = 'round';
  const blade = (baseX, baseY, tipX, tipY, w, stops) => {
    const grad = x.createLinearGradient(baseX, baseY, tipX, tipY);
    for (const s of stops) grad.addColorStop(s[0], s[1]);
    x.strokeStyle = grad;
    x.lineWidth = w;
    x.beginPath();
    x.moveTo(baseX, baseY);
    x.quadraticCurveTo(baseX + (tipX - baseX) * 0.25, baseY - (baseY - tipY) * 0.55, tipX, tipY);
    x.stroke();
  };
  const featherStops = [
    [0, 'rgba(104,104,62,0.94)'], [0.30, 'rgba(176,164,104,0.96)'],
    [0.62, 'rgba(206,190,126,0.96)'], [1, 'rgba(248,238,196,0.96)']
  ];
  const grazedStops = [
    [0, 'rgba(68,80,44,0.97)'], [0.5, 'rgba(138,156,88,0.96)'], [1, 'rgba(210,218,150,0.94)']
  ];
  const reedStops = [
    [0, 'rgba(76,78,48,0.98)'], [0.45, 'rgba(174,164,104,0.97)'], [1, 'rgba(248,232,172,0.95)']
  ];
  const stops = feather ? featherStops : grazed ? grazedStops : reedStops;
  const spread = grazed ? 96 : 96;
  for (let i = 0; i < n; i++) {
    const baseX = 128 + (R() - 0.5) * spread * 2;
    const baseY = 252 + R() * 3;
    const tall = grazed ? 44 + R() * 105 : feather ? 138 + R() * 106 : 168 + R() * 82;
    const tipX = baseX + (R() - 0.5) * (grazed ? 100 : feather ? 86 : 42);
    const tipY = Math.max(6, baseY - tall);
    const w = (grazed ? 0.9 : 0.7) + R() * 1.3;
    blade(baseX, baseY, tipX, tipY, w, stops);
    if (feather && R() < 0.55) {
      x.strokeStyle = `rgba(242,230,184,${0.4 + R() * 0.35})`;
      x.lineWidth = 0.65;
      for (let k = 0; k < 2; k++) {
        x.beginPath();
        x.moveTo(tipX, tipY + 5);
        x.quadraticCurveTo(tipX + (R() - 0.5) * 18, tipY - 20, tipX + (R() - 0.5) * 40, tipY - 28 - R() * 30);
        x.stroke();
      }
    }
    if (feather && R() < 0.16) {
      x.fillStyle = 'rgba(210,196,150,0.7)';
      x.beginPath();
      x.ellipse(tipX + 2, tipY - 7, 2.4, 8 + R() * 6, (R() - 0.5) * 0.6, 0, TAU);
      x.fill();
    }
    if (kind === 'reed' && R() < 0.6) {
      x.fillStyle = `rgba(${104 + R() * 30 | 0},${78 + R() * 20 | 0},${46 + R() * 16 | 0},0.86)`;
      x.beginPath();
      x.ellipse(tipX + (R() - 0.5) * 5, tipY - 3, 3.4, 10 + R() * 7, (R() - 0.5) * 0.35, 0, TAU);
      x.fill();
    }
  }
  /* a dense, almost solid base: this is what keeps distant grass golden, not black */
  for (let i = 0; i < 28; i++) {
    const baseX = 128 + (R() - 0.5) * spread * 2;
    const baseY = 253;
    const tipY = 176 + R() * 62;
    const tipX = baseX + (R() - 0.5) * 34;
    blade(baseX, baseY, tipX, tipY, 2.0 + R() * 2.4,
      grazed ? grazedStops : [[0, 'rgba(84,84,50,0.98)'], [0.6, 'rgba(176,164,104,0.96)'], [1, 'rgba(236,222,168,0.95)']]);
  }
  /* fade the outer columns so the crossed cards read as a tuft, not a square */
  x.globalCompositeOperation = 'destination-in';
  const mask = x.createLinearGradient(0, 0, W, 0);
  mask.addColorStop(0, 'rgba(0,0,0,0)');
  mask.addColorStop(0.10, 'rgba(0,0,0,0.88)');
  mask.addColorStop(0.5, 'rgba(0,0,0,1)');
  mask.addColorStop(0.90, 'rgba(0,0,0,0.88)');
  mask.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = mask;
  x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = 'source-over';
  const t = canvasTex(c, { srgb: true, aniso: MAX_ANISO });
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}
function cardTuftGeometry(seed) {
  const pos = [], col = [], bend = [], uv = [], idx = [];
  const R = mulberry32(seed);
  const rows = 3;
  const planes = 3;
  let vi = 0;
  for (let p = 0; p < planes; p++) {
    const ang = p / planes * PI + 0.18 * Math.sin(p * 2.7 + seed);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const wob = (R() - 0.5) * 0.18;
    for (let r = 0; r < rows; r++) {
      const t = r / (rows - 1);
      const y = t;
      const half = 0.52 * (0.7 + 0.45 * t);
      const leanX = wob * t * t, leanZ = (R() - 0.5) * 0.10 * t * t;
      for (const s of [-1, 1]) {
        pos.push(ca * s * half + leanX, y, sa * s * half + leanZ);
        uv.push(s * 0.5 + 0.5, t);
        const shade = 0.52 + 0.48 * t;
        col.push(shade, shade, shade);
        bend.push(t * t * 0.95);
      }
      if (r > 0) {
        const a = vi + (r - 1) * 2;
        idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
      }
    }
    vi += rows * 2;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aBend', new THREE.Float32BufferAttribute(bend, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  const nrm = g.attributes.normal;
  for (let i = 0; i < nrm.count; i++) {
    const y = Math.abs(nrm.getY(i));
    nrm.setXYZ(i, nrm.getX(i) * 0.25, 0.85 + y * 0.12, nrm.getZ(i) * 0.25);
  }
  return g;
}

function makeFlowerTexture() {
  const W = 128, H = 128;
  const c = mkCanvas(W, H);
  const x = c2d(c, true);
  const R = mulberry32(SEED ^ 0x71f1);
  x.clearRect(0, 0, W, H);
  const palettes = [
    ['rgba(247,244,228,0.98)', 'rgba(226,220,190,0.9)'],
    ['rgba(244,204,92,0.98)', 'rgba(214,168,52,0.9)'],
    ['rgba(196,176,214,0.96)', 'rgba(164,140,190,0.85)'],
    ['rgba(224,232,238,0.95)', 'rgba(186,200,210,0.85)']
  ];
  for (let i = 0; i < 22; i++) {
    const baseX = 24 + R() * 80, baseY = 126;
    const tipX = baseX + (R() - 0.5) * 34;
    const tipY = 22 + R() * 54;
    x.strokeStyle = `rgba(88,108,62,${0.6 + R() * 0.3})`;
    x.lineWidth = 1 + R() * 1.2;
    x.beginPath(); x.moveTo(baseX, baseY); x.quadraticCurveTo(baseX + (tipX - baseX) * 0.25, (baseY + tipY) / 2, tipX, tipY); x.stroke();
    const pal = palettes[Math.floor(R() * palettes.length)];
    const rad = 2.0 + R() * 3.2;
    for (let k = 0; k < 5; k++) {
      const a = k / 5 * TAU + R() * 0.3;
      x.fillStyle = pal[0];
      x.beginPath();
      x.ellipse(tipX + Math.cos(a) * rad * 0.9, tipY + Math.sin(a) * rad * 0.9, rad * 0.65, rad * 0.45, a, 0, TAU);
      x.fill();
    }
    x.fillStyle = pal[1];
    x.beginPath(); x.arc(tipX, tipY, rad * 0.38, 0, TAU); x.fill();
  }
  const t = canvasTex(c, { srgb: true, aniso: MAX_ANISO });
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}

function makeCardMaterial(kind) {
  const tex = kind === 'flower' ? makeFlowerTexture() : makeGrassCardTexture(kind);
  const mat = new THREE.MeshLambertMaterial({
    map: tex, alphaTest: kind === 'feather' ? 0.18 : kind === 'flower' ? 0.24 : 0.22,
    side: THREE.DoubleSide, vertexColors: true, color: 0xffffff, emissive: 0x2b2410, fog: true, alphaToCoverage: true
  });
  mat.customProgramCacheKey = () => 'crane-card-' + kind;
  const opts = kind === 'feather'
    ? { strength: 1.0, phaseSpeed: 27 }
    : kind === 'grazed' ? { strength: 0.26, phaseSpeed: 31 }
      : kind === 'flower' ? { strength: 0.30, phaseSpeed: 23 }
        : { strength: 0.68, phaseSpeed: 21 };
  return applyPlantWind(mat, 'card-' + kind, opts);
}

function makeCardMesh(geo, mat, list) {
  return makeInstancedPlants(geo, mat, list, 27);
}

function cardInstance(x, z, R, opts) {
  const h = heightAt(x, z);
  const shade = sunShadeAt(x, z);
  const dry = R() * 0.6 + 0.4;
  const sc = opts.scale || 1;
  return {
    x, y: h - 0.03, z, ry: R() * TAU,
    scale: sc * (0.8 + R() * 0.7),
    sx: (1.2 + R() * 0.9), sy: (0.9 + R() * 0.65),
    phase: R() * TAU,
    stiff: (opts.stiff || 0.8) * (0.8 + R() * 0.35),
    tintR: (opts.tintR || 0.9) * (0.95 + R() * 0.1) * (0.42 + 0.58 * shade),
    tintG: (opts.tintG || 0.88) * (0.95 + R() * 0.1) * (0.42 + 0.58 * shade),
    tintB: (opts.tintB || 0.62) * (0.95 + R() * 0.1) * (0.42 + 0.58 * shade)
  };
}

/* ----------------------------------------------------------------- scatters */
const FEATHER_PATCHES = [
  { x: -330, z: 260, r: 60 }, { x: -190, z: 245, r: 44 }, { x: -50, z: 285, r: 58 },
  { x: 100, z: 260, r: 50 }, { x: 250, z: 305, r: 66 }, { x: 430, z: 280, r: 46 },
  { x: 560, z: 250, r: 40 }, { x: -430, z: 235, r: 42 }, { x: -620, z: 300, r: 48 },
  { x: -300, z: 430, r: 62 }, { x: -80, z: 470, r: 54 }, { x: 200, z: 445, r: 70 },
  { x: 420, z: 410, r: 52 }, { x: -520, z: 470, r: 50 }, { x: 20, z: 640, r: 60 },
  { x: 250, z: 620, r: 55 }, { x: -700, z: 220, r: 40 }, { x: -240, z: 155, r: 28 },
  { x: -360, z: 390, r: 34 }, { x: -170, z: 360, r: 30 },
  { x: -300, z: 540, r: 45 }, { x: -170, z: 520, r: 38 }, { x: 10, z: 590, r: 40 },
  { x: -400, z: 555, r: 32 }, { x: -80, z: 440, r: 36 }
];

function scatterFeathergrass() {
  const target = Math.round(PROBE_LOW ? 36000 : 50000);
  const R = mulberry32(SEED ^ 0xf0a7);
  const list = [];
  const accept = (x, z) => {
    const q = lakeQ(x, z);
    if (q < 1.10) return false;
    const h = heightAt(x, z);
    if (h < 1.0 || h > 30) return false;
    if (trackDistance(x, z) < 3.0) return false;
    const c = LAYOUT.lake.camp;
    if (Math.hypot(x - c.x, z - c.z) < 38) return false;
    for (const p of LAYOUT.patches) if (Math.hypot(x - p.x, z - p.z) < p.r * 0.7) return false;
    if (!nearTree(x, z, 2.0)) return false;
    return true;
  };
  /* dense stands inside the patches, sparse feathergrass between them */
  const perPatch = Math.floor(target * 0.72 / FEATHER_PATCHES.length);
  for (const patch of FEATHER_PATCHES) {
    let placed = 0, tries = 0;
    while (placed < perPatch && tries < perPatch * 12) {
      tries++;
      const a = R() * TAU, rr = Math.sqrt(R()) * patch.r;
      const x = patch.x + Math.cos(a) * rr, z = patch.z + Math.sin(a) * rr;
      if (!accept(x, z)) continue;
      const nearTrack = trackDistance(x, z) < 12;
      list.push(cardInstance(x, z, R, { stiff: 0.95, scale: nearTrack ? 0.82 : 1.52, tintR: 1.02, tintG: 0.96, tintB: 0.66 }));
      placed++;
    }
  }
  let tries = 0;
  while (list.length < target && tries < target * 14) {
    tries++;
    const x = -1450 + R() * 2900, z = -300 + R() * 1250;
    if (!accept(x, z)) continue;
    const patch = 0.5 + 0.5 * fbm2(x * 0.0042 + 5.1, z * 0.0042 - 2.7, 3);
    const keep = smoothstep(0.40, 0.66, patch * 0.8 + 0.2 * R());
    if (R() > keep) continue;
    list.push(cardInstance(x, z, R, { stiff: 0.9, scale: 1.16, tintR: 0.98, tintG: 0.93, tintB: 0.66 }));
  }
  const geo = cardTuftGeometry(SEED ^ 0x12aa);
  const mat = makeCardMaterial('feather');
  makeCardMesh(geo, mat, list);
  VEG.counts.feather = list.length;
}

function scatterGrazedGrass() {
  const target = Math.round(PROBE_LOW ? 50000 : 68000);
  const R = mulberry32(SEED ^ 0x9a11);
  const list = [];
  let tries = 0;
  while (list.length < target && tries < target * 6) {
    tries++;
    let x, z;
    if (R() < 0.74) {
      /* the cropped lawn that follows the south shore and the camp */
      x = -1050 + R() * 1900;
      const shore = lakeCenterZ(x) + lakeHalfWidth(x);
      z = shore + (R() * 44 - 6);
    } else {
      x = -1000 + R() * 2000;
      z = 180 + R() * 650;
    }
    const q = lakeQ(x, z);
    const h = heightAt(x, z);
    if (h < 0.42 || h > 7.5) continue;
    if (q < 1.0) continue;
    if (trackDistance(x, z) < 1.2) continue;
    const c = LAYOUT.lake.camp;
    if (Math.hypot(x - c.x, z - c.z) < 22) continue;
    if (!nearTree(x, z, 1.4)) continue;
    const shore = h < 4.2 && q < 1.5 ? 1 : 0;
    const keep = 0.44 + shore * 0.55;
    if (R() > keep) continue;
    const dry = R() * 0.6 + 0.2;
    list.push(cardInstance(x, z, R, { stiff: 0.18, scale: 0.36, tintR: 0.82 + dry * 0.2, tintG: 0.90 + dry * 0.08, tintB: 0.54 + dry * 0.1 }));
  }
  const geo = cardTuftGeometry(SEED ^ 0x4d22);
  const mat = makeCardMaterial('grazed');
  makeCardMesh(geo, mat, list);
  VEG.counts.grazed = list.length;
}
function scatterReeds() {
  const target = Math.round(PROBE_LOW ? 12000 : 17000);
  const R = mulberry32(SEED ^ 0xeed1);
  const list = [];
  let tries = 0;
  while (list.length < target && tries < target * 18) {
    tries++;
    const x = -1000 + R() * 1850;
    const southX = lakeCenterZ(x) + lakeHalfWidth(x) * 1.01;
    const northX = lakeCenterZ(x) - lakeHalfWidth(x) * 1.0;
    const z = R() < 0.78 ? southX + (R() - 0.5) * 26 : northX + (R() - 0.5) * 20;
    const q = lakeQ(x, z);
    const h = heightAt(x, z);
    if (q < 0.93 || q > 1.09) continue;
    if (h > 0.44 || h < -0.8) continue;
    if (Math.hypot(x + 548, z - 221) < 16) continue;
    if (nearLowRoute(x, z, 14)) continue;
    const clump = 0.5 + 0.5 * fbm2(x * 0.02 + 9.2, z * 0.02 - 6.1, 3);
    if (R() > clump * 1.35) continue;
    list.push(cardInstance(x, z, R, { stiff: 0.62, scale: 0.82, tintR: 0.96, tintG: 0.92, tintB: 0.68 }));
  }
  const geo = cardTuftGeometry(SEED ^ 0x7e33);
  const mat = makeCardMaterial('reed');
  makeCardMesh(geo, mat, list);
  VEG.counts.reed = list.length;
}

function scatterShrubs() {
  const target = Math.round(PROBE_LOW ? 2400 : 3600);
  const R = mulberry32(SEED ^ 0x5b8a);
  const geos = [shrubGeometry(SEED ^ 0x111), shrubGeometry(SEED ^ 0x222), shrubGeometry(SEED ^ 0x333)];
  const lists = [[], [], []];
  let tries = 0;
  while (lists[0].length + lists[1].length < target && tries < target * 9) {
    tries++;
    const x = -2000 + R() * 4000;
    const z = -1200 + R() * 2200;
    const h = heightAt(x, z);
    if (h < 0.8 || h > 40) continue;
    if (lakeQ(x, z) < 1.12) continue;
    const n = 0.5 + 0.5 * fbm2(x * 0.01 + 3.3, z * 0.01 - 8.8, 3);
    if (n < 0.56 || R() < 0.3) continue;
    if (!nearTree(x, z, 2.5)) continue;
    if (trackDistance(x, z) < 4) continue;
    const shade = sunShadeAt(x, z);
    const k = R() < 0.34 ? 0 : R() < 0.5 ? 1 : 2;
    lists[k].push({
      x, y: h - 0.02, z, ry: R() * TAU, scale: 0.65 + R() * 1.2,
      phase: R() * TAU, stiff: 0.25 + R() * 0.2,
      tintR: (0.78 + R() * 0.18) * (0.42 + 0.58 * shade),
      tintG: (0.82 + R() * 0.14) * (0.42 + 0.58 * shade),
      tintB: (0.58 + R() * 0.12) * (0.42 + 0.58 * shade)
    });
  }
  const mat = makePlantMaterial('shrub', { strength: 0.42, phaseSpeed: 19 });
  for (let i = 0; i < 3; i++) makeInstancedPlants(geos[i], mat, lists[i], 19);
  VEG.counts.shrub = lists[0].length + lists[1].length + lists[2].length;
}
/* ------------------------------------------------------------------ trees */
function makeLeafTexture() {
  const W = 128;
  const c = mkCanvas(W, W);
  const x = c2d(c, true);
  const R = mulberry32(SEED ^ 0x1eaf);
  x.clearRect(0, 0, W, W);
  for (let i = 0; i < 14; i++) {
    const cx = 20 + R() * 88, cy = 20 + R() * 88;
    const ang = R() * TAU;
    const len = 11 + R() * 15, wid = 3 + R() * 4;
    x.save();
    x.translate(cx, cy);
    x.rotate(ang);
    const g = x.createLinearGradient(-len, 0, len, 0);
    g.addColorStop(0, 'rgba(142,155,104,0.95)');
    g.addColorStop(0.55, 'rgba(178,186,132,0.98)');
    g.addColorStop(1, 'rgba(212,214,166,0.95)');
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(-len, 0);
    x.quadraticCurveTo(0, -wid, len, 0);
    x.quadraticCurveTo(0, wid, -len, 0);
    x.fill();
    x.strokeStyle = 'rgba(108,118,78,0.6)';
    x.lineWidth = 0.8;
    x.beginPath(); x.moveTo(-len, 0); x.lineTo(len, 0); x.stroke();
    x.restore();
  }
  const t = canvasTex(c, { srgb: true });
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}

function addLeafCard(batch, x, y, z, ry, sx, sy, tint) {
  const g = new THREE.PlaneGeometry(1.45 * sx, 0.95 * sy, 1, 1);
  batch.add(g, matrixTRS(x, y, z, 0.2 + 0.3 * Math.sin(ry), ry, 0.2 * Math.cos(ry)));
}

function buildWillow(x, z, scale, seed) {
  const R = mulberry32(seed);
  const y = heightAt(x, z);
  const wood = new GeoBatch();
  const leaves = new GeoBatch();
  const trunkH = (4.8 + R() * 2.0) * scale;
  const trunkR = 0.24 * scale;
  const yaw = R() * TAU;
  /* a short, knuckled trunk with visible roots */
  wood.add(new THREE.CylinderGeometry(trunkR * 0.58, trunkR, trunkH * 0.72, 10), matrixTRS(0, trunkH * 0.36, 0, 0.05, 0, 0.03));
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + R() * 0.5;
    wood.add(new THREE.CylinderGeometry(0.04 * scale, 0.13 * scale, 0.8 * scale, 6),
      matrixTRS(Math.cos(a) * 0.24 * scale, 0.12, Math.sin(a) * 0.24 * scale, Math.PI / 2.4, a, 0));
  }
  const branches = [];
  const nb = 7;
  for (let i = 0; i < nb; i++) {
    const a = i / nb * TAU + R() * 0.7;
    const base = new THREE.Vector3(0, trunkH * (0.5 + R() * 0.22), 0);
    const end = new THREE.Vector3(Math.cos(a) * (1.8 + R() * 2.0) * scale, trunkH * (0.9 + R() * 0.3), Math.sin(a) * (1.8 + R() * 2.0) * scale);
    const mid = base.clone().add(end).multiplyScalar(0.5);
    mid.y += 0.45 * scale;
    const curve = new THREE.QuadraticBezierCurve3(base, mid, end);
    wood.add(new THREE.TubeGeometry(curve, 8, 0.078 * scale, 5, false));
    branches.push(end);
    /* a secondary split on each main limb */
    if (R() < 0.8) {
      const tip = end.clone().add(new THREE.Vector3((R() - 0.5) * 1.5 * scale, 0.6 * scale, (R() - 0.5) * 1.5 * scale));
      wood.add(new THREE.CylinderGeometry(0.022 * scale, 0.05 * scale, tip.distanceTo(end), 4), matrixTRS(
        (end.x + tip.x) * 0.5, (end.y + tip.y) * 0.5, (end.z + tip.z) * 0.5, 0, Math.atan2(tip.x - end.x, tip.z - end.z), 0));
      branches.push(tip);
    }
    for (let k = 0; k < 4; k++) {
      const t = 0.5 + k * 0.15;
      const p = curve.getPoint(t);
      addLeafCard(leaves, p.x, p.y + 0.3 * scale, p.z, R() * TAU, 1.25 + R() * 0.9, 1.0 + R() * 0.6, 0);
    }
  }
  const cards = 46;
  for (let i = 0; i < cards; i++) {
    const b = branches[i % branches.length];
    const rr = (0.3 + R() * 1.9) * scale;
    const a = R() * TAU;
    const droop = (i % 5 === 0) ? -0.7 * scale : (R() - 0.5) * 1.4 * scale;
    addLeafCard(leaves, b.x + Math.cos(a) * rr, b.y + droop + 0.2, b.z + Math.sin(a) * rr, a, 1.55 + R() * 1.1, 1.15 + R() * 0.8, 0);
  }
  /* low undergrowth at the foot of the tree */
  for (let i = 0; i < 5; i++) {
    const a = R() * TAU, rr = (0.5 + R() * 1.3) * scale;
    addLeafCard(leaves, Math.cos(a) * rr, 0.5 + R() * 0.8, Math.sin(a) * rr, R() * TAU, 0.9 + R() * 0.7, 0.7 + R() * 0.5, 0);
  }
  /* a dense, rounded crown so the tree never reads as bare sticks */
  for (let i = 0; i < 14; i++) {
    const a = R() * TAU, rr = (0.2 + R() * 1.4) * scale;
    addLeafCard(leaves, Math.cos(a) * rr, trunkH * (0.88 + R() * 0.22), Math.sin(a) * rr, a, 2.0 + R() * 1.2, 1.6 + R() * 0.9, 0);
  }
  const wm = wood.build(MAT.bark || MAT.wood, { cast: true, receive: true });
  const lm = leaves.build(VEG.leafMat, { cast: true, receive: true });
  const m = matrixTRS(x, y, z, 0, yaw, 0);
  if (wm) VEG.treeBarkBatch.add(wm.geometry, m);
  if (lm) VEG.treeLeafBatch.add(lm.geometry, m);
  VEG.trees.push({ x, z, y, scale });
  addCapsule(x, y, z, x, y + trunkH, z, trunkR + 0.25);
  addSphere(x, y + trunkH * 0.9, z, 2.2 * scale);
}

function buildPoplar(x, z, scale, seed) {
  const R = mulberry32(seed);
  const y = heightAt(x, z);
  const wood = new GeoBatch();
  const leaves = new GeoBatch();
  const h = (10 + R() * 4.0) * scale;
  const yaw = R() * TAU;
  wood.add(new THREE.CylinderGeometry(0.09 * scale, 0.30 * scale, h * 0.92, 9), matrixTRS(0, h * 0.46, 0, 0, 0, 0));
  /* a few upright limbs */
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + R();
    const b0 = new THREE.Vector3(0, h * (0.38 + R() * 0.16), 0);
    const b1 = new THREE.Vector3(Math.cos(a) * (1.2 + R() * 1.0) * scale, h * (0.72 + R() * 0.18), Math.sin(a) * (1.2 + R() * 1.0) * scale);
    wood.add(new THREE.CylinderGeometry(0.025 * scale, 0.085 * scale, b1.distanceTo(b0), 5), matrixTRS((b0.x + b1.x) / 2, (b0.y + b1.y) / 2, (b0.z + b1.z) / 2, 0.2 * Math.cos(a), a, 0.2 * Math.sin(a)));
  }
  for (let i = 0; i < 78; i++) {
    const t = 0.20 + R() * 0.76;
    const a = R() * TAU;
    const rr = (0.30 + R() * 1.35) * scale * (1 - Math.abs(t - 0.66) * 0.75);
    addLeafCard(leaves, Math.cos(a) * rr, h * t, Math.sin(a) * rr, a, 0.9 + R() * 0.65, 0.8 + R() * 0.5, 0);
  }
  for (let i = 0; i < 12; i++) {
    const a = R() * TAU, rr = (0.15 + R() * 0.8) * scale;
    addLeafCard(leaves, Math.cos(a) * rr, h * (0.72 + R() * 0.24), Math.sin(a) * rr, a, 1.8 + R() * 0.9, 1.5 + R() * 0.7, 0);
  }
  const wm = wood.build(MAT.bark || MAT.wood, { cast: true, receive: true });
  const lm = leaves.build(VEG.leafMat, { cast: true, receive: true });
  const m = matrixTRS(x, y, z, 0, yaw, 0);
  if (wm) VEG.treeBarkBatch.add(wm.geometry, m);
  if (lm) VEG.treeLeafBatch.add(lm.geometry, m);
  VEG.trees.push({ x, z, y, scale });
  addCapsule(x, y, z, x, y + h * 0.8, z, 0.35 * scale);
  addSphere(x, y + h * 0.65, z, 1.6 * scale);
}

function buildDistantTree(x, z, scale, seed) {
  const R = mulberry32(seed);
  const y = heightAt(x, z);
  const h = (4 + R() * 6) * scale;
  VEG.treeBarkBatch.add(new THREE.CylinderGeometry(0.06 * scale, 0.18 * scale, h, 5), matrixTRS(x, y + h * 0.5, z, 0, R() * TAU, 0));
  const n = 3 + Math.floor(R() * 3);
  for (let i = 0; i < n; i++) {
    const a = R() * TAU, rr = (0.3 + R() * 1.2) * scale;
    VEG.treeLeafBatch.add(new THREE.PlaneGeometry(1.7 * scale, 1.2 * scale, 1, 1),
      matrixTRS(x + Math.cos(a) * rr, y + h * (0.55 + R() * 0.35), z + Math.sin(a) * rr, 0.1, a, 0.1));
  }
  VEG.trees.push({ x, z, y, scale, distant: true });
}

function buildTrees() {
  /* bark material with a bit of broken colour, never a flat tube */
  if (!MAT.bark) {
    MAT.bark = bindCloudShadow(makeStandard({
      map: TEX.wood, normalMap: TEX.woodNormal, color: 0x7f735f, roughness: 0.9
    }), 'bark');

  if (!VEG.leafMat) {
    VEG.leafTex = makeLeafTexture();
    VEG.leafMat = new THREE.MeshLambertMaterial({
      map: VEG.leafTex, alphaTest: 0.38, side: THREE.DoubleSide, alphaToCoverage: true,
      color: 0xe8e6bc, transparent: false
    });
    VEG.leafMat.onBeforeCompile = (shader) => {
      shader.uniforms.uPhase = ENV_U.uPhase;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nuniform float uPhase;')
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          {
            vec4 wp = modelMatrix * vec4(transformed, 1.0);
            float sway = sin(6.2831853 * (uPhase * 17.0) + wp.x * 0.09 + wp.z * 0.07)
                       + 0.5 * sin(6.2831853 * (uPhase * 29.0) + wp.x * 0.23);
            float amt = clamp(transformed.y * 0.04, 0.0, 0.20);
            transformed.x += sway * amt;
            transformed.z += cos(6.2831853 * uPhase * 23.0 + wp.x * 0.14) * amt * 0.7;
          }`);
    };
    VEG.leafMat.customProgramCacheKey = () => 'crane-leaves-v1';

  VEG.treeBarkBatch = new GeoBatch();

  /* camp seep grove */
  buildWillow(-604, 208, 1.05, SEED ^ 0x8101);
  buildWillow(-592, 219, 0.85, SEED ^ 0x8102);
  buildWillow(-617, 225, 0.75, SEED ^ 0x8103);
  buildWillow(-632, 201, 0.9, SEED ^ 0x8106);
  buildWillow(-578, 197, 0.72, SEED ^ 0x8107);
  buildWillow(-686, 245, 1.1, SEED ^ 0x8108);
  buildWillow(-655, 219, 0.8, SEED ^ 0x8109);
  buildPoplar(-704, 270, 1.05, SEED ^ 0x8110);
  /* the eastern shore willows */
  buildWillow(462, 334, 0.8, SEED ^ 0x8104);
  buildWillow(492, 336, 0.65, SEED ^ 0x8105);
  buildWillow(530, 334, 0.75, SEED ^ 0x8111);
  buildWillow(626, 302, 0.9, SEED ^ 0x8112);
  buildWillow(602, 332, 0.8, SEED ^ 0x8113);
  buildWillow(640, 300, 0.7, SEED ^ 0x8114);
  /* old track and meadow trees */
  buildPoplar(-318, 402, 1.0, SEED ^ 0x8201);
  buildWillow(190, 330, 0.75, SEED ^ 0x8202);
  buildPoplar(-790, 300, 1.1, SEED ^ 0x8203);
  buildPoplar(-844, 285, 0.9, SEED ^ 0x8204);
  buildPoplar(-902, 272, 1.0, SEED ^ 0x8205);
  buildPoplar(330, 340, 0.85, SEED ^ 0x8206);
  buildWillow(366, 350, 0.72, SEED ^ 0x8207);
  buildPoplar(-360, 430, 0.8, SEED ^ 0x8208);
  /* a distant tree belt at the foot of the escarpment and along the far plain */
  for (let i = 0; i < 58; i++) {
    const x = -2100 + (i / 57) * 4200 + (rand(-1, 1) * 40);
    const z = -1010 - rand(0, 280);
    buildDistantTree(x, z, 0.7 + rand(0, 0.9), SEED ^ (0x8300 + i * 17));
  }
  /* a handful of field trees off the flight line, each with a real trunk */
  buildPoplar(-366, 578, 0.9, SEED ^ 0x8501);
  buildWillow(-540, 512, 0.8, SEED ^ 0x8502);
  buildPoplar(64, 604, 0.85, SEED ^ 0x8503);
  buildPoplar(-706, 486, 0.95, SEED ^ 0x8504);
  buildWillow(238, 522, 0.75, SEED ^ 0x8505);
  buildPoplar(-772, 548, 0.8, SEED ^ 0x8506);
  const bark = VEG.treeBarkBatch.build(MAT.bark, { cast: true, receive: true });
  const leaves = VEG.treeLeafBatch.build(VEG.leafMat, { cast: true, receive: true });
  for (const m of [bark, leaves]) {
    if (!m) continue;
    m.layers.set(0);
    m.castShadow = true;
    m.receiveShadow = true;
    SCENE.add(m);
  }
  VEG.counts.trees = VEG.trees.length;
}


/* --------------------------------------------------------------- flowers */
function scatterWildflowers() {
  const target = Math.round(PROBE_LOW ? 12000 : 18000);
  const R = mulberry32(SEED ^ 0x71f1);
  const list = [];
  let tries = 0;
  while (list.length < target && tries < target * 8) {
    tries++;
    const x = -1250 + R() * 2100;
    const z = 130 + R() * 700;
    const q = lakeQ(x, z);
    const h = heightAt(x, z);
    if (h < 0.9 || h > 8.5 || q < 1.07) continue;
    if (trackDistance(x, z) < 2.2) continue;
    const c = LAYOUT.lake.camp;
    if (Math.hypot(x - c.x, z - c.z) < 24) continue;
    if (!nearTree(x, z, 1.2)) continue;
    const patch = 0.5 + 0.5 * fbm2(x * 0.02 + 4.7, z * 0.02 - 2.1, 2);
    if (R() > 0.25 + patch * 0.55) continue;
    const tint = R();
    list.push(cardInstance(x, z, R, {
      stiff: 0.22, scale: 0.20 + R() * 0.16,
      tintR: 0.92 + tint * 0.08, tintG: 0.92 + (1 - tint) * 0.07, tintB: 0.92 + R() * 0.08
    }));
  }
  const geo = cardTuftGeometry(SEED ^ 0x71f1);
  const mat = makeCardMaterial('flower');
  makeCardMesh(geo, mat, list);
  VEG.counts.flower = list.length;
}

/* ------------------------------------------------------------------- build */
function buildVegetation() {
  buildTrees();
  scatterFeathergrass();
  scatterGrazedGrass();
  scatterReeds();
  scatterShrubs();
  scatterWildflowers();
  VEG.counts.total = (VEG.counts.feather || 0) + (VEG.counts.grazed || 0) + (VEG.counts.reed || 0) + (VEG.counts.shrub || 0) + (VEG.counts.flower || 0);
}

/* ==========================================================================
   07 — the living cast: seven demoiselle cranes on one circuit, two horses
        in their own grazed clearings, and the pair of swans whose wakes
        are painted into the single water surface.
   ========================================================================== */

const CRANES = { list: [], curve: null, length: 0 };
const HORSES = [];
const SWANS = [];
const BIRDS = { cranes: [], horses: [], swans: [] };

/* ---------------------------------------------------------- crane geometry */
function coloredGeo(geo, hex) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const n = g.attributes.position.count;
  const c = new THREE.Color(hex);
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return g;
}

function craneWingGeo(side) {
  const parts = [];
  const pale = 0xc9cfcd, dark = 0x242a2d;
  const x0 = 0, x1 = 0.60 * side, x2 = 1.04 * side;
  const quad = (ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz, col) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([ax, ay, az, bx, by, bz, cx, cy, cz, ax, ay, az, cx, cy, cz, dx, dy, dz], 3));
    g.computeVertexNormals();
    parts.push(coloredGeo(g, col));
  };
  quad(x0, 0, 0.15, x1, 0.03, 0.10, x1, 0.03, -0.12, x0, 0, -0.19, pale);
  quad(x1, 0.03, 0.10, x2, 0.06, 0.045, x2, 0.06, -0.075, x1, 0.03, -0.12, pale);
  /* dark trailing edge of the outer wing */
  quad(x1, 0.028, -0.115, x2, 0.058, -0.07, x2 * 0.97, 0.058, -0.115, x1 * 0.98, 0.028, -0.16, dark);
  /* separated primaries like black fingers */
  for (let i = 0; i < 5; i++) {
    const t = i / 4;
    const bx = x2 - 0.01 * side;
    const bz = 0.045 - t * 0.12;
    const len = 0.22 + 0.16 * (1 - t);
    const spread = (t - 0.5) * 0.18;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([
      bx, 0.06, bz,
      bx + side * len, 0.05 + spread * 0.1, bz - 0.055 + spread,
      bx + side * len * 0.8, 0.05, bz - 0.10 + spread
    ], 3));
    g.computeVertexNormals();
    parts.push(coloredGeo(g, dark));
  }
  return mergeGeos(parts);
}

const CRANE_GEO = {};
const CRANE_MAT = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, fog: true });
function buildCraneGeometries() {
  const parts = [];
  const add = (geo, hex, mat) => {
    const g = geo.clone();
    if (mat) g.applyMatrix4(mat);
    parts.push(coloredGeo(g, hex));
  };
  const grey = 0x9fa6a8, black = 0x1c2225, white = 0xe9e6da, beakC = 0x3b3a33, legC = 0x24201c;
  const body = new THREE.SphereGeometry(1, 16, 11); body.scale(0.255, 0.195, 0.53);
  add(body, grey);
  const breast = new THREE.SphereGeometry(0.135, 10, 8); breast.scale(0.82, 1.3, 0.9); breast.translate(0, 0.03, 0.31);
  add(breast, black);
  const neckPts = [new THREE.Vector3(0, 0.10, 0.38), new THREE.Vector3(0, 0.22, 0.56), new THREE.Vector3(0, 0.38, 0.70), new THREE.Vector3(0, 0.48, 0.80)];
  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(neckPts), 7, 0.042, 6, false), black);
  const head = new THREE.SphereGeometry(0.072, 10, 8); head.translate(0, 0.51, 0.84);
  add(head, black);
  const beak = new THREE.ConeGeometry(0.025, 0.16, 6); beak.rotateX(PI / 2); beak.translate(0, 0.49, 0.95);
  add(beak, beakC);
  for (const s of [-1, 1]) {
    const plume = new THREE.ConeGeometry(0.017, 0.15, 4); plume.rotateZ(s * 0.7); plume.translate(s * 0.045, 0.535, 0.82);
    add(plume, white);
    const stripe = new THREE.SphereGeometry(0.026, 6, 5); stripe.scale(1.8, 0.55, 1.1); stripe.translate(s * 0.045, 0.525, 0.90);
    add(stripe, white);
    const leg = new THREE.CylinderGeometry(0.011, 0.008, 0.72, 5); leg.rotateX(-PI / 2 + 0.18); leg.translate(s * 0.08, -0.04, -0.32);
    add(leg, legC);
    const foot = new THREE.BoxGeometry(0.05, 0.016, 0.12); foot.translate(s * 0.08, -0.10, -0.66);
    add(foot, legC);
  }
  for (let i = 0; i < 4; i++) {
    const f = new THREE.PlaneGeometry(0.09, 0.26); f.rotateX(-PI / 2 + 0.18); f.rotateZ((i - 1.5) * 0.14); f.translate((i - 1.5) * 0.045, -0.02, -0.52);
    add(f, black);
  }
  CRANE_GEO.body = mergeGeos(parts);
  CRANE_GEO.wingL = craneWingGeo(-1);
  CRANE_GEO.wingR = craneWingGeo(1);
}

function buildCrane(index) {
  const g = new THREE.Group();
  g.name = 'crane-' + index;
  const core = new THREE.Group();
  g.add(core);
  const body = new THREE.Mesh(CRANE_GEO.body, CRANE_MAT);
  body.castShadow = true;
  body.layers.set(0);
  core.add(body);
  const wings = [];
  for (const s of [-1, 1]) {
    const shoulder = new THREE.Group();
    shoulder.position.set(s * 0.20, 0.09, 0.04);
    core.add(shoulder);
    const wing = new THREE.Mesh(s < 0 ? CRANE_GEO.wingL : CRANE_GEO.wingR, CRANE_MAT);
    wing.castShadow = true;
    wing.layers.set(0);
    shoulder.add(wing);
    wings.push({ shoulder, side: s });
  }
  g.userData.index = index;
  g.scale.setScalar(2.0);
  SCENE.add(g);
  return { group: g, core, wings, index };
}

function buildCranes() {
  buildCraneGeometries();
  const knots = [
    [-480, 40, 200], [-410, 42, 160], [-300, 45, 110], [-160, 48, 80],
    [0, 49, 65], [130, 47, 95], [180, 44, 160], [120, 40, 225],
    [0, 38, 265], [-150, 36, 282], [-300, 37, 270], [-410, 39, 230]
  ];
  CRANES.curve = makeClosedCurve(knots, 0.5);
  CRANES.length = CRANES.curve.getLength();
  for (let i = 0; i < 7; i++) {
    const c = buildCrane(i);
    c.phase = i * 0.0042;
    c.lateral = [0, -2.6, 2.8, -5.2, 5.4, -8.2, 8.4][i];
    c.vertical = [0, 0.5, -0.2, 0.9, 0.1, 1.4, 0.4][i];
    c.beat = i * 0.86;
    c.bob = i * 1.7;
    CRANES.list.push(c);
  }
}
/* ----------------------------------------------------------- horse model */
function buildHorse(cfg) {
  const R = mulberry32(SEED ^ (0x5100 + cfg.index * 37));
  const g = new THREE.Group();
  const y = heightAt(cfg.x, cfg.z);

  const coat = new THREE.MeshStandardMaterial({

  const dark = new THREE.MeshStandardMaterial({ color: cfg.dark, roughness: 0.8 });

  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0e0d0b, roughness: 0.28 });

  const bodyG = new THREE.Group();

  for (const s of [-1, 1]) {

  const neckMesh = neckGeo.build(coat, { cast: true, receive: true });
  neck.add(neckMesh);
  const mane = new GeoBatch();
  for (let i = 0; i < 16; i++) {

  }
  neck.add(mane.build(MAT.mane, { cast: true, receive: true }));

  /* head, cheeks, jaw */
  const head = new THREE.Group();

  neck.add(head);
  const skull = new GeoBatch();
  skull.add(new THREE.SphereGeometry(1, 16, 12), matrixTRS(0, 0.02, 0.02, 0, 0, 0, 0.17, 0.21, 0.33));
  for (const s of [-1, 1]) {
    skull.add(new THREE.SphereGeometry(1, 12, 9), matrixTRS(s * 0.13, -0.05, 0.10, 0, 0, 0, 0.08, 0.11, 0.17));

  const face = new GeoBatch();

  const forelock = new GeoBatch();

  }
  head.add(forelock.build(MAT.mane, { cast: true, receive: true }));

  /* four legs, each a single pivoting pair with a built-in bend */
  const legs = [];
  const legDefs = [
    [-0.25, 0.52, 1], [0.25, 0.52, -1], [-0.25, -0.55, 1], [0.25, -0.55, -1]
  ];
  for (let i = 0; i < 4; i++) {
    const [lx, lz, side] = legDefs[i];
    const hip = new THREE.Group();
    hip.position.set(lx, 0.98, lz);
    bodyG.add(hip);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.072, 0.50, 8), coat);
    upper.position.y = -0.25;
    upper.castShadow = true;
    hip.add(upper);
    const lowerMesh = new GeoBatch();
    lowerMesh.add(new THREE.CylinderGeometry(0.063, 0.043, 0.44, 7), matrixTRS(0, -0.69, 0.015, 0.035, 0, 0));
    lowerMesh.add(new THREE.CylinderGeometry(0.070, 0.090, 0.11, 8), matrixTRS(0, -0.93, 0.03, 0, 0, 0));
    hip.add(lowerMesh.build(legMat, { cast: true, receive: true }));
    legs.push({ hip, isFront: i < 2, side });
  }
  /* tail: core and a full fall of hair */
  const tail = new THREE.Group();
  tail.position.set(0, 1.33, -0.88);
  bodyG.add(tail);
  const tailGeo = new GeoBatch();
  tailGeo.add(new THREE.CylinderGeometry(0.045, 0.065, 0.55, 7), matrixTRS(0, -0.24, 0, 0.22, 0, 0));
  for (let i = 0; i < 14; i++) {
    tailGeo.add(new THREE.ConeGeometry(0.018, 0.58 + R() * 0.34, 4),
      matrixTRS((R() - 0.5) * 0.13, -0.58 - R() * 0.16, (R() - 0.5) * 0.10, (R() - 0.5) * 0.3, 0, (R() - 0.5) * 0.22));
  }
  tail.add(tailGeo.build(MAT.mane, { cast: true, receive: true }));

  /* tack: one horse is saddled, the other wears a rope halter */
  if (!cfg.foal) {
    if (cfg.index === 0) {
      const blanket = new THREE.Mesh(new THREE.PlaneGeometry(0.74, 1.25, 4, 4), MAT.kilim);
      blanket.rotation.x = -PI / 2;
      blanket.position.set(0, 1.61, 0.04);
      blanket.castShadow = true;
      blanket.layers.set(0);
      bodyG.add(blanket);
      const saddle = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.24, 0.44, 10), MAT.leather);
      saddle.rotation.z = PI / 2;
      saddle.scale.z = 0.72;
      saddle.position.set(0, 1.73, 0.06);
      saddle.castShadow = true;
      bodyG.add(saddle);
      const straps = new GeoBatch();
      straps.add(new THREE.TorusGeometry(0.46, 0.020, 5, 18), matrixTRS(0, 1.13, 0.02, PI / 2, 0, 0, 1, 1, 1.28));
      for (const s of [-1, 1]) {
        straps.add(new THREE.BoxGeometry(0.025, 0.42, 0.03), matrixTRS(s * 0.37, 1.28, 0.06, 0, 0, s * 0.08));
        straps.add(new THREE.BoxGeometry(0.025, 0.62, 0.025), matrixTRS(s * 0.16, 1.82, 0.50, 0.5, 0, s * 0.06));
      }
      const reins = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(0.12, 1.95, 0.94), new THREE.Vector3(0.30, 1.70, 0.70), new THREE.Vector3(0.24, 1.55, 0.28));
      straps.add(new THREE.TubeGeometry(reins, 8, 0.014, 4, false));
      bodyG.add(straps.build(MAT.leather, { cast: true, receive: true }));
      const stirrups = new GeoBatch();
      for (const s of [-1, 1]) {
        stirrups.add(new THREE.TorusGeometry(0.055, 0.012, 4, 10), matrixTRS(s * 0.40, 1.18, 0.02, 0, PI / 2, 0));
      }
      bodyG.add(stirrups.build(MAT.hoof, { cast: true, receive: true }));
    } else {
      const halter = new GeoBatch();
      halter.add(new THREE.TorusGeometry(0.16, 0.014, 5, 16), matrixTRS(0, 2.02, 0.92, 1.0, 0, 0, 1, 0.85, 1));
      halter.add(new THREE.BoxGeometry(0.02, 0.34, 0.02), matrixTRS(0, 1.90, 1.03, 0.4, 0, 0));
      bodyG.add(halter.build(MAT.leather, { cast: true, receive: true }));
    }
  }

  const horse = {
    index: cfg.index, group: g, bodyG, neck, head, legs, tail, ears, coat,
    foal: !!cfg.foal, horseScale,
    base: { x: cfg.x, z: cfg.z, yaw: cfg.yaw },
    phase: cfg.headPhase, speed: cfg.speed,
    graze: 0, walk: 0
  };
  HORSES.push(horse);
  BIRDS.horses.push(horse);
  return horse;
}

/* ---------------------------------------------------------- crane flight */
function craneState(index, phase, out = {}) {
  const c = CRANES.list[index];
  let p, t;
  if (FLIGHT.curve) {
    /* ride in the authored forward view, a little ahead and above the low
       camera; the camera itself stays on its own path and framing */
    const u = flightU(phase);
    p = FLIGHT.curve.getPointAt(u);
    const uBack = wrapTurns(u - 0.008);
    const pBack = FLIGHT.curve.getPointAt(uBack);
    t = p.clone().sub(pBack).normalize();
    t.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.12 * Math.sin(TAU * (phase + 0.25))).normalize();
    const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), t).normalize();
    const dist = 110.0 + 35.0 * Math.sin(TAU * (phase + 0.10));
    const side = 26.0 * Math.sin(TAU * (phase * 2 + 0.35)) + c.lateral * 0.60 + 4.0 * Math.sin(TAU * (phase * 3 + index * 0.40));
    p.addScaledVector(t, dist);
    p.addScaledVector(right, side);
    p.y += 15.0 + 6.0 * Math.sin(TAU * (phase + 0.60)) + 1.5 * Math.sin(TAU * (phase * 2 + index * 0.25));
  } else {
    const u = wrapTurns(phase + c.phase - 0.045);
    p = CRANES.curve.getPointAt(u);
    t = CRANES.curve.getTangentAt(u).normalize();
    p.y += c.vertical;
  }
  const right = new THREE.Vector3().crossVectors(t, new THREE.Vector3(0, 1, 0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, t).normalize();
  const bob = Math.sin(TAU * (phase * 40 + c.bob)) * 0.16;
  p.y += c.vertical * 0.5 + bob * 0.5;
  out.p = p;
  out.t = t;
  out.right = right;
  out.up = up;
  return out;
}

const _craneTmp = { p: new THREE.Vector3(), t: new THREE.Vector3(), right: new THREE.Vector3(), up: new THREE.Vector3() };
function updateCranes() {
  const ph = SIM.t / LOOP_SECONDS;
  for (let i = 0; i < CRANES.list.length; i++) {
    const c = CRANES.list[i];
    const st = craneState(i, ph, _craneTmp);
    /* a gentle independent bank; the camera is not tracking the flock */
    const bank = 0.16 * Math.sin(TAU * (ph * 3 + i * 0.17));

    /* wings: 40 beats per 60 s loop, with two glide passages */
    const glide = smoothstep(0.55, 0.92, 0.5 + 0.5 * Math.sin(TAU * (ph * 2 + i * 0.13)));
    const beat = TAU * (ph * 40 + c.beat / TAU);
    const flap = (0.62 * Math.sin(beat) + 0.08) * (1 - glide * 0.82) + 0.16 * glide;
    const elbowFlap = (0.30 * Math.sin(beat - 0.7) + 0.05) * (1 - glide * 0.7) + 0.06 * glide;

    /* orient: local +Z forward, +X right, rolled by the turn */
    const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), st.t).normalize();
    const baseUp = new THREE.Vector3().crossVectors(st.t, right).normalize();
    const qBank = new THREE.Quaternion().setFromAxisAngle(st.t, bank);
    const up = baseUp.clone().applyQuaternion(qBank);
    const rightB = right.clone().applyQuaternion(qBank);
    const m = new THREE.Matrix4().makeBasis(rightB, up, st.t);
    c.group.position.copy(st.p);
    c.group.quaternion.setFromRotationMatrix(m);
    c.group.updateMatrixWorld();
    const pitch = 0.07 * Math.sin(beat * 0.5);
    c.core.rotation.x = pitch;
    for (const w of c.wings) {
      w.shoulder.rotation.z = w.side < 0 ? -flap : flap;
      w.shoulder.rotation.x = 0.02 * Math.sin(beat + 0.8) + elbowFlap * 0.20;
      w.shoulder.rotation.y = (w.side < 0 ? 1 : -1) * (0.08 + 0.05 * Math.sin(beat));
    }
    c.phaseGlide = glide;
  }
}

/* ----------------------------------------------------------- horse update */
function updateHorses() {
  const t = SIM.t;
  for (const h of HORSES) {
    const ph = t / LOOP_SECONDS;
    /* a 24 s grazing cycle; each horse (and the foal) on its own phase */
    const cyc = wrapTurns(ph * 4 + h.phase * 0.25);
    let headUp = smoothPulse(cyc, 0.62, 0.105) * 0.95 + smoothPulse(cyc, 0.34, 0.045) * 0.15;
    if (h.foal) headUp *= 0.80;
    const graze = 1 - headUp;
    h.graze = graze;
    h.neck.rotation.x = lerp(1.02, 0.06, headUp);
    h.neck.rotation.z = lerp(0.02, -0.08, headUp) * (h.index % 2 ? -1 : 1);
    h.head.rotation.x = lerp(0.28, -0.10, headUp);
    h.head.rotation.y = Math.sin(TAU * (ph * 6 + h.phase)) * 0.10 * headUp;
    h.head.rotation.z = Math.sin(TAU * (ph * 5 + h.phase)) * 0.02;
    /* breathing, weight shift and a slow tail swish */
    h.bodyG.position.x = Math.sin(TAU * (ph * 3 + h.phase)) * 0.025;
    h.bodyG.rotation.z = Math.sin(TAU * (ph * 3 + h.phase)) * 0.010;
    h.bodyG.scale.y = 1 + Math.sin(TAU * (ph * 24 + h.phase)) * 0.004;
    const tailSpeed = h.foal ? 17 : 11;
    h.tail.rotation.z = Math.sin(TAU * (ph * tailSpeed + h.phase * 1.7)) * (h.foal ? 0.32 : 0.22) + 0.05;
    h.tail.rotation.x = Math.sin(TAU * (ph * 8 + h.phase)) * 0.10;
    /* ears flick independently, faster on the foal */
    for (let i = 0; i < h.ears.length; i++) {
      const flick = smoothPulse(cyc, 0.18 + i * 0.47, 0.035) * (h.foal ? 1.3 : 0.85);
      h.ears[i].rotation.z = (i ? -1 : 1) * (0.16 + flick * 0.22);
      h.ears[i].rotation.x = -flick * 0.15;
    }
    /* feet stay planted; the grazing horse shifts weight now and then */
    for (let i = 0; i < h.legs.length; i++) {
      const leg = h.legs[i];
      const shift = smoothPulse(cyc, 0.72 + i * 0.04, 0.05);
      leg.hip.rotation.x = lerp(0, (leg.isFront ? -0.10 : 0.12), shift * 0.5);
      leg.hip.rotation.z = (i === 0 ? 0.035 + shift * 0.03 : 0);
    }
    h.group.rotation.y = h.base.yaw + Math.sin(TAU * (ph * 4 + h.phase)) * 0.018;
  }
}

/* ------------------------------------------------------------ swan travel */
function swanCurvePoint(index, phase, out) {
  const ph = wrapTurns(phase);
  const a = ph * TAU;
  const isYoung = index >= 2;
  const lag = isYoung ? 0.010 + (index - 2) * 0.006 : (index === 1 ? 0.006 : 0);
  const aa = a - lag * TAU;
  const rx = isYoung ? 80 : 92, rz = isYoung ? 34 : 40;
  const cx = -386, cz = 58;
  out.x = cx + Math.cos(aa) * rx + Math.sin(aa * 2.0) * 8;
  out.z = cz + Math.sin(aa) * rz + Math.cos(aa * 3.0) * 5;
  out.heading = Math.atan2(-Math.sin(aa + 0.001) * rx, Math.cos(aa + 0.001) * rz);
  return out;
}

function swanWakePoints(t, span, step) {
  const pts = [];
  const out = { x: 0, z: 0, heading: 0 };
  const n = Math.ceil(span / step);
  for (let i = 0; i <= n; i++) {
    const age = i * step;
    const tt = ((t - age) % LOOP_SECONDS + LOOP_SECONDS) % LOOP_SECONDS;
    for (let k = 0; k < 2; k++) {
      swanCurvePoint(k, tt / LOOP_SECONDS, out);
      pts.push({ x: out.x, z: out.z, age, strength: k === 0 ? 1.0 : 0.72 });
    }
  }
  return pts;
}

function updateSwans() {
  const ph = SIM.t / LOOP_SECONDS;
  const out = { x: 0, z: 0, heading: 0 };
  for (let i = 0; i < SWANS.length; i++) {
    swanCurvePoint(i, ph, out);
    const s = SWANS[i];
    s.group.position.set(out.x, WATER.level + 0.03 + Math.sin(TAU * (ph * 12 + i)) * 0.008, out.z);
    const tw = swanCurvePoint(i, ph + 0.001, { x: 0, z: 0, heading: 0 });
    const hd = Math.atan2(tw.x - out.x, tw.z - out.z);
    s.group.rotation.y = hd;
    s.group.rotation.z = Math.sin(TAU * (ph * 9 + i)) * 0.025;
    s.group.children[0].position.y = 0.20 + Math.sin(TAU * (ph * 11 + i * 0.8)) * 0.012;
    if (i < 2) {
      /* the adults occasionally dip their heads */
      const dip = smoothPulse(ph * 4, 0.2 + i * 0.12, 0.10);
      s.group.children[1].rotation.x = dip * 0.5;
    }
  }
}

function tintGeo(geo, hex) {
  const c = new THREE.Color(hex);
  const n = geo.attributes.position.count;
  const a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return geo;
}
function part(batch, geo, matrix, hex) {
  tintGeo(geo, hex);
  batch.add(geo, matrix);
}

  return b.build(WILD_MAT, { cast: true, receive: true }).geometry;
}

function buildFox() {
  const g = new THREE.Group();
  const b = new GeoBatch();
  const rust = 0xa9572c, pale = 0xdfc9a8, dark = 0x241a12, white = 0xefe6d4;
  part(b, new THREE.SphereGeometry(1, 12, 9), matrixTRS(0, 0.50, 0, 0, 0, 0, 0.17, 0.20, 0.44), rust);
  part(b, new THREE.SphereGeometry(1, 10, 8), matrixTRS(0, 0.46, 0.12, 0, 0, 0, 0.13, 0.14, 0.30), pale);
  part(b, new THREE.SphereGeometry(1, 10, 8), matrixTRS(0, 0.64, 0.40, 0, 0, 0, 0.13, 0.13, 0.17), rust);
  part(b, new THREE.ConeGeometry(0.055, 0.20, 6), matrixTRS(0, 0.59, 0.57, 1.25, 0, 0), pale);
  for (const s of [-1, 1]) {
    part(b, new THREE.ConeGeometry(0.055, 0.20, 5), matrixTRS(s * 0.075, 0.78, 0.38, -0.1, 0, s * -0.2), rust);
    part(b, new THREE.CylinderGeometry(0.030, 0.020, 0.50, 5), matrixTRS(s * 0.10, 0.25, 0.24, 0, 0, 0), dark);
    part(b, new THREE.CylinderGeometry(0.030, 0.020, 0.50, 5), matrixTRS(s * 0.10, 0.25, -0.22, 0, 0, 0), dark);
  }
  const body = b.build(WILD_MAT, { cast: true, receive: true });
  g.add(body);
  const tail = new THREE.Group();
  tail.position.set(0, 0.56, -0.40);
  const t = new GeoBatch();
  part(t, new THREE.ConeGeometry(0.13, 0.72, 7), matrixTRS(0, 0.10, -0.28, -1.0, 0, 0), rust);
  part(t, new THREE.SphereGeometry(0.10, 8, 6), matrixTRS(0, 0.42, -0.48), white);
  tail.add(t.build(WILD_MAT, { cast: true, receive: true }));
  g.add(tail);
  g.scale.setScalar(1.4);
  g.layers.set(0);
  SCENE.add(g);
  WILD.fox = { group: g, tail };
}

function buildEagles() {
  const dark = new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 0.85 });
  const pale = new THREE.MeshStandardMaterial({ color: 0x8a7150, roughness: 0.8 });
  for (let i = 0; i < 2; i++) {
    const g = new THREE.Group();
    const bodyBatch = new GeoBatch();
    bodyBatch.add(new THREE.SphereGeometry(1, 10, 8), matrixTRS(0, 0, 0, 0, 0, 0, 0.15, 0.16, 0.42));
    bodyBatch.add(new THREE.SphereGeometry(0.10, 8, 6), matrixTRS(0, 0.05, 0.38));
    const body = bodyBatch.build(pale, { cast: true, receive: false });
    g.add(body);
    const wings = [];
    for (const s of [-1, 1]) {
      const pivot = new THREE.Group();
      pivot.position.set(s * 0.10, 0.02, 0.02);
      const wg = new GeoBatch();
      wg.add(new THREE.BoxGeometry(1.25, 0.035, 0.34), matrixTRS(s * 0.62, 0, 0));
      for (let k = 0; k < 3; k++) {
        wg.add(new THREE.BoxGeometry(0.30, 0.03, 0.07), matrixTRS(s * (1.18 + k * 0.18), 0, 0.08 - k * 0.08));
      }
      const w = wg.build(dark, { cast: true, receive: false });
      pivot.add(w);
      g.add(pivot);
      wings.push(pivot);
    }
    g.scale.setScalar(1.0 + i * 0.15);
    g.layers.set(0);
    SCENE.add(g);
    WILD.eagles.push({ group: g, wings, phase: i * 0.5, radius: 90 + i * 30, alt: 42 + i * 10, cx: i ? -320 : 260, cz: i ? 60 : 90 });
  }
}

function buildMarmotMounds() {
  const g = new GeoBatch();
  const dirt = 0x55432f;
  for (const p of [[-240, 508], [-300, 470], [-340, 505], [-215, 430]]) {
    const y = heightAt(p[0], p[1]);
    g.add(new THREE.ConeGeometry(1.5, 0.42, 10), matrixTRS(p[0], y + 0.05, p[1], 0, 0, 0, 1, 1, 0.8));

function buildWildlife() {
