function updateWildlife() {
  if (!WILD.saiga) return;
  const ph = SIM.t / LOOP_SECONDS;
  const d = new THREE.Object3D();
  /* saiga: a small herd on the far plain and a few near the east meadow */
  for (let i = 0; i < WILD.saigaCount; i++) {
    const north = i < 5;
    const off = i * 0.11;
    const a = TAU * (ph + (north ? 0.08 * i : 0.2 * i));
    const cx = north ? 250 : -390, cz = north ? -430 : 340;
    const rx = north ? 170 : 50, rz = north ? 70 : 26;
    const x = cx + Math.cos(a) * rx;
    const z = cz + Math.sin(a) * rz;
    const y = heightAt(x, z);
    const bob = Math.abs(Math.sin(TAU * (ph * 10 + off))) * 0.035;
    d.position.set(x, y + bob, z);
    d.rotation.set(0, Math.atan2(-Math.sin(a) * rx, Math.cos(a) * rz), Math.sin(TAU * (ph * 7 + off)) * 0.02);
    d.scale.setScalar(north ? 1.25 : 1.4);
    d.updateMatrix();
    WILD.saiga.setMatrixAt(i, d.matrix);
  }
  WILD.saiga.instanceMatrix.needsUpdate = true;
  /* marmots stand up at their own phases */
  const mounds = [[-240, 508], [-300, 470], [-340, 505], [-215, 430]];
  for (let i = 0; i < WILD.marmotCount; i++) {
    const [x, z] = mounds[i];
    const y = heightAt(x, z) + 0.34;
    const stand = smoothPulse(ph * 8 + i * 0.23, 0.55, 0.10);
    d.position.set(x, y + stand * 0.12, z);
    d.rotation.set(-stand * 0.12, 0.3 + i * 1.7, 0);
    d.scale.set(1, 0.9 + stand * 0.25, 1);
    d.updateMatrix();
    WILD.marmots.setMatrixAt(i, d.matrix);
  }
  WILD.marmots.instanceMatrix.needsUpdate = true;
  /* hares make little circuits and hop */
  const harePaths = [[-218, 502, 12, 8], [45, 445, 18, 12], [170, 410, 26, 14]];
  for (let i = 0; i < WILD.hareCount; i++) {
    const [cx, cz, rx, rz] = harePaths[i];
    const a = TAU * (ph * (i % 2 ? -1 : 1) + i * 0.27);
    const hop = Math.abs(Math.sin(TAU * (ph * 14 + i * 0.4)));
    const x = cx + Math.cos(a) * rx, z = cz + Math.sin(a) * rz;
    d.position.set(x, heightAt(x, z) + 0.05 + hop * 0.17, z);
    d.rotation.set(-hop * 0.35, Math.atan2(-Math.sin(a) * rx, Math.cos(a) * rz), 0);
    d.scale.setScalar(0.95);
    d.updateMatrix();
    WILD.hares.setMatrixAt(i, d.matrix);
  }
  WILD.hares.instanceMatrix.needsUpdate = true;
  /* fox trots a quiet loop behind the camp */
  if (WILD.fox) {
    const a = TAU * (ph + 0.42);
    const x = -500 + Math.cos(a) * 32, z = 250 + Math.sin(a) * 20;
    const y = heightAt(x, z);
    WILD.fox.group.position.set(x, y + Math.abs(Math.sin(TAU * (ph * 12))) * 0.03, z);
    WILD.fox.group.rotation.y = Math.atan2(-Math.sin(a) * 32, Math.cos(a) * 20);
    WILD.fox.tail.rotation.z = Math.sin(TAU * (ph * 9)) * 0.22;
    WILD.fox.tail.rotation.y = Math.sin(TAU * (ph * 5)) * 0.1;
  }
  /* two eagles circle the lake */
  for (const e of WILD.eagles) {
    const a = TAU * (ph + e.phase);
    const x = e.cx + Math.cos(a) * e.radius;
    const z = e.cz + Math.sin(a) * e.radius * 0.6;
    e.group.position.set(x, e.alt + Math.sin(TAU * (ph * 2 + e.phase)) * 4, z);
    e.group.rotation.set(0, Math.atan2(-Math.sin(a) * e.radius, Math.cos(a) * e.radius * 0.6), 0.08);
    const flap = Math.sin(TAU * (ph * 22 + e.phase)) * 0.32 + 0.08;
    e.wings[0].rotation.z = -flap;
    e.wings[1].rotation.z = flap;
  }
}

/* -------------------------------------------------------------- build all */
function buildActors() {
  buildCranes();
  buildHorses();
  buildSwans();
  buildWildlife();
  updateCranes();
  updateHorses();
  updateSwans();
  updateWildlife();
}


/* ======================= 08-flight.js ======================= */
/* ==========================================================================
   08 — the one 60-second camera take: a closed, smooth 3D flight from the
        old track, through the mound gap, along the reeds, up the escarpment,
        behind the camp and home to the track. Manual only turns the head.
   ========================================================================== */

const FLIGHT = {
  curve: null,
  knots: [],
  length: 0,
  yawSpline: null,
  pitchSpline: null,
  lensSpline: null,
  warpA: 0.34,
  warpPhi: Math.PI,
  audit: null
};

function flightKnots() {
  const K = (x, z, opts) => ({ x, z, agl: opts.agl, y: opts.y, yawHint: opts.yawHint });
  const raw = [
    K(-232, 520, { agl: 3.6 }),
    K(-246, 430, { agl: 3.5 }),
    K(-248, 360, { agl: 3.8 }),
    K(-250, 300, { agl: 4.0 }),
    K(-320, 270, { agl: 4.2 }),
    K(-400, 260, { agl: 4.2 }),
    K(-470, 280, { agl: 4.2 }),
    K(-520, 330, { agl: 4.4 }),
    K(-500, 420, { agl: 4.2 }),
    K(-430, 480, { agl: 4.0 }),
    K(-350, 530, { agl: 3.8 }),
    K(-300, 590, { agl: 3.7 }),
    K(-255, 610, { agl: 3.7 }),
    K(-232, 580, { agl: 3.6 })
  ];
  return raw;
}

function ensureFlightClearance(curve, knots, required = 3.35) {
  for (let iter = 0; iter < 6; iter++) {
    const deficits = new Array(knots.length).fill(0);
    for (let i = 0; i < 3200; i++) {
      const u = i / 3200;
      const p = curve.getPointAt(u);
      const g = heightAt(p.x, p.z);
      const floor = g < 0.5 ? WATER.level + 0.15 : g;
      const need = floor < WATER.level + 0.2 ? 4.0 : required;
      const clear = p.y - Math.max(floor, WATER.level);
      if (clear < need) {
        let best = 1e9, bk = 0;
        for (let k = 0; k < knots.length; k++) {
          const d = (p.x - knots[k].x) ** 2 + (p.z - knots[k].z) ** 2;
          if (d < best) { best = d; bk = k; }
        }
        deficits[bk] = Math.max(deficits[bk], (need - clear) * 0.85 + 0.1);
      }
    }
    let changed = false;
    for (let k = 0; k < knots.length; k++) {
      if (deficits[k] > 0.01) {
        const v = curve.points[k];
        v.y += deficits[k];
        changed = true;
      }
    }
    curve.updateArcLengths();
    if (!changed) break;
  }
}

function buildFlightPath() {
  const raw = flightKnots();
  const pts = raw.map(k => {
    const y = k.y === undefined ? heightAt(k.x, k.z) + k.agl : Math.max(k.y, heightAt(k.x, k.z) + 4.5);
    return new THREE.Vector3(k.x, y, k.z);
  });
  const curve = makeClosedCurve(pts.map(p => [p.x, p.y, p.z]), 0.5);
  ensureFlightClearance(curve, raw);
  curve.updateArcLengths();
  FLIGHT.curve = curve;
  FLIGHT.knots = raw;
  FLIGHT.length = curve.getLength();
  FLIGHT.yawSpline = periodicSpline([
    [0.00, 0.03], [0.10, 0.00], [0.20, -0.10], [0.30, -0.05],
    [0.40, 0.06], [0.50, 0.10], [0.60, 0.02], [0.70, -0.04],
    [0.80, 0.00], [0.90, 0.03], [0.97, 0.03]
  ]);
  FLIGHT.pitchSpline = periodicSpline([
    [0.00, -0.030], [0.15, -0.020], [0.30, -0.010], [0.45, -0.020],
    [0.60, -0.040], [0.75, -0.030], [0.90, -0.020], [0.98, -0.030]
  ]);
  FLIGHT.lensSpline = periodicSpline([
    [0.00, 26], [0.15, 26], [0.30, 27], [0.45, 26], [0.60, 27],
    [0.75, 26], [0.90, 26], [0.98, 26]
  ]);
  /* a circularly smoothed bank profile: derived from curvature but with no
     seams and no whip at the loop join */
  const N = 512;
  let bank = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const u = i / N;
    const du = 0.0018;
    const ta = curve.getTangentAt(wrapTurns(u - du));
    const tb = curve.getTangentAt(wrapTurns(u + du));
    const yawRate = wrapPi(Math.atan2(tb.x, tb.z) - Math.atan2(ta.x, ta.z)) / (2 * du);
    bank[i] = clamp(Math.atan2(yawRate * 0.32, 1) * 0.36, -0.08, 0.08);
  }
  for (let pass = 0; pass < 4; pass++) {
    const out = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      let s = 0;
      for (let k = -5; k <= 5; k++) s += bank[(i + k + N) % N];
      out[i] = s / 11;
    }
    bank = out;
  }
  for (let i = 0; i < N; i++) {
    const p = i / N;
    const env = smoothstep(0.0, 0.05, p) * (1 - smoothstep(0.95, 1.0, p));
    bank[i] *= env;
  }
  /* a periodic speed profile: slow where the eye needs detail, faster on the
     open crossings, with the whole circuit still exactly 60 seconds */
  const speedKeys = periodicSpline([
    [0.00, 0.32], [0.07, 0.30], [0.14, 0.28], [0.22, 0.27], [0.30, 0.28],
    [0.38, 0.30], [0.46, 0.32], [0.54, 0.31], [0.62, 0.29], [0.70, 0.27],
    [0.78, 0.22], [0.86, 0.20], [0.93, 0.19], [0.98, 0.24]
  ]);
  const NS = 4096;
  const speedTable = new Float32Array(NS + 1);
  const uTable = new Float64Array(NS + 1);
  let total = 0;
  for (let i = 0; i < NS; i++) {
    const v = clamp(speedKeys((i + 0.5) / NS), 0.08, 2.0);
    speedTable[i] = v;
    total += v;
  }
  speedTable[NS] = speedTable[0];
  const mean = total / NS;
  FLIGHT.speedMean = mean;
  FLIGHT.speedTable = speedTable;
  let acc = 0;
  uTable[0] = 0;
  for (let i = 0; i < NS; i++) {
    acc += speedTable[i];
    uTable[i + 1] = acc / total;
  }
  FLIGHT.uTable = uTable;
  FLIGHT.bankProfile = bank;
  /* the opening framing is evaluated only after the whole path exists */
  updateFlightCamera();
}

/** phase warping gives the take a slow opening and a faster high crossing */
function flightU(phase) {
  const tab = FLIGHT.uTable;
  if (!tab) return wrapTurns(phase);
  const t = wrapTurns(phase) * (tab.length - 1);
  const i = Math.min(tab.length - 2, Math.floor(t));
  return wrapTurns(lerp(tab[i], tab[i + 1], t - i));
}
function flightSpeedFactor(phase) {
  const tab = FLIGHT.speedTable;
  if (!tab) return 1;
  const p = wrapTurns(phase) * (tab.length - 1);
  const i = Math.min(tab.length - 2, Math.floor(p));
  return lerp(tab[i], tab[i + 1], p - i) / FLIGHT.speedMean;
}
const _fwd = new THREE.Vector3();
const _right = new THREE.Vector3();
const _up = new THREE.Vector3();
const _basis = new THREE.Matrix4();
const _qBank = new THREE.Quaternion();
const _back = new THREE.Vector3();

function updateFlightCamera() {
  if (!FLIGHT.curve || !CAMERA) return;
  const phase = wrapTurns(SIM.t / LOOP_SECONDS);
  const u = flightU(phase);
  const p = FLIGHT.curve.getPointAt(u);
  const uAhead = wrapTurns(u + 0.018);
  const pAhead = FLIGHT.curve.getPointAt(uAhead);
  const tan = pAhead.sub(p).normalize();
  const yaw = FLIGHT.yawSpline(u) + CAM.yawOff;
  const pitch = clamp(FLIGHT.pitchSpline(u) + CAM.pitchOff, -1.15, 1.1);
  const worldUp = new THREE.Vector3(0, 1, 0);
  _fwd.copy(tan).applyAxisAngle(worldUp, yaw).normalize();
  _right.crossVectors(worldUp, _fwd);
  if (_right.lengthSq() < 1e-8) _right.set(1, 0, 0);
  _right.normalize();
  _up.crossVectors(_fwd, _right).normalize();
  _fwd.multiplyScalar(Math.cos(pitch)).addScaledVector(_up, Math.sin(pitch)).normalize();
  const back = _back.copy(_fwd).multiplyScalar(-1);
  _right.crossVectors(worldUp, back).normalize();
  _up.crossVectors(back, _right).normalize();

  /* smoothed bank profile, evaluated as a pure function of loop phase */
  const bp = FLIGHT.bankProfile;
  const bf = phase * bp.length;
  const bi = Math.floor(bf) % bp.length;
  const bank = lerp(bp[bi], bp[(bi + 1) % bp.length], bf - Math.floor(bf));
  CAM.bank = bank;
  _qBank.setFromAxisAngle(_fwd, bank);
  _up.applyQuaternion(_qBank);
  _right.applyQuaternion(_qBank);
  _basis.makeBasis(_right, _up, back);
  CAMERA.position.copy(p);
  CAMERA.quaternion.setFromRotationMatrix(_basis);
  CAMERA.updateMatrixWorld();
  const lens = clamp(FLIGHT.lensSpline(u) * CAM.lensScale, 15.5, 92);
  CAM.lens = lens;
  const fov = lensToFov(lens);
  if (Math.abs(CAMERA.fov - fov) > 0.001) {
    CAMERA.fov = fov;
    CAMERA.updateProjectionMatrix();
  }
  CAM.phase = phase;
  CAM.dist = u * FLIGHT.length;
  CAM.speed = FLIGHT.length * flightSpeedFactor(phase) / LOOP_SECONDS;
  CAM.position = p;
}

function flightSample(phase) {
  const u = flightU(phase);
  const p = FLIGHT.curve.getPointAt(u);
  const t = FLIGHT.curve.getTangentAt(u).normalize();
  return { p, t, u };
}

/* ------------------------------------------------------------- fixed audit */
function distPointCapsule(p, c) {
  const ax = c.ax, ay = c.ay, az = c.az;
  const bx = c.bx, by = c.by, bz = c.bz;
  const abx = bx - ax, aby = by - ay, abz = bz - az;
  const apx = p.x - ax, apy = p.y - ay, apz = p.z - az;
  const ab2 = abx * abx + aby * aby + abz * abz || 1e-9;
  const t = clamp((apx * abx + apy * aby + apz * abz) / ab2, 0, 1);
  const cx = ax + abx * t, cy = ay + aby * t, cz = az + abz * t;
  return Math.hypot(p.x - cx, p.y - cy, p.z - cz) - c.r;
}
function distPointBox(p, b) {
  const c = Math.cos(-b.yaw), s = Math.sin(-b.yaw);
  const dx = p.x - b.x, dz = p.z - b.z;
  const lx = dx * c - dz * s, lz = dx * s + dz * c;
  const qx = Math.max(Math.abs(lx) - b.hx, 0);
  const qy = Math.max(Math.abs(p.y - b.y) - b.hy, 0);
  const qz = Math.max(Math.abs(lz) - b.hz, 0);
  const outside = Math.hypot(qx, qy, qz);
  if (outside > 0) return outside;
  return -Math.min(b.hx - Math.abs(lx), b.hy - Math.abs(p.y - b.y), b.hz - Math.abs(lz));
}
function distPointCones(p, c) {
  const d = Math.hypot(p.x - c.x, p.z - c.z);
  const y0 = c.y0, y1 = c.y0 + c.h;
  const rAt = (y) => c.r * clamp(1 - (y - y0) / c.h, 0, 1);
  if (p.y < y0) return Math.hypot(d, y0 - p.y) - Math.max(c.r, 0.1) * 0.2;
  const yy = clamp(p.y, y0, y1);
  const rr = Math.max(0.2, rAt(yy));
  return d - rr;
}
function clearanceToStatic(p) {
  let best = 1e9;
  for (const c of COLLIDERS.spheres) {
    const d = Math.hypot(p.x - c.x, p.y - c.y, p.z - c.z) - c.r;
    if (d < best) best = d;
  }
  for (const c of COLLIDERS.capsules) {
    const d = distPointCapsule(p, c);
    if (d < best) best = d;
  }
  for (const c of COLLIDERS.boxes) {
    const d = distPointBox(p, c);
    if (d < best) best = d;
  }
  for (const c of COLLIDERS.cones) {
    const d = distPointCones(p, c);
    if (d < best) best = d;
  }
  return best;
}

function runAudit() {
  const report = {
    camera: { minTerrain: 1e9, minStatic: 1e9, worstTerrain: null, worstStatic: null },
    cranes: { minTerrain: 1e9, minStatic: 1e9, minCamera: 1e9, worstTerrain: null },
    horses: { minTerrain: 1e9, minStatic: 1e9, minCamera: 1e9 },
    swans: { minStatic: 1e9 },
    nearPlane: WORLD.near,
    camMinClearanceNeeded: WORLD.near + 0.5
  };
  for (let i = 0; i < 2400; i++) {
    const phase = i / 2400;
    const st = flightSample(phase);
    const g = heightAt(st.p.x, st.p.z);
    const floor = Math.max(g, WATER.level);
    const cl = st.p.y - floor;
    if (cl < report.camera.minTerrain) {
      report.camera.minTerrain = cl;
      report.camera.worstTerrain = { phase, x: +st.p.x.toFixed(1), y: +st.p.y.toFixed(1), z: +st.p.z.toFixed(1), ground: +g.toFixed(2) };
    }
    const cs = clearanceToStatic(st.p);
    if (cs < report.camera.minStatic) {
      report.camera.minStatic = cs;
      if (cs < 6) report.camera.worstStatic = { phase, x: +st.p.x.toFixed(1), y: +st.p.y.toFixed(1), z: +st.p.z.toFixed(1), clear: +cs.toFixed(2) };
    }
  }
  /* crane flight, sampled with its real bob and offsets */
  const tmp = { p: new THREE.Vector3(), t: new THREE.Vector3(), right: new THREE.Vector3(), up: new THREE.Vector3() };
  for (let i = 0; i < 900; i++) {
    const phase = i / 900;
    for (let c = 0; c < CRANES.list.length; c++) {
      const st = craneState(c, phase, tmp);
      const g = heightAt(st.p.x, st.p.z);
      const floor = Math.max(g, WATER.level);
      const cl = st.p.y - floor - 0.9;
      if (cl < report.cranes.minTerrain) {
        report.cranes.minTerrain = cl;
        report.cranes.worstTerrain = { phase, crane: c, x: +st.p.x.toFixed(1), y: +st.p.y.toFixed(1), z: +st.p.z.toFixed(1) };
      }
      const cs = clearanceToStatic(st.p);
      if (cs < report.cranes.minStatic) report.cranes.minStatic = cs;
      const camP = flightSample(phase).p;
      const d = camP.distanceTo(st.p);
      if (d < report.cranes.minCamera) report.cranes.minCamera = d;
    }
  }
  /* horses, their bodies and their patches */
  for (let i = 0; i < 240; i++) {
    const phase = i / 240;
    for (const h of HORSES) {
      const p = new THREE.Vector3(h.base.x, heightAt(h.base.x, h.base.z) + 1.2, h.base.z);
      const cs = clearanceToStatic(p);
      if (cs < report.horses.minStatic) report.horses.minStatic = cs;
      const camP = flightSample(phase).p;
      const d = p.distanceTo(camP);
      if (d < report.horses.minCamera) report.horses.minCamera = d;
    }
  }
  /* swans stay afloat and inside the lake polygon */
  for (let i = 0; i < LOOP_SECONDS; i++) {
    const ph = i / LOOP_SECONDS;
    const out = { x: 0, z: 0, heading: 0 };
    for (let k = 0; k < 2; k++) {
      swanCurvePoint(k, ph, out);
      const bed = heightAt(out.x, out.z);
      if (bed > -0.18) report.swans.wetFailure = { x: out.x, z: out.z, bed };
    }
  }
  report.seam = seamCheck();
  report.water = {
    waterObjects: WATER.mesh ? 1 : 0,
    vertices: WATER.geometry ? WATER.geometry.attributes.position.count : 0,
    indexed: WATER.geometry ? !!WATER.geometry.index : false,
    position: WATER.mesh ? WATER.mesh.position.toArray() : null,
    amplitude: [WORLD.waterMin, WORLD.waterMax]
  };
  report.counts = {
    triangles: RENDERER.info.render.triangles,
    calls: RENDERER.info.render.calls,
    cranes: CRANES.list.length,
    horses: HORSES.length,
    swans: SWANS.length,
    plants: VEG.counts.total || 0,
    loopSeconds: LOOP_SECONDS
  };
  FLIGHT.audit = report;
  return report;
}

/** compare two full laps at the same phase, and across the seam */
function seamCheck() {
  const res = { maxCameraPos: 0, maxCameraDir: 0, maxCrane: 0, maxWater: 0, camAt0: null, camAt96: null };
  const saved = SIM.t;
  const sample = (t) => {
    SIM.t = t;
    updateFlightCamera();
    const p = CAMERA.position.clone();
    const q = CAMERA.quaternion.clone();
    updateCranes(); updateHorses(); updateSwans();
    const cranes = CRANES.list.map(c => c.group.position.clone());
    return { p, q, cranes, lens: CAM.lens, bank: CAM.bank };
  };
  const a = sample(0);
  const b = sample(LOOP_SECONDS - 1e-9);
  const c = sample(LOOP_SECONDS);
  const d = sample(0.0001);
  res.maxCameraPos = a.p.distanceTo(c.p);
  res.maxCameraDir = 1 - Math.abs(a.q.dot(c.q));
  for (let i = 0; i < a.cranes.length; i++) res.maxCrane = Math.max(res.maxCrane, a.cranes[i].distanceTo(c.cranes[i]));
  res.camAt0 = { x: +a.p.x.toFixed(3), y: +a.p.y.toFixed(3), z: +a.p.z.toFixed(3), lens: +a.lens.toFixed(3), bank: +a.bank.toFixed(4) };
  res.camAt96 = { x: +c.p.x.toFixed(3), y: +c.p.y.toFixed(3), z: +c.p.z.toFixed(3), lens: +c.lens.toFixed(3), bank: +c.bank.toFixed(4) };
  res.maxWater = 0;
  res.nearSeam = a.p.distanceTo(d.p);
  SIM.t = saved;
  updateFlightCamera();
  return res;
}


/* ======================= 09-sim.js ======================= */
/* ==========================================================================
   09 — the master 60 s clock. Every actor, wave, flag, cloud and shadow is
        a pure function of SIM.t. Pause holds the clock; seeking is exact.
   ========================================================================== */

const APP = {
  booted: false,
  paused: false,
  last: 0,
  visT: 0,
  frames: 0,
  fps: 0,
  fpsAcc: 0,
  renderCount: 0,
  perfScale: PROBE_LOW ? 0.9 : 1.0,
  seekCount: 0
};

function stepWorld(dt) {
  if (!APP.paused) {
    SIM.t += clamp(dt, 0, 0.12);
    if (SIM.t >= LOOP_SECONDS) {
      SIM.t -= LOOP_SECONDS;
      APP.loopCount = (APP.loopCount || 0) + 1;
    }
    updateWater(dt);
  }
  updateFlightCamera();
  updateCranes();
  updateHorses();
  updateWildlife();
  updateSwans();
  updateCamp();
  updateSkyUniforms();
  updateSunShadow();
  updateAudio(dt);
}

function seekTime(t, render = false) {
  SIM.t = ((t % LOOP_SECONDS) + LOOP_SECONDS) % LOOP_SECONDS;
  APP.seekCount++;
  restartWake();
  updateFlightCamera();
  updateCranes();
  updateHorses();
  updateWildlife();
  updateSwans();
  updateCamp();
  updateWater(0);
  updateSkyUniforms();
  updateSunShadow();
  updateAudio(0);
  if (render) {
    updateWater(0);
    renderReflections();
    RENDERER.render(SCENE, CAMERA);
  }
  if (typeof UI !== 'undefined' && UI.syncClock) UI.syncClock();
  return SIM.t;
}

function setPaused(p) {
  APP.paused = !!p;
  if (typeof AUDIO !== 'undefined' && AUDIO.ctx) {
    if (APP.paused) AUDIO.ctx.suspend();
    else AUDIO.ctx.resume();
  }
  if (typeof UI !== 'undefined' && UI.syncPaused) UI.syncPaused();
}
function togglePause() { setPaused(!APP.paused); }

/* ------------------------------------------------------------------ audio */
const AUDIO_R = mulberry32(SEED ^ 0x6117);
const AUDIO = {
  enabled: false,
  ctx: null,
  master: null,
  windGain: null,
  hissGain: null,
  started: false,
  lastPhase: 0,
  callAt: [0.115, 0.335, 0.605, 0.815],
  callIndex: 0
};

function audioNoiseBuffer(ctx, seconds, colour) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const white = AUDIO_R() * 2 - 1;
      last = colour === 'pink' ? last * 0.985 + white * 0.045 : white;
      d[i] = last * (colour === 'pink' ? 8.0 : 0.55);
    }
  }
  return buf;
}

AUDIO.init = function () {
  if (AUDIO.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  AUDIO.ctx = ctx;
  const master = ctx.createGain();
  master.gain.value = 0.0;
  master.connect(ctx.destination);
  AUDIO.master = master;
  /* wind bed: two decorrelated pink channels through a slowly moving lowpass */
  const wind = ctx.createBufferSource();
  wind.buffer = audioNoiseBuffer(ctx, 14, 'pink');
  wind.loop = true;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 620;
  lp.Q.value = 0.4;
  const wg = ctx.createGain();
  wg.gain.value = 0.10;
  wind.connect(lp).connect(wg).connect(master);
  wind.start();
  AUDIO.windFilter = lp;
  AUDIO.windGain = wg;
  const hiss = ctx.createBufferSource();
  hiss.buffer = audioNoiseBuffer(ctx, 9, 'white');
  hiss.loop = true;
  const hp = ctx.createBiquadFilter();
  hp.type = 'bandpass';
  hp.frequency.value = 2600;
  hp.Q.value = 0.55;
  const hg = ctx.createGain();
  hg.gain.value = 0.014;
  hiss.connect(hp).connect(hg).connect(master);
  hiss.start();
  AUDIO.hissFilter = hp;
  AUDIO.hissGain = hg;
  AUDIO.started = true;
};

function craneCall() {
  const ctx = AUDIO.ctx;
  if (!ctx || ctx.state !== 'running') return;
  const t0 = ctx.currentTime + 0.05;
  const base = 610 + AUDIO_R() * 240;
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const out = ctx.createGain();
  out.gain.setValueAtTime(0.0001, t0);
  out.gain.exponentialRampToValueAtTime(0.06, t0 + 0.06);
  out.gain.exponentialRampToValueAtTime(0.028, t0 + 0.35);
  out.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.15);
  if (pan) { pan.pan.value = -0.6 + AUDIO_R() * 1.2; out.connect(pan); pan.connect(AUDIO.master); }
  else out.connect(AUDIO.master);
  for (let k = 0; k < 3; k++) {
    const osc = ctx.createOscillator();
    osc.type = k === 0 ? 'sawtooth' : 'triangle';
    osc.frequency.setValueAtTime(base * (1 + k * 0.51) * 0.88, t0);
    osc.frequency.linearRampToValueAtTime(base * (1 + k * 0.51), t0 + 0.13);
    osc.frequency.exponentialRampToValueAtTime(base * (1 + k * 0.51) * 0.80, t0 + 0.9);
    const g = ctx.createGain();
    g.gain.value = k === 0 ? 0.5 : k === 1 ? 0.24 : 0.10;
    osc.connect(g).connect(out);
    osc.start(t0);
    osc.stop(t0 + 1.2);
  }
}

AUDIO.setEnabled = function (on) {
  AUDIO.enabled = !!on;
  if (on) {
    AUDIO.init();
    if (AUDIO.ctx) {
      AUDIO.ctx.resume();
      AUDIO.master.gain.cancelScheduledValues(AUDIO.ctx.currentTime);
      AUDIO.master.gain.setTargetAtTime(0.72, AUDIO.ctx.currentTime, 0.6);
    }
  } else if (AUDIO.master && AUDIO.ctx) {
    AUDIO.master.gain.setTargetAtTime(0.0, AUDIO.ctx.currentTime, 0.35);
  }
  if (typeof UI !== 'undefined' && UI.syncSound) UI.syncSound();
};

function updateAudio(dt) {
  if (!AUDIO.enabled || !AUDIO.ctx) return;
  const ph = SIM.t / LOOP_SECONDS;
  const gust = 0.5 + 0.5 * Math.sin(TAU * (ph * 3 + 0.3)) * (0.6 + 0.4 * Math.sin(TAU * ph * 7));
  if (AUDIO.windGain) AUDIO.windGain.gain.setTargetAtTime(0.075 + 0.045 * gust, AUDIO.ctx.currentTime, 0.25);
  if (AUDIO.windFilter) AUDIO.windFilter.frequency.setTargetAtTime(480 + 380 * gust, AUDIO.ctx.currentTime, 0.3);
  if (AUDIO.hissGain) AUDIO.hissGain.gain.setTargetAtTime(0.005 + 0.010 * gust, AUDIO.ctx.currentTime, 0.25);
  /* four calls per lap, fired at fixed phases so the loop is honest */
  const prev = AUDIO.lastPhase;
  for (const c of AUDIO.callAt) {
    const crossed = prev <= c && ph > c && ph - prev < 0.2;
    if (crossed) craneCall();
  }
  AUDIO.lastPhase = ph;
}

/* ------------------------------------------------------------------- boot */
function initSim() {
  SIM.t = 0;
  APP.paused = false;
  APP.loopCount = 0;
  restartWake();
  updateFlightCamera();
  updateCranes();
  updateHorses();
  updateWildlife();
  updateSwans();
  updateCamp();
  updateWater(0);
  updateSkyUniforms();
  updateSunShadow();
}

/* ==========================================================================
   10 — the instrument dock: Cinematic, Pause, Reset View, Sound, and the
        quiet timecode that makes the 60-second loop legible.

const UI = {
  cin: null, pauseBtn: null, reset: null, sound: null, hint: null,
  tc: null, lens: null, ringBar: null, hintTimer: 0, booted: false, lastLens: -1
};

function buildUI() {
  UI.cin = qs('cin');
  UI.pauseBtn = qs('pause');
  UI.reset = qs('reset');
  UI.sound = qs('sound');
  UI.hint = qs('hint');
  UI.tc = qs('tc');
  UI.lens = qs('lens');
  UI.ringBar = qs('ringBar');

  UI.cin.addEventListener('click', () => {
    CAM.setCinematic(!CAM.cine);
    UI.syncCinematic();
    UI.flashManual(CAM.cine ? 'the authored take resumes' : 'manual look — the camera keeps its line');
    hideHint();
  });
  UI.pauseBtn.addEventListener('click', () => {
    togglePause();
    hideHint();
  });
  UI.reset.addEventListener('click', () => {
    CAM.resetView();
    UI.syncCinematic();
    UI.syncPaused();
    seekTime(0);
    hideHint();
  });
  UI.sound.addEventListener('click', () => {
    AUDIO.setEnabled(!AUDIO.enabled);
    hideHint();
  });
  CAM.onCinematicChange = () => UI.syncCinematic();
  CAM.onLensChange = () => UI.syncClock();
  UI.syncCinematic();
  UI.syncPaused();
  UI.syncSound();
  UI.syncClock();
  UI.booted = true;
}

UI.syncCinematic = function () {
  if (!UI.cin) return;
  UI.cin.setAttribute('aria-pressed', CAM.cine ? 'true' : 'false');
  const el = qs('cinState');
  if (el) el.textContent = CAM.cine ? 'On' : 'Off';
};
UI.syncPaused = function () {
  if (!UI.pauseBtn) return;
  UI.pauseBtn.setAttribute('aria-pressed', APP.paused ? 'true' : 'false');
  UI.pauseBtn.textContent = APP.paused ? 'Resume' : 'Pause';
};
UI.syncSound = function () {
  if (!UI.sound) return;
  UI.sound.setAttribute('aria-pressed', AUDIO.enabled ? 'true' : 'false');
  const lbl = UI.sound.querySelector('.lbl');
  if (lbl) lbl.textContent = AUDIO.enabled ? 'Sound On' : 'Sound';
};
UI.syncClock = function () {
  if (!UI.tc) return;
  const t = SIM.t;
  const s = Math.min(LOOP_SECONDS - 0.001, t);
  const mm = Math.floor(s / 60);
  const ss = Math.floor(s % 60);
  UI.tc.textContent = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
  if (UI.ringBar) {
    const C = 2 * PI * 11;
    UI.ringBar.style.strokeDasharray = C.toFixed(3);
    UI.ringBar.style.strokeDashoffset = (C * (1 - t / LOOP_SECONDS)).toFixed(3);
  }
  const lens = Math.round(CAM.lens || 35);
  if (UI.lens && lens !== UI.lastLens) {
    UI.lens.textContent = String(lens);
    UI.lastLens = lens;
  }
};

UI.flashManual = function (text) {
  if (!UI.hint) return;
  UI.hint.textContent = text;
  UI.hint.classList.add('show');
  UI.hint.classList.remove('gone');
  UI.hintTimer = 3.2;
};

UI.update = function (dt) {
  UI.syncClock();
  if (UI.hintTimer > 0) {
    UI.hintTimer -= dt;
    if (UI.hintTimer <= 0) {
      if (UI.hint) UI.hint.classList.add('gone');
      UI.hintTimer = 0;
    }
  }
};

function hideHint() {
  if (!UI.hint) return;
  UI.hint.classList.remove('show');
  UI.hint.classList.add('gone');
  UI.hintTimer = 0;
}

function revealScene() {
  const title = qs('masthead'), clock = qs('clock'), dock = qs('dock'), veil = qs('veil'), vig = qs('vignette'), grade = qs('grade');
  if (title) title.classList.add('show');
  if (clock) clock.classList.add('show');
  if (dock) dock.classList.add('show');
  if (vig) vig.classList.add('show');
  if (grade) grade.classList.add('show');
  const canvas = qs('scene');
  if (canvas) canvas.classList.add('ready');
  if (veil) veil.classList.add('gone');
  const hint = qs('hint');
  if (hint) {
    hint.classList.add('show');
    UI.hintTimer = 12.0;
  }
  window.addEventListener('pointerdown', () => hideHint(), { once: true, capture: true });
}


/* ======================= 11-main.js ======================= */
/* ==========================================================================
   11 — boot, resize, fixed-quality render loop and the inspection hatch.
        The delivered file is entirely self-contained: runtime, shaders,
        textures, sky, sound and controls are all in these two script tags.
   ========================================================================== */

function applyDPR() {
  const base = Math.min(window.devicePixelRatio || 1, DEVICE.pixelCap);
  RENDERER.setPixelRatio(base * APP.perfScale);
}

function resize() {
  if (!RENDERER) return;
  const w = Math.max(2, window.innerWidth), h = Math.max(2, window.innerHeight);
  RENDERER.setSize(w, h, false);
  if (CAMERA) {
    CAMERA.aspect = w / h;
    CAMERA.updateProjectionMatrix();
  }
  if (typeof resizeWater === 'function' && WATER.refl.rt) {
    resizeWater(RENDERER.domElement.width, RENDERER.domElement.height);
  }
  if (APP.booted && SCENE && CAMERA) {
    CAM.update(0);
    updateFlightCamera();
    renderReflections();
    RENDERER.render(SCENE, CAMERA);
  }
}

async function bootStep(p, label, fn) {
  setProgress(p, label);
  await nextFrame();
  fn();
  await nextFrame();
}

async function boot() {
  try {
    setProgress(0.01, 'reading the morning');
    SCENE = new THREE.Scene();
    createCamera();
    APP.perfScale = 1.0;
    applyDPR();
    resize();
    await bootStep(0.035, 'grinding pigment for the steppe', () => buildMaterials());
    await bootStep(0.20, 'hanging the pale eastern sky', () => { buildSky(); buildLights(); });
    await bootStep(0.26, 'carving the basin and its kurgans', () => buildTerrain());
    await bootStep(0.52, 'letting the lake in — one surface only', () => buildWater());
    await bootStep(0.58, 'raising felt, willow and bone', () => buildCamp());
    await bootStep(0.64, 'seeding feathergrass and reeds', () => buildVegetation());
    await bootStep(0.84, 'calling the cranes in', () => buildActors());
    await bootStep(0.90, 'laying the one camera take', () => {
      buildFlightPath();
      CAMERA.position.copy(FLIGHT.curve.getPointAt(0));
    });
    await bootStep(0.95, 'starting the ninety-six second clock', () => {
      initSim();
      buildUI();
      CAM.bindInput(canvasEl);
      UI.syncCinematic();
      UI.syncPaused();
      UI.syncSound();
    });
    setProgress(0.985, 'warming the light');
    await nextFrame();
    updateFlightCamera();
    updateWater(0);
    renderReflections();
    RENDERER.shadowMap.autoUpdate = true;
    RENDERER.shadowMap.needsUpdate = true;
    RENDERER.compile(SCENE, CAMERA);
    RENDERER.render(SCENE, CAMERA);
    RENDERER.shadowMap.autoUpdate = false;
    RENDERER.shadowMap.needsUpdate = true;
    setProgress(1.0, 'ready');
    await nextFrame();
    APP.booted = true;
    APP.last = performance.now();
    revealScene();
    requestAnimationFrame(frame);
    window.__CRANE.ready = true;
    window.__CRANE.scene = SCENE;
    window.__CRANE.camera = CAMERA;
  } catch (err) {
    showError(err);
  }
}

let frameErrorShown = false;
let lowFpsTimer = 0;
function frame(now) {
  if (!APP.booted) return;
  requestAnimationFrame(frame);
  const dtMs = Math.max(0, now - APP.last);
  APP.last = now;
  const dt = Math.min(0.1, dtMs / 1000);
  APP.visT += dt;
  APP.frames++;
  APP.fpsAcc += dt;
  if (APP.fpsAcc > 0.85) {
    APP.fps = APP.frames / APP.fpsAcc;
    APP.frames = 0;
    APP.fpsAcc = 0;
  }
  try {
    CAM.update(dt);
    stepWorld(dt);
    UI.update(dt);
    APP.renderCount++;
    const every = PROBE_LOW ? 4 : 2;
    if (APP.renderCount % every === 0) renderReflections();
    RENDERER.shadowMap.needsUpdate = APP.renderCount % (PROBE_LOW ? 3 : 2) === 0;
    RENDERER.render(SCENE, CAMERA);

    /* a gentle resolution retreat on weaker GPUs; the cap is never raised again */
    if (APP.visT > 5 && APP.fps > 0 && APP.fps < 36 && APP.perfScale > 1.0) {
      lowFpsTimer += dt;
      if (lowFpsTimer > 3.2) {
        lowFpsTimer = 0;
        APP.perfScale = Math.max(1.0, APP.perfScale - 0.07);
        applyDPR();
        resize();
      }
    } else {
      lowFpsTimer = 0;
    }
  } catch (err) {
    if (!frameErrorShown) {
      frameErrorShown = true;
      showError(err);
    }
  }
}

window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { APP.last = performance.now(); });

/* ------------------------------------------------------------- test hatch */
const api = {
  ready: false,
  scene: null,
  camera: null,
  three: THREE,
  renderer: RENDERER,
  get app() { return APP; },
  get sim() { return SIM; },
  get cam() { return CAM; },
  get flight() { return FLIGHT; },
  get actors() { return { cranes: CRANES, horses: HORSES, swans: SWANS }; },
  get water() { return WATER; },
  get counts() {
    return {
      triangles: RENDERER.info.render.triangles,
      calls: RENDERER.info.render.calls,
      plants: VEG.counts.total || 0,
      feather: VEG.counts.feather || 0,
      grazed: VEG.counts.grazed || 0,
      reeds: VEG.counts.reed || 0,
      flowers: VEG.counts.flower || 0,
      shrubs: VEG.counts.shrub || 0,
      trees: VEG.trees.length,
      saiga: WILD.saigaCount,
      marmots: WILD.marmotCount,
      hares: WILD.hareCount,
      fox: 1,
      eagles: WILD.eagles.length,
      cranes: CRANES.list.length,
      horses: HORSES.filter(h => !h.foal).length, foals: HORSES.filter(h => h.foal).length,
      swans: SWANS.length,
      waterVertices: WATER.geometry ? WATER.geometry.attributes.position.count : 0,

    };
  },
  getState() {
    return {
      t: SIM.t,

      cinematic: CAM.cine,
      fps: APP.fps,
      lens: CAM.lens,
      fov: CAMERA ? CAMERA.fov : 0,
      camera: CAMERA ? {
        x: CAMERA.position.x, y: CAMERA.position.y, z: CAMERA.position.z,
        qx: CAMERA.quaternion.x, qy: CAMERA.quaternion.y, qz: CAMERA.quaternion.z, qw: CAMERA.quaternion.w
      } : null,
      cameraSpeed: CAM.speed,
      camBank: CAM.bank,
      cranes: CRANES.list.map(c => ({
        x: c.group.position.x, y: c.group.position.y, z: c.group.position.z,
        glide: c.phaseGlide || 0
      })),
      horses: HORSES.map(h => ({
        x: h.group.position.x, z: h.group.position.z,
        headUp: h.graze === undefined ? 0 : 1 - h.graze,
        neck: h.neck.rotation.x
      })),
      swans: SWANS.map(s => ({ x: s.group.position.x, z: s.group.position.z })),
      counts: this.counts
    };
  },
  seek(t) {
    seekTime(t, true);
    UI.syncClock();
    return this.getState();
  },
  advance(seconds) {
    seekTime(SIM.t + seconds, true);
    return this.getState();
  },
  pause(p) { setPaused(p); return APP.paused; },
  setCinematic(on) { CAM.setCinematic(on); UI.syncCinematic(); return CAM.cine; },
  reset() {
    CAM.resetView();
    UI.syncCinematic();
    UI.syncPaused();
    seekTime(0, true);
    return this.getState();
  },
  resetView() {
    CAM.resetView();
    UI.syncCinematic();
    UI.syncPaused();
    seekTime(0, true);
    return this.getState();
  },
  setManualLook(yaw, pitch, lensScale) {
    CAM.cine = false;
    CAM.yawT = clamp(yaw, -1.2, 1.2);
    CAM.pitchT = clamp(pitch, -0.8, 0.8);
    if (lensScale !== undefined) {
      CAM.lensScaleT = clamp(lensScale, 0.62, 1.55);
      CAM.lensScale = CAM.lensScaleT;
    }
    CAM.rejoin = 0;
    updateFlightCamera();
    UI.syncCinematic();
    return this.getState();
  },
  setSound(on) { AUDIO.setEnabled(on); return AUDIO.enabled; },
  audit() { const r = runAudit(); return r; },
  seam() { return seamCheck(); },
  render() {
    updateFlightCamera();
    updateCranes(); updateHorses(); updateSwans(); updateCamp(); updateWater(0);
    renderReflections();
    RENDERER.shadowMap.needsUpdate = true;
    RENDERER.render(SCENE, CAMERA);
    return this.getState();
  },
  project(x, y, z) {
    const v = new THREE.Vector3(x, y, z).project(CAMERA);
    return { x: (v.x * 0.5 + 0.5) * window.innerWidth, y: (-v.y * 0.5 + 0.5) * window.innerHeight, z: v.z };
  },
  lights() { return { sun: SUN_LIGHT, hemi: HEMI_LIGHT, fill: SKY_FILL }; },
  waterPosition() { return WATER.mesh ? WATER.mesh.position.toArray() : null; },
  terrain(x, z) {
    const h = heightAt(x, z);
    return { x, z, h, q: lakeQ(x, z), shade: sunShadeAt(x, z), track: trackDistance(x, z) };
  },
  cameraClearance(t) {
    const ph = t === undefined ? SIM.t / LOOP_SECONDS : t / LOOP_SECONDS;
    const st = flightSample(wrapTurns(ph));
    const g = heightAt(st.p.x, st.p.z);
    return {
      camera: st.p.toArray(), ground: g, water: WATER.level,
      clearance: st.p.y - Math.max(g, WATER.level),
      staticClearance: clearanceToStatic(st.p)
    };
  },
  device() { return { ...DEVICE, perfScale: APP.perfScale, pixelRatio: RENDERER.getPixelRatio(), size: [RENDERER.domElement.width, RENDERER.domElement.height] }; }
};
window.__CRANE = api;

boot();

</script>
