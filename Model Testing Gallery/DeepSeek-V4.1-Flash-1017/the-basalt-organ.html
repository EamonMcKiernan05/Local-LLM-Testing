// ---------------------------------------------------------------------------
// The protected shelf, submerged apron, fallen sections, driftwood, shells.
// ---------------------------------------------------------------------------

const SHELF = {
  top: 1.24,
  xs: -15.5, xe: 2.4, zs: -2.0, ze: 20.0,
  edge: (z) => -4.25 + 0.42 * Math.sin(z * 0.33 + 0.6) + 0.30 * (fbm2(z * 0.4, 8.3, 3) - 0.5),
};

function shelfTopAt(x, z) {
  const e = SHELF.edge(z);
  const nose = smoothstep(1.8, -2.0, z); // shelf noses into the water seaward
  let h = SHELF.top + 0.11 * (fbm2(x * 0.55 + 4.1, z * 0.55 - 2.3, 3) - 0.5)
    + 0.06 * Math.sin(x * 1.3) * Math.cos(z * 0.9);
  h += 0.20 * smoothstep(-6, -12, x) - 0.25 * nose;
  // rounded lip, then a drop
  h -= 0.30 * smoothstep(1.1, 0.0, e - x);
  h -= 1.35 * nose;
  return h;
}

function bedHeightAt(x, z) {
  const e = SHELF.edge(z);
  if (z < SHELF.zs - 0.4) {
    return -2.45 + 0.2 * (fbm2(x * 0.6 + 1.7, z * 0.6 + 5.5, 3) - 0.5);
  }
  if (x < e) return shelfTopAt(x, z);
  const d = x - e;
  const drop = mix(-0.65, -2.55, smoothstep(0, 3.2, d));
  const n = 0.22 * (fbm2(x * 0.6 + 1.7, z * 0.6 + 5.5, 3) - 0.5);
  return drop + n + 0.18 * Math.sin(z * 0.5 + x * 0.7);
}

function buildShelfMesh(geos) {
  const nx = 54, nz = 64;
  const { xs, xe, zs, ze } = SHELF;
  const H = [];
  for (let j = 0; j <= nz; j++) {
    const z = mix(zs, ze, j / nz);
    const row = [];
    for (let i = 0; i <= nx; i++) {
      const x = mix(xs, xe, i / nx);
      row.push([x, bedHeightAt(x, z), z]);
    }
    H.push(row);
  }
  for (let j = 0; j < nz; j++) {
    for (let i = 0; i < nx; i++) {
      const a = H[j][i], b = H[j][i + 1], c = H[j + 1][i + 1], d = H[j + 1][i];
      const y = (a[1] + b[1] + c[1] + d[1]) * 0.25;
      const x = (a[0] + b[0] + c[0] + d[0]) * 0.25;
      const z = (a[2] + b[2] + c[2] + d[2]) * 0.25;
      const wl = wetLineY(x, z);
      const distM = Math.hypot(x - WORLD.mouthCenter.x, y - WORLD.mouthCenter.y, z - WORLD.mouthCenter.z);
      const ao = mix(0.34, 1.0, Math.exp(-distM / 24));
      let col;
      if (y > 0.85) {
        col = new THREE.Color(0.34, 0.33, 0.30);
      } else if (y > 0.2) {
        col = new THREE.Color(0.29, 0.285, 0.27);
      } else {
        col = new THREE.Color(0.22, 0.23, 0.235);
      }
      // salt / shell crust near the lip
      const lip = 1 - smoothstep(0.0, 0.75, Math.abs(y - 0.55));
      col.lerp(new THREE.Color(0.30, 0.285, 0.25), lip * 0.30);
      col.multiplyScalar(ao * (y < wl ? 0.78 : 1.0));
      const uvA = [a[0] / 1.55, a[2] / 1.55];
      const uvB = [b[0] / 1.55, b[2] / 1.55];
      const uvC = [c[0] / 1.55, c[2] / 1.55];
      const uvD = [d[0] / 1.55, d[2] / 1.55];
      const g = y < wl * 0.5 ? geos.soaked : (y < wl ? geos.wet : geos.dry);
      g.quad([a[0], a[1], a[2]], [d[0], d[1], d[2]], [c[0], c[1], c[2]], [b[0], b[1], b[2]],
        col, uvA, uvD, uvC, uvB);
    }
  }
  CAVE.counts.shelfQuads = nx * nz;
}

function buildShelfStumps(geos) {
  const spots = [
    [-8.0, 4.6, 0.72], [-6.2, 2.6, 0.42], [-9.6, 5.3, 0.55], [-5.3, 1.2, 0.34],
    [-11.0, 4.0, 0.62], [-7.1, 0.6, 0.38], [-10.1, 2.8, 0.30], [-4.9, 3.2, 0.26],
  ];
  for (const [x, z, h] of spots) {
    const baseY = shelfTopAt(x, z) - 0.18;
    const sides = ri(5, 7);
    const r = rr(0.28, 0.52);
    const poly = [];
    for (let i = 0; i < sides; i++) {
      const a = (i / sides) * TAU + rr(-0.09, 0.09);
      const rad = r * rr(0.8, 1.2);
      poly.push([x + Math.cos(a) * rad, z + Math.sin(a) * rad]);
    }
    const tops = poly.map(() => rr(0.16, h));
    const col = new THREE.Color(0.30, 0.30, 0.295);
    addColumn(geos, poly, [x, baseY, z], new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, -1),
      new THREE.Vector3(0, 1, 0), tops, {
      color: col, topColor: col.clone().multiplyScalar(1.15), bevel: 0.03,
      baseOffset: -0.3, uvScale: 1.1, lenJitter: 0.02,
    });
  }
  CAVE.counts.stumps = spots.length;
}

function buildFallenColumns(geos) {
  const specs = [
    { x: -6.35, z: 4.6, rx: 0.34, len: 2.5, dir: [0.86, 0.10, 0.50], sink: 0.24 },
    { x: -7.9, z: 2.2, rx: 0.30, len: 1.9, dir: [0.42, 0.06, -0.90], sink: 0.20 },
    { x: -4.35, z: 3.2, rx: 0.27, len: 1.6, dir: [0.55, 0.02, -0.83], sink: 0.42 },
    { x: -10.6, z: 6.8, rx: 0.40, len: 3.2, dir: [0.95, 0.05, 0.28], sink: 0.30 },
  ];
  for (const sp of specs) {
    const sides = ri(5, 7);
    const poly = [];
    for (let i = 0; i < sides; i++) {
      const a = (i / sides) * TAU + rr(-0.08, 0.08);
      const rad = sp.rx * rr(0.82, 1.15);
      poly.push([Math.cos(a) * rad, Math.sin(a) * rad]);
    }
    const dir = new THREE.Vector3(...sp.dir).normalize();
    let upSeed = new THREE.Vector3(0, 1, 0);
    const u = new THREE.Vector3().crossVectors(dir, upSeed).normalize();
    const v = new THREE.Vector3().crossVectors(u, dir).normalize();
    const w = new THREE.Vector3().crossVectors(u, v).normalize();
    const y0 = shelfTopAt(sp.x, sp.z) - sp.sink;
    const col = new THREE.Color(0.31, 0.30, 0.29);
    addColumn(geos, poly, [sp.x, y0, sp.z], u, v, dir, sp.len, {
      color: col, topColor: col.clone().multiplyScalar(1.1), bevel: 0.05,
      baseOffset: -0.15, uvScale: 1.1, lenJitter: 0.05,
    });
  }
  CAVE.counts.fallen = specs.length;
}

function buildDriftwood() {
  const group = new THREE.Group();
  group.name = 'driftwood';
  const geos = { dry: new Geo() };
  const woodCol = new THREE.Color(0.62, 0.56, 0.47);
  const specs = [
    {
      pts: [[-7.85, 0, 4.9], [-7.35, 0.06, 4.35], [-6.85, 0.10, 4.15], [-6.4, 0.03, 4.42], [-6.15, 0.02, 4.9]],
      r: (t) => 0.055 + 0.10 * Math.sin(Math.pow(t, 0.7) * Math.PI) + 0.02,
      y: 1.30,
    },
    {
      pts: [[-7.65, 0, 3.35], [-7.2, 0.03, 3.05], [-6.75, 0.05, 2.9], [-6.35, 0.02, 3.15]],
      r: (t) => 0.04 + 0.055 * Math.sin(t * Math.PI),
      y: 1.30,
    },
  ];
  for (const sp of specs) {
    const pts = sp.pts.map(([x, dy, z]) => [x, shelfTopAt(x, z) + dy + 0.03, z]);
    const rings = addTube(geos.dry, pts, sp.r, 12, 9, woodCol, 1.2);
    addDisc(geos.dry, rings[0], woodCol, true);
    addDisc(geos.dry, rings[rings.length - 1], woodCol, false);
  }
  // a forked branch
  const bpts = [[-7.0, 0, 4.45], [-6.85, 0.16, 4.15], [-6.65, 0.3, 3.95]];
  const bpts3 = bpts.map(([x, dy, z]) => [x, shelfTopAt(x, z) + dy + 0.04, z]);
  addTube(geos.dry, bpts3, (t) => 0.026 * (1 - t * 0.65), 5, 6, woodCol.clone().multiplyScalar(0.92), 1);
  const mesh = new THREE.Mesh(geos.dry.build(), MAT.wood);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.name = 'driftwoodMesh';
  group.add(mesh);
  CAVE.counts.driftwood = specs.length + 1;
  return group;
}

function buildShells() {
  const g = new Geo();
  const specs = [
    [-7.5, 4.9, 0.11, 0.4, [0.86, 0.83, 0.74]],
    [-7.2, 4.7, 0.075, 1.7, [0.78, 0.80, 0.80]],
    [-8.0, 5.1, 0.06, 2.6, [0.88, 0.84, 0.72]],
    [-6.0, 4.2, 0.08, 0.9, [0.70, 0.72, 0.74]],
    [-9.35, 6.0, 0.05, 3.1, [0.80, 0.76, 0.68]],
    [-5.65, 2.0, 0.07, 2.2, [0.72, 0.70, 0.66]],
    [-10.2, 3.6, 0.045, 1.1, [0.85, 0.82, 0.76]],
    [-8.8, 2.8, 0.055, 4.0, [0.64, 0.66, 0.68]],
  ];
  for (const [x, z, r, rot, c] of specs) {
    const y = shelfTopAt(x, z) + 0.015;
    const n = 14;
    const cx = x, cz = z;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const a = mix(-1.25, 1.25, i / n);
      const rid = 0.6 + 0.4 * Math.abs(Math.sin(i * 1.7));
      const rr2 = r * (0.5 + 0.5 * Math.abs(Math.sin(a * 1.7))) * (0.85 + 0.15 * rid);
      for (let k = 0; k <= 3; k++) {
        const rr3 = rr2 * (0.25 + 0.75 * (k / 3));
        const hh = 0.02 + 0.06 * Math.sin((k / 3) * Math.PI * 0.8) + 0.012 * Math.sin(i * 2.3);
        pts.push([cx + Math.cos(a + rot) * rr3, y + hh * (1 - k * 0.12), cz + Math.sin(a + rot) * rr3]);
      }
    }
    const col = new THREE.Color(...c);
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < 3; k++) {
        const i0 = i * 4 + k, i1 = i * 4 + k + 1;
        const j0 = (i + 1) * 4 + k, j1 = (i + 1) * 4 + k + 1;
        const cc = col.clone().multiplyScalar(0.85 + 0.15 * k);
        g.quad(pts[i0], pts[j0], pts[j1], pts[i1], cc);
      }
    }
  }
  const mesh = new THREE.Mesh(g.build(), MAT.shell);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.name = 'shells';
  CAVE.counts.shells = specs.length;
  return mesh;
}

function buildPebbles() {
  const geo = new THREE.IcosahedronGeometry(1, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0x34383a, roughness: 0.9, metalness: 0, vertexColors: false });
  const N = 160;
  const inst = new THREE.InstancedMesh(geo, mat, N);
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  const v = new THREE.Vector3();
  const s = new THREE.Vector3();
  let k = 0;
  for (let i = 0; i < N; i++) {
    const x = rr(-11.5, -4.7), z = rr(-0.5, 7.5);
    const y = shelfTopAt(x, z);
    if (rng() < 0.25) { /* clustered */ }
    v.set(x, y + 0.008, z);
    e.set(rr(0, 3), rr(0, 3), rr(0, 3));
    q.setFromEuler(e);
    const sc = rr(0.012, 0.055);
    s.set(sc * rr(0.7, 1.5), sc * rr(0.4, 0.8), sc * rr(0.7, 1.4));
    m.compose(v, q, s);
    inst.setMatrixAt(k++, m);
  }
  inst.count = k;
  inst.name = 'pebbles';
  inst.castShadow = false; inst.receiveShadow = true;
  return inst;
}

function buildBarnacles() {
  const geo = new THREE.ConeGeometry(1, 1, 6, 1, true);
  geo.translate(0, 0.5, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xb8b2a0, roughness: 0.85, metalness: 0, side: THREE.DoubleSide,
    envMapIntensity: 0.35, vertexColors: false,
  });
  const N = 720;
  const inst = new THREE.InstancedMesh(geo, mat, N);
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const up = new THREE.Vector3(0, 1, 0);
  const v = new THREE.Vector3();
  const s = new THREE.Vector3();
  let k = 0;
  for (let i = 0; i < N; i++) {
    let x, y, z, nx = 0, ny = 0, nz = 1;
    const r = rng();
    if (r < 0.55) {
      // shelf lip and wet band
      z = rr(-1.5, 18.5);
      const e = SHELF.edge(z);
      x = e + rr(-0.9, 0.55);
      y = bedHeightAt(x, z) + rr(0.05, 0.35);
    } else if (r < 0.85) {
      // buttress base
      const s2 = rr(0.05, 0.95);
      const fp = btFacePoint(s2);
      x = fp.x + BT.N.x * rr(0.15, 0.55);
      z = fp.y + BT.N.y * rr(0.15, 0.55);
      y = rr(0.05, 0.9);
      nx = BT.N.x; nz = BT.N.y; ny = 0.15;
    } else {
      // left wall base
      z = rr(-8, 12);
      x = wallXAt(-1, z, 0.4) + rr(0.1, 0.6);
      y = rr(0.02, 0.55);
      nx = 1; nz = 0;
    }
    v.set(x, y, z);
    q.setFromUnitVectors(up, new THREE.Vector3(nx, 0.8, nz).normalize());
    const sc = rr(0.008, 0.026);
    s.set(sc * rr(0.8, 1.4), sc * rr(1.2, 2.6), sc * rr(0.8, 1.4));
    m.compose(v, q, s);
    inst.setMatrixAt(k++, m);
  }
  inst.count = k;
  inst.name = 'barnacles';
  inst.receiveShadow = true;
  CAVE.counts.barnacles = k;
  return inst;
}

// ---------------------------------------------------------------------------
// Water: surge surface, foam, and the sheet climbing the buttress.
// ---------------------------------------------------------------------------

const WATER = {
  mesh: null, uniforms: null, group: null, runup: null, bedTex: null,
  debugMode: 0,
};

function buildBedTexture() {
  const W = 256, H = 320;
  const { c, ctx } = canvas2d(W, H);
  const img = ctx.createImageData(W, H);
  const d = img.data;
  const x0 = -16, x1 = 16, z0 = -34, z1 = 22;
  for (let y = 0; y < H; y++) {
    const z = mix(z0, z1, y / (H - 1));
    for (let x = 0; x < W; x++) {
      const wx = mix(x0, x1, x / (W - 1));
      const bh = clamp(bedHeightAt(wx, z), -3, 2.2);
      const v = Math.round(((bh + 3) / 6) * 255);
      const i = (y * W + x) * 4;
      d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  t.flipY = false;
  t.colorSpace = THREE.NoColorSpace;
  WATER.bedRect = new THREE.Vector4(x0, z0, x1 - x0, z1 - z0);
  return t;
}

const WATER_VERT = /* glsl */`
  uniform float uTime;
  uniform float uSurge;
  uniform float uImpact;
  uniform float uSwellH;
  uniform float uCrestZ;
  uniform sampler2D uBed;
  uniform vec4 uBedRect;

  varying vec3 vWorld;
  varying vec3 vNrm;
  varying float vDepth;
  varying float vCrest;

  float bedH(vec2 p) {
    vec2 uv = clamp((p - uBedRect.xy) / uBedRect.zw, vec2(0.001), vec2(0.999));
    return texture2D(uBed, uv).r * 6.0 - 3.0;
  }

  float shoal(float z) {
    float a = smoothstep(-32.0, -9.0, z);
    float b = 1.0 - smoothstep(0.0, 11.0, z);
    return 0.22 + 0.78 * a * b;
  }

  float waveAt(vec2 p) {
    float z = p.y;
    float d = z - uCrestZ;
    float sigma = 4.4 - 1.0 * smoothstep(-26.0, -8.0, z);
    float crest = exp(-(d * d) / (2.0 * sigma * sigma));
    float asym = 1.0 + 0.8 * smoothstep(-3.2, 1.4, d);
    float h = crest * uSwellH * shoal(z) * asym;
    h += 0.065 * uSurge * sin(z * 0.62 - uTime * 1.5) * (0.35 + 0.65 * shoal(z));
    h += 0.026 * sin(p.x * 1.9 + uTime * 1.15) * cos(z * 1.25 - uTime * 0.8);
    float b = exp(-pow((z + 6.2) / 3.0, 2.0)) * uImpact;
    h += b * 0.62;
    h += 0.055 * uSurge;
    return h;
  }

  void main() {
    vec3 pos = (modelMatrix * vec4(position, 1.0)).xyz;
    float h = waveAt(pos.xz);
    pos.y += h;
    float e = 0.45;
    float hx = waveAt(pos.xz + vec2(e, 0.0));
    float hz = waveAt(pos.xz + vec2(0.0, e));
    vNrm = normalize(vec3(h - hx, e, h - hz));
    vWorld = pos;
    vDepth = max(0.0, -bedH(pos.xz));
    vCrest = exp(-pow((pos.z - uCrestZ) / 5.2, 2.0)) * uSurge;
    gl_Position = projectionMatrix * viewMatrix * vec4(pos, 1.0);
  }
`;

const WATER_FRAG = /* glsl */`
  uniform float uTime;
  uniform float uSurge;
  uniform float uImpact;
  uniform float uFoamScroll;
  uniform float uShaft;
  uniform vec3 uSunDir;
  uniform vec3 uMouthPos;
  uniform vec3 uImpactPos;
  uniform sampler2D uNormal;
  uniform sampler2D uFoam;
  uniform sampler2D uCaustic;
  uniform float uDebug;

  varying vec3 vWorld;
  varying vec3 vNrm;
  varying float vDepth;
  varying float vCrest;

  void main() {
    vec3 V = normalize(cameraPosition - vWorld);
    vec2 duv = vWorld.xz * 0.19 + vec2(uTime * 0.010, -uTime * 0.017);
    vec3 dn = texture2D(uNormal, duv).xyz * 2.0 - 1.0;
    vec3 dn2 = texture2D(uNormal, duv * 2.3 + vec2(0.37, 0.11)).xyz * 2.0 - 1.0;
    vec3 N = normalize(vNrm + vec3(dn.x + dn2.x * 0.5, 0.0, dn.y + dn2.y * 0.5) * 0.62);

    float ndv = clamp(dot(N, V), 0.0, 1.0);
    float fres = 0.02 + 0.80 * pow(1.0 - ndv, 5.0);

    float mouthD = length(vWorld - uMouthPos);
    float glow = exp(-mouthD / 30.0);
    vec3 toMouth = normalize(uMouthPos - vWorld);
    vec3 R = reflect(-V, N);
    float streak = pow(max(dot(R, toMouth), 0.0), 3.2);
    float sky = pow(max(R.y, 0.0), 1.5);
    vec3 reflectCol = vec3(0.006, 0.012, 0.016)
      + vec3(0.80, 0.60, 0.38) * streak * (0.055 + 0.30 * glow)
      + vec3(0.12, 0.17, 0.21) * sky * 0.30;

    float deepMix = smoothstep(0.08, 2.1, vDepth);
    vec3 deep = vec3(0.0035, 0.011, 0.015);
    vec3 shallow = vec3(0.020, 0.044, 0.041);
    vec3 body = mix(shallow, deep, deepMix);
    body += vec3(0.045, 0.028, 0.012) * glow * 0.85;

    float caus = texture2D(uCaustic, vWorld.xz * 0.085 + vec2(uTime * 0.012, -uTime * 0.02)).r;
    body += vec3(0.050, 0.062, 0.050) * caus * (1.0 - deepMix) * 0.5;

    vec2 fuv = vWorld.xz * 0.20 + vec2(0.0, uFoamScroll * 0.55);
    float f1 = texture2D(uFoam, fuv).r;
    float f2 = texture2D(uFoam, fuv * 2.37 + vec2(0.31, 0.17)).r;
    float lace = f1 * 0.62 + f2 * 0.48;

    float slope = length(vNrm.xz) * 6.0;
    float crestZone = smoothstep(0.10, 0.46, vCrest);
    float crestMask = crestZone * smoothstep(0.10, 0.42, slope);
    float impactD = length(vWorld.xz - uImpactPos.xz);
    float impactMask = exp(-impactD * impactD / 30.0) * uImpact;
    float shore = (1.0 - smoothstep(0.03, 0.34, vDepth)) * smoothstep(0.15, 0.55, lace);
    float shaftLight = uShaft * exp(-length(vWorld - uImpactPos) * 0.10);
    float patchy = smoothstep(0.30, 0.72, f1) * (0.55 + 0.45 * smoothstep(0.18, 0.6, f2));
    float mask = clamp(crestMask * 0.62 + impactMask * 1.15 + shore * 0.4, 0.0, 1.0);
    float foam = smoothstep(0.40, 0.84, lace * (0.5 + 0.8 * patchy) + mask * 0.3) * mask;
    foam = clamp(foam * (0.55 + 0.65 * patchy), 0.0, 1.0);

    vec3 col = mix(body, reflectCol, fres * 0.92);

    float glint = pow(max(dot(N, normalize(V + toMouth)), 0.0), 280.0);
    col += vec3(1.0, 0.84, 0.58) * glint * (0.25 + 1.4 * glow);

    vec3 foamCol = vec3(0.56, 0.60, 0.60) * (0.30 + 0.62 * glow + 1.3 * shaftLight);
    foamCol += vec3(0.05, 0.055, 0.06);
    col = mix(col, foamCol, foam * 0.95);

    if (uDebug > 0.5) {
      vec3 dbg = vec3(0.0);
      if (uDebug < 1.5) dbg = vec3(vDepth * 0.4);
      else if (uDebug < 2.5) dbg = vec3(foam);
      else if (uDebug < 3.5) dbg = vec3(shore, crestMask, impactMask);
      else if (uDebug < 4.5) dbg = reflectCol;
      else dbg = vec3(mask * 0.5, lace, fres);
      gl_FragColor = vec4(dbg, 1.0);
      return;
    }
    gl_FragColor = vec4(col, 1.0);
  }
`;

function buildWater() {
  const group = new THREE.Group();
  group.name = 'waterGroup';

// Sheet of foam climbing the buttress face during the hit.
function buildRunUp() {
  const NS = 26, NV = 14;
  const g = new Geo();
  const c = new THREE.Color(0.8, 0.83, 0.8);
  const rows = [];
  for (let i = 0; i <= NS; i++) {
    const s = 0.03 + (i / NS) * 0.94;
    const fp = btFacePoint(s);
    const row = [];
    for (let j = 0; j <= NV; j++) {
      const v = j / NV;
      const x = fp.x + BT.N.x * (1.18 + 0.06 * Math.sin(v * 9));
      const z = fp.y + BT.N.y * (1.18 + 0.06 * Math.sin(v * 9));
      const y = v * 5.2;
      row.push([x, y, z]);
    }
    rows.push(row);
  }
  for (let i = 0; i < NS; i++) {
    for (let j = 0; j < NV; j++) {
      g.quad(rows[i][j], rows[i + 1][j], rows[i + 1][j + 1], rows[i][j + 1], c,
        [i / NS, j / NV], [(i + 1) / NS, j / NV], [(i + 1) / NS, (j + 1) / NV], [i / NS, (j + 1) / NV]);
    }
  }
  const uniforms = {
    uTime: { value: 0 }, uImpact: { value: 0 }, uShaft: { value: 0 },
    uFoam: { value: TEX.foam }, uGlow: { value: 0 },
  };
  const mat = new THREE.ShaderMaterial({
    uniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: /* glsl */`
      varying vec2 vUv; varying vec3 vWorld;
      void main(){ vUv = uv; vec4 wp = modelMatrix * vec4(position,1.0); vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp; }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime, uImpact, uShaft, uGlow;
      uniform sampler2D uFoam;
      varying vec2 vUv; varying vec3 vWorld;
      void main(){
        float rise = clamp(uImpact, 0.0, 1.0);
        float top = mix(0.08, 0.62, rise);
        float vert = smoothstep(top + 0.10, top - 0.05, vUv.y) * smoothstep(0.0, 0.05, vUv.y);
        vec2 uv = vec2(vUv.x * 7.0, vUv.y * 4.4 - uTime * 0.55);
        float f = texture2D(uFoam, uv).r;
        float f2 = texture2D(uFoam, uv * 2.3 + vec2(0.4, 0.15)).r;
        float lace = f * 0.65 + f2 * 0.4;
        float sheet = smoothstep(0.38, 0.78, lace);
        float a = vert * sheet * mix(0.04, 0.66, rise) * 0.55;
        vec3 c = vec3(0.50, 0.55, 0.55) * (0.30 + 0.65 * uGlow + 1.35 * uShaft);
        gl_FragColor = vec4(c, a);
      }
    `,
  });
  const mesh = new THREE.Mesh(g.build(), mat);
  mesh.name = 'runup';
  mesh.renderOrder = 11;
  WATER.runup = mesh;
  WATER.runupUniforms = uniforms;
  return mesh;
}

function updateWater(sim) {
  const u = WATER.uniforms;
  if (!u) return;
  u.uTime.value = sim.t;
  u.uSurge.value = sim.surge;
  u.uImpact.value = sim.impact;
  u.uCrestZ.value = sim.crestZ;
  u.uSwellH.value = sim.swellH;
  u.uFoamScroll.value = sim.foamScroll;
  u.uShaft.value = sim.shaftLight;
  u.uDebug.value = WATER.debugMode;
  if (WATER.runupUniforms) {
    WATER.runupUniforms.uTime.value = sim.t;
    WATER.runupUniforms.uImpact.value = sim.impact;
    WATER.runupUniforms.uShaft.value = sim.shaftLight;
    WATER.runupUniforms.uGlow.value = sim.mouthGlow;
  }
}

// ---------------------------------------------------------------------------
// One timing source for swell, impact, foam recession, spray and the plume.
// ---------------------------------------------------------------------------

const SIM = {
  t: 0,
  cycle: 9.2,
  startIndex: 2,
  phase: 0.15,
  surgeIndex: 2,
  surge: 0,
  impact: 0,
  crestZ: -40,
  swellH: 0.55,
  foamScroll: 0,
  mouthGlow: 0.32,
  shaftLight: 0,
  plume: 0,
  plumeIndex: -1,
  impactEvent: 0,
  plumeEvent: 0,
  dripEvent: 0,
  dripPos: new THREE.Vector3(),
  paused: false,
  acc: 0,
  step: 1 / 60,
  stepCount: 0,
  lastImpactSurge: -1,
  lastPlumeSurge: -1,
};

const SPRAY = {
  points: null,
  geo: null,
  mat: null,
  max: 900,
  pos: null, vel: null, life: null, maxLife: null, size: null, kind: null,
  head: 0,
  spawnAcc: 0,
  plumeAcc: 0,
  dripAcc: 0,
  pixelScale: 800,
};

const DRIP_SITES = [
  { x: -11.4, y: 7.0, z: 6.4 },
  { x: -12.0, y: 8.6, z: -1.6 },
  { x: 8.6, y: 8.2, z: -10.6 },
  { x: 10.4, y: 10.3, z: -6.2 },
  { x: 7.2, y: 6.1, z: -12.4 },
];

function initSim() {
  SIM.t = SIM.startIndex * SIM.cycle + SIM.phase * SIM.cycle;
  SIM.surgeIndex = SIM.startIndex;
  SIM.phase = SIM.phase;
  SIM.foamScroll = 0;
  SPRAY.pos = new Float32Array(SPRAY.max * 3);
  SPRAY.vel = new Float32Array(SPRAY.max * 3);
  SPRAY.life = new Float32Array(SPRAY.max);
  SPRAY.maxLife = new Float32Array(SPRAY.max);
  SPRAY.size = new Float32Array(SPRAY.max);
  SPRAY.kind = new Uint8Array(SPRAY.max);
  SPRAY.alpha = new Float32Array(SPRAY.max);
  for (let i = 0; i < SPRAY.max; i++) {
    SPRAY.pos[i * 3 + 1] = -100;
    SPRAY.life[i] = 0;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(SPRAY.pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(SPRAY.max), 1).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(new Float32Array(SPRAY.max), 1).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aKind', new THREE.BufferAttribute(new Float32Array(SPRAY.max), 1).setUsage(THREE.DynamicDrawUsage));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 3, -12), 40);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTex: { value: TEX.spray },
      uScale: { value: 800 },
      uShaft: { value: 0 },
      uGlow: { value: 0.3 },
    },
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute float aSize; attribute float aAlpha; attribute float aKind;
      varying float vAlpha; varying float vKind;
      uniform float uScale;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(aSize * uScale / max(0.4, -mv.z), 1.0, 220.0);
        vAlpha = aAlpha; vKind = aKind;
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uTex; uniform float uShaft; uniform float uGlow;
      varying float vAlpha; varying float vKind;
      void main(){
        vec4 t = texture2D(uTex, gl_PointCoord);
        vec3 c = vKind > 0.5 ? vec3(0.78,0.79,0.76) : vec3(0.92,0.94,0.92);
        c *= 0.55 + 0.9 * uGlow + 2.2 * uShaft;
        gl_FragColor = vec4(c, t.a * vAlpha);
      }
    `,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.renderOrder = 20;
  pts.name = 'spray';
  SPRAY.geo = geo;
  SPRAY.mat = mat;
  SPRAY.points = pts;
  return pts;
}

function spawnParticle(x, y, z, vx, vy, vz, size, life, kind) {
  const i = SPRAY.head;
  SPRAY.head = (SPRAY.head + 1) % SPRAY.max;
  SPRAY.pos[i * 3] = x; SPRAY.pos[i * 3 + 1] = y; SPRAY.pos[i * 3 + 2] = z;
  SPRAY.vel[i * 3] = vx; SPRAY.vel[i * 3 + 1] = vy; SPRAY.vel[i * 3 + 2] = vz;
  SPRAY.life[i] = life;
  SPRAY.maxLife[i] = life;
  SPRAY.size[i] = size;
  SPRAY.kind[i] = kind;
}

function spawnImpactSpray(n, strength) {
  for (let k = 0; k < n; k++) {
    const s = rr(0.04, 0.96);
    const fp = btFacePoint(s);
    const out = rr(0.15, 1.5);
    const x = fp.x + BT.N.x * out + BT.T.x * rr(-0.4, 0.4);
    const z = fp.y + BT.N.y * out + BT.T.y * rr(-0.4, 0.4);
    const y = rr(0.12, 1.15) + 0.4 * strength;
    const rad = rr(0.5, 2.6);
    const vx = BT.N.x * rad + BT.T.x * rr(-1.7, 1.7) + rr(-0.5, 0.5);
    const vz = BT.N.y * rad + BT.T.y * rr(-1.7, 1.7) + rr(-0.5, 0.5);
    const vy = rr(1.9, 6.4) * (0.5 + 0.85 * strength);
    const mist = rng() < 0.18;
    spawnParticle(x, y, z, vx, vy, vz,
      mist ? rr(1.8, 4.2) : rr(0.18, 0.55),
      mist ? rr(1.1, 2.4) : rr(0.55, 1.5), mist ? 1 : 0);
  }
}

function spawnPlume(n) {
  const s = BT.fissureS;
  const fp = btFacePoint(s);
  for (let k = 0; k < n; k++) {
    const y = rr(BT.fissureY0 + 0.1, BT.fissureY1 - 0.2);
    const jitter = rr(-0.25, 0.25);
    const x = fp.x + BT.N.x * 0.9 + BT.T.x * jitter;
    const z = fp.y + BT.N.y * 0.9 + BT.T.y * jitter;
    const out = rr(1.2, 4.2);
    const vx = BT.N.x * out + BT.T.x * rr(-0.8, 0.8);
    const vz = BT.N.y * out + BT.T.y * rr(-0.8, 0.8);
    const vy = rr(2.2, 6.4);
    const mist = rng() < 0.45;
    spawnParticle(x, y, z, vx, vy, vz,
      mist ? rr(0.9, 2.2) : rr(0.06, 0.24),
      mist ? rr(1.4, 2.8) : rr(0.5, 1.3), mist ? 1 : 0);
  }
}

function spawnDrip() {
  const s = pick(DRIP_SITES);
  const x = s.x + rr(-0.3, 0.3), z = s.z + rr(-0.3, 0.3);
  const life = 3.2;
  spawnParticle(x, s.y, z, rr(-0.04, 0.04), -0.2, rr(-0.04, 0.04), rr(0.03, 0.06), life, 2);
}

function stepParticles(dt) {
  const P = SPRAY;
  for (let i = 0; i < P.max; i++) {
    if (P.life[i] <= 0) continue;
    P.life[i] -= dt;
    const i3 = i * 3;
    if (P.life[i] <= 0) {
      P.alpha[i] = 0;
      P.pos[i3 + 1] = -100;
      continue;
    }
    const kind = P.kind[i];
    if (kind === 2) {
      P.vel[i3 + 1] -= 9.8 * dt;
      P.pos[i3] += P.vel[i3] * dt;
      P.pos[i3 + 1] += P.vel[i3 + 1] * dt;
      P.pos[i3 + 2] += P.vel[i3 + 2] * dt;
      P.alpha[i] = 0.5 * clamp01(P.life[i] / P.maxLife[i]);
      if (P.pos[i3 + 1] < 0.02) {
        P.life[i] = 0;
        P.alpha[i] = 0;
        P.pos[i3 + 1] = -100;
        SIM.dripEvent++;
        SIM.dripPos.set(P.pos[i3], 0.02, P.pos[i3 + 2]);
      }
      continue;
    }
    const drag = kind === 1 ? 1.7 : 0.55;
    P.vel[i3] -= P.vel[i3] * drag * dt;
    P.vel[i3 + 2] -= P.vel[i3 + 2] * drag * dt;
    P.vel[i3 + 1] -= (9.8 * (kind === 1 ? 0.12 : 1.0)) * dt;
    P.pos[i3] += P.vel[i3] * dt;
    P.pos[i3 + 1] += P.vel[i3 + 1] * dt;
    P.pos[i3 + 2] += P.vel[i3 + 2] * dt;
    if (kind === 1) {
      P.vel[i3] += Math.sin(SIM.t * 2.1 + i) * 0.25 * dt;
      P.vel[i3 + 2] += Math.cos(SIM.t * 1.7 + i * 1.3) * 0.22 * dt;
    }
    const lt = P.life[i] / P.maxLife[i];
    P.alpha[i] = (kind === 1 ? 0.30 : 1.0) * smoothstep(0, 0.15, lt) * smoothstep(0, 0.6, 1 - lt + 0.2);
    if (P.pos[i3 + 1] < 0.0) {
      P.life[i] = 0; P.alpha[i] = 0; P.pos[i3 + 1] = -100;
    }
  }
}

function simDerived(t) {
  const idx = Math.floor(t / SIM.cycle);
  const ph = (t / SIM.cycle) - idx;
  SIM.surgeIndex = idx;
  SIM.phase = ph;
  const rise = smoothstep(0.02, 0.36, ph);
  const fall = 1 - smoothstep(0.62, 0.98, ph);
  SIM.surge = rise * fall;
  const cp = clamp01((ph - 0.03) / 0.82);
  SIM.crestZ = mix(-41, 12, Math.pow(cp, 0.86));
  const hh = hash2i(idx, 77);
  SIM.swellH = 0.46 + hh * 0.26 + (idx % 4 === 3 ? 0.12 : 0);
  SIM.impact = smoothstep(0.515, 0.565, ph) * (1 - smoothstep(0.60, 0.79, ph));
  SIM.mouthGlow = 0.26 + 0.52 * SIM.impact + 0.20 * SIM.surge;
  const plumeOn = (idx % 4 === 3);
  SIM.plume = plumeOn
    ? smoothstep(0.545, 0.60, ph) * (1 - smoothstep(0.66, 0.79, ph))
    : 0;
  SIM.shaftLight = SIM.plume * (0.85 + 0.35 * Math.sin(SIM.t * 8.0));
  return { idx, ph, rise, fall };
}

function updateSim(dt) {
  if (CAVE.fissureGlow) CAVE.fissureGlow.opacity = Math.min(0.9, 0.05 + SIM.plume * 0.95);
  const maxDt = 0.05;
  dt = Math.min(dt, maxDt);
  if (!SIM.paused) {
    SIM.acc += dt;
    let guard = 0;
    while (SIM.acc >= SIM.step && guard < 4) {
      SIM.t += SIM.step;
      SIM.stepCount++;
      const prevPhase = SIM.phase;
      const prevIdx = SIM.surgeIndex;
      simDerived(SIM.t);
      // fixed-step emission, driven by the derived state
      if (SIM.phase < prevPhase) {
        SIM.lastImpactSurge = -1;
      }
      if (SIM.impact > 0.02 && SIM.crestZ > -10.5) {
        SIM.spawnAcc += SIM.impact * 900 * SIM.step;
        const n = Math.floor(SIM.spawnAcc);
        if (n > 0) { spawnImpactSpray(n, SIM.swellH); SIM.spawnAcc -= n; }
      }
      if (SIM.plume > 0.03 && SIM.impact > 0.0) {
        SIM.plumeAcc += SIM.plume * 1000 * SIM.step;
        const n = Math.floor(SIM.plumeAcc);
        if (n > 0) { spawnPlume(n); SIM.plumeAcc -= n; }
      }
      // drips
      SIM.dripAcc += SIM.step * (0.22 + 0.1 * Math.sin(SIM.t * 0.37));
      if (SIM.dripAcc > 1) { SIM.dripAcc = 0; spawnDrip(); }
      stepParticles(SIM.step);
      SIM.acc -= SIM.step;
      guard++;
    }
    // events for audio
    const idx = SIM.surgeIndex;
    if (SIM.impact > 0.55 && SIM.lastImpactSurge !== idx) {
      SIM.lastImpactSurge = idx;
      SIM.impactEvent++;
    }
    if (SIM.plume > 0.5 && SIM.lastPlumeSurge !== idx) {
      SIM.lastPlumeSurge = idx;
      SIM.plumeEvent++;
    }
    // foam advection follows the water's run and backwash
    const ph = SIM.phase;
    let vel = 0;
    if (ph < 0.5) vel = 0.9 * SIM.surge;
    else if (ph < 0.92) vel = -1.5 * (1 - smoothstep(0.86, 0.98, ph));
    SIM.foamScroll += vel * dt;
  }
  simDerived(SIM.t);
  // publish particle attributes (frame-rate independent of motion stepping)
  if (SPRAY.geo) {
    const sz = SPRAY.geo.getAttribute('aSize');
    const al = SPRAY.geo.getAttribute('aAlpha');
    const kd = SPRAY.geo.getAttribute('aKind');
    for (let i = 0; i < SPRAY.max; i++) {
      sz.array[i] = SPRAY.size[i];
      al.array[i] = SPRAY.alpha[i] || 0;
      kd.array[i] = SPRAY.kind[i];
    }
    sz.needsUpdate = true; al.needsUpdate = true; kd.needsUpdate = true;
    SPRAY.geo.getAttribute('position').needsUpdate = true;
  }
}

function updateSprayUniforms(camera, renderer) {

}

  haloUniforms: null,
  dust: null,

  birdGroup: null,

function holeWorldPoint(dz, du) {
  const h = CAVE.hole;
  const z = h.z + dz;
  const sec = sectionAt(z);
  const u = clamp(h.u + du, 0.55, 0.995);
  const p = sectionSide(sec, h.side, u);
  return new THREE.Vector3(p[0], p[1], z);
}

function buildHoleRim() {
  const g = new Geo();
  const n = 18;
  const outer = [];
  const inner = [];
  const C = holeWorldPoint(0, 0);
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU;
    const dz = Math.cos(a) * CAVE.hole.rz;
    const du = Math.sin(a) * CAVE.hole.ru;
    const p = holeWorldPoint(dz, du);
    inner.push(p);
    const dir = p.clone().sub(C).normalize();
    // push outward through the rock, mostly along the local outward normal
    const sec = sectionAt(p.z);
    const out = new THREE.Vector3(p.x - sec.xc, 0.35, 0).normalize();
    outer.push(p.clone().addScaledVector(out, 1.35).add(new THREE.Vector3(0, 0.25, 0)));
  }
  const c1 = new THREE.Color(0.09, 0.095, 0.10);
  const c2 = new THREE.Color(0.22, 0.21, 0.19);
  for (let i = 0; i < n; i++) {
    g.quad([inner[i].x, inner[i].y, inner[i].z], [inner[i + 1].x, inner[i + 1].y, inner[i + 1].z],
      [outer[i + 1].x, outer[i + 1].y, outer[i + 1].z], [outer[i].x, outer[i].y, outer[i].z], c1);
  }
  const mesh = new THREE.Mesh(g.build(), new THREE.MeshStandardMaterial({
    color: 0xffffff, vertexColors: true, roughness: 0.9, metalness: 0,
    side: THREE.DoubleSide, envMapIntensity: 0.2,
  }));

  return mesh;
}

function makeBirdBody(scale) {

function buildHighSlot() {

  group.position.copy(SLOT_POS);

function buildMistShaft() {
  const A = SLOT_POS.clone();
  const B = new THREE.Vector3(8.0, 1.2, -8.6);
  const mid = A.clone().add(B).multiplyScalar(0.5);
  const len = A.distanceTo(B);
  const group = new THREE.Group();
  group.name = 'shaftBeam';
  group.position.copy(mid);
  const mkBeam = (width, opacity) => {
    const geo = new THREE.PlaneGeometry(width, len, 1, 1);
    const uniforms = {
      uTime: { value: 0 }, uIntensity: { value: 0 },
      uOpacity: { value: opacity }, uTex: { value: TEX.mist },
      uColor: { value: new THREE.Color(1.0, 0.86, 0.66) },
    };
    const mat = new THREE.ShaderMaterial({
      uniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime, uIntensity, uOpacity; uniform sampler2D uTex; uniform vec3 uColor;
        varying vec2 vUv;
        void main(){
          float edge = smoothstep(0.0, 0.38, vUv.x) * smoothstep(1.0, 0.62, vUv.x);
          float ends = smoothstep(0.0, 0.22, vUv.y) * smoothstep(1.0, 0.35, vUv.y);
          vec2 uv = vec2(vUv.x * 0.9 + 0.05, vUv.y * 1.6 - uTime * 0.06);
          float n = texture2D(uTex, uv).a * 0.7 + texture2D(uTex, uv * 2.3 + vec2(0.3, 0.2)).a * 0.5;
          float a = edge * ends * (0.25 + 0.9 * n) * uIntensity * uOpacity;
          gl_FragColor = vec4(uColor, a);
        }
      `,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    group.add(mesh);
    return { mesh, uniforms };
  };
  const main = mkBeam(6.4, 1.0);
  const halo = mkBeam(12.0, 0.32);
  ATMOS.group = group;
  ATMOS.beam = main.mesh;
  ATMOS.beamUniforms = main.uniforms;
  ATMOS.halo = halo.mesh;
  ATMOS.haloUniforms = halo.uniforms;
  ATMOS.beamAxis = { A, B, mid, len };
  return group;
}

function buildDust() {
  const N = 140;
  const pos = new Float32Array(N * 3);
  const seed = new Float32Array(N);
  const A = new THREE.Vector3(6.2, 14.6, -13.2);
  const B = new THREE.Vector3(8.0, 1.0, -8.8);
  for (let i = 0; i < N; i++) {
    const t = rng();
    const p = A.clone().lerp(B, t);
    const spread = 0.5 + 2.2 * Math.sin(t * Math.PI);
    pos[i * 3] = p.x + rr(-spread, spread);
    pos[i * 3 + 1] = p.y + rr(-spread * 0.6, spread * 0.6);
    pos[i * 3 + 2] = p.z + rr(-spread, spread);
    seed[i] = rng() * 100;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uIntensity: { value: 0 }, uTex: { value: TEX.spray }, uScale: { value: 700 } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute float aSeed; uniform float uTime, uScale; varying float vA;
      void main(){
        vec3 p = position;
        p.x += sin(uTime * 0.21 + aSeed) * 0.5;
        p.y += cos(uTime * 0.17 + aSeed * 1.7) * 0.35 - mod(uTime * 0.12 + aSeed, 1.0) * 0.8;
        p.z += sin(uTime * 0.13 + aSeed * 2.1) * 0.4;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(0.09 * uScale / max(1.0, -mv.z), 1.0, 6.0);
        vA = 0.5 + 0.5 * sin(aSeed * 9.0 + uTime * 1.3);
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uTex; uniform float uIntensity; varying float vA;
      void main(){
        vec4 t = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(vec3(1.0, 0.9, 0.75), t.a * vA * uIntensity * 0.5);
      }
    `,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.name = 'dust';
  ATMOS.dust = pts;
  ATMOS.dustUniforms = mat.uniforms;
  return pts;
}

const _bq = new THREE.Quaternion();
const _bm = new THREE.Matrix4();
const _right = new THREE.Vector3();
const _up = new THREE.Vector3();
const _norm = new THREE.Vector3();
const _toCam = new THREE.Vector3();

function updateAtmos(sim, camera) {
  if (!ATMOS.group) return;
  const ax = ATMOS.beamAxis;
  const dir = _up.subVectors(ax.B, ax.A).normalize();
  _toCam.subVectors(camera.position, ax.mid).normalize();
  _right.crossVectors(dir, _toCam).normalize();
  _norm.crossVectors(_right, dir).normalize();
  _bm.makeBasis(_right, dir, _norm);
  ATMOS.group.quaternion.setFromRotationMatrix(_bm);
  const inten = sim.shaftLight;
  ATMOS.beamUniforms.uTime.value = sim.t;
  ATMOS.beamUniforms.uIntensity.value = inten;
  ATMOS.haloUniforms.uTime.value = sim.t;
  ATMOS.haloUniforms.uIntensity.value = inten;
  if (ATMOS.dustUniforms) {
    ATMOS.dustUniforms.uTime.value = sim.t;
    ATMOS.dustUniforms.uIntensity.value = inten;
  }
  for (const b of ATMOS.birds) {
    const u = b.userData;
    b.position.y = u.baseY + Math.sin(sim.t * u.speed + u.bob) * 0.012;
    b.rotation.y = u.baseRot + Math.sin(sim.t * u.speed * 0.7 + u.bob) * 0.12;
    if (u.flutter > 0.3) {
      b.rotation.z = Math.sin(sim.t * 6.0) * 0.03;
      b.position.x += Math.sin(sim.t * 0.8) * 0.0004;
    }
  }
}

// ---------------------------------------------------------------------------
// Procedural cave audio. Silent until the SOUND button; never gates visuals.
// ---------------------------------------------------------------------------

const AUDIO = {
  ctx: null, master: null, enabled: false, muted: true,
  surfGain: null, surfLP: null, foamGain: null, rumbleGain: null,
  convolver: null, nextDrip: 0, lastImpact: 0, lastPlume: 0, lastDrip: 0,
};

function makeNoiseBuffer(ctx, seconds, kind) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = rng() * 2 - 1;
    if (kind === 'brown') {
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.2;
    } else {
      d[i] = w;
    }
  }
  return buf;
}

function makeImpulse(ctx, seconds) {
  const sr = ctx.sampleRate;
  const len = Math.floor(sr * seconds);
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    const er = [0.031, 0.058, 0.097, 0.143, 0.212];
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      let v = (rng() * 2 - 1) * Math.exp(-t * 2.35) * 0.55;
      for (const e of er) {
        const idx = Math.floor((e + ch * 0.004) * sr);
        if (i === idx) v += 0.5 * (ch === 0 ? 1 : 0.82);
      }
      d[i] = v;
    }
  }
  return buf;
}

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  const ctx = new AC();
  AUDIO.ctx = ctx;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -17;
  comp.knee.value = 22;
  comp.ratio.value = 3.2;
  comp.attack.value = 0.02;
  comp.release.value = 0.45;
  const master = ctx.createGain();
  master.gain.value = 0.0;
  master.connect(comp).connect(ctx.destination);
  AUDIO.master = master;

  const convolver = ctx.createConvolver();
  convolver.buffer = makeImpulse(ctx, 3.1);
  const wet = ctx.createGain();
  wet.gain.value = 0.62;
  convolver.connect(wet).connect(master);
  AUDIO.convolver = convolver;

  const brown = makeNoiseBuffer(ctx, 5.0, 'brown');
  const white = makeNoiseBuffer(ctx, 3.0, 'white');

  // low resonant surf bed
  const surf = ctx.createBufferSource();
  surf.buffer = brown; surf.loop = true;
  const surfLP = ctx.createBiquadFilter();
  surfLP.type = 'lowpass'; surfLP.frequency.value = 150; surfLP.Q.value = 1.4;
  const surfGain = ctx.createGain(); surfGain.gain.value = 0.0;
  surf.connect(surfLP).connect(surfGain);
  surfGain.connect(master); surfGain.connect(convolver);
  surf.start(0);
  AUDIO.surfGain = surfGain; AUDIO.surfLP = surfLP;

  // granular foam hiss
  const foam = ctx.createBufferSource();
  foam.buffer = white; foam.loop = true;
  const foamBP = ctx.createBiquadFilter();
  foamBP.type = 'bandpass'; foamBP.frequency.value = 2400; foamBP.Q.value = 0.45;
  const foamHP = ctx.createBiquadFilter();
  foamHP.type = 'highpass'; foamHP.frequency.value = 700;
  const foamGain = ctx.createGain(); foamGain.gain.value = 0.0;
  foam.connect(foamBP).connect(foamHP).connect(foamGain);
  foamGain.connect(master);
  const foamWet = ctx.createGain(); foamWet.gain.value = 0.35;
  foamGain.connect(foamWet).connect(convolver);
  foam.start(0);
  AUDIO.foamGain = foamGain;

  // sub rumble
  const rum = ctx.createBufferSource();
  rum.buffer = brown; rum.loop = true;
  const rumLP = ctx.createBiquadFilter();
  rumLP.type = 'lowpass'; rumLP.frequency.value = 64; rumLP.Q.value = 0.8;
  const rumGain = ctx.createGain(); rumGain.gain.value = 0.0;
  rum.connect(rumLP).connect(rumGain).connect(master);
  rum.start(0);
  AUDIO.rumbleGain = rumGain;

  AUDIO.white = white;
  AUDIO.muted = false;
  AUDIO.enabled = true;
  master.gain.setTargetAtTime(0.34, ctx.currentTime, 0.9);
  AUDIO.nextDrip = ctx.currentTime + 1.2;
  if (ctx.state === 'suspended') ctx.resume();
  return true;
}

function toggleAudio() {
  if (!AUDIO.ctx) {
    const ok = initAudio();
    return !!ok;
  }
  AUDIO.muted = !AUDIO.muted;
  const now = AUDIO.ctx.currentTime;
  AUDIO.master.gain.cancelScheduledValues(now);
  AUDIO.master.gain.setTargetAtTime(AUDIO.muted ? 0.0001 : 0.34, now, 0.35);
  if (!AUDIO.muted && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
  return !AUDIO.muted;
}

function audioDrip(pan, gain, pitch) {
  const ctx = AUDIO.ctx;
  if (!ctx || AUDIO.muted) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  const g = ctx.createGain();
  const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  osc.frequency.setValueAtTime(pitch, now);
  osc.frequency.exponentialRampToValueAtTime(pitch * 0.32, now + 0.085);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(gain, now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
  osc.connect(g);
  let out = g;
  if (p) { p.pan.value = pan; g.connect(p); out = p; }
  out.connect(AUDIO.master);
  const wg = ctx.createGain(); wg.gain.value = 0.8;
  out.connect(wg).connect(AUDIO.convolver);
  osc.start(now); osc.stop(now + 0.3);
}

function audioBurst(gain, freq, dur, q) {
  const ctx = AUDIO.ctx;
  if (!ctx || AUDIO.muted || !AUDIO.white) return;
  const now = ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = AUDIO.white;
  src.loop = true;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q || 0.8;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(gain, now + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(bp).connect(g);
  g.connect(AUDIO.master);
  const w = ctx.createGain(); w.gain.value = 0.5;
  g.connect(w).connect(AUDIO.convolver);
  src.start(now); src.stop(now + dur + 0.05);
}

function updateAudio(sim) {
  if (!AUDIO.ctx || !AUDIO.enabled) return;
  const ctx = AUDIO.ctx;
  const now = ctx.currentTime;
  const paused = sim.paused;
  const surge = paused ? 0.12 : sim.surge;
  const impact = paused ? 0 : sim.impact;
  AUDIO.surfGain.gain.setTargetAtTime(0.028 + surge * 0.115 + impact * 0.045, now, 0.25);
  AUDIO.surfLP.frequency.setTargetAtTime(120 + surge * 165 - impact * 30, now, 0.3);
  AUDIO.foamGain.gain.setTargetAtTime(0.004 + impact * 0.075 + sim.plume * 0.02, now, 0.12);
  AUDIO.rumbleGain.gain.setTargetAtTime(0.055 + impact * 0.05 + surge * 0.02, now, 0.4);

  if (sim.impactEvent !== AUDIO.lastImpact) {
    AUDIO.lastImpact = sim.impactEvent;
    audioBurst(0.16, 520, 1.05, 0.7);
    audioBurst(0.09, 180, 1.5, 0.9);
  }
  if (sim.plumeEvent !== AUDIO.lastPlume) {
    AUDIO.lastPlume = sim.plumeEvent;
    audioBurst(0.075, 1500, 1.2, 0.5);
    audioBurst(0.05, 3200, 0.7, 0.4);
  }
  if (sim.dripEvent !== AUDIO.lastDrip) {
    AUDIO.lastDrip = sim.dripEvent;
    audioDrip(clamp((sim.dripPos.x + 8) / 18, -0.8, 0.8), 0.035 + rng() * 0.02, 760 + rng() * 340);
  }
  if (!AUDIO.muted && now > AUDIO.nextDrip) {
    audioDrip(rr(-0.75, 0.85), 0.028 + rng() * 0.022, 900 + rng() * 500);
    AUDIO.nextDrip = now + rr(1.6, 5.4);
  }
}

const YAW_LIMIT = 0.34;
const TILT_LIMIT = 0.20;
const ZOOM_MIN = 0.84, ZOOM_MAX = 1.28;

function baseDirection(az, pitch, out) {
  out.set(Math.sin(az) * Math.cos(pitch), Math.sin(pitch), -Math.cos(az) * Math.cos(pitch));
  return out;
}

function updateCamera(dt, realTime) {
  // damped inputs
  VIEW.az = expDamp(VIEW.az, VIEW.azT, 9, dt);
  VIEW.pitch = expDamp(VIEW.pitch, VIEW.pitchT, 9, dt);
  VIEW.zoom = expDamp(VIEW.zoom, VIEW.zoomT, 7, dt);
  VIEW.yaw = expDamp(VIEW.yaw, VIEW.yawT, 7, dt);
  VIEW.tilt = expDamp(VIEW.tilt, VIEW.tiltT, 7, dt);
  VIEW.cin = expDamp(VIEW.cin, VIEW.cinT, 2.4, dt);
  if (VIEW.resetting && Math.abs(VIEW.yawT) < 1e-4 && Math.abs(VIEW.tiltT) < 1e-4 && Math.abs(VIEW.zoomT - 1) < 1e-4
    && Math.abs(VIEW.az - VIEW.azT) < 1e-3 && Math.abs(VIEW.pitch - VIEW.pitchT) < 1e-3) {
    VIEW.resetting = false;
  }

  const fwd = baseDirection(VIEW.az, VIEW.pitch, new THREE.Vector3());
  const right = new THREE.Vector3(Math.cos(VIEW.az), 0, Math.sin(VIEW.az));
  const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
  // cinematic lateral dolly + slight push-in, very slow
  const ct = realTime;
  const lat = Math.sin(ct * 0.068) * 1.25 + Math.sin(ct * 0.021 + 1.3) * 0.35;
  const push = (1 - Math.cos(ct * 0.047)) * 0.55;
  const lift = Math.sin(ct * 0.033 + 0.4) * 0.10;
  const cam = WORLD.camHome.clone();
  cam.addScaledVector(right, lat * VIEW.cin + VIEW.yaw * 1.9);
  cam.addScaledVector(up, lift * VIEW.cin + VIEW.tilt * 1.5);
  cam.addScaledVector(fwd, push * VIEW.cin + (1 - VIEW.zoom) * 7.5);
  // keep the eye safely inside the alcove
  cam.x = clamp(cam.x, -13.2, -4.9);
  cam.y = clamp(cam.y, 1.85, 6.2);
  cam.z = clamp(cam.z, 4.2, 17.2);
  APP.camera.position.copy(cam);

  const lookYaw = VIEW.yaw * 0.55;
  const lookPitch = VIEW.tilt * 0.8;
  const dir = fwd.clone();
  dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), -lookYaw);
  dir.applyAxisAngle(right, lookPitch);
  const target = cam.clone().addScaledVector(dir, 30);
  target.addScaledVector(right, lat * VIEW.cin * 0.35);
  APP.camera.lookAt(target);
  APP.camera.updateMatrixWorld();
}

function resetView() {
  VIEW.yawT = 0; VIEW.tiltT = 0; VIEW.zoomT = 1;
  VIEW.cinT = 1; VIEW.cinematic = true;
  VIEW.resetting = true;
  setPressed('btn-cinematic', true);
  flashStatus('cinematic');
}

let _statusTimer = 0;
function flashStatus(text) {
  const el = document.getElementById('status');
  if (!el) return;
  el.textContent = text;
  el.classList.add('flash');
  clearTimeout(_statusTimer);
  _statusTimer = setTimeout(() => { el.classList.remove('flash'); el.textContent = ''; }, 1500);
  showOverlay();
}

function setPressed(id, on) {
  const el = document.getElementById(id);
  if (el) el.setAttribute('aria-pressed', on ? 'true' : 'false');
}

function toggleCinematic() {
  VIEW.cinematic = !VIEW.cinematic;
  VIEW.cinT = VIEW.cinematic ? 1 : 0;
  setPressed('btn-cinematic', VIEW.cinematic);
  showOverlay();
}

function togglePause() {
  SIM.paused = !SIM.paused;
  setPressed('btn-pause', SIM.paused);
  const b = document.getElementById('btn-pause');
  if (b) b.textContent = SIM.paused ? 'Resume' : 'Pause';
  flashStatus(SIM.paused ? 'time held' : 'time running');
}

function showOverlay() {
  VIEW.lastMove = performance.now();
  if (VIEW.overlayDim) {
    VIEW.overlayDim = false;
    document.getElementById('overlay').classList.remove('dim');
  }
}

function updateOverlay(now) {
  if (!VIEW.overlayDim && now - VIEW.lastMove > 9000) {
    VIEW.overlayDim = true;
    document.getElementById('overlay').classList.add('dim');
  }
}

function setupUI() {
  const canvas = document.getElementById('scene');
  const el = document.getElementById('overlay');

  document.getElementById('btn-cinematic').addEventListener('click', toggleCinematic);
  document.getElementById('btn-reset').addEventListener('click', resetView);
  document.getElementById('btn-pause').addEventListener('click', togglePause);
  const soundBtn = document.getElementById('btn-sound');
  soundBtn.addEventListener('click', () => {
    const on = toggleAudio();
    setPressed('btn-sound', on);
    showOverlay();
  });

  el.addEventListener('pointermove', showOverlay);
  el.addEventListener('pointerdown', showOverlay);
  window.addEventListener('keydown', (e) => {
    showOverlay();
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.code === 'Space' && e.target && e.target.tagName === 'BUTTON') return;
    if (e.code === 'KeyC') toggleCinematic();
    else if (e.code === 'KeyR') resetView();
    else if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.code === 'KeyM') {
      const on = toggleAudio();
      setPressed('btn-sound', on);
    }
  });
  document.addEventListener('focusin', showOverlay);

  const startDrag = (e) => {
    if (e.target !== canvas) return;
    canvas.setPointerCapture(e.pointerId);
    VIEW.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (VIEW.pointers.size === 1) {
      VIEW.drag = { x: e.clientX, y: e.clientY };
      canvas.classList.add('dragging');
    } else if (VIEW.pointers.size === 2) {
      const pts = [...VIEW.pointers.values()];
      VIEW.pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      VIEW.drag = null;
    }
    showOverlay();
  };
  canvas.addEventListener('pointerdown', startDrag);
  canvas.addEventListener('pointermove', (e) => {
    showOverlay();
    if (!VIEW.pointers.has(e.pointerId)) return;
    VIEW.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (VIEW.pointers.size === 2) {
      const pts = [...VIEW.pointers.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (VIEW.pinchDist > 0) {
        VIEW.zoomT = clamp(VIEW.zoomT * (VIEW.pinchDist / Math.max(1, d)), ZOOM_MIN, ZOOM_MAX);
        takeManual();
      }
      VIEW.pinchDist = d;
      return;
    }
    if (VIEW.drag) {
      const dx = e.clientX - VIEW.drag.x;
      const dy = e.clientY - VIEW.drag.y;
      VIEW.drag.x = e.clientX; VIEW.drag.y = e.clientY;
      VIEW.yawT = clamp(VIEW.yawT - dx * 0.0017, -YAW_LIMIT, YAW_LIMIT);
      VIEW.tiltT = clamp(VIEW.tiltT + dy * 0.0013, -TILT_LIMIT, TILT_LIMIT);
      takeManual();
    }
  });
  const endDrag = (e) => {
    VIEW.pointers.delete(e.pointerId);
    if (VIEW.pointers.size === 0) {
      VIEW.drag = null;
      VIEW.pinchDist = 0;
      canvas.classList.remove('dragging');
    } else if (VIEW.pointers.size === 1) {
      const p = [...VIEW.pointers.values()][0];
      VIEW.drag = { x: p.x, y: p.y };
    }
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    VIEW.zoomT = clamp(VIEW.zoomT * Math.exp(e.deltaY * 0.0011), ZOOM_MIN, ZOOM_MAX);
    takeManual();
    showOverlay();
  }, { passive: false });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
}

function takeManual() {
  if (VIEW.cinematic) {
    VIEW.cinematic = false;
    VIEW.cinT = 0;
    setPressed('btn-cinematic', false);
  }
}

// ---------------------------------------------------------------------------
// Boot, render loop, composition.
// ---------------------------------------------------------------------------

const APP = {
  renderer: null, scene: null, camera: null, composer: null, bloom: null,
  ready: false, dprCap: 1.5, realTime: 0, bootMs: 0,
  lastBakePos: new THREE.Vector3(999, 999, 999),
  frame: 0,
  perfAcc: 0, perfN: 0, perfChecks: 0, scale: 1,
};

function showError(err) {
  const el = document.getElementById('err');
  el.style.display = 'flex';
  el.textContent = 'The scene could not be rendered.\n\n' + ((err && (err.stack || err.message)) || err);
  const veil = document.getElementById('veil');
  if (veil) veil.classList.add('gone');
  console.error(err);
}

function setupRenderer() {
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: true, powerPreference: 'high-performance', stencil: false,
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, APP.dprCap));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  APP.renderer = renderer;
  return renderer;
}

function setupPost(w, h) {
  const dpr = Math.min(window.devicePixelRatio || 1, APP.dprCap);
  const composer = new EffectComposer(APP.renderer);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  composer.addPass(new RenderPass(APP.scene, APP.camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(w * 0.5, h * 0.5), 0.30, 0.5, 1.0);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  APP.composer = composer;
  APP.bloom = bloom;
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!APP.renderer) return;
  APP.camera.aspect = w / h;
  APP.camera.fov = (w / h) < 0.95 ? 66 : WORLD.fov;
  APP.camera.updateProjectionMatrix();
  const dpr = Math.min(window.devicePixelRatio || 1, APP.dprCap) * APP.scale;
  APP.renderer.setPixelRatio(dpr);
  APP.renderer.setSize(w, h, false);
  if (APP.composer) {
    APP.composer.setPixelRatio(dpr);
    APP.composer.setSize(w, h);
    if (APP.bloom) APP.bloom.resolution.set(w * 0.5 * APP.scale, h * 0.5 * APP.scale);
  }
}

function makeHeadlands() {
  const group = new THREE.Group();
  group.name = 'headlands';
  const mat = new THREE.MeshBasicMaterial({ color: 0x76878d, fog: false });
  const matFar = new THREE.MeshBasicMaterial({ color: 0x8d9ba0, fog: false });
  const mk = (x, z, r, h, mat2) => {
    const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7, 1), mat2);
    m.position.set(x, h * 0.5 - 1.2, z);
    m.scale.z = 0.7;
    group.add(m);
  };
  mk(-11, -128, 9, 21, mat);
  mk(9, -168, 22, 15, matFar);
  mk(42, -196, 34, 22, matFar);
  mk(-46, -205, 30, 14, matFar);
  return group;
}

function buildAll() {
  const t0 = performance.now();
  const scene = APP.scene;
  const W = window.innerWidth, H = window.innerHeight;

  document.getElementById('veilStatus').textContent = 'cutting basalt';
  document.getElementById('veilBar').style.width = '10%';
  initTextures();
  initMaterials();
  initLights(scene);

  APP.scene.fog = new THREE.FogExp2(0x0a1419, 0.0068);
  document.getElementById('veilStatus').textContent = 'opening the vault';
  document.getElementById('veilBar').style.width = '26%';

  const sky = new THREE.Mesh(new THREE.SphereGeometry(620, 40, 26), makeSkyMaterial());
  sky.frustumCulled = false;
  sky.name = 'sky';
  scene.add(sky);

  const seaGeo = new THREE.PlaneGeometry(700, 420, 1, 1);
  seaGeo.rotateX(-Math.PI / 2);
  const sea = new THREE.Mesh(seaGeo, makeSeaMaterial());
  sea.position.set(0, -0.02, -244);
  sea.name = 'seaOutside';
  scene.add(sea);
  APP.seaMat = sea.material;
  APP.skyMat = sky.material;
  scene.add(makeHeadlands());

  document.getElementById('veilStatus').textContent = 'raising the chamber';
  document.getElementById('veilBar').style.width = '42%';
  const shell = buildShell();
  scene.add(shell);
  scene.add(buildPortal());

  document.getElementById('veilStatus').textContent = 'setting the columns';
  document.getElementById('veilBar').style.width = '56%';
  const mass = buildButtressMass();
  scene.add(mass);
  const geos = buildCaveColonnades();
  buildButtressColumns(geos);
  buildLedges(geos);
  buildShelfMesh(geos);
  buildShelfStumps(geos);
  buildFallenColumns(geos);
  for (const m of caveColumnMeshes(geos)) scene.add(m);

  document.getElementById('veilStatus').textContent = 'wetting the stone';
  document.getElementById('veilBar').style.width = '68%';
  scene.add(buildFissure());
  const drift = buildDriftwood();
  scene.add(drift);
  scene.add(buildShells());
  scene.add(buildPebbles());
  scene.add(buildBarnacles());

  document.getElementById('veilStatus').textContent = 'drawing the tide';
  document.getElementById('veilBar').style.width = '80%';
  scene.add(buildWater());
  const spray = initSim();
  scene.add(spray);

  document.getElementById('veilStatus').textContent = 'letting in the light';
  document.getElementById('veilBar').style.width = '90%';
  scene.add(buildMistShaft());
  scene.add(buildDust());
  scene.add(buildHighSlot());

  setupUI();
  APP.camera.aspect = W / H;
  APP.camera.updateProjectionMatrix();
  updateCamera(0.016, 0);
  updateSim(0.0001);
  updateSprayUniforms(APP.camera, APP.renderer);
  updateWater(SIM, APP.camera);
  updateAtmos(SIM, APP.camera);
  setupPost(W, H);

  APP.renderer.shadowMap.needsUpdate = true;
  APP.renderer.compile(scene, APP.camera);
  APP.composer.render();
  APP.bootMs = Math.round(performance.now() - t0);

  const veil = document.getElementById('veil');
  setTimeout(() => {
    veil.classList.add('gone');
    document.getElementById('scene').classList.add('ready');
  }, 240);
  setTimeout(() => { veil.style.display = 'none'; }, 2200);
}

function adaptQuality(ms) {
  APP.perfAcc += ms; APP.perfN++;
  if (APP.perfN < 90) return;
  const avg = APP.perfAcc / APP.perfN;
  APP.perfAcc = 0; APP.perfN = 0; APP.perfChecks++;
  if (APP.perfChecks < 2) return;
  let changed = false;
  if (avg > 32 && APP.scale > 0.8) { APP.scale = Math.max(0.8, APP.scale - 0.1); changed = true; }
  else if (avg < 17 && APP.scale < 1.0) { APP.scale = Math.min(1.0, APP.scale + 0.08); changed = true; }
  if (changed) onResize();
}

function updateFrame(dt) {
  const scene = APP.scene;
  APP.frame++;
  updateCamera(dt, APP.realTime);
  updateSim(dt);
  updateWater(SIM, APP.camera);
  updateAtmos(SIM, APP.camera);
  updateAudio(SIM);
  updateSprayUniforms(APP.camera, APP.renderer);
  if (APP.skyMat) APP.skyMat.uniforms.uTime.value = APP.realTime;
  if (APP.seaMat) APP.seaMat.uniforms.uTime.value = APP.realTime;

  if (!APP.freezeLights) {
    LIGHTS.bounce.intensity = 0.07 + SIM.mouthGlow * 0.13;
    LIGHTS.skylight.intensity = 0.46 + SIM.mouthGlow * 0.26;
    LIGHTS.mouthPoint.intensity = 140 + SIM.mouthGlow * 200;
    LIGHTS.hemi.intensity = 0.12 + SIM.surge * 0.04 + SIM.impact * 0.04;
    LIGHTS.waterBounce.intensity = 0.07 + SIM.impact * 0.22;
    LIGHTS.shelfLamp.intensity = 4.5 + SIM.mouthGlow * 3.0;
    LIGHTS.shaft.intensity = SIM.shaftLight * 480;
    LIGHTS.shaft.visible = SIM.shaftLight > 0.004;
  }
  if (SIM.shaftLight > 0.004) APP.renderer.shadowMap.needsUpdate = true;
  updateOverlay(performance.now());
}

function animate() {
  requestAnimationFrame(animate);
  if (!APP.ready) return;
  const rawDt = APP.clock ? APP.clock.getDelta() : 0.016;
  const dt = Math.min(0.06, rawDt);
  APP.frameEma = APP.frameEma ? APP.frameEma * 0.9 + rawDt * 0.1 : rawDt;
  APP.realTime += dt;
  updateFrame(dt);
  APP.composer.render();
  adaptQuality(rawDt * 1000);
}

function boot() {
  try {
    setupRenderer();
    APP.clock = new THREE.Clock();
    APP.scene = new THREE.Scene();
    APP.camera = new THREE.PerspectiveCamera((window.innerWidth / window.innerHeight) < 0.95 ? 66 : WORLD.fov, window.innerWidth / window.innerHeight, 0.08, 1400);
    buildAll();
    APP.ready = true;
    window.addEventListener('resize', onResize);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && AUDIO.ctx && AUDIO.ctx.state === 'running') AUDIO.ctx.suspend();
      else if (!document.hidden && AUDIO.ctx && !AUDIO.muted) AUDIO.ctx.resume();
    });

    window.__basalt = {
      ready: true, app: APP, scene: APP.scene, camera: APP.camera, THREE, sim: SIM,
      counts: CAVE.counts,
      look(px, py, pz, tx, ty, tz) {
        APP.camera.position.set(px, py, pz);
        APP.camera.lookAt(tx, ty, tz);
        updateWater(SIM, APP.camera); updateAtmos(SIM, APP.camera);
        APP.composer.render();
      },
      setSimTime(t) {
        SIM.t = t;
        simDerived(SIM.t);
        updateCamera(0.016, APP.realTime);
        updateWater(SIM, APP.camera);
        updateAtmos(SIM, APP.camera);
        LIGHTS.shaft.intensity = SIM.shaftLight * 260;
        updateSprayUniforms(APP.camera, APP.renderer);
        APP.composer.render();
      },
      setPaused(v) { SIM.paused = !!v; },
      advance(sec) {
        SIM.paused = false;
        const n = Math.ceil(sec / 0.0166);
        for (let i = 0; i < n; i++) updateSim(0.0166);
        SIM.paused = true;
        updateCamera(0.016, APP.realTime);
        updateWater(SIM, APP.camera);
        updateAtmos(SIM, APP.camera);
        updateSprayUniforms(APP.camera, APP.renderer);
        APP.renderer.shadowMap.needsUpdate = true;
        APP.composer.render();
      },
      waterDebug(n) { WATER.debugMode = n; updateWater(SIM, APP.camera); APP.composer.render(); },
      pose(px, py, pz, az, pitch) {
        WORLD.camHome.set(px, py, pz);
        VIEW.az = VIEW.azT = az * DEG;
        VIEW.pitch = VIEW.pitchT = pitch * DEG;
        VIEW.cin = VIEW.cinT = 0;
        VIEW.yaw = VIEW.yawT = 0; VIEW.tilt = VIEW.tiltT = 0; VIEW.zoom = VIEW.zoomT = 1;
        updateCamera(0.016, 0);
        updateWater(SIM, APP.camera);
        updateAtmos(SIM, APP.camera);
        APP.composer.render();
      },
      perf() {
        return { emaMs: APP.frameEma ? +(APP.frameEma * 1000).toFixed(1) : null, fpsEst: APP.frameEma ? +(1 / APP.frameEma).toFixed(1) : null, simT: +SIM.t.toFixed(2) };
      },
      frameInfo() {
        return {
          calls: APP.renderer.info.render.calls, tris: APP.renderer.info.render.triangles,
          programs: APP.renderer.info.programs.length,
          dpr: APP.renderer.getPixelRatio(), simT: SIM.t, phase: SIM.phase,
          surge: SIM.surge, impact: SIM.impact, plume: SIM.plume,
        };
      },
      lights: LIGHTS,
      audioState() { return { hasCtx: !!AUDIO.ctx, muted: AUDIO.muted, enabled: AUDIO.enabled, state: AUDIO.ctx ? AUDIO.ctx.state : null }; },
      view() { return { cinematic: VIEW.cinematic, yaw: +VIEW.yaw.toFixed(3), zoom: +VIEW.zoom.toFixed(3), paused: SIM.paused, dim: VIEW.overlayDim, cam: APP.camera.position.toArray().map((v) => +v.toFixed(2)) }; },
      dumpTex(name) {
        const t = TEX[name];
        if (!t || !t.image) return null;
        const c = document.createElement('canvas');
        c.width = t.image.width; c.height = t.image.height;
        c.getContext('2d').drawImage(t.image, 0, 0);
        return c.toDataURL('image/png');
      },
      testRock(mode) {
        APP.scene.traverse((o) => {
          if (o.isMesh && (o.name || '').startsWith('columns')) {
            if (!o.userData.rockMat) o.userData.rockMat = o.material;
            const base = o.userData.rockMat;
            if (mode === 0) o.material = base;
            else if (mode === 1) o.material = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.95, metalness: 0 });
            else if (mode === 2) o.material = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.95, metalness: 0 });
            else if (mode === 3) o.material = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.95, metalness: 0, map: TEX.basaltAlbedo, normalMap: TEX.basaltNormal });
            else if (mode === 4) o.material = new THREE.MeshPhysicalMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.8, metalness: 0, map: TEX.basaltAlbedo, clearcoat: 0.3 });
            o.material.needsUpdate = true;
          }
        });
        APP.composer.render();
      },
      freezeLights(v) { APP.freezeLights = !!v; },
      paint(name, color) {
        APP.scene.traverse((o) => {
          if (o.name === name && o.isMesh) o.material = new THREE.MeshBasicMaterial({ color });
        });
        APP.composer.render();
      },
      hide(name) { APP.scene.traverse((o) => { if (o.name === name) o.visible = false; }); },
      setMat(name, flat) {
        APP.scene.traverse((o) => {
          if (o.name === name && o.isMesh) {
            if (!o.userData.savedMat) o.userData.savedMat = o.material;
            o.material = flat ? new THREE.MeshBasicMaterial({ color: 0x777777, side: THREE.DoubleSide })
              : o.userData.savedMat;
          }
        });
        APP.composer.render();
      },
      pixel(x, y) {
        const gl = APP.renderer.getContext();
        const px = new Uint8Array(4);
        gl.readPixels(Math.round(x * APP.renderer.getPixelRatio()), Math.round((window.innerHeight - y) * APP.renderer.getPixelRatio()), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        return Array.from(px);
      },
      show(name) { APP.scene.traverse((o) => { if (o.name === name) o.visible = true; }); },
      ray(nx, ny) {
        const rc = new THREE.Raycaster();
        rc.setFromCamera(new THREE.Vector2(nx, ny), APP.camera);
        const hits = rc.intersectObjects(APP.scene.children, true);
        return hits.slice(0, 8).map((h) => ({ n: h.object.name || h.object.type, d: +h.distance.toFixed(1) }));
      },
      proj(x, y, z) {
        const v = new THREE.Vector3(x, y, z).project(APP.camera);
        return [Math.round((v.x * 0.5 + 0.5) * window.innerWidth), Math.round((-v.y * 0.5 + 0.5) * window.innerHeight)];
      },
      override(mat) { APP.scene.overrideMaterial = mat; APP.composer.render(); },
    };
    animate();
  } catch (err) {
    showError(err);
  }
}

boot();
