<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nocturne — a procedural city</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05070c; color: #cfd8e3;
    font: 11px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  #hud {
    position: fixed; left: 14px; bottom: 14px; z-index: 10; min-width: 238px;
    background: rgba(9,13,19,.62); border: 1px solid rgba(255,255,255,.10);
    border-radius: 10px; padding: 9px 11px 10px;
    box-shadow: 0 12px 34px rgba(0,0,0,.5); backdrop-filter: blur(10px) saturate(1.25);
    user-select: none;
  }
  #hud .title {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    font-size: 10px; letter-spacing: .17em; text-transform: uppercase; color: #7d8da2;
    padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,.08);
  }
  #hud .title b { color: #dfe8f2; font-weight: 600; letter-spacing: .17em; }
  #hud .grid { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; }
  #hud .k { color: #6d7d92; }
  #hud .v { text-align: right; color: #e7eef6; font-variant-numeric: tabular-nums; }
  #hud .btns { display: flex; gap: 6px; margin-top: 9px; }
  #hud button {
    flex: 1; font: inherit; font-size: 10.5px; letter-spacing: .04em; color: #d9e2ec;
    background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.13);
    border-radius: 6px; padding: 5px 6px; cursor: pointer;
    transition: background .16s, border-color .16s, color .16s;
  }
  #hud button:hover { background: rgba(255,255,255,.13); }
  #hud button.on { background: rgba(94,166,255,.20); border-color: rgba(126,182,255,.55); color: #eaf3ff; }
  #hint {
    position: fixed; right: 14px; bottom: 14px; z-index: 10; color: #5d6b80; text-align: right;
    letter-spacing: .04em; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #hint b { color: #8b9bb0; font-weight: 500; }
  #boot {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: #05070c; color: #6f7f95; letter-spacing: .22em; text-transform: uppercase;
    font-size: 10px; transition: opacity .7s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">
  <div class="title"><b>Nocturne</b><span id="clock">--:--</span></div>
  <div class="grid">
    <span class="k">fps</span><span class="v" id="fps">&ndash;</span>
    <span class="k">buildings</span><span class="v" id="nb">&ndash;</span>
    <span class="k">vehicles</span><span class="v" id="nv">&ndash;</span>
    <span class="k">draw calls</span><span class="v" id="nd">&ndash;</span>
    <span class="k">triangles</span><span class="v" id="nt">&ndash;</span>
  </div>
  <div class="btns">
    <button id="b-time" title="freeze / resume the day-night cycle">pause time</button>
    <button id="b-cam" title="follow a cinematic spline through the city">fly-through</button>
  </div>
</div>
<div id="hint"><b>drag</b> orbit &nbsp;·&nbsp; <b>wheel</b> zoom &nbsp;·&nbsp; <b>right-drag</b> pan &nbsp;·&nbsp; <b>F</b> fly &nbsp;·&nbsp; <b>space</b> time</div>
<div id="boot">generating city</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ==========================================================================
   1 · deterministic randomness — the same city on every load
   ========================================================================== */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(1337);
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const chance = (p) => rnd() < p;

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
// cheap deterministic 2D hash, used for "which window is lit" style decisions on the CPU
function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* ==========================================================================
   2 · the city plan
   ========================================================================== */
const BLOCK = 36;                       // buildable block width
const ROAD = 14;                        // street width
const PITCH = BLOCK + ROAD;             // 50
const NB = 21;                          // blocks per side
const HALF = (NB * PITCH) / 2;          // 525 — outer street line
const DIAG_W = 22;                      // diagonal avenue width
const RIVER = { z0: 545, z1: 665, y: -0.9 };
const BANK_LINES = [685, 735];          // south-bank street lines (reached by bridges)
const BRIDGE_X = [3, 10, 17].map((i) => -HALF + i * PITCH);

const xLines = [], zLines = [];
for (let i = 0; i <= NB; i++) xLines.push(-HALF + i * PITCH);
for (let i = 0; i <= NB; i++) zLines.push(-HALF + i * PITCH);
zLines.push(BANK_LINES[0], BANK_LINES[1]);

/* two diagonal avenues cutting across the grid ---------------------------- */
function avenue(px, pz, dx, dz) {
  const l = Math.hypot(dx, dz);
  dx /= l; dz /= l;
  return { px, pz, dx, dz, nx: -dz, nz: dx, half: DIAG_W / 2 };
}
const avenues = [avenue(0, 0, 1, 1), avenue(0, 150, 1, -0.62)];
for (const av of avenues) {
  // clip the infinite line to the city footprint (the river blocks the south edge)
  let t0 = -1e9, t1 = 1e9;
  const clip = (p, d, lo, hi) => {
    if (Math.abs(d) < 1e-9) { if (p < lo || p > hi) { t0 = 1; t1 = -1; } return; }
    const a = (lo - p) / d, b = (hi - p) / d;
    t0 = Math.max(t0, Math.min(a, b)); t1 = Math.min(t1, Math.max(a, b));
  };
  clip(av.px, av.dx, -HALF, HALF);
  clip(av.pz, av.dz, -HALF, HALF);
  av.t0 = t0; av.t1 = t1;
  av.x0 = av.px + av.dx * t0; av.z0 = av.pz + av.dz * t0;
  av.x1 = av.px + av.dx * t1; av.z1 = av.pz + av.dz * t1;
  av.len = t1 - t0;
}
// signed distance from a point to an avenue's centre line
const avenueDist = (av, x, z) => (x - av.px) * av.nx + (z - av.pz) * av.nz;
// true if the segment of an avenue actually passes alongside (x,z)
function avenueNear(av, x, z, pad) {
  const d = avenueDist(av, x, z);
  if (Math.abs(d) > av.half + pad) return false;
  const t = (x - av.px) * av.dx + (z - av.pz) * av.dz;
  return t > av.t0 - pad && t < av.t1 + pad;
}
function nearAnyAvenue(x, z, pad) { return avenues.some((av) => avenueNear(av, x, z, pad)); }

/* blocks ------------------------------------------------------------------ */
const PARK = { i0: 4, i1: 5, j0: 12, j1: 13 };
const blocks = [];
for (let i = 0; i < NB; i++) {
  const cx = xLines[i] + PITCH / 2;
  for (let j = 0; j < zLines.length - 1; j++) {
    const z0 = zLines[j], z1 = zLines[j + 1];
    if (z1 - z0 !== PITCH) continue;                 // the river gap
    const cz = z0 + PITCH / 2;
    const isPark = i >= PARK.i0 && i <= PARK.i1 && j >= PARK.j0 && j <= PARK.j1;
    const d = Math.hypot(cx, cz) + rr(-26, 26);
    let zone = d < 175 ? 'core' : d < 375 ? 'mid' : 'low';
    if (cz > 600) zone = 'mid';                      // the south-bank warehouse row
    blocks.push({
      i, j, cx, cz, x0: cx - BLOCK / 2, x1: cx + BLOCK / 2, z0: cz - BLOCK / 2, z1: cz + BLOCK / 2,
      zone, park: isPark,
    });
  }
}
const parkBlocks = blocks.filter((b) => b.park);
const parkRect = {
  x0: Math.min(...parkBlocks.map((b) => b.x0)), x1: Math.max(...parkBlocks.map((b) => b.x1)),
  z0: Math.min(...parkBlocks.map((b) => b.z0)), z1: Math.max(...parkBlocks.map((b) => b.z1)),
};
const inPark = (x, z) => x > parkRect.x0 && x < parkRect.x1 && z > parkRect.z0 && z < parkRect.z1;
const inRiver = (z) => z > RIVER.z0 - 12 && z < RIVER.z1 + 12;

/* ==========================================================================
   3 · street graph — nodes at junctions, directed lane edges between them
   ========================================================================== */
const nodes = [];
const nodeMap = new Map();
function getNode(x, z) {
  const k = Math.round(x) + ':' + Math.round(z);
  let n = nodeMap.get(k);
  if (!n) { n = { id: nodes.length, x, z, edges: [], signal: null }; nodes.push(n); nodeMap.set(k, n); }
  return n;
}
const edges = [];
function addEdge(a, b) {
  if (a === b) return;
  const dx = b.x - a.x, dz = b.z - a.z;
  const len = Math.hypot(dx, dz);
  if (len < 1e-6) return;
  const e = {
    id: edges.length, a, b, len, dx: dx / len, dz: dz / len,
    axis: Math.abs(dx) > Math.abs(dz) ? 'x' : 'z',
    diag: Math.abs(dx) > 1e-6 && Math.abs(dz) > 1e-6,
  };
  edges.push(e); a.edges.push(e);
}
// stop points along each street line = grid junctions + avenue crossings + bridge ends
function stopsAlong(line, fixed, axis, isZ) {
  const base = isZ ? xLines : zLines;
  let pts = base.slice();
  if (isZ) {                                        // a street running along x at z = fixed
    if (fixed > HALF) pts = pts.filter((v) => true); // south bank keeps every x line
    for (const av of avenues) {
      const t = (fixed - av.pz) / av.dz;
      const x = av.px + av.dx * t;
      if (x > -HALF - 1 && x < HALF + 1 && t > av.t0 - 1 && t < av.t1 + 1) pts.push(x);
    }
  } else {                                          // a street running along z at x = fixed
    for (const av of avenues) {
      const t = (fixed - av.px) / av.dx;
      const z = av.pz + av.dz * t;
      if (z > -HALF - 1 && z < HALF + 1 && t > av.t0 - 1 && t < av.t1 + 1) pts.push(z);
    }
    if (BRIDGE_X.indexOf(fixed) >= 0) pts = pts.concat(BANK_LINES);
    else pts = pts.filter((v) => v <= HALF + 1);
  }
  pts.sort((p, q) => p - q);
  const out = [];
  for (const p of pts) if (!out.length || p - out[out.length - 1] > 6) out.push(p);
  return out;
}
for (const z of zLines) {                           // streets running along x
  const pts = stopsAlong(z, z, 'x', true);
  for (let k = 0; k + 1 < pts.length; k++) addEdge(getNode(pts[k], z), getNode(pts[k + 1], z));
}
for (const x of xLines) {                           // streets running along z
  const pts = stopsAlong(x, x, 'z', false);
  for (let k = 0; k + 1 < pts.length; k++) addEdge(getNode(x, pts[k]), getNode(x, pts[k + 1]));
}
for (const av of avenues) {                         // the diagonal avenues themselves
  const ts = [av.t0, av.t1];
  for (const x of xLines) { const t = (x - av.px) / av.dx; if (t > av.t0 + 1 && t < av.t1 - 1) ts.push(t); }
  for (const z of zLines) { const t = (z - av.pz) / av.dz; if (t > av.t0 + 1 && t < av.t1 - 1) ts.push(t); }
  ts.sort((a, b) => a - b);
  const uniq = [];
  for (const t of ts) if (!uniq.length || t - uniq[uniq.length - 1] > 6) uniq.push(t);
  for (let k = 0; k + 1 < uniq.length; k++) {
    const t0 = uniq[k], t1 = uniq[k + 1];
    addEdge(getNode(av.px + av.dx * t0, av.pz + av.dz * t0), getNode(av.px + av.dx * t1, av.pz + av.dz * t1));
  }
}

/* traffic signals ---------------------------------------------------------- */
for (const n of nodes) {
  const axes = new Set(n.edges.map((e) => e.axis));
  if (axes.size < 2) continue;
  const d = Math.hypot(n.x, n.z);
  const isDiag = n.edges.some((e) => e.diag);
  const major = d < 300 || isDiag || (Math.abs(n.x) % 150 < 1 && Math.abs(n.z) % 150 < 1);
  if (!major) continue;
  n.signal = {
    startAxis: chance(0.5) ? 'x' : 'z', axis: 'x', state: 'g',
    t: rr(0, 26), greenDur: rr(11, 17), yellow: 2.6, allRed: 1.3,
  };
}
const signalNodes = nodes.filter((n) => n.signal);

/* ==========================================================================
   4 · renderer, scene, camera
   ========================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a1018, 120, 760);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.6, 4200);
camera.position.set(330, 250, 430);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 46, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.85;
controls.panSpeed = 0.7;
controls.minDistance = 24;
controls.maxDistance = 1150;
controls.maxPolarAngle = Math.PI * 0.497;
controls.update();

const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 900;
sun.shadow.camera.left = -260; sun.shadow.camera.right = 260;
sun.shadow.camera.top = 260; sun.shadow.camera.bottom = -260;
sun.shadow.bias = -0.0009;
sun.shadow.normalBias = 0.7;
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight(0x9fc4ff, 0x2b2a26, 0.7);
scene.add(hemi);
const cityGlow = new THREE.HemisphereLight(0xffb066, 0x000000, 0.0);
scene.add(cityGlow);

/* ==========================================================================
   5 · shared sky model — one tiny analytic sky used by the dome, the window
       reflections and the water, so everything agrees about the light
   ========================================================================== */
const skyU = {
  uSunDir: { value: new THREE.Vector3(0, 1, 0) },
  uMoonDir: { value: new THREE.Vector3(0, -1, 0) },
  uZenith: { value: new THREE.Color(0x2f6fc4) },
  uHorizon: { value: new THREE.Color(0xa9c4dd) },
  uSunTint: { value: new THREE.Color(0xffb066) },
  uDay: { value: 1 }, uDusk: { value: 0 }, uNight: { value: 0 },
  uStars: { value: 0 }, uTime: { value: 0 }, uCloud: { value: 0.34 },
};

const SKY_GLSL = /* glsl */`
uniform vec3 uSunDir, uMoonDir, uZenith, uHorizon, uSunTint;
uniform float uDay, uDusk, uNight, uStars, uTime, uCloud;
float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(h21(i), h21(i+vec2(1.0,0.0)), f.x), mix(h21(i+vec2(0.0,1.0)), h21(i+vec2(1.0,1.0)), f.x), f.y); }
float fbm4(vec2 p){ float s=0.0, a=0.5; for(int k=0;k<4;k++){ s+=a*n2(p); p=p*2.07+vec2(1.7,-2.3); a*=0.5; } return s; }
vec3 skyApprox(vec3 d){
  float y = clamp(d.y, -0.4, 1.0);
  vec3 c = mix(uHorizon, uZenith, pow(max(y, 0.0), 0.38));
  float sd = max(dot(d, uSunDir), 0.0);
  c += uSunTint * (pow(sd, 5.0)*0.30 + pow(sd, 60.0)*0.55) * (0.30*uDay + 0.95*uDusk);
  float md = max(dot(d, uMoonDir), 0.0);
  c += vec3(0.42, 0.52, 0.78) * pow(md, 120.0) * 0.55 * uNight;
  return c;
}`;

function useSky(shader) {
  for (const k in skyU) shader.uniforms[k] = skyU[k];
}

/* the dome --------------------------------------------------------------- */
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(3000, 40, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      varying vec3 vDir;
      ${SKY_GLSL}
      float h31(vec3 p){ p = fract(p*0.3183099 + vec3(0.71,0.113,0.419)); p *= 17.0;
        return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      void main(){
        vec3 d = normalize(vDir);
        vec3 col = skyApprox(d);
        /* sun disc */
        float r1 = length(d - uSunDir);
        col += mix(vec3(1.0,0.96,0.88), vec3(1.0,0.52,0.22), uDusk) * smoothstep(0.0125, 0.0092, r1) * (1.6 + 3.2*uDay);
        /* moon disc, bitten by a second disc to make a crescent */
        vec3 tang = normalize(cross(uMoonDir, vec3(0.0,1.0,0.0)) + vec3(0.0001,0.0,0.0));
        float r2 = length(d - uMoonDir);
        float r3 = length(d - uMoonDir - tang*0.0075);
        float moon = smoothstep(0.0085, 0.0062, r2) - smoothstep(0.0085, 0.0062, r3);
        col += vec3(0.92,0.95,1.0) * max(moon, 0.0) * uNight * 3.0;
        col += vec3(0.30,0.36,0.5) * smoothstep(0.09, 0.0, r2) * uNight * 0.35;
        /* stars */
        if (uStars > 0.01 && d.y > -0.05) {
          vec3 sp = d * 260.0; vec3 cell = floor(sp); float h = h31(cell);
          if (h > 0.9815) {
            float dd = length(sp - (cell + 0.5 + (vec3(h31(cell+1.0), h31(cell+2.0), h31(cell+3.0)) - 0.5)*0.7));
            float tw = 0.55 + 0.45*sin(uTime*2.4 + h*260.0);
            col += vec3(0.85,0.9,1.0) * smoothstep(1.05, 0.0, dd) * tw * uStars * (0.35 + 1.5*h31(cell+7.0));
          }
        }
        /* clouds */
        if (d.y > 0.004) {
          vec2 cp = d.xz / max(d.y, 0.06) * 0.30 + vec2(uTime*0.0035, uTime*0.0012);
          float f = fbm4(cp*0.85);
          float cov = smoothstep(0.60 - uCloud*0.26, 0.80 - uCloud*0.14, f) * smoothstep(0.02, 0.30, d.y);
          vec3 cc = mix(vec3(0.13,0.15,0.20), vec3(0.90,0.94,1.0), clamp(uDay*0.9+0.12, 0.0, 1.0));
          cc = mix(cc, uSunTint*1.15, uDusk*0.75);
          col = mix(col, cc, clamp(cov, 0.0, 1.0)*0.72);
        }
        gl_FragColor = vec4(max(col, 0.0), 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  }),
);
skyDome.renderOrder = -10;
skyDome.frustumCulled = false;
scene.add(skyDome);

/* ==========================================================================
   6 · canvas-generated textures (no external assets anywhere)
   ========================================================================== */
function noiseCanvas(size, seed, blobs, grain) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const r = mulberry32(seed);
  g.fillStyle = '#808080'; g.fillRect(0, 0, size, size);
  for (let i = 0; i < blobs; i++) {
    g.globalAlpha = 0.03 + r() * 0.09;
    g.fillStyle = r() < 0.5 ? '#ffffff' : '#000000';
    g.beginPath(); g.arc(r() * size, r() * size, 5 + r() * 26, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  const img = g.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (r() - 0.5) * grain;
    img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  return c;
}
function tex(canvas, repeat) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  if (repeat) t.repeat.set(repeat, repeat);
  return t;
}
const asphaltTex = tex(noiseCanvas(256, 7711, 700, 30));
const concreteTex = tex(noiseCanvas(256, 3312, 520, 22));
const groundTex = tex(noiseCanvas(256, 909, 900, 40), 90);
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,238,200,0.95)');

  low: [[0x8a5747, 0.90, 0.02], [0x6f4a3d, 0.92, 0.02], [0x9c6b52, 0.88, 0.02],

const buildings = [];

  const pal = pick(PALETTES[zone]);

    x, z, w, d, h, base, shape: shape || 'box', zone,
    spX: zone === 'core' ? rr(2.1, 3.1) : zone === 'mid' ? rr(2.0, 2.7) : rr(1.9, 2.4),
    flH: zone === 'core' ? rr(3.1, 3.9) : rr(3.0, 3.6),

  let dmin = 1e9, dmax = -1e9, tmin = 1e9, tmax = -1e9;
  for (const [px, pz] of cs) {
    const d = avenueDist(av, px, pz); dmin = Math.min(dmin, d); dmax = Math.max(dmax, d);
    const t = (px - av.px) * av.dx + (pz - av.pz) * av.dz;

  if (depth >= maxDepth || (w < minW * 2 && d < minW * 2) || chance(zone === 'core' ? 0.5 : 0.28)) { out.push(r); return; }

    subdivide({ x0: r.x0, x1: m, z0: r.z0, z1: r.z1 }, zone, out, depth + 1);
    subdivide({ x0: m, x1: r.x1, z0: r.z0, z1: r.z1 }, zone, out, depth + 1);

  for (const lot of lots) {
    if (avenues.some((av) => rectHitsAvenue(av, lot, 1.6))) continue;
    if (inRiver(lot.z0) || inRiver(lot.z1)) continue;
    if (chance(b.zone === 'low' ? 0.10 : 0.05)) continue;         // vacant lot
    const ins = rr(1.1, 3.0);

        varying vec3 vNrmL; varying vec3 vWP; varying vec3 vNW;`)

  }
}
const _fp = new THREE.Vector3(), _fl = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
const _t0 = new THREE.Vector3(), _t1 = new THREE.Vector3();
function updateFly(dt) {
  flyU = (flyU + (26 * dt) / flyLen) % 1;
  flyCurve.getPointAt(flyU, _fp);
  flyCurve.getPointAt((flyU + 0.014) % 1, _fl);
  let need = -1;
  for (let k = 0; k <= 4; k++) {
    flyCurve.getPointAt((flyU + 0.0035 * k) % 1, _t1);
    const top = roofAt(_t1.x, _t1.z, 3.5);
    if (top > 0) need = Math.max(need, top + 6);
  }
  const targetY = Math.max(_fp.y, need);
  flyY += (targetY - flyY) * (1 - Math.exp(-dt * 2.6));
  camera.position.set(_fp.x, flyY, _fp.z);
  flyCurve.getTangentAt(flyU, _t0);
  flyCurve.getTangentAt((flyU + 0.02) % 1, _t1);
  const cross = _t0.x * _t1.z - _t0.z * _t1.x;
  const want = clamp(cross * 26, -0.32, 0.32);
  bank += (want - bank) * (1 - Math.exp(-dt * 2.2));
  const fwd = _fl.clone().sub(_fp).normalize();
  if (need > 0) fwd.y -= (flyY - _fp.y) * 0.02;
  if (Math.abs(fwd.y) > 0.985) fwd.y *= 0.985;
  fwd.normalize();
  camera.up.set(0, 1, 0).applyAxisAngle(fwd, bank);
  camera.lookAt(_fl.x, Math.max(_fl.y, need > 0 ? need - 4 : _fl.y), _fl.z);
}

/* ==========================================================================
   13 · HUD, loop, resize
   ========================================================================== */
const el = (id) => document.getElementById(id);
const hud = { fps: el('fps'), nb: el('nb'), nv: el('nv'), nd: el('nd'), nt: el('nt'), clock: el('clock') };
hud.nb.textContent = String(buildings.length);
hud.nv.textContent = String(cars.length + 1);
el('b-time').addEventListener('click', (ev) => {
  timePaused = !timePaused;
  ev.currentTarget.classList.toggle('on', timePaused);
  ev.currentTarget.textContent = timePaused ? 'resume time' : 'pause time';
});
el('b-cam').addEventListener('click', () => setFly(!flyOn));
window.addEventListener('keydown', (ev) => {
  if (ev.key === 'f' || ev.key === 'F') setFly(!flyOn);
  if (ev.key === ' ') { ev.preventDefault(); el('b-time').click(); }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.__CITY = {
  ready: false, get frames() { return frames; },
  pos: camera.position, tgt: controls.target,
  cam: { far: camera.far, near: camera.near, fov: camera.fov },
  lookAt: (x, y, z) => { controls.target.set(x, y, z); camera.lookAt(x, y, z); },
  pause: (v) => { timePaused = !!v; },
  setDayTime: (v) => { dayTime = ((v % 1) + 1) % 1; updateWorld(); },
  fly: (v) => setFly(!!v),
  info: () => ({
    buildings: buildings.length, vehicles: cars.length, edges: edges.length,
    signals: signalNodes.length, lamps: lamps.length, billboards: billboards.length,
    trees: trees.length, dayTime, green: signalNodes.filter((n) => n.signal.state === 'g').length,
    stopped: cars.reduce((a, c) => a + (c.v < 0.4 ? 1 : 0), 0),
    calls: renderer.info.render.calls,
    tris: renderer.info.render.triangles, fps: fpsShown, simMs: simAvg, gpuMs: drawAvg,
  }),
};

let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsShown = 0, bbNext = 0;
let frames = 0, simMs = 0, drawMs = 0, simAvg = 0, drawAvg = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  let tA = performance.now();
  if (!timePaused) dayTime = (dayTime + dt / DAY_LEN) % 1;
  skyU.uTime.value = now * 0.001;
  updateSignals(dt);
  updateWorld();
  stepTraffic(dt);
  drawTraffic();
  stepHeli(now * 0.001);
  for (const cr of cranes) cr.g.rotation.y = cr.phase + now * 0.0001 * cr.speed * 60;
  if (now > bbNext) { bbNext = now + 90; drawBillboards(now); }
  if (flyOn) updateFly(dt); else controls.update();
  updateShadowFocus();
  let tB = performance.now(); simMs += tB - tA;
  renderer.render(scene, camera);
  drawMs += performance.now() - tB;

  frames++;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) {
    fpsShown = Math.round(fpsN / fpsAcc);
    simAvg = +(simMs / fpsN).toFixed(2); drawAvg = +(drawMs / fpsN).toFixed(2);
    simMs = 0; drawMs = 0;
    hud.fps.textContent = String(fpsShown);
    hud.nd.textContent = String(renderer.info.render.calls);
    hud.nt.textContent = renderer.info.render.triangles.toLocaleString();
    fpsAcc = 0; fpsN = 0;
  }
  const mins = Math.floor(dayTime * 1440);
  hud.clock.textContent = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
  if (frames === 2) {
    const boot = document.getElementById('boot');
    boot.classList.add('gone');
    setTimeout(() => boot.remove(), 900);
    window.__CITY.ready = true;
  }
}
requestAnimationFrame(tick);
</script>
