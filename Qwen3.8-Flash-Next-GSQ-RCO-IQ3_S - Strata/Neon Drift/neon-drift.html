<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON DRIFT</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0414;
    font-family:"Segoe UI",Arial,sans-serif;user-select:none}
  #c{display:block;width:100%;height:100%}
  .hud{position:fixed;color:#e8f6ff;text-shadow:0 0 8px #35d7ff,0 0 2px #fff;pointer-events:none;z-index:5}
  #speed{left:24px;bottom:22px;font-size:44px;font-weight:700;letter-spacing:2px}
  #speed small{font-size:16px;opacity:.7}
  #score{left:24px;top:18px;font-size:26px;font-weight:600;letter-spacing:1px}
  #best{right:24px;top:18px;font-size:18px;text-align:right;color:#ffd2f2;
    text-shadow:0 0 8px #ff3ec8}
  #boostwrap{left:50%;bottom:22px;transform:translateX(-50%);width:260px}
  #boostlbl{font-size:11px;letter-spacing:4px;opacity:.8;margin-bottom:4px;text-align:center}
  #boostbar{height:10px;border:1px solid #35d7ff;border-radius:6px;overflow:hidden;
    box-shadow:0 0 10px #35d7ff55;background:#101028}
  #boostfill{height:100%;width:0%;background:linear-gradient(90deg,#20e6ff,#ff3ec8);
    transition:background .2s}
  #boostfill.hot{background:linear-gradient(90deg,#ffb02e,#ff2e4e)}
  #popups{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:6}
  .pop{position:absolute;top:42%;font-size:26px;font-weight:800;letter-spacing:2px;
    color:#7dffd0;text-shadow:0 0 12px #21ffb0,0 0 3px #fff;animation:rise 1.1s ease-out forwards}
  @keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
  .card{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:10;pointer-events:none;text-align:center}
  #title h1{margin:0;font-size:96px;font-weight:900;letter-spacing:10px;color:#fff;
    text-shadow:0 0 18px #ff3ec8,0 0 40px #ff3ec8,0 0 8px #35d7ff,4px 4px 0 #35d7ff}
  #title h2{margin:14px 0 0;font-size:20px;font-weight:400;letter-spacing:6px;color:#9ff2ff;
    text-shadow:0 0 10px #35d7ff;animation:blink 1.4s ease-in-out infinite}
  #title p{margin:34px 0 0;font-size:14px;letter-spacing:2px;color:#cbb8e6;opacity:.85;line-height:1.9}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  #crash{display:none;color:#fff}
  #crash h1{margin:0;font-size:64px;font-weight:900;letter-spacing:8px;
    text-shadow:0 0 20px #ff2e4e,0 0 60px #ff2e4e}
  #crash h2{margin:18px 0 0;font-size:22px;font-weight:400;letter-spacing:5px;color:#ffd2f2;
    text-shadow:0 0 10px #ff3ec8;animation:blink 1.4s ease-in-out infinite}
  #flash{position:fixed;left:0;top:0;width:100%;height:100%;background:#bdf6ff;opacity:0;
    pointer-events:none;z-index:4;mix-blend-mode:screen}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="score">0</div>
<div class="hud" id="best">BEST 0</div>
<div class="hud" id="speed">0<small> KM/H</small></div>
<div class="hud" id="boostwrap"><div id="boostlbl">BOOST</div><div id="boostbar"><div id="boostfill"></div></div></div>
<div id="popups"></div>
<div id="flash"></div>
<div class="card" id="title">
  <h1>NEON DRIFT</h1>
  <h2>PRESS ANY KEY TO DRIVE</h2>
  <p>&larr; / &rarr; or A / D &mdash; STEER &nbsp;&middot;&nbsp; SPACE / SHIFT &mdash; BOOST<br>
     DODGE RIVAL CRAFTS &middot; SKIM THEM FOR BONUS POINTS &middot; M &mdash; MUTE</p>
</div>
<div class="card" id="crash">
  <h1>WRECKED</h1>
  <h2>PRESS R TO RESTART</h2>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- constants ---------- */
const SEG=8, VIEW_SEGS=90, ROAD_HALF=6.0;
const ARCH_EVERY=10, PALM_EVERY=19, PALM_COUNT=Math.ceil(VIEW_SEGS/PALM_EVERY)+2;

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
const scene=new THREE.Scene();
const FOG_A=new THREE.Color(0x2b0a3d), FOG_B=new THREE.Color(0x0e2c4e);
scene.fog=new THREE.FogExp2(FOG_A.getHex(),0.0026);
const camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.5,7000);

/* ---------- canvas textures ---------- */
function makeRoadTexture(){
  const cv=document.createElement('canvas');cv.width=256;cv.height=256;
  const g=cv.getContext('2d');
  g.fillStyle='#161020';g.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){const v=20+Math.random()*22;g.fillStyle='rgba('+v+','+v+','+(v+14)+',0.5)';g.fillRect(Math.random()*256,Math.random()*256,2,2);}
  const eg=g.createLinearGradient(0,0,16,0);
  eg.addColorStop(0,'#ff3ec8');eg.addColorStop(.45,'#ff3ec8');eg.addColorStop(1,'rgba(255,62,200,0)');
  g.fillStyle=eg;g.fillRect(0,0,16,256);
  const eg2=g.createLinearGradient(256,0,240,0);
  eg2.addColorStop(0,'#35d7ff');eg2.addColorStop(.45,'#35d7ff');eg2.addColorStop(1,'rgba(53,215,255,0)');
  g.fillStyle=eg2;g.fillRect(240,0,16,256);
  g.fillStyle='rgba(240,250,255,0.9)';g.fillRect(124,0,8,140);
  g.fillStyle='rgba(120,240,255,0.25)';g.fillRect(120,0,16,140);
  const t=new THREE.CanvasTexture(cv);t.wrapS=THREE.ClampToEdgeWrapping;t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeWallTexture(){
  const cv=document.createElement('canvas');cv.width=64;cv.height=64;
  const g=cv.getContext('2d');
  g.fillStyle='#120a1e';g.fillRect(0,0,64,64);
  const gr=g.createLinearGradient(0,0,0,14);gr.addColorStop(0,'#ff3ec8');gr.addColorStop(1,'rgba(255,62,200,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,14);
  g.fillStyle='#35d7ff';g.fillRect(0,0,64,3);
  const t=new THREE.CanvasTexture(cv);t.wrapS=THREE.ClampToEdgeWrapping;t.wrapT=THREE.ClampToEdgeWrapping;
  t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeSunTexture(){
  const cv=document.createElement('canvas');cv.width=512;cv.height=512;
  const g=cv.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#ffe66d');gr.addColorStop(.45,'#ff9e3d');gr.addColorStop(.75,'#ff3ec8');gr.addColorStop(1,'#c22eff');
  g.fillStyle=gr;g.beginPath();g.arc(256,256,240,0,Math.PI*2);g.fill();
  g.globalCompositeOperation='destination-out';
  let y=240,h=7;
  while(y<512){g.fillRect(0,y,512,h);y+=h+13;h+=2.6;}
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeSkyTexture(){
  const cv=document.createElement('canvas');cv.width=4;cv.height=256;
  const g=cv.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#05010f');gr.addColorStop(.55,'#170733');gr.addColorStop(.85,'#3a0f4a');gr.addColorStop(1,'#57154f');
  g.fillStyle=gr;g.fillRect(0,0,4,256);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeMountainTexture(seed){
  const cv=document.createElement('canvas');cv.width=1024;cv.height=256;
  const g=cv.getContext('2d');const r=mulberry32(seed);
  g.clearRect(0,0,1024,256);
  g.fillStyle='#1d0b30';g.beginPath();g.moveTo(0,256);
  let x=0;while(x<1024){const w=60+r()*140;const h=60+r()*150;g.lineTo(x+w*.5,256-h);g.lineTo(x+w,256-r()*40);x+=w;}
  g.lineTo(1024,256);g.closePath();g.fill();
  g.fillStyle='#120621';g.beginPath();g.moveTo(0,256);
  x=0;while(x<1024){const w=80+r()*160;const h=30+r()*90;g.lineTo(x+w*.5,256-h);g.lineTo(x+w,256-r()*20);x+=w;}
  g.lineTo(1024,256);g.closePath();g.fill();
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeGridTexture(){
  const cv=document.createElement('canvas');cv.width=128;cv.height=128;
  const g=cv.getContext('2d');
  g.fillStyle='#0a0616';g.fillRect(0,0,128,128);
  g.strokeStyle='#3a1a5e';g.lineWidth=2;g.strokeRect(0,0,128,128);
  g.strokeStyle='rgba(120,60,190,0.35)';g.lineWidth=1;
  g.beginPath();for(let i=32;i<128;i+=32){g.moveTo(i,0);g.lineTo(i,128);g.moveTo(0,i);g.lineTo(128,i);}g.stroke();
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(160,160);t.colorSpace=THREE.SRGBColorSpace;return t;
}

/* ---------- environment ---------- */
const skyMat=new THREE.MeshBasicMaterial({map:makeSkyTexture(),side:THREE.BackSide,fog:false,depthWrite:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(4600,24,12),skyMat);
sky.renderOrder=-4;scene.add(sky);

const starGeo=new THREE.BufferGeometry();
{
  const n=900,pos=new Float32Array(n*3),col=new Float32Array(n*3);
  const r=mulberry32(24);
  for(let i=0;i<n;i++){
    const a=r()*Math.PI*2,e=Math.acos(r()*0.92),d=3400;
    pos[i*3]=Math.sin(e)*Math.cos(a)*d;pos[i*3+1]=Math.abs(Math.cos(e))*d*0.9+120;pos[i*3+2]=Math.sin(e)*Math.sin(a)*d;
    const b=0.4+r()*0.6;col[i*3]=b;col[i*3+1]=b;col[i*3+2]=b*(0.9+r()*0.3);
  }
  starGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  starGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
}
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({size:2.4,vertexColors:true,sizeAttenuation:false,fog:false,transparent:true,depthWrite:false}));
stars.renderOrder=-3;scene.add(stars);

const horizon=new THREE.Group();horizon.renderOrder=-2;scene.add(horizon);
const sun=new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),
  new THREE.MeshBasicMaterial({map:makeSunTexture(),transparent:true,fog:false,depthWrite:false,side:THREE.DoubleSide}));
sun.position.set(0,180,2900);horizon.add(sun);
const mtTexA=makeMountainTexture(7),mtTexB=makeMountainTexture(31);
for(let i=0;i<4;i++){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(5200,650),
    new THREE.MeshBasicMaterial({map:i%2?mtTexA:mtTexB,transparent:true,fog:false,depthWrite:false}));
  m.position.setFromSphericalCoords(2500,Math.PI/2,i*Math.PI/2);
  m.position.y=140;m.rotation.y=i*Math.PI/2+Math.PI;horizon.add(m);
}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(8000,8000),
  new THREE.MeshBasicMaterial({map:makeGridTexture()}));
ground.rotation.x=-Math.PI/2;ground.position.y=-18;scene.add(ground);

/* ---------- track (seeded, endless, recycled) ---------- */
let trackRng,pts,curv,slope,base,curvBase,genYaw,genX,genY,genZ;
function resetTrack(){
  trackRng=mulberry32(1337);
  pts=[{x:0,y:0,z:0,yaw:0}];curv=[];slope=[];base=0;curvBase=0;
  genYaw=0;genX=0;genY=0;genZ=0;
}
function genBlock(){
  const len=14+Math.floor(trackRng()*26);
  const straight=trackRng()<0.28;
  const c=straight?0:(trackRng()*2-1)*0.0062;
  const sl=straight?(trackRng()*2-1)*0.012:(trackRng()*2-1)*0.055;
  for(let i=0;i<len;i++){curv.push(c);slope.push(sl);}
}
function ensureTrack(idx){
  while(base+pts.length<=idx){
    const i=base+pts.length;
    while(curvBase+curv.length<=i)genBlock();
    const k=i-curvBase;
    genYaw+=curv[k]*SEG;
    genX+=Math.sin(genYaw)*SEG;
    genZ+=Math.cos(genYaw)*SEG;
    genY=clamp(genY+slope[k]*SEG,-14,14);
    pts.push({x:genX,y:genY,z:genZ,yaw:genYaw});
  }
}
function getPt(i){
  if(i<base)return pts[0];
  ensureTrack(i);
  return pts[i-base];
}
function trackAt(dist){
  const f=dist/SEG;let i=Math.floor(f);if(i<0){i=0;}
  const t=clamp(f-i,0,1);
  const a=getPt(i),b=getPt(i+1);
  return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),z:lerp(a.z,b.z,t),yaw:lerp(a.yaw,b.yaw,t)};
}
function trimTrack(playerSeg){
  const drop=playerSeg-base-50;
  if(drop>0){pts.splice(0,drop);base+=drop;const d2=Math.min(drop,curv.length);curv.splice(0,d2);curvBase+=d2;}
}
resetTrack();

/* ---------- road ribbon ---------- */
function makeRibbon(w){
  const n=(VIEW_SEGS+1)*2;
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  geo.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(n*2),2));
  const idx=[];
  for(let j=0;j<VIEW_SEGS;j++){const a=j*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  geo.setIndex(idx);
  return geo;
}
const roadGeo=makeRibbon();
const road=new THREE.Mesh(roadGeo,new THREE.MeshBasicMaterial({map:makeRoadTexture(),side:THREE.DoubleSide}));
scene.add(road);
const wallGeoL=makeRibbon(),wallGeoR=makeRibbon();
const wallMat=new THREE.MeshBasicMaterial({map:makeWallTexture(),side:THREE.DoubleSide});
const wallL=new THREE.Mesh(wallGeoL,wallMat),wallR=new THREE.Mesh(wallGeoR,wallMat);
scene.add(wallL,wallR);

function updateRoad(startSeg){
  const rp=roadGeo.attributes.position.array,ru=roadGeo.attributes.uv.array;
  const lp=wallGeoL.attributes.position.array,lu=wallGeoL.attributes.uv.array;
  const rr=wallGeoR.attributes.position.array,ru2=wallGeoR.attributes.uv.array;
  for(let j=0;j<=VIEW_SEGS;j++){
    const p=getPt(startSeg+j);
    const rx=Math.cos(p.yaw),rz=-Math.sin(p.yaw);
    const o=j*6;
    rp[o]=p.x-rx*ROAD_HALF;rp[o+1]=p.y;rp[o+2]=p.z-rz*ROAD_HALF;
    rp[o+3]=p.x+rx*ROAD_HALF;rp[o+4]=p.y;rp[o+5]=p.z+rz*ROAD_HALF;
    const v=(startSeg+j);
    ru[j*4]=0;ru[j*4+1]=v;ru[j*4+2]=1;ru[j*4+3]=v;
    const wl=ROAD_HALF+0.25,wh=1.3;
    lp[o]=p.x-rx*wl;lp[o+1]=p.y;lp[o+2]=p.z-rz*wl;
    lp[o+3]=p.x-rx*wl;lp[o+4]=p.y+wh;lp[o+5]=p.z-rz*wl;
    lu[j*4]=0;lu[j*4+1]=0;lu[j*4+2]=0;lu[j*4+3]=1;
    rr[o]=p.x+rx*wl;rr[o+1]=p.y;rr[o+2]=p.z+rz*wl;
    rr[o+3]=p.x+rx*wl;rr[o+4]=p.y+wh;rr[o+5]=p.z+rz*wl;
    ru2[j*4]=0;ru2[j*4+1]=0;ru2[j*4+2]=0;ru2[j*4+3]=1;
  }
  roadGeo.attributes.position.needsUpdate=true;roadGeo.attributes.uv.needsUpdate=true;
  wallGeoL.attributes.position.needsUpdate=true;wallGeoL.attributes.uv.needsUpdate=true;
  wallGeoR.attributes.position.needsUpdate=true;wallGeoR.attributes.uv.needsUpdate=true;
}

/* ---------- arches (instanced) ---------- */
const ARCH_COUNT=Math.ceil(VIEW_SEGS/ARCH_EVERY)+1;
const arches=new THREE.InstancedMesh(
  new THREE.TorusGeometry(ROAD_HALF+2.4,0.28,6,26,Math.PI),
  new THREE.MeshBasicMaterial({color:0xff3ec8}),ARCH_COUNT);
arches.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(arches);
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_s=new THREE.Vector3(1,1,1),_p=new THREE.Vector3();
function updateArches(startSeg){
  for(let k=0;k<ARCH_COUNT;k++){
    const a=startSeg+k*ARCH_EVERY;
    const p=getPt(a);
    _q.setFromAxisAngle(new THREE.Vector3(0,1,0),p.yaw);
    _p.set(p.x,p.y,p.z);
    _m.compose(_p,_q,_s);
    arches.setMatrixAt(k,_m);
  }
  arches.instanceMatrix.needsUpdate=true;
}

/* ---------- palms (instanced, merged geometry) ---------- */
function mergeGeoms(list){
  const pos=[],nor=[],uv=[];
  for(const g of list){
    const ng=g.toNonIndexed();
    const pa=ng.attributes.position.array,na=ng.attributes.normal.array,ua=ng.attributes.uv.array;
    for(let i=0;i<pa.length;i++){pos.push(pa[i]);nor.push(na[i]);}
    for(let i=0;i<ua.length;i++)uv.push(ua[i]);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  return geo;
}
function palmGeom(){
  const parts=[];
  const trunk=new THREE.CylinderGeometry(0.16,0.3,6,6);trunk.translate(0,3,0);parts.push(trunk);
  for(let i=0;i<6;i++){
    const f=new THREE.PlaneGeometry(3.4,0.7,1,1);
    f.rotateZ(-0.55);f.rotateY(i*Math.PI/3);f.translate(0,6.1,0);
    parts.push(f);
  }
  return mergeGeoms(parts);
}
const palms=new THREE.InstancedMesh(palmGeom(),
  new THREE.MeshBasicMaterial({color:0x18c8a0,side:THREE.DoubleSide}),PALM_COUNT);
palms.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(palms);
const palmRng=mulberry32(99);
const palmSeed=[];
for(let i=0;i<400;i++)palmSeed.push({side:palmRng()<0.5?-1:1,off:9+palmRng()*6,rot:palmRng()*6.28,sc:0.8+palmRng()*0.6});
function updatePalms(startSeg){
  for(let k=0;k<PALM_COUNT;k++){
    const a=startSeg+k*PALM_EVERY;
    const p=getPt(a),sd=palmSeed[a%palmSeed.length];
    const rx=Math.cos(p.yaw),rz=-Math.sin(p.yaw);
    _p.set(p.x+rx*sd.side*sd.off,p.y,p.z+rz*sd.side*sd.off);
    _q.setFromAxisAngle(new THREE.Vector3(0,1,0),p.yaw+sd.rot);
    _s.set(sd.sc,sd.sc,sd.sc);
    _m.compose(_p,_q,_s);
    palms.setMatrixAt(k,_m);
  }
  palms.instanceMatrix.needsUpdate=true;
  _s.set(1,1,1);
}

/* ---------- player craft ---------- */
const craft=new THREE.Group();
{
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.7,4.4),new THREE.MeshBasicMaterial({color:0x1b2a4a}));
  const nose=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.45,1.6),new THREE.MeshBasicMaterial({color:0x27406e}));
  nose.position.set(0,0.15,2.6);
  const canopy=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.5,1.4),new THREE.MeshBasicMaterial({color:0x9ff2ff}));
  canopy.position.set(0,0.6,-0.2);
  const finL=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.8,1.8),new THREE.MeshBasicMaterial({color:0xff3ec8}));
  finL.position.set(-1.25,0.2,-1.6);
  const finR=finL.clone();finR.position.x=1.25;
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(2.6,4.8),
    new THREE.MeshBasicMaterial({color:0xff3ec8,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.rotation.x=-Math.PI/2;glow.position.y=-0.55;
  craft.add(body,nose,canopy,finL,finR,glow);
}
craft.rotation.order='YXZ';
scene.add(craft);

/* ---------- rival cars ---------- */
const CAR_COLORS=[0xff5a3c,0x3cff8e,0xffd23c,0x9a5cff,0x3cd0ff];
let cars=[],hazRng,nextHazDist;
function spawnCar(dist){
  const g=new THREE.Group();
  const col=CAR_COLORS[Math.floor(hazRng()*CAR_COLORS.length)];
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.1,4.4),new THREE.MeshBasicMaterial({color:col}));
  body.position.y=0.85;
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.7,2.2),new THREE.MeshBasicMaterial({color:0x101020}));
  top.position.set(0,1.7,-0.2);
  const tl=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.28,0.15),new THREE.MeshBasicMaterial({color:0xff2222}));
  tl.position.set(0,0.9,-2.25);
  const tl2=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.15),new THREE.MeshBasicMaterial({color:0xff5555}));
  tl2.position.set(-0.8,1.3,-2.25);
  const tl3=tl2.clone();tl3.position.x=0.8;
  g.add(body,top,tl,tl2,tl3);
  scene.add(g);
  cars.push({g,dist,lat:(hazRng()*2-1)*3.4,speed:16+hazRng()*14,prevDs:1e9});
}
function clearCars(){for(const c of cars)scene.remove(c.g);cars=[];}

/* ---------- particles ---------- */
function makeDotTexture(){
  const cv=document.createElement('canvas');cv.width=64;cv.height=64;
  const g=cv.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.4,'rgba(255,255,255,0.8)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}
const DOT_TEX=makeDotTexture();
function makePoints(n,size,color){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(n*3),3));
  const mat=new THREE.PointsMaterial({size,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,map:DOT_TEX});
  const pts3=new THREE.Points(geo,mat);pts3.frustumCulled=false;scene.add(pts3);
  return {geo,pts:pts3,n};
}
const CRASH_N=260,crashP=makePoints(CRASH_N,0.5,0xffffff);
const crashVel=new Float32Array(CRASH_N*3),crashLife=new Float32Array(CRASH_N);
let crashActive=false;
function burstCrash(x,y,z){
  crashActive=true;
  for(let i=0;i<CRASH_N;i++){
    const a=Math.random()*Math.PI*2,e=Math.acos(2*Math.random()-1),v=6+Math.random()*22;
    crashP.geo.attributes.position.array[i*3]=x;
    crashP.geo.attributes.position.array[i*3+1]=y;
    crashP.geo.attributes.position.array[i*3+2]=z;
    crashVel[i*3]=Math.sin(e)*Math.cos(a)*v;
    crashVel[i*3+1]=Math.cos(e)*v+4;
    crashVel[i*3+2]=Math.sin(e)*Math.sin(a)*v;
    crashLife[i]=1+Math.random()*1.1;
  }
  crashP.geo.attributes.position.needsUpdate=true;
}
function updateCrashParticles(dt){
  if(!crashActive)return;
  let alive=false;
  const pa=crashP.geo.attributes.position.array,ca=crashP.geo.attributes.color.array;
  for(let i=0;i<CRASH_N;i++){
    if(crashLife[i]<=0){ca[i*3]=ca[i*3+1]=ca[i*3+2]=0;continue;}
    alive=true;crashLife[i]-=dt;
    crashVel[i*3+1]-=22*dt;
    pa[i*3]+=crashVel[i*3]*dt;pa[i*3+1]+=crashVel[i*3+1]*dt;pa[i*3+2]+=crashVel[i*3+2]*dt;
    const l=clamp(crashLife[i],0,1);
    ca[i*3]=l;ca[i*3+1]=l*(0.45+Math.random()*0.2);ca[i*3+2]=l*0.25;
  }
  crashP.geo.attributes.position.needsUpdate=true;
  crashP.geo.attributes.color.needsUpdate=true;
  if(!alive)crashActive=false;
}
const THRUST_N=110,thrustP=makePoints(THRUST_N,0.3,0xffffff);
const thrVel=new Float32Array(THRUST_N*3),thrLife=new Float32Array(THRUST_N);
let thrHead=0;
function emitThrust(x,y,z,fx,fz,speed){
  const n=1+Math.floor(speed/30);
  for(let k=0;k<n;k++){
    const i=thrHead;thrHead=(thrHead+1)%THRUST_N;
    const pa=thrustP.geo.attributes.position.array;
    pa[i*3]=x-fx*2.4+(Math.random()-0.5)*0.7;
    pa[i*3+1]=y-0.3+(Math.random()-0.5)*0.5;
    pa[i*3+2]=z-fz*2.4+(Math.random()-0.5)*0.7;
    thrVel[i*3]=-fx*(4+Math.random()*6);
    thrVel[i*3+1]=(Math.random()-0.5)*2;
    thrVel[i*3+2]=-fz*(4+Math.random()*6);
    thrLife[i]=0.22+Math.random()*0.1;
  }
}
function updateThrust(dt){
  const pa=thrustP.geo.attributes.position.array,ca=thrustP.geo.attributes.color.array;
  for(let i=0;i<THRUST_N;i++){
    if(thrLife[i]>0){
      thrLife[i]-=dt;
      pa[i*3]+=thrVel[i*3]*dt;pa[i*3+1]+=thrVel[i*3+1]*dt;pa[i*3+2]+=thrVel[i*3+2]*dt;
      const l=clamp(thrLife[i]/0.3,0,1);
      ca[i*3]=l*0.55;ca[i*3+1]=l*0.9;ca[i*3+2]=l;
    }else{ca[i*3]=ca[i*3+1]=ca[i*3+2]=0;}
  }
  thrustP.geo.attributes.position.needsUpdate=true;
  thrustP.geo.attributes.color.needsUpdate=true;
}

/* ---------- speed lines (boost) ---------- */
const LINE_N=48;
const lineGeo=new THREE.BufferGeometry();
lineGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(LINE_N*6),3));
const lines=new THREE.LineSegments(lineGeo,new THREE.LineBasicMaterial({color:0x9ff2ff,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false}));
lines.frustumCulled=false;scene.add(lines);
const lineData=new Float32Array(LINE_N*4); // x,y,z,life
let lineHead=0;
function updateSpeedLines(dt,boosting){
  const pa=lineGeo.attributes.position.array;
  if(boosting&&Math.random()<0.8){
    const i=lineHead;lineHead=(lineHead+1)%LINE_N;
    const a=Math.random()*Math.PI*2,r=6+Math.random()*16;
    lineData[i*4]=camera.position.x+Math.cos(a)*r;
    lineData[i*4+1]=camera.position.y+Math.sin(a)*r*0.6;
    lineData[i*4+2]=camera.position.z+Math.sin(a*1.7)*r+40;
    lineData[i*4+3]=0.5;
  }
  const fx=Math.sin(smoothYaw),fz=Math.cos(smoothYaw);
  for(let i=0;i<LINE_N;i++){
    if(lineData[i*4+3]>0){
      lineData[i*4+3]-=dt;
      lineData[i*4]-=fx*160*dt;lineData[i*4+2]-=fz*160*dt;
      const x=lineData[i*4],y=lineData[i*4+1],z=lineData[i*4+2],len=14;
      pa[i*6]=x;pa[i*6+1]=y;pa[i*6+2]=z;
      pa[i*6+3]=x-fx*len;pa[i*6+4]=y;pa[i*6+5]=z-fz*len;
    }else{pa[i*6]=pa[i*6+1]=pa[i*6+2]=pa[i*6+3]=pa[i*6+4]=pa[i*6+5]=0;}
  }
  lineGeo.attributes.position.needsUpdate=true;
}

/* ---------- audio ---------- */
let AC=null,master,engGain,engO1,engO2,engFilt,noiseBuf,muted=false;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
    engO1=AC.createOscillator();engO1.type='sawtooth';
    engO2=AC.createOscillator();engO2.type='square';
    engFilt=AC.createBiquadFilter();engFilt.type='lowpass';engFilt.frequency.value=500;
    engGain=AC.createGain();engGain.gain.value=0;
    engO1.connect(engFilt);engO2.connect(engFilt);engFilt.connect(engGain);engGain.connect(master);
    engO1.start();engO2.start();
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const nd=noiseBuf.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    nextNoteTime=AC.currentTime+0.1;
    setInterval(scheduleMusic,40);
  }catch(e){AC=null;}
}
function noiseSrc(){const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;return s;}
function whoosh(){
  if(!AC||muted)return;
  const s=noiseSrc(),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='bandpass';f.Q.value=1.4;
  const t=AC.currentTime;
  f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3200,t+0.3);
  g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.06);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+0.45);
}
function explode(){
  if(!AC||muted)return;
  const t=AC.currentTime;
  const s=noiseSrc(),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='lowpass';
  f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(70,t+1.1);
  g.gain.setValueAtTime(0.7,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.2);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+1.25);
  const o=AC.createOscillator(),og=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(28,t+0.8);
  og.gain.setValueAtTime(0.5,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.9);
  o.connect(og);og.connect(master);o.start(t);o.stop(t+0.95);
}
let nextNoteTime=0,musicStep=0;
const BASS_ROOTS=[110,87.31,130.81,98];
const ARP_SEMI=[0,7,12,15,12,7,12,3];
function scheduleMusic(){
  if(!AC||muted){nextNoteTime=AC?AC.currentTime+0.1:0;return;}
  while(nextNoteTime<AC.currentTime+0.2){
    const t=nextNoteTime,bar=Math.floor(musicStep/16)%4,root=BASS_ROOTS[bar];
    if(musicStep%8===0){
      const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
      o.type='square';o.frequency.value=root*0.5;
      f.type='lowpass';f.frequency.value=300;
      g.gain.setValueAtTime(0.16,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
      o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+0.3);
    }
    {
      const semi=ARP_SEMI[musicStep%8];
      const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
      o.type='sawtooth';o.frequency.value=root*2*Math.pow(2,semi/12);
      f.type='lowpass';f.frequency.value=1800;
      g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
      o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+0.16);
    }
    if(musicStep%16===4||musicStep%16===12){
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(48,t+0.12);
      g.gain.setValueAtTime(0.35,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+0.18);
    }
    nextNoteTime+=0.115;musicStep=(musicStep+1)%64;
  }
}
function updateEngineAudio(speed,boosting,alive){
  if(!AC)return;
  const t=AC.currentTime;
  const f=48+speed*2.1+(boosting?26:0);
  engO1.frequency.setTargetAtTime(f,t,0.08);
  engO2.frequency.setTargetAtTime(f*0.5,t,0.08);
  engFilt.frequency.setTargetAtTime(300+speed*9,t,0.1);
  engGain.gain.setTargetAtTime(alive?(0.05+speed/1400+(boosting?0.03:0)):0,t,0.15);
}

/* ---------- game state ---------- */
let state='title';
let dist=0,speed=0,px=0,latV=0,steer=0,heat=0,boosting=false,cooling=false;
let elapsed=0,score=0,best=0,timeScale=1,shake=0,smoothYaw=0,bank=0;
let camDist=11,camPos=new THREE.Vector3(0,5,-12);
const keys={};
const titleEl=document.getElementById('title'),crashEl=document.getElementById('crash');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const speedEl=document.getElementById('speed'),boostFill=document.getElementById('boostfill');
const popupsEl=document.getElementById('popups'),flashEl=document.getElementById('flash');

function resetRun(){
  resetTrack();clearCars();
  hazRng=mulberry32(777);nextHazDist=260;
  dist=0;speed=0;px=0;latV=0;steer=0;heat=0;boosting=false;cooling=false;
  elapsed=0;score=0;timeScale=1;shake=0;bank=0;crashActive=false;
  for(let i=0;i<THRUST_N;i++)thrLife[i]=0;
  for(let i=0;i<LINE_N;i++)lineData[i*4+3]=0;
  const p=trackAt(0);smoothYaw=p.yaw;
  camPos.set(p.x,p.y+5,p.z-12);
  craft.visible=true;
  titleEl.style.display='none';crashEl.style.display='none';
  state='playing';
}
function popup(txt){
  const d=document.createElement('div');
  d.className='pop';d.textContent=txt;
  d.style.left=(42+Math.random()*14)+'%';
  popupsEl.appendChild(d);
  setTimeout(()=>d.remove(),1150);
}
function crash(){
  if(state!=='playing')return;
  state='crashed';
  const p=trackAt(dist);
  burstCrash(p.x+Math.cos(p.yaw)*px,p.y+1,p.z-Math.sin(p.yaw)*px);
  craft.visible=false;
  explode();
  shake=1.4;
  if(score>best)best=score;
  bestEl.textContent='BEST '+Math.floor(best);
  crashEl.style.display='flex';
}
function nearMiss(){
  score+=50;
  timeScale=0.35;shake=Math.max(shake,0.35);
  flashEl.style.transition='none';flashEl.style.opacity='0.5';
  requestAnimationFrame(()=>{flashEl.style.transition='opacity .45s';flashEl.style.opacity='0';});
  popup('+50 NEAR MISS');
  whoosh();
}

/* ---------- input ---------- */
window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==='m'){muted=!muted;if(master)master.gain.value=muted?0:0.5;return;}
  if(state==='title'){initAudio();if(AC&&AC.state==='suspended')AC.resume();resetRun();return;}
  if(state==='crashed'&&(e.key==='r'||e.key==='R')){resetRun();}
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
window.addEventListener('pointerdown',()=>{
  if(state==='title'){initAudio();if(AC&&AC.state==='suspended')AC.resume();resetRun();}
});

/* ---------- main loop ---------- */
const clock=new THREE.Clock();
function frame(){
  const raw=Math.min(clock.getDelta(),0.05);
  timeScale+=(1-timeScale)*Math.min(1,3.2*raw);
  const dt=raw*timeScale;

  if(state==='playing'){
    elapsed+=dt;
    const top=52+Math.min(45,elapsed*0.9);
    const wantBoost=(keys[' ']||keys['shift'])&&!cooling&&heat<0.999;
    boosting=wantBoost;
    if(boosting){heat+=dt*0.42;if(heat>=1){heat=1;cooling=true;}}
    else if(heat>0){heat-=dt*0.34;if(heat<=0.25)cooling=false;if(heat<0)heat=0;}
    const vmax=boosting?top*1.35:top;
    speed+=(vmax-speed)*(boosting?1.1:0.42)*dt;
    dist+=speed*dt;

    const inL=keys['arrowleft']||keys['a'],inR=keys['arrowright']||keys['d'];
    const target=(inR?1:0)-(inL?1:0);
    steer+=(target-steer)*Math.min(1,10*dt);
    const steerRate=13.5*(1.25-0.45*(speed/97));
    px+=steer*steerRate*dt;

    const pSeg=Math.floor(dist/SEG);
    const curvHere=(function(){const k=pSeg-curvBase;return(k>=0&&k<curv.length)?curv[k]:0;})();
    latV-=curvHere*speed*speed*dt*0.28;
    latV*=Math.exp(-1.8*dt);
    px+=latV*dt;
    if(Math.abs(px)>ROAD_HALF-0.8){
      px=clamp(px,-(ROAD_HALF-0.8),ROAD_HALF-0.8);
      latV=0;speed=Math.max(speed*(1-0.45*dt),28);
      shake=Math.max(shake,0.22);
    }
    score+=speed*dt*0.12;

    trimTrack(pSeg);
    const startSeg=Math.max(base,pSeg-6);

    // hazards
    while(nextHazDist<dist+650){spawnCar(nextHazDist);nextHazDist+=70+hazRng()*95;}
    for(let i=cars.length-1;i>=0;i--){
      const c=cars[i];
      c.dist+=c.speed*dt;
      if(c.dist<dist-140){scene.remove(c.g);cars.splice(i,1);continue;}
      const ds=c.dist-dist,dx=Math.abs(c.lat-px);
      if(state==='playing'){
        if(Math.abs(ds)<2.6&&dx<2.35){crash();}
        else if(c.prevDs>0&&ds<=0&&dx>=2.35&&dx<4.3){nearMiss();}
      }
      c.prevDs=ds;
      const cp=trackAt(c.dist);
      c.g.position.set(cp.x+Math.cos(cp.yaw)*c.lat,cp.y+0.15,cp.z-Math.sin(cp.yaw)*c.lat);
      c.g.rotation.y=cp.yaw;
    }

    // craft pose
    const p=trackAt(dist);
    smoothYaw+=(p.yaw-smoothYaw)*Math.min(1,6*dt);
    const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw);
    const bobY=p.y+1.15+Math.sin(elapsed*2.6)*0.18;
    craft.position.set(p.x+Math.cos(p.yaw)*px,bobY,p.z-Math.sin(p.yaw)*px);
    const slopeHere=(function(){const k=pSeg-curvBase;return(k>=0&&k<slope.length)?slope[k]:0;})();
    craft.rotation.y=p.yaw+steer*0.12;
    craft.rotation.x=-Math.asin(clamp(slopeHere,-0.2,0.2));
    const bankTarget=steer*0.34+curvHere*speed*0.016;
    bank+=(bankTarget-bank)*Math.min(1,5*dt);
    craft.rotation.z=bank;
    emitThrust(craft.position.x,craft.position.y,craft.position.z,fx,fz,speed);
    updateEngineAudio(speed,boosting,true);
  }else if(state==='crashed'){
    camDist+=(16-camDist)*Math.min(1,2*dt);
    updateEngineAudio(0,false,false);
  }else{
    // title: slow drift along track for a live backdrop
    dist+=14*raw;
    const p=trackAt(dist);
    smoothYaw+=(p.yaw-smoothYaw)*Math.min(1,2*raw);
    craft.position.set(p.x,bobIdle(p.y),p.z);
    craft.rotation.y=p.yaw;
    emitThrust(p.x,p.y+1,p.z,Math.sin(p.yaw),Math.cos(p.yaw),20);
  }
  function bobIdle(y){return y+1.15+Math.sin(performance.now()*0.0026)*0.18;}

  // world updates
  const pSeg2=Math.max(0,Math.floor(dist/SEG));
  const startSeg2=Math.max(base,pSeg2-6);
  updateRoad(startSeg2);
  updateArches(startSeg2);
  updatePalms(startSeg2);
  updateCrashParticles(raw);
  updateThrust(raw);
  updateSpeedLines(raw,boosting&&state==='playing');

  // environment follows camera
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  horizon.position.set(camera.position.x,camera.position.y,camera.position.z);
  horizon.rotation.y=smoothYaw;
  ground.position.x=camera.position.x;ground.position.z=camera.position.z;

  // camera
  const p=trackAt(dist);
  const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw);
  const cd=state==='crashed'?camDist:11;
  const tx=p.x-fx*cd+Math.cos(p.yaw)*px*0.35;
  const tz=p.z-fz*cd-Math.sin(p.yaw)*px*0.35;
  const ty=p.y+4.6;
  camPos.lerp(new THREE.Vector3(tx,ty,tz),1-Math.exp(-5.5*raw));
  shake*=Math.exp(-3.5*raw);
  if(shake>0.003){
    camPos.x+=(Math.random()-0.5)*shake*0.9;
    camPos.y+=(Math.random()-0.5)*shake*0.9;
    camPos.z+=(Math.random()-0.5)*shake*0.9;
  }
  camera.position.copy(camPos);
  const lookX=p.x+fx*18+Math.cos(p.yaw)*px,lookZ=p.z+fz*18-Math.sin(p.yaw)*px;
  camera.lookAt(lookX,p.y+1.6,lookZ);
  const fovT=68+(boosting&&state==='playing'?14:0)+Math.min(8,speed/12);
  camera.fov+=(fovT-camera.fov)*Math.min(1,4*raw);
  camera.updateProjectionMatrix();

  // fog colour shift on boost
  const fc=scene.fog.color;
  fc.lerp(boosting&&state==='playing'?FOG_B:FOG_A,Math.min(1,2.5*raw));

  // HUD
  speedEl.innerHTML=Math.round(speed*3.1)+'<small> KM/H</small>';
  scoreEl.textContent=Math.floor(score);
  boostFill.style.width=Math.round(heat*100)+'%';
  boostFill.classList.toggle('hot',cooling||heat>0.75);

  renderer.render(scene,camera);
}
renderer.setAnimationLoop(frame);

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
});
</script>
